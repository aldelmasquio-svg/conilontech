<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conilon Tech · Planejamento de Safra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--v:#2d6a2d;--ve:#1a3d1a;--vb:#e8f5e8;--c:#6b7280;--cb:#d1d5db;--cl:#f3f4f6;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--blue:#3b82f6;--purple:#8b5cf6;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:#f0f4f0;color:var(--t);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}

.loading-screen{position:fixed;inset:0;background:#f0f4f0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--v);font-size:1.1rem;letter-spacing:.04em;}

/* HEADER */
.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-titles{line-height:1;}
.header-title-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;}
.header-title-sub{font-size:.65rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.header-user{font-size:.78rem;color:rgba(255,255,255,.85);}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* MENU LATERAL */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-header{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-user-nome{color:white;font-weight:700;font-size:.95rem;}
.menu-user-email{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:2px;}
.menu-body{flex:1;padding:10px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:1.1rem;}
.menu-footer{padding:14px;}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

.app-main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}

/* TABS */
.tabs-top{display:flex;background:white;border-bottom:2px solid var(--cb);flex-shrink:0;}
.tab-top{flex:1;padding:13px 8px;border:none;background:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-top.ativa{color:var(--v);border-bottom-color:var(--v);}

/* CONTEÚDO ROLÁVEL — usa block layout para não colapsar conteúdo */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:12px 14px 200px;}
.content > *{margin-bottom:10px;}
.content > *:last-child{margin-bottom:0;}
.content::-webkit-scrollbar{width:8px;}
.content::-webkit-scrollbar-thumb{background:var(--cb);border-radius:4px;}
.content::-webkit-scrollbar-track{background:transparent;}

/* CARDS DOS PASSOS */
.card-passo{display:block;width:100%;background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;}
.card-passo-head{padding:12px 14px;background:linear-gradient(135deg,var(--vb),#fafafa);border-bottom:2px solid var(--v);}
.card-passo-num{display:inline-block;background:var(--v);color:white;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;margin-right:7px;}
.card-passo-tit{display:inline;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;color:var(--ve);}
.card-passo-sub{font-size:.7rem;color:var(--c);margin-top:3px;margin-left:31px;line-height:1.4;}
.card-passo-body{padding:14px;display:block;}

/* CAMPOS DE INPUT */
.campo-row{margin-bottom:11px;}
.campo-row:last-child{margin-bottom:0;}
.campo-row label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;text-transform:uppercase;color:var(--c);letter-spacing:.04em;margin-bottom:4px;}
.campo-row select,.campo-row input[type="text"]{width:100%;border:1.5px solid var(--cb);border-radius:7px;padding:9px 11px;font-size:.92rem;font-family:'Barlow',sans-serif;outline:none;background:white;color:var(--ve);font-weight:600;}
.campo-row select:focus,.campo-row input:focus{border-color:var(--v);box-shadow:0 0 0 3px var(--vb);}

.campo-row-2{display:flex;gap:9px;margin-bottom:11px;}
.campo-row-2 > div{flex:1;min-width:0;}

.area-info{background:#f0f9ff;border:1px solid #93c5fd;border-radius:7px;padding:8px 11px;font-size:.8rem;color:#1e40af;display:flex;align-items:center;gap:7px;margin-top:7px;}

/* CARD DE RECOMENDAÇÃO PRA IMPORTAR */
.rec-import-card{background:linear-gradient(135deg,#fef3c7,#fffbeb);border:1px solid #fcd34d;border-radius:8px;padding:11px;margin-top:10px;}
.rec-import-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.92rem;color:#78350f;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.rec-import-meta{font-size:.72rem;color:#92400e;line-height:1.4;}
.rec-import-doses{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.rec-import-dose{font-family:'DM Mono',monospace;font-size:.7rem;background:white;color:#78350f;padding:2px 8px;border-radius:99px;font-weight:700;border:1px solid #fcd34d;}
.rec-import-btn{width:100%;background:#f59e0b;color:white;border:none;border-radius:7px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.86rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;margin-top:9px;}
.rec-import-btn:active{transform:scale(.97);}
.rec-import-vazio{font-size:.78rem;color:var(--c);font-style:italic;padding:9px 0;text-align:center;}

/* GRID DE NUTRIENTES (demanda) */
.dem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;}
.dem-grid-grupo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.74rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;margin:7px 0 5px;grid-column:1/-1;display:flex;align-items:center;gap:6px;}
.dem-grid-grupo::after{content:'';flex:1;height:1px;background:var(--cl);}
.dem-item{background:#fafafa;border:1.5px solid var(--cb);border-radius:7px;padding:7px 9px;transition:all .2s;}
.dem-item:focus-within{border-color:var(--v);background:white;box-shadow:0 0 0 3px var(--vb);}
.dem-item-lab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;color:var(--ve);letter-spacing:.02em;}
.dem-item-inp{width:100%;border:none;background:transparent;outline:none;font-family:'DM Mono',monospace;font-weight:800;font-size:1.1rem;color:var(--ve);text-align:right;padding:0;margin-top:2px;}
.dem-item-un{font-size:.62rem;color:var(--c);text-align:right;font-family:'DM Mono',monospace;margin-top:-2px;}
.dem-item.importado{border-color:#f59e0b;background:#fffbeb;}

/* RODAPÉ FIXO */
.plan-rodape{background:white;border-top:2px solid var(--v);padding:9px 12px;flex-shrink:0;display:flex;gap:7px;box-shadow:0 -3px 10px rgba(0,0,0,.08);}
.plan-rodape button{flex:1;border:none;border-radius:7px;padding:11px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;letter-spacing:.03em;text-transform:uppercase;min-height:42px;}
.btn-salvar-rasc{background:var(--v);color:white;}
.btn-salvar-rasc:active{transform:scale(.97);}
.btn-cancelar{background:none;color:var(--c);border:1.5px solid var(--cb) !important;flex:0 0 auto !important;padding:11px 16px !important;}
.btn-aprovar{background:var(--blue);color:white;}
.btn-aprovar:disabled{background:var(--cl);color:var(--c);cursor:not-allowed;}

/* LISTA DE PLANEJAMENTOS SALVOS */
.plan-card{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:11px 13px;border-left:4px solid var(--v);}
.plan-card-status-rascunho{border-left-color:var(--c);}
.plan-card-status-aprovado{border-left-color:var(--blue);}
.plan-card-status-aplicado{border-left-color:var(--ok);}
.plan-card-status-cancelado{border-left-color:var(--danger);opacity:.7;}
.plan-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.plan-card-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.98rem;color:var(--ve);}
.plan-card-meta{font-size:.72rem;color:var(--c);margin-top:2px;line-height:1.4;}
.plan-status-badge{font-size:.62rem;padding:2px 9px;border-radius:99px;color:white;font-weight:700;letter-spacing:.02em;text-transform:uppercase;flex-shrink:0;}
.plan-status-rascunho{background:var(--c);}
.plan-status-aprovado{background:var(--blue);}
.plan-status-aplicado{background:var(--ok);}
.plan-status-cancelado{background:var(--danger);}
.plan-card-acoes{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
.btn-acao{background:none;border:1.5px solid var(--cb);border-radius:6px;padding:6px 10px;font-size:.72rem;color:var(--c);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.btn-acao.primary{background:var(--v);border-color:var(--v);color:white;}
.btn-acao.danger{border-color:#fca5a5;color:var(--danger);}

/* ALERTAS */
.alerta-info{background:#dbeafe;border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:7px;padding:8px 11px;font-size:.78rem;color:#1e40af;line-height:1.45;}
.alerta-warn{background:#fef3c7;border:1px solid #fde68a;border-left:4px solid var(--warn);border-radius:7px;padding:8px 11px;font-size:.78rem;color:#92400e;line-height:1.45;}

/* VAZIO */
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;color:var(--c);}
.vazio .ico{font-size:3.5rem;margin-bottom:10px;opacity:.4;}
.vazio p{font-size:.92rem;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ve);color:white;padding:11px 18px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

/* INDICADOR DE PRÓXIMA FASE */
.next-phase{background:linear-gradient(135deg,#fef3c7,#fffbeb);border:1px dashed #fcd34d;border-radius:10px;padding:13px 14px;text-align:center;color:#78350f;}
.next-phase-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;margin-bottom:5px;}
.next-phase-sub{font-size:.78rem;line-height:1.5;}

/* CARD 3 — DISTRIBUIÇÃO MENSAL */
.meses-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.meses-toolbar-info{font-size:.74rem;color:var(--c);}
.btn-add-mes{background:var(--v);color:white;border:none;border-radius:7px;padding:8px 13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:5px;min-height:36px;}
.btn-add-mes:active{transform:scale(.97);}

/* TABELA DE DISTRIBUIÇÃO */
.dist-wrap{background:#fafafa;border-radius:8px;padding:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.dist-tbl{width:100%;border-collapse:separate;border-spacing:3px;font-size:.78rem;min-width:480px;}
.dist-tbl th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;color:var(--ve);background:white;padding:6px 4px;border-radius:6px;text-align:center;text-transform:uppercase;letter-spacing:.03em;}
.dist-tbl th.mes-col{text-align:left;padding-left:9px;background:var(--vb);min-width:88px;}
.dist-tbl td{background:white;padding:0;border-radius:6px;}
.dist-tbl td.mes-col{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--ve);padding:8px 9px;background:var(--vb);text-align:left;min-width:88px;position:relative;}
.dist-tbl td.tot-row{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--ve);background:#fffbeb !important;border:1px solid #fcd34d;padding:6px 4px;text-align:center;font-size:.85rem;}
.dist-tbl td.tot-row.ok{background:#dcfce7 !important;border-color:var(--ok);color:#15803d;}
.dist-tbl td.tot-row.warn{background:#fffbeb !important;border-color:var(--warn);color:#92400e;}
.dist-tbl td.tot-row.err{background:#fee2e2 !important;border-color:var(--danger);color:#991b1b;}
.dist-tbl td.tot-row-lab{background:transparent !important;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--c);text-align:right;padding-right:9px;text-transform:uppercase;font-size:.72rem;letter-spacing:.04em;}
.dist-inp{width:100%;border:1.5px solid transparent;background:transparent;outline:none;font-family:'DM Mono',monospace;font-weight:700;font-size:.86rem;text-align:center;padding:7px 2px;color:var(--ve);border-radius:5px;}
.dist-inp:focus{border-color:var(--v);background:white;box-shadow:0 0 0 2px var(--vb);}
.dist-inp::placeholder{color:#d1d5db;font-weight:400;}
.btn-rm-mes{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.06);border:none;color:var(--c);width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.btn-rm-mes:hover{background:#fee2e2;color:var(--danger);}

/* MODAL: SELECIONAR MÊS */
.overlay-mes{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding-top:60px;}
.overlay-mes.aberto{display:flex;}
.modal-mes{background:white;border-radius:14px;width:92%;max-width:380px;display:flex;flex-direction:column;box-shadow:var(--sf);overflow:hidden;max-height:80vh;}
.modal-mes-head{padding:13px 15px;background:var(--ve);color:white;display:flex;justify-content:space-between;align-items:center;}
.modal-mes-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;}
.modal-mes-fechar{background:rgba(255,255,255,.12);border:none;color:white;font-size:1rem;width:30px;height:30px;border-radius:6px;cursor:pointer;}
.modal-mes-body{padding:13px;overflow-y:auto;flex:1;}
.modal-mes-templates{display:flex;flex-direction:column;gap:7px;margin-bottom:13px;}
.tpl-btn{background:var(--vb);border:1.5px solid var(--v);color:var(--ve);border-radius:7px;padding:10px 12px;text-align:left;cursor:pointer;font-family:'Barlow',sans-serif;}
.tpl-btn:hover{background:var(--v);color:white;}
.tpl-btn-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.88rem;margin-bottom:2px;}
.tpl-btn-sub{font-size:.7rem;opacity:.85;}
.modal-mes-divisor{display:flex;align-items:center;gap:9px;margin:10px 0;color:var(--c);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-family:'Barlow Condensed',sans-serif;}
.modal-mes-divisor::before,.modal-mes-divisor::after{content:'';flex:1;height:1px;background:var(--cb);}
.meses-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mes-opt{background:#fafafa;border:1.5px solid var(--cb);border-radius:7px;padding:9px 4px;text-align:center;cursor:pointer;font-family:'Barlow',sans-serif;font-size:.74rem;color:var(--ve);font-weight:600;}
.mes-opt:hover{border-color:var(--v);background:var(--vb);}
.mes-opt.ja-usado{opacity:.35;cursor:not-allowed;}
.mes-opt.selecionado{background:var(--v);border-color:var(--v);color:#fff;}
.mes-opt.selecionado .mes-opt-ano{color:rgba(255,255,255,.8);}
.btn-add-selecionados{width:100%;margin-top:10px;padding:12px;background:var(--v);color:#fff;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.03em;cursor:pointer;transition:opacity .15s;}
.btn-add-selecionados:disabled{opacity:.35;cursor:not-allowed;}
.mes-opt-nome{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;}
.mes-opt-ano{font-size:.62rem;color:var(--c);margin-top:2px;}
.ano-selector{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:9px;}
.ano-selector button{background:var(--vb);border:1px solid var(--v);color:var(--ve);width:30px;height:30px;border-radius:6px;cursor:pointer;font-weight:800;font-size:1rem;}
.ano-selector .ano-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;color:var(--ve);min-width:60px;text-align:center;}
.intervalo-sel{background:var(--cl);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px;}
.intervalo-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;}
.intervalo-grupo{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
.intervalo-grupo label{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c);font-weight:700;font-family:'Barlow Condensed',sans-serif;}
.intervalo-grupo select{border:1.5px solid var(--cb);border-radius:7px;padding:7px 8px;font-size:.85rem;font-family:'Barlow',sans-serif;outline:none;background:white;color:var(--ve);}
.intervalo-grupo select:focus{border-color:var(--v);}
.btn-add-intervalo{width:100%;background:var(--v);color:white;border:none;border-radius:7px;padding:9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;letter-spacing:.03em;}

/* CARD 4 — ADUBOS POR MÊS */
.mes-bloco{background:#fafafa;border:1.5px solid var(--cb);border-radius:9px;padding:11px;margin-bottom:11px;}
.mes-bloco-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.mes-bloco-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.98rem;color:var(--ve);}
.mes-bloco-meta{font-size:.72rem;color:var(--c);margin-top:2px;line-height:1.4;}
.mes-bloco-meta strong{color:var(--ve);}
.btn-add-adubo{background:var(--vb);border:1.5px solid var(--v);color:var(--ve);border-radius:7px;padding:7px 11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.76rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;min-height:34px;display:inline-flex;align-items:center;gap:5px;}
.btn-add-adubo:active{transform:scale(.97);}

.adubo-linha{background:white;border:1px solid var(--cl);border-radius:7px;padding:9px 11px;margin-top:7px;}
.adubo-linha-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.adubo-nome{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.88rem;color:var(--ve);flex:1;min-width:0;}
.adubo-formula{font-family:'DM Mono',monospace;font-size:.65rem;background:#dbeafe;color:#1e40af;padding:1px 7px;border-radius:99px;font-weight:700;border:1px solid #93c5fd;display:inline-block;margin-left:5px;}
.adubo-btns{display:flex;gap:4px;}
.btn-trava{background:none;border:1px solid var(--cb);width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:.85rem;color:var(--c);display:flex;align-items:center;justify-content:center;padding:0;}
.btn-trava.travado{background:#fef3c7;border-color:var(--warn);color:#92400e;}
.btn-rm-adubo{background:none;border:1px solid var(--cb);width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:.75rem;color:var(--c);display:flex;align-items:center;justify-content:center;padding:0;}
.btn-rm-adubo:hover{border-color:var(--danger);color:var(--danger);}

.adubo-dose-row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
.adubo-dose-inp{font-family:'DM Mono',monospace;font-weight:800;font-size:1.05rem;color:var(--ve);text-align:right;border:1.5px solid var(--cb);border-radius:6px;padding:6px 9px;width:100px;outline:none;}
.adubo-dose-inp:focus{border-color:var(--v);background:white;box-shadow:0 0 0 3px var(--vb);}
.adubo-dose-inp.travada{border-color:var(--warn);background:#fffbeb;}
.adubo-dose-un{font-size:.74rem;color:var(--c);}
.btn-un{background:var(--cl);border:1.5px solid var(--cb);border-radius:5px;padding:3px 7px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.74rem;color:var(--c);white-space:nowrap;transition:background .12s;}
.btn-un:active{background:var(--cb);}
.adubo-entrega{font-size:.7rem;color:var(--c);flex:1;font-family:'DM Mono',monospace;line-height:1.3;}
.adubo-entrega strong{color:var(--ve);}

.adubo-vazio{text-align:center;padding:18px 8px;color:var(--c);font-size:.78rem;background:white;border:1px dashed var(--cb);border-radius:7px;margin-top:7px;}

/* RESUMO POR MÊS (entregue vs meta) */
.mes-resumo{margin-top:9px;background:white;border-radius:7px;padding:8px 10px;border:1px solid var(--cl);}
.mes-resumo-tit{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;color:var(--c);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}

.mes-resumo-chip.ok{background:#dcfce7;color:#15803d;border-color:#86efac;}
.mes-resumo-chip.warn{background:#fef3c7;color:#92400e;border-color:#fcd34d;}
.mes-resumo-chip.err{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.mes-resumo-chip.zero{background:#fafafa;color:var(--c);border-color:var(--cb);}

/* MODAL SELECIONAR ADUBO */
.overlay-adubo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:flex-start;justify-content:center;padding-top:40px;}

.adubo-busca{width:100%;border:1.5px solid var(--cb);border-radius:7px;padding:9px 11px;font-size:.9rem;font-family:'Barlow',sans-serif;outline:none;margin-bottom:10px;}
.adubo-opt{background:#fafafa;border:1px solid var(--cl);border-radius:7px;padding:9px 11px;margin-bottom:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}

.adubo-opt-saldo{font-size:.7rem;color:var(--c);font-family:'DM Mono',monospace;flex-shrink:0;text-align:right;}

/* APROVAÇÃO */

/* OBSERVAÇÕES */

.obs-textarea:focus{border-color:var(--v);box-shadow:0 0 0 3px var(--vb);}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",authDomain:"talhoes-df836.firebaseapp.com",projectId:"talhoes-df836",storageBucket:"talhoes-df836.firebasestorage.app",messagingSenderId:"1047022702039",appId:"1:1047022702039:web:001cf6a3c028c494ab8f92"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ESTADO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let usuarioAtual=null, perfilAtual={};
let talhoes=[], recomendacoes=[], planejamentos=[], produtosEstoque=[], catalogoAdubos=[];
let tabAtual='novo';
let _renderPendente = false;

// Impede Backspace de navegar para a página anterior quando foco não está num campo
document.addEventListener('keydown', function(e) {
  if (e.key === 'Backspace') {
    const el = document.activeElement;
    if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA' && !el.isContentEditable)) {
      e.preventDefault();
    }
  }
}, true);

history.pushState(null, '', location.href);
window.addEventListener('popstate', function() {
  history.pushState(null, '', location.href);
  _mostrarConfirmacaoSaida();
});
function _mostrarConfirmacaoSaida() {
  let m = document.getElementById('_modalSaida');
  if (!m) {
    m = document.createElement('div');
    m.id = '_modalSaida';
    m.innerHTML = '<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)window._fecharConfirmacaoSaida()"><div style="background:#fff;border-radius:14px;padding:28px 22px 22px;max-width:300px;width:88%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)"><div style="font-size:2.2rem;margin-bottom:6px">⚠️</div><div style="font-weight:700;font-size:1.05rem;margin-bottom:8px;color:#1a1a1a">Sair da página?</div><div style="color:#666;font-size:.88rem;margin-bottom:22px;line-height:1.4">Dados não salvos podem ser perdidos.</div><div style="display:flex;gap:10px;justify-content:center"><button onclick="window._fecharConfirmacaoSaida()" style="flex:1;padding:10px 0;border:1.5px solid #ddd;border-radius:8px;background:#f5f5f5;font-size:.95rem;cursor:pointer;font-weight:600;color:#444">Cancelar</button><button onclick="window._confirmarSaida()" style="flex:1;padding:10px 0;border:none;border-radius:8px;background:#e53935;font-size:.95rem;cursor:pointer;font-weight:600;color:#fff">Sair</button></div></div></div>';
    document.body.appendChild(m);
  }
  m.style.display = 'block';
}
window._fecharConfirmacaoSaida = function() {
  const m = document.getElementById('_modalSaida');
  if (m) m.style.display = 'none';
}
window._confirmarSaida = function() { history.go(-2); }

// Retorna true se o usuário está com o cursor dentro de um campo do conteúdo principal
function _usuarioEmCampo() {
  const el = document.activeElement;
  if (!el) return false;
  return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable;
}

// Re-renderiza se o usuário não estiver digitando; senão agenda para o próximo blur
function renderNovoSeguro() {
  if (_usuarioEmCampo()) {
    _renderPendente = true;
    return;
  }
  _renderPendente = false;
  renderNovo();
}

// Working state do plano sendo criado/editado
window.planWIP = {
  talhaoId: '',
  safra: '',
  area: null,
  recomendacaoOrigemId: null,
  demanda: {n:null, p2o5:null, k2o:null, s:null, ca:null, mg:null, zn:null, b:null, cu:null, mn:null},
  meses: [],       // C.2: array de {mes, distribuicao, adubos}
  observacoes: '',
  status: 'rascunho'
};
window.editandoPlanId = null;

// Nutrientes em ordem
const NUTRIENTES = [
  {id:'n',    lab:'N',      un:'kg/ha', grupo:'macro'},
  {id:'p2o5', lab:'P₂O₅',   un:'kg/ha', grupo:'macro'},
  {id:'k2o',  lab:'K₂O',    un:'kg/ha', grupo:'macro'},
  {id:'s',    lab:'S',      un:'kg/ha', grupo:'secundario'},
  {id:'ca',   lab:'Ca',     un:'kg/ha', grupo:'secundario'},
  {id:'mg',   lab:'Mg',     un:'kg/ha', grupo:'secundario'},
  {id:'zn',   lab:'Zn',     un:'kg/ha', grupo:'micro'},
  {id:'b',    lab:'B',      un:'kg/ha', grupo:'micro'},
  {id:'cu',   lab:'Cu',     un:'kg/ha', grupo:'micro'},
  {id:'mn',   lab:'Mn',     un:'kg/ha', grupo:'micro'}
];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BOOTSTRAP
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil === 'admin') {
    perfilAtual.modulos = {mapa:'admin',atividades:'admin',adubacao:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin',estoque:'admin',gestao:'admin',analises:'admin',recomendacoes:'admin',planejamento:'admin'};
  }
  if (!temAcesso()) {
    document.getElementById('loadingScreen').innerHTML = '<div style="text-align:center;padding:30px;"><div style="font-size:3rem;">⛔</div><div style="font-family:Barlow Condensed,sans-serif;font-weight:700;font-size:1.1rem;color:var(--c);margin-top:10px;">Sem permissão</div><a href="index.html" style="display:inline-block;margin-top:14px;color:var(--v);">← Voltar</a></div>';
    return;
  }
  document.getElementById('userNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('appContent').style.display = 'flex';
  abrirTab('novo');
  gerarMenu();
  // Safra default: ano corrente / próximo (Conilon florada outubro)
  const hoje = new Date();
  const ano = hoje.getMonth() >= 6 ? hoje.getFullYear() : hoje.getFullYear() - 1;
  window.planWIP.safra = `${ano}/${ano+1}`;
  // Quando o usuário sai de qualquer campo, verifica se há um render pendente
  document.getElementById('content').addEventListener('focusout', () => {
    if (_renderPendente && tabAtual === 'novo') renderNovoSeguro();
  });
  // Listeners — usam renderNovoSeguro para não destruir campos ativos
  onSnapshot(collection(db,'talhoes'), snap => {
    talhoes = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    if (tabAtual === 'novo') renderNovoSeguro();
  });
  onSnapshot(collection(db,'recomendacoes'), snap => {
    recomendacoes = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    if (tabAtual === 'novo') renderNovoSeguro();
  });
  onSnapshot(collection(db,'planejamentos_safra'), snap => {
    planejamentos = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    if (tabAtual === 'lista') renderLista();
  });
  onSnapshot(collection(db,'estoque_produtos'), snap => {
    produtosEstoque = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    if (tabAtual === 'novo') renderNovoSeguro();
  });
  onSnapshot(collection(db,'catalogo_adubos'), snap => {
    catalogoAdubos = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    if (tabAtual === 'novo') renderNovoSeguro();
  });
});

// Helper: pega composição efetiva de um produto (local OU catálogo por nome)
function normNomeAdubo(s) {
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').trim();
}
function composicaoDoProduto(p) {
  if (!p) return null;
  if (p.composicao) return p.composicao;
  // Fallback: busca no catálogo pelo nome normalizado
  const nomeN = normNomeAdubo(p.nome);
  const achou = catalogoAdubos.find(a => normNomeAdubo(a.nome) === nomeN);
  if (achou) {
    // Constrói objeto composicao limpo
    const c = {};
    ['n','p2o5','k2o','s','ca','mg','zn','b','cu','mn'].forEach(k => {
      if (achou[k]) c[k] = achou[k];
    });
    return Object.keys(c).length ? c : null;
  }
  return null;
}

function temAcesso() {
  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};
  if (m.planejamento) return true;
  if (m.admin === 'admin') return true;
  if (Object.values(m).includes('admin')) return true;
  return false;
}
function podeEditar() {
  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};
  return m.planejamento === 'admin' || m.planejamento === 'gerente';
}
function isAdmin() {
  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};
  return m.planejamento === 'admin' || m.admin === 'admin';
}

function gerarMenu() {
  const isAdm = perfilAtual.perfil==='admin' || Object.values(perfilAtual.modulos||{}).includes('admin');
  const items = [
    {href:'index.html',ico:'📊',label:'Dashboard'},
    {href:'mapa.html',ico:'🗺️',label:'Mapa de Talhões'},
    {href:'atividades.html',ico:'🌾',label:'Atividades'},
    {href:'adubacoes.html',ico:'🧪',label:'Adubações'},
    {href:'pulverizacoes.html',ico:'💧',label:'Pulverizações'},
    {href:'pedidos.html',ico:'📦',label:'Pedidos'},
    {href:'estoque.html',ico:'🏬',label:'Estoque'},
    {href:'gestao.html',ico:'📊',label:'Gestão'},
    {href:'analises.html',ico:'🔬',label:'Análises'},
    {href:'recomendacoes.html',ico:'💊',label:'Recomendações'},
    {href:'planejamento.html',ico:'🗓️',label:'Planejamento'}
  ];
  if (isAdm) items.push({href:'admin.html',ico:'⚙️',label:'Administração'});
  document.getElementById('menuModulos').innerHTML = items.map(m =>
    `<a class="menu-item ${m.href==='planejamento.html'?'ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`
  ).join('');
}

// ━━━━━━━━━━ UTILS ━━━━━━━━━━

function escHtml(s){return String(s||'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n,d){const v=Number(n);if(!isFinite(v))return '—';return v.toLocaleString('pt-BR',{minimumFractionDigits:d!==undefined?d:0,maximumFractionDigits:d!==undefined?d:2});}
function parseDose(s){if(s==null||s==='')return null;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?null:n;}
function formatarData(d){if(!d)return'—';const[a,m,dd]=String(d).split('-');return `${dd}/${m}/${a}`;}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}

window.toggleMenu = () => { document.getElementById('menuLateral').classList.toggle('aberto'); document.getElementById('menuOverlay').classList.toggle('aberto'); };
window.fecharMenu = () => { document.getElementById('menuLateral').classList.remove('aberto'); document.getElementById('menuOverlay').classList.remove('aberto'); };
window.fazerLogout = async () => { await signOut(auth); window.location.href='login.html'; };

// ━━━━━━━━━━ TABS ━━━━━━━━━━

window.abrirTab = function(t) {
  tabAtual = t;
  document.querySelectorAll('.tab-top').forEach(b => b.classList.remove('ativa'));
  document.getElementById(t==='novo'?'tabNovo':'tabLista').classList.add('ativa');
  document.getElementById('planRodape').style.display = t==='novo' ? 'flex' : 'none';
  if (t === 'novo') renderNovo();
  else renderLista();
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ABA NOVO — renderiza os cards 1 e 2 (C.1)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

window.renderNovo = function() {
  const cont = document.getElementById('content');
  let html = '';
  // Card 1: Talhão + Safra
  html += renderCard1();
  // Card 2: Demanda (só se talhão selecionado)
  if (window.planWIP.talhaoId) {
    html += renderCard2();
  }
  // Card 3: Meses + Distribuição (só se tem demanda)
  if (window.planWIP.talhaoId && temDemandaPreenchida()) {
    html += renderCard3();
  }
  // Card 4: Adubos por mês (só se tem mês com algum % preenchido)
  if (window.planWIP.talhaoId && temDemandaPreenchida() && (window.planWIP.meses||[]).length > 0) {
    html += renderCard4();
  }
  // Card 5: Observações
  if (window.planWIP.talhaoId && temDemandaPreenchida()) {
    html += renderCardObs();
  }
  cont.innerHTML = html;
  // Atualiza estado do botão Aprovar
  const btnAprov = document.getElementById('btnAprovarPlano');
  if (btnAprov) {
    const meses = window.planWIP.meses || [];
    const temAdubos = meses.some(m => m.adubos && m.adubos.length > 0);
    // Habilita se tem pelo menos um mês com adubo
    if (temAdubos && window.planWIP.status !== 'aprovado' && window.planWIP.status !== 'aplicado') {
      btnAprov.disabled = false;
      btnAprov.style.display = '';
    } else if (window.planWIP.status === 'aprovado' || window.planWIP.status === 'aplicado') {
      // Já aprovado: mostra status mas desabilita
      btnAprov.disabled = true;
      btnAprov.textContent = window.planWIP.status === 'aplicado' ? '✓ Aplicado' : '✓ Aprovado';
    } else {
      btnAprov.disabled = true;
    }
  }
};

function renderCard1() {
  const w = window.planWIP;
  const talhao = w.talhaoId ? talhoes.find(t => t._docId === w.talhaoId) : null;
  // Lista talhões ativos agrupados
  const talhoesOrd = [...talhoes]
    .filter(t => t.status === 'ativo' || !t.status)
    .sort((a,b) => (a.fazenda||'').localeCompare(b.fazenda||'') || (a.nome||'').localeCompare(b.nome||''));
  const opcoesT = '<option value="">— selecione —</option>' + talhoesOrd.map(t =>
    `<option value="${escAttr(t._docId)}" ${t._docId===w.talhaoId?'selected':''}>${escHtml((t.fazenda?t.fazenda+' · ':'') + (t.nome || t.id))}</option>`
  ).join('');
  // Recomendações aprovadas para este talhão
  const recsAprov = w.talhaoId ? recomendacoes.filter(r => r.talhaoId === w.talhaoId && r.status === 'aprovada')
    .sort((a,b) => (b.atualizadoEm||b.criadoEm||'').localeCompare(a.atualizadoEm||a.criadoEm||''))
    : [];
  const recImportHtml = w.talhaoId ? renderRecImport(recsAprov) : '';
  const areaHtml = talhao && talhao.area ? `<div class="area-info">📐 Área: <strong>${fmt(talhao.area,2)} ha</strong> ${talhao.clone?'· Clone: <strong>'+escHtml(talhao.clone)+'</strong>':''}</div>` : '';
  return `<div class="card-passo">
    <div class="card-passo-head">
      <div><span class="card-passo-num">1</span><span class="card-passo-tit">Talhão e safra</span></div>
      <div class="card-passo-sub">Escolha o talhão alvo do planejamento e a safra.</div>
    </div>
    <div class="card-passo-body">
      <div class="campo-row">
        <label>Talhão</label>
        <select id="selTalhao" onchange="onTrocaTalhao()">${opcoesT}</select>
      </div>
      <div class="campo-row-2">
        <div>
          <label>Safra</label>
          <input type="text" id="inpSafra" value="${escAttr(w.safra||'')}" oninput="window.planWIP.safra=this.value" placeholder="2026/2027">
        </div>
      </div>
      ${areaHtml}
      ${recImportHtml}
    </div>
  </div>`;
}

function renderRecImport(recsAprov) {
  if (!recsAprov.length) {
    return `<div class="rec-import-card" style="background:#fafafa;border-color:var(--cb);">
      <div class="rec-import-tit" style="color:var(--c);">💡 Recomendação técnica</div>
      <div class="rec-import-vazio">Nenhuma recomendação aprovada para este talhão.<br>
        <a href="recomendacoes.html" style="color:var(--v);text-decoration:underline;">Criar uma em "Recomendações"</a>
      </div>
    </div>`;
  }
  const r = recsAprov[0]; // mais recente
  // Chips de doses (usar o valor a aplicar)
  const chips = [];
  if (r.n != null) chips.push(`N: ${r.n}`);
  if (r.p2o5 != null) chips.push(`P₂O₅: ${r.p2o5}`);
  if (r.k2o != null) chips.push(`K₂O: ${r.k2o}`);
  if (r.micros) {
    for (const [k,m] of Object.entries(r.micros)) {
      const v = m.dose ?? 0;
      if (v > 0) chips.push(`${k.toUpperCase()}: ${v}`);
    }
  }
  const idImport = window.planWIP.recomendacaoOrigemId === r._docId;
  return `<div class="rec-import-card">
    <div class="rec-import-tit">💡 Recomendação aprovada disponível</div>
    <div class="rec-import-meta">
      📅 ${formatarData((r.atualizadoEm||r.criadoEm||'').slice(0,10))} · ${escHtml(r.amostraNome||'—')} · ${fmt(r.produtividade,0)} sc/ha
    </div>
    <div class="rec-import-doses">
      ${chips.map(c => `<span class="rec-import-dose">${escHtml(c)}</span>`).join('')}
    </div>
    <button class="rec-import-btn" onclick="importarRecomendacao('${r._docId}')">
      ${idImport ? '✓ Importada — clique para reimportar' : '⬇️ Importar para demanda'}
    </button>
  </div>`;
}

function renderCard2() {
  const w = window.planWIP;
  const importou = !!w.recomendacaoOrigemId;
  // Agrupar nutrientes
  const grupos = {macro:'🌾 Macronutrientes', secundario:'🌱 Secundários', micro:'🟣 Micronutrientes'};
  let nutHtml = '';
  for (const [grupoId, grupoLab] of Object.entries(grupos)) {
    const nuts = NUTRIENTES.filter(n => n.grupo === grupoId);
    nutHtml += `<div class="dem-grid-grupo">${escHtml(grupoLab)}</div>`;
    nuts.forEach(n => {
      const val = w.demanda[n.id];
      const ehImportado = importou && val !== null && val !== undefined;
      nutHtml += `<div class="dem-item ${ehImportado?'importado':''}">
        <div class="dem-item-lab">${escHtml(n.lab)}</div>
        <input class="dem-item-inp" type="text" inputmode="decimal" value="${val !== null && val !== undefined ? fmt(val,0).replace(/\\./g,'') : ''}" oninput="setDemanda('${n.id}',this.value)" placeholder="0">
        <div class="dem-item-un">${escHtml(n.un)}</div>
      </div>`;
    });
  }
  return `<div class="card-passo">
    <div class="card-passo-head">
      <div><span class="card-passo-num">2</span><span class="card-passo-tit">Demanda nutricional (kg/ha)</span></div>
      <div class="card-passo-sub">Total de cada nutriente que será aplicado na safra. Importe da recomendação ou digite.</div>
    </div>
    <div class="card-passo-body">
      <div class="dem-grid">${nutHtml}</div>
      ${importou ? `<div class="alerta-info" style="margin-top:11px;">📥 Valores destacados em amarelo foram importados de uma recomendação. Você pode editar livremente.</div>` : ''}
    </div>
  </div>`;
}
