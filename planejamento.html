// Calcula label de exibição para um mês (yyyy-mm)
function labelMes(mesYM) {
  const [a, m] = String(mesYM).split('-');
  const idx = parseInt(m, 10) - 1;
  if (isNaN(idx) || idx < 0 || idx > 11) return mesYM;
  return `${MES_LABELS[idx]}/${String(a).slice(-2)}`;
}

// Tabela: linhas = meses, colunas = nutrientes (só os que têm demanda > 0)
function renderTabelaDistribuicao() {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  // Nutrientes ativos (com demanda > 0)
  const nutsAtivos = NUTRIENTES.filter(n => {
    const v = window.planWIP.demanda[n.id];
    return v !== null && v !== undefined && v > 0;
  });
  if (!nutsAtivos.length) {
    return `<div class="alerta-warn">⚠️ Preencha a demanda nutricional acima primeiro.</div>`;
  }
  // Header
  let html = `<div class="dist-wrap"><table class="dist-tbl">
    <thead><tr>
      <th class="mes-col">Mês</th>
      ${nutsAtivos.map(n => `<th>${escHtml(n.lab)}</th>`).join('')}
    </tr></thead>
    <tbody>`;
  // Linhas dos meses
  meses.forEach((m, idx) => {
    html += `<tr>
      <td class="mes-col">${escHtml(labelMes(m.mes))}
        <button class="btn-rm-mes" type="button" onclick="removerMes(${idx})" title="Remover mês">✕</button>
      </td>
      ${nutsAtivos.map(n => {
        const v = m.distribuicao?.[n.id];
        const valStr = (v !== null && v !== undefined && v !== '') ? String(v) : '';
        return `<td><input class="dist-inp" type="text" inputmode="decimal" value="${escAttr(valStr)}" placeholder="0" oninput="setDistribuicao(${idx},'${n.id}',this.value)"></td>`;
      }).join('')}
    </tr>`;
  });
  // Linha de totais
  html += `<tr>
    <td class="tot-row-lab">Total %</td>
    ${nutsAtivos.map(n => {
      const total = meses.reduce((s, m) => s + (parseFloat(m.distribuicao?.[n.id]) || 0), 0);
      let cls = 'ok';
      if (total === 0) cls = 'err';
      else if (Math.abs(total - 100) < 0.5) cls = 'ok';
      else if (Math.abs(total - 100) <= 5) cls = 'warn';
      else cls = 'err';
      const icon = cls === 'ok' ? '✓' : cls === 'warn' ? '⚠' : '✕';
      return `<td class="tot-row ${cls}">${fmt(total,0)}% ${icon}</td>`;
    }).join('')}
  </tr>`;
  html += `</tbody></table></div>`;
  // Indicador de meta calculada (mostra kg/ha por mês)
  html += `<div style="margin-top:11px;padding:9px 11px;background:var(--vb);border:1px solid var(--v);border-radius:8px;font-size:.74rem;color:var(--ve);line-height:1.6;">
    <strong style="font-family:'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;font-size:.72rem;">📊 Demanda por mês (kg/ha)</strong>
    <div id="resumoPorMes" style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">
      ${meses.map(m => {
        const partes = nutsAtivos.map(n => {
          const pct = parseFloat(m.distribuicao?.[n.id]) || 0;
          const total = window.planWIP.demanda[n.id] || 0;
          const dose = (pct / 100) * total;
          if (dose === 0) return null;
          return `${n.lab}:${fmt(dose,1)}`;
        }).filter(Boolean);
        return `<div style="font-family:'DM Mono',monospace;font-size:.72rem;"><strong>${escHtml(labelMes(m.mes))}:</strong> ${partes.join(' · ') || '—'}</div>`;
      }).join('')}
    </div>
  </div>`;
  return html;
}

window.setDistribuicao = function(idxMes, nutId, valor) {
  const meses = window.planWIP.meses || [];
  const mesesOrd = [...meses].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = mesesOrd[idxMes];
  if (!m) return;
  if (!m.distribuicao) m.distribuicao = {};
  const v = parseDose(valor);
  m.distribuicao[nutId] = (v === null) ? '' : v;
  // Atualiza só os totais e o resumo, sem re-renderizar tudo (preserva foco)
  atualizarTotaisDistribuicao();
};

// Atualiza apenas a linha de totais e o resumo "por mês" sem destruir os inputs (preserva foco)
function atualizarTotaisDistribuicao() {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const nutsAtivos = NUTRIENTES.filter(n => {
    const v = window.planWIP.demanda[n.id];
    return v !== null && v !== undefined && v > 0;
  });
  // 1) Atualizar células de total na tabela
  const tabela = document.querySelector('.dist-tbl tbody');
  if (tabela) {
    const linhaTotais = tabela.lastElementChild;
    if (linhaTotais) {
      const cells = linhaTotais.querySelectorAll('td');
      nutsAtivos.forEach((n, i) => {
        const td = cells[i + 1];
        if (!td) return;
        const total = meses.reduce((s, m) => s + (parseFloat(m.distribuicao?.[n.id]) || 0), 0);
        let cls = 'tot-row ';
        let icon;
        if (total === 0) { cls += 'err'; icon = '✕'; }
        else if (Math.abs(total - 100) < 0.5) { cls += 'ok'; icon = '✓'; }
        else if (Math.abs(total - 100) <= 5) { cls += 'warn'; icon = '⚠'; }
        else { cls += 'err'; icon = '✕'; }
        td.className = cls;
        td.textContent = `${fmt(total,0)}% ${icon}`;
      });
    }
  }
  // 2) Atualizar resumo "demanda por mês" (kg/ha) — substitui o div inteiro
  const resumoBox = document.getElementById('resumoPorMes');
  if (resumoBox) {
    resumoBox.innerHTML = meses.map(m => {
      const partes = nutsAtivos.map(n => {
        const pct = parseFloat(m.distribuicao?.[n.id]) || 0;
        const total = window.planWIP.demanda[n.id] || 0;
        const dose = (pct / 100) * total;
        if (dose === 0) return null;
        return `${n.lab}:${fmt(dose,1)}`;
      }).filter(Boolean);
      return `<div style="font-family:'DM Mono',monospace;font-size:.72rem;"><strong>${escHtml(labelMes(m.mes))}:</strong> ${partes.join(' · ') || '—'}</div>`;
    }).join('');
  }
}

window.removerMes = function(idxMes) {
  const meses = window.planWIP.meses || [];
  const mesesOrd = [...meses].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = mesesOrd[idxMes];
  if (!m) return;
  if (!confirm(`Remover ${labelMes(m.mes)} do planejamento?`)) return;
  window.planWIP.meses = meses.filter(x => x.mes !== m.mes);
  renderNovo();
};

// ━━━ MODAL DE SELEÇÃO DE MÊS ━━━

let modalMesAnoBase = null;
let mesesSelecionados = new Set();

window.abrirModalMes = function() {
  // Ano base = primeiro ano da safra (ex: "2026/2027" → 2026)
  const safra = window.planWIP.safra || '';
  const matchAno = String(safra).match(/(\d{4})/);
  modalMesAnoBase = matchAno ? parseInt(matchAno[1], 10) : new Date().getFullYear();
  mesesSelecionados = new Set();
  renderModalMes();
  document.getElementById('overlayMes').classList.add('aberto');
};

window.fecharModalMes = function() {
  document.getElementById('overlayMes').classList.remove('aberto');
};

function renderModalMes() {
  const body = document.getElementById('modalMesBody');
  const safra = window.planWIP.safra || '';
  const matchAno = String(safra).match(/(\d{4})/);
  const anoBase = matchAno ? parseInt(matchAno[1], 10) : new Date().getFullYear();
  const mesesUsados = (window.planWIP.meses || []).map(m => m.mes);
  const mostrarTpl = !(window.planWIP.meses || []).length;
  const anos = [anoBase - 1, anoBase, anoBase + 1, anoBase + 2];
  let html = '';
  if (mostrarTpl) {
    html += `<div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;color:var(--c);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;">⚡ Templates prontos</div>
    <div class="modal-mes-templates">
      ${TEMPLATES_CONILON.map(t => `<button type="button" class="tpl-btn" onclick="aplicarTemplate('${t.id}')">
        <div class="tpl-btn-tit">${escHtml(t.nome)}</div>
        <div class="tpl-btn-sub">${escHtml(t.sub)}</div>
      </button>`).join('')}
    </div>`;
  }
  // Seletor de ano + grid de meses com multi-seleção
  const selCount = mesesSelecionados.size;
  html += `<div class="ano-selector">
    <button type="button" onclick="mudarAnoModalMes(-1)">−</button>
    <div class="ano-val" id="anoSelVal">${modalMesAnoBase}</div>
    <button type="button" onclick="mudarAnoModalMes(1)">+</button>
  </div>
  <div class="meses-grid">
    ${MES_LABELS.map((lab, i) => {
      const mesYM = `${modalMesAnoBase}-${String(i+1).padStart(2,'0')}`;
      const usado = mesesUsados.includes(mesYM);
      const sel = mesesSelecionados.has(mesYM);
      return `<div class="mes-opt ${usado?'ja-usado':sel?'selecionado':''}" onclick="${usado?'':`toggleMes('${mesYM}')`}">
        <div class="mes-opt-nome">${lab}</div>
        <div class="mes-opt-ano">${modalMesAnoBase}</div>
      </div>`;
    }).join('')}
  </div>
  <button class="btn-add-selecionados" ${selCount===0?'disabled':''} onclick="adicionarSelecionados()">
    ${selCount > 0 ? `✅ Adicionar ${selCount} mês${selCount>1?'es':''} selecionado${selCount>1?'s':''}` : 'Selecione os meses acima'}
  </button>`;
  body.innerHTML = html;
  // Pré-selecionar valores sensatos (Jun ano base → Mar ano+1)
  const selIniMes = document.getElementById('rangeIniMes');
  const selIniAno = document.getElementById('rangeIniAno');
  const selFimMes = document.getElementById('rangeFimMes');
  const selFimAno = document.getElementById('rangeFimAno');
  if (selIniMes) selIniMes.value = '6';
  if (selIniAno) selIniAno.value = String(anoBase);
  if (selFimMes) selFimMes.value = '3';
  if (selFimAno) selFimAno.value = String(anoBase + 1);
}

window.mudarAnoModalMes = function(delta) {
  modalMesAnoBase += delta;
  renderModalMes();
};

window.toggleMes = function(mesYM) {
  if (mesesSelecionados.has(mesYM)) {
    mesesSelecionados.delete(mesYM);
  } else {
    mesesSelecionados.add(mesYM);
  }
  renderModalMes();
};

window.adicionarSelecionados = function() {
  const meses = window.planWIP.meses || [];
  let count = 0;
  [...mesesSelecionados].sort().forEach(mesYM => {
    if (!meses.find(m => m.mes === mesYM)) {
      const distribuicao = {};
      NUTRIENTES.forEach(n => { distribuicao[n.id] = ''; });
      meses.push({mes: mesYM, distribuicao});
      count++;
    }
  });
  meses.sort((a, b) => a.mes.localeCompare(b.mes));
  window.planWIP.meses = meses;
  mesesSelecionados = new Set();
  fecharModalMes();
  renderNovo();
  toast(`✅ ${count} mês${count>1?'es':''} adicionado${count>1?'s':''}`);
};

window.adicionarMes = function(mesYM) {
  const meses = window.planWIP.meses || [];
  if (meses.find(m => m.mes === mesYM)) {
    toast('⚠️ Mês já adicionado');
    return;
  }
  // Distribuição vazia, usuário preenche
  const distribuicao = {};
  NUTRIENTES.forEach(n => { distribuicao[n.id] = ''; });
  meses.push({mes: mesYM, distribuicao});
  window.planWIP.meses = meses;
  fecharModalMes();
  renderNovo();
  toast(`✅ ${labelMes(mesYM)} adicionado`);
};

window.adicionarIntervalo = function() {
  const iniMes = parseInt(document.getElementById('rangeIniMes').value);
  const iniAno = parseInt(document.getElementById('rangeIniAno').value);
  const fimMes = parseInt(document.getElementById('rangeFimMes').value);
  const fimAno = parseInt(document.getElementById('rangeFimAno').value);
  if (iniAno > fimAno || (iniAno === fimAno && iniMes > fimMes)) {
    toast('⚠️ Mês inicial deve ser anterior ao final'); return;
  }
  const mesesExist = window.planWIP.meses || [];
  let mes = iniMes, ano = iniAno, adicionados = 0;
  const maxIter = 36;
  let iter = 0;
  while ((ano < fimAno || (ano === fimAno && mes <= fimMes)) && iter < maxIter) {
    const mesYM = `${ano}-${String(mes).padStart(2,'0')}`;
    if (!mesesExist.find(m => m.mes === mesYM)) {
      const distribuicao = {};
      NUTRIENTES.forEach(n => { distribuicao[n.id] = ''; });
      mesesExist.push({mes: mesYM, distribuicao});
      adicionados++;
    }
    mes++; if (mes > 12) { mes = 1; ano++; }
    iter++;
  }
  window.planWIP.meses = mesesExist;
  fecharModalMes();
  renderNovo();
  toast(`✅ ${adicionados} mês(es) adicionado(s)`);
};

window.aplicarTemplate = function(tplId) {
  const tpl = TEMPLATES_CONILON.find(t => t.id === tplId);
  if (!tpl) return;
  // Ano base = primeiro ano da safra
  const safra = window.planWIP.safra || '';
  const matchAno = String(safra).match(/(\d{4})/);
  const anoBase = matchAno ? parseInt(matchAno[1], 10) : new Date().getFullYear();
  // Gera meses
  const novosMeses = tpl.meses.map(item => {
    const ano = anoBase + item.anoOffset;
    const mesYM = `${ano}-${String(item.mesIdx).padStart(2,'0')}`;
    // Filtra distribuição só pra nutrientes que existem na demanda
    const distribuicao = {};
    NUTRIENTES.forEach(n => {
      distribuicao[n.id] = item.distrib[n.id] !== undefined ? item.distrib[n.id] : '';
    });
    return {mes: mesYM, distribuicao};
  });
  window.planWIP.meses = novosMeses;
  fecharModalMes();
  renderNovo();
  toast(`✅ Template "${tpl.nome}" aplicado`);
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CARD 4 — ADUBOS POR MÊS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Estrutura de cada adubo em meses[i].adubos: {produtoId, nome, composicao:{n,p2o5,...}, dose:Number, travado:Boolean}

function renderCard4() {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const nutsAtivos = NUTRIENTES.filter(n => {
    const v = window.planWIP.demanda[n.id];
    return v !== null && v !== undefined && v > 0;
  });
  if (!meses.length) return '';
  // Pra cada mês: calcular meta (kg/ha de cada nutriente) + render dos adubos
  let body = '';
  meses.forEach((m, idxMes) => {
    // metas em kg/ha
    const metas = {};
    nutsAtivos.forEach(n => {
      const pct = parseFloat(m.distribuicao?.[n.id]) || 0;
      const total = window.planWIP.demanda[n.id] || 0;
      metas[n.id] = (pct / 100) * total;
    });
    // Auto-recalcula doses dos adubos não-travados
    recalcularDosesMes(m, metas);
    // Renderiza o bloco
    body += renderMesBloco(m, idxMes, metas, nutsAtivos);
  });
  return `<div class="card-passo">
    <div class="card-passo-head">
      <div><span class="card-passo-num">4</span><span class="card-passo-tit">Adubos por mês</span></div>
      <div class="card-passo-sub">Escolha os adubos pra cada mês. Sistema calcula a dose pra entregar a meta de nutrientes.</div>
    </div>
    <div class="card-passo-body">
      ${body || '<div class="alerta-info">ℹ️ Defina os meses no Card 3 primeiro.</div>'}
    </div>
  </div>`;
}

// Recalcula automaticamente as doses dos adubos não-travados pra cumprir as metas
// Divide por nutriente: pra cada nutriente, identifica adubos que o fornecem,
// trava os que já foram editados, distribui o restante entre os não-travados em partes iguais.
function recalcularDosesMes(mes, metas) {
  const adubos = mes.adubos || [];
  if (!adubos.length) return;
  // Pra cada nutriente, calcular o quanto cada adubo já fornece pelo seu valor atual travado
  // e o quanto falta entregar (meta - já fornecido pelos travados)
  // Adubos não-travados dividem o que falta em proporção igual da meta de cada nutriente.

  // Mapa: pra cada adubo, lista de nutrientes que ele fornece (composicao > 0)
  const aduboNutrientes = adubos.map(a => {
    const c = a.composicao || {};
    const ativos = [];
    NUTRIENTES.forEach(n => {
      const pct = c[n.id];
      if (pct && pct > 0) ativos.push(n.id);
    });
    return ativos;
  });

  // Pra cada nutriente, qual é o "nutriente principal" do adubo (maior % na composição)?
  function principalDo(a) {
    const c = a.composicao || {};
    let melhor = null, maior = 0;
    NUTRIENTES.forEach(n => {
      const v = c[n.id] || 0;
      if (v > maior) { maior = v; melhor = n.id; }
    });
    return melhor;
  }

  // Estratégia: cada adubo NÃO-travado tem dose calculada pra entregar a meta do nutriente principal dele
  // Se mais de um adubo tem o mesmo principal, divide igualmente a meta entre eles
  // Os outros nutrientes que o adubo fornece "vêm de brinde" — não controlam a dose

  const adubosNTravados = adubos.filter(a => !a.travado);
  if (!adubosNTravados.length) return;

  // Agrupa por nutriente principal
  const grupos = {};
  adubosNTravados.forEach(a => {
    const p = principalDo(a);
    if (!p) return;
    if (!grupos[p]) grupos[p] = [];
    grupos[p].push(a);
  });

  // Calcular o que os travados já entregam (pra subtrair da meta)
  const entregueTravados = {};
  NUTRIENTES.forEach(n => { entregueTravados[n.id] = 0; });
  adubos.forEach(a => {
    if (!a.travado) return;
    const dose = parseFloat(a.dose) || 0;
    const c = a.composicao || {};
    NUTRIENTES.forEach(n => {
      const pct = c[n.id] || 0;
      entregueTravados[n.id] += dose * (pct / 100);
    });
  });

  // Pra cada grupo, calcula dose
  Object.entries(grupos).forEach(([nutPrincipal, adubosGrupo]) => {
    const meta = metas[nutPrincipal] || 0;
    const restante = Math.max(0, meta - (entregueTravados[nutPrincipal] || 0));
    // Divisão = igualmente entre os adubos do grupo
    const metaPorAdubo = restante / adubosGrupo.length;
    adubosGrupo.forEach(a => {
      const pct = (a.composicao?.[nutPrincipal] || 0);
      if (pct > 0) {
        a.dose = metaPorAdubo / (pct / 100);
      } else {
        a.dose = 0;
      }
    });
  });
}

function renderMesBloco(mes, idxMes, metas, nutsAtivos) {
  const adubos = mes.adubos || [];
  // Calcular entrega total
  const entregue = {};
  NUTRIENTES.forEach(n => { entregue[n.id] = 0; });
  adubos.forEach(a => {
    const dose = parseFloat(a.dose) || 0;
    const c = a.composicao || {};
    NUTRIENTES.forEach(n => {
      const pct = c[n.id] || 0;
      entregue[n.id] += dose * (pct / 100);
    });
  });
  // Render dos adubos
  let adubosHtml = '';
  if (!adubos.length) {
    adubosHtml = `<div class="adubo-vazio">Nenhum adubo selecionado. Toque em "➕ Adicionar adubo".</div>`;
  } else {
    adubosHtml = adubos.map((a, idxA) => renderAduboLinha(a, idxMes, idxA, metas)).join('');
  }
  // Resumo entregue × meta
  const resumoChips = nutsAtivos.map(n => {
    const meta = metas[n.id] || 0;
    const ent = entregue[n.id] || 0;
    if (meta === 0 && ent === 0) return '';
    let cls = 'zero';
    if (meta > 0) {
      const ratio = ent / meta;
      if (ratio >= 0.95 && ratio <= 1.05) cls = 'ok';
      else if (ratio >= 0.85 && ratio <= 1.15) cls = 'warn';
      else cls = 'err';
    } else if (ent > 0) {
      cls = 'warn'; // entregando algo que não foi pedido
    }
    return `<span class="mes-resumo-chip ${cls}">${escHtml(n.lab)}: ${fmt(ent,1)}/${fmt(meta,1)}</span>`;
  }).filter(Boolean).join('');
  // Mostrar metas dos nutrientes principais do mês
  const metasInfo = nutsAtivos.map(n => {
    const meta = metas[n.id] || 0;
    if (meta === 0) return null;
    return `${escHtml(n.lab)}:${fmt(meta,1)}`;
  }).filter(Boolean).join(' · ');
  return `<div class="mes-bloco">
    <div class="mes-bloco-head">
      <div style="flex:1;min-width:0;">
        <div class="mes-bloco-tit">📅 ${escHtml(labelMes(mes.mes))}</div>
        <div class="mes-bloco-meta">Meta: <strong>${metasInfo || '—'}</strong></div>
      </div>
      <button class="btn-add-adubo" type="button" onclick="abrirModalAdubo(${idxMes})">➕ Adubo</button>
    </div>
    ${adubosHtml}
    ${adubos.length ? `<div class="mes-resumo">
      <div class="mes-resumo-tit">⚖️ Entregue × Meta (kg/ha)</div>
      <div class="mes-resumo-grid">${resumoChips || '—'}</div>
    </div>` : ''}
  </div>`;
}

function renderAduboLinha(a, idxMes, idxA, metas) {
  const c = a.composicao || {};
  // Fórmula NPK + extras
  const n = c.n || 0, p = c.p2o5 || 0, k = c.k2o || 0;
  const extras = [];
  ['s','ca','mg','zn','b','cu','mn'].forEach(k2 => { if (c[k2]) extras.push(`${k2.toUpperCase()}:${c[k2]}`); });
  const formula = `${n}-${p}-${k}${extras.length?' · '+extras.join(' · '):''}`;
  // Dose e entrega
  const dose = parseFloat(a.dose) || 0;
  // O que esse adubo entrega
  const entregaParts = [];
  NUTRIENTES.forEach(nt => {
    const pct = c[nt.id] || 0;
    if (pct > 0) {
      const ent = dose * (pct / 100);
      if (ent > 0) entregaParts.push(`${nt.lab}:${fmt(ent,1)}`);
    }
  });
  return `<div class="adubo-linha">
    <div class="adubo-linha-head">
      <div class="adubo-nome">${escHtml(a.nome)}<span class="adubo-formula">${escHtml(formula)}</span></div>
      <div class="adubo-btns">
        <button class="btn-trava ${a.travado?'travado':''}" type="button" onclick="toggleTravaAdubo(${idxMes},${idxA})" title="${a.travado?'Travado (dose fixa)':'Auto (sistema calcula)'}">${a.travado?'🔒':'🔓'}</button>
        <button class="btn-rm-adubo" type="button" onclick="removerAdubo(${idxMes},${idxA})">✕</button>
      </div>
    </div>
    <div class="adubo-dose-row">
      <input class="adubo-dose-inp ${a.travado?'travada':''}" type="text" inputmode="decimal" value="${fmt(dose,1).replace(/\\./g,'')}" oninput="setDoseAdubo(${idxMes},${idxA},this.value)" onblur="onBlurDoseAdubo()">
      <button class="adubo-dose-un btn-un" type="button" onclick="toggleUnidadeAdubo(${idxMes},${idxA})" title="Clique para trocar unidade">${escHtml(a.unidade||'kg/ha')}</button>
      <div class="adubo-entrega">→ <strong>${entregaParts.join(' · ') || '—'}</strong></div>
    </div>
  </div>`;
}

// ━━━ HANDLERS DO CARD 4 ━━━

window.toggleUnidadeAdubo = function(idxMes, idxA) {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = meses[idxMes];
  if (!m || !m.adubos || !m.adubos[idxA]) return;
  const atual = m.adubos[idxA].unidade || 'kg/ha';
  m.adubos[idxA].unidade = atual === 'kg/ha' ? 'L/ha' : 'kg/ha';
  renderNovo();
};

window.toggleTravaAdubo = function(idxMes, idxA) {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = meses[idxMes];
  if (!m || !m.adubos || !m.adubos[idxA]) return;
  m.adubos[idxA].travado = !m.adubos[idxA].travado;
  renderNovo();
};

window.removerAdubo = function(idxMes, idxA) {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = meses[idxMes];
  if (!m || !m.adubos) return;
  m.adubos.splice(idxA, 1);
  renderNovo();
};

// Quando edita dose manualmente: trava automaticamente e marca pra re-render apenas no blur
window.setDoseAdubo = function(idxMes, idxA, valor) {
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = meses[idxMes];
  if (!m || !m.adubos || !m.adubos[idxA]) return;
  const v = parseDose(valor);
  m.adubos[idxA].dose = v || 0;
  m.adubos[idxA].travado = true;  // editar manualmente = trava
};

// Ao sair do campo: re-renderiza (recalcula outros adubos e atualiza resumos)
window.onBlurDoseAdubo = function() {
  renderNovo();
};

// ━━━ MODAL SELECIONAR ADUBO ━━━

let modalAduboMesIdx = null;

window.abrirModalAdubo = function(idxMes) {
  modalAduboMesIdx = idxMes;
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = meses[idxMes];
  if (!m) return;
  document.getElementById('modalAduboSub').textContent = `Adicionar ao mês ${labelMes(m.mes)}`;
  // Monta o modal com o campo de busca fixo + div de resultados separada
  // (nunca substituímos o input pelo innerHTML para preservar o foco)
  const body = document.getElementById('modalAduboBody');
  body.innerHTML = '<input class="adubo-busca" id="modalAduboBusca" type="search" placeholder="🔍 Buscar adubo..." autocomplete="off"><div id="modalAduboLista"></div>';
  const inp = document.getElementById('modalAduboBusca');
  inp.addEventListener('input', function() { _filtrarAdubos(this.value); });
  _filtrarAdubos('');
  document.getElementById('overlayAdubo').classList.add('aberto');
  setTimeout(() => inp.focus(), 80);
};

window.fecharModalAdubo = function() {
  document.getElementById('overlayAdubo').classList.remove('aberto');
  modalAduboMesIdx = null;
};

function _filtrarAdubos(busca) {
  const buscaNorm = (busca||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const adubosDisp = catalogoAdubos
    .filter(a => {
      if (!buscaNorm) return true;
      const nomeN = String(a.nome||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      return nomeN.includes(buscaNorm);
    })
    .sort((a,b) => (a.nome||'').localeCompare(b.nome||''));
  const lista = document.getElementById('modalAduboLista');
  if (!lista) return;
  if (!adubosDisp.length) {
    lista.innerHTML = `<div class="alerta-warn">
      ${catalogoAdubos.length === 0
        ? 'Nenhum adubo cadastrado no catálogo global.'
        : 'Nenhum adubo encontrado para essa busca.'}<br>
      <span style="font-size:.74rem;">Acesse <strong>Admin → 🧪 Adubos</strong> para cadastrar os adubos que serão usados no planejamento.</span>
    </div>`;
  } else {
    lista.innerHTML = adubosDisp.map(a => {
      const n = a.n||0, pp = a.p2o5||0, k = a.k2o||0;
      const extras = [];
      ['s','ca','mg','zn','b','cu','mn'].forEach(kk => { if (a[kk]) extras.push(`${kk.toUpperCase()}:${a[kk]}`); });
      const formula = `${n}-${pp}-${k}${extras.length?' · '+extras.join(' · '):''}`;
      return `<div class="adubo-opt" onclick="adicionarAduboAoMes('${escAttr(a._docId)}')">
        <div class="adubo-opt-info">
          <div class="adubo-opt-nome">${escHtml(a.nome)}</div>
          <div class="adubo-opt-sub">${escHtml(formula)}</div>
        </div>
      </div>`;
    }).join('');
  }
}

window.adicionarAduboAoMes = function(catalogoId) {
  if (modalAduboMesIdx === null) return;
  const a = catalogoAdubos.find(x => x._docId === catalogoId);
  if (!a) { toast('❌ Adubo não encontrado no catálogo'); return; }
  const compEf = {};
  ['n','p2o5','k2o','s','ca','mg','zn','b','cu','mn'].forEach(k => {
    const v = parseFloat(a[k])||0;
    if (v > 0) compEf[k] = v;
  });
  if (!Object.keys(compEf).length) { toast('⚠️ Adubo sem composição NPK cadastrada'); return; }
  const meses = [...(window.planWIP.meses || [])].sort((a,b) => (a.mes||'').localeCompare(b.mes||''));
  const m = meses[modalAduboMesIdx];
  if (!m) return;
  if (!m.adubos) m.adubos = [];
  if (m.adubos.find(x => x.produtoId === catalogoId)) {
    toast('⚠️ Adubo já adicionado nesse mês');
    return;
  }
  m.adubos.push({
    produtoId: catalogoId,
    nome: a.nome,
    composicao: compEf,
    dose: 0,
    travado: false,
    unidade: a.unidadePadrao || 'kg/ha'
  });
  toast(`✅ ${a.nome} adicionado`);
  fecharModalAdubo();
  renderNovo();
};

// ━━━ CARD OBSERVAÇÕES ━━━

function renderCardObs() {
  const w = window.planWIP;
  return `<div class="card-passo">
    <div class="card-passo-head">
      <div><span class="card-passo-num">5</span><span class="card-passo-tit">Observações</span></div>
      <div class="card-passo-sub">Anotações técnicas, mudanças no plano, condições de campo etc.</div>
    </div>
    <div class="card-passo-body">
      <textarea class="obs-textarea" id="planObs" oninput="window.planWIP.observacoes=this.value" placeholder="Ex: chuva atrasou Out → mudei pra Nov; substitui MAP por SuperTriplo...">${escHtml(w.observacoes||'')}</textarea>
      ${w.status === 'aprovado' || w.status === 'aplicado' ? `<div class="alerta-warn" style="margin-top:9px;">⚠️ Plano já aprovado. Use este campo pra registrar qualquer mudança feita após aprovação.</div>` : ''}
    </div>
  </div>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// APROVAR PLANO — gera planosAdubacao (integração)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

window.aprovarPlanoSafra = async function() {
  if (!podeEditar()) { toast('⛔ Sem permissão.'); return; }
  const w = window.planWIP;
  if (!w.talhaoId) { toast('⚠️ Selecione um talhão.'); return; }
  if (!w.safra) { toast('⚠️ Informe a safra.'); return; }
  if (!temDemandaPreenchida()) { toast('⚠️ Preencha a demanda nutricional.'); return; }
  const meses = w.meses || [];
  if (!meses.length) { toast('⚠️ Adicione pelo menos um mês.'); return; }
  // Verifica se cada mês tem pelo menos 1 adubo
  const mesesSemAdubo = meses.filter(m => !m.adubos || m.adubos.length === 0);
  if (mesesSemAdubo.length) {
    if (!confirm(`${mesesSemAdubo.length} mês(es) sem adubo. Aprovar mesmo assim?`)) return;
  }
  if (!confirm(`Aprovar este planejamento de safra?\n\nO sistema vai criar automaticamente os planos mensais no módulo Adubações.`)) return;
  const btn = document.getElementById('btnAprovarPlano');
  btn.disabled = true; btn.textContent = 'Aprovando...';
  try {
    // 1. Salva o planejamento como "aprovado"
    w.status = 'aprovado';
    await salvarPlanoRascunho(true);  // true = sem toast nem trocar status
    // 2. Gera planosAdubacao
    const talhao = talhoes.find(t => t._docId === w.talhaoId);
    let criados = 0, atualizados = 0;
    for (const m of meses) {
      if (!m.adubos || !m.adubos.length) continue;
      const [ano, mesIdx] = m.mes.split('-').map(Number);
      const mesAno = `${ano}-${String(mesIdx).padStart(2,'0')}`;
      // Aplicação: cada mês vira UMA aplicação com todos os adubos como produtos
      const aplicacao = {
        id: 'pl' + Date.now() + Math.random().toString(36).slice(2,5),
        semana: labelMes(m.mes),
        modo: 'planejamento',
        obs: `Gerado do Planejamento de Safra ${w.safra}`,
        fase: 'producao',
        produtos: m.adubos.map(a => ({
          produto: a.nome,
          dose: parseFloat(a.dose) || 0,
          unidade: 'kg/ha'
        })),
        feito: false,
        origemPlanejamentoId: window.editandoPlanId
      };
      // Procura plano existente do mesmo talhão+mês
      // (precisa do talhao.id interno, não _docId)
      const talhaoIdInterno = talhao?.id || talhao?._docId;
      // Query inline — usa planejamentos_safra mas queremos planosAdubacao
      // Como não temos snapshot ao vivo aqui, faz query manual
      try {
        // Tenta criar — se há um existente do mesmo talhão+mes, vamos updateDoc
        // Como não temos cache local de planosAdubacao, sempre vamos criar um doc novo
        // O módulo de adubações vai fazer merge na visualização
        await addDoc(collection(db,'planosAdubacao'), {
          talhaoId: talhaoIdInterno,
          talhaoNome: talhao?.nome || talhao?.id || '',
          fazenda: talhao?.fazenda || '',
          mesAno,
          mesIdx,
          ano,
          aplicacoes: [aplicacao],
          origemPlanejamentoId: window.editandoPlanId
        });
        criados++;
      } catch(e) {
        console.error('Erro ao criar plano', e);
      }
    }
    // 3. Log
    try {
      await addDoc(collection(db,'logs'), {
        tipo:'planejamento_aprovado',
        mensagem:`${usuarioAtual.email} aprovou planejamento ${w.safra} (${talhao?.fazenda} · ${talhao?.nome}) → ${criados} plano(s) gerado(s)`,
        criadoEm: new Date().toISOString(), uid: usuarioAtual.uid
      });
    } catch(e) {}
    toast(`✅ Planejamento aprovado! ${criados} mês(es) enviado(s) para Adubações.`);
  } catch(e) {
    console.error(e);
    toast('❌ Erro: '+e.message);
    w.status = 'rascunho';
  }
  btn.disabled = false; btn.textContent = '✓ Aprovar';
};

// Eventos do Card 1

window.onTrocaTalhao = function() {
  const id = document.getElementById('selTalhao').value;
  window.planWIP.talhaoId = id;
  // Não limpa demanda — usuário pode trocar talhão mantendo valores se quiser
  renderNovo();
};

window.importarRecomendacao = function(recId) {
  const r = recomendacoes.find(x => x._docId === recId);
  if (!r) { toast('❌ Recomendação não encontrada'); return; }
  // Importa valores APLICAR (não os sugeridos)
  const d = window.planWIP.demanda;
  if (r.n != null) d.n = r.n;
  if (r.p2o5 != null) d.p2o5 = r.p2o5;
  if (r.k2o != null) d.k2o = r.k2o;
  // S/Ca/Mg: não vêm da recomendação direta (só na calagem). Mantém o que está.
  // Micros
  if (r.micros) {
    for (const k of ['zn','b','cu','mn']) {
      const m = r.micros[k];
      if (m && (m.dose !== undefined)) d[k] = m.dose;
    }
  }
  window.planWIP.recomendacaoOrigemId = recId;
  toast('✅ Demanda importada da recomendação');
  renderNovo();
};

window.setDemanda = function(nutId, valor) {
  window.planWIP.demanda[nutId] = parseDose(valor);
  // Se o usuário editar manualmente um valor importado, desliga o flag de origem
  // (mas só se TODOS os valores foram alterados — senão mantém pra manter destaque)
  // Decisão simples: mantém flag de origem mesmo se editar (mostra que veio dali)
};

function temDemandaPreenchida() {
  const d = window.planWIP.demanda;
  return Object.values(d).some(v => v !== null && v !== undefined && v > 0);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SALVAR
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

window.salvarPlanoRascunho = async function(silencioso) {
  if (!podeEditar()) { if (!silencioso) toast('⛔ Sem permissão.'); return false; }
  const w = window.planWIP;
  if (!w.talhaoId) { if (!silencioso) toast('⚠️ Selecione um talhão.'); return false; }
  if (!w.safra || w.safra.trim().length < 4) { if (!silencioso) toast('⚠️ Informe a safra (ex: 2026/2027).'); return false; }
  if (!temDemandaPreenchida()) { if (!silencioso) toast('⚠️ Preencha pelo menos um nutriente da demanda.'); return false; }
  const talhao = talhoes.find(t => t._docId === w.talhaoId);
  const dados = {
    talhaoId: w.talhaoId,
    talhaoNome: talhao?.nome || talhao?.id || '',
    fazenda: talhao?.fazenda || '',
    area: talhao?.area || null,
    safra: w.safra.trim(),
    recomendacaoOrigemId: w.recomendacaoOrigemId || null,
    demanda: w.demanda,
    meses: w.meses || [],
    observacoes: w.observacoes || '',
    status: w.status || 'rascunho',
    atualizadoEm: new Date().toISOString(),
    atualizadoPor: usuarioAtual.email
  };
  try {
    if (window.editandoPlanId) {
      await updateDoc(doc(db,'planejamentos_safra',window.editandoPlanId), dados);
    } else {
      dados.criadoEm = new Date().toISOString();
      dados.criadoPor = usuarioAtual.email;
      const ref = await addDoc(collection(db,'planejamentos_safra'), dados);
      window.editandoPlanId = ref.id;
    }
    if (!silencioso) {
      try {
        await addDoc(collection(db,'logs'), {
          tipo:'planejamento',
          mensagem:`${usuarioAtual.email} salvou planejamento (${dados.fazenda} · ${dados.talhaoNome} · ${dados.safra})`,
          criadoEm: new Date().toISOString(), uid: usuarioAtual.uid
        });
      } catch(e) {}
      toast('✅ Rascunho salvo!');
    }
    return true;
  } catch(e) {
    console.error(e);
    if (!silencioso) toast('❌ Erro: '+e.message);
    return false;
  }
};

window.cancelarNovo = function() {
  if (window.editandoPlanId || temDemandaPreenchida()) {
    if (!confirm('Descartar este planejamento sem salvar?')) return;
  }
  window.editandoPlanId = null;
  const hoje = new Date();
  const ano = hoje.getMonth() >= 6 ? hoje.getFullYear() : hoje.getFullYear() - 1;
  window.planWIP = {
    talhaoId: '', safra: `${ano}/${ano+1}`, area: null,
    recomendacaoOrigemId: null,
    demanda: {n:null, p2o5:null, k2o:null, s:null, ca:null, mg:null, zn:null, b:null, cu:null, mn:null},
    meses: [], observacoes: '', status: 'rascunho'
  };
  renderNovo();
  toast('🗑 Planejamento descartado');
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ABA LISTA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

window.renderLista = function() {
  const cont = document.getElementById('content');
  if (!planejamentos.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🗓️</div><p><strong>Nenhum planejamento salvo ainda.</strong><br>
      <span style="font-size:.78rem;">Vá em "🗓️ Novo" pra criar.</span></p></div>`;
    return;
  }
  const lista = [...planejamentos].sort((a,b) => (b.atualizadoEm||b.criadoEm||'').localeCompare(a.atualizadoEm||a.criadoEm||''));
  cont.innerHTML = lista.map(p => {
    const dosesChips = [];
    const d = p.demanda || {};
    for (const n of NUTRIENTES) {
      const v = d[n.id];
      if (v !== null && v !== undefined && v > 0) dosesChips.push(`${n.lab}: ${fmt(v,0)}`);
    }
    const numMeses = (p.meses && p.meses.length) || 0;
    return `<div class="plan-card plan-card-status-${p.status||'rascunho'}">
      <div class="plan-card-head">
        <div style="flex:1;min-width:0;">
          <div class="plan-card-tit">🗓️ ${escHtml(p.fazenda||'—')} · ${escHtml(p.talhaoNome||'—')}</div>
          <div class="plan-card-meta">
            🌾 Safra ${escHtml(p.safra||'—')} ${p.area?`· ${fmt(p.area,2)} ha`:''}<br>
            <span style="font-size:.65rem;">📅 ${formatarData((p.atualizadoEm||p.criadoEm||'').slice(0,10))} · ${numMeses} mês(es) planejado(s)</span>
          </div>
        </div>
        <span class="plan-status-badge plan-status-${p.status||'rascunho'}">${(p.status||'rascunho').toUpperCase()}</span>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;">
        ${dosesChips.slice(0,8).map(c => `<span style="font-family:'DM Mono',monospace;font-size:.66rem;background:var(--vb);color:var(--ve);padding:2px 7px;border-radius:99px;font-weight:700;border:1px solid var(--v);">${escHtml(c)}</span>`).join('')}
      </div>
      <div class="plan-card-acoes">
        <button class="btn-acao primary" onclick="editarPlano('${p._docId}')">✏️ Continuar</button>
        ${podeEditar() && p.status === 'rascunho' ? '' : ''}
        ${isAdmin() ? `<button class="btn-acao danger" onclick="excluirPlano('${p._docId}')">🗑</button>` : ''}
      </div>
    </div>`;
  }).join('');
};

window.editarPlano = function(id) {
  const p = planejamentos.find(x => x._docId === id);
  if (!p) return;
  window.editandoPlanId = id;
  window.planWIP = {
    talhaoId: p.talhaoId || '',
    safra: p.safra || '',
    area: p.area || null,
    recomendacaoOrigemId: p.recomendacaoOrigemId || null,
    demanda: p.demanda || {n:null,p2o5:null,k2o:null,s:null,ca:null,mg:null,zn:null,b:null,cu:null,mn:null},
    meses: p.meses || [],
    observacoes: p.observacoes || '',
    status: p.status || 'rascunho'
  };
  abrirTab('novo');
  toast('✏️ Editando planejamento');
};

window.excluirPlano = async function(id) {
  if (!isAdmin()) { toast('⛔ Só admin pode excluir.'); return; }
  const p = planejamentos.find(x => x._docId === id);
  if (!p) return;
  if (!confirm(`Excluir planejamento de ${p.fazenda} · ${p.talhaoNome} (${p.safra})?\n\nEsta ação não pode ser desfeita.`)) return;
  try {
    await deleteDoc(doc(db,'planejamentos_safra',id));
    toast('🗑 Planejamento excluído.');
  } catch(e) { toast('❌ Erro: '+e.message); }
};

</script>
