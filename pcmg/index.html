<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: painel de estudo — cabeçalho com status do edital, abas, conteúdo em coluna única (máx. 860px), cronômetro fixo no rodapé. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --ink: #142033; --muted: #5b6678; --line: #d9dfe8;
  --navy: #172a4a; --brass: #a8741a; --brass-soft: #f6ead2;
  --ok: #1f7a46; --ok-soft: #e1f2e8; --bad: #c4231f; --bad-soft: #fde8e7;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1522; --surface: #162033; --ink: #e7ecf4; --muted: #9aa6ba; --line: #2a3750;
  --navy: #0a1221; --brass: #e0a94a; --brass-soft: #3a2e17;
  --ok: #5fcf8e; --ok-soft: #173326; --bad: #ff6b63; --bad-soft: #3d1a1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1522; --surface: #162033; --ink: #e7ecf4; --muted: #9aa6ba; --line: #2a3750;
  --navy: #0a1221; --brass: #e0a94a; --brass-soft: #3a2e17;
  --ok: #5fcf8e; --ok-soft: #173326; --bad: #ff6b63; --bad-soft: #3d1a1a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-bottom: 96px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy) }
a { color: var(--brass) }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { background: var(--navy); color: #eef2f8; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px) }
header.top .wrap { padding-block: 18px 0 }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.badge { width: 42px; height: 42px; flex: none }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: .02em; margin: 0; line-height: 1; text-transform: uppercase }
.brand small { display: block; font-family: var(--font-body); font-size: 12.5px; text-transform: none; letter-spacing: 0; color: #b9c4d6; font-weight: 400; margin-top: 4px }
.edital { margin-left: auto; font-size: 12px; border: 1px solid #c9a35e; color: #f0d9ad; border-radius: 999px; padding: 4px 10px }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 14px; scrollbar-width: none }
nav.tabs::-webkit-scrollbar { display: none }
nav.tabs a { color: #b9c4d6; text-decoration: none; padding: 10px 12px; font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; border-bottom: 3px solid transparent }
nav.tabs a[aria-current="page"] { color: #fff; border-bottom-color: var(--brass) }

main { padding-block: 20px }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 4px; text-wrap: balance }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .02em; margin: 0 0 8px; text-wrap: balance }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 14px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
.stack { display: grid; gap: 14px }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)) }
.grid2 > * { min-width: 0 }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: 14px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--brass) }
.btn.pri { background: var(--brass); border-color: var(--brass); color: #fff }
.btn.pri:hover { filter: brightness(1.08) }
.btn.sm { padding: 5px 9px; font-size: 13px }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line) }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none }
select, input[type=date], input[type=text], input[type=url], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; max-width: 100% }

/* Hoje */
.today-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 14px }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px }
.kpi b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1 }
.kpi span { font-size: 12px; color: var(--muted) }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr) } }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; border-top: 4px solid var(--mc, var(--brass)); display: grid; gap: 10px }
.mcard .mhead { display: flex; justify-content: space-between; gap: 8px; align-items: start }
.mcard .tema { font-size: 14px }
.mcard .done { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
.mcard.feito { opacity: .75 }
.special { background: var(--brass-soft); border: 1px solid var(--brass); border-radius: var(--r); padding: 16px }

/* Cronograma */
.week { margin-bottom: 14px }
.week h3 { font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.day { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px }
.day:last-child { border-bottom: 0 }
.day.hoje { background: var(--brass-soft); border-radius: 8px }
.day .dt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px }
.day .dt b { color: var(--ink); display: block; font-weight: 600 }
.day .chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0 }
.tag-sim { background: var(--navy); color: #fff; border-color: var(--navy) }
.tag-rev { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.check { color: var(--ok); font-weight: 700 }

/* Questões */
.q { display: grid; gap: 12px }
.q .enun { font-size: 16px; line-height: 1.55; white-space: pre-line }
.tag-fgv { background: var(--navy); color: #fff; border-color: var(--navy) }
.tag-ce { background: var(--brass-soft); color: var(--brass); border-color: var(--brass) }
.alts { display: grid; gap: 8px }
.alt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start }
.alt .lt { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--muted) }
.alt:hover:not([disabled]) { border-color: var(--brass) }
.alt[disabled] { cursor: default }
.alt.certa { background: var(--ok-soft); border-color: var(--ok) }
.alt.errada { background: var(--bad-soft); border-color: var(--bad) }
.alt.marcada { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass) }
.exp { border-left: 3px solid var(--ok); padding: 8px 12px; background: var(--bg); border-radius: 0 8px 8px 0; font-size: 14px }
.exp.err { border-left-color: var(--bad) }
.meta { font-size: 12.5px; color: var(--muted) }


/* Flashcards */
.card-flip { min-height: 190px; display: grid; place-items: center; text-align: center; padding: 26px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1.45; width: 100% }
.card-flip.verso { background: var(--brass-soft); border-color: var(--brass) }
.card-flip small { display: block; font-size: 12px; color: var(--muted); margin-top: 12px }

/* Resumo */
.res-sec { margin-bottom: 14px }
.res-sec ul { margin: 0; padding-left: 20px; display: grid; gap: 6px }
.topics { columns: 2 240px; margin: 0; padding-left: 20px; font-size: 14px }

/* Desempenho */
.bar { display: grid; grid-template-columns: 130px 1fr 64px; gap: 10px; align-items: center; font-size: 13.5px; padding: 4px 0 }
.bar .tr { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line) }
.bar .fl { height: 100%; border-radius: 99px }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted) }
@media (max-width: 480px) { .bar { grid-template-columns: 96px 1fr 56px } }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums }
.tscroll { overflow-x: auto }

/* Cronômetro */
.timer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--navy); color: #eef2f8; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -4px 18px rgba(0,0,0,.18) }
.timer .wrap { display: flex; gap: 10px; align-items: center; padding-block: 10px; flex-wrap: wrap }
.timer .clock { font-family: var(--font-mono); font-size: 26px; font-variant-numeric: tabular-nums; min-width: 118px }
.timer select { background: #22385f; border-color: #33507f; color: #fff }
.timer .btn { background: #22385f; border-color: #33507f; color: #fff }
.timer .btn.pri { background: var(--brass); border-color: var(--brass) }
.timer .lbl { font-size: 12px; color: #b9c4d6 }
.timer .run { width: 10px; height: 10px; border-radius: 50%; background: #3a4c6d }
.timer .run.on { background: #ff5a52; animation: pulse 1.2s infinite }
@keyframes pulse { 50% { opacity: .35 } }
@media (prefers-reduced-motion: reduce) { .timer .run.on { animation: none } }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30 }
.sync { font-size: 12px; color: var(--muted) }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0 }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="badge" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 41 9v14c0 11-7 18.5-17 22C14 41.5 7 34 7 23V9z" fill="#a8741a"/><path d="M24 8 36 12.4V23c0 8-5 13.6-12 16.4C17 36.6 12 31 12 23V12.4z" fill="#172a4a"/><path d="m24 15 2.6 5.3 5.8.8-4.2 4.1 1 5.8L24 28.3 18.8 31l1-5.8-4.2-4.1 5.8-.8z" fill="#f0d9ad"/></svg>

    <span class="clock" id="tClock">00:00:00</span>
    <select id="tMat" aria-label="Matéria do cronômetro"></select>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="dados.js"></script>
<script src="prova2025.js"></script>
<script src="extra.js"></script>
<script>
(function () {
const D = window.PCMG;
const M = Object.fromEntries(D.materias.map(m => [m.id, m]));
const LETRAS = 'ABCDE';
const INTERV = [0, 1, 3, 7, 15, 30];
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

// ---------- estado ----------
const LS = 'pcmg-estado-v1';
function novo() { return { v: 1, ts: 0, inicio: '2026-11-30', sess: [], resp: {}, cards: {}, sims: [], links: {}, feitos: {}, timer: null }; }
let S = novo();
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(novo(), JSON.parse(raw)); } catch (e) {}
let db = null, docRef = null, syncMsg = 'Progresso salvo neste aparelho';
let saveT = null, writing = false, dirty = false;
function salvar() {
  S.ts = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  dirty = true; clearTimeout(saveT); saveT = setTimeout(enviar, 1500);
}
async function enviar() {
  if (!docRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await docRef.set(JSON.parse(JSON.stringify(S))); syncMsg = 'Sincronizado na sua conta'; }
  catch (e) { syncMsg = 'Salvo só neste aparelho (sincronização indisponível)'; }
  writing = false; if (dirty) enviar();
  const el = document.getElementById('sync'); if (el) el.textContent = syncMsg;
}
(async function conectar() {
  try {
    if (!window.claude || !claude.use) return;
    const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    db = d; docRef = db.doc('data/users/' + id + '/estado');
    const snap = await docRef.get();
    const remoto = snap.exists ? snap.data() : null;
    if (remoto && (remoto.ts || 0) > (S.ts || 0)) {
      S = Object.assign(novo(), JSON.parse(JSON.stringify(remoto)));
      try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
      syncMsg = 'Sincronizado na sua conta'; render(); montarTimer();
    } else { syncMsg = 'Sincronizado na sua conta'; if (S.ts) { dirty = true; enviar(); } }
    const el = document.getElementById('sync'); if (el) el.textContent = syncMsg;
  } catch (e) {}
})();

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : null;
function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDias(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function br(s) { const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; }
const HOJE = () => iso(new Date());
function hms(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return [h, m, s].map(x => String(x).padStart(2, '0')).join(':'); }
function hm(sec) { const h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60); return h ? h + 'h' + String(m).padStart(2, '0') : m + 'min'; }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function chip(id) { const m = M[id]; return `<span class="chip"><span class="dot" style="background:${m.cor}"></span>${esc(m.curto)}</span>`; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- cronograma ----------
// Dia 15, 30, 45... = simulado. Domingo = revisão. Demais dias = próximo par do ciclo.
function plano(nDias) {
  const out = []; let k = 0; const cont = {};
  for (let i = 0; i < nDias; i++) {
    const data = addDias(S.inicio, i); const wd = parse(data).getDay();
    if ((i + 1) % 15 === 0) out.push({ data, tipo: 'sim', n: (i + 1) / 15 });
    else if (wd === 0) out.push({ data, tipo: 'rev' });
    else {
      const par = D.ciclo[k % D.ciclo.length]; k++;
      const temas = par.map(m => { cont[m] = (cont[m] || 0); const t = M[m].topicos[cont[m] % M[m].topicos.length]; cont[m]++; return t; });
      out.push({ data, tipo: 'est', par, temas });
    }
  }
  return out;
}
function diaDe(data) {
  const i = Math.round((parse(data) - parse(S.inicio)) / 864e5);
  if (i < 0) return { data, tipo: 'antes' };
  return plano(i + 1)[i];
}

// ---------- tempo ----------
function tempoPor(filtro) { const r = {}; S.sess.forEach(s => { if (!filtro || filtro(s)) r[s.m] = (r[s.m] || 0) + s.s; }); return r; }
function tempoHoje() { const h = HOJE(); return Object.values(tempoPor(s => s.d === h)).reduce((a, b) => a + b, 0) + (S.timer && S.timer.ini ? (Date.now() - S.timer.ini) / 1000 + (S.timer.acc || 0) : (S.timer ? S.timer.acc || 0 : 0)); }

// ---------- flashcards ----------
function cardsDevidos(m) { const h = HOJE(); return D.flash.filter(f => (!m || f.m === m) && (!S.cards[f.id] || S.cards[f.id].due <= h)); }

// ---------- roteamento ----------
const VIEWS = { hoje: vHoje, cronograma: vCrono, materias: vMaterias, questoes: vQuestoes, flashcards: vFlash, simulados: vSim, leiseca: vLei, desempenho: vDes };
let UI = { mat: 'port', qMat: '', qOrig: '', qErr: false, qIdx: 0, qLista: null, fMat: '', fVerso: false, fIdx: 0, sim: null, semanas: 6 };
function rota() { const h = (location.hash || '#hoje').slice(1); return VIEWS[h] ? h : 'hoje'; }
function render() {
  const r = rota();
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + r ? 'page' : 'false'));
  $('#app').innerHTML = VIEWS[r]();
  const fn = AFTER[r]; if (fn) fn();
}
const AFTER = {};
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

// ---------- HOJE ----------
function vHoje() {
  const h = HOJE(); const dia = diaDe(h);
  const resps = Object.values(S.resp).filter(r => r.d === h);
  const ac = resps.filter(r => r.ok).length;
  const prox = plano(400).find(d => d.tipo === 'sim' && d.data >= h);
  const diasSim = prox ? Math.round((parse(prox.data) - parse(h)) / 864e5) : null;
  const dev = cardsDevidos().length;
  const nDia = Math.round((parse(h) - parse(S.inicio)) / 864e5) + 1;
  let corpo = '';
  if (dia.tipo === 'antes') {
    corpo = `<div class="special"><h3>O plano começa em ${br(S.inicio)}</h3><p style="margin:0">Até lá, adiante a leitura do edital passado e a lei seca. Você pode mudar a data de início em Desempenho → Ajustes.</p></div>`;
  } else if (dia.tipo === 'sim') {
    corpo = `<div class="special"><h3>Dia de simulado nº ${dia.n}</h3><p style="margin:0 0 10px">Faça o simulado de uma vez, cronometrado, como na prova. Depois revise cada erro.</p><a class="btn pri" href="#simulados">Abrir simulado</a></div>`;
  } else if (dia.tipo === 'rev') {
    corpo = `<div class="special"><h3>Domingo de revisão</h3><p style="margin:0 0 10px">Sem matéria nova. Zere os flashcards pendentes, refaça as questões que você errou na semana e releia a lei seca da semana.</p><div class="row"><a class="btn pri" href="#flashcards">Flashcards (${dev})</a><button class="btn" data-act="erradas">Refazer erradas</button><a class="btn" href="#leiseca">Lei seca</a></div></div>`;
  } else {
    corpo = `<div class="grid2">${dia.par.map((m, i) => mcard(m, dia.temas[i], h)).join('')}</div>`;
  }
  return `<div class="today-head"><div><h2>Hoje · ${DIAS[parse(h).getDay()]} ${br(h)}</h2><p class="sub" style="margin:0">${dia.tipo === 'antes' ? 'Plano ainda não iniciado' : 'Dia ' + nDia + ' do plano'} · <span id="sync" class="sync">${esc(syncMsg)}</span></p></div></div>
  <div class="kpis">
    <div class="kpi"><b id="kTempo">${hm(tempoHoje())}</b><span>estudado hoje</span></div>
    <div class="kpi"><b>${resps.length ? Math.round(ac / resps.length * 100) + '%' : '—'}</b><span>${resps.length} questões hoje</span></div>
    <div class="kpi"><b>${dev}</b><span>flashcards pendentes</span></div>

function latin(s) { return String(s).replace(/→/g, '->').replace(/∧/g, ' e ').replace(/∨/g, ' ou ').replace(/≡/g, '=').replace(/≈/g, '~').replace(/[—–]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/·/g, '.').replace(/[^\x00-\xFF]/g, ''); }
async function baixarPdf(mid, dl) {

// ---------- SIMULADOS ----------
// fgv: 70 questões na proporção do edital, metade da prova oficial e metade inéditas (quando houver);
// prova: a prova FGV 2025 inteira, na ordem; ce: todos os itens certo/errado (um errado anula um certo).
function montarSim(tipo) {
  const qs = [];
  if (tipo === 'prova') D.questoes.filter(q => q.fgv).sort((a, b) => a.fgv - b.fgv).forEach(q => qs.push(q.id));
  else if (tipo === 'ce') D.materias.forEach(m => shuffle(D.questoes.filter(q => q.ce && q.m === m.id)).forEach(q => qs.push(q.id)));
  else D.materias.forEach(m => {
    const of = shuffle(D.questoes.filter(q => q.m === m.id && q.fgv)), ine = shuffle(D.questoes.filter(q => q.m === m.id && !q.fgv && !q.ce));
    const metade = Math.ceil(m.q / 2); let pick = of.slice(0, metade); pick = pick.concat(ine.slice(0, m.q - pick.length));
    if (pick.length < m.q) pick = pick.concat(of.slice(metade, metade + m.q - pick.length));
    pick.forEach(q => qs.push(q.id));
  });
  return { tipo: tipo || 'fgv', ids: qs, resp: {}, ini: Date.now(), fim: null };
}
function vSim() {
  const sim = UI.sim; const h = HOJE();
  const prox = plano(400).filter(d => d.tipo === 'sim' && d.data >= h).slice(0, 3);
  const hist = S.sims.slice().reverse().map(s => `<tr><td>${br(s.d)} ${s.tipo === 'ce' ? '(C/E)' : s.tipo === 'prova' ? '(FGV 25)' : ''}</td><td>${s.tipo === 'ce' ? 'nota ' + (s.ac - (s.er || 0)) : s.ac + '/' + s.tot}</td><td>${Math.round(s.ac / s.tot * 100)}%</td><td>${hm(s.dur)}</td></tr>`).join('');
  if (!sim) return `<h2>Simulados</h2><p class="sub">Um a cada 15 dias. <b>FGV:</b> 70 questões, 4 horas, mesclando a prova oficial de 2025 com inéditas. <b>Cebraspe:</b> itens certo/errado, em que cada item errado anula um certo (deixe em branco quando não souber). Distribuição do FGV igual à do edital passado (Português 10, Informática 8, RLM 6, Lei Orgânica 6, Constitucional 6, Administrativo 6, Penal 5, Processo Penal 5, Medicina Legal 5, Criminologia 5, Legislação 4, Direitos Humanos 4), limitada às questões que o banco já tem.</p>
  <div class="grid2"><div class="panel"><h3>Próximos</h3>${prox.map(d => `<div class="row" style="justify-content:space-between;padding:4px 0"><span>Simulado nº ${d.n}</span><span class="meta">${br(d.data)}</span></div>`).join('')}<div class="row" style="margin-top:10px"><button class="btn pri" data-act="simgo" data-t="fgv">Simulado FGV (70 questões, 4 h)</button><button class="btn" data-act="simgo" data-t="prova">Prova oficial FGV 2025</button><button class="btn" data-act="simgo" data-t="ce">Simulado Cebraspe (certo/errado)</button></div></div>
  <div class="panel"><h3>Histórico</h3>${hist ? `<div class="tscroll"><table><thead><tr><th>Data</th><th>Acertos</th><th>%</th><th>Tempo</th></tr></thead><tbody>${hist}</tbody></table></div>` : '<div class="empty">Nenhum simulado feito ainda.</div>'}</div></div>`;
  const qs = sim.ids.map(id => D.questoes.find(q => q.id === id));
  const fim = !!sim.fim; let ac = 0;
  const html = qs.map((q, n) => { const r = sim.resp[q.id]; if (fim && r === q.c) ac++;
    return `<div class="panel q" id="s${n}"><div class="row" style="justify-content:space-between"><b>${sim.tipo === 'ce' ? 'Item' : 'Questão'} ${n + 1}</b><span>${chip(q.m)} ${tagQ(q)}</span></div><div class="enun">${esc(q.e)}</div><div class="alts">${q.a.map((t, i) => { let c = ''; if (fim) { if (i === q.c) c = 'certa'; else if (i === r) c = 'errada'; } else if (i === r) c = 'marcada'; return `<button class="alt ${c}" data-act="smark" data-q="${q.id}" data-i="${i}" ${fim ? 'disabled' : ''}><span class="lt">${lt(q, i)}</span><span>${esc(t)}</span></button>`; }).join('')}</div>${fim ? `<div class="exp ${r === q.c ? '' : 'err'}">${r == null ? 'Em branco. ' : ''}Gabarito ${q.ce ? q.a[q.c] : LETRAS[q.c]}. ${esc(q.x)}</div>` : ''}</div>`; }).join('');
  const resp = Object.keys(sim.resp).length;
  return `<h2>Simulado em andamento</h2><p class="sub">${qs.length} questões · ${fim ? (sim.tipo === 'ce' ? `Resultado: <b>${ac} certos − ${Object.keys(sim.resp).length - ac} errados = nota ${2 * ac - Object.keys(sim.resp).length}</b>` : `Resultado: <b>${ac}/${qs.length} (${Math.round(ac / qs.length * 100)}%)</b>`) : `respondidas ${resp}/${qs.length} · tempo <span id="simClock">${hms((Date.now() - sim.ini) / 1000)}</span>`}</p>
  <div class="stack">${html}</div>
  <div class="row" style="margin-top:14px">${fim ? '<button class="btn pri" data-act="simsair">Fechar simulado</button>' : `<button class="btn pri" data-act="simfim">Entregar simulado</button>`}</div>`;
}

// ---------- LEI SECA ----------
function vLei() {
  const leis = [['Constituição Federal', D.materias.find(m => m.id === 'const').lei.u], ['Código Penal (compilado)', 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'], ['Código de Processo Penal (compilado)', 'https://www.planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm'], ['LC 129/2013 — Lei Orgânica da PCMG', 'https://www.almg.gov.br/legislacao-mineira/texto/LCP/129/2013/'], ['Lei 14.735/2023 — Lei Orgânica Nacional das Polícias Civis', 'https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14735.htm'], ['Lei de Drogas 11.343/2006', 'https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11343.htm'], ['Crimes Hediondos 8.072/1990', 'https://www.planalto.gov.br/ccivil_03/leis/l8072.htm'], ['Maria da Penha 11.340/2006', 'https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm'], ['Estatuto do Desarmamento 10.826/2003', 'https://www.planalto.gov.br/ccivil_03/leis/2003/l10.826.htm'], ['Organizações Criminosas 12.850/2013', 'https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/lei/l12850.htm'], ['Tortura 9.455/1997', 'https://www.planalto.gov.br/ccivil_03/leis/l9455.htm'], ['Abuso de Autoridade 13.869/2019', 'https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13869.htm'], ['Racismo e injúria racial 7.716/1989', 'https://www.planalto.gov.br/ccivil_03/leis/l7716.htm'], ['Improbidade Administrativa 8.429/1992', 'https://www.planalto.gov.br/ccivil_03/leis/l8429.htm'], ['Licitações 14.133/2021', 'https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm'], ['Execução Penal 7.210/1984', 'https://www.planalto.gov.br/ccivil_03/leis/l7210.htm'], ['Interceptação Telefônica 9.296/1996', 'https://www.planalto.gov.br/ccivil_03/leis/l9296.htm'], ['Prisão Temporária 7.960/1989', 'https://www.planalto.gov.br/ccivil_03/leis/l7960.htm'], ['Uso da força 13.060/2014', 'https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l13060.htm']];
  return `<h2>Lei seca</h2><p class="sub">Textos compilados do Planalto, já com as alterações. Os resumos de cada matéria trazem a redação em vigor.</p>
  <div class="stack">
  <div class="panel"><h3>Textos compilados para leitura</h3><div class="grid2" style="gap:6px">${leis.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join('')}</div>
  <p class="meta" style="margin-top:10px">Resumos escritos com a legislação em vigor até meados de 2026. Para leis publicadas depois disso, confira a <a href="https://www4.planalto.gov.br/legislacao/" target="_blank" rel="noopener">legislação recente no Planalto ↗</a> antes da prova.</p></div></div>`;
}

// ---------- DESEMPENHO ----------
function vDes() {
  const tt = tempoPor(); const max = Math.max(1, ...Object.values(tt));
  const semIni = addDias(HOJE(), -6); const ts = tempoPor(s => s.d >= semIni);
  const totS = Object.values(ts).reduce((a, b) => a + b, 0), tot = Object.values(tt).reduce((a, b) => a + b, 0);
  const porM = {}; Object.entries(S.resp).forEach(([id, r]) => { const q = D.questoes.find(x => x.id === id); if (!q) return; porM[q.m] = porM[q.m] || [0, 0]; porM[q.m][1]++; if (r.ok) porM[q.m][0]++; });
  const barsT = D.materias.map(m => `<div class="bar"><span>${esc(m.curto)}</span><span class="tr"><span class="fl" style="display:block;width:${(tt[m.id] || 0) / max * 100}%;background:${m.cor}"></span></span><span class="v">${hm(tt[m.id] || 0)}</span></div>`).join('');
  const barsA = D.materias.map(m => { const p = porM[m.id]; const pc = p ? Math.round(p[0] / p[1] * 100) : null; return `<div class="bar"><span>${esc(m.curto)}</span><span class="tr"><span class="fl" style="display:block;width:${pc || 0}%;background:${pc == null ? 'transparent' : pc >= 70 ? 'var(--ok)' : pc >= 50 ? 'var(--brass)' : 'var(--bad)'}"></span></span><span class="v">${pc == null ? '—' : pc + '%'}</span></div>`; }).join('');
  const ultimas = S.sess.slice(-8).reverse().map(s => `<tr><td>${br(s.d)}</td><td>${esc(M[s.m] ? M[s.m].curto : s.m)}</td><td>${hm(s.s)}</td></tr>`).join('');
  return `<h2>Desempenho</h2><p class="sub">${hm(totS)} nos últimos 7 dias · ${hm(tot)} no total · <span id="sync" class="sync">${esc(syncMsg)}</span></p>
  <div class="grid2"><div class="panel"><h3>Horas por matéria</h3>${barsT}</div><div class="panel"><h3>Acerto por matéria</h3>${barsA}<p class="meta">Verde ≥ 70% · âmbar 50–69% · vermelho &lt; 50%. Abaixo de 70%, reforce a matéria na revisão de domingo.</p></div></div>
  <div class="grid2" style="margin-top:14px"><div class="panel"><h3>Últimas sessões</h3>${ultimas ? `<div class="tscroll"><table><tbody>${ultimas}</tbody></table></div>` : '<div class="empty">Ligue o cronômetro para registrar a primeira sessão.</div>'}</div>
  <div class="panel"><h3>Ajustes</h3><div class="stack" style="gap:10px"><label>Início do plano<br><input type="date" id="dIni" value="${S.inicio}"></label>
  <div><span class="label">Cópia de segurança</span><div class="row" style="margin-top:6px"><button class="btn sm" data-act="exp">Copiar meus dados</button><button class="btn sm" data-act="impshow">Restaurar cópia</button></div></div>
  <div id="impBox" hidden><textarea id="impTxt" rows="3" style="width:100%" placeholder="Cole aqui a cópia"></textarea><button class="btn sm" data-act="imp">Restaurar</button></div>
  <div><button class="btn sm" data-act="zerar1">Apagar todo o progresso</button><span id="zerar2" hidden> <button class="btn sm" style="border-color:var(--bad);color:var(--bad)" data-act="zerar">Confirmar: apagar tudo</button></span></div></div></div></div>`;
}
AFTER.desempenho = () => { const i = $('#dIni'); i.onchange = () => { if (i.value) { S.inicio = i.value; salvar(); toast('Início alterado'); } }; };

// ---------- ações ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, m = el.dataset.m;
  if (a === 'estudar') { iniciarTimer(m); }
  else if (a === 'feito') { const h = HOJE(); S.feitos[h] = S.feitos[h] || {}; S.feitos[h][m] = el.checked; salvar(); render(); }
  else if (a === 'vermat') { UI.mat = m; }
  else if (a === 'vqs') { UI.qMat = m; UI.qErr = false; UI.qLista = null; UI.resposta = null; }
  else if (a === 'erradas') { UI.qMat = ''; UI.qErr = true; UI.qLista = null; UI.resposta = null; location.hash = '#questoes'; }
  else if (a === 'maissem') { UI.semanas += 4; render(); }
  else if (a === 'addlink') { const n = $('#lN').value.trim(), u = safeUrl($('#lU').value.trim()); if (!n || !u) { toast('Informe o nome e um link https://'); return; } (S.links[UI.mat] = S.links[UI.mat] || []).unshift({ n, u }); salvar(); render(); toast('Link adicionado'); }
  else if (a === 'rmlink') { S.links[UI.mat].splice(+el.dataset.i, 1); salvar(); render(); }
  else if (a === 'resp') { const q = D.questoes.find(x => x.id === UI.qLista[UI.qIdx]); const i = +el.dataset.i; UI.resposta = i; const prev = S.resp[q.id]; S.resp[q.id] = { ok: i === q.c, n: (prev ? prev.n : 0) + 1, d: HOJE() }; salvar(); render(); }
  else if (a === 'qnext') { UI.resposta = null; if (UI.qIdx + 1 < UI.qLista.length) UI.qIdx++; else UI.qLista = null; render(); }
  else if (a === 'qprev') { UI.resposta = null; UI.qIdx = Math.max(0, UI.qIdx - 1); render(); }
  else if (a === 'virar') { UI.fVerso = !UI.fVerso; render(); }
  else if (a === 'fok' || a === 'ferr') { const id = el.dataset.id; const c = S.cards[id] || { b: 0 }; const b = a === 'fok' ? Math.min(5, c.b + 1) : 1; S.cards[id] = { b, due: addDias(HOJE(), a === 'fok' ? INTERV[b] : 0) }; if (a === 'ferr') { const f = D.flash.find(x => x.id === id); S.cards[id].due = HOJE(); S.cards[id].t = Date.now(); } UI.fVerso = false; salvar(); ordenarErrados(); render(); }
  else if (a === 'simgo') { UI.sim = montarSim(el.dataset.t); render(); window.scrollTo(0, 0); }
  else if (a === 'smark') { UI.sim.resp[el.dataset.q] = +el.dataset.i; render(); }
  else if (a === 'simfim') { const sim = UI.sim; sim.fim = Date.now(); let ac = 0; sim.ids.forEach(id => { const q = D.questoes.find(x => x.id === id); const r = sim.resp[id]; if (r === q.c) ac++; if (r != null) { const prev = S.resp[id]; S.resp[id] = { ok: r === q.c, n: (prev ? prev.n : 0) + 1, d: HOJE() }; } }); const er = sim.ids.filter(id => sim.resp[id] != null && sim.resp[id] !== D.questoes.find(x => x.id === id).c).length; S.sims.push({ d: HOJE(), tipo: sim.tipo, ac, er, tot: sim.ids.length, dur: Math.round((sim.fim - sim.ini) / 1000) }); salvar(); render(); window.scrollTo(0, 0); toast('Simulado corrigido'); }
  else if (a === 'simsair') { UI.sim = null; render(); }
  else if (a === 'exp') { const txt = JSON.stringify(S); navigator.clipboard.writeText(txt).then(() => toast('Cópia copiada. Guarde num bloco de notas.')).catch(() => { $('#impBox').hidden = false; $('#impTxt').value = txt; $('#impTxt').select(); toast('Selecione e copie o texto'); }); }
  else if (a === 'impshow') { $('#impBox').hidden = false; }
  else if (a === 'imp') { try { const o = JSON.parse($('#impTxt').value); if (!o || o.v !== 1) throw 0; S = Object.assign(novo(), o); salvar(); render(); montarTimer(); toast('Cópia restaurada'); } catch (err) { toast('Texto inválido: cole a cópia completa'); } }
  else if (a === 'zerar1') { $('#zerar2').hidden = false; }
  else if (a === 'zerar') { S = novo(); salvar(); render(); montarTimer(); toast('Progresso apagado'); }
});
function ordenarErrados() { /* cartões errados voltam ao fim da fila de hoje */ const h = HOJE(); D.flash.sort((x, y) => ((S.cards[x.id] && S.cards[x.id].t) || 0) - ((S.cards[y.id] && S.cards[y.id].t) || 0)); }

// ---------- cronômetro ----------
function montarTimer() {
  const sel = $('#tMat');
  sel.innerHTML = D.materias.map(m => `<option value="${m.id}">${esc(m.curto)}</option>`).join('');
  const h = HOJE(); const dia = diaDe(h);
  sel.value = S.timer ? S.timer.m : (dia.tipo === 'est' ? dia.par[0] : 'port');
  atualizarTimer();
}
function segTimer() { if (!S.timer) return 0; return (S.timer.acc || 0) + (S.timer.ini ? (Date.now() - S.timer.ini) / 1000 : 0); }
function atualizarTimer() {
  const on = !!(S.timer && S.timer.ini);
  $('#tClock').textContent = hms(segTimer());
  $('#tRun').classList.toggle('on', on);
  $('#tGo').textContent = on ? 'Pausar' : (S.timer ? 'Continuar' : 'Iniciar');
  $('#tStop').disabled = !S.timer;
  const hoje = tempoPor(s => s.d === HOJE());
  const m = $('#tMat').value; $('#tInfo').textContent = 'Hoje em ' + (M[m] ? M[m].curto : '') + ': ' + hm((hoje[m] || 0) + (S.timer && S.timer.m === m ? segTimer() : 0));
  const k = $('#kTempo'); if (k) k.textContent = hm(tempoHoje());
  const sc = $('#simClock'); if (sc && UI.sim && !UI.sim.fim) sc.textContent = hms((Date.now() - UI.sim.ini) / 1000);
}
function iniciarTimer(m) {
  if (S.timer && S.timer.m !== m) fecharSessao();
  $('#tMat').value = m;
  if (!S.timer) S.timer = { m, acc: 0, ini: Date.now(), d: HOJE() };
  else if (!S.timer.ini) S.timer.ini = Date.now();
  salvar(); atualizarTimer(); toast('Cronômetro: ' + M[m].curto);
}
function fecharSessao() {
  if (!S.timer) return; const s = Math.round(segTimer());
  if (s >= 30) S.sess.push({ d: S.timer.d || HOJE(), m: S.timer.m, s });
  S.timer = null; salvar();
  return s;
}
$('#tGo').onclick = () => {
  if (S.timer && S.timer.ini) { S.timer.acc = segTimer(); S.timer.ini = null; salvar(); atualizarTimer(); }
  else iniciarTimer($('#tMat').value);
};
$('#tStop').onclick = () => { const s = fecharSessao(); atualizarTimer(); render(); toast(s >= 30 ? 'Sessão salva: ' + hm(s) : 'Sessão muito curta, não salva'); };
$('#tMat').onchange = () => { if (S.timer && S.timer.m !== $('#tMat').value) { const was = !!S.timer.ini; const s = fecharSessao(); if (was) iniciarTimer($('#tMat').value); else atualizarTimer(); if (s >= 30) toast('Sessão anterior salva'); } else atualizarTimer(); };
setInterval(atualizarTimer, 1000);

montarTimer(); render();
})();
</script>
