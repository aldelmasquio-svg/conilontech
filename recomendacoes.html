<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conilon Tech · Recomendações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--v:#2d6a2d;--ve:#1a3d1a;--vb:#e8f5e8;--c:#6b7280;--cb:#d1d5db;--cl:#f3f4f6;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--blue:#3b82f6;--purple:#8b5cf6;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:#f0f4f0;color:var(--t);min-height:100dvh;display:flex;flex-direction:column;}

.loading-screen{position:fixed;inset:0;background:#f0f4f0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--v);font-size:1.1rem;letter-spacing:.04em;}

/* HEADER */
.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:200;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-titles{line-height:1;}
.header-title-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;}
.header-title-sub{font-size:.65rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.header-user{font-size:.78rem;color:rgba(255,255,255,.85);}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-icon-header{background:rgba(255,255,255,.12);border:none;color:white;font-size:18px;width:38px;height:38px;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;margin-left:8px;}

/* MENU LATERAL */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-header{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-user-nome{color:white;font-weight:700;font-size:.95rem;}
.menu-user-email{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:2px;}
.menu-body{flex:1;padding:10px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:1.1rem;}
.menu-footer{padding:14px;}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

.app-main{display:flex;flex-direction:column;}

/* TABS DE TOPO (Nova | Lista) */
.tabs-top{display:flex;background:white;border-bottom:2px solid var(--cb);flex-shrink:0;position:sticky;top:54px;z-index:199;}
.tab-top{flex:1;padding:13px 8px;border:none;background:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-top.ativa{color:var(--v);border-bottom-color:var(--v);}

/* CABEÇALHO STICKY DA RECOMENDAÇÃO */
.rec-sticky{background:white;border-bottom:1px solid var(--cb);padding:10px 12px;flex-shrink:0;position:sticky;top:94px;z-index:197;box-shadow:0 2px 6px rgba(0,0,0,.04);}
.rec-sticky-row{display:flex;gap:7px;flex-wrap:wrap;}
.rec-sticky-col{flex:1;min-width:120px;}
.rec-sticky-col label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;text-transform:uppercase;color:var(--c);letter-spacing:.04em;margin-bottom:3px;}
.rec-sticky-col select,.rec-sticky-col input{width:100%;border:1.5px solid var(--cb);border-radius:7px;padding:7px 9px;font-size:.85rem;font-family:'Barlow',sans-serif;outline:none;background:white;color:var(--ve);font-weight:600;}
.rec-sticky-col select:focus,.rec-sticky-col input:focus{border-color:var(--v);}
.rec-hist-prod{font-size:.65rem;color:var(--c);margin-top:3px;font-style:italic;}

/* CONTEÚDO ROLÁVEL */
.content{padding:12px 14px 200px;}
.content > *{margin-bottom:10px;}
.content > *:last-child{margin-bottom:0;}
.content::-webkit-scrollbar{width:8px;}
.content::-webkit-scrollbar-thumb{background:var(--cb);border-radius:4px;}
.content::-webkit-scrollbar-track{background:transparent;}

/* Garante que os cards nunca colapsem */
.card-rec-body{display:block;}
.card-rec.fechado .card-rec-body{display:none !important;}

/* CARDS COLAPSÁVEIS */
.card-rec{display:block;width:100%;background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;}
.card-rec-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:#fafafa;border-bottom:1px solid var(--cl);user-select:none;-webkit-user-select:none;}
.card-rec.fechado .card-rec-head{border-bottom:none;}
.card-rec-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;color:var(--ve);display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.card-rec-sub{font-size:.7rem;color:var(--c);font-weight:600;}
.card-rec-toggle{background:none;border:none;color:var(--c);font-size:1.1rem;cursor:pointer;padding:5px 8px;transition:transform .2s;pointer-events:none;}
.card-rec.fechado .card-rec-toggle{transform:rotate(-90deg);}
.card-rec-body{padding:14px;display:block;}
.card-rec.fechado .card-rec-body{display:none !important;}

/* DESTAQUES (resultados) */
.dose-grande{font-family:'DM Mono',monospace;font-weight:700;font-size:1.6rem;color:var(--ve);line-height:1;}

/* AJUSTE DE DOSE (sugerido vs aplicar) */
.dose-box{background:var(--vb);border:1px solid var(--v);border-radius:8px;padding:11px;margin-bottom:9px;}
.dose-box.ajustada{background:#fffbeb;border-color:#f59e0b;}
.dose-linhas{display:flex;gap:10px;align-items:stretch;}
.dose-col-sug{flex:1;text-align:center;padding:5px 8px;border-right:1px dashed var(--cb);}
.dose-col-apl{flex:1.2;text-align:center;padding:5px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.dose-label{font-size:.62rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.dose-sug-val{font-family:'DM Mono',monospace;font-weight:700;font-size:1.5rem;color:var(--c);line-height:1;margin-top:3px;}
.dose-apl-inp{font-family:'DM Mono',monospace;font-weight:800;font-size:1.6rem;color:var(--ve);text-align:center;border:2px solid var(--v);border-radius:6px;padding:5px 6px;width:100%;max-width:120px;outline:none;background:white;}
.dose-apl-inp:focus{box-shadow:0 0 0 3px var(--vb);}
.dose-box.ajustada .dose-apl-inp{border-color:#f59e0b;color:#92400e;}
.dose-un-small{font-size:.7rem;color:var(--c);margin-top:-2px;}
.tag-ajustada{display:inline-flex;align-items:center;gap:3px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:1px 7px;border-radius:99px;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.btn-restaurar{background:none;border:1px dashed var(--cb);color:var(--c);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.66rem;padding:3px 8px;border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
.btn-restaurar:hover{background:var(--cl);color:var(--ve);border-style:solid;}
.dose-unidade{font-size:.75rem;color:var(--c);margin-left:4px;font-weight:600;}
.dose-zero{color:var(--c);}
.dose-explica{font-size:.75rem;color:var(--c);line-height:1.5;margin-top:5px;}
.dose-explica strong{color:var(--ve);}

/* TAGS DE CLASSIFICAÇÃO */
.cls-tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.66rem;color:white;font-weight:700;letter-spacing:.02em;}
.cls-muitoBaixo,.cls-mb{background:#991b1b;}
.cls-baixo,.cls-bx{background:#dc2626;}
.cls-medio,.cls-md{background:#16a34a;}
.cls-alto,.cls-at{background:#2563eb;}
.cls-muitoAlto,.cls-ma{background:#7c3aed;}
.cls-adequado,.cls-ad{background:#16a34a;}
.cls-ideal,.cls-id{background:#16a34a;}

/* GRID DE PARÂMETROS DA ANÁLISE (resumo) */
.params-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;}
.param-mini{background:#fafafa;border:1px solid var(--cl);border-radius:7px;padding:7px 9px;}
.param-mini-lab{font-size:.62rem;color:var(--c);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.param-mini-val{font-family:'DM Mono',monospace;font-weight:700;font-size:.95rem;color:var(--ve);margin-top:2px;}
.param-mini-cls{margin-top:3px;}

/* INPUTS DENTRO DOS CARDS */
.inp-linha{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.inp-linha label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.74rem;color:var(--c);text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:90px;}
.inp-linha input,.inp-linha select{border:1.5px solid var(--cb);border-radius:6px;padding:6px 9px;font-size:.85rem;font-family:'DM Mono',monospace;background:white;outline:none;width:80px;text-align:right;}
.inp-linha select{width:140px;text-align:left;font-family:'Barlow',sans-serif;font-weight:600;}
.inp-linha input:focus,.inp-linha select:focus{border-color:var(--v);}
.inp-linha-un{font-size:.7rem;color:var(--c);font-family:'DM Mono',monospace;}

/* BOTÕES SEGMENTADOS (escolha de método) */
.seg-btns{display:flex;background:#fafafa;border:1px solid var(--cb);border-radius:7px;padding:3px;gap:3px;margin-bottom:9px;}
.seg-btn{flex:1;border:none;background:transparent;padding:7px 9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;color:var(--c);border-radius:5px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}
.seg-btn.ativo{background:var(--v);color:white;box-shadow:0 1px 4px rgba(45,106,45,.3);}

/* FÓRMULAS */
.formula-box{background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:7px;padding:8px 11px;font-family:'DM Mono',monospace;font-size:.74rem;color:#92400e;line-height:1.55;margin:8px 0;overflow-x:auto;}
.formula-box strong{font-family:'Barlow Condensed',sans-serif;color:#78350f;}

/* ALERTAS */
.alerta-tec{background:#fef3c7;border:1px solid #fde68a;border-left:4px solid var(--warn);border-radius:7px;padding:8px 11px;font-size:.78rem;color:#92400e;line-height:1.45;margin-top:8px;}
.alerta-tec strong{color:#78350f;}
.alerta-info{background:#dbeafe;border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:7px;padding:8px 11px;font-size:.78rem;color:#1e40af;line-height:1.45;margin-top:8px;}
.alerta-ok{background:#dcfce7;border:1px solid #86efac;border-left:4px solid var(--ok);border-radius:7px;padding:8px 11px;font-size:.78rem;color:#166534;line-height:1.45;margin-top:8px;}
.alerta-warn{background:#fef3c7;border:1px solid #fde68a;border-left:4px solid var(--warn);border-radius:7px;padding:8px 11px;font-size:.78rem;color:#92400e;line-height:1.45;margin-top:8px;}

/* EQUILÍBRIO IÔNICO */
.eq-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:9px;}
.eq-linha{background:#fafafa;border:1px solid var(--cl);border-radius:7px;padding:8px 11px;border-left:3px solid var(--cb);}
.eq-linha.ok{border-left-color:var(--ok);background:#f0fdf4;}
.eq-linha.warn{border-left-color:var(--warn);background:#fffbeb;}
.eq-linha.err{border-left-color:var(--danger);background:#fef2f2;}
.eq-linha-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;color:var(--ve);margin-bottom:4px;}
.eq-linha-vals{display:flex;flex-wrap:wrap;gap:9px;font-size:.7rem;}
.eq-linha-vals > div{display:flex;flex-direction:column;align-items:flex-start;gap:0;}
.eq-lab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;}
.eq-val{font-family:'DM Mono',monospace;font-weight:700;font-size:.82rem;color:var(--ve);}
.eq-val.ok{color:var(--ok);}
.eq-val.def{color:var(--danger);}

.prod-sug-box{background:white;border:1px solid var(--cl);border-radius:8px;padding:9px 11px;margin-bottom:5px;}
.prod-sug-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.prod-sug-tit{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.66rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;}
.prod-sug-nome{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.88rem;color:var(--ve);margin-top:2px;}
.prod-sug-formula{font-family:'DM Mono',monospace;font-size:.62rem;background:#dbeafe;color:#1e40af;padding:1px 6px;border-radius:99px;font-weight:700;border:1px solid #93c5fd;display:inline-block;margin-left:4px;}
.prod-sug-dose{font-family:'DM Mono',monospace;font-weight:800;font-size:1.4rem;color:var(--ve);line-height:1;}
.prod-sug-un{font-size:.66rem;color:var(--c);}
.prod-sug-detail{margin-top:6px;font-size:.7rem;color:var(--c);line-height:1.5;font-family:'DM Mono',monospace;}

.inp-linha-mini{display:flex;flex-direction:column;}
.inp-linha-mini label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.66rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.inp-linha-mini input, .inp-linha-mini select{border:1.5px solid var(--cb);border-radius:6px;padding:5px 7px;font-family:'DM Mono',monospace;font-weight:700;font-size:.82rem;color:var(--ve);outline:none;background:white;width:100%;}
.inp-linha-mini input:focus, .inp-linha-mini select:focus{border-color:var(--v);}
.sel-fonte{width:100%;border:1.5px solid var(--cb);border-radius:6px;padding:6px 8px;font-family:'Barlow',sans-serif;font-size:.78rem;color:var(--ve);outline:none;background:white;font-weight:600;}
.sel-fonte:focus{border-color:var(--v);box-shadow:0 0 0 2px var(--vb);}
.btn-calcular{width:100%;margin-top:10px;background:var(--v);color:white;border:none;border-radius:8px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}
.btn-calcular:active{transform:scale(.98);background:var(--ve);}

/* FONTE DE INFORMAÇÃO */
.fonte{font-size:.66rem;color:var(--c);font-style:italic;margin-top:7px;text-align:right;}

/* RODAPÉ FIXO COM RESUMO */
.rec-rodape{background:white;border-top:2px solid var(--v);padding:9px 12px;flex-shrink:0;display:none;flex-direction:column;gap:7px;box-shadow:0 -3px 10px rgba(0,0,0,.08);}
.rec-rodape.visivel{display:flex;}
.rec-rodape-resumo{display:flex;gap:6px;flex-wrap:wrap;font-size:.7rem;}
.rec-rodape-item{background:var(--vb);border:1px solid var(--v);border-radius:99px;padding:3px 9px;color:var(--ve);font-family:'DM Mono',monospace;font-weight:700;font-size:.7rem;}
.rec-rodape-item.zero{background:var(--cl);border-color:var(--cb);color:var(--c);}
.rec-rodape-acoes{display:flex;gap:6px;}
.rec-rodape-acoes button{flex:1;border:none;border-radius:7px;padding:9px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.82rem;cursor:pointer;letter-spacing:.03em;text-transform:uppercase;}
.btn-salvar{background:var(--v);color:white;}
.btn-salvar:active{transform:scale(.97);}
.btn-copiar{background:#fafafa;color:var(--c);border:1px solid var(--cb);}
.btn-limpar{background:none;color:var(--danger);border:1px solid #fca5a5;flex:0 0 auto !important;padding:9px 14px !important;}

/* LISTA DE RECOMENDAÇÕES SALVAS */
.rec-card{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:11px 13px;border-left:4px solid var(--v);}
.rec-card-status-rascunho{border-left-color:var(--c);}
.rec-card-status-aprovada{border-left-color:var(--blue);}
.rec-card-status-aplicada{border-left-color:var(--ok);}
.rec-card-status-cancelada{border-left-color:var(--danger);opacity:.7;}
.rec-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.rec-card-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.98rem;color:var(--ve);}
.rec-card-meta{font-size:.72rem;color:var(--c);margin-top:2px;line-height:1.4;}
.rec-status-badge{font-size:.62rem;padding:2px 9px;border-radius:99px;color:white;font-weight:700;letter-spacing:.02em;text-transform:uppercase;flex-shrink:0;}
.rec-status-rascunho{background:var(--c);}
.rec-status-aprovada{background:var(--blue);}
.rec-status-aplicada{background:var(--ok);}
.rec-status-cancelada{background:var(--danger);}
.rec-card-doses{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.rec-card-dose{font-family:'DM Mono',monospace;font-size:.7rem;background:var(--vb);color:var(--ve);padding:2px 7px;border-radius:99px;font-weight:700;border:1px solid var(--v);}
.rec-card-acoes{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
.btn-acao{background:none;border:1.5px solid var(--cb);border-radius:6px;padding:6px 10px;font-size:.72rem;color:var(--c);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
.btn-acao.primary{background:var(--v);border-color:var(--v);color:white;}
.btn-acao.danger{border-color:#fca5a5;color:var(--danger);}

/* VAZIO */
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;color:var(--c);}
.vazio .ico{font-size:3.5rem;margin-bottom:10px;opacity:.4;}
.vazio p{font-size:.92rem;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ve);color:white;padding:11px 18px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

/* MODAL (visualização recomendação salva) */
.overlay-rec{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding-top:30px;}
.overlay-rec.aberto{display:flex;}
.modal-rec{background:white;border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:calc(100dvh - 30px);display:flex;flex-direction:column;box-shadow:var(--sf);overflow:hidden;}
.modal-rec-head{padding:14px 16px;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--ve);color:white;}
.modal-rec-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;}
.modal-rec-fechar{background:rgba(255,255,255,.12);border:none;color:white;font-size:1.2rem;width:34px;height:34px;border-radius:7px;cursor:pointer;}
.modal-rec-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;}

/* TAG DE FASE DA LAVOURA */
.fase-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#f59e0b;color:white;}
</style>
</head>

// Tabelas em uso (default + override custom do admin)

window.FAIXAS_P_POR_PREM = FAIXAS_P_POR_PREM_DEFAULT;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil === 'admin') {
    perfilAtual.modulos = {mapa:'admin',atividades:'admin',adubacao:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin',estoque:'admin',gestao:'admin',analises:'admin',recomendacoes:'admin'};
  }
  if (!temAcesso()) {
    document.getElementById('loadingScreen').innerHTML = '<div style="text-align:center;padding:30px;"><div style="font-size:3rem;">⛔</div><div style="font-family:Barlow Condensed,sans-serif;font-weight:700;font-size:1.1rem;color:var(--c);margin-top:10px;">Sem permissão</div><a href="index.html" style="display:inline-block;margin-top:14px;color:var(--v);">← Voltar</a></div>';

  document.getElementById('appContent').style.display = 'flex';
  if (isAdmin()) document.getElementById('btnTabelas').style.display = 'flex';
  gerarMenu();

  onSnapshot(collection(db,'talhoes'), snap => {
    talhoes = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    popularTalhoes();
  });
  onSnapshot(collection(db,'analises'), snap => {
    analises = snap.docs.map(d=>({_docId:d.id, ...d.data()}));
    if (window.recWIP.talhaoId) onTrocaTalhao();
  });
  onSnapshot(collection(db,'amostras'), snap => {
    amostras = snap.docs.map(d=>({_docId:d.id, ...d.data()}));
    if (window.recWIP.talhaoId) onTrocaTalhao();
  });
  onSnapshot(collection(db,'recomendacoes'), snap => {
    recomendacoes = snap.docs.map(d=>({_docId:d.id, ...d.data()}));
    if (tabAtual === 'lista') renderLista();
  });
  onSnapshot(collection(db,'catalogo_adubos'), snap => {
    catalogoAdubos = snap.docs.map(d => ({_docId:d.id, ...d.data()}));

function temAcesso() {
  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};
  if (m.recomendacoes) return true;
  if (m.admin === 'admin') return true;
  if (Object.values(m).includes('admin')) return true;
  return false;
}
function podeEditar() {
  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};
  const lvl = m.recomendacoes;
  return lvl === 'admin' || lvl === 'gerente';
}
function isAdmin() {
  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};
  return m.recomendacoes === 'admin' || m.admin === 'admin';
}

  const isAdm = perfilAtual.perfil==='admin' || Object.values(perfilAtual.modulos||{}).includes('admin');
  const items = [
    {href:'index.html',ico:'📊',label:'Dashboard'},
    {href:'mapa.html',ico:'🗺️',label:'Mapa de Talhões'},
    {href:'atividades.html',ico:'🌾',label:'Atividades'},

    {href:'analises.html',ico:'🔬',label:'Análises'},
    {href:'recomendacoes.html',ico:'💊',label:'Recomendações'},
    {href:'planejamento.html',ico:'🗓️',label:'Planejamento'}

  document.getElementById('menuModulos').innerHTML = items.map(m =>
    `<a class="menu-item ${m.href==='recomendacoes.html'?'ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`
  ).join('');
}

function popularTalhoes() {
  const sel = document.getElementById('selTalhao');
  const val = sel.value;
  // Agrupa por fazenda, ordena por fazenda+nome
  const ord = [...talhoes]
    .filter(t => t.status === 'ativo' || !t.status)
    .sort((a,b) => (a.fazenda||'').localeCompare(b.fazenda||'') || (a.nome||'').localeCompare(b.nome||''));
  sel.innerHTML = '<option value="">— selecione —</option>' + ord.map(t =>
    `<option value="${escAttr(t._docId)}">${escHtml((t.fazenda?t.fazenda+' · ':'') + (t.nome || t.id))}</option>`
  ).join('');
  if (val) sel.value = val;
}

// ━━━━━━━━━━ UTILS ━━━━━━━━━━

function escHtml(s){return String(s||'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n,d){const v=Number(n);if(!isFinite(v))return '—';return v.toLocaleString('pt-BR',{minimumFractionDigits:d!==undefined?d:0,maximumFractionDigits:d!==undefined?d:2});}
function parseDose(s){if(s==null||s==='')return null;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?null:n;}
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return `${dd}/${m}/${a}`;}
function hoje(){return new Date().toISOString().slice(0,10);}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}

window.toggleMenu = () => { document.getElementById('menuLateral').classList.toggle('aberto'); document.getElementById('menuOverlay').classList.toggle('aberto'); };

window.abrirTab = function(t) {
  tabAtual = t;
  document.querySelectorAll('.tab-top').forEach(b => b.classList.remove('ativa'));
  document.getElementById(t==='nova'?'tabNova':'tabLista').classList.add('ativa');
  document.getElementById('recSticky').style.display = t==='nova' ? 'block' : 'none';
  if (t === 'nova') onRecalcular();
  else renderLista();
};

// (Bloco 2: cards de cálculo, salvar, listar, tabelas admin)

window.onTrocaTalhao = function() {
  const id = document.getElementById('selTalhao').value;
  window.recWIP.talhaoId = id;
  const selAn = document.getElementById('selAnalise');
  if (!id) {
    selAn.innerHTML = '<option value="">—</option>';
    selAn.disabled = true;
    window.recWIP.amostraId = '';
    document.getElementById('histProd').textContent = '';
    onRecalcular();
    return;
  }
  const t = talhoes.find(x => x._docId === id);
  // Histórico de produção
  if (t && t.historico && t.historico.length) {
    const ord = [...t.historico].sort((a,b)=>(b.safra||'').localeCompare(a.safra||''));
    const ult3 = ord.slice(0,3);
    const med = ult3.reduce((s,h)=>s+(parseDose(h.valor)||0), 0) / ult3.length;
    document.getElementById('histProd').textContent = `Histórico: ${ult3.map(h=>fmt(parseDose(h.valor)||0,0)).join(' · ')} sc/ha (média ${fmt(med,0)})`;
  } else {
    document.getElementById('histProd').textContent = 'Sem histórico de produção.';
  }
  // Listar amostras de solo vinculadas ao talhão
  // Match pelo id do talhão (t.id) — não pelo _docId
  const talhaoId = t?.id;
  const amos = amostras.filter(am => am.tipo === 'solo' && am.talhaoIdVinculado === talhaoId);
  // Ordenar: mais recentes primeiro (pega data da análise pai)
  const amosOrd = amos.map(am => {
    const an = analises.find(x => x._docId === am.analiseId);
    return {am, an, data: an?.dataLaudo || an?.dataEntrada || ''};
  }).sort((a,b) => b.data.localeCompare(a.data));
  if (!amosOrd.length) {
    selAn.innerHTML = '<option value="">Nenhuma análise de solo vinculada</option>';
    selAn.disabled = true;
  } else {
    selAn.innerHTML = '<option value="">— selecione —</option>' + amosOrd.map(o =>
      `<option value="${escAttr(o.am._docId)}">${escHtml(o.am.nome + (o.am.profundidade?' ('+o.am.profundidade+'cm)':'') + ' · ' + formatarData(o.data))}</option>`
    ).join('');
    selAn.disabled = false;
    // Auto-seleciona a primeira (mais recente) se nenhuma escolhida
    if (!window.recWIP.amostraId || !amosOrd.find(o => o.am._docId === window.recWIP.amostraId)) {
      window.recWIP.amostraId = amosOrd[0].am._docId;
      selAn.value = window.recWIP.amostraId;
    } else {
      selAn.value = window.recWIP.amostraId;
    }
  }
  onRecalcular();
};

// ━━━ CARD: RESUMO DA ANÁLISE ━━━
function renderCardResumo(am, params, talhao, analise) {
  const aberto = window.recWIP.cardsAbertos.resumo !== false;
  // Parâmetros chave + classificação rápida
  const itens = [
    {id:'ph_h2o',  lab:'pH H₂O',    fmt:(v)=>fmt(v,1), cls: (v) => v == null ? 'ne' : v < 5.5 ? 'bx' : v <= 6.9 ? 'md' : 'at'},
    {id:'v',       lab:'V%',         fmt:(v)=>fmt(v,1), cls: (v) => v == null ? 'ne' : v < 50 ? 'bx' : v <= 70 ? 'md' : 'at', un:'%'},
    {id:'mo',      lab:'M.O.',       fmt:(v)=>fmt(v,1), cls: (v) => v == null ? 'ne' : v < 1.6 ? 'bx' : v <= 3 ? 'md' : 'at', un:'dag/dm³'},
    {id:'calcio',  lab:'Ca',         fmt:(v)=>fmt(v,2), cls: (v) => v == null ? 'ne' : v < 1.5 ? 'bx' : v <= 4 ? 'md' : 'at', un:'cmolc'},
    {id:'magnesio',lab:'Mg',         fmt:(v)=>fmt(v,2), cls: (v) => v == null ? 'ne' : v < 0.6 ? 'bx' : v <= 1 ? 'md' : 'at', un:'cmolc'},
    {id:'potassio',lab:'K',          fmt:(v)=>fmt(v,0), cls: (v) => v == null ? 'ne' : v < 60 ? 'bx' : v <= 120 ? 'md' : 'at', un:'mg/dm³'},
    {id:'p_mehlich',lab:'P-Mehlich', fmt:(v)=>fmt(v,0), cls: (v) => { if (v == null) return 'ne'; const pRem = params.p_remanescente; let limAlto = 10; if (pRem >= 20 && pRem < 40) limAlto = 20; else if (pRem >= 40) limAlto = 30; return v < limAlto/3 ? 'bx' : v <= limAlto ? 'md' : 'at'; }, un:'mg/dm³'},
    {id:'p_remanescente',lab:'P-rem', fmt:(v)=>fmt(v,0), cls:() => 'md', un:'mg/L'},
    {id:'sat_al',  lab:'m% (Sat.Al)',fmt:(v)=>fmt(v,1), cls: (v) => v == null ? 'ne' : v < 20 ? 'md' : v <= 40 ? 'bx' : 'mb', un:'%'},
    {id:'ctc_ph7', lab:'CTC pH 7',   fmt:(v)=>fmt(v,2), cls: () => 'md', un:'cmolc'}
  ];
  const cardsItens = itens.map(it => {
    const v = params[it.id];
    if (v == null || v === undefined) return '';
    const cls = it.cls(v);
    return `<div class="param-mini">
      <div class="param-mini-lab">${escHtml(it.lab)}</div>
      <div class="param-mini-val">${it.fmt(v)} ${it.un?`<span style="font-size:.6rem;color:var(--c);">${escHtml(it.un)}</span>`:''}</div>
      ${cls !== 'md' && cls !== 'ne' ? `<div class="param-mini-cls"><span class="cls-tag cls-${cls}">${cls==='bx'?'Baixo':cls==='at'?'Alto':cls==='mb'?'M.Baixo':cls==='ma'?'M.Alto':'Ok'}</span></div>` : ''}
    </div>`;
  }).filter(Boolean).join('');
  // Alertas técnicos rápidos
  const alertas = gerarAlertas(params);
  return `<div class="card-rec ${aberto?'':'fechado'}" id="cardResumo">
    <div class="card-rec-head" onclick="toggleCard('resumo')">
      <div class="card-rec-tit">📊 Resumo da análise <span class="card-rec-sub">${escHtml(am.nome + (am.profundidade?' ('+am.profundidade+'cm)':''))} · ${formatarData(analise?.dataLaudo||analise?.dataEntrada)}</span></div>
      <button class="card-rec-toggle" type="button">▼</button>
    </div>
    <div class="card-rec-body">
      <div class="params-grid">${cardsItens}</div>
      ${alertas}
    </div>
  </div>`;
}

function gerarAlertas(params) {
  const alertas = [];
  if (params.sat_al > 20) alertas.push({tipo:'tec', msg:`⚠️ Saturação de Alumínio = ${fmt(params.sat_al,1)}% — fazer calagem prioritariamente.`});
  if (params.ph_h2o < 5.0) alertas.push({tipo:'tec', msg:`⚠️ pH muito ácido (${fmt(params.ph_h2o,2)}) — risco de toxicidade por Al.`});
  if (params.magnesio < 0.5) alertas.push({tipo:'tec', msg:`⚠️ Mg muito baixo (${fmt(params.magnesio,2)}) — usar calcário dolomítico.`});
  if (params.calcio < 1.5) alertas.push({tipo:'tec', msg:`⚠️ Ca baixo (${fmt(params.calcio,2)}) — considere complementação com gesso.`});
  if (params.calcio && params.magnesio) {
    const rel = params.calcio / params.magnesio;
    if (rel < 3) alertas.push({tipo:'tec', msg:`⚠️ Relação Ca/Mg = ${fmt(rel,1)} (ideal 3-4). Priorizar dolomítico.`});
    else if (rel > 5) alertas.push({tipo:'info', msg:`ℹ️ Relação Ca/Mg = ${fmt(rel,1)} (alta). Pode aplicar calcítico.`});
  }
  if (params.boro < 0.15) alertas.push({tipo:'tec', msg:`⚠️ Boro muito baixo (${fmt(params.boro,2)}) — risco de chochamento.`});
  if (alertas.length === 0) alertas.push({tipo:'ok', msg:'✅ Solo sem alertas técnicos críticos.'});
  return alertas.map(a => {
    const cls = a.tipo === 'tec' ? 'alerta-tec' : a.tipo === 'info' ? 'alerta-info' : 'alerta-ok';
    return `<div class="${cls}">${a.msg}</div>`;
  }).join('');
}

// Botão Calcular: pega valores dos inputs e atualiza
window.calcularV = function() {
  const v2 = parseDose(document.getElementById('inpV2')?.value);
  const prnt = parseDose(document.getElementById('inpPRNT')?.value);
  const prof = parseInt(document.getElementById('selProfV')?.value);
  const calcId = document.getElementById('selCalcV')?.value || '';
  if (v2 != null) window.recWIP.v2 = v2;
  if (prnt != null) window.recWIP.prnt = prnt;
  if (!isNaN(prof)) window.recWIP.profundidade = prof;
  // Se escolheu calcário do catálogo, usa PRNT dele (se não tiver, mantém o digitado)
  window.recWIP.eqProdutoVId = calcId || null;
  if (calcId) {
    const p = catalogoAdubos.find(x => x._docId === calcId);
    if (p && p.prnt) {
      window.recWIP.prnt = p.prnt;
      const inp = document.getElementById('inpPRNT');
      if (inp) inp.value = p.prnt;
    }
  }
  atualizarResultadoV();
  toast('✅ Recalculado');
};

// Gera o HTML do resultado do V% — SEMPRE mostra cálculo, mesmo quando V% já atende
function renderResultadoVHtml(resV, v1, ctc, w) {
  if (!resV) {
    return `<div class="alerta-warn">⚠️ Dados insuficientes para calcular V%. Conferir V%, CTC pH7 e PRNT na análise.</div>`;
  }
  // Aviso topo: status atual
  const statusAviso = resV.jaCorrigido
    ? `<div class="alerta-ok" style="margin-bottom:9px;font-size:.84rem;">
        ✓ <strong>V% atual (${fmt(v1,1)}%) já está ≥ alvo (${w.v2}%)</strong> — solo não precisa de calagem.
      </div>`
    : `<div class="alerta-warn" style="margin-bottom:9px;font-size:.84rem;">
        ⚠️ <strong>V% atual (${fmt(v1,1)}%) abaixo do alvo (${w.v2}%)</strong> — precisa elevar.
      </div>`;
  const ncBase = (resV.nc != null && resV.nc > 0) ? resV.nc : 0;
  const ncFinal = (resV.ncCorrigida != null && resV.ncCorrigida > 0) ? resV.ncCorrigida : 0;
  const doseKg = Math.round(ncFinal * 1000);
  const calcEscolhido = w.eqProdutoVId ? (catalogoAdubos||[]).find(p => p._docId === w.eqProdutoVId) : null;
  const rotuloDose = calcEscolhido
    ? `kg/ha de ${calcEscolhido.nome.toLowerCase()}`
    : 'kg/ha de calcário';
  return `${statusAviso}
  <div class="formula-box">
    <strong>Fórmula:</strong> NC (t/ha) = (V₂ − V₁) × CTC ÷ (PRNT × 10)<br>
    Cálculo: (${fmt(w.v2,0)} − ${fmt(v1,1)}) × ${fmt(ctc,2)} ÷ (${fmt(w.prnt,0)} × 10)<br>
    NC (20cm) = <strong>${fmt(ncBase,2)}</strong> t/ha · Fator profundidade (${w.profundidade}cm) = × ${fmt(resV.fatorProf,2)}<br>
    NC final = <strong>${fmt(ncFinal,2)} t/ha</strong>
  </div>
  ${doseKg > 0 ? renderDoseBox('calagem', doseKg, rotuloDose) : `<div class="alerta-ok" style="text-align:center;font-size:.85rem;">✓ Dose = 0 kg/ha (V% atual ≥ alvo)</div>`}`;
}

// Atualiza só o bloco de resultado do V% (sem re-renderizar o painel inteiro)

window.atualizarResultadoV = function() {
  const am = window.recWIP.amostraId ? amostras.find(a => a._docId === window.recWIP.amostraId) : null;

// Botão Calcular do Equilíbrio Iônico: lê inputs e atualiza
window.calcularEq = function() {
  const ca = parseDose(document.getElementById('inpEqCa')?.value);
  const mg = parseDose(document.getElementById('inpEqMg')?.value);
  const k  = parseDose(document.getElementById('inpEqK')?.value);

  if (ca != null) window.recWIP.eqCaPct = ca;
  if (mg != null) window.recWIP.eqMgPct = mg;
  if (k != null) window.recWIP.eqKPct = k;
  if (!isNaN(prof)) window.recWIP.profundidade = prof;
  window.recWIP.eqProdutoMgId = fonteMg || null;
  window.recWIP.eqProdutoCaId = fonteCa || null;

};

// Gera só o HTML do resultado (déficits + produtos + dose-box)
function renderResultadoEqHtml(params, w) {
  const produtos = produtosCorretivosDoCatalogo();
  const res = calcEquilibrioIonicoImpl(params, w, produtos);
  if (res.erro) {
    return `<div class="alerta-info" style="background:#fee2e2;border-color:#fca5a5;color:#991b1b;border-left-color:#dc2626;">⚠️ ${escHtml(res.erro)}</div>`;
  }
  // Cards por nutriente
  const cardCa = renderEqLinha('Cálcio (Ca)', '🟫', res.deficits.ca, res.deficitsKg.ca, 'cmolc/dm³');
  const cardMg = renderEqLinha('Magnésio (Mg)', '🟩', res.deficits.mg, res.deficitsKg.mg, 'cmolc/dm³');
  const cardK = res.deficits.k
    ? renderEqLinhaK(res.deficits.k, res.deficitsKg.k, res.kMg)
    : `<div class="alerta-warn" style="font-size:.74rem;">⚠️ K não disponível no laudo (campo "potassio"). Não foi possível calcular.</div>`;
  // Sugestões de produto
  let blocoProdutos = '';
  if (!produtos.length) {
    blocoProdutos = `<div class="alerta-warn" style="margin-top:9px;">
      📭 <strong>Catálogo de adubos vazio.</strong> Cadastre os corretivos em <strong>Admin → 🧪 Adubos</strong> (PRNT, tipo).
    </div>`;
  } else {
    blocoProdutos = renderSugestaoProdutos(res.sugestao, produtos, w, res);
  }
  // Dose-box principal — agrupa produtos sugeridos
  let resultado = '';
  const itensPrincipais = [];
  const itensSeparados = [];
  for (const item of [res.sugestao.mg, res.sugestao.ca, res.sugestao.ca_complemento]) {
    if (!item) continue;
    if (produtoEhCalcario(item.produto)) {
      itensPrincipais.push(item);
    } else {
      itensSeparados.push(item);
    }
  }
  if (itensPrincipais.length > 0) {
    const total = itensPrincipais.reduce((s, it) => s + (it.doseCorrigida || 0), 0);
    const rotulo = itensPrincipais.length === 1
      ? `kg/ha de ${itensPrincipais[0].produto.nome.toLowerCase()}`
      : `kg/ha de calcário (total)`;
    resultado = renderDoseBox('calagem', Math.round(total), rotulo);
  } else if (itensSeparados.length === 1) {
    const it = itensSeparados[0];
    const rotulo = `kg/ha de ${it.produto.nome.toLowerCase()}`;
    resultado = renderDoseBox('calagem', Math.round(it.doseCorrigida), rotulo);
    itensSeparados.shift();
  }
  for (const it of itensSeparados) {
    const ehGesso = produtoEhGesso(it.produto);
    resultado += `<div style="background:#fef3c7;border:1px solid #fcd34d;border-left:4px solid #f59e0b;border-radius:7px;padding:8px 11px;margin-top:7px;font-size:.78rem;color:#92400e;">
      <strong>+ ${escHtml(it.produto.nome)}:</strong> ${fmt(it.doseCorrigida,0)} kg/ha
      ${ehGesso ? '<div style="font-size:.66rem;margin-top:3px;">⚠️ Aplicar separado do calcário. Não eleva pH, atua em profundidade.</div>' : ''}
    </div>`;
  }
  return `<div class="alerta-info" style="margin-bottom:9px;">
    📐 <strong>CTC pH7:</strong> ${fmt(res.ctc,2)} cmolc/dm³ · Profundidade: ${res.profCm} cm · Metas: Ca ${w.eqCaPct||60}% · Mg ${w.eqMgPct||15}% · K ${w.eqKPct||5}%
  </div>
  <div class="eq-grid">${cardCa}${cardMg}${cardK}</div>
  ${blocoProdutos}
  ${resultado}`;
}

// Atualiza só o bloco #eqResultado (preserva foco nos inputs de meta/profundidade)
window.atualizarResultadoEq = function() {
  const am = window.recWIP.amostraId ? amostras.find(a => a._docId === window.recWIP.amostraId) : null;

  const params = am.parametros || {};

};

// Render de uma linha de nutriente (Ca/Mg)
function renderEqLinha(nome, ico, deficit, deficitKg, un) {
  if (!deficit) return `<div class="eq-linha">${ico} ${nome}: dados insuficientes</div>`;
  const ok = deficit.deficit <= 0;
  const cls = ok ? 'ok' : (deficit.deficit > deficit.meta * 0.5 ? 'err' : 'warn');
  return `<div class="eq-linha ${cls}">
    <div class="eq-linha-tit">${ico} ${escHtml(nome)}</div>
    <div class="eq-linha-vals">
      <div><span class="eq-lab">Atual</span><span class="eq-val">${fmt(deficit.valorAtual,2)}</span></div>
      <div><span class="eq-lab">Meta</span><span class="eq-val">${fmt(deficit.meta,2)}</span></div>
      <div><span class="eq-lab">${ok?'Status':'Déficit'}</span><span class="eq-val ${ok?'ok':'def'}">${ok?'✓':fmt(deficit.deficit,2)}</span></div>
      ${ok ? '' : `<div><span class="eq-lab">kg/ha</span><span class="eq-val def">${fmt(deficitKg,0)}</span></div>`}
    </div>
  </div>`;
}

// Linha do K — mostra também em K₂O
function renderEqLinhaK(deficit, deficitKg, kMg) {
  const ok = deficit.deficit <= 0;
  const cls = ok ? 'ok' : (deficit.deficit > deficit.meta * 0.5 ? 'err' : 'warn');
  const deficitK2O = deficitKg * 1.2;  // K → K₂O
  return `<div class="eq-linha ${cls}">
    <div class="eq-linha-tit">🟦 Potássio (K) <span style="font-size:.65rem;color:var(--c);font-weight:400;">— estrutural, não substitui adubação anual</span></div>
    <div class="eq-linha-vals">
      <div><span class="eq-lab">Laudo</span><span class="eq-val">${fmt(kMg,0)} mg/dm³</span></div>
      <div><span class="eq-lab">Atual</span><span class="eq-val">${fmt(deficit.valorAtual,2)}</span></div>
      <div><span class="eq-lab">Meta</span><span class="eq-val">${fmt(deficit.meta,2)}</span></div>
      <div><span class="eq-lab">${ok?'Status':'Déficit'}</span><span class="eq-val ${ok?'ok':'def'}">${ok?'✓':fmt(deficit.deficit,2)}</span></div>
      ${ok ? '' : `<div><span class="eq-lab">kg K/ha</span><span class="eq-val def">${fmt(deficitKg,0)}</span></div>`}
      ${ok ? '' : `<div><span class="eq-lab">kg K₂O/ha</span><span class="eq-val def">${fmt(deficitK2O,0)}</span></div>`}
    </div>
  </div>`;
}

// Render das sugestões de produto (read-only, sem dropdowns — dropdowns ficam no inputsBase)
function renderSugestaoProdutos(sug, produtos, w, res) {
  const blocos = [];
  if (sug.mg) blocos.push(renderProdutoBlock('🟫 Fonte de Mg', sug.mg));

    blocos.push(`<div class="alerta-warn" style="margin-top:5px;font-size:.74rem;">${sug.notas.map(n => '• '+escHtml(n)).join('<br>')}</div>`);

    return `<div class="alerta-info" style="margin-top:9px;background:#dcfce7;border-color:#86efac;color:#15803d;border-left-color:#22c55e;">✓ Sem necessidade de correção de bases. Solo equilibrado.</div>`;

  return `<div style="margin-top:9px;">
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.78rem;color:var(--ve);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;">🛒 Produtos sugeridos</div>

  return `<div class="prod-sug-box">

}

// ━━━ HELPER: dose-box editável (sugerido + aplicar) ━━━
// nutriente: chave em recWIP.ajustes (n, p2o5, k2o, zn, b, cu, mn, calagem)
// sugerido: valor calculado pela tabela
// unidade: ex 'kg N/ha/ano', 'kg P₂O₅/ha/ano', 'kg/ha'
function renderDoseBox(nutriente, sugerido, unidade) {
  const ajuste = window.recWIP.ajustes[nutriente];
  const aplicar = (ajuste !== null && ajuste !== undefined) ? ajuste : sugerido;
  const foiAjustado = ajuste !== null && ajuste !== undefined && Number(ajuste) !== Number(sugerido);
  return `<div class="dose-box ${foiAjustado?'ajustada':''}">
    <div class="dose-linhas">
      <div class="dose-col-sug">
        <div class="dose-label">Sugerido</div>
        <div class="dose-sug-val">${fmt(sugerido,0)}</div>
        <div class="dose-un-small">${escHtml(unidade)}</div>
      </div>
      <div class="dose-col-apl">
        <div class="dose-label" style="color:var(--ve);">Aplicar</div>
        <input class="dose-apl-inp" type="text" inputmode="decimal" value="${fmt(aplicar,0)}" oninput="setAjuste('${nutriente}', this.value, ${sugerido})">
        ${foiAjustado ? `<span class="tag-ajustada">✏️ Ajustado</span><button type="button" class="btn-restaurar" onclick="restaurarAjuste('${nutriente}')">↻ Restaurar sugestão</button>` : ''}
      </div>
    </div>
  </div>`;
}

window.setAjuste = function(nutriente, valor, sugerido) {
  const v = parseDose(valor);
  if (v === null) {
    window.recWIP.ajustes[nutriente] = null;
  } else if (Number(v) === Number(sugerido)) {
    // se digitou igual ao sugerido, considera não-ajustado
    window.recWIP.ajustes[nutriente] = null;
  } else {
    window.recWIP.ajustes[nutriente] = v;
  }
  // Re-render apenas o rodapé pra atualizar resumo
  // (não re-renderiza tudo, senão o input perde foco)
  const am = window.recWIP.amostraId ? amostras.find(a => a._docId === window.recWIP.amostraId) : null;
  if (am) renderRodape(window.recWIP.produtividade, am.parametros || {});
};

window.restaurarAjuste = function(nutriente) {
  window.recWIP.ajustes[nutriente] = null;
  renderRecomendacao();
};

// Pega valor efetivo (= ajuste se houver, senão sugerido)
function valorAplicar(nutriente, sugerido) {
  const a = window.recWIP.ajustes[nutriente];
  return (a !== null && a !== undefined) ? a : sugerido;
}

function renderCardP(prod, params) {
  const aberto = window.recWIP.cardsAbertos.p !== false;
  const pMehlich = params.p_mehlich;
  const pRem = params.p_remanescente;
  if (prod == null || prod <= 0) {

      <div class="card-rec-head" onclick="toggleCard('p')"><div class="card-rec-tit">🔴 Fósforo (P₂O₅) <span class="card-rec-sub">aguardando produtividade</span></div><button class="card-rec-toggle" type="button">▼</button></div>

    </div>`;
  }
  if (pMehlich == null || pRem == null) {
    const faltando = [];
    if (pMehlich == null) faltando.push('P-Mehlich');
    if (pRem == null) faltando.push('P-rem');
    return `<div class="card-rec ${aberto?'':'fechado'}" id="cardP">
      <div class="card-rec-head" onclick="toggleCard('p')"><div class="card-rec-tit">🔴 Fósforo (P₂O₅) <span class="card-rec-sub">dados faltando</span></div><button class="card-rec-toggle" type="button">▼</button></div>
      <div class="card-rec-body"><div class="alerta-tec" style="margin:0;">⚠️ Análise sem ${faltando.join(' e ')}. Edite a análise em "🔬 Análises" e adicione esses parâmetros.</div></div>
    </div>`;
  }
  // Classifica
  let classe;
  if (pRem < 20) classe = window.FAIXAS_P_POR_PREM.baixoPrem;
  else if (pRem < 40) classe = window.FAIXAS_P_POR_PREM.medioPrem;
  else classe = window.FAIXAS_P_POR_PREM.altoPrem;
  const faixa = classe.faixas.find(f => pMehlich <= f.ate);

  const idxCls = ['muitoBaixo','baixo','medio','alto'].indexOf(cls);

    </div>`;
  }
  const dose = linha.dose[idxCls];
  const labelCls = cls==='muitoBaixo'?'Muito Baixo':cls==='baixo'?'Baixo':cls==='medio'?'Médio':'Alto';
  const premLab = pRem<20?'< 20 (argiloso)':pRem<40?'20-40 (médio)':'> 40 (arenoso)';
  return `<div class="card-rec ${aberto?'':'fechado'}" id="cardP">

// ━━━ CARD: MICRONUTRIENTES ━━━
function renderCardMicros(params) {
  const aberto = window.recWIP.cardsAbertos.micros !== false;
  const microsOut = {};
  const mapa = {zn:'zinco', b:'boro', cu:'cobre', mn:'manganes'};
  for (const [k, paramId] of Object.entries(mapa)) {
    const val = params[paramId];
    const tabela = window.TABELA_MICROS[k];
    if (val == null || !tabela) continue;
    const faixa = tabela.faixas.find(f => val <= f.ate);
    microsOut[k] = {valor: val, classe: faixa.cls, dose: faixa.dose, nome: tabela.nome, un: tabela.un};
  }
  const itens = Object.entries(microsOut).map(([k, m]) => {

// ━━━ RODAPÉ: RESUMO COMPACTO ━━━
function renderRodape(prod, params) {
  if (prod == null || prod <= 0) {
    document.getElementById('rodapeResumo').innerHTML = '<div style="color:var(--c);font-size:.74rem;padding:3px 0;">Informe produtividade pra ver resumo</div>';
    return;
  }
  const w = window.recWIP;
  // N
  const linhaNK = window.TABELA_N_K.find(r => prod >= r.prodMin && prod <= r.prodMax);
  // P
  let pDose = null;
  if (params.p_mehlich != null && params.p_remanescente != null) {
    let classe;
    if (params.p_remanescente < 20) classe = window.FAIXAS_P_POR_PREM.baixoPrem;
    else if (params.p_remanescente < 40) classe = window.FAIXAS_P_POR_PREM.medioPrem;
    else classe = window.FAIXAS_P_POR_PREM.altoPrem;
    const faixa = classe.faixas.find(f => params.p_mehlich <= f.ate);
    const idxCls = ['muitoBaixo','baixo','medio','alto'].indexOf(faixa.cls);
    const linhaP = window.TABELA_P.find(r => prod >= r.prodMin && prod <= r.prodMax);
    if (linhaP) pDose = linhaP.dose[idxCls];
  }
  // K
  let kDose = null;
  if (params.potassio != null && linhaNK) {
    const faixaK = FAIXAS_K_SOLO.find(f => params.potassio >= f.min && params.potassio < f.max) || FAIXAS_K_SOLO[FAIXAS_K_SOLO.length-1];
    kDose = linhaNK.k[faixaK.idx];
  }
  // Calagem
  let calcDose = null;
  if (w.metodoCalagem === 'v') {
    const r = calcCalagemVImpl(params.v, params.ctc_ph7, w.v2, w.prnt, w.profundidade);
    calcDose = r && !r.jaCorrigido ? r.ncCorrigida * 1000 : 0;
  } else if (w.metodoCalagem === 'cmag') {
    const r = calcCalagemCaMgImpl(params.calcio, params.magnesio, w.ca2, w.mg2, w.prnt, w.profundidade);
    calcDose = r && !r.jaCorrigido ? r.ncCorrigida * 1000 : 0;
  }
  // Micros
  const micros = {};
  const mapa = {zn:'zinco', b:'boro', cu:'cobre', mn:'manganes'};
  for (const [k, pid] of Object.entries(mapa)) {
    const val = params[pid];
    const t = window.TABELA_MICROS[k];
    if (val == null || !t) continue;
    const faixa = t.faixas.find(f => val <= f.ate);
    if (faixa.dose > 0) micros[k] = faixa.dose;
  }
  const itens = [];
  if (linhaNK) {
    const v = valorAplicar('n', linhaNK.n);
    itens.push({lab:'N', dose:v, un:'kg/ha', ajustado: v !== linhaNK.n});
  }
  if (pDose !== null) {
    const v = valorAplicar('p2o5', pDose);
    itens.push({lab:'P₂O₅', dose:v, un:'kg/ha', ajustado: v !== pDose});
  }
  if (kDose !== null) {
    const v = valorAplicar('k2o', kDose);
    itens.push({lab:'K₂O', dose:v, un:'kg/ha', ajustado: v !== kDose});
  }
  if (calcDose !== null && calcDose > 0) {
    const v = valorAplicar('calagem', Math.round(calcDose));
    itens.push({lab:'Calc.', dose:v, un:'kg/ha', ajustado: v !== Math.round(calcDose)});
  }
  for (const m of ['zn','b','cu','mn']) {
    if (micros[m]) {
      const v = valorAplicar(m, micros[m]);
      itens.push({lab:m.toUpperCase(), dose:v, un:'kg/ha', ajustado: v !== micros[m]});
    }
  }
  document.getElementById('rodapeResumo').innerHTML = itens.map(i =>
    `<span class="rec-rodape-item ${i.dose===0?'zero':''}" ${i.ajustado?'style="background:#fef3c7;border-color:#f59e0b;color:#92400e;"':''}>${escHtml(i.lab)}: ${fmt(i.dose,0)}${i.ajustado?' ✏️':''}</span>`
  ).join('') || '<div style="color:var(--c);font-size:.74rem;padding:3px 0;">Nenhuma dose recomendada.</div>';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CÁLCULOS (versões inline pra usar window.TABELAS)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function calcCalagemVImpl(v1, ctc, v2, prnt, profundidade) {
  if (v1 == null || ctc == null || v2 == null || prnt == null) return null;
  if (v1 >= v2) return {nc:0, fatorProf:profundidade/20, ncCorrigida:0, jaCorrigido:true};
  const nc = (v2 - v1) * ctc / (prnt * 10);
  const fatorProf = profundidade / 20;
  return {nc, fatorProf, ncCorrigida:nc*fatorProf, formulaTxt:`NC = (${v2} − ${v1.toFixed(1)}) × ${ctc.toFixed(2)} / (${prnt} × 10)`, jaCorrigido:false};
}
function calcCalagemCaMgImpl(ca1, mg1, ca2, mg2, prnt, profundidade) {
  if (ca1 == null || mg1 == null || ca2 == null || mg2 == null || prnt == null) return null;
  const deficit = (ca2 + mg2) - (ca1 + mg1);
  if (deficit <= 0) return {nc:0, fatorProf:profundidade/20, ncCorrigida:0, jaCorrigido:true};
  const nc = deficit * 100 / prnt;
  const fatorProf = profundidade / 20;
  return {nc, fatorProf, ncCorrigida:nc*fatorProf, formulaTxt:`NC = ((${ca2}+${mg2}) − (${ca1.toFixed(2)}+${mg1.toFixed(2)})) × 100 / ${prnt}`, jaCorrigido:false};
}
function calcComplementoCaMgImpl(ca, mg) {
  const out = {};
  if (ca != null) {
    const faixa = window.TABELA_COMPLEMENTO.ca.find(f => ca <= f.ate);
    out.ca = {valor:ca, dose:faixa.dose, nota:faixa.nota};
  }
  if (mg != null) {
    const faixa = window.TABELA_COMPLEMENTO.mg.find(f => mg <= f.ate);
    out.mg = {valor:mg, dose:faixa.dose, nota:faixa.nota};
  }
  return out;
}
function sugerirCalcarioImpl(ca, mg) {
  if (ca == null || mg == null) return null;
  const relCaMg = ca / mg;
  if (mg < 0.6) return {tipo:'dolomitico', motivo:'Mg baixo — precisa elevar'};
  if (relCaMg < 3) return {tipo:'dolomitico', motivo:`Ca/Mg = ${fmt(relCaMg,1)} (< 3) — precisa elevar Mg`};
  if (relCaMg > 5 && mg >= 1.0) return {tipo:'calcitico', motivo:`Ca/Mg = ${fmt(relCaMg,1)} alto e Mg adequado`};
  return {tipo:'magnesiano', motivo:`Ca/Mg = ${fmt(relCaMg,1)} razoável`};
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// EQUILÍBRIO IÔNICO DA CTC
// Metas (% da CTC efetiva ou ph7 a depender — usaremos CTC pH7 que é padrão):
//   Ca: 60%, Mg: 15%, K: 5%
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Massas molares (g/mol)
const MM_CA = 40, MM_MG = 24, MM_K = 39;

// Converte K do laudo (em mg/dm³, padrão Fullin/INCAPER) para cmol_c/dm³
// K (cmolc/dm³) = K(mg/dm³) / (MM_K × 10) = K(mg/dm³) / 390
function kMgToCmolc(kMg) {
  if (kMg == null || !isFinite(kMg)) return null;
  return kMg / (MM_K * 10);
}

// Calcula déficit de uma base
// meta% = % da CTC alvo · valorAtual em cmolc/dm³
// retorna déficit em cmolc/dm³ (>0 se precisa correção; <=0 se já atende)
function deficitBase(ctc, valorAtualCmolc, metaPct) {
  if (ctc == null || valorAtualCmolc == null) return null;
  const meta = ctc * (metaPct / 100);
  const def = meta - valorAtualCmolc;
  return {meta, deficit: def, valorAtual: valorAtualCmolc, metaPct};
}

// Converte déficit de cmolc/dm³ pra kg/ha do elemento
// 1 dm³ = 1 kg solo · volume na profundidade = 10000 × prof(m) × 1000 dm³/ha
function cmolcParaKgHa(deficitCmolc, massaMolar, profundidadeCm) {
  if (deficitCmolc == null || !isFinite(deficitCmolc) || deficitCmolc <= 0) return 0;
  // déficit (g/dm³) = (cmolc/dm³ / 100) × massa molar
  const gPorDm3 = (deficitCmolc / 100) * massaMolar;
  const volumeDm3PorHa = 10000 * (profundidadeCm / 100) * 1000;  // = 2.000.000 dm³/ha para 20 cm
  // kg/ha = (g/dm³ × dm³/ha) / 1000
  return gPorDm3 * volumeDm3PorHa / 1000;
}

// Identifica se um produto é gesso (não aplica PRNT)
function produtoEhGesso(p) {
  if (!p) return false;
  if (p.tipoCorretivo === 'gesso') return true;
  return /gesso/i.test(p.nome||'');
}

// Identifica se é calcário (aplica PRNT)
function produtoEhCalcario(p) {
  if (!p) return false;
  if (p.tipoCorretivo === 'calcario_calcitico' || p.tipoCorretivo === 'calcario_dolomitico') return true;
  return /calc[áa]rio|calcitico|dolomitico|dolom[íi]tico|calc[íi]tico/i.test(p.nome||'');
}

// Calcula dose do produto pra suprir déficit (kg/ha do nutriente alvo)
// Retorna {doseBruta, doseCorrigida, usaPrnt}
function doseProdutoPara(deficitKgHaNutriente, teorElementarPct, produto) {
  if (!teorElementarPct || teorElementarPct <= 0) return null;
  const doseBruta = deficitKgHaNutriente / (teorElementarPct / 100);
  // PRNT só aplica em calcários (gesso, cal virgem, óxido Mg ignoram)
  let doseCorrigida = doseBruta;
  let usaPrnt = false;
  if (produtoEhCalcario(produto) && produto.prnt && produto.prnt > 0 && produto.prnt < 100) {
    doseCorrigida = doseBruta / (produto.prnt / 100);
    usaPrnt = true;
  }
  return {doseBruta, doseCorrigida, usaPrnt, prnt: produto.prnt || null};
}

// Lógica de sugestão automática de produtos baseado nos déficits
// Aceita escolhas manuais: produtoMgId e produtoCaId (override do automático)
// Retorna {ca:{produto, dose, nota}, mg:{...}, ca_complemento:{...}}
function sugerirProdutosEquilibrio(deficits, profCm, produtosCatalogo, escolhas) {
  escolhas = escolhas || {};
  const out = {ca: null, mg: null, ca_complemento: null, notas: []};
  if (!produtosCatalogo || !produtosCatalogo.length) return out;
  const defCaKg = cmolcParaKgHa(deficits.ca?.deficit, MM_CA, profCm);
  const defMgKg = cmolcParaKgHa(deficits.mg?.deficit, MM_MG, profCm);
  // Função helper: encontra produto pelo tipo
  const acharPorTipo = (tipo) => produtosCatalogo.find(p => p.tipoCorretivo === tipo);
  const acharPorId = (id) => produtosCatalogo.find(p => p._docId === id);
  // ESCOLHAS MANUAIS — se o usuário escolheu um produto pra Mg, força usar ele
  let produtoMgEscolhido = escolhas.produtoMgId ? acharPorId(escolhas.produtoMgId) : null;
  let produtoCaEscolhido = escolhas.produtoCaId ? acharPorId(escolhas.produtoCaId) : null;
  // CASO 1: Ambos Ca e Mg deficitários
  if (defCaKg > 0 && defMgKg > 0) {
    // Determinar a fonte de Mg
    let fonteMg = produtoMgEscolhido;
    if (!fonteMg) {
      fonteMg = acharPorTipo('calcario_dolomitico') || produtosCatalogo.find(p => /dolom/i.test(p.nome||''));
    }
    if (fonteMg && fonteMg.mg > 0) {
      // Dose pelo Mg (limitante quando produto fornece Mg)
      const doseFonteMg = doseProdutoPara(defMgKg, fonteMg.mg, fonteMg);
      if (doseFonteMg) {
        const caFornecidoBruto = doseFonteMg.doseBruta * ((fonteMg.ca || 0) / 100);
        const defCaRestante = Math.max(0, defCaKg - caFornecidoBruto);
        out.mg = {produto: fonteMg, ...doseFonteMg, supreCa: caFornecidoBruto, supreMg: defMgKg,
          motivo: produtoEhCalcario(fonteMg) ? 'Fornece Mg + parte do Ca' : 'Fonte exclusiva de Mg'};
        // Complemento de Ca se ainda falta
        if (defCaRestante > 5) {
          let comp = produtoCaEscolhido;
          if (!comp) {
            comp = acharPorTipo('calcario_calcitico') || acharPorTipo('gesso') || produtosCatalogo.find(p => produtoEhGesso(p));
          }
          if (comp && comp.ca > 0) {
            const doseComp = doseProdutoPara(defCaRestante, comp.ca, comp);
            if (doseComp) {
              out.ca_complemento = {produto: comp, ...doseComp, supreCa: defCaRestante,
                motivo: produtoEhGesso(comp) ? '⚠️ Gesso — não eleva pH, complementa Ca' : 'Completa o Ca'};
            }
          }
        }
        return out;
      }
    }
    out.notas.push('⚠️ Sem fonte de Mg disponível no catálogo.');
  }
  // CASO 2: Só Ca deficitário
  if (defCaKg > 0 && defMgKg <= 0) {
    let fonteCa = produtoCaEscolhido;
    if (!fonteCa) {
      fonteCa = acharPorTipo('calcario_calcitico') || produtosCatalogo.find(p => /calc[íi]tico/i.test(p.nome||'') || produtoEhGesso(p));
    }
    if (fonteCa && fonteCa.ca > 0) {
      const dose = doseProdutoPara(defCaKg, fonteCa.ca, fonteCa);
      if (dose) out.ca = {produto: fonteCa, ...dose, supreCa: defCaKg,
        motivo: produtoEhGesso(fonteCa) ? '⚠️ Gesso — não eleva pH' : 'Fonte de Ca'};
      return out;
    }
    out.notas.push('Sem fonte de Ca no catálogo.');
  }
  // CASO 3: Só Mg deficitário
  if (defMgKg > 0 && defCaKg <= 0) {
    let fonteMg = produtoMgEscolhido;
    if (!fonteMg) {
      fonteMg = acharPorTipo('sulfato_mg') ||
                acharPorTipo('oxido_mg') ||
                acharPorTipo('calcario_dolomitico') ||
                produtosCatalogo.find(p => /sulfato.+m[áa]gn/i.test(p.nome||''));
    }
    if (fonteMg && fonteMg.mg > 0) {
      const dose = doseProdutoPara(defMgKg, fonteMg.mg, fonteMg);
      if (dose) out.mg = {produto: fonteMg, ...dose, supreMg: defMgKg,
        motivo: 'Fonte de Mg selecionada'};
      return out;
    }
    out.notas.push('Sem fonte de Mg no catálogo.');
  }
  return out;
}

// Calcula tudo do método Equilíbrio Iônico
function calcEquilibrioIonicoImpl(params, w, produtosCatalogo) {
  const ctc = params.ctc_ph7;
  const ca = params.calcio;
  const mg = params.magnesio;
  // K vem em mg/dm³ no laudo (padrão Fullin/INCAPER)
  const kMg = params.potassio;
  const kCmolc = kMgToCmolc(kMg);
  if (ctc == null || ca == null || mg == null) {
    return {erro: 'CTC pH7, Ca e Mg da análise são obrigatórios pra este método.'};
  }
  const deficits = {
    ca: deficitBase(ctc, ca, w.eqCaPct || 60),
    mg: deficitBase(ctc, mg, w.eqMgPct || 15),
    k: (kCmolc !== null) ? deficitBase(ctc, kCmolc, w.eqKPct || 5) : null
  };
  // Converter déficits para kg/ha
  const profCm = w.profundidade || 20;
  const deficitsKg = {
    ca: cmolcParaKgHa(deficits.ca?.deficit, MM_CA, profCm),
    mg: cmolcParaKgHa(deficits.mg?.deficit, MM_MG, profCm),
    k:  cmolcParaKgHa(deficits.k?.deficit,  MM_K,  profCm)
  };
  // Sugerir produtos automaticamente (respeitando escolhas manuais do usuário)
  const sugestao = sugerirProdutosEquilibrio(deficits, profCm, produtosCatalogo, {
    produtoMgId: w.eqProdutoMgId,
    produtoCaId: w.eqProdutoCaId
  });
  return {ctc, ca, mg, kMg, kCmolc, deficits, deficitsKg, sugestao, profCm};
}

// Filtra do catálogo só produtos úteis pra correção de Ca/Mg
function produtosCorretivosDoCatalogo() {
  return (catalogoAdubos || []).filter(p => (p.ca && p.ca > 0) || (p.mg && p.mg > 0));
}

  const btn = document.getElementById('btnSalvarRec');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {

    const linhaNK = window.TABELA_N_K.find(r => w.produtividade >= r.prodMin && w.produtividade <= r.prodMax);
    let pDose = null;
    if (params.p_mehlich != null && params.p_remanescente != null) {
      let classe;
      if (params.p_remanescente < 20) classe = window.FAIXAS_P_POR_PREM.baixoPrem;
      else if (params.p_remanescente < 40) classe = window.FAIXAS_P_POR_PREM.medioPrem;
      else classe = window.FAIXAS_P_POR_PREM.altoPrem;
      const faixa = classe.faixas.find(f => params.p_mehlich <= f.ate);
      const idx = ['muitoBaixo','baixo','medio','alto'].indexOf(faixa.cls);
      const linhaP = window.TABELA_P.find(r => w.produtividade >= r.prodMin && w.produtividade <= r.prodMax);
      if (linhaP) pDose = linhaP.dose[idx];
    }
    let kDose = null;
    if (params.potassio != null && linhaNK) {
      const faixaK = FAIXAS_K_SOLO.find(f => params.potassio >= f.min && params.potassio < f.max) || FAIXAS_K_SOLO[FAIXAS_K_SOLO.length-1];
      kDose = linhaNK.k[faixaK.idx];
    }
    let calagem = {metodo: w.metodoCalagem, dose_sugerida: 0, dose: 0, tipo: null};
    if (w.metodoCalagem === 'v') {
      const r = calcCalagemVImpl(params.v, params.ctc_ph7, w.v2, w.prnt, w.profundidade);
      if (r && !r.jaCorrigido) {
        calagem.dose_sugerida = Math.round(r.ncCorrigida * 1000);
        calagem.dose = valorAplicar('calagem', calagem.dose_sugerida);
      }
      calagem.v2 = w.v2; calagem.prnt = w.prnt; calagem.profundidade = w.profundidade;
    } else if (w.metodoCalagem === 'equilibrio') {
      const produtos = produtosCorretivosDoCatalogo();
      const r = calcEquilibrioIonicoImpl(params, w, produtos);
      if (!r.erro) {
        // Dose total de calcário (sem gesso) — vai pro dose-box
        const doseTotalCalcario =
          (r.sugestao.mg?.doseCorrigida || 0) +
          (r.sugestao.ca?.doseCorrigida || 0) +
          (r.sugestao.ca_complemento && !produtoEhGesso(r.sugestao.ca_complemento.produto) ? r.sugestao.ca_complemento.doseCorrigida : 0);
        calagem.dose_sugerida = Math.round(doseTotalCalcario);
        calagem.dose = valorAplicar('calagem', calagem.dose_sugerida);
        // Gesso (separado, não soma)
        calagem.dose_gesso = (r.sugestao.ca_complemento && produtoEhGesso(r.sugestao.ca_complemento.produto))
          ? Math.round(r.sugestao.ca_complemento.doseCorrigida) : 0;
        // Snapshots dos déficits e produtos sugeridos
        calagem.deficits = {
          ca: r.deficits.ca,
          mg: r.deficits.mg,
          k: r.deficits.k
        };
        calagem.deficitsKg = r.deficitsKg;
        calagem.sugestaoProdutos = {
          mg: r.sugestao.mg ? {nome:r.sugestao.mg.produto.nome, dose:Math.round(r.sugestao.mg.doseCorrigida), prnt:r.sugestao.mg.prnt} : null,
          ca: r.sugestao.ca ? {nome:r.sugestao.ca.produto.nome, dose:Math.round(r.sugestao.ca.doseCorrigida), prnt:r.sugestao.ca.prnt} : null,
          ca_complemento: r.sugestao.ca_complemento ? {nome:r.sugestao.ca_complemento.produto.nome, dose:Math.round(r.sugestao.ca_complemento.doseCorrigida), prnt:r.sugestao.ca_complemento.prnt, ehGesso:produtoEhGesso(r.sugestao.ca_complemento.produto)} : null
        };
      }
      calagem.eqCaPct = w.eqCaPct || 60;
      calagem.eqMgPct = w.eqMgPct || 15;
      calagem.eqKPct = w.eqKPct || 5;
      calagem.profundidade = w.profundidade;
    }
    const tipoCalc = sugerirCalcarioImpl(params.calcio, params.magnesio);
    if (tipoCalc) calagem.tipo = tipoCalc.tipo;
    const microsOut = {};
    const mapa = {zn:'zinco', b:'boro', cu:'cobre', mn:'manganes'};
    for (const [k, pid] of Object.entries(mapa)) {
      const val = params[pid];
      const t = window.TABELA_MICROS[k];
      if (val == null || !t) continue;
      const faixa = t.faixas.find(f => val <= f.ate);
      microsOut[k] = {
        valor: val,
        classe: faixa.cls,
        dose_sugerida: faixa.dose,
        dose: valorAplicar(k, faixa.dose)
      };
    }
    const nSug = linhaNK ? linhaNK.n : null;
    const dadosRec = {
      talhaoId: w.talhaoId,
      talhaoNome: talhao?.nome || talhao?.id || '',
      fazenda: talhao?.fazenda || '',
      amostraId: w.amostraId,
      amostraNome: am?.nome || '',
      analiseId: am?.analiseId || '',
      dataAnalise: analise?.dataLaudo || analise?.dataEntrada || '',
      fase: 'producao',
      produtividade: w.produtividade,
      manual: w.manual,
      calagem,
      // Doses: _sugerido (tabela) e o valor a aplicar (= sugerido OU ajuste manual)
      n_sugerido: nSug,
      n: nSug !== null ? valorAplicar('n', nSug) : null,
      p2o5_sugerido: pDose,
      p2o5: pDose !== null ? valorAplicar('p2o5', pDose) : null,
      k2o_sugerido: kDose,
      k2o: kDose !== null ? valorAplicar('k2o', kDose) : null,
      micros: microsOut,
      ajustes: window.recWIP.ajustes,    // snapshot dos ajustes pra reabertura
      observacoes: w.observacoes || '',
      status: 'rascunho',
      atualizadoEm: new Date().toISOString(),
      atualizadoPor: usuarioAtual.email
    };
    if (window.editandoId) {
      await updateDoc(doc(db,'recomendacoes',window.editandoId), dadosRec);
    } else {
      dadosRec.criadoEm = new Date().toISOString();
      dadosRec.criadoPor = usuarioAtual.email;
      await addDoc(collection(db,'recomendacoes'), dadosRec);
    }
    try {
      await addDoc(collection(db,'logs'), {
        tipo:'recomendacao',
        mensagem:`${usuarioAtual.email} ${window.editandoId?'editou':'criou'} recomendação (${dadosRec.fazenda} · ${dadosRec.talhaoNome}, ${dadosRec.produtividade} sc/ha)`,
        criadoEm: new Date().toISOString(), uid: usuarioAtual.uid
      });
    } catch(e) {}
    toast(`✅ Recomendação ${window.editandoId?'atualizada':'salva'}!`);
    window.editandoId = null;
  } catch(e) {
    console.error(e);
    toast('❌ Erro: '+e.message);
  }
  btn.disabled = false; btn.textContent = '💾 Salvar';
};

window.copiarResumo = function() {
  const w = window.recWIP;
  if (!w.talhaoId || !w.amostraId || !w.produtividade) {
    toast('⚠️ Complete a recomendação primeiro.'); return;
  }
  const talhao = talhoes.find(t => t._docId === w.talhaoId);
  const am = amostras.find(a => a._docId === w.amostraId);
  const analise = analises.find(an => an._docId === am?.analiseId);
  const params = am?.parametros || {};
  // Recalcular
  const linhaNK = window.TABELA_N_K.find(r => w.produtividade >= r.prodMin && w.produtividade <= r.prodMax);
  let pDose = null;
  if (params.p_mehlich != null && params.p_remanescente != null) {
    let classe;
    if (params.p_remanescente < 20) classe = window.FAIXAS_P_POR_PREM.baixoPrem;
    else if (params.p_remanescente < 40) classe = window.FAIXAS_P_POR_PREM.medioPrem;
    else classe = window.FAIXAS_P_POR_PREM.altoPrem;
    const faixa = classe.faixas.find(f => params.p_mehlich <= f.ate);
    const idx = ['muitoBaixo','baixo','medio','alto'].indexOf(faixa.cls);
    const linhaP = window.TABELA_P.find(r => w.produtividade >= r.prodMin && w.produtividade <= r.prodMax);
    if (linhaP) pDose = linhaP.dose[idx];
  }
  let kDose = null;
  if (params.potassio != null && linhaNK) {
    const faixaK = FAIXAS_K_SOLO.find(f => params.potassio >= f.min && params.potassio < f.max) || FAIXAS_K_SOLO[FAIXAS_K_SOLO.length-1];
    kDose = linhaNK.k[faixaK.idx];
  }
  let calagemTxt = '';
  if (w.metodoCalagem === 'v') {
    const r = calcCalagemVImpl(params.v, params.ctc_ph7, w.v2, w.prnt, w.profundidade);
    if (r && !r.jaCorrigido) {
      const sug = Math.round(r.ncCorrigida * 1000);
      const apl = valorAplicar('calagem', sug);
      const ajustadoTag = apl !== sug ? ' ⚠️ ajustado (sugerido era '+sug+')' : '';
      calagemTxt = `Calcário: ${fmt(apl, 0)} kg/ha (V%, ${w.profundidade}cm, PRNT ${w.prnt}%)${ajustadoTag}`;
    }
  } else if (w.metodoCalagem === 'equilibrio') {
    const produtos = produtosCorretivosDoCatalogo();
    const r = calcEquilibrioIonicoImpl(params, w, produtos);
    if (!r.erro) {
      const linhas = [];
      if (r.sugestao.mg) linhas.push(`${r.sugestao.mg.produto.nome}: ${fmt(r.sugestao.mg.doseCorrigida,0)} kg/ha`);
      if (r.sugestao.ca) linhas.push(`${r.sugestao.ca.produto.nome}: ${fmt(r.sugestao.ca.doseCorrigida,0)} kg/ha`);
      if (r.sugestao.ca_complemento) {
        const tag = produtoEhGesso(r.sugestao.ca_complemento.produto) ? ' ⚠️ não eleva pH' : '';
        linhas.push(`${r.sugestao.ca_complemento.produto.nome}: ${fmt(r.sugestao.ca_complemento.doseCorrigida,0)} kg/ha${tag}`);
      }
      if (linhas.length) calagemTxt = 'Correção bases (equilíbrio):\n' + linhas.map(l => '  • '+l).join('\n');
    }
  }
  const mapa = {zn:'Zn', b:'B', cu:'Cu', mn:'Mn'};
  const microsTxt = [];
  for (const [k, lab] of Object.entries(mapa)) {
    const val = params[k === 'b' ? 'boro' : k === 'zn' ? 'zinco' : k === 'cu' ? 'cobre' : 'manganes'];
    const t = window.TABELA_MICROS[k];
    if (val == null || !t) continue;
    const faixa = t.faixas.find(f => val <= f.ate);
    const apl = valorAplicar(k, faixa.dose);
    if (apl > 0) {
      const tag = apl !== faixa.dose ? ` ⚠️ ajustado (sug. ${faixa.dose})` : '';
      microsTxt.push(`${lab}: ${apl} kg/ha${tag}`);
    }
  }
  const nApl = linhaNK ? valorAplicar('n', linhaNK.n) : null;
  const pApl = pDose !== null ? valorAplicar('p2o5', pDose) : null;
  const kApl = kDose !== null ? valorAplicar('k2o', kDose) : null;
  const linhaN = linhaNK ? `• N: ${nApl}${nApl !== linhaNK.n ? ` ⚠️ ajustado (sug. ${linhaNK.n})` : ''}\n` : '';
  const linhaP = pDose !== null ? `• P₂O₅: ${pApl}${pApl !== pDose ? ` ⚠️ ajustado (sug. ${pDose})` : ''}\n` : '';
  const linhaK = kDose !== null ? `• K₂O: ${kApl}${kApl !== kDose ? ` ⚠️ ajustado (sug. ${kDose})` : ''}\n` : '';
  const txt = `🌱 RECOMENDAÇÃO TÉCNICA
Fazenda: ${talhao?.fazenda || '—'}
Talhão: ${talhao?.nome || talhao?.id || '—'}
Análise: ${am?.nome || '—'} (${formatarData(analise?.dataLaudo || analise?.dataEntrada)})
Produtividade esperada: ${fmt(w.produtividade,0)} sc/ha
Manual: ${window.METAS_CALAGEM[w.manual]?.nome || w.manual}

ADUBAÇÃO (kg/ha/ano):
${linhaN}${linhaP}${linhaK}${microsTxt.length ? '\nMICROS:\n' + microsTxt.map(m=>'• '+m).join('\n') + '\n' : ''}
CORREÇÃO:
${calagemTxt ? '• ' + calagemTxt : '• Não há necessidade de correção'}

${w.observacoes ? 'Observações: ' + w.observacoes : ''}
---
Gerado em ${formatarData(hoje())} via Conilon Tech`;
  navigator.clipboard.writeText(txt).then(() => {
    toast('📋 Copiado pra área de transferência!');
  }).catch(e => {
    console.error(e);
    toast('❌ Não consegui copiar. Use uma versão recente do navegador.');
  });
};
