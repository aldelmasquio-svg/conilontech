window.renderLista = function() {
  const cont = document.getElementById('content');
  if (!recomendacoes.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">📋</div><p><strong>Nenhuma recomendação salva ainda.</strong><br>
      <span style="font-size:.78rem;">Vá em "🧮 Nova" pra calcular.</span></p></div>`;
    return;
  }
  const lista = [...recomendacoes].sort((a,b) => (b.atualizadoEm||b.criadoEm||'').localeCompare(a.atualizadoEm||a.criadoEm||''));
  cont.innerHTML = lista.map(r => {
    const dosesItens = [];
    const ajust = (val, sug) => (sug !== null && sug !== undefined && Number(val) !== Number(sug));
    if (r.n) dosesItens.push({lab:`N: ${r.n}`, ajustada: ajust(r.n, r.n_sugerido)});
    if (r.p2o5 !== null && r.p2o5 !== undefined) dosesItens.push({lab:`P₂O₅: ${r.p2o5}`, ajustada: ajust(r.p2o5, r.p2o5_sugerido)});
    if (r.k2o !== null && r.k2o !== undefined) dosesItens.push({lab:`K₂O: ${r.k2o}`, ajustada: ajust(r.k2o, r.k2o_sugerido)});
    if (r.calagem?.dose > 0) dosesItens.push({lab:`Calc.: ${fmt(r.calagem.dose,0)}`, ajustada: ajust(r.calagem.dose, r.calagem.dose_sugerida)});
    if (r.calagem?.ca_dose > 0) dosesItens.push({lab:`Ca: ${r.calagem.ca_dose}`, ajustada:false});
    if (r.calagem?.mg_dose > 0) dosesItens.push({lab:`Mg: ${r.calagem.mg_dose}`, ajustada:false});
    if (r.micros) {
      for (const [k, m] of Object.entries(r.micros)) {
        const v = m.dose ?? 0;
        if (v > 0) dosesItens.push({lab:`${k.toUpperCase()}: ${v}`, ajustada: ajust(v, m.dose_sugerida)});
      }
    }
    const temAjuste = dosesItens.some(d => d.ajustada);
    return `<div class="rec-card rec-card-status-${r.status || 'rascunho'}">
      <div class="rec-card-head">
        <div style="flex:1;min-width:0;">
          <div class="rec-card-tit">💊 ${escHtml(r.fazenda || '—')} · ${escHtml(r.talhaoNome || '—')} ${temAjuste?`<span class="tag-ajustada" style="margin-left:5px;">✏️</span>`:''}</div>
          <div class="rec-card-meta">
            📊 ${fmt(r.produtividade,0)} sc/ha · ${escHtml(r.amostraNome || '—')} (${formatarData(r.dataAnalise)})<br>
            <span style="font-size:.65rem;">📅 ${formatarData((r.atualizadoEm||r.criadoEm||'').slice(0,10))} · ${escHtml(window.METAS_CALAGEM[r.manual]?.nome || r.manual || '—')}</span>
          </div>
        </div>
        <span class="rec-status-badge rec-status-${r.status||'rascunho'}">${(r.status||'rascunho').toUpperCase()}</span>
      </div>
      <div class="rec-card-doses">
        ${dosesItens.map(d => `<span class="rec-card-dose" ${d.ajustada?'style="background:#fef3c7;border-color:#f59e0b;color:#92400e;"':''}>${escHtml(d.lab)}${d.ajustada?' ✏️':''}</span>`).join('')}
      </div>
      <div class="rec-card-acoes">
        <button class="btn-acao primary" onclick="verRecomendacao('${r._docId}')">👁 Ver</button>
        ${podeEditar() && r.status !== 'aplicada' ? `<button class="btn-acao" onclick="editarRecomendacao('${r._docId}')">✏️ Editar</button>` : ''}
        ${podeEditar() && r.status === 'rascunho' ? `<button class="btn-acao" onclick="mudarStatusRec('${r._docId}','aprovada')">✓ Aprovar</button>` : ''}
        ${podeEditar() && r.status === 'aprovada' ? `<button class="btn-acao" onclick="mudarStatusRec('${r._docId}','aplicada')">✓ Marcar aplicada</button>` : ''}
        ${isAdmin() ? `<button class="btn-acao danger" onclick="excluirRecomendacao('${r._docId}')">🗑</button>` : ''}
      </div>
    </div>`;
  }).join('');
};

window.verRecomendacao = function(id) {
  const r = recomendacoes.find(x => x._docId === id);
  if (!r) return;
  document.getElementById('verTitulo').textContent = `💊 ${r.fazenda} · ${r.talhaoNome}`;
  const calagemTxt = renderCalagemTxt(r.calagem);
  // Helper: linha de nutriente com ajuste visível
  const linhaNut = (lab, valSug, val) => {
    if (val === null || val === undefined) return '';
    const foiAjust = (valSug !== null && valSug !== undefined && Number(val) !== Number(valSug));
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--cl);gap:8px;">
      <span style="flex:1;">${lab}</span>
      ${foiAjust ? `<span style="font-family:'DM Mono',monospace;font-size:.78rem;color:var(--c);text-decoration:line-through;">${valSug}</span>` : ''}
      <span style="font-family:'DM Mono',monospace;font-weight:700;color:${foiAjust?'#92400e':'var(--ve)'};">${val}</span>
      ${foiAjust ? `<span class="tag-ajustada">✏️</span>` : ''}
    </div>`;
  };
  const microsTxt = r.micros ? Object.entries(r.micros).filter(([_,m])=>{
    const v = (m.dose !== undefined) ? m.dose : 0;
    return v > 0;
  }).map(([k,m]) => {
    const v = m.dose ?? 0;
    const sug = m.dose_sugerida ?? m.dose ?? 0;
    return linhaNut(k.toUpperCase(), sug, v);
  }).join('') : '';
  document.getElementById('verBody').innerHTML = `
    <div style="background:#fafafa;padding:10px;border-radius:8px;margin-bottom:11px;font-size:.82rem;line-height:1.6;">
      <div><strong>Análise:</strong> ${escHtml(r.amostraNome)} (${formatarData(r.dataAnalise)})</div>
      <div><strong>Produtividade:</strong> ${fmt(r.produtividade,0)} sc/ha</div>
      <div><strong>Manual:</strong> ${escHtml(window.METAS_CALAGEM[r.manual]?.nome || r.manual)}</div>
      <div><strong>Status:</strong> <span class="rec-status-badge rec-status-${r.status||'rascunho'}">${(r.status||'rascunho').toUpperCase()}</span></div>
    </div>
    <div style="background:white;padding:11px;border-radius:8px;border:1px solid var(--cl);margin-bottom:11px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--ve);margin-bottom:8px;font-size:.95rem;">ADUBAÇÃO (kg/ha/ano)</div>
      ${linhaNut('Nitrogênio (N)', r.n_sugerido ?? r.n, r.n)}
      ${linhaNut('Fósforo (P₂O₅)', r.p2o5_sugerido ?? r.p2o5, r.p2o5)}
      ${linhaNut('Potássio (K₂O)', r.k2o_sugerido ?? r.k2o, r.k2o)}
      ${microsTxt}
      <div style="font-size:.66rem;color:var(--c);margin-top:6px;font-style:italic;">✏️ = valor ajustado manualmente (riscado = sugerido pela tabela)</div>
    </div>
    <div style="background:white;padding:11px;border-radius:8px;border:1px solid var(--cl);margin-bottom:11px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;color:var(--ve);margin-bottom:8px;font-size:.95rem;">CORREÇÃO DO SOLO</div>
      ${calagemTxt}
    </div>
    ${r.observacoes ? `<div style="background:#fffbeb;padding:10px;border-radius:8px;border:1px solid #fde68a;font-size:.82rem;line-height:1.5;"><strong>Observações:</strong><br>${escHtml(r.observacoes)}</div>` : ''}
  `;
  document.getElementById('overlayVer').classList.add('aberto');
};

function renderCalagemTxt(c) {
  if (!c) return '<div style="color:var(--c);">Sem dados de calagem.</div>';
  if (c.metodo === 'complemento') {
    // Legado
    const itens = [];
    if (c.ca_dose > 0) itens.push(`Cálcio: <strong>${c.ca_dose} kg/ha</strong> (gesso)`);
    if (c.mg_dose > 0) itens.push(`Magnésio: <strong>${c.mg_dose} kg/ha</strong> (sulfato Mg)`);
    return itens.length ? `<div style="font-size:.82rem;line-height:1.7;">${itens.map(i => '• '+i).join('<br>')}</div>` : '<div style="color:var(--ok);font-size:.85rem;">✓ Sem necessidade de complementação.</div>';
  }
  if (c.metodo === 'equilibrio' && c.sugestaoProdutos) {
    const itens = [];
    if (c.sugestaoProdutos.mg) itens.push(`<strong>${escHtml(c.sugestaoProdutos.mg.nome)}:</strong> ${fmt(c.sugestaoProdutos.mg.dose,0)} kg/ha${c.sugestaoProdutos.mg.prnt?` (PRNT ${c.sugestaoProdutos.mg.prnt}%)`:''}`);
    if (c.sugestaoProdutos.ca) itens.push(`<strong>${escHtml(c.sugestaoProdutos.ca.nome)}:</strong> ${fmt(c.sugestaoProdutos.ca.dose,0)} kg/ha${c.sugestaoProdutos.ca.prnt?` (PRNT ${c.sugestaoProdutos.ca.prnt}%)`:''}`);
    if (c.sugestaoProdutos.ca_complemento) {
      const ehGesso = c.sugestaoProdutos.ca_complemento.ehGesso;
      itens.push(`<strong>${escHtml(c.sugestaoProdutos.ca_complemento.nome)}${ehGesso?' ⚠️':''}:</strong> ${fmt(c.sugestaoProdutos.ca_complemento.dose,0)} kg/ha`);
    }
    // Déficits resumidos
    const defs = [];
    if (c.deficits?.ca && c.deficits.ca.deficit > 0) defs.push(`Ca déf: ${fmt(c.deficits.ca.deficit,2)} cmolc/dm³`);
    if (c.deficits?.mg && c.deficits.mg.deficit > 0) defs.push(`Mg déf: ${fmt(c.deficits.mg.deficit,2)}`);
    if (c.deficits?.k && c.deficits.k.deficit > 0) defs.push(`K déf: ${fmt(c.deficits.k.deficit,2)}`);
    return `<div style="font-size:.82rem;line-height:1.7;">
      ${itens.length ? itens.map(i => '• '+i).join('<br>') : '<span style="color:var(--ok);">✓ Solo equilibrado, sem correção necessária.</span>'}
      ${defs.length ? `<br><span style="font-size:.7rem;color:var(--c);">${defs.join(' · ')}</span>` : ''}
      <br><span style="font-size:.72rem;color:var(--c);">Método: Equilíbrio iônico · Metas: Ca ${c.eqCaPct||60}% · Mg ${c.eqMgPct||15}% · K ${c.eqKPct||5}% · ${c.profundidade||20}cm</span>
    </div>`;
  }
  if (!c.dose || c.dose === 0) return '<div style="color:var(--ok);font-size:.85rem;">✓ Não precisa calagem.</div>';
  const sug = c.dose_sugerida ?? c.dose;
  const foiAjust = Number(c.dose) !== Number(sug);
  return `<div style="font-size:.82rem;line-height:1.6;">
    <strong>Calcário:</strong>
    ${foiAjust ? `<span style="font-family:'DM Mono',monospace;color:var(--c);text-decoration:line-through;margin-right:6px;">${fmt(sug,0)}</span>` : ''}
    <span style="font-family:'DM Mono',monospace;font-weight:700;color:${foiAjust?'#92400e':'var(--ve)'};">${fmt(c.dose,0)} kg/ha</span>
    ${foiAjust ? `<span class="tag-ajustada" style="margin-left:5px;">✏️ Ajustado</span>` : ''}
    ${c.tipo ? ` (${c.tipo === 'dolomitico' ? 'dolomítico' : c.tipo === 'calcitico' ? 'calcítico' : 'magnesiano'})` : ''}<br>
    <span style="font-size:.72rem;color:var(--c);">Método: ${c.metodo === 'v' ? `V% (V₂=${c.v2})` : `Ca+Mg (Ca=${c.ca2}, Mg=${c.mg2})`} · PRNT ${c.prnt}% · ${c.profundidade}cm</span>
  </div>`;
}

window.editarRecomendacao = function(id) {
  const r = recomendacoes.find(x => x._docId === id);
  if (!r) return;
  // Carrega no formulário e troca pra aba Nova
  window.editandoId = id;
  let metodo = r.calagem?.metodo || 'v';
  // Compatibilidade: planos antigos com cmag/complemento abrem em equilibrio
  if (metodo === 'cmag' || metodo === 'complemento') metodo = 'equilibrio';
  window.recWIP = {
    talhaoId: r.talhaoId,
    amostraId: r.amostraId,
    produtividade: r.produtividade,
    manual: r.manual || 'incaper',
    metodoCalagem: metodo,
    v2: r.calagem?.v2 || 60,
    ca2: r.calagem?.ca2 || 3.0,
    mg2: r.calagem?.mg2 || 1.0,
    prnt: r.calagem?.prnt || 80,
    profundidade: r.calagem?.profundidade || 20,
    eqCaPct: r.calagem?.eqCaPct || 60,
    eqMgPct: r.calagem?.eqMgPct || 15,
    eqKPct: r.calagem?.eqKPct || 5,
    eqProdutoCaId: null,
    eqProdutoMgId: null,
    ajustes: r.ajustes || {n:null, p2o5:null, k2o:null, calagem:null, zn:null, b:null, cu:null, mn:null},
    cardsAbertos: {resumo:true, calagem:true, n:true, p:true, k:true, micros:true},
    observacoes: r.observacoes || ''
  };
  document.getElementById('selTalhao').value = r.talhaoId;
  document.getElementById('inpProd').value = r.produtividade;
  document.getElementById('selManual').value = r.manual || 'incaper';
  abrirTab('nova');
  onTrocaTalhao();
  toast('✏️ Editando recomendação');
};

window.mudarStatusRec = async function(id, novoStatus) {
  if (!podeEditar()) { toast('⛔ Sem permissão.'); return; }
  try {
    await updateDoc(doc(db,'recomendacoes',id), {
      status: novoStatus,
      atualizadoEm: new Date().toISOString(),
      atualizadoPor: usuarioAtual.email
    });
    toast(`✅ Status: ${novoStatus}`);
  } catch(e) {
    console.error(e); toast('❌ Erro: '+e.message);
  }
};

window.excluirRecomendacao = async function(id) {
  if (!isAdmin()) { toast('⛔ Só admin pode excluir.'); return; }
  const r = recomendacoes.find(x => x._docId === id);
  if (!r) return;
  if (!confirm(`Excluir recomendação de ${r.fazenda} · ${r.talhaoNome}?\n\nEsta ação não pode ser desfeita.`)) return;
  try {
    await deleteDoc(doc(db,'recomendacoes',id));
    toast('🗑 Recomendação excluída.');
  } catch(e) {
    console.error(e); toast('❌ Erro: '+e.message);
  }
};

window.limparRecomendacao = function() {
  window.editandoId = null;
  window.recWIP = {
    talhaoId:'', amostraId:'', produtividade:null, manual:'incaper',
    metodoCalagem:'v', v2:60, ca2:3.0, mg2:1.0, prnt:80, profundidade:20,
    eqCaPct:60, eqMgPct:15, eqKPct:5, eqProdutoCaId:null, eqProdutoMgId:null,
    ajustes: {n:null, p2o5:null, k2o:null, calagem:null, zn:null, b:null, cu:null, mn:null},
    cardsAbertos:{resumo:true, calagem:true, n:true, p:true, k:true, micros:true},
    observacoes:''
  };
  document.getElementById('selTalhao').value = '';
  document.getElementById('selAnalise').innerHTML = '<option value="">—</option>';
  document.getElementById('selAnalise').disabled = true;
  document.getElementById('inpProd').value = '';
  document.getElementById('histProd').textContent = '';
  document.getElementById('selManual').value = 'incaper';
  onRecalcular();
};
