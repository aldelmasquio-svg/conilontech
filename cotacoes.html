<script type="module">

const firebaseConfig={apiKey:"AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",authDomain:"talhoes-df836.firebaseapp.com",projectId:"talhoes-df836",storageBucket:"talhoes-df836.firebasestorage.app",messagingSenderId:"1047022702039",appId:"1:1047022702039:web:001cf6a3c028c494ab8f92"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});
// NOTA: este módulo foi clonado de pedidos.html — a máquina de mapa/seleção de talhões é a mesma
// (variáveis/funções mantêm o prefixo "ped" por reuso). A diferença é o resultado: em vez de um
// pedido com workflow de status, gera uma COTAÇÃO que recebe propostas de fornecedores na aba Cotação.
let usuarioAtual=null,perfilAtual={},talhoes=[],pedidos=[],pedidoWIP=null,pedItemAtivo=null,pedMapIniciado=false,pedMap,pedPolMap={},pedSidebarAberta=true,tabAtual='mapa';
let cotacaoAberta=null, fornecedoresWIP=[]; // estado da aba Cotação (execução)
let garantias=[], garantiasWIP={}; // aba Comparar: garantias/composição por produto (coleção garantiasProdutos)
const PED_CORES={ativo:{border:'rgba(123,198,126,.9)',fill:'rgba(74,140,63,.4)'},reforma:{border:'rgba(220,190,90,.9)',fill:'rgba(201,168,76,.4)'},colhido:{border:'rgba(196,133,90,.9)',fill:'rgba(139,94,60,.4)'}};
onAuthStateChanged(auth,async(user)=>{
  if(!user){window.location.href='login.html';return;}
  usuarioAtual=user;
  const snap=await getDoc(doc(db,'usuarios',user.uid));
  if(!snap.exists()){await signOut(auth);return;}
  perfilAtual=snap.data();
  if(!perfilAtual.modulos&&perfilAtual.perfil==='admin')perfilAtual.modulos={mapa:'admin',atividades:'admin',adubacao:'admin',config:'admin',pulverizacao:'admin',pedidos:'admin',cotacoes:'admin',admin:'admin'};
  document.getElementById('userNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserEmail').textContent=user.email;
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appContent').style.display='flex';
  gerarMenu();
  if(!isAdmin())document.getElementById('fabNovoPedido').style.display='none';
  onSnapshot(collection(db,'talhoes'),snap=>{talhoes=snap.docs.map(d=>({_docId:d.id,...d.data()}));if(pedMapIniciado)renderizarPedPoligonos();});
  onSnapshot(collection(db,'cotacoes'),snap=>{pedidos=snap.docs.map(d=>({_docId:d.id,...d.data()})).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));if(tabAtual==='lista')renderizarCotacoes();if(tabAtual==='comparar')renderComparar();if(cotacaoAberta)sincronizarModal();});
  onSnapshot(collection(db,'garantiasProdutos'),snap=>{garantias=snap.docs.map(d=>({_docId:d.id,...d.data()}));if(tabAtual==='comparar')renderComparar();});
  setTimeout(iniciarMapaPedidos,200);
});
function isAdmin(){return Object.values(perfilAtual.modulos||{}).includes('admin')||perfilAtual.perfil==='admin';}
// Converte string com vírgula brasileira em número (ex: "13,5" → 13.5)
function parseDose(s){if(s==null||s==='')return 0;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?0:n;}
function gerarMenu() {
  const isAdm = Object.values(perfilAtual.modulos || {}).includes('admin') || perfilAtual.perfil === 'admin';
  const pg = (window.location.pathname.split('/').pop() || 'index.html');
  const secoes = [
    { label: 'Principal', items: [
      { href:'index.html',         ico:'📊', label:'Dashboard' },
      { href:'agenda.html',        ico:'📅', label:'Agenda' },
      { href:'mapa.html',          ico:'🗺️', label:'Mapa de Talhões',   acesso:'mapa' },
      { href:'adubacoes.html',     ico:'🧪', label:'Adubações',         acesso:'adubacao' },
      { href:'pulverizacoes.html', ico:'💧', label:'Pulverizações',     acesso:'pulverizacao' },
      { href:'drench.html',        ico:'🌱', label:'Drench Preventivo', acesso:'pulverizacao' },
      { href:'atividades.html',    ico:'🌾', label:'Atividades',        acesso:'atividades' },
      { href:'equipe.html',        ico:'👥', label:'Equipe',            acesso:'equipe' },
      { href:'estoque.html',       ico:'🏬', label:'Estoque',           acesso:'estoque' },
      { href:'pedidos.html',       ico:'📦', label:'Pedidos',           acesso:'pedidos' },
      { href:'cotacoes.html',      ico:'💰', label:'Cotações',          acesso:'pedidos' },
    ]},
    { label: 'Análise', items: [
      { href:'gestao.html',        ico:'📈', label:'Gestão',            acesso:'gestao' },
      { href:'analises.html',      ico:'🔬', label:'Análises',          acesso:'analises' },
      { href:'recomendacoes.html', ico:'💊', label:'Recomendações',     acesso:'recomendacoes' },
      { href:'planejamento.html',  ico:'🗓️', label:'Planejamento',      acesso:'planejamento' },
      ...(isAdm ? [{ href:'admin.html', ico:'⚙️', label:'Administração' }] : []),
    ]},
  ];
  document.getElementById('menuModulos').innerHTML = secoes.map(s => {
    const html = s.items.map(m => {
      if (typeof nivelAcesso === 'function' && m.acesso && nivelAcesso(m.acesso) === 'nenhum') return '';
      return `<a class="menu-item${pg===m.href?' ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`;
    }).filter(Boolean).join('');
    return html ? `<div class="menu-secao">${s.label}</div>${html}` : '';
  }).join('');
}
function iniciarMapaPedidos(){
  if(pedMapIniciado){pedMap?.invalidateSize();return;}
  pedMapIniciado=true;
  pedMap=L.map('pedidosMap',{center:[-18.7166,-40.4000],zoom:14});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}).addTo(pedMap);
  setTimeout(()=>pedMap.invalidateSize(),300);
  renderizarPedPoligonos();
}
function pedCorPoly(id){
  const t=talhoes.find(x=>x.id===id),cor=PED_CORES[t?.status||'ativo']||PED_CORES.ativo;
  const item=pedidoWIP&&pedItemAtivo!==null?pedidoWIP.itens[pedItemAtivo]:null;
  const sel=item&&item.talhoes.has(id),emOutro=pedidoWIP&&pedidoWIP.itens.some((it,i)=>i!==pedItemAtivo&&it.talhoes.has(id));
  if(sel)return{color:'#f5c842',weight:4,fillColor:'rgba(245,200,66,.55)',fillOpacity:1};
  if(emOutro)return{color:'#60a5fa',weight:2.5,fillColor:'rgba(96,165,250,.3)',fillOpacity:1};
  return{color:cor.border,weight:2,fillColor:cor.fill,fillOpacity:1};
}
function renderizarPedPoligonos(){
  if(!pedMap)return;
  Object.values(pedPolMap).forEach(p=>pedMap.removeLayer(p));pedPolMap={};
  talhoes.forEach(t=>{
    if(!t.coordenadas||t.coordenadas.length<3)return;
    const latlngs=t.coordenadas.map(c=>Array.isArray(c)?c:[c.lat,c.lng]);
    const poly=L.polygon(latlngs,pedCorPoly(t.id)).addTo(pedMap);
    poly.bindTooltip(`<b>${t.id}</b> · ${t.nome}`,{sticky:true,direction:'top'});
    poly.on('click',e=>{L.DomEvent.stopPropagation(e);clicarTalhao(t.id);});
    poly.on('mouseover',()=>{const c=pedCorPoly(t.id);poly.setStyle({...c,weight:c.weight+1,fillOpacity:.6});});
    poly.on('mouseout',()=>poly.setStyle(pedCorPoly(t.id)));
    pedPolMap[t.id]=poly;
  });
  renderizarPedSidebar();
}
function renderizarPedSidebar(){
  const lista=document.getElementById('pedSidebarList');if(!lista)return;
  const fazendas={};
  talhoes.forEach(t=>{const f=t.fazenda||'Sem fazenda';if(!fazendas[f])fazendas[f]=[];fazendas[f].push(t);});
  lista.innerHTML=Object.entries(fazendas).sort().map(([faz,ts])=>`
    <div class="sb-faz">${faz}</div>
    ${ts.map(t=>{const item=pedidoWIP&&pedItemAtivo!==null?pedidoWIP.itens[pedItemAtivo]:null,sel=item&&item.talhoes.has(t.id),temMapa=t.coordenadas?.length>=3;
    return `<div class="msb-item ${sel?'active':''}" onclick="${temMapa?`clicarTalhao('${t.id}')`:''}" style="${!temMapa?'opacity:.4;cursor:default;':''}">
      <div class="msb-dot ${t.status||'ativo'}"></div>
      <div class="msb-info"><div class="msb-id">${t.id}</div><div class="msb-nome">${t.nome}</div></div>
      ${sel?'<span style="color:var(--v);font-weight:700;">✓</span>':''}
    </div>`;}).join('')}`).join('');
}
function clicarTalhao(id){
  if(!isAdmin())return;
  if(!pedidoWIP){iniciarNovoPedido();return;}
  if(pedItemAtivo===null)pedItemAtivo=0;
  const item=pedidoWIP.itens[pedItemAtivo];
  if(item.talhoes.has(id))item.talhoes.delete(id);else item.talhoes.add(id);
  renderizarPedPoligonos();renderizarItensPedido();
}
window.clicarTalhao=clicarTalhao;
window.togglePedSidebar=function(){pedSidebarAberta=!pedSidebarAberta;const sb=document.getElementById('pedSidebar'),btn=document.getElementById('btnExpandPedSb');if(sb)sb.style.display=pedSidebarAberta?'flex':'none';if(btn)btn.style.display=pedSidebarAberta?'none':'flex';if(pedMap)setTimeout(()=>pedMap.invalidateSize(),100);};
function iniciarNovoPedido(){if(!isAdmin()){toast('⛔ Sem permissão.');return;}pedidoWIP={itens:[]};adicionarItemPedido();pedItemAtivo=0;document.getElementById('painelPedido').style.display='flex';document.getElementById('fabNovoPedido').style.display='none';renderizarItensPedido();}
window.iniciarNovoPedido=iniciarNovoPedido;
const MODO_APLIC={terrestre:'🚜 Terrestre',aerea:'✈️ Aérea',fertirrigacao:'💧 Fertirrigação',drench:'🌱 Drench'};
function adicionarItemPedido(){if(!pedidoWIP)return;pedidoWIP.itens.push({produto:'',quantidade:'',unidade:'kg',modo:'terrestre',talhoes:new Set()});pedItemAtivo=pedidoWIP.itens.length-1;renderizarItensPedido();}
window.adicionarItemPedido=adicionarItemPedido;
function renderizarItensPedido(){
  if(!pedidoWIP)return;
  const el=document.getElementById('itensPedido');if(!el)return;
  el.innerHTML=pedidoWIP.itens.map((item,i)=>{
    const ativo=i===pedItemAtivo,nTal=item.talhoes.size;
    // Calcular área total dos talhões selecionados e dose total
    const areaTotal = [...item.talhoes].reduce((s,id)=>{
      const t=talhoes.find(x=>x.id===id);
      return s + (parseDose(t?.area)||0);
    },0);
    const dosePorHa = parseDose(item.quantidade)||0;
    const doseTotal = dosePorHa * areaTotal;
    const unidade = item.unidade || 'kg';
    const chips=[...item.talhoes].map(id=>{
      const t=talhoes.find(x=>x.id===id);
      const a=t?.area?` (${t.area}ha)`:'';
      return `<span class="chip-tal">${t?t.id:id}${a}<button onclick="remTalhaoPed(${i},'${id}')">✕</button></span>`;
    }).join('');
    // Resumo curto para item inativo (não colapsa totalmente, mostra o que tem)
    const resumoInativo = !ativo ? `<div class="ped-item-resumo">
      ${item.produto?`<strong>${item.produto}</strong>`:'<span style="color:var(--t4);">Sem produto</span>'}
      ${item.modo?` · ${MODO_APLIC[item.modo]||item.modo}`:''}
      ${dosePorHa>0?` · ${dosePorHa} ${unidade}/ha`:''}
      ${nTal>0?` · ${nTal} talhão(ões)`:''}
      ${doseTotal>0?` · <span class="ped-total-mini">${doseTotal.toLocaleString('pt-BR')} ${unidade}</span>`:''}
    </div>` : '';
    return `<div onclick="ativarItemPed(${i})" class="ped-item ${ativo?'ativo':''}">
      <div class="ped-item-hdr"><span class="ped-item-num">Insumo ${i+1}</span>
        <div style="display:flex;align-items:center;gap:5px;">
          ${ativo&&nTal>0?`<span class="badge-sel">${nTal} talhão(ões)</span>`:''}
          ${ativo&&nTal===0?`<span class="badge-sel">← Mapa</span>`:''}
          <button onclick="event.stopPropagation();remItemPed(${i})" class="btn-rm-item">✕</button>
        </div>
      </div>
      ${resumoInativo}
      ${ativo?`<div class="ped-item-fields" onclick="event.stopPropagation()">
        <input type="text" placeholder="Produto / Insumo (ex: Ureia)" value="${item.produto||''}" oninput="setPedProduto(${i},this.value)" class="ped-inp">
        <select onchange="setPedModo(${i},this.value)" class="ped-inp ped-modo-sel">
          ${Object.entries(MODO_APLIC).map(([k,lab])=>`<option value="${k}" ${(item.modo||'terrestre')===k?'selected':''}>${lab}</option>`).join('')}
        </select>
        <div class="ped-dose-row">
          <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="Dose por hectare" value="${item.quantidade||''}" oninput="setPedQtd(${i},this.value)" class="ped-inp ped-dose-inp-num">
          <select onchange="setPedUnidade(${i},this.value)" class="ped-und-sel">
            ${['kg','g','L','mL','sc','t'].map(u=>`<option value="${u}" ${(item.unidade||'kg')===u?'selected':''}>${u}/ha</option>`).join('')}
          </select>
        </div>
        <div class="ped-total-box" id="pedTotalBox-${i}">
          ${nTal===0
            ? '<span style="color:var(--t4);">👇 Selecione talhões no mapa pra calcular o total</span>'
            : dosePorHa===0
              ? `<span style="color:var(--t4);">Total a pedir aparecerá quando informar a dose</span>`
              : `<span class="ped-total-label">Total a pedir:</span> <strong class="ped-total-val">${doseTotal.toLocaleString('pt-BR')} ${unidade}</strong> <span class="ped-total-aux">(${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)</span>`
          }
        </div>
        ${nTal>0?`<div class="chips-talhoes">${chips}</div>`:''}
        <div class="dica-mapa">👆 Clique nos talhões do mapa</div>
      </div>`:''}
    </div>`;
  }).join('');
  const total=new Set(pedidoWIP.itens.flatMap(it=>[...it.talhoes])).size;
  const el2=document.getElementById('pedResumo');if(el2)el2.textContent=`${pedidoWIP.itens.length} insumo(s) · ${total} talhão(ões)`;
  renderizarPedPoligonos();
}

// Atualiza só a caixa do total daquele insumo (não re-renderiza tudo, preserva foco no input)
window.atualizarTotalPed = function(i) {
  const item = pedidoWIP?.itens?.[i]; if (!item) return;
  const box = document.getElementById('pedTotalBox-'+i); if (!box) return;
  const areaTotal = [...item.talhoes].reduce((s,id)=>{
    const t=talhoes.find(x=>x.id===id); return s + (parseDose(t?.area)||0);
  },0);
  const dosePorHa = parseDose(item.quantidade)||0;
  const doseTotal = dosePorHa * areaTotal;
  const unidade = item.unidade || 'kg';
  const nTal = item.talhoes.size;
  if (nTal === 0) box.innerHTML = '<span style="color:var(--t4);">👇 Selecione talhões no mapa pra calcular o total</span>';
  else if (dosePorHa === 0) box.innerHTML = '<span style="color:var(--t4);">Total a pedir aparecerá quando informar a dose</span>';
  else box.innerHTML = `<span class="ped-total-label">Total a pedir:</span> <strong class="ped-total-val">${doseTotal.toLocaleString('pt-BR')} ${unidade}</strong> <span class="ped-total-aux">(${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)</span>`;
};
// Setters expostos no window: handlers inline rodam no escopo global e não enxergam a variável de módulo pedidoWIP
window.setPedProduto=function(i,v){const it=pedidoWIP?.itens?.[i];if(it)it.produto=v;};
window.setPedQtd=function(i,v){const it=pedidoWIP?.itens?.[i];if(it){it.quantidade=v;atualizarTotalPed(i);}};
window.setPedUnidade=function(i,v){const it=pedidoWIP?.itens?.[i];if(it){it.unidade=v;atualizarTotalPed(i);}};
window.setPedModo=function(i,v){const it=pedidoWIP?.itens?.[i];if(it)it.modo=v;renderizarItensPedido();};
window.ativarItemPed=function(i){pedItemAtivo=i;renderizarItensPedido();};
window.remItemPed=function(i){pedidoWIP.itens.splice(i,1);if(!pedidoWIP.itens.length)adicionarItemPedido();else if(pedItemAtivo>=pedidoWIP.itens.length)pedItemAtivo=pedidoWIP.itens.length-1;renderizarItensPedido();};
window.remTalhaoPed=function(i,id){pedidoWIP.itens[i].talhoes.delete(id);renderizarItensPedido();};
window.pedSelTodos=function(){if(pedItemAtivo===null||!pedidoWIP)return;talhoes.forEach(t=>{if(t.coordenadas?.length>=3)pedidoWIP.itens[pedItemAtivo].talhoes.add(t.id);});renderizarItensPedido();};
window.pedLimparSel=function(){if(pedItemAtivo===null||!pedidoWIP)return;pedidoWIP.itens[pedItemAtivo].talhoes.clear();renderizarItensPedido();};
window.cancelarPedido=function(){if(pedidoWIP&&!confirm('Cancelar esta cotação?'))return;pedidoWIP=null;pedItemAtivo=null;document.getElementById('painelPedido').style.display='none';document.getElementById('fabNovoPedido').style.display=isAdmin()?'flex':'none';renderizarPedPoligonos();};
window.salvarPedidoWIP=async function(){
  if(!pedidoWIP)return;
  const itensValidos=pedidoWIP.itens.filter(it=>it.produto.trim());
  if(!itensValidos.length){toast('⚠️ Preencha ao menos um produto.');return;}
  const semTal=itensValidos.find(it=>it.talhoes.size===0);
  if(semTal){toast(`⚠️ "${semTal.produto}" sem talhões.`);return;}
  const semDose=itensValidos.find(it=>!parseDose(it.quantidade));
  if(semDose){toast(`⚠️ "${semDose.produto}" sem dose/ha.`);return;}
  const btn=document.getElementById('btnSalvarPed');btn.disabled=true;btn.textContent='Salvando...';
  try{
    const itensFS=itensValidos.map(it=>{
      const talhoesArr=[...it.talhoes].map(id=>{
        const t=talhoes.find(x=>x.id===id);
        return {id, nome:t?.nome||id, fazenda:t?.fazenda||'', area:parseDose(t?.area)||0};
      });
      const areaTotal = talhoesArr.reduce((s,t)=>s+t.area, 0);
      const dosePorHa = parseDose(it.quantidade)||0;
      const unidade = it.unidade || 'kg';
      const total = dosePorHa * areaTotal; // quantidade total necessária do insumo
      return {
        produto: it.produto.trim(),
        modo: it.modo || 'terrestre',
        dosePorHa,
        unidade,
        areaTotal: Math.round(areaTotal*100)/100,
        total: Math.round(total*100)/100,
        quantidade: `${total.toLocaleString('pt-BR')} ${unidade} (${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)`,
        talhoes: talhoesArr
      };
    });
    // Cotação nasce "aberta", sem fornecedores; as propostas entram na aba Cotação
    await addDoc(collection(db,'cotacoes'),{itens:itensFS,status:'aberta',fornecedores:[],criadoEm:new Date().toISOString(),criadoPor:usuarioAtual.email});
    window.cancelarPedido();toast('✅ Cotação criada! Agora adicione os fornecedores na aba Cotação.');
    abrirTab('lista',document.getElementById('ptab-lista'));
  }catch(e){toast('❌ Erro: '+e.message);}
  btn.disabled=false;btn.textContent='💾 Salvar Cotação';
};
// ══════════════════════════════════════════════════════════════
// ABA COTAÇÃO (execução) — lista de cotações + comparador de fornecedores
// ══════════════════════════════════════════════════════════════
const STATUS_COT = { aberta:{lab:'📥 Aberta',cor:'#f59e0b'}, fechada:{lab:'✅ Fechada',cor:'#22c55e'} };
function fmtRS(n){ return 'R$ ' + (Math.round((n||0)*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function sanitizar(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
// Escapa string p/ argumento JS entre aspas simples dentro de atributo HTML (onclick="fn('...')")
function escJs(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// Comparativo dado {itens, fornecedores}: total por fornecedor (só itens cotados), melhor completo, melhor por item
function calcComparativo(c){
  const itens=c.itens||[], forns=c.fornecedores||[];
  const linhas=forns.map((f,fi)=>{
    let total=0, cotouTudo=true, nCotados=0;
    itens.forEach((it,ii)=>{
      const p=parseDose(f.precos?.[ii]);
      if(p>0){ total+=p*(it.total||0); nCotados++; } else { cotouTudo=false; }
    });
    // Produtos alternativos oferecidos pelo fornecedor entram no total dele
    let nExtras=0;
    (f.extras||[]).forEach(ex=>{ const p=parseDose(ex.preco), q=parseDose(ex.quantidade); if(p>0&&q>0){ total+=p*q; nExtras++; } });
    return {fi, nome:(f.nome||'').trim()||`Fornecedor ${fi+1}`, total, cotouTudo:cotouTudo&&itens.length>0, nCotados, nExtras};
  });
  const completos=linhas.filter(l=>l.cotouTudo && l.nCotados>0);
  const melhorFornecedor = completos.length ? completos.reduce((a,b)=>b.total<a.total?b:a) : null;
  const melhorPorItem=itens.map((it,ii)=>{
    let best=null;
    forns.forEach((f,fi)=>{ const p=parseDose(f.precos?.[ii]); if(p>0 && (best===null||p<best.preco)) best={fi,nome:(f.nome||'').trim()||`Fornecedor ${fi+1}`,preco:p}; });
    return best ? {...best, sub:best.preco*(it.total||0)} : null;
  });
  const minTotal = melhorPorItem.reduce((s,m)=>s+(m?m.sub:0),0);
  return {linhas, melhorFornecedor, melhorPorItem, minTotal, todosCotados: itens.length>0 && melhorPorItem.every(Boolean)};
}

// Atualiza subtotais/totais/resumo sem re-renderizar os inputs (não perde o foco enquanto digita)
function atualizarCalculos(){
  const c=cotacaoAtualDoc(); if(!c)return; const itens=c.itens||[];
  fornecedoresWIP.forEach((f,fi)=>{
    let total=0;
    itens.forEach((it,ii)=>{
      const p=parseDose(f.precos?.[ii]); const sub=p>0?p*(it.total||0):0;
      const el=document.getElementById(`sub-${fi}-${ii}`); if(el) el.textContent = p>0?('= '+fmtRS(sub)):'—';
      if(p>0) total+=sub;
    });
    (f.extras||[]).forEach((ex,ei)=>{
      const p=parseDose(ex.preco), q=parseDose(ex.quantidade); const sub=(p>0&&q>0)?p*q:0;
      const el=document.getElementById(`exsub-${fi}-${ei}`); if(el) el.textContent = sub>0?('= '+fmtRS(sub)+(q?` (${q.toLocaleString('pt-BR')} ${sanitizar(ex.unidade||'')})`:'')):'';
      if(sub>0) total+=sub;
    });
    const tel=document.getElementById(`ftot-${fi}`); if(tel) tel.textContent = total>0?fmtRS(total):'—';
  });
  renderModalResumo();
}

// ══════════════════════════════════════════════════════════════
// ABA COMPARAR — custo × princípio ativo (garantias), preços puxados das cotações
// ══════════════════════════════════════════════════════════════
function normalizar(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
const UN_TEOR = ['%','g/kg','g/L']; // como o teor de cada componente é informado
function fmtNum(n){ n=parseDose(n); return n.toLocaleString('pt-BR',{maximumFractionDigits:2}); }

// Junta todos os produtos que aparecem nas cotações (itens + alternativas) com o MENOR preço unitário cotado
function precosDosProdutos(){
  const map={};
  const reg=(nome,unidade,preco,forn)=>{
    if(!(nome||'').trim()||!(preco>0))return;
    const k=normalizar(nome);
    if(!map[k]){ map[k]={nomeNorm:k, produto:nome.trim(), unidade:(unidade||'').trim(), melhorPreco:preco, fornecedor:(forn||'').trim(), nCotacoes:1}; }
    else { map[k].nCotacoes++; if(preco<map[k].melhorPreco){ map[k].melhorPreco=preco; map[k].fornecedor=(forn||'').trim(); } if(!map[k].unidade&&unidade) map[k].unidade=(unidade||'').trim(); }
  };
  pedidos.forEach(c=>{
    (c.fornecedores||[]).forEach(f=>{
      (c.itens||[]).forEach((it,ii)=>{ reg(it.produto, it.unidade, parseDose(f.precos?.[ii]), f.nome); });
      (f.extras||[]).forEach(ex=>{ reg(ex.produto, ex.unidade, parseDose(ex.preco), f.nome); });
    });
  });
  return map;
}

// Garantia atual (WIP em edição, ou salva) de um produto
function componentesDe(nomeNorm){
  if(garantiasWIP[nomeNorm]) return garantiasWIP[nomeNorm];
  const g=garantias.find(x=>x.nomeNormalizado===nomeNorm);
  return g?.componentes ? JSON.parse(JSON.stringify(g.componentes)) : [];
}

// R$ por kg de princípio ativo, dado preço unitário do produto, teor e unidade do teor
function custoPorKgAtivo(precoUnit, teor, unidadeTeor){
  teor=parseDose(teor); if(!(precoUnit>0)||!(teor>0)) return null;
  let kgAtivoPorUn; // kg de componente por unidade (kg ou L) do produto
  if(unidadeTeor==='%') kgAtivoPorUn=teor/100;
  else if(unidadeTeor==='g/kg'||unidadeTeor==='g/L') kgAtivoPorUn=teor/1000;
  else return null;
  if(kgAtivoPorUn<=0) return null;
  return precoUnit/kgAtivoPorUn;
}

function renderComparar(){
  const cont=document.getElementById('compararConteudo'); if(!cont) return;
  const precoMap=precosDosProdutos();
  const produtos=Object.values(precoMap).sort((a,b)=>a.produto.localeCompare(b.produto,'pt-BR'));

  if(!produtos.length){
    cont.innerHTML=`<div class="vazio"><div class="ico">⚖️</div><p>Nenhum produto com preço ainda.<br>Informe preços de fornecedores na aba <strong>Cotação</strong> para comparar aqui.</p></div>`;
    return;
  }

  // ── Comparação por componente (o coração da ferramenta) ──
  const porComponente={}; // nomeCompNorm -> {nome, itens:[{produto, custo, teor, unidadeTeor, preco}]}
  produtos.forEach(p=>{
    componentesDe(p.nomeNorm).forEach(comp=>{
      const custo=custoPorKgAtivo(p.melhorPreco, comp.teor, comp.unidade);
      if(custo==null || !(comp.nome||'').trim()) return;
      const ck=normalizar(comp.nome);
      if(!porComponente[ck]) porComponente[ck]={nome:comp.nome.trim(), itens:[]};
      porComponente[ck].itens.push({produto:p.produto, custo, teor:comp.teor, unidadeTeor:comp.unidade, preco:p.melhorPreco, unidade:p.unidade});
    });
  });
  const gruposComp=Object.values(porComponente).filter(g=>g.itens.length).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

  let compHtml='';
  if(gruposComp.length){
    compHtml=`<div class="cmp-secao-tit">🏅 Custo por princípio ativo</div>
      <div class="cmp-legenda">Barra menor = mais barato por kg do princípio ativo 🏆</div>` + gruposComp.map(g=>{
      const itens=[...g.itens].sort((a,b)=>a.custo-b.custo);
      const maxCusto=Math.max(...itens.map(i=>i.custo));
      return `<div class="cmp-grupo">
        <div class="cmp-grupo-tit">${sanitizar(g.nome)}</div>
        <div class="cmp-barras">
          ${itens.map((it,idx)=>{
            const pct=maxCusto>0?Math.max(6,Math.round(it.custo/maxCusto*100)):6;
            const cor=idx===0?'#16a34a':(idx===itens.length-1&&itens.length>1?'#dc2626':'#d97706');
            return `<div class="cmp-barra-row">
              <div class="cmp-barra-lbl">${idx===0?'🏆 ':''}${sanitizar(it.produto)} <span class="cmp-teor">${fmtNum(it.teor)}${sanitizar(it.unidadeTeor)}</span></div>
              <div class="cmp-barra-track"><div class="cmp-barra-fill" style="width:${pct}%;background:${cor};"></div><span class="cmp-barra-val">${fmtRS(it.custo)}/kg</span></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
  } else {
    compHtml=`<div class="cmp-aviso">💡 Cadastre as garantias (composição) dos produtos abaixo para ver o gráfico de custo por princípio ativo.</div>`;
  }

  // ── Cards de produtos: preço puxado + editor de garantias ──
  const cardsHtml=`<div class="cmp-secao-tit" style="margin-top:16px;">🧪 Produtos e garantias</div>` + produtos.map(p=>{
    const comps=componentesDe(p.nomeNorm);
    const salvo=garantias.find(x=>x.nomeNormalizado===p.nomeNorm);
    return `<div class="cmp-card">
      <div class="cmp-card-hdr">
        <div class="cmp-card-nome">🧪 ${sanitizar(p.produto)}</div>
        <div class="cmp-card-preco">${fmtRS(p.melhorPreco)}<span class="cmp-un">/${sanitizar(p.unidade||'un')}</span></div>
      </div>
      <div class="cmp-card-sub">Menor preço cotado${p.fornecedor?' · '+sanitizar(p.fornecedor):''} · ${p.nCotacoes} cotação(ões)</div>
      <div class="cmp-comps">
        ${comps.length?comps.map((comp,ci)=>`
          <div class="cmp-comp-row">
            <input class="cmp-comp-nome" placeholder="Componente (ex: Nitrogênio)" value="${escAttr(comp.nome)}" oninput="setCompCampo('${escJs(p.nomeNorm)}',${ci},'nome',this.value)">
            <input type="number" inputmode="decimal" step="0.01" min="0" class="cmp-comp-teor" placeholder="teor" value="${comp.teor??''}" oninput="setCompCampo('${escJs(p.nomeNorm)}',${ci},'teor',this.value)">
            <select class="cmp-comp-un" onchange="setCompCampo('${escJs(p.nomeNorm)}',${ci},'unidade',this.value)">
              ${UN_TEOR.map(u=>`<option value="${u}" ${((comp.unidade||'%')===u)?'selected':''}>${u}</option>`).join('')}
            </select>
            <button class="cmp-comp-rm" onclick="remComp('${escJs(p.nomeNorm)}',${ci})" title="Remover">✕</button>
          </div>`).join('')
        :'<div class="cmp-sem-garantia">Sem garantia cadastrada.</div>'}
      </div>
      <div class="cmp-card-acoes">
        <button class="btn-add-comp" onclick="addComp('${escJs(p.nomeNorm)}')">＋ Componente</button>
        <button class="btn-salvar-comp" onclick="salvarGarantias('${escJs(p.nomeNorm)}','${escJs(p.produto)}','${escJs(p.unidade)}')">💾 Salvar garantias</button>
        ${salvo?'<span class="cmp-salvo">✔ salvo</span>':''}
      </div>
    </div>`;
  }).join('');

  cont.innerHTML = compHtml + cardsHtml;
}

// Edição das garantias (WIP em memória até salvar)
function garantirWIP(k){ if(!garantiasWIP[k]) garantiasWIP[k]=componentesDe(k); return garantiasWIP[k]; }
window.addComp=function(k){ garantirWIP(k).push({nome:'',teor:'',unidade:'%'}); renderComparar(); };
window.remComp=function(k,ci){ const arr=garantirWIP(k); arr.splice(ci,1); renderComparar(); };
window.setCompCampo=function(k,ci,campo,v){ const arr=garantirWIP(k); if(arr[ci]) arr[ci][campo]=v; };

window.salvarGarantias=async function(k,produto,unidade){
  const comps=(garantiasWIP[k]||[]).filter(c=>(c.nome||'').trim()&&parseDose(c.teor)>0)
    .map(c=>({nome:(c.nome||'').trim(), teor:parseDose(c.teor), unidade:c.unidade||'%'}));
  try{
    const existente=garantias.find(x=>x.nomeNormalizado===k);
    const dados={produto, nomeNormalizado:k, unidade:unidade||'', componentes:comps, atualizadoEm:new Date().toISOString(), atualizadoPor:usuarioAtual.email};
    if(existente) await updateDoc(doc(db,'garantiasProdutos',existente._docId), dados);
    else await addDoc(collection(db,'garantiasProdutos'), {...dados, criadoEm:new Date().toISOString()});
    delete garantiasWIP[k];
    toast('✅ Garantias salvas!');
  }catch(e){ toast('❌ Erro: '+e.message); }
};
window.abrirTab=function(tab,btn){tabAtual=tab;document.querySelectorAll('.ped-tab').forEach(b=>b.classList.remove('ativo'));if(btn)btn.classList.add('ativo');document.getElementById('pmod-mapa').style.display=tab==='mapa'?'flex':'none';document.getElementById('pmod-lista').style.display=tab==='lista'?'flex':'none';document.getElementById('pmod-comparar').style.display=tab==='comparar'?'flex':'none';if(tab==='mapa')iniciarMapaPedidos();if(tab==='lista')renderizarCotacoes();if(tab==='comparar')renderComparar();};
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return`${dd}/${m}/${a}`;}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
window.toggleMenu=()=>{document.getElementById('menuLateral').classList.toggle('aberto');document.getElementById('menuOverlay').classList.toggle('aberto');};
window.fecharMenu=()=>{document.getElementById('menuLateral').classList.remove('aberto');document.getElementById('menuOverlay').classList.remove('aberto');};
window.fazerLogout=async()=>{await signOut(auth);window.location.href='login.html';};
</script>

.cot-modal-sub{font-size:.72rem;opacity:.75;margin-top:2px;}
.cot-close{background:rgba(255,255,255,.15);border:none;color:white;width:32px;height:32px;border-radius:8px;font-size:1rem;cursor:pointer;flex-shrink:0;}
.cot-modal-body{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;}
.cot-modal-footer{padding:10px 14px max(12px,env(safe-area-inset-bottom));border-top:1.5px solid var(--cb);display:flex;gap:8px;flex-shrink:0;background:white;}
.btn-fechar-cot{flex:1;background:var(--cl);border:1.5px solid var(--cb);color:var(--c);border-radius:var(--rs);padding:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;}
.btn-salvar-cot{flex:2;background:var(--v);border:none;color:white;border-radius:var(--rs);padding:12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;}
.cot-resumo{background:white;border:1.5px solid var(--cb);border-radius:var(--rad);padding:11px 13px;margin-bottom:12px;}
.resumo-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;color:var(--ve);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.resumo-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;padding:5px 0;border-bottom:1px solid var(--cl);}
.resumo-row:last-child{border:none;}
.resumo-row strong{font-family:'DM Mono',monospace;color:var(--ve);}
.resumo-row.melhor{color:#166534;font-weight:700;}
.resumo-row.melhor strong{color:#166534;}
.resumo-row.minrow{color:var(--c);font-style:italic;font-size:.78rem;border-top:1.5px dashed var(--cb);}
.resumo-row .parc{font-size:.68rem;color:#d97706;}
.resumo-vazio{font-size:.8rem;color:var(--c);font-style:italic;}
.forn-card{background:white;border:1.5px solid var(--cb);border-radius:var(--rad);padding:12px;margin-bottom:10px;}
.forn-card.escolhido{border-color:#16a34a;box-shadow:0 0 0 2px #dcfce7;}
.forn-hdr{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
.forn-nome{flex:1;border:1.5px solid var(--cb);border-radius:6px;padding:9px 11px;font-size:.92rem;font-weight:700;font-family:'Barlow',sans-serif;outline:none;color:var(--ve);}
.forn-rm{background:#fee2e2;border:1px solid #fca5a5;color:var(--danger);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:.85rem;flex-shrink:0;}
.forn-contato{width:100%;border:1.5px solid var(--cb);border-radius:6px;padding:8px 11px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;margin-bottom:8px;}
.forn-itens{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.forn-item{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.forn-item-nome{font-size:.82rem;font-weight:600;flex:1;min-width:120px;}
.forn-item-qtd{display:block;font-size:.68rem;color:var(--c);font-family:'DM Mono',monospace;font-weight:400;}
.forn-item-preco{display:flex;align-items:center;gap:5px;}
.forn-rs{font-size:.72rem;color:var(--c);font-weight:700;}
.forn-preco-inp{width:88px;border:1.5px solid var(--cb);border-radius:6px;padding:7px 8px;font-size:.85rem;font-family:'DM Mono',monospace;outline:none;text-align:right;-webkit-appearance:none;}
.forn-preco-inp:focus{border-color:var(--v);}
.forn-sub{font-size:.7rem;color:var(--v);font-family:'DM Mono',monospace;font-weight:700;min-width:70px;text-align:right;}
.forn-total-row{font-size:.8rem;color:var(--c);text-align:right;padding:6px 0;border-top:1px solid var(--cl);}
.forn-total{font-family:'DM Mono',monospace;font-size:1rem;color:var(--ve);}
.forn-obs{width:100%;border:1.5px solid var(--cb);border-radius:6px;padding:8px 11px;font-size:.8rem;font-family:'Barlow',sans-serif;outline:none;margin-top:8px;}
.forn-escolher{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ve);font-weight:600;margin-top:9px;cursor:pointer;}
.btn-add-forn{width:100%;background:var(--cl);border:1.5px dashed var(--cb);color:var(--c);border-radius:var(--rs);padding:11px;font-size:.85rem;font-family:'Barlow',sans-serif;cursor:pointer;margin-bottom:8px;}
/* Alternativas (extras) do fornecedor */
.forn-extras{border-top:1px dashed var(--cb);margin-top:6px;padding-top:8px;}
.forn-extras-tit{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c);font-weight:700;margin-bottom:6px;}
.forn-extra{background:var(--cl);border-radius:8px;padding:8px;margin-bottom:6px;}
.forn-extra-nome{width:100%;border:1.5px solid var(--cb);border-radius:6px;padding:7px 9px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;margin-bottom:6px;}
.forn-extra-linha{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.forn-extra-qtd{width:64px;border:1.5px solid var(--cb);border-radius:6px;padding:6px 7px;font-size:.8rem;font-family:'DM Mono',monospace;outline:none;text-align:right;-webkit-appearance:none;}
.forn-extra-un{width:52px;border:1.5px solid var(--cb);border-radius:6px;padding:6px 7px;font-size:.8rem;font-family:'Barlow',sans-serif;outline:none;text-align:center;}
.forn-extra-preco{width:82px;border:1.5px solid var(--cb);border-radius:6px;padding:6px 7px;font-size:.8rem;font-family:'DM Mono',monospace;outline:none;text-align:right;-webkit-appearance:none;}
.forn-extra-rm{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.9rem;padding:4px;margin-left:auto;}
.forn-extra-sub{font-size:.72rem;color:var(--v);font-family:'DM Mono',monospace;font-weight:700;margin-top:4px;}
.btn-add-extra{width:100%;background:none;border:1px dashed var(--cb);color:var(--c);border-radius:6px;padding:7px;font-size:.76rem;font-family:'Barlow',sans-serif;cursor:pointer;}
.alt-tag{font-size:.66rem;color:#7c4f0a;background:#fef3c7;border-radius:8px;padding:1px 6px;font-weight:700;}
/* ABA COMPARAR */
#pmod-comparar{flex:1;overflow:hidden;flex-direction:column;display:none;}
.cmp-secao-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 8px;}
.cmp-aviso{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:.8rem;color:#92400e;margin-bottom:12px;}
.cmp-grupo{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;margin-bottom:8px;}
.cmp-grupo-tit{background:var(--vb);color:var(--ve);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;padding:8px 12px;text-transform:uppercase;letter-spacing:.04em;}
.cmp-legenda{font-size:.68rem;color:var(--c);margin:-4px 0 8px;font-style:italic;}
.cmp-barras{padding:10px 12px;display:flex;flex-direction:column;gap:11px;}
.cmp-barra-row{display:flex;flex-direction:column;gap:4px;}
.cmp-barra-lbl{font-size:.8rem;font-weight:600;color:var(--ve);}
.cmp-barra-track{position:relative;height:22px;background:var(--cl);border-radius:6px;overflow:hidden;display:flex;align-items:center;}
.cmp-barra-fill{height:100%;border-radius:6px;min-width:6px;transition:width .35s;}
.cmp-barra-val{position:absolute;right:8px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700;color:var(--ve);}
.cmp-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--cl);}
.cmp-linha:last-child{border:none;}
.cmp-linha.melhor{background:#f0fdf4;}
.cmp-prod{font-size:.85rem;font-weight:600;}
.cmp-linha.melhor .cmp-prod{color:#166534;font-weight:700;}
.cmp-teor{font-size:.68rem;color:var(--c);font-family:'DM Mono',monospace;font-weight:400;}
.cmp-custo{font-family:'DM Mono',monospace;font-weight:700;font-size:.9rem;color:var(--ve);white-space:nowrap;}
.cmp-linha.melhor .cmp-custo{color:#166534;}
.cmp-un{font-size:.66rem;color:var(--c);}
.cmp-card{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:12px;margin-bottom:8px;}
.cmp-card-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.cmp-card-nome{font-weight:700;font-size:.95rem;color:var(--ve);}
.cmp-card-preco{font-family:'DM Mono',monospace;font-weight:700;color:var(--v);white-space:nowrap;}
.cmp-card-sub{font-size:.68rem;color:var(--c);margin-top:2px;margin-bottom:8px;}
.cmp-comps{display:flex;flex-direction:column;gap:6px;}
.cmp-comp-row{display:flex;gap:5px;align-items:center;}
.cmp-comp-nome{flex:1;min-width:0;border:1.5px solid var(--cb);border-radius:6px;padding:7px 9px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;}
.cmp-comp-teor{width:70px;border:1.5px solid var(--cb);border-radius:6px;padding:7px 8px;font-size:.82rem;font-family:'DM Mono',monospace;outline:none;text-align:right;-webkit-appearance:none;}
.cmp-comp-un{width:66px;border:1.5px solid var(--cb);border-radius:6px;padding:7px 4px;font-size:.78rem;font-family:'Barlow',sans-serif;outline:none;-webkit-appearance:none;background:white;flex-shrink:0;}
.cmp-comp-rm{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.9rem;padding:4px;flex-shrink:0;}
.cmp-sem-garantia{font-size:.76rem;color:var(--c);font-style:italic;}
.cmp-card-acoes{display:flex;gap:8px;align-items:center;margin-top:10px;}
.btn-add-comp{background:var(--cl);border:1px dashed var(--cb);color:var(--c);border-radius:6px;padding:7px 12px;font-size:.78rem;font-family:'Barlow',sans-serif;cursor:pointer;}
.btn-salvar-comp{background:var(--v);border:none;color:white;border-radius:6px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;}
.cmp-salvo{font-size:.72rem;color:#16a34a;font-weight:700;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ve);color:white;padding:11px 20px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:var(--cb);border-radius:3px;}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="area-impressao"></div>
<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>
<header class="app-header">
  <div class="hdr-logo"><button class="btn-menu" onclick="toggleMenu()">☰</button><div style="margin-left:4px;"><span>Conilon Tech</span><span class="hdr-sub">Cotações</span></div></div>
  <div class="hdr-user" id="userNome"></div>
</header>
<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<div class="menu-lateral" id="menuLateral">
  <div class="menu-topo"><div class="menu-app-nome">🌿 Conilon Tech</div><div class="menu-user-nome" id="menuUserNome"></div><div class="menu-user-email" id="menuUserEmail"></div></div>
  <div id="menuModulos"></div>
  <div class="menu-rodape"><button class="btn-logout" onclick="fazerLogout()">Sair da conta</button></div>
</div>
<div id="appContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;">
  <div class="app-main">
    <div class="ped-tabs">
      <button class="ped-tab ativo" id="ptab-mapa" onclick="abrirTab('mapa',this)">🗺️ Planejamento</button>
      <button class="ped-tab" id="ptab-lista" onclick="abrirTab('lista',this)">💰 Cotação</button>
      <button class="ped-tab" id="ptab-comparar" onclick="abrirTab('comparar',this)">⚖️ Comparar</button>
    </div>
    <div id="pmod-mapa" style="display:flex;">
      <div id="pedidosMap"></div>
      <div class="ped-sidebar" id="pedSidebar">
        <div class="msb-header"><span class="msb-title">Talhões</span><button onclick="togglePedSidebar()" style="background:none;border:none;cursor:pointer;font-size:.9rem;color:var(--c);padding:2px 4px;">◀</button></div>
        <div class="msb-list" id="pedSidebarList"></div>
      </div>
      <button id="btnExpandPedSb" onclick="togglePedSidebar()">▶ Talhões</button>
      <div class="ped-legenda">
        <div class="leg-tit">Legenda</div>
        <div class="leg-item"><div class="leg-cor" style="background:rgba(74,140,63,.4);border:2px solid rgba(123,198,126,.9);"></div>Ativo</div>
        <div class="leg-item"><div class="leg-cor" style="background:rgba(201,168,76,.4);border:2px solid rgba(220,190,90,.9);"></div>Reforma</div>
        <div class="leg-item"><div class="leg-cor" style="background:rgba(139,94,60,.4);border:2px solid rgba(196,133,90,.9);"></div>Colhido</div>
        <div class="leg-item"><div class="leg-cor" style="background:rgba(245,200,66,.55);border:2px solid #f5c842;"></div>Selecionado</div>
      </div>
      <div class="painel-pedido" id="painelPedido" style="display:none;">
        <div class="painel-hdr"><div class="painel-tit">📝 Nova Cotação</div><div class="painel-res" id="pedResumo">0 insumos</div></div>
        <div class="painel-scroll"><div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--v);font-weight:700;margin-bottom:8px;">Insumos da Cotação</div><div id="itensPedido"></div><button class="btn-add-item" onclick="adicionarItemPedido()">＋ Adicionar outro insumo</button></div>
        <div class="painel-footer">
          <div class="painel-sel-row"><button class="painel-sel-btn" onclick="pedSelTodos()">Selec. todos</button><button class="painel-sel-btn" onclick="pedLimparSel()">Limpar seleção</button></div>
          <button class="btn-salvar-ped" id="btnSalvarPed" onclick="salvarPedidoWIP()">💾 Salvar Cotação</button>
          <button class="btn-cancelar-ped" onclick="cancelarPedido()">Cancelar</button>
        </div>
      </div>
      <button id="fabNovoPedido" onclick="iniciarNovoPedido()">＋ Nova Cotação</button>
    </div>
    <div id="pmod-lista">
      <div class="lista-hdr"><span class="lista-hdr-tit">💰 Cotações</span><span style="font-size:.72rem;color:var(--c);" id="totalPedidos"></span></div>
      <div class="lista-scroll" id="listaPedidosApp"></div>
    </div>
    <div id="pmod-comparar" style="display:none;">
      <div class="lista-hdr"><span class="lista-hdr-tit">⚖️ Comparar produtos</span><span style="font-size:.7rem;color:var(--c);">custo × princípio ativo</span></div>
      <div class="lista-scroll" id="compararConteudo"></div>
    </div>
  </div>
</div>
<!-- MODAL COTAÇÃO (fornecedores + comparação) -->
<div class="cot-overlay" id="cotOverlay" onclick="if(event.target===this)fecharCotacao()">
  <div class="cot-modal">
    <div class="cot-modal-hdr">
      <div>
        <div class="cot-modal-tit">💰 Cotação de Insumos</div>
        <div class="cot-modal-sub" id="cotModalData">—</div>
      </div>
      <button class="cot-close" onclick="fecharCotacao()">✕</button>
    </div>
    <div class="cot-modal-body">
      <div class="cot-resumo" id="cotResumo"></div>
      <div id="cotFornecedores"></div>
      <button class="btn-add-forn" onclick="addForn()">＋ Adicionar fornecedor</button>
    </div>
    <div class="cot-modal-footer">
      <button class="btn-fechar-cot" onclick="alternarStatusCotacao()">🔒 Fechar/Reabrir</button>
      <button class="btn-salvar-cot" id="btnSalvarCot" onclick="salvarCotacaoForn()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
