<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ConilonTech · Drench Preventivo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",
  authDomain: "talhoes-df836.firebaseapp.com",
  projectId: "talhoes-df836",
  storageBucket: "talhoes-df836.firebasestorage.app",
  messagingSenderId: "1047022702039",
  appId: "1:1047022702039:web:001cf6a3c028c494ab8f92"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

let usuarioAtual = null, perfilAtual = {};
let talhoes = [], drenchPrevencao = [];

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db, 'usuarios', user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil === 'admin') {
    perfilAtual.modulos = {mapa:'admin',atividades:'admin',adubacao:'admin',config:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin'};
  }
  document.getElementById('userNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'flex';
  gerarMenu();
  iniciarListeners();
  if (isAdmin()) document.getElementById('btnNovoDrench').style.display = 'flex';
});

function nivelAcesso(mod) {
  if (perfilAtual.modulos?.[mod]) return perfilAtual.modulos[mod];
  if (perfilAtual.perfil === 'admin') return 'admin';
  return 'nenhum';
}
function isAdmin() { return nivelAcesso('pulverizacao') === 'admin'; }
function podeConfirmar() { return ['admin','encarregado','operador'].includes(nivelAcesso('pulverizacao')); }

function gerarMenu() {
  const isAdm = Object.values(perfilAtual.modulos || {}).includes('admin') || perfilAtual.perfil === 'admin';
  const pg = (window.location.pathname.split('/').pop() || 'index.html');
  const secoes = [
    { label: 'Principal', items: [
      { href:'index.html',         ico:'📊', label:'Dashboard' },
      { href:'mapa.html',          ico:'🗺️', label:'Mapa de Talhões',   acesso:'mapa' },
      { href:'pulverizacoes.html', ico:'💧', label:'Pulverizações',     acesso:'pulverizacao' },
      { href:'drench.html',        ico:'🌱', label:'Drench Preventivo', acesso:'pulverizacao' },
      { href:'atividades.html',    ico:'🌾', label:'Atividades',        acesso:'atividades' },
      { href:'equipe.html',        ico:'👥', label:'Equipe',            acesso:'equipe' },
      { href:'estoque.html',       ico:'🏬', label:'Estoque',           acesso:'estoque' },
      { href:'pedidos.html',       ico:'📦', label:'Pedidos',           acesso:'pedidos' },
      { href:'adubacoes.html',     ico:'🧪', label:'Adubações',         acesso:'adubacao' },
    ]},
    { label: 'Análise', items: [
      { href:'gestao.html',        ico:'📈', label:'Gestão',            acesso:'gestao' },
      { href:'analises.html',      ico:'🔬', label:'Análises',          acesso:'analises' },
      { href:'recomendacoes.html', ico:'💊', label:'Recomendações',     acesso:'recomendacoes' },
      { href:'planejamento.html',  ico:'🗓️', label:'Planejamento',      acesso:'planejamento' },
      ...(isAdm ? [{ href:'admin.html', ico:'⚙️', label:'Administração' }] : []),
    ]},
  ];
  document.getElementById('menuModulos').innerHTML = secoes.map(s => {
    const html = s.items.map(m => {
      if (typeof nivelAcesso === 'function' && m.acesso && nivelAcesso(m.acesso) === 'nenhum') return '';
      return `<a class="menu-item${pg===m.href?' ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`;
    }).filter(Boolean).join('');
    return html ? `<div class="menu-secao">${s.label}</div>${html}` : '';
  }).join('');
}

function iniciarListeners() {
  onSnapshot(collection(db, 'talhoes'), snap => {
    talhoes = snap.docs.map(d => ({_docId:d.id,...d.data()}));
    atualizarSelectTalhoes();
  });
  onSnapshot(collection(db, 'drenchPrevencao'), snap => {
    drenchPrevencao = snap.docs.map(d => ({_docId:d.id,...d.data()}))
      .sort((a,b) => (a.data||'').localeCompare(b.data||''));
    renderizarLista();
  });
}

function atualizarSelectTalhoes() {
  const fazendas = {};
  talhoes.forEach(t => { const f=t.fazenda||'Sem fazenda'; if(!fazendas[f])fazendas[f]=[]; fazendas[f].push(t); });
  const optgroups = Object.entries(fazendas).sort().map(([faz,ts]) =>
    `<optgroup label="${faz}">${ts.map(t=>`<option value="${t.id}">${t.id} · ${t.nome}</option>`).join('')}</optgroup>`
  ).join('');
  const selModal = document.getElementById('fTalhao');
  if (selModal) selModal.innerHTML = '<option value="">Selecione...</option>' + optgroups;
  const selFiltro = document.getElementById('filtroTalhao');
  if (selFiltro) {
    const atual = selFiltro.value;
    selFiltro.innerHTML = '<option value="">Todos</option>' + optgroups;
    selFiltro.value = atual;
  }
}

// ══════════════════════════════
// LISTA
// ══════════════════════════════
function renderizarLista() {
  const content = document.getElementById('listaContent');
  atualizarFiltroAlvos();
  const filtros = {
    status: document.getElementById('filtroStatus')?.value ?? 'pendente',
    talhao: document.getElementById('filtroTalhao')?.value || '',
    alvo: document.getElementById('filtroAlvo')?.value || '',
  };
  let filtrados = drenchPrevencao;
  if (filtros.status) filtrados = filtrados.filter(d => (d.status||'pendente') === filtros.status);
  if (filtros.talhao) filtrados = filtrados.filter(d => d.talhaoId === filtros.talhao);
  if (filtros.alvo) filtrados = filtrados.filter(d => d.alvoPrevencao === filtros.alvo);

  if (!filtrados.length) {
    content.innerHTML = `<div class="vazio"><div class="ico">🌱</div><p>Nenhum agendamento de drench encontrado.</p></div>`;
    return;
  }
  // Agrupar por mês
  const porMes = {};
  filtrados.forEach(d => {
    if (!d.data) return;
    const [a, m] = d.data.split('-');
    const key = `${a}-${m}`;
    if (!porMes[key]) porMes[key] = [];
    porMes[key].push(d);
  });
  content.innerHTML = Object.entries(porMes).sort().map(([key, ds]) => {
    const [a,m] = key.split('-');
    return `<div class="mes-grupo">
      <div class="mes-titulo">📅 ${MESES[parseInt(m)-1]} ${a}</div>
      ${ds.map(d => renderCardDrench(d)).join('')}
    </div>`;
  }).join('');
}

function atualizarFiltroAlvos() {
  const sel = document.getElementById('filtroAlvo'); if (!sel) return;
  const atual = sel.value;
  const alvos = [...new Set(drenchPrevencao.map(d => d.alvoPrevencao).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">Todos</option>`
    + alvos.map(a => `<option value="${a}" ${a===atual?'selected':''}>${a}</option>`).join('');
}

// ─── COR POR FAZENDA ───
const FARM_COLORS = ['#1e3a5f','#1e5631','#5d3a1a','#37474f','#8b6914','#722f37','#1d5b6e','#556b2f','#a0522d','#455a64'];
function listaFazendasOrdenadas() {
  const set = new Set();
  talhoes.forEach(t => { if (t.fazenda) set.add(t.fazenda); });
  return [...set].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function corFazenda(nome) {
  if (!nome) return 'var(--c)';
  const ord = listaFazendasOrdenadas();
  const idx = ord.indexOf(nome);
  if (idx < 0) return 'var(--c)';
  return FARM_COLORS[idx % FARM_COLORS.length];
}

function renderCardDrench(d) {
  const adm = isAdmin(), podConf = podeConfirmar();
  const realizado = (d.status||'pendente') === 'realizado';
  const corFaz = corFazenda(d.fazenda);
  const badge = realizado ? {cls:'badge-ok',txt:'✅ Realizado'} : {cls:'badge-pend',txt:'⏳ Pendente'};
  return `<div class="pulv-card ${realizado?'realizada':''}" style="border-left:5px solid ${corFaz};">
    <div class="pulv-header">
      <div>
        <div class="pulv-titulo">🌱 <span class="pulv-faz-tag" style="background:${corFaz};">${sanitizar(d.fazenda||'—')}</span> ${sanitizar(d.talhaoNome||d.talhaoId||'—')}</div>
        <div class="pulv-meta">📅 Previsto: ${formatarData(d.data)}${realizado?` · ✅ Aplicado em ${formatarData(d.dataRealizado)}`:''}</div>
      </div>
      <div class="pulv-status-wrap">
        <div class="pulv-badge ${badge.cls}">${badge.txt}</div>
        ${adm?`<button class="btn-rm-pulv" data-doc="${d._docId}" onclick="excluirDrench(this)">🗑</button>`:''}
      </div>
    </div>
    ${d.alvoPrevencao?`<div class="pulv-praga">🛡️ Prevenção: <strong>${sanitizar(d.alvoPrevencao)}</strong></div>`:''}
    <div class="pulv-produtos">
      ${(d.produtos||[]).map(pr=>`<div class="prod-linha"><span class="prod-nome">🧪 ${sanitizar(pr.produto)}</span>${pr.dose?`<span class="prod-dose">${pr.dose} ${pr.unidade||''}/ha</span>`:''}</div>`).join('')}
    </div>
    ${d.observacoes?`<div class="pulv-obs">💬 ${sanitizar(d.observacoes)}</div>`:''}
    ${realizado && d.obsRealizacao?`<div class="pulv-obs">✅ ${sanitizar(d.obsRealizacao)}${d.realizadoPor?' · '+sanitizar(d.realizadoPor):''}</div>`:''}
    ${(podConf || adm) ? `<div class="pulv-acoes">
      ${!realizado && podConf ? `<button class="btn-confirmar" onclick="abrirMarcarRealizado('${d._docId}')">✅ Marcar como realizado</button>` : ''}
      ${realizado && adm ? `<button class="btn-desfazer" onclick="desfazerRealizado('${d._docId}')">↩ Desfazer</button>` : ''}
      ${adm?`<button class="btn-editar" onclick="abrirEditarDrench('${d._docId}')">✏️ Editar</button>`:''}
    </div>` : ''}
  </div>`;
}

// ══════════════════════════════
// MODAL NOVO / EDITAR AGENDAMENTO
// ══════════════════════════════
window.produtosWIP = [];
window.drenchEditandoId = null;

window.abrirModalNova = function() {
  if (!isAdmin()) { toast('⛔ Sem permissão.'); return; }
  window.drenchEditandoId = null;
  window.produtosWIP = [];
  document.getElementById('tituloNova').textContent = '🌱 Novo Agendamento de Drench';
  document.getElementById('btnSalvarDrench').textContent = '💾 Salvar';
  document.getElementById('fData').value = hoje();
  document.getElementById('fTalhao').value = '';
  document.getElementById('fAlvo').value = '';
  document.getElementById('fObs').value = '';
  atualizarSelectTalhoes();
  renderizarProdutosWIP();
  document.getElementById('overlayNova').classList.add('open');
};

window.abrirEditarDrench = function(docId) {
  if (!isAdmin()) { toast('⛔ Sem permissão.'); return; }
  const d = drenchPrevencao.find(x => x._docId === docId);
  if (!d) { toast('❌ Agendamento não encontrado.'); return; }
  window.drenchEditandoId = docId;
  window.produtosWIP = (d.produtos||[]).map(pr => ({produto:pr.produto||'',dose:pr.dose||'',unidade:pr.unidade||'L'}));
  document.getElementById('tituloNova').textContent = '✏️ Editar Agendamento';
  document.getElementById('btnSalvarDrench').textContent = '💾 Salvar alterações';
  atualizarSelectTalhoes();
  document.getElementById('fData').value = d.data || '';
  document.getElementById('fTalhao').value = d.talhaoId || '';
  document.getElementById('fAlvo').value = d.alvoPrevencao || '';
  document.getElementById('fObs').value = d.observacoes || '';
  renderizarProdutosWIP();
  document.getElementById('overlayNova').classList.add('open');
};

window.fecharNova = function() { document.getElementById('overlayNova').classList.remove('open'); };

window.addProduto = function() {
  window.produtosWIP.push({produto:'', dose:'', unidade:'L'});
  renderizarProdutosWIP();
};

function renderizarProdutosWIP() {
  const escAttr = s => String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  document.getElementById('listaProdutos').innerHTML = window.produtosWIP.map((p,i) => `
    <div class="prod-row">
      <input type="text" class="prod-inp" placeholder="Produto / Insumo..." value="${escAttr(p.produto)}"
        oninput="window.produtosWIP[${i}].produto=this.value">
      <input type="text" inputmode="decimal" class="prod-dose-inp" placeholder="Dose/ha" value="${escAttr(p.dose)}"
        oninput="window.produtosWIP[${i}].dose=this.value">
      <select class="prod-und-sel" onchange="window.produtosWIP[${i}].unidade=this.value">
        ${['L','mL','kg','g'].map(u=>`<option value="${u}" ${p.unidade===u?'selected':''}>${u}/ha</option>`).join('')}
      </select>
      <button onclick="window.produtosWIP.splice(${i},1);renderizarProdutosWIP()" class="btn-rm-prod">✕</button>
    </div>
  `).join('') || `<div class="vazio-sm">Adicione os produtos acima.</div>`;
}

window.salvarDrench = async function() {
  const talhaoId = document.getElementById('fTalhao').value;
  const data = document.getElementById('fData').value;
  if (!talhaoId || !data) { toast('⚠️ Preencha talhão e data prevista.'); return; }
  const prods = window.produtosWIP.filter(p => p.produto.trim());
  if (!prods.length) { toast('⚠️ Adicione ao menos um produto.'); return; }
  const talhao = talhoes.find(t => t.id === talhaoId);
  const alvo = document.getElementById('fAlvo').value.trim();
  const obs = document.getElementById('fObs').value.trim();
  const btn = document.getElementById('btnSalvarDrench');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    if (window.drenchEditandoId) {
      await updateDoc(doc(db,'drenchPrevencao',window.drenchEditandoId), {
        talhaoId, talhaoNome: talhao?.nome || talhaoId, fazenda: talhao?.fazenda || '',
        data, alvoPrevencao: alvo, produtos: prods, observacoes: obs,
        editadoEm: new Date().toISOString(), editadoPor: usuarioAtual.email
      });
      toast('✅ Agendamento atualizado!');
    } else {
      await addDoc(collection(db,'drenchPrevencao'), {
        talhaoId, talhaoNome: talhao?.nome || talhaoId, fazenda: talhao?.fazenda || '',
        data, alvoPrevencao: alvo, produtos: prods, observacoes: obs,
        status: 'pendente', dataRealizado: null, realizadoPor: null, obsRealizacao: '',
        criadoEm: new Date().toISOString(), criadoPor: usuarioAtual.email
      });
      toast('✅ Drench agendado!');
    }
    fecharNova();
  } catch(e) { toast('❌ Erro: ' + e.message); }
  btn.disabled = false; btn.textContent = window.drenchEditandoId ? '💾 Salvar alterações' : '💾 Salvar';
  window.drenchEditandoId = null;
};

window.excluirDrench = async function(btn) {
  const docId = btn.dataset.doc;
  if (!confirm('Excluir este agendamento de drench?')) return;
  btn.disabled = true;
  await deleteDoc(doc(db,'drenchPrevencao',docId));
  toast('🗑 Excluído.');
};

// ══════════════════════════════
// MARCAR COMO REALIZADO
// ══════════════════════════════
window.abrirMarcarRealizado = function(docId) {
  const d = drenchPrevencao.find(x => x._docId === docId);
  if (!d) { toast('❌ Agendamento não encontrado.'); return; }
  document.getElementById('realizadoInfo').innerHTML =
    `🌱 <strong>${sanitizar(d.talhaoNome||d.talhaoId||'')}</strong> · ${sanitizar(d.fazenda||'sem fazenda')}${d.alvoPrevencao?' · 🛡️ '+sanitizar(d.alvoPrevencao):''}`;
  document.getElementById('realData').value = hoje();
  document.getElementById('realObs').value = '';
  document.getElementById('realData').dataset.docId = docId;
  document.getElementById('overlayRealizado').classList.add('open');
};

window.fecharRealizado = function() { document.getElementById('overlayRealizado').classList.remove('open'); };

window.confirmarRealizado = async function() {
  const docId = document.getElementById('realData').dataset.docId;
  const dataReal = document.getElementById('realData').value || hoje();
  const obs = document.getElementById('realObs').value.trim();
  const btn = document.getElementById('btnConfirmarRealizado');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    await updateDoc(doc(db,'drenchPrevencao',docId), {
      status: 'realizado', dataRealizado: dataReal, realizadoPor: usuarioAtual.email, obsRealizacao: obs
    });
    toast('✅ Marcado como realizado!');
    fecharRealizado();
  } catch(e) { toast('❌ Erro: ' + e.message); }
  btn.disabled = false; btn.textContent = '✅ Confirmar';
};

window.desfazerRealizado = async function(docId) {
  if (!confirm('Voltar este agendamento para pendente?')) return;
  try {
    await updateDoc(doc(db,'drenchPrevencao',docId), {status:'pendente', dataRealizado:null, realizadoPor:null, obsRealizacao:''});
    toast('↩ Revertido para pendente.');
  } catch(e) { toast('❌ Erro: ' + e.message); }
};

// ─── UTILS ───
function hoje() { return new Date().toISOString().slice(0,10); }
function formatarData(d) { if(!d)return'—'; const[a,m,dd]=d.split('-'); return`${dd}/${m}/${a}`; }
function sanitizar(str) { return (str||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
window.toggleMenu=()=>{document.getElementById('menuLateral').classList.toggle('aberto');document.getElementById('menuOverlay').classList.toggle('aberto');};
window.fecharMenu=()=>{document.getElementById('menuLateral').classList.remove('aberto');document.getElementById('menuOverlay').classList.remove('aberto');};
window.fazerLogout=async()=>{await signOut(auth);window.location.href='login.html';};
window.renderizarLista=renderizarLista;
</script>

<style>
:root{--v:#1a5c1a;--ve:#0b1c0d;--vb:#e2f0e2;--c:#5a6b48;--cb:#c6c0b0;--cl:#f0ece3;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;display:flex;flex-direction:column;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.spinner{width:36px;height:36px;border:3px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:200;}
.hdr-logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;}
.hdr-sub{font-size:.55rem;opacity:.6;letter-spacing:.15em;text-transform:uppercase;display:block;}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hdr-user{font-size:.68rem;opacity:.7;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-topo{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-app-nome{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.2rem;color:white;}
.menu-user-nome{font-size:.8rem;color:rgba(255,255,255,.7);margin-top:2px;}
.menu-user-email{font-size:.65rem;color:rgba(255,255,255,.45);margin-top:1px;}
#menuModulos{flex:1;padding:10px 8px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.menu-rodape{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}
.app-main{display:flex;flex-direction:column;}
.mod-header{background:var(--ve);color:white;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:54px;z-index:199;}
.mod-header-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;}

#viewLista{padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px;}
.filtros-lista{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:12px;}
.filtro-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.filtro-row + .filtro-row{margin-top:8px;}
.filtro-campo{display:flex;flex-direction:column;gap:3px;}
.filtro-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--v);font-weight:700;}
.filtro-sel{border:1.5px solid var(--cb);border-radius:var(--rs);padding:8px 10px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;-webkit-appearance:none;width:100%;}
.mes-grupo{margin-bottom:8px;}
.mes-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}

.pulv-card{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;border-left:4px solid var(--cb);margin-bottom:10px;}
.pulv-card.realizada{border-left-color:#16a34a;background:#f0fdf4;}
.pulv-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.pulv-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;}
.pulv-meta{font-size:.72rem;color:var(--c);margin-top:2px;}
.pulv-praga{font-size:.74rem;color:#7c3aed;font-weight:700;padding:4px 14px 0;}
.pulv-status-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.pulv-badge{font-size:.68rem;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;}
.badge-ok{background:#dcfce7;color:#16a34a;}
.badge-pend{background:#fef9c3;color:#d97706;}
.pulv-faz-tag{display:inline-block;font-size:.65rem;color:white;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em;vertical-align:middle;margin-right:3px;}
.btn-rm-pulv{background:none;border:none;cursor:pointer;font-size:1rem;color:var(--danger);}
.pulv-produtos{padding:0 14px 10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.prod-linha{display:inline-flex;align-items:center;gap:9px;background:var(--vb);border:1px solid #c8e0c8;border-radius:9px;padding:6px 10px;max-width:100%;}
.prod-nome{font-size:.88rem;font-weight:700;color:var(--t);}
.prod-dose{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:700;color:white;background:var(--v);border-radius:5px;padding:2px 8px;white-space:nowrap;}
.pulv-obs{padding:0 14px 10px;font-size:.75rem;color:var(--c);font-style:italic;}
.pulv-acoes{padding:10px 14px;border-top:1px solid var(--cl);display:flex;flex-direction:column;gap:6px;}
.btn-confirmar{width:100%;background:var(--v);border:none;color:white;border-radius:var(--rs);padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;}
.btn-desfazer{background:none;border:1.5px solid var(--cb);border-radius:6px;padding:6px 12px;font-size:.72rem;color:var(--c);cursor:pointer;font-family:'Barlow',sans-serif;}
.btn-editar{background:none;border:1.5px solid #fbbf24;border-radius:6px;padding:7px 12px;font-size:.78rem;color:#92400e;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.btn-editar:active{transform:scale(.97);background:#fffbeb;}

#btnNovoDrench{display:none;position:fixed;bottom:20px;right:16px;background:var(--v);border:none;color:white;border-radius:50px;padding:13px 20px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:var(--sf);z-index:100;align-items:center;gap:8px;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:white;border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.1,.64,1);}
.overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--cb);border-radius:2px;margin:12px auto 0;}
.modal-tit{padding:12px 20px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.25rem;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between;}
.btn-fechar{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--c);}
.modal-body{padding:14px 20px;display:flex;flex-direction:column;gap:10px;}

.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.campo label{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--v);font-weight:700;}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--cb);border-radius:var(--rs);padding:10px 12px;font-size:.9rem;font-family:'Barlow',sans-serif;outline:none;-webkit-appearance:none;width:100%;}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--v);}
.campo textarea{resize:none;min-height:60px;}
.campo-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.prod-row{display:flex;gap:6px;align-items:center;margin-bottom:7px;background:var(--cl);border-radius:var(--rs);padding:8px;}
.prod-inp{flex:2;border:1.5px solid var(--cb);border-radius:6px;padding:8px;font-size:.85rem;font-family:'Barlow',sans-serif;outline:none;min-width:0;}
.prod-dose-inp{width:70px;border:1.5px solid var(--cb);border-radius:6px;padding:8px;font-size:.85rem;font-family:'Barlow',sans-serif;outline:none;flex-shrink:0;}
.prod-und-sel{width:78px;border:1.5px solid var(--cb);border-radius:6px;padding:8px 4px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;-webkit-appearance:none;flex-shrink:0;text-align:center;}
.btn-rm-prod{background:none;border:none;color:var(--danger);cursor:pointer;font-size:1rem;padding:4px;flex-shrink:0;}
.btn-add-prod{width:100%;background:var(--cl);border:1.5px dashed var(--cb);color:var(--c);border-radius:var(--rs);padding:9px;font-size:.85rem;font-family:'Barlow',sans-serif;cursor:pointer;margin-bottom:12px;}
.btn-salvar{width:100%;background:var(--v);border:none;color:white;border-radius:var(--rs);padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;}
.btn-salvar:disabled{opacity:.5;}
.vazio-sm{font-size:.78rem;color:var(--c);text-align:center;padding:10px;font-style:italic;}
.vazio{text-align:center;padding:48px 24px;color:var(--c);}
.vazio .ico{font-size:48px;margin-bottom:12px;opacity:.4;}
.vazio p{font-size:.88rem;line-height:1.7;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ve);color:white;padding:11px 20px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:var(--cb);border-radius:3px;}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>

<header class="app-header">
  <div class="hdr-logo">
    <button class="btn-menu" onclick="toggleMenu()">☰</button>
    <div style="margin-left:4px;"><span>Conilon Tech</span><span class="hdr-sub">Drench Preventivo</span></div>
  </div>
  <div class="hdr-user" id="userNome"></div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<div class="menu-lateral" id="menuLateral">
  <div class="menu-topo">
    <div class="menu-app-nome">🌿 Conilon Tech</div>
    <div class="menu-user-nome" id="menuUserNome"></div>
    <div class="menu-user-email" id="menuUserEmail"></div>
  </div>
  <div id="menuModulos"></div>
  <div class="menu-rodape"><button class="btn-logout" onclick="fazerLogout()">Sair da conta</button></div>
</div>

<div id="appContent" style="display:none;flex-direction:column;">
  <div class="app-main">
    <div class="mod-header">
      <div class="mod-header-title"><span>🌱</span> Drench Preventivo</div>
    </div>

    <div id="viewLista">
      <div class="filtros-lista">
        <div class="filtro-row">
          <div class="filtro-campo">
            <span class="filtro-label">Status</span>
            <select class="filtro-sel" id="filtroStatus" onchange="renderizarLista()">
              <option value="pendente">Pendentes</option>
              <option value="realizado">Realizados</option>
              <option value="">Todos</option>
            </select>
          </div>
          <div class="filtro-campo">
            <span class="filtro-label">Talhão</span>
            <select class="filtro-sel" id="filtroTalhao" onchange="renderizarLista()">
              <option value="">Todos</option>
            </select>
          </div>
        </div>
        <div class="filtro-row" style="grid-template-columns:1fr;">
          <div class="filtro-campo">
            <span class="filtro-label">🛡️ Alvo de Prevenção</span>
            <select class="filtro-sel" id="filtroAlvo" onchange="renderizarLista()">
              <option value="">Todos</option>
            </select>
          </div>
        </div>
      </div>
      <div id="listaContent"></div>
    </div>
  </div>
</div>

<!-- FAB -->
<button id="btnNovoDrench" onclick="abrirModalNova()">＋ Agendar Drench</button>

<!-- MODAL NOVO/EDITAR AGENDAMENTO -->
<div class="overlay" id="overlayNova" onclick="if(event.target===this)fecharNova()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-tit">
      <span id="tituloNova">🌱 Novo Agendamento de Drench</span>
      <button class="btn-fechar" onclick="fecharNova()">✕</button>
    </div>
    <div class="modal-body">
      <div class="campo-row">
        <div class="campo"><label>Data Prevista</label><input type="date" id="fData"></div>
        <div class="campo"><label>Talhão</label><select id="fTalhao"></select></div>
      </div>
      <div class="campo">
        <label>Alvo de Prevenção (opcional)</label>
        <input type="text" id="fAlvo" placeholder="Ex: Nematoides, Ferrugem, Preventivo geral..." list="listaAlvosSug" autocomplete="off">
        <datalist id="listaAlvosSug">
          <option value="Nematoides">
          <option value="Ferrugem (Hemileia vastatrix)">
          <option value="Broca-do-café (Hypothenemus hampei)">
          <option value="Cochonilhas">
          <option value="Ácaro-vermelho">
          <option value="Preventivo geral">
          <option value="Reforço nutricional">
        </datalist>
      </div>
      <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--v);font-weight:700;margin-bottom:8px;">Produtos</div>
      <div id="listaProdutos"></div>
      <button class="btn-add-prod" onclick="addProduto()">＋ Adicionar produto</button>
      <div class="campo"><label>Observações</label><textarea id="fObs" placeholder="Cuidados, época, dosagem..."></textarea></div>
      <button class="btn-salvar" id="btnSalvarDrench" onclick="salvarDrench()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL MARCAR COMO REALIZADO -->
<div class="overlay" id="overlayRealizado" onclick="if(event.target===this)fecharRealizado()">
  <div class="modal-sheet" style="max-width:480px;">
    <div class="modal-handle"></div>
    <div class="modal-tit">✅ Marcar como Realizado <button class="btn-fechar" onclick="fecharRealizado()">✕</button></div>
    <div class="modal-body">
      <div id="realizadoInfo" style="background:var(--vb);border-radius:var(--rs);padding:10px 12px;font-size:.9rem;color:var(--ve);margin-bottom:6px;line-height:1.45;"></div>
      <div class="campo"><label>📅 Data da Aplicação</label><input type="date" id="realData"></div>
      <div class="campo"><label>Observações</label><textarea id="realObs" placeholder="Observações da aplicação..."></textarea></div>
      <button class="btn-salvar" id="btnConfirmarRealizado" onclick="confirmarRealizado()">✅ Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
