// ABA 5 — ADUBAÇÃO
// ════════════════════════════════════════════════════
function renderAdubacao() {
  const cont = document.getElementById('tabContent');
  if (_adubMap) { try { _adubMap.remove(); } catch(e){} _adubMap = null; }
  const faz = fazendaFiltro();
  // Seletor de visualização: Resumo (dashboard) × Mapa (talhões clicáveis → histórico)
  const viewToggle = `<div class="secao" style="padding:10px 14px;">
    <div class="nutri-views">
      <button class="nutri-view-btn ${adubView==='resumo'?'on':''}" onclick="window.setAdubView('resumo')">📋 Resumo</button>
      <button class="nutri-view-btn ${adubView==='mapa'?'on':''}" onclick="window.setAdubView('mapa')">🗺️ Mapa</button>
    </div>
  </div>`;
  if (adubView === 'mapa') { renderAdubMapa(viewToggle); return; }
  const planosFil = filtrarPlanos();
  // Verifica se há planos
  if (!planosFil.length) {
    cont.innerHTML = viewToggle + `<div class="vazio"><div class="ico">🧪</div><p>Nenhum plano de adubação no período selecionado.<br><span style="font-size:.78rem;">Verifique o filtro ou cadastre planos no módulo de Adubações.</span></p></div>`;
    return;
  }
  // KPIs
  const totalPlanos = planosFil.length;
  const totalExecutados = planosFil.filter(p =>
    p.aplicacoes && Object.values(p.aplicacoes).some(v => v === true || (typeof v === 'object' && v?.feito))
  ).length;
  const pctExec = totalPlanos > 0 ? (totalExecutados / totalPlanos * 100) : 0;
  const atrasados = calcAdubacoesAtrasadas();
  const haAdubado = calcHaAdubado(planosFil);
  let html = viewToggle + `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Planos no período</div><div class="kpi-value">${totalPlanos}</div><div class="kpi-aux">planos cadastrados</div></div>
    <div class="kpi-card ok"><div class="kpi-label">Executados</div><div class="kpi-value">${totalExecutados}</div><div class="kpi-aux">${fmt(pctExec,0)}% do previsto</div></div>
    <div class="kpi-card ${atrasados>0?'danger':''}"><div class="kpi-label">Atrasados</div><div class="kpi-value">${atrasados}</div><div class="kpi-aux">passou data prevista</div></div>
    <div class="kpi-card info"><div class="kpi-label">Hectares adubados</div><div class="kpi-value">${fmt(haAdubado,1)}</div><div class="kpi-aux">com alguma aplicação</div></div>
  </div>`;
  // Previsto vs Realizado por mês
  const porMes = {};
  planosFil.forEach(p => {
    if (!p.mesAno) return;
    if (!porMes[p.mesAno]) porMes[p.mesAno] = {previsto:0, realizado:0};
    porMes[p.mesAno].previsto++;
    const tem = p.aplicacoes && Object.values(p.aplicacoes).some(v => v === true || (typeof v === 'object' && v?.feito));
    if (tem) porMes[p.mesAno].realizado++;
  });
  const mesesOrd = Object.keys(porMes).sort();
  if (mesesOrd.length > 0) {
    html += `<div class="secao">
      <div class="secao-tit">📅 Planos por mês — previsto vs realizado</div>
      <table class="tbl"><thead><tr>
        <th>Mês</th><th>Previstos</th><th>Realizados</th><th>%</th>
      </tr></thead><tbody>
      ${mesesOrd.map(m => {
        const [a,mm] = m.split('-');
        const lab = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][parseInt(mm)] + '/' + a;
        const v = porMes[m];
        const pct = v.previsto > 0 ? v.realizado/v.previsto*100 : 0;
        const cor = pct >= 80 ? 'var(--ok)' : (pct >= 50 ? 'var(--warn)' : 'var(--danger)');
        return `<tr>
          <td><strong>${lab}</strong></td>
          <td class="num">${v.previsto}</td>
          <td class="num">${v.realizado}</td>
          <td class="num" style="color:${cor};font-weight:700;">${fmt(pct,0)}%</td>
        </tr>`;
      }).join('')}
      </tbody></table>
    </div>`;
  }
  // Atrasados (lista detalhada)
  if (atrasados > 0) {
    const hojeStr = hoje().slice(0,7);
    const listaAtras = planosAdubacao.filter(plano => {
      if (!plano.mesAno || plano.mesAno >= hojeStr) return false;
      if (faz) {
        const t = talhoes.find(x => x.id === plano.talhaoId);
        if (!t || t.fazenda !== faz) return false;
      }
      const tem = plano.aplicacoes && Object.values(plano.aplicacoes).some(v => v === true || (typeof v === 'object' && v?.feito));
      return !tem;
    }).sort((a,b)=>(a.mesAno||'').localeCompare(b.mesAno||''));
    if (listaAtras.length) {
      html += `<div class="secao">
        <div class="secao-tit">⚠️ Adubações atrasadas (sem aplicação)</div>
        <div class="secao-sub">Planos com data já passada e sem aplicação confirmada</div>
        <table class="tbl"><thead><tr>
          <th>Mês previsto</th><th>Talhão</th><th>Fazenda</th>
        </tr></thead><tbody>
        ${listaAtras.slice(0,20).map(p => {
          const t = talhoes.find(x => x.id === p.talhaoId);
          const [a,mm] = (p.mesAno||'').split('-');
          const lab = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][parseInt(mm)] + '/' + a;
          return `<tr>
            <td><strong>${lab}</strong></td>
            <td>${escHtml(p.talhaoId||'')}${t?.nome?' · '+escHtml(t.nome):''}</td>
            <td>${escHtml(t?.fazenda||'—')}</td>
          </tr>`;
        }).join('')}
        ${listaAtras.length > 20 ? `<tr><td colspan="3" style="text-align:center;color:var(--c);font-style:italic;">+ ${listaAtras.length-20} outros não listados</td></tr>` : ''}
        </tbody></table>
      </div>`;
    }
  }
  cont.innerHTML = html;
}

// ── MAPA de adubações (talhões clicáveis → histórico "quais e quando") ──
// Usa aplicações CONFIRMADAS (ap.feito), data = ap.dataFeito (fallback data planejada),
// dentro do período do filtro. Mesmo método confiável usado na aba Nutrientes.
function _adubAgrupaPorTalhao() {
  const { inicio, fim } = periodoFiltro();
  const faz = fazendaFiltro();
  const porTal = {};
  planosAdubacao.forEach(plano => {
    if (!Array.isArray(plano.aplicacoes) || !plano.aplicacoes.length) return;
    const t = talhoes.find(x => x.id === plano.talhaoId);
    if (faz && (!t || t.fazenda !== faz)) return;
    plano.aplicacoes.forEach(ap => {
      if (!ap.feito) return;
      const data = ap.dataFeito || _dataPlanejadaAp(plano, ap) || '';
      if (data && (data < inicio || data > fim)) return; // fora do período selecionado
      const produtos = (ap.produtos||[]).map(x=>({nome:x.produto, dose:x.dose, un:x.unidade})).filter(x=>x.nome);
      const ev = { data, modo: ap.modo||'', fase: ap.fase||'', mesAno: plano.mesAno||'', semana: ap.semana||'', produtos };
      const tid = plano.talhaoId;
      if (!porTal[tid]) porTal[tid] = { qtd:0, ultima:'', eventos:[] };
      porTal[tid].eventos.push(ev);
      porTal[tid].qtd++;
      if (data > porTal[tid].ultima) porTal[tid].ultima = data;
    });
  });
  return porTal;
}
function renderAdubMapa(topo) {
  const cont = document.getElementById('tabContent');
  const porTal = _adubAgrupaPorTalhao();
  const semGeo = Object.keys(porTal).filter(id => { const t = talhoes.find(x=>x.id===id); return !t || !t.coordenadas || t.coordenadas.length < 3; }).length;
  cont.innerHTML = topo + `
    <div class="secao" style="padding-bottom:6px;">
      <div class="secao-tit">🗺️ Mapa de adubações</div>
      <div class="secao-sub">Cor por <b>nº de adubações confirmadas</b> no período · toque num talhão para ver <b>quais</b> adubações e <b>quando</b> foram feitas.${semGeo?` <span style="color:#d97706;">⚠️ ${semGeo} talhão(ões) adubado(s) sem polígono cadastrado no mapa.</span>`:''}</div>
    </div>
    <div id="adubMapWrap" style="position:relative;">
      <div id="adubMap" style="height:min(60vh,460px);border-radius:12px;overflow:hidden;"></div>
      <div id="adubMapLegenda" class="nutri-legenda"></div>
    </div>
    <div id="adubTalhaoDetalhe" class="secao" style="display:none;"></div>`;
  requestAnimationFrame(() => _desenharAdubMapa(porTal));
}
function _desenharAdubMapa(porTal) {
  if (typeof L === 'undefined') return;
  const el = document.getElementById('adubMap'); if (!el) return;
  const map = L.map(el, { center:[-18.7166,-40.4000], zoom:13, scrollWheelZoom:true }); _adubMap = map;
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'© Esri', maxZoom:19 }).addTo(map);
  const norm = c => (c||[]).map(p => Array.isArray(p)?[p[0],p[1]]:(p.lat!==undefined?[p.lat,p.lng]:[p.latitude,p.longitude]));
  const max = Math.max(1, ...Object.values(porTal).map(v=>v.qtd));
  const cor = q => { if (q<=0) return '#94a3b8'; const r=Math.min(1,q/max); const c1=[187,247,208], c2=[21,101,52]; const mix=c1.map((c,i)=>Math.round(c+(c2[i]-c)*r)); return `rgb(${mix[0]},${mix[1]},${mix[2]})`; };
  const bounds = [];
  talhoesFiltrados().forEach(t => {
    if (!t.coordenadas || t.coordenadas.length < 3) return;
    const ll = norm(t.coordenadas); bounds.push(...ll);
    const info = porTal[t.id] || { qtd:0, ultima:'', eventos:[] };
    const q = info.qtd;
    const poly = L.polygon(ll, { color:'#fff', weight:1.5, fillColor:cor(q), fillOpacity:q>0?.8:.3 }).addTo(map);
    const ultimaTxt = info.ultima ? formatarData(info.ultima) : '—';
    poly.bindTooltip(`<b>${escHtml(t.nome||t.id)}</b><br>${q>0?`${q} adubaç${q>1?'ões':'ão'} · última ${ultimaTxt}`:'sem adubação no período'}`, { sticky:true });
    poly.on('click', () => _adubMostrarTalhao(t, info));
  });
  if (bounds.length) { try { map.fitBounds(bounds, { padding:[30,30], maxZoom:15 }); } catch(e){} }
  setTimeout(() => map.invalidateSize(), 200);
  const leg = document.getElementById('adubMapLegenda');
  if (leg) leg.innerHTML = `<div class="nl-tit">Nº de adubações</div>
    <div style="width:120px;height:9px;border-radius:4px;background:linear-gradient(90deg,#bbf7d0,#15803d);"></div>
    <div class="nl-esc"><span>1</span><span>${max}</span></div>
    <div class="nl-row"><span class="nl-dot" style="background:#94a3b8;"></span>sem adubação</div>`;
}

          ${e.produtos&&e.produtos.length?`<div class="phi-linha">${e.produtos.map(pr=>`<span class="praga-prod-chip" style="color:#166534;">🧪 ${escHtml(pr.nome)}${pr.dose?` · ${escHtml(String(pr.dose))} ${escHtml(pr.un||'')}/ha`:''}</span>`).join('')}</div>`:'<div class="phi-modo" style="color:var(--c);">sem produtos detalhados</div>'}
        </div>

  box.scrollIntoView({ behavior:'smooth', block:'nearest' });

// ABA 6 — COMPRAS PLANEJADAS (importa planosAdubacao)
// ════════════════════════════════════════════════════
// Converte "Mês/Ano" em chave numérica ordenável (ano*12 + índice do mês)
function mesAnoKey(mesAno) {
  if (!mesAno) return null;
  const [mes, ano] = String(mesAno).split('/');
  const idx = MESES.indexOf(mes);
  if (idx < 0 || !ano) return null;
  return parseInt(ano) * 12 + idx;
}
function mesAnoAbrev(mesAno) {
  const [mes, ano] = String(mesAno || '').split('/');
  const idx = MESES.indexOf(mes);
  return idx >= 0 ? `${MESES_ABREV[idx]}/${ano}` : (mesAno || '');
}
function defaultMesAnoAtual() {
  const h = new Date();
  return `${MESES[h.getMonth()]}/${h.getFullYear()}`;
}
// Lista os meses (Mês/Ano) presentes nos planos de adubação, em ordem cronológica
function listaMesesPlanos() {
  const set = new Set();
  planosAdubacao.forEach(p => { if (p.mesAno && mesAnoKey(p.mesAno) != null) set.add(p.mesAno); });
  return [...set].sort((a, b) => mesAnoKey(a) - mesAnoKey(b));
}

// ─── SAFRA (período agrícola, definido em Adubações → ⚙️ Safra) ───
// Dado um mês/ano, retorna o ano de início da safra à qual ele pertence e o rótulo da safra.
function safraDeMes(mes, ano) {
  const mi = configAdubacao.mesInicio ?? 0;
  const mf = configAdubacao.mesFim ?? 11;
  if (mi <= mf) return { anoIni: ano, label: `${ano}` };
  const anoIni = mes >= mi ? ano : ano - 1;
  return { anoIni, label: `${anoIni}/${anoIni + 1}` };
}
// Retorna o intervalo de datas (YYYY-MM-DD) correspondente à safra que começa em anoIni
function safraRange(anoIni) {
  const mi = configAdubacao.mesInicio ?? 0;
  const mf = configAdubacao.mesFim ?? 11;
  const anoFimCalc = mi <= mf ? anoIni : anoIni + 1;
  const inicio = new Date(anoIni, mi, 1).toISOString().slice(0, 10);
  const fim = new Date(anoFimCalc, mf + 1, 0).toISOString().slice(0, 10);
  return { inicio, fim };
}
// Lista as safras (ano de início + rótulo) presentes nos planos de adubação, em ordem cronológica
function listaSafras() {
  const map = new Map();
  listaMesesPlanos().forEach(m => {
    const [mesNome, anoStr] = m.split('/');
    const { anoIni, label } = safraDeMes(MESES.indexOf(mesNome), parseInt(anoStr));
    map.set(anoIni, label);
  });
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(([anoIni, label]) => ({ anoIni, label }));
}

window.setCompraTalhao = function(v) { compraTalhaoId = v; renderTab(); };
window.setCompraFazenda = function(v) {
  compraFazendaId = v;
  if (compraTalhaoId) {
    const t = talhoes.find(x => x.id === compraTalhaoId);
    if (t && v && t.fazenda !== v) compraTalhaoId = '';
  }
  renderTab();
};
window.setCompraDe = function(v) {
  compraDe = v;
  compraSafra = '';
  if (mesAnoKey(compraDe) > mesAnoKey(compraAte)) compraAte = compraDe;
  renderTab();
};
window.setCompraAte = function(v) {
  compraAte = v;
  compraSafra = '';
  if (mesAnoKey(compraAte) < mesAnoKey(compraDe)) compraDe = compraAte;
  renderTab();
};
window.setCompraSafra = function(v) {
  compraSafra = v;
  if (v) {
    const anoIni = parseInt(v);
    const mesesDaSafra = listaMesesPlanos().filter(m => {
      const [mesNome, anoStr] = m.split('/');
      return safraDeMes(MESES.indexOf(mesNome), parseInt(anoStr)).anoIni === anoIni;
    });
    if (mesesDaSafra.length) {
      compraDe = mesesDaSafra[0];
      compraAte = mesesDaSafra[mesesDaSafra.length - 1];
    }
  }
  renderTab();
};

function renderCompras() {
  const cont = document.getElementById('tabContent');
  const meses = listaMesesPlanos();
  if (!meses.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🛒</div><p>Nenhum plano de adubação cadastrado.<br><span style="font-size:.78rem;">Cadastre os planos no módulo de Adubações para gerar o relatório de compras.</span></p></div>`;
    return;
  }
  // Define padrões do período: do mês atual (ou próximo disponível) até o último planejado
  const hojeKey = mesAnoKey(defaultMesAnoAtual());
  if (!compraDe || mesAnoKey(compraDe) == null || !meses.includes(compraDe)) {
    compraDe = meses.find(m => mesAnoKey(m) >= hojeKey) || meses[0];
  }
  if (!compraAte || mesAnoKey(compraAte) == null || !meses.includes(compraAte)) {
    compraAte = meses[meses.length - 1];
  }
  if (mesAnoKey(compraDe) > mesAnoKey(compraAte)) compraAte = compraDe;

  // Talhões disponíveis (respeita filtro global e filtro local de fazenda da aba)
  const faz = fazendaFiltro();
  const fazEfetiva = faz || compraFazendaId;
  const fazendasBase = [...new Set((faz ? talhoes.filter(t => t.fazenda === faz) : talhoes).map(t => t.fazenda).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  if (compraFazendaId && !fazendasBase.includes(compraFazendaId)) compraFazendaId = '';
  const talhoesBase = (fazEfetiva ? talhoes.filter(t => t.fazenda === fazEfetiva) : talhoes)
    .slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  if (compraTalhaoId && !talhoesBase.some(t => t.id === compraTalhaoId)) compraTalhaoId = '';
  const talhoesSel = compraTalhaoId ? talhoesBase.filter(t => t.id === compraTalhaoId) : talhoesBase;
  const mesesSel = meses.filter(m => mesAnoKey(m) >= mesAnoKey(compraDe) && mesAnoKey(m) <= mesAnoKey(compraAte));
  const safras = listaSafras();

  // Barra de filtros do relatório
  let html = `<div class="secao" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    ${!faz && fazendasBase.length > 1 ? `<div class="filtro-grupo">
      <span class="filtro-label">🏡 Fazenda</span>
      <select class="filtro-sel" id="selCompraFazenda" onchange="window.setCompraFazenda(this.value)">
        <option value="">Todas</option>
        ${fazendasBase.map(f => `<option value="${escAttr(f)}"${f === compraFazendaId ? ' selected' : ''}>${escHtml(f)}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="filtro-grupo">
      <span class="filtro-label">🌱 Talhão</span>
      <select class="filtro-sel" id="selCompraTalhao" onchange="window.setCompraTalhao(this.value)">
        <option value="">Todos</option>
        ${talhoesBase.map(t => `<option value="${escAttr(t.id)}"${t.id === compraTalhaoId ? ' selected' : ''}>${escHtml(t.nome || t.id)}</option>`).join('')}
      </select>
    </div>
    ${safras.length ? `<div class="filtro-grupo">
      <span class="filtro-label">🗓️ Safra</span>
      <select class="filtro-sel" id="selCompraSafra" onchange="window.setCompraSafra(this.value)">
        <option value="">Personalizado</option>
        ${safras.map(s => `<option value="${s.anoIni}"${String(s.anoIni) === compraSafra ? ' selected' : ''}>Safra ${s.label}</option>`).join('')}
      </select>
    </div>` : ''}
    <div class="filtro-grupo">
      <span class="filtro-label">📅 De</span>
      <select class="filtro-sel" id="selCompraDe" onchange="window.setCompraDe(this.value)">
        ${meses.map(m => `<option value="${escAttr(m)}"${m === compraDe ? ' selected' : ''}>${mesAnoAbrev(m)}</option>`).join('')}
      </select>
    </div>
    <div class="filtro-grupo">
      <span class="filtro-label">📅 Até</span>
      <select class="filtro-sel" id="selCompraAte" onchange="window.setCompraAte(this.value)">
        ${meses.map(m => `<option value="${escAttr(m)}"${m === compraAte ? ' selected' : ''}>${mesAnoAbrev(m)}</option>`).join('')}
      </select>
    </div>
  </div>`;

  if (!mesesSel.length || !talhoesSel.length) {
    html += `<div class="vazio"><div class="ico">🛒</div><p>Nenhum plano de adubação no período/seleção escolhidos.</p></div>`;
    cont.innerHTML = html;
    return;
  }

  // Agrega: para cada talhão, soma as doses (por ha) de cada produto nos planos do período
  // e multiplica pela área do talhão para obter a quantidade total a comprar.
  const totais = {}; // "produto|unidade" -> {produto,unidade,qtd,_talhoes}
  const detalhe = []; // [{fazenda,talhao,area,produto,unidade,doseHa,qtd}]
  talhoesSel.forEach(t => {
    const area = parseDose(t.area);
    const planos = planosAdubacao.filter(p => p.talhaoId === t.id && mesesSel.includes(p.mesAno));
    const porProdutoTalhao = {};
    planos.forEach(plano => {
      (plano.aplicacoes || []).forEach(ap => {
        (ap.produtos || []).forEach(p => {
          const dose = parseDose(p.dose);
          if (!dose) return;
          const key = `${p.produto}|${p.unidade}`;
          if (!totais[key]) totais[key] = { produto: p.produto, unidade: p.unidade, qtd: 0, _talhoes: new Map() };
          totais[key].qtd += dose * area;
          // acumula dose por talhão sem misturar talhões distintos
          totais[key]._talhoes.set(t.id, (totais[key]._talhoes.get(t.id) || 0) + dose * area);
          if (!porProdutoTalhao[key]) porProdutoTalhao[key] = { produto: p.produto, unidade: p.unidade, doseHa: 0, qtd: 0 };
          porProdutoTalhao[key].doseHa += dose;
          porProdutoTalhao[key].qtd += dose * area;
        });
      });
    });
    Object.values(porProdutoTalhao).forEach(item => {
      detalhe.push({ fazenda: t.fazenda, talhao: t.nome || t.id, area, ...item });
    });
  });

  // Calcula dose média por hectare = quantidade total ÷ área dos talhões que receberam o produto
  Object.values(totais).forEach(item => {
    const areaTratada = [...item._talhoes.keys()].reduce((s, id) => {
      const t = talhoesSel.find(x => x.id === id);
      return s + parseDose(t?.area);
    }, 0);
    item.doseHa = areaTratada > 0 ? item.qtd / areaTratada : 0;
  });

  const totaisOrd = Object.values(totais).sort((a, b) => a.produto.localeCompare(b.produto, 'pt-BR'));
  const areaTotal = talhoesSel.reduce((s, t) => s + parseDose(t.area), 0);
  const periodoLbl = compraDe === compraAte ? mesAnoAbrev(compraDe) : `${mesAnoAbrev(compraDe)} a ${mesAnoAbrev(compraAte)}`;

  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Período</div><div class="kpi-value" style="font-size:1.05rem;">${escHtml(periodoLbl)}</div><div class="kpi-aux">${mesesSel.length} mês(es)</div></div>
    <div class="kpi-card"><div class="kpi-label">Talhões considerados</div><div class="kpi-value">${talhoesSel.length}</div><div class="kpi-aux">${fmt(areaTotal, 1)} ha</div></div>
    <div class="kpi-card info"><div class="kpi-label">Produtos</div><div class="kpi-value">${totaisOrd.length}</div><div class="kpi-aux">distintos no período</div></div>
  </div>`;

  if (!totaisOrd.length) {
    html += `<div class="vazio"><div class="ico">🛒</div><p>Nenhum produto previsto para o período/seleção escolhidos.</p></div>`;
    cont.innerHTML = html;
    return;
  }

  html += `<div class="secao">
    <div class="secao-tit">🛒 Total a comprar</div>
    <div class="secao-sub">Soma das doses previstas nos planos de adubação × área dos talhões, no período selecionado.</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Produto</th><th class="num">Dose média (kg/ha)</th><th class="num">Quantidade a comprar</th>
    </tr></thead><tbody>
    ${totaisOrd.map(p => `<tr>
      <td><strong>${escHtml(p.produto)}</strong></td>
      <td class="num">${fmt(p.doseHa, 2)} ${escHtml(p.unidade)}/ha</td>
      <td class="num">${fmt(p.qtd, 2)} ${escHtml(p.unidade)}</td>
    </tr>`).join('')}
    </tbody></table></div>
  </div>`;

  if (talhoesSel.length > 1 && detalhe.length) {
    const detOrd = detalhe.slice().sort((a, b) =>
      (a.fazenda || '').localeCompare(b.fazenda || '', 'pt-BR') ||
      a.talhao.localeCompare(b.talhao, 'pt-BR') ||
      a.produto.localeCompare(b.produto, 'pt-BR'));
    html += `<div class="secao">
      <div class="secao-tit">📋 Detalhamento por talhão</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>

// ════════════════════════════════════════════════════
// ABA 7 — NUTRIENTES APLICADOS (importa planosAdubacao + catalogo_adubos)
// ════════════════════════════════════════════════════
const NUTRIENTE_LABELS = {
  n:'Nitrogênio (N)', p2o5:'Fósforo (P₂O₅)', k2o:'Potássio (K₂O)',
  s:'Enxofre (S)', ca:'Cálcio (Ca)', mg:'Magnésio (Mg)',
  zn:'Zinco (Zn)', b:'Boro (B)', cu:'Cobre (Cu)', mn:'Manganês (Mn)'
};
// Fator de conversão da unidade do produto para kg (líquidos aproximados pela densidade da água)
const FATOR_KG = { kg:1, g:0.001, t:1000, L:1, mL:0.001 };

function normNome(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '').trim();
}
function buscarComposicaoProduto(nomeProduto) {
  const norm = normNome(nomeProduto);
  if (!norm) return null;
  return catalogoAdubos.find(a => (a.nomeNormalizado || normNome(a.nome)) === norm) || null;
}

window.setNutrTalhao = function(v) { nutrTalhaoId = v; renderTab(); };
window.setNutrSafra = function(v) { nutrSafra = v; renderTab(); };
window.setNutrView = function(v) { nutrView = v; renderTab(); };
window.setNutrNutriente = function(v) { nutrNutrienteSel = v; renderTab(); };

// Calcula nutrientes aplicados (confirmados) no período, com total e detalhado por talhão
function _dataPlanejadaAp(plano, ap) {
  const [mesNome, anoStr] = String(plano.mesAno || '').split('/');
  const mesIdx = MESES.indexOf(mesNome); const ano = parseInt(anoStr);
  if (mesIdx < 0 || !ano) return null;
  const semIdx = ordemSem(ap.semana);
  const dia = DIAS_SEMANA_ADUBACAO[semIdx >= 0 ? semIdx : 0];
  return `${ano}-${String(mesIdx + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}
function _calcNutrientes(talhoesSel, inicio, fim) {
  const total = {};                 // nk -> kg (APLICADO/feito)
  const porTalhao = {};             // talhaoId -> {nk:kg} (feito)
  const plan = {};                  // nk -> {ateHoje, total} (PLANEJADO, kg)
  const porTalhaoPlan = {};         // talhaoId -> {nk:{ateHoje,total}}
  const naoContabilizados = {};
  let totalAplicacoes = 0;
  const talhoesAdubados = new Set();
  const hj = hoje();
  const addPlan = (obj, nk, kg, ateHoje) => { const o = (obj[nk] = obj[nk] || { ateHoje: 0, total: 0 }); o.total += kg; if (ateHoje) o.ateHoje += kg; };
  talhoesSel.forEach(t => {
    const area = parseDose(t.area);
    planosAdubacao.filter(p => p.talhaoId === t.id).forEach(plano => {
      (plano.aplicacoes || []).forEach(ap => {
        const dataPlan = _dataPlanejadaAp(plano, ap);
        const naSafra = dataPlan && dataPlan >= inicio && dataPlan <= fim;   // aplicação planejada dentro do período/safra
        const feitoNoPeriodo = ap.feito && (!ap.dataFeito || (ap.dataFeito >= inicio && ap.dataFeito <= fim));
        if (feitoNoPeriodo) { totalAplicacoes++; talhoesAdubados.add(t.id); }
        (ap.produtos || []).forEach(p => {
          const dose = parseDose(p.dose); if (!dose) return;
          const qtdProduto = dose * area;
          const fator = FATOR_KG[p.unidade];
          const comp = buscarComposicaoProduto(p.produto);
          if (fator == null || !comp) {
            if (feitoNoPeriodo) { const k = `${p.produto}|${p.unidade}`; if (!naoContabilizados[k]) naoContabilizados[k] = { produto: p.produto, unidade: p.unidade, qtd: 0 }; naoContabilizados[k].qtd += qtdProduto; }
            return;
          }
          const qtdKg = qtdProduto * fator;
          Object.keys(NUTRIENTE_LABELS).forEach(nk => {
            const pct = comp[nk]; if (!pct) return;
            const kg = qtdKg * pct / 100;
            if (feitoNoPeriodo) {
              total[nk] = (total[nk] || 0) + kg;
              (porTalhao[t.id] = porTalhao[t.id] || {})[nk] = (porTalhao[t.id][nk] || 0) + kg;
            }
            if (naSafra) {
              addPlan(plan, nk, kg, dataPlan <= hj);
              addPlan(porTalhaoPlan[t.id] = porTalhaoPlan[t.id] || {}, nk, kg, dataPlan <= hj);
            }
          });
        });
      });
    });
  });
  const areaAdubada = talhoes.filter(t => talhoesAdubados.has(t.id)).reduce((s, t) => s + parseDose(t.area), 0);
  return { total, porTalhao, plan, porTalhaoPlan, naoContabilizados, totalAplicacoes, talhoesAdubados, areaAdubada };
}

function renderNutrientes() {
  const cont = document.getElementById('tabContent');
  const faz = fazendaFiltro();
  let { inicio, fim, label: lblPeriodo } = periodoFiltro();
  const safras = listaSafras();
  if (nutrSafra) {
    const safraSel = safras.find(s => String(s.anoIni) === nutrSafra);
    if (safraSel) { ({ inicio, fim } = safraRange(safraSel.anoIni)); lblPeriodo = `Safra ${safraSel.label}`; }
  }
  const talhoesBase = (faz ? talhoes.filter(t => t.fazenda === faz) : talhoes)
    .slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  if (nutrTalhaoId && !talhoesBase.some(t => t.id === nutrTalhaoId)) nutrTalhaoId = '';
  // No mapa e no painel usamos TODOS os talhões da fazenda (a seleção é por clique no mapa); na tabela respeita o dropdown
  const talhoesSel = (nutrView === 'tabela' && nutrTalhaoId) ? talhoesBase.filter(t => t.id === nutrTalhaoId) : talhoesBase;
  const d = _calcNutrientes(talhoesSel, inicio, fim);

  // Destrói mapa/charts anteriores (o tabContent vai ser reescrito)
  if (_nutriMap) { try { _nutriMap.remove(); } catch(e){} _nutriMap = null; }
  _nutriCharts.forEach(c => { try { c.destroy(); } catch(e){} }); _nutriCharts = [];

  // Barra de filtro (safra) + abas de visualização
  let html = `<div class="secao" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
    <div class="nutri-views">
      <button class="nutri-view-btn ${nutrView==='painel'?'on':''}" onclick="window.setNutrView('painel')">📊 Painel</button>
      <button class="nutri-view-btn ${nutrView==='mapa'?'on':''}" onclick="window.setNutrView('mapa')">🗺️ Mapa</button>
      <button class="nutri-view-btn ${nutrView==='tabela'?'on':''}" onclick="window.setNutrView('tabela')">📋 Tabela</button>
    </div>
    ${safras.length ? `<div class="filtro-grupo">
      <span class="filtro-label">🗓️ Safra</span>
      <select class="filtro-sel" id="selNutrSafra" onchange="window.setNutrSafra(this.value)">
        <option value="">Período do topo</option>
        ${safras.map(s => `<option value="${s.anoIni}"${String(s.anoIni) === nutrSafra ? ' selected' : ''}>Safra ${s.label}</option>`).join('')}
      </select>
    </div>` : ''}
  </div>`;

  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Período</div><div class="kpi-value" style="font-size:1.05rem;">${escHtml(lblPeriodo)}</div><div class="kpi-aux">${faz ? escHtml(faz) : 'todas as fazendas'}</div></div>
    <div class="kpi-card ok"><div class="kpi-label">Aplicações realizadas</div><div class="kpi-value">${d.totalAplicacoes}</div><div class="kpi-aux">no período</div></div>
    <div class="kpi-card info"><div class="kpi-label">Hectares adubados</div><div class="kpi-value">${fmt(d.areaAdubada, 1)}</div><div class="kpi-aux">${d.talhoesAdubados.size} talhão(ões)</div></div>
  </div>`;

  if (!d.totalAplicacoes) {
    html += `<div class="vazio"><div class="ico">🌿</div><p>Nenhuma aplicação de adubação confirmada no período/seleção escolhidos.<br><span style="font-size:.78rem;">Marque as aplicações como "feitas" no módulo de Adubações.</span></p></div>`;
    cont.innerHTML = html; return;
  }

  if (nutrView === 'tabela')      html += _nutriTabelaHtml(d, talhoesBase, faz, lblPeriodo, talhoesSel);
  else if (nutrView === 'painel') html += _nutriPainelHtml(d);
  else                            html += _nutriMapaHtml(d, faz);

  cont.innerHTML = html;
  if (nutrView === 'painel') requestAnimationFrame(() => _nutriDesenharCharts(d));
  if (nutrView === 'mapa')   requestAnimationFrame(() => _nutriDesenharMapa(d, talhoesSel));
}

const NUTRI_CORES = { n:'#22c55e', p2o5:'#f59e0b', k2o:'#a855f7', s:'#eab308', ca:'#3b82f6', mg:'#14b8a6', zn:'#ec4899', b:'#f97316', cu:'#8b5cf6', mn:'#06b6d4', fe:'#ef4444', mo:'#64748b' };
function _nutrienteOpcoes(sel){ return Object.keys(NUTRIENTE_LABELS).map(k=>`<option value="${k}"${k===sel?' selected':''}>${escHtml(NUTRIENTE_LABELS[k])}</option>`).join(''); }

// Barras comparativas por nutriente: Aplicado (preenchido) × Previsto até hoje (marca ▲) × Total da safra.
// area>0 → mostra em kg/ha; area=0 → kg total.
function _nutriBarrasHtml(feitoObj, planObj, area) {
  feitoObj = feitoObj || {}; planObj = planObj || {};
  const perHa = area > 0, conv = v => perHa ? v/area : v, un = perHa ? 'kg/ha' : 'kg', dec = perHa ? 1 : 0;
  const keys = Object.keys(NUTRIENTE_LABELS).filter(k => (feitoObj[k] > 0) || (planObj[k] && planObj[k].total > 0));
  if (!keys.length) return '<div class="secao-sub">Nada aplicado nem planejado neste recorte.</div>';
  return `<div class="nut-bars">${keys.map(k => {
    const feito = conv(feitoObj[k] || 0);
    const pl = planObj[k] || { ateHoje:0, total:0 };
    const ateHoje = conv(pl.ateHoje || 0), tot = conv(pl.total || 0);
    const base = Math.max(feito, tot, ateHoje, 0.0001);
    const wFeito = Math.min(100, feito / base * 100);
    const mMarca = Math.min(100, ateHoje / base * 100);
    const atrasado = ateHoje > 0 && feito < ateHoje * 0.999;
    const falta = Math.max(0, ateHoje - feito);
    const cor = NUTRI_CORES[k] || '#22c55e';
    const pctSafra = tot > 0 ? Math.round(feito / tot * 100) : null;
    return `<div class="nut-bar-row">
      <div class="nut-bar-top">
        <span class="nut-bar-nome"><span class="nb-dot" style="background:${cor}"></span>${escHtml(NUTRIENTE_LABELS[k])}${pctSafra!==null?` <span class="nb-pct">${pctSafra}% da safra</span>`:''}</span>
        ${ateHoje > 0 ? `<span class="nut-selo ${atrasado?'atr':'ok'}">${atrasado?`⚠ faltam ${fmt(falta,dec)} ${un}`:'✓ em dia'}</span>` : (feito>0?`<span class="nut-selo neu">aplicado</span>`:'')}
      </div>
      <div class="nut-bar-track" title="Aplicado ${fmt(feito,dec)} · Previsto até hoje ${fmt(ateHoje,dec)} · Safra ${fmt(tot,dec)} ${un}">
        <div class="nut-bar-feito" style="width:${wFeito}%;background:${atrasado?'#f59e0b':cor}"></div>
        ${ateHoje > 0 ? `<div class="nut-bar-marca" style="left:${mMarca}%"></div>` : ''}
      </div>
      <div class="nut-bar-labels">
        <span class="nl-feito">● Aplicado <b>${fmt(feito,dec)}</b></span>
        <span class="nl-hoje">▲ Previsto hoje <b>${ateHoje>0?fmt(ateHoje,dec):'—'}</b></span>
        <span class="nl-safra">▮ Safra <b>${tot>0?fmt(tot,dec):'—'}</b> ${un}</span>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── PAINEL (dashboard) ──
function _nutriPainelHtml(d) {
  const nsel = (d.total[nutrNutrienteSel] > 0 || (d.plan[nutrNutrienteSel] && d.plan[nutrNutrienteSel].total > 0)) ? nutrNutrienteSel : (['n','p2o5','k2o'].find(k=>d.total[k]>0) || Object.keys(d.total)[0] || 'n');
  return `
    <div class="secao"><div class="secao-tit">🎯 Aplicado × planejado na safra</div>
      <div class="secao-sub">Por nutriente, no total da seleção: barra = já aplicado · <b>▲</b> = previsto até hoje · <b>▮</b> = total da safra.</div>
      ${_nutriBarrasHtml(d.total, d.plan, 0)}
    </div>
    <div class="secao">
      <div class="secao-tit" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>🏅 Talhões que mais receberam</span>
        <select class="filtro-sel" onchange="window.setNutrNutriente(this.value)">${_nutrienteOpcoes(nsel)}</select>
      </div>
      <div class="secao-sub">kg/ha de ${escHtml(NUTRIENTE_LABELS[nsel])} aplicado por talhão.</div>
      <div class="chart-box" id="boxRankTalhao"><canvas id="chNutriRank"></canvas></div>
    </div>`;
}
function _nutriDesenharCharts(d) {
  if (typeof Chart === 'undefined') return;
  const nsel = (d.total[nutrNutrienteSel] > 0 || (d.plan[nutrNutrienteSel] && d.plan[nutrNutrienteSel].total > 0)) ? nutrNutrienteSel : (['n','p2o5','k2o'].find(k=>d.total[k]>0) || Object.keys(d.total)[0] || 'n');
  const ranking = Object.entries(d.porTalhao).map(([tid, obj]) => {
    const t = talhoes.find(x => x.id === tid); const area = t ? parseDose(t.area) : 0;
    return { nome: (t && (t.nome || t.id)) || tid, kgha: area > 0 ? (obj[nsel] || 0) / area : 0 };
  }).filter(r => r.kgha > 0).sort((a, b) => b.kgha - a.kgha).slice(0, 12);
  const c3 = document.getElementById('chNutriRank');
  if (c3 && ranking.length) _nutriCharts.push(new Chart(c3, { type:'bar', data:{ labels:ranking.map(r=>r.nome), datasets:[{ data:ranking.map(r=>Math.round(r.kgha*100)/100), backgroundColor:NUTRI_CORES[nsel]||'#1a5c1a', borderRadius:5 }] }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.x,2)+' kg/ha'}}}, scales:{x:{ticks:{callback:v=>fmt(v,0)}}} } }));
}

// ── MAPA (talhões clicáveis por nutriente) ──
function _nutriMapaHtml(d, faz) {
  const nsel = d.total[nutrNutrienteSel] > 0 ? nutrNutrienteSel : (Object.keys(d.total)[0] || 'n');
  return `
    <div class="secao" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span class="filtro-label">🌿 Nutriente no mapa</span>
      <select class="filtro-sel" onchange="window.setNutrNutriente(this.value)">${_nutrienteOpcoes(nsel)}</select>
      <span class="secao-sub" style="margin:0;">Cores por <b>kg/ha</b> de ${escHtml(NUTRIENTE_LABELS[nsel])} · toque num talhão para ver o detalhe.</span>
    </div>
    <div id="nutriMapWrap" style="position:relative;">
      <div id="nutriMap" style="height:min(60vh,460px);border-radius:12px;overflow:hidden;"></div>
      <div id="nutriMapLegenda" class="nutri-legenda"></div>
    </div>
    <div id="nutriTalhaoDetalhe" class="secao" style="display:none;"></div>`;
}
function _nutriDesenharMapa(d, talhoesSel) {
  if (typeof L === 'undefined') return;
  const nsel = d.total[nutrNutrienteSel] > 0 ? nutrNutrienteSel : (Object.keys(d.total)[0] || 'n');
  const el = document.getElementById('nutriMap'); if (!el) return;
  const map = L.map(el, { center:[-18.7166,-40.4000], zoom:13, scrollWheelZoom:true }); _nutriMap = map;
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'© Esri', maxZoom:19 }).addTo(map);
  const norm = c => (c||[]).map(p => Array.isArray(p)?[p[0],p[1]]:(p.lat!==undefined?[p.lat,p.lng]:[p.latitude,p.longitude]));
  // kg/ha por talhão para o nutriente escolhido → escala de cor
  const vals = {};
  talhoesSel.forEach(t => { const a=parseDose(t.area); const kg=(d.porTalhao[t.id]||{})[nsel]||0; vals[t.id] = a>0?kg/a:0; });
  const max = Math.max(0.0001, ...Object.values(vals));
  const cor = v => { if (v<=0) return '#94a3b8'; const r=Math.min(1,v/max); // amarelo→verde escuro
    const g1=[254,240,138], g2=[22,101,52]; const mix=g1.map((c,i)=>Math.round(c+(g2[i]-c)*r)); return `rgb(${mix[0]},${mix[1]},${mix[2]})`; };
  const bounds = [];
  talhoesSel.forEach(t => {
    if (!t.coordenadas || t.coordenadas.length < 3) return;
    const ll = norm(t.coordenadas); bounds.push(...ll);
    const v = vals[t.id] || 0;
    const poly = L.polygon(ll, { color:'#fff', weight:1.5, fillColor:cor(v), fillOpacity:v>0?.75:.35 }).addTo(map);
    poly.bindTooltip(`<b>${escHtml(t.nome||t.id)}</b><br>${fmt(v,2)} kg/ha de ${escHtml(NUTRIENTE_LABELS[nsel])}`, { sticky:true });
    poly.on('click', () => _nutriMostrarTalhao(t, d));
  });
  if (bounds.length) { try { map.fitBounds(bounds, { padding:[30,30], maxZoom:15 }); } catch(e){} }
  setTimeout(() => map.invalidateSize(), 200);
  // legenda
  const leg = document.getElementById('nutriMapLegenda');
  if (leg) leg.innerHTML = `<div class="nl-tit">${escHtml(NUTRIENTE_LABELS[nsel])} (kg/ha)</div>
    <div class="nl-bar"></div><div class="nl-esc"><span>0</span><span>${fmt(max,1)}</span></div>
    <div class="nl-row"><span class="nl-dot" style="background:#94a3b8;"></span>sem aplicação</div>`;
}
function _nutriMostrarTalhao(t, d) {
  const box = document.getElementById('nutriTalhaoDetalhe'); if (!box) return;
  const area = parseDose(t.area);
  box.style.display = '';
  box.innerHTML = `<div class="secao-tit" style="display:flex;justify-content:space-between;align-items:center;">
      <span>🌱 ${escHtml(t.nome||t.id)} <span style="font-weight:400;color:var(--c);font-size:.8rem;">· ${escHtml(t.fazenda||'')} · ${fmt(area,1)} ha</span></span>
      <button class="nutri-view-btn" onclick="document.getElementById('nutriTalhaoDetalhe').style.display='none'">✕</button>
    </div>
    <div class="secao-sub">Por nutriente (kg/ha): barra = aplicado · <b>▲</b> = previsto até hoje · <b>▮</b> = total da safra.</div>
    ${_nutriBarrasHtml(d.porTalhao[t.id], d.porTalhaoPlan[t.id], area)}`;
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ── TABELA (visão original) ──
function _nutriTabelaHtml(d, talhoesBase, faz, lblPeriodo, talhoesSel) {
  const nutrientesOrd = Object.keys(NUTRIENTE_LABELS).filter(k => d.total[k] > 0);
  let html = `<div class="secao" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <div class="filtro-grupo">
      <span class="filtro-label">🌱 Talhão</span>
      <select class="filtro-sel" id="selNutrTalhao" onchange="window.setNutrTalhao(this.value)">
        <option value="">Todos${faz ? '' : ' (todas fazendas)'}</option>
        ${talhoesBase.map(t => `<option value="${escAttr(t.id)}"${t.id === nutrTalhaoId ? ' selected' : ''}>${escHtml(t.nome || t.id)}${!faz ? ' · ' + escHtml(t.fazenda || '') : ''}</option>`).join('')}
      </select>
    </div>
  </div>`;
  if (nutrientesOrd.length) {
    html += `<div class="secao">
      <div class="secao-tit">🌿 Nutrientes aplicados</div>
      <div class="secao-sub">Doses aplicadas (confirmadas) × área × composição do catálogo de adubos. Líquidos (L/mL) ≈ 1 kg/L.</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nutriente</th><th class="num">Total aplicado</th><th class="num">kg/ha</th></tr></thead><tbody>
      ${nutrientesOrd.map(k => `<tr><td><strong>${escHtml(NUTRIENTE_LABELS[k])}</strong></td><td class="num">${fmt(d.total[k], 1)} kg</td><td class="num">${d.areaAdubada > 0 ? fmt(d.total[k] / d.areaAdubada, 2) + ' kg/ha' : '—'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  } else {
    html += `<div class="vazio"><div class="ico">🌿</div><p>Nenhum produto aplicado tem composição no catálogo de adubos.<br><span style="font-size:.78rem;">Cadastre a composição NPK em Administração → Catálogo de adubos.</span></p></div>`;
  }
  const naoContOrd = Object.values(d.naoContabilizados).sort((a, b) => a.produto.localeCompare(b.produto, 'pt-BR'));

  return html;
}

// ABA 8 — CALENDÁRIO (pendências: pulverizações, drench preventivo e adubações)
// ════════════════════════════════════════════════════
// Mapeia a semana de uma aplicação de adubação para um dia aproximado do mês
const DIAS_SEMANA_ADUBACAO = [5, 12, 19, 26];

function renderCalendario() {
  const cont = document.getElementById('tabContent');
  const faz = fazendaFiltro();
  const hj = hoje();
  const eventos = [];

  // Pulverizações pendentes (ainda não realizadas / não encerradas como parciais)
  pulverizacoes.forEach(p => {
    if (p.realizada || p.aplicacaoStatus === 'encerrada_parcial') return;
    if (!p.data) return;
    if (faz && p.fazenda !== faz) return;
    const prods = (p.produtos || []).map(pr => pr.produto).filter(Boolean).join(', ');
    eventos.push({
      data: p.data,
      tipo: 'pulverizacao',
      icone: '💧',
      label: 'Pulverização',
      fazenda: p.fazenda || '',
      talhaoNome: p.talhaoNome || '',
      descricao: [p.pragaAlvo, prods].filter(Boolean).join(' · '),
      parcial: p.aplicacaoStatus === 'parcial'
    });
  });

  // Drench preventivo pendente
  drenchPrevencao.forEach(d => {
    if (d.status === 'realizado') return;
    if (!d.data) return;
    if (faz && d.fazenda !== faz) return;
    const prods = (d.produtos || []).map(pr => pr.produto).filter(Boolean).join(', ');
    const alvo = Array.isArray(d.alvoPrevencao) ? d.alvoPrevencao.filter(Boolean).join(', ') : (d.alvoPrevencao || '');
    eventos.push({
      data: d.data,
      tipo: 'drench',
      icone: '🌱',
      label: 'Drench preventivo',
      fazenda: d.fazenda || '',
      talhaoNome: d.talhaoNome || '',
      descricao: [alvo, prods].filter(Boolean).join(' · '),
      parcial: false
    });
  });

  // Adubações pendentes (aplicações não confirmadas dos planos de adubação)
  planosAdubacao.forEach(plano => {
    const t = talhoes.find(x => x.id === plano.talhaoId);
    if (faz && (t?.fazenda || '') !== faz) return;
    const [mesNome, anoStr] = String(plano.mesAno || '').split('/');
    const mesIdx = MESES.indexOf(mesNome);
    const ano = parseInt(anoStr);
    if (mesIdx < 0 || !ano) return;
    (plano.aplicacoes || []).forEach(ap => {
      if (ap.feito) return;
      const semIdx = ordemSem(ap.semana);
      const dia = DIAS_SEMANA_ADUBACAO[semIdx >= 0 ? semIdx : 0];
      const data = `${ano}-${String(mesIdx + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      const prods = (ap.produtos || []).map(pr => pr.produto).filter(Boolean).join(', ');
      eventos.push({
        data,
        tipo: 'adubacao',
        icone: '🧪',
        label: 'Adubação',
        fazenda: t?.fazenda || '',
        talhaoNome: t?.nome || plano.talhaoId || '',
        descricao: [ap.fase, prods].filter(Boolean).join(' · ') || (ap.modo || ''),
        parcial: false
      });
    });
  });

  eventos.sort((a, b) => a.data.localeCompare(b.data) || (a.fazenda || '').localeCompare(b.fazenda || '', 'pt-BR') || (a.talhaoNome || '').localeCompare(b.talhaoNome || '', 'pt-BR'));

  const atrasados = eventos.filter(e => e.data < hj);
  const em7 = new Date(hj + 'T00:00:00');
  em7.setDate(em7.getDate() + 7);
  const dataLimite7 = em7.toISOString().slice(0, 10);
  const proximos = eventos.filter(e => e.data >= hj && e.data <= dataLimite7);
  const futuros = eventos.filter(e => e.data > dataLimite7);

  const atrasPulv = atrasados.filter(e => e.tipo === 'pulverizacao').length;
  const atrasDrench = atrasados.filter(e => e.tipo === 'drench').length;
  const atrasAdub = atrasados.filter(e => e.tipo === 'adubacao').length;

  let html = `<div class="kpi-grid">
    <div class="kpi-card ${atrasados.length > 0 ? 'danger' : ''}"><div class="kpi-label">Atrasadas</div><div class="kpi-value">${atrasados.length}</div><div class="kpi-aux">passaram da data prevista</div></div>
    <div class="kpi-card ${proximos.length > 0 ? 'alerta' : ''}"><div class="kpi-label">Próximos 7 dias</div><div class="kpi-value">${proximos.length}</div><div class="kpi-aux">a vencer</div></div>
    <div class="kpi-card info"><div class="kpi-label">Total pendentes</div><div class="kpi-value">${eventos.length}</div><div class="kpi-aux">${faz ? escHtml(faz) : 'todas as fazendas'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Atrasadas por tipo</div><div class="kpi-value" style="font-size:.95rem;">💧${atrasPulv} · 🌱${atrasDrench} · 🧪${atrasAdub}</div><div class="kpi-aux">pulv. · drench · adubação</div></div>
  </div>`;

  if (!eventos.length) {
    html += `<div class="vazio"><div class="ico">🗓️</div><p>Nenhuma pendência encontrada${faz ? ' para ' + escHtml(faz) : ''}.<br>Tudo em dia! ✅</p></div>`;
    cont.innerHTML = html;
    return;
  }

  const renderGrupoData = (lista) => {
    const porData = {};
    lista.forEach(e => { (porData[e.data] = porData[e.data] || []).push(e); });
    return Object.keys(porData).sort().map(data => `
      <div class="cal-data-grupo">
        <div class="cal-data-tit">${formatarData(data)}${data < hj ? ' · <span style="color:var(--danger);">atrasado</span>' : ''}</div>
        ${porData[data].map(e => `
          <div class="cal-evento">
            <div class="cal-evento-ico">${e.icone}</div>
            <div class="cal-evento-info">
              <div class="cal-evento-tit"><span class="faz-bullet" style="background:${corFazenda(e.fazenda)};"></span>${escHtml(e.talhaoNome)}${!faz && e.fazenda ? ' · ' + escHtml(e.fazenda) : ''}</div>
              <div class="cal-evento-desc">${e.label}${e.descricao ? ' — ' + escHtml(e.descricao) : ''}${e.parcial ? ' (parcial)' : ''}</div>
            </div>
          </div>`).join('')}
      </div>`).join('');
  };

  html += `<div class="secao secao-danger">
    <div class="secao-tit">🔴 Atrasadas <span style="font-weight:400;font-size:.75rem;color:var(--c);">(${atrasados.length})</span></div>
    ${atrasados.length ? renderGrupoData(atrasados) : '<div class="vazio-sm">Nenhuma pendência atrasada.</div>'}
  </div>`;

  html += `<div class="secao secao-alerta">
    <div class="secao-tit">🟡 Próximos 7 dias <span style="font-weight:400;font-size:.75rem;color:var(--c);">(${proximos.length})</span></div>
    ${proximos.length ? renderGrupoData(proximos) : '<div class="vazio-sm">Nada previsto para os próximos 7 dias.</div>'}
  </div>`;

  if (futuros.length) {
    html += `<div class="secao">
      <div class="secao-tit">📅 Mais adiante <span style="font-weight:400;font-size:.75rem;color:var(--c);">(${futuros.length})</span></div>
      ${renderGrupoData(futuros)}
    </div>`;
  }

  html += `<div class="secao" style="font-size:.78rem;color:var(--c);text-align:center;font-style:italic;">
    Pendências de pulverizações, drench preventivo e adubações ainda não confirmadas${faz ? ' · ' + escHtml(faz) : ''}
  </div>`;

  cont.innerHTML = html;
}

// ABA 9 — DRENCH PREVENTIVO
// ════════════════════════════════════════════════════
const METODO_DR_LABEL = {costal:'💪 Costal', turbina:'⚙️ Turbina', fertirrigacao:'💧 Fertirrigação'};

// Padroniza unidades para pedido: mL→L e g→kg (divide por 1000); demais ficam como estão.
function canonUnidadeDr(u){ const x=String(u||'').trim(); if(x==='mL'||x==='ml')return 'L'; if(x==='g')return 'kg'; return x||'un'; }
function canonValorDr(v,u){ if(v==null)return null; const x=String(u||'').trim(); return (x==='mL'||x==='ml'||x==='g') ? v/1000 : v; }

function parseDrEsp(esp) {
  if (!esp) return null;
  const nums = String(esp).match(/\d+[.,]?\d*/g);
  if (!nums || nums.length < 2) return null;
  const el = parseFloat(nums[0].replace(',','.')), ep = parseFloat(nums[1].replace(',','.'));
  if (!el || !ep) return null;
  return {el, ep};
}
function drDoseHa(p) {
  const v = parseFloat(String(p.valor??'').replace(',','.'));
  if (isNaN(v)) return null;
  return v; // modo 'ha' é o mais comum; planta/metro_linear requerem espacamento
}
function drTotalProduto(p, area, esp) {
  const v = parseFloat(String(p.valor??'').replace(',','.'));
  if (isNaN(v) || !area) return null;
  const parsed = parseDrEsp(esp);
  let doseHa = null;
  if (p.modo === 'ha') doseHa = v;
  else if (parsed) {
    const fP = (parsed.el * parsed.ep) / 10000;
    const fM = parsed.el / 10000;
    if (p.modo === 'planta') doseHa = v / fP;
    else if (p.modo === 'metro_linear') doseHa = v / fM;
  }
  return doseHa != null ? doseHa * parseFloat(String(area).replace(',','.')) : null;
}

function renderDrench() {
  const cont = document.getElementById('tabContent');
  // ── Filtros ──
  const fazendas = [...new Set(drenchPrevencao.map(d => d.fazenda || '—'))].sort((a,b) => a.localeCompare(b,'pt'));
  const fazOpts = `<option value="">Todas</option>` + fazendas.map(f => `<option value="${escHtml(f)}" ${drenchFiltroFazenda===f?'selected':''}>${escHtml(f)}</option>`).join('');

  // ── Aplicar filtros ──
  let lista = [...drenchPrevencao];
  if (drenchFiltroFazenda) lista = lista.filter(d => (d.fazenda||'—') === drenchFiltroFazenda);
  if (drenchFiltroStatus) lista = lista.filter(d => (d.status||'pendente') === drenchFiltroStatus);
  if (drenchFiltroDe) lista = lista.filter(d => (d.data||'') >= drenchFiltroDe);
  if (drenchFiltroAte) lista = lista.filter(d => (d.data||'') <= drenchFiltroAte);

  const pendentes = lista.filter(d => (d.status||'pendente') === 'pendente');
  const realizados = lista.filter(d => d.status === 'realizado');
  const talhoesUnicos = new Set(lista.map(d => d.talhaoId)).size;

  // ── Consolidar produtos necessários (soma total de todos pendentes) ──
  // key: "produto||unidade" → {produto, unidade, total, semArea, fazendas:Set, detalhes:Map<faz,{total,talhoes:Array<{nome,total}>}>}
  const totProd = new Map();
  for (const d of pendentes) {
    const t = talhoes.find(x => x.id === d.talhaoId);
    const area = parseFloat(String(t?.area||'').replace(',','.')) || 0;
    const esp = t?.espacamento;
    const fazNome = d.fazenda || '—';
    const talNome = d.talhaoNome || d.talhaoId || '—';
    for (const p of (d.produtos||[])) {
      if (!p.produto?.trim()) continue;
      const unidade = canonUnidadeDr(p.unidade);             // L ou kg padronizado
      const total = canonValorDr(drTotalProduto(p, area, esp), p.unidade);
      const key = `${p.produto.trim()}||${unidade}`;
      if (!totProd.has(key)) totProd.set(key, {produto:p.produto.trim(), unidade, total:0, semArea:0, fazendas:new Set(), detalhes:new Map()});
      const entry = totProd.get(key);
      if (total != null) entry.total += total;
      else entry.semArea++;
      entry.fazendas.add(fazNome);
      if (!entry.detalhes.has(fazNome)) entry.detalhes.set(fazNome, {total:0, talhoes:[]});
      const det = entry.detalhes.get(fazNome);
      if (total != null) det.total += total;
      det.talhoes.push({nome:talNome, total});
    }
  }

  // ── KPIs ──
  let html = `
  <div style="padding:10px 2px 4px;">
    <div class="filtros-bar" style="flex-wrap:wrap;gap:6px;">
      <div class="filtro-grupo">

      </div>
      <div class="filtro-grupo">
        <span class="filtro-label">📌</span>
        <select class="filtro-sel" onchange="setDrStatus(this.value)">
          <option value="pendente" ${drenchFiltroStatus==='pendente'?'selected':''}>Pendentes</option>
          <option value="realizado" ${drenchFiltroStatus==='realizado'?'selected':''}>Realizados</option>
          <option value="" ${drenchFiltroStatus===''?'selected':''}>Todos</option>
        </select>
      </div>
      <div class="filtro-grupo">
        <span class="filtro-label">De</span>
        <input type="date" class="filtro-sel" value="${drenchFiltroDe}" onchange="setDrDe(this.value)">

    <div class="kpi-grid" style="margin-top:10px;">
      <div class="kpi-card"><div class="kpi-label">Pendentes</div><div class="kpi-value">${pendentes.length}</div><div class="kpi-aux">agendamentos</div></div>
      <div class="kpi-card"><div class="kpi-label">Realizados</div><div class="kpi-value">${realizados.length}</div><div class="kpi-aux">no período</div></div>

  if (!lista.length) {

              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.08rem;color:var(--ve);">🧪 ${escHtml(r.produto)}</span>

            </div>

              const metodo = d.metodoAplicacao || 'costal';
              const volP   = parseFloat(String(d.volumePlanta??'').replace(',','.'));
              const volM   = parseFloat(String(d.volumeMetro??'').replace(',','.'));
              const v = parseFloat(String(p.valor??'').replace(',','.'));
              const doseHa = p.modo==='ha' ? v : (parsed ? (p.modo==='planta' ? v/((parsed.el*parsed.ep)/10000) : v/(parsed.el/10000)) : null);
              let chips = [], avisos = [];
              // /ha sempre
              chips.push({txt:`${isNaN(v)?'—':fmt(v,2)} ${p.unidade||''}/${p.modo==='ha'?'ha':p.modo==='planta'?'planta':'m linear'}${total!=null&&area?' → '+fmt(total,2)+' '+p.unidade+' total':''}`, d:false});
              if (metodo==='costal') {
                if (!isNaN(volP) && volP>0) {
                  const fP = parsed ? (parsed.el*parsed.ep)/10000 : null;
                  const dosePl = p.modo==='planta' ? v : (fP&&doseHa!=null ? doseHa*fP : null);
                  if (dosePl!=null) { const pb=20000/volP; chips.push({txt:`💪 ${fmt(dosePl,4)} ${p.unidade||''}/planta · ${fmt(dosePl*pb,2)} ${p.unidade||''}/bomba de 20L (${fmt(pb,0)} plantas)`,d:true}); }
                  else avisos.push('⚠️ Espaçamento não cadastrado — calcule a dose/planta manualmente');
                } else avisos.push('⚠️ Informe o volume/planta (ml) no agendamento');
              } else if (metodo==='turbina') {
                if (!isNaN(volM) && volM>0) {
                  if (parsed && doseHa!=null) {
                    const mPorHa=10000/parsed.el, aguaL=(volM*mPorHa)/1000;
                    chips.push({txt:`⚙️ ${fmt(doseHa/mPorHa,4)} ${p.unidade||''}/m · ${fmt(doseHa*2000/aguaL,2)} ${p.unidade||''} para 2000L (turbina)`,d:true});
                  } else avisos.push('⚠️ Espaçamento não cadastrado — calcule a dose/turbina manualmente');
                } else avisos.push('⚠️ Informe o volume/metro (ml) no agendamento');
              }
              return `<div style="font-size:.74rem;display:flex;flex-direction:column;gap:2px;">
                <strong>🧪 ${escHtml(p.produto.trim())}</strong>
                ${chips.map(c=>`<span style="padding:2px 8px;border-radius:5px;font-family:'DM Mono',monospace;${c.d?'background:#fef3c7;color:#92400e;border:1px solid #f59e0b;font-weight:800;':'background:var(--vb);color:var(--ve);font-weight:700;'}">${c.txt}</span>`).join('')}
                ${avisos.map(a=>`<span style="font-size:.68rem;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 6px;">${a}</span>`).join('')}
              </div>`;
            }).join('')}
          </div>
          ${st&&d.dataRealizado?`<div style="font-size:.7rem;color:var(--c);margin-top:4px;">✅ Realizado em ${formatarData(d.dataRealizado)}${d.realizadoPor?' · '+escHtml(d.realizadoPor):''}</div>`:''}
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  cont.innerHTML = html;
}

  const {label: lblPeriodo} = periodoFiltro();
  const faz = fazendaFiltro() || 'Todas as fazendas';
  const html = `<div style="font-family:Arial,sans-serif;max-width:780px;margin:0 auto;padding:24px;color:#111;">
    <div style="border-bottom:3px solid var(--v);padding-bottom:14px;margin-bottom:20px;">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--t4);margin-bottom:4px;">Conilon Tech · Relatório de Gestão</div>
      <div style="font-size:22px;font-weight:900;color:var(--ve);">${escHtml(labelTab)}</div>
      <div style="font-size:12px;color:#374151;margin-top:5px;">📅 ${escHtml(lblPeriodo)} · 🏡 ${escHtml(faz)}</div>
    </div>
    ${cont.innerHTML}
    <div style="margin-top:20px;font-size:10px;color:var(--t4);text-align:right;border-top:1px solid var(--bd-l);padding-top:10px;">
      Gerado em ${new Date().toLocaleString('pt-BR')} por ${escHtml(usuarioAtual.email)} · ConilonTech

window.exportarExcel = function() {
  const cont = document.getElementById('tabContent');
  const wb = XLSX.utils.book_new();
  const labelTab = {geral:'Geral',produtividade:'Produtividade',pulverizacoes:'Pulverizacoes',estoque:'Estoque',adubacao:'Adubacao',compras:'Compras',nutrientes:'Nutrientes',calendario:'Calendario'}[tabAtual] || tabAtual;
  const tables = cont.querySelectorAll('table');
  tables.forEach((tbl, i) => {
    const ws = XLSX.utils.table_to_sheet(tbl);
    const nome = (tables.length > 1 ? `Tabela_${i+1}` : labelTab).slice(0,31);
    XLSX.utils.book_append_sheet(wb, ws, nome);
  });
  if (!tables.length) {
    const secoes = cont.querySelectorAll('.secao');
    let idx = 1;
    secoes.forEach(sec => {
      const rankItems = sec.querySelectorAll('.rank-item');
      if (!rankItems.length) return;
      const titulo = (sec.querySelector('.secao-tit')?.textContent?.replace(/[^\w\s]/g,'').trim() || `Secao_${idx}`).slice(0,31);
      const rows = [['#','Nome','Info','Valor']];
      rankItems.forEach(item => rows.push([
        item.querySelector('.rank-num')?.textContent?.trim() || '',
        item.querySelector('.rank-nome')?.textContent?.trim() || '',
        item.querySelector('.rank-meta')?.textContent?.trim() || '',
        item.querySelector('.rank-valor')?.textContent?.trim() || ''
      ]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), titulo);
      idx++;
    });
  }
  if (!wb.SheetNames.length) { toast('⚠️ Nenhum dado exportável nesta aba.'); return; }
  XLSX.writeFile(wb, `ConilonTech_${labelTab}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('📊 Excel exportado!');
};
