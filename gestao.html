<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conilon Tech · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--v:#1a5c1a;--ve:#0b1c0d;--vb:#e2f0e2;--c:#5a6b48;--cb:#c6c0b0;--cl:#f0ece3;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--blue:#3b82f6;--purple:#a855f7;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;display:flex;flex-direction:column;}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--v);font-size:1.1rem;letter-spacing:.04em;}

/* HEADER & MENU */
.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:200;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-titles{line-height:1;}
.header-title-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;}
.header-title-sub{font-size:.65rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.header-user{font-size:.78rem;color:rgba(255,255,255,.85);}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-header{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-user-nome{color:white;font-weight:700;font-size:.95rem;}
.menu-user-email{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:2px;}
.menu-body{flex:1;padding:10px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:1.1rem;}
.menu-footer{padding:14px;}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

/* APP STRUCTURE */
.app-main{display:flex;flex-direction:column;}

/* FILTROS GLOBAIS */
.filtros-bar{background:white;border-bottom:2px solid var(--cb);padding:9px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;position:sticky;top:54px;z-index:199;}
.filtro-grupo{display:flex;align-items:center;gap:6px;}
.filtro-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;text-transform:uppercase;color:var(--c);letter-spacing:.05em;}
.filtro-sel{border:1.5px solid var(--cb);border-radius:7px;padding:7px 9px;font-size:.85rem;font-family:'Barlow',sans-serif;outline:none;background:white;font-weight:600;color:var(--ve);min-width:110px;}
.filtro-sel:focus{border-color:var(--v);}
.btn-pdf-aba{margin-left:auto;background:var(--v);color:white;border:none;border-radius:6px;padding:7px 11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.75rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;}
.btn-pdf-aba:active{transform:scale(.97);}

/* TABS */
.tabs-bar{display:flex;background:white;border-bottom:2px solid var(--cb);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:100px;z-index:198;}
.tab{flex:1;min-width:90px;padding:12px 8px;border:none;background:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap;}
.tab.ativa{color:var(--v);border-bottom-color:var(--v);}

/* CONTEÚDO */
.tab-content{padding:12px 14px 60px;display:flex;flex-direction:column;gap:12px;}

/* BANNER AVISO */
.banner-aviso{background:#fffbeb;border:1.5px solid #fde68a;border-left:4px solid var(--warn);border-radius:var(--rs);padding:10px 12px;font-size:.78rem;color:#92400e;line-height:1.45;}
.banner-aviso strong{display:block;margin-bottom:3px;font-family:'Barlow Condensed',sans-serif;font-size:.88rem;letter-spacing:.02em;}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
@media(min-width:700px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi-card{background:white;border-radius:var(--rad);padding:12px 14px;box-shadow:var(--s);display:flex;flex-direction:column;gap:3px;}
.kpi-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c);}
.kpi-value{font-family:'DM Mono',monospace;font-weight:700;font-size:1.45rem;color:var(--ve);line-height:1.1;}
.kpi-aux{font-size:.7rem;color:var(--c);margin-top:2px;}
.kpi-card.alerta .kpi-value{color:var(--warn);}
.kpi-card.danger .kpi-value{color:var(--danger);}
.kpi-card.ok .kpi-value{color:var(--ok);}
.kpi-card.info .kpi-value{color:var(--blue);}
.kpi-card.clk{cursor:pointer;position:relative;transition:transform .1s ease,box-shadow .15s ease;}
.kpi-card.clk:hover{box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-1px);}
.kpi-card.clk:active{transform:scale(.98);}
.kpi-card.clk::after{content:'›';position:absolute;top:9px;right:12px;color:#cbd5e1;font-size:1.1rem;font-weight:700;line-height:1;}

/* AÇÕES PENDENTES */
.acao-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fffdf5;border:1px solid #fde68a;border-radius:9px;padding:10px 12px;cursor:pointer;font-family:'Barlow',sans-serif;transition:background .12s;}
.acao-row:hover{background:#fef9e7;}
.acao-row.danger{background:#fef2f2;border-color:#fecaca;}
.acao-ico{font-size:1.1rem;flex-shrink:0;}
.acao-txt{flex:1;font-size:.82rem;color:#374151;}
.acao-txt strong{color:var(--ve);font-family:'DM Mono',monospace;}
.acao-chev{color:var(--c);font-size:1.25rem;font-weight:700;line-height:1;}

/* SEÇÃO */
.secao{background:white;border-radius:var(--rad);padding:14px;box-shadow:var(--s);}
.secao-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);margin-bottom:10px;display:flex;align-items:center;gap:7px;padding-bottom:8px;border-bottom:1px solid var(--cl);}
.secao-sub{font-size:.74rem;color:var(--c);margin-bottom:9px;line-height:1.4;}
.praga-lista{display:flex;flex-direction:column;gap:10px;}
.praga-card{background:var(--cl);border-radius:10px;padding:12px 14px;border-left:4px solid #7c3aed;}
.praga-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.praga-nome{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;}
.praga-badge{font-size:.7rem;font-weight:700;border:1.5px solid;border-radius:20px;padding:2px 9px;white-space:nowrap;flex-shrink:0;}
.praga-stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
.praga-stat{display:flex;flex-direction:column;align-items:center;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--c);font-weight:600;}
.praga-n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.25rem;color:var(--ve);line-height:1;}
.praga-prods{display:flex;flex-wrap:wrap;gap:5px;}
.praga-prod-chip{background:white;border:1px solid var(--cb);border-radius:20px;padding:3px 9px;font-size:.7rem;font-weight:600;color:#6b21a8;}
/* Detalhe do mapa de pulverizações: histórico por talhão */
.pulv-hist{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.pulv-hist-item{display:flex;gap:11px;background:#f8fafc;border:1px solid var(--cb);border-left:3px solid #2563eb;border-radius:9px;padding:9px 11px;}
.phi-data{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700;color:#1e40af;white-space:nowrap;flex-shrink:0;padding-top:1px;}
.phi-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.phi-linha{display:flex;flex-wrap:wrap;gap:5px;}
.phi-modo{font-size:.72rem;color:var(--c);}
.phi-obs{font-size:.74rem;color:var(--ts);font-style:italic;}

/* LISTAS RANKING */
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cl);}
.rank-item:last-child{border-bottom:none;}
.rank-num{width:24px;height:24px;border-radius:50%;background:var(--vb);color:var(--v);font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Mono',monospace;}
.rank-num.top{background:var(--v);color:white;}
.rank-info{flex:1;min-width:0;}
.rank-nome{font-weight:700;font-size:.88rem;color:var(--t);}
.rank-meta{font-size:.7rem;color:var(--c);margin-top:1px;}
.rank-valor{font-family:'DM Mono',monospace;font-weight:700;font-size:.95rem;color:var(--ve);text-align:right;flex-shrink:0;}
.rank-valor .rank-und{font-size:.65rem;color:var(--c);font-weight:500;}

/* BARRAS HORIZONTAIS (gráfico simples) */
.bar-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
.bar-label{font-size:.78rem;color:var(--t);min-width:80px;font-weight:600;}
.bar-track{flex:1;background:var(--cl);border-radius:4px;height:18px;position:relative;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(to right,var(--v),#5a9c5a);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:white;font-family:'DM Mono',monospace;font-size:.7rem;font-weight:700;min-width:30px;}
.bar-value{font-family:'DM Mono',monospace;font-size:.74rem;color:var(--c);min-width:60px;text-align:right;}

/* GRÁFICO DE BARRAS VERTICAIS (12 meses) */
.chart-mensal{display:flex;align-items:flex-end;gap:4px;height:140px;padding:5px 2px 28px;border-bottom:1.5px solid var(--cb);position:relative;}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;}
.chart-bar{width:100%;max-width:36px;background:linear-gradient(to top,var(--v),#5a9c5a);border-radius:3px 3px 0 0;min-height:2px;position:relative;transition:opacity .2s;}
.chart-bar:hover{opacity:.85;}
.chart-bar-val{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:.62rem;color:var(--ve);font-weight:700;white-space:nowrap;}
.chart-bar-lab{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap;}

/* PIZZA (distribuição) */
.pizza-wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.pizza-svg{width:120px;height:120px;flex-shrink:0;}
.pizza-leg{flex:1;display:flex;flex-direction:column;gap:5px;min-width:140px;}
.pizza-leg-item{display:flex;align-items:center;gap:7px;font-size:.78rem;}
.pizza-leg-cor{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.pizza-leg-lab{flex:1;color:var(--t);font-weight:600;}
.pizza-leg-val{font-family:'DM Mono',monospace;color:var(--c);font-weight:700;font-size:.75rem;}

/* COMPARATIVO 2 COLUNAS */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.comp-box{background:var(--cl);border-radius:var(--rs);padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
.comp-box.alt{background:var(--vb);}
.comp-lab{font-size:.66rem;color:var(--c);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.comp-val{font-family:'DM Mono',monospace;font-weight:700;font-size:1.1rem;color:var(--ve);}

/* VAZIO */
.vazio-sm{text-align:center;color:var(--c);padding:18px 12px;font-size:.82rem;font-style:italic;}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;color:var(--c);}
.vazio .ico{font-size:3rem;margin-bottom:10px;opacity:.5;}
.vazio p{font-size:.9rem;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ve);color:white;padding:11px 20px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* IMPRESSAO */
#area-impressao{display:none;}
@media print{body>*:not(#area-impressao){display:none!important;}#area-impressao{display:block!important;}}

/* TABELA simples */
.tbl{width:100%;border-collapse:collapse;font-size:.8rem;}
.tbl th{background:var(--cl);text-align:left;padding:7px 9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:1px solid var(--cb);}
.tbl th.num{text-align:right;}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--cl);}
.tbl td.num{font-family:'DM Mono',monospace;text-align:right;font-weight:600;white-space:nowrap;}
.tbl tr:last-child td{border-bottom:none;}
/* Variante "tbl-resumo" com bordas verticais e zebra (pro Resumo por fazenda etc) */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;border:1px solid var(--cb);}
.tbl-resumo{font-size:.82rem;}
.tbl-resumo th{background:var(--vb);color:var(--ve);padding:9px 11px;border-bottom:2px solid var(--v);border-right:1px solid var(--cb);}
.tbl-resumo th:last-child{border-right:none;}
.tbl-resumo td{padding:9px 11px;border-right:1px solid var(--cl);border-bottom:1px solid var(--cl);}
.tbl-resumo td:last-child{border-right:none;}
.tbl-resumo tbody tr:nth-child(even){background:var(--surface-2);}
.tbl-resumo tbody tr:hover{background:var(--vb);}
/* Bolinha colorida indicando fazenda */
.faz-bullet{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0;}

/* CALENDÁRIO (aba de pendências) */
.cal-data-grupo{margin-bottom:10px;}
.cal-data-grupo:last-child{margin-bottom:0;}
.cal-data-tit{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);padding:6px 0 4px;border-bottom:1px solid var(--cl);margin-bottom:6px;}
.cal-evento{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--cl);}
.cal-evento:last-child{border-bottom:none;}
.cal-evento-ico{font-size:1.2rem;flex-shrink:0;line-height:1.3;}
.cal-evento-info{flex:1;min-width:0;}
.cal-evento-tit{font-weight:700;font-size:.86rem;color:var(--t);display:flex;align-items:center;}
.cal-evento-desc{font-size:.75rem;color:var(--c);margin-top:2px;}

/* Seções de alerta e danger */
.secao.secao-alerta{border-left:4px solid var(--warn);background:#fffbeb;}
.secao.secao-danger{border-left:4px solid var(--danger);background:#fef2f2;}
.lista-prods-zerados{display:flex;flex-direction:column;gap:6px;}
.prod-zerado-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:white;border-radius:6px;border:1px solid var(--cl);}
.prod-zerado-info{flex:1;min-width:0;}
.prod-zerado-nome{font-weight:700;font-size:.88rem;color:var(--t);}
.prod-zerado-meta{font-size:.7rem;color:var(--c);margin-top:1px;}
.prod-zerado-und{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--c);font-weight:700;flex-shrink:0;}
/* Nutrientes: abas de visualização + gráficos + mapa */
.nutri-views{display:flex;gap:6px;background:var(--cl);border-radius:10px;padding:4px;}
.nutri-view-btn{background:transparent;border:none;border-radius:8px;padding:7px 13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--c);}
.nutri-view-btn.on{background:white;color:var(--v);box-shadow:var(--s);}
.chart-box{position:relative;height:230px;background:white;border:1px solid var(--cl);border-radius:12px;padding:12px;}
.nutri-legenda{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.95);border-radius:9px;padding:8px 11px;box-shadow:var(--sf);z-index:500;font-size:.66rem;pointer-events:none;}
.nl-tit{font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c);font-weight:700;margin-bottom:4px;}
.nl-bar{width:120px;height:9px;border-radius:4px;background:linear-gradient(90deg,#fef08a,#166534);}
.nl-esc{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;color:var(--ts);margin-top:2px;}
.nl-row{display:flex;align-items:center;gap:5px;margin-top:4px;color:var(--ts);}
.nl-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.leaflet-container{font:inherit;}
/* Barras comparativas Aplicado × Previsto × Safra */
.nut-bars{display:flex;flex-direction:column;gap:14px;}
.nut-bar-row{background:white;border:1px solid var(--cl);border-radius:12px;padding:11px 13px;}
.nut-bar-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap;}
.nut-bar-nome{font-weight:700;font-size:.9rem;color:var(--ve);display:flex;align-items:center;gap:6px;}
.nb-dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0;}
.nb-pct{font-size:.66rem;font-weight:600;color:var(--c);background:var(--cl);border-radius:10px;padding:1px 8px;}
.nut-selo{font-size:.68rem;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap;}
.nut-selo.ok{background:#dcfce7;color:#166534;}
.nut-selo.atr{background:#fef3c7;color:#92400e;}
.nut-selo.neu{background:var(--cl);color:var(--c);}
.nut-bar-track{position:relative;height:16px;background:#eef1ea;border-radius:9px;overflow:hidden;}
.nut-bar-feito{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .4s cubic-bezier(.34,1.1,.64,1);min-width:2px;}
.nut-bar-marca{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ve);border-radius:2px;box-shadow:0 0 0 1.5px white;}
.nut-bar-marca::after{content:'▲';position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:.6rem;color:var(--ve);}
.nut-bar-labels{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:.72rem;color:var(--ts);flex-wrap:wrap;}
.nut-bar-labels b{color:var(--ve);font-family:'DM Mono',monospace;}
.nl-feito{color:var(--v);} .nl-hoje{color:#92400e;} .nl-safra{color:var(--c);}
</style>

  // Fallback: se for admin global em qualquer módulo, libera

}

// ─── UTILS ───
function escHtml(s){return String(s||'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n,d){const v=Number(n)||0;return v.toLocaleString('pt-BR',{minimumFractionDigits:d!==undefined?d:0,maximumFractionDigits:d!==undefined?d:2});}
function fmtRS(n){return 'R$ '+fmt(n,2);}
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return `${dd}/${m}/${a}`;}
function parseDose(s){if(s==null||s==='')return 0;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?0:n;}
function parseValorProducao(v){
  // O valor da produção é texto livre ("200", "200 sc", "200 sacas"...). Extrai o primeiro número.
  if(!v)return 0;
  const s=String(v).replace(',','.');
  const m=s.match(/([\d.]+)/);
  return m?parseFloat(m[1]):0;
}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function hoje(){return new Date().toISOString().slice(0,10);}

// Calcula intervalo do filtro de período
function periodoFiltro() {
  const sel = document.getElementById('selPeriodo')?.value || '3meses';
  const hoje = new Date();
  const fim = hoje.toISOString().slice(0,10);
  let inicio;
  if (sel === 'mes_atual') {
    inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().slice(0,10);
  } else if (sel === 'mes_passado') {
    inicio = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1).toISOString().slice(0,10);
    const fimMes = new Date(hoje.getFullYear(), hoje.getMonth(), 0).toISOString().slice(0,10);
    return {inicio, fim: fimMes, label: 'Mês passado'};
  } else if (sel === '3meses') {
    inicio = new Date(hoje.getFullYear(), hoje.getMonth()-3, hoje.getDate()).toISOString().slice(0,10);
  } else if (sel === '6meses') {
    inicio = new Date(hoje.getFullYear(), hoje.getMonth()-6, hoje.getDate()).toISOString().slice(0,10);
  } else if (sel === '12meses') {
    inicio = new Date(hoje.getFullYear(), hoje.getMonth()-12, hoje.getDate()).toISOString().slice(0,10);
  } else if (sel === 'ano_atual') {
    inicio = `${hoje.getFullYear()}-01-01`;
  } else { // tudo
    inicio = '2000-01-01';
  }
  const labels = {mes_atual:'Este mês', '3meses':'Últimos 3 meses', '6meses':'Últimos 6 meses', '12meses':'Últimos 12 meses', ano_atual:'Este ano', tudo:'Todo o período'};
  return {inicio, fim, label: labels[sel] || sel};
}

function fazendaFiltro() {
  return document.getElementById('selFazenda')?.value || '';
}

// Aplica filtros: retorna talhões/pulverizações/etc dentro dos filtros atuais
function talhoesFiltrados() {
  const faz = fazendaFiltro();
  return faz ? talhoes.filter(t => t.fazenda === faz) : talhoes;
}
function pulverizacoesFiltradas() {
  const faz = fazendaFiltro();
  const {inicio, fim} = periodoFiltro();
  return pulverizacoes.filter(p => {
    if (faz && p.fazenda !== faz) return false;
    const dt = p.dataRealizada || p.data;
    if (!dt) return false;
    return dt >= inicio && dt <= fim;
  });
}
function movimentacoesFiltradas() {
  const faz = fazendaFiltro();
  const {inicio, fim} = periodoFiltro();
  return movimentacoes.filter(m => {
    if (faz && m.fazenda !== faz) return false;
    const dt = m.data || m.criadoEm?.slice(0,10);
    if (!dt) return false;
    return dt >= inicio && dt <= fim;
  });
}
function pedidosFiltrados() {
  const faz = fazendaFiltro();
  const {inicio, fim} = periodoFiltro();
  return pedidos.filter(p => {
    const dt = (p.criadoEm||'').slice(0,10);
    if (dt && (dt < inicio || dt > fim)) return false;
    if (faz) {
      const ehDaFaz = (p.itens||[]).some(it => (it.talhoes||[]).some(t => t.fazenda === faz));
      if (!ehDaFaz) return false;
    }
    return true;
  });
}

// Mapa de produto → categoria (pra cruzar com movimentações)
function getCategoriaProduto(produtoId) {
  const p = produtosEstoque.find(x => x._docId === produtoId);
  return {categoria: p?.categoria || null, subcategoria: p?.subcategoria || null, nome: p?.nome || ''};
}

// Preço médio ponderado de um produto, calculado a partir das entradas no histórico
// Considera apenas entradas até a data limite (default: hoje).
// Retorna 0 se não há preço cadastrado em nenhuma entrada.
function precoMedioProduto(produtoId, dataLimite) {
  const limite = dataLimite || hoje();
  const entradas = movimentacoes.filter(m =>
    m.produtoId === produtoId &&
    m.tipo === 'entrada' &&
    (m.precoUnitario || 0) > 0 &&
    (m.data || m.criadoEm?.slice(0,10) || '') <= limite
  );
  if (!entradas.length) return 0;
  let totalQtd = 0, totalValor = 0;
  entradas.forEach(e => {
    const qtd = Number(e.quantidade)||0;
    const pu = Number(e.precoUnitario)||0;
    totalQtd += qtd;
    totalValor += qtd * pu;
  });
  return totalQtd > 0 ? totalValor / totalQtd : 0;
}

// ─── TABS ───
window.abrirTab = function(t) {
  tabAtual = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('ativa'));
  const map = {geral:'tabGeral', produtividade:'tabProdutividade', pulverizacoes:'tabPulverizacoes', estoque:'tabEstoque', adubacao:'tabAdubacao', compras:'tabCompras', nutrientes:'tabNutrientes', calendario:'tabCalendario', drench:'tabDrench'};
  document.getElementById(map[t])?.classList.add('ativa');
  renderTab();
};
window.aplicarFiltros = () => renderTab();

function renderTab() {
  // Só renderiza quando os dados base já carregaram
  if (!_carregados.talhoes) return;
  const cont = document.getElementById('tabContent');
  if (!cont) return;
  try {
    if (tabAtual === 'geral') renderGeral();
    else if (tabAtual === 'produtividade') renderProdutividade();
    else if (tabAtual === 'pulverizacoes') renderPulverizacoes();
    else if (tabAtual === 'estoque') renderEstoque();
    else if (tabAtual === 'adubacao') renderAdubacao();
    else if (tabAtual === 'compras') renderCompras();
    else if (tabAtual === 'nutrientes') renderNutrientes();
    else if (tabAtual === 'calendario') renderCalendario();
    else if (tabAtual === 'drench') renderDrench();
  } catch(e) {
    console.error(e);
    cont.innerHTML = `<div class="vazio"><div class="ico">⚠️</div><p>Erro ao renderizar relatório: ${escHtml(e.message)}</p></div>`;
  }
}

// Helpers do Geral
function filtrarPlanos() {
  const faz = fazendaFiltro();
  const {inicio, fim} = periodoFiltro();
  return planosAdubacao.filter(plano => {
    // plano tem talhaoId e mesAno (YYYY-MM)
    if (faz) {
      const t = talhoes.find(x => x.id === plano.talhaoId);
      if (!t || t.fazenda !== faz) return false;
    }
    if (!plano.mesAno) return false;
    const mesAno = plano.mesAno + '-15'; // meio do mês pra comparar
    return mesAno >= inicio && mesAno <= fim;
  });
}

// Conta ha adubado: cada plano que tem alguma aplicação confirmada do mês
function calcHaAdubado(planos) {
  let ha = 0;
  planos.forEach(plano => {
    // Verifica se há aplicação confirmada (estrutura: aplicacoes = {sem1:true, sem2:true, ...} ou similar)
    const temAplic = plano.aplicacoes && Object.values(plano.aplicacoes).some(v => v === true || (typeof v === 'object' && v?.feito));
    if (temAplic) {
      const t = talhoes.find(x => x.id === plano.talhaoId);
      ha += parseDose(t?.area);
    }
  });
  return ha;
}

function calcAdubacoesAtrasadas() {
  const faz = fazendaFiltro();
  const hojeStr = hoje().slice(0,7); // YYYY-MM
  let count = 0;
  planosAdubacao.forEach(plano => {
    if (!plano.mesAno || plano.mesAno >= hojeStr) return; // não atrasado
    if (faz) {
      const t = talhoes.find(x => x.id === plano.talhaoId);
      if (!t || t.fazenda !== faz) return;
    }
    // Sem aplicação confirmada = atrasado
    const temAplic = plano.aplicacoes && Object.values(plano.aplicacoes).some(v => v === true || (typeof v === 'object' && v?.feito));
    if (!temAplic) count++;
  });
  return count;
}

// Calcula produção de um talhão na safra mais recente.
// O "valor" cadastrado é interpretado como sc/ha.
// Retorna { scHa, total, area, safra }.
function calcProducaoTalhao(t) {
  const area = parseDose(t.area);
  if (!t.historico || !t.historico.length || area <= 0) return {scHa:0, total:0, area, safra:''};
  const ord = [...t.historico].sort((a,b)=>(b.safra||'').localeCompare(a.safra||''));
  const scHa = parseValorProducao(ord[0].valor);
  return {scHa, total: scHa * area, area, safra: ord[0].safra || ''};
}

// Retorna a soma da produção TOTAL (sacas) de uma lista de talhões na safra mais recente.
// Cada talhão: sc/ha cadastrado × área = sacas totais.
function calcProducaoTotalSafraAtual(talhList) {
  let total = 0;
  talhList.forEach(t => { total += calcProducaoTalhao(t).total; });
  return total;
}

// Retorna a média ponderada (sc/ha) de uma lista de talhões na safra mais recente.
// Só considera talhões com produção > 0 (pra não distorcer com talhões em reforma).
function calcProducaoMediaScHa(talhList) {
  let prodTot = 0, areaTot = 0;
  talhList.forEach(t => {
    const p = calcProducaoTalhao(t);
    if (p.scHa > 0 && p.area > 0) {
      prodTot += p.total;
      areaTot += p.area;
    }
  });
  return areaTot > 0 ? prodTot / areaTot : 0;
}

function calcGastoPorCategoria(movs, cat) {
  // Soma o precoTotal das entradas cujo produto pertence à categoria
  let total = 0;
  movs.forEach(m => {
    if (m.tipo !== 'entrada' || !m.precoTotal) return;
    const cp = getCategoriaProduto(m.produtoId);
    if (cp.categoria === cat) total += Number(m.precoTotal)||0;
  });
  return total;
}

// ABA 2 — PRODUTIVIDADE
// ════════════════════════════════════════════════════
function renderProdutividade() {
  const cont = document.getElementById('tabContent');
  const faz = fazendaFiltro();
  const talhFil = talhoesFiltrados();
  let html = '';
  // Verificar quantos talhões têm produção
  const comProducao = talhFil.filter(t => t.historico && t.historico.length && parseValorProducao(t.historico[t.historico.length-1]?.valor) > 0);
  if (!comProducao.length) {
    html += `<div class="banner-aviso">
      <strong>📊 Sem dados de produção</strong>
      Cadastre o histórico de produtividade dos talhões (Mapa → editar talhão → adicionar safra com resultado).
    </div>`;
  }
  // Calcular dados de produtividade
  // IMPORTANTE: o "valor" cadastrado no histórico do talhão É sc/ha (produtividade)
  // Total em sacas = sc/ha × área
  const dadosProd = talhFil.map(t => {
    const area = parseDose(t.area);
    let prodHa = 0, safra = '';
    if (t.historico && t.historico.length) {
      const ord = [...t.historico].sort((a,b)=>(b.safra||'').localeCompare(a.safra||''));
      prodHa = parseValorProducao(ord[0].valor);
      safra = ord[0].safra || '—';
    }
    const producao = prodHa * area;  // total em sacas
    return {
      _docId: t._docId,
      id: t.id,
      nome: t.nome,
      fazenda: t.fazenda,
      area, producao, prodHa, safra,
      status: t.status,
      historico: t.historico || []
    };
  }).filter(d => d.prodHa > 0);
  // KPIs de produtividade
  const producaoTotal = dadosProd.reduce((s,d)=>s+d.producao, 0);
  const areaProdutiva = dadosProd.reduce((s,d)=>s+d.area, 0);
  const mediaSchPorHa = areaProdutiva > 0 ? producaoTotal / areaProdutiva : 0;
  // Talhões em reforma vs ativos
  const ativos = talhFil.filter(t => t.status === 'ativo');
  const reforma = talhFil.filter(t => t.status === 'reforma');
  const colhido = talhFil.filter(t => t.status === 'colhido');
  const areaAtiva = ativos.reduce((s,t)=>s+parseDose(t.area), 0);
  const areaReforma = reforma.reduce((s,t)=>s+parseDose(t.area), 0);
  const areaColhido = colhido.reduce((s,t)=>s+parseDose(t.area), 0);
  const areaTot = areaAtiva + areaReforma + areaColhido;
  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Produção total</div><div class="kpi-value">${fmt(producaoTotal,0)}</div><div class="kpi-aux">sacas (safra mais recente)</div></div>
    <div class="kpi-card ok"><div class="kpi-label">Produtividade média</div><div class="kpi-value">${fmt(mediaSchPorHa,1)}</div><div class="kpi-aux">sc/ha · base ${fmt(areaProdutiva,1)} ha</div></div>
    <div class="kpi-card"><div class="kpi-label">Talhões produtivos</div><div class="kpi-value">${dadosProd.length}</div><div class="kpi-aux">de ${talhFil.length} cadastrados</div></div>
    <div class="kpi-card ${reforma.length>0?'alerta':''}"><div class="kpi-label">Em reforma</div><div class="kpi-value">${reforma.length}</div><div class="kpi-aux">${fmt(areaReforma,1)} ha</div></div>
  </div>`;
  // Status da lavoura (área)
  if (areaTot > 0) {
    html += `<div class="secao">
      <div class="secao-tit">📐 Status da lavoura por área</div>
      <div class="comp-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="comp-box alt"><div class="comp-lab">Ativos</div><div class="comp-val">${fmt(areaAtiva,1)} ha</div><div style="font-size:.7rem;color:var(--c);">${fmt(areaAtiva/areaTot*100,1)}%</div></div>
        <div class="comp-box"><div class="comp-lab">Em reforma</div><div class="comp-val">${fmt(areaReforma,1)} ha</div><div style="font-size:.7rem;color:var(--c);">${fmt(areaTot>0?areaReforma/areaTot*100:0,1)}%</div></div>
        <div class="comp-box"><div class="comp-lab">Colhido</div><div class="comp-val">${fmt(areaColhido,1)} ha</div><div style="font-size:.7rem;color:var(--c);">${fmt(areaTot>0?areaColhido/areaTot*100:0,1)}%</div></div>
      </div>
    </div>`;
  }
  // Ranking de talhões mais produtivos
  if (dadosProd.length > 0) {
    const ranked = [...dadosProd].sort((a,b)=>b.prodHa-a.prodHa);
    html += `<div class="secao">
      <div class="secao-tit">🏆 Ranking de produtividade (sc/ha)</div>
      <div class="secao-sub">Ordenado pela produtividade da safra mais recente</div>
      ${ranked.slice(0,15).map((d,i) => `<div class="rank-item">
        <div class="rank-num ${i<3?'top':''}">${i+1}</div>
        <div class="rank-info">
          <div class="rank-nome">${escHtml(d.id||'')} · ${escHtml(d.nome||'')}</div>
          <div class="rank-meta"><span class="faz-bullet" style="background:${corFazenda(d.fazenda)};"></span>${escHtml(d.fazenda||'—')} · ${fmt(d.area,1)} ha · ${escHtml(d.safra)}</div>
        </div>
        <div class="rank-valor">${fmt(d.prodHa,1)}<div class="rank-und">sc/ha</div></div>
      </div>`).join('')}
    </div>`;
    // Comparativo entre fazendas
    if (!faz && fazendas.length > 1) {
      const porFaz = {};
      dadosProd.forEach(d => {
        const k = d.fazenda || 'Sem fazenda';
        if (!porFaz[k]) porFaz[k] = {area:0, prod:0};
        porFaz[k].area += d.area;
        porFaz[k].prod += d.producao;
      });
      const fazRank = Object.entries(porFaz).map(([f,v]) => ({
        fazenda:f, area:v.area, producao:v.prod, prodHa: v.area>0?v.prod/v.area:0
      })).sort((a,b)=>b.prodHa-a.prodHa);
      const maxProdHa = Math.max(...fazRank.map(f=>f.prodHa), 1);
      html += `<div class="secao">
        <div class="secao-tit">🏡 Produtividade por fazenda</div>
        ${fazRank.map(f => {
          const cor = corFazenda(f.fazenda);
          return `<div class="bar-row">
            <div class="bar-label"><span class="faz-bullet" style="background:${cor};"></span>${escHtml(f.fazenda)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.max(8, f.prodHa/maxProdHa*100)}%;background:${cor};">${fmt(f.prodHa,1)}</div></div>
            <div class="bar-value">${fmt(f.producao,0)} sc</div>
          </div>`;
        }).join('')}
      </div>`;
    }
    // Evolução por safra (se há talhão com mais de uma safra)
    const safrasUnique = [...new Set(talhFil.flatMap(t => (t.historico||[]).map(h => h.safra).filter(Boolean)))].sort();
    if (safrasUnique.length > 1) {
      // Pra cada safra, soma produção total (sc/ha × área) e área dos talhões que tinham aquela safra
      const evolu = safrasUnique.map(s => {
        let prodTot = 0, areaTot = 0;
        talhFil.forEach(t => {
          const h = (t.historico||[]).find(x => x.safra === s);
          if (h) {
            const scHa = parseValorProducao(h.valor);
            const area = parseDose(t.area);
            if (scHa > 0 && area > 0) {
              prodTot += scHa * area;
              areaTot += area;
            }
          }
        });
        return {safra:s, prodTot, areaTot, prodHa: areaTot>0?prodTot/areaTot:0};
      }).filter(s => s.prodTot > 0);
      if (evolu.length > 1) {
        const maxProdHa = Math.max(...evolu.map(e=>e.prodHa), 1);
        html += `<div class="secao">
          <div class="secao-tit">📈 Evolução por safra (sc/ha médio)</div>
          <div class="chart-mensal">
            ${evolu.map(e => `<div class="chart-bar-wrap">
              <div class="chart-bar-val">${fmt(e.prodHa,1)}</div>
              <div class="chart-bar" style="height:${Math.max(2, e.prodHa/maxProdHa*100)}%;"></div>
              <div class="chart-bar-lab">${escHtml(e.safra)}</div>
            </div>`).join('')}
          </div>
        </div>`;
      }
    }
  }
  cont.innerHTML = html;
}

// ════════════════════════════════════════════════════
// ABA 3 — PULVERIZAÇÕES
// ════════════════════════════════════════════════════
// pragaAlvo pode ser string (legado) ou array (novo)
function getPragasPulv(p) {
  const a = p?.pragaAlvo;
  if (Array.isArray(a)) return a.filter(Boolean);
  if (a && a.trim()) return [a.trim()];
  return [];
}

window.setPulvFiltroTalhao = function(v) { pulvFiltroTalhao = v; renderTab(); };
window.setPulvFiltroPraga  = function(v) { pulvFiltroPraga  = v; renderTab(); };
window.setPulvView         = function(v) { pulvView = v; renderTab(); };
window.setAdubView         = function(v) { adubView = v; renderTab(); };

function renderPulverizacoes() {
  const cont = document.getElementById('tabContent');
  if (_pulvMap) { try { _pulvMap.remove(); } catch(e){} _pulvMap = null; }
  const faz = fazendaFiltro();
  const pulvTodas = pulverizacoesFiltradas().filter(p => p.realizada);

  // Talhões e pragas disponíveis para os selects internos
  const talhoesPulv = [...new Map(pulvTodas.map(p => [p.talhaoId, {id:p.talhaoId, nome:p.talhaoNome, fazenda:p.fazenda}])).values()]
    .sort((a,b) => (a.nome||'').localeCompare(b.nome||'','pt-BR'));
  const pragasPulv = [...new Set(pulvTodas.flatMap(p => getPragasPulv(p)))].sort((a,b) => a.localeCompare(b,'pt-BR'));

  // Limpa filtros obsoletos
  if (pulvFiltroTalhao && !talhoesPulv.some(t => t.id === pulvFiltroTalhao)) pulvFiltroTalhao = '';
  if (pulvFiltroPraga  && !pragasPulv.includes(pulvFiltroPraga))              pulvFiltroPraga  = '';

  // Aplica filtros internos
  const pulvFil = pulvTodas
    .filter(p => !pulvFiltroTalhao || p.talhaoId === pulvFiltroTalhao)
    .filter(p => !pulvFiltroPraga  || getPragasPulv(p).includes(pulvFiltroPraga));
  const talhFil = talhoesFiltrados();
  // Barra de filtros internos
  const barraFiltros = (talhoesPulv.length > 1 || pragasPulv.length > 0) ? `<div class="secao" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;">
    ${talhoesPulv.length > 1 ? `<div class="filtro-grupo">
      <span class="filtro-label">🌱 Talhão</span>
      <select class="filtro-sel" id="selPulvTalhao" onchange="window.setPulvFiltroTalhao(this.value)">
        <option value="">Todos</option>
        ${talhoesPulv.map(t => `<option value="${escAttr(t.id)}"${t.id===pulvFiltroTalhao?' selected':''}>${escHtml(t.nome||t.id)}${!faz?' · '+escHtml(t.fazenda||''):''}</option>`).join('')}
      </select>
    </div>` : ''}
    ${pragasPulv.length > 0 ? `<div class="filtro-grupo">
      <span class="filtro-label">🐛 Praga / Doença</span>
      <select class="filtro-sel" id="selPulvPraga" onchange="window.setPulvFiltroPraga(this.value)">
        <option value="">Todas</option>
        ${pragasPulv.map(pr => `<option value="${escAttr(pr)}"${pr===pulvFiltroPraga?' selected':''}>${escHtml(pr)}</option>`).join('')}
      </select>
    </div>` : ''}
  </div>` : '';

  // Seletor de visualização: Resumo (dashboard) × Mapa (talhões clicáveis)
  const viewToggle = `<div class="secao" style="padding:10px 14px;">
    <div class="nutri-views">
      <button class="nutri-view-btn ${pulvView==='resumo'?'on':''}" onclick="window.setPulvView('resumo')">📋 Resumo</button>
      <button class="nutri-view-btn ${pulvView==='mapa'?'on':''}" onclick="window.setPulvView('mapa')">🗺️ Mapa</button>
    </div>
  </div>`;
  const topo = viewToggle + barraFiltros;

  if (!pulvTodas.length) {
    cont.innerHTML = topo + `<div class="vazio"><div class="ico">💧</div><p>Nenhuma pulverização realizada no período selecionado.<br><span style="font-size:.78rem;">Ajuste o filtro de período ou aguarde aplicações serem confirmadas.</span></p></div>`;
    return;
  }
  if (!pulvFil.length) {
    cont.innerHTML = topo + `<div class="vazio"><div class="ico">💧</div><p>Nenhuma pulverização encontrada com os filtros selecionados.</p></div>`;
    return;
  }
  // Visão MAPA: talhões coloridos por nº de pulverizações, clicáveis → histórico
  if (pulvView === 'mapa') { renderPulvMapa(pulvFil, topo); return; }
  // KPIs
  const totalPulv = pulvFil.length;
  const haPulv = pulvFil.reduce((s,p)=>{
    const t = talhoes.find(x=>x.id===p.talhaoId);
    return s + parseDose(t?.area);
  }, 0);
  // % de cobertura: talhões que receberam pelo menos 1 pulv / total de talhões
  const talhComPulv = new Set(pulvFil.map(p => p.talhaoId));
  const cobertura = talhFil.length > 0 ? talhComPulv.size / talhFil.length * 100 : 0;
  // Total de custo (soma das movimentações ligadas)
  let custoTotal = 0;
  pulvFil.forEach(p => {
    (p.produtosUsados || []).forEach(pu => {
      if (pu.movimentacaoEstoqueId) {
        // achar a movimentação e calcular pelo preço médio do produto na data
        const mov = movimentacoes.find(m => m._docId === pu.movimentacaoEstoqueId);
        if (mov && mov.produtoId) {
          const pm = precoMedioProduto(mov.produtoId, mov.data || hoje());
          custoTotal += (Number(mov.quantidade)||0) * pm;
        }
      }
    });
  });
  let html = topo + `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Pulverizações</div><div class="kpi-value">${totalPulv}</div><div class="kpi-aux">realizadas no período</div></div>
    <div class="kpi-card ok"><div class="kpi-label">Hectares pulverizados</div><div class="kpi-value">${fmt(haPulv,1)}</div><div class="kpi-aux">soma das áreas</div></div>
    <div class="kpi-card info"><div class="kpi-label">Cobertura</div><div class="kpi-value">${fmt(cobertura,0)}%</div><div class="kpi-aux">${talhComPulv.size} de ${talhFil.length} talhões</div></div>
    <div class="kpi-card"><div class="kpi-label">Custo estimado</div><div class="kpi-value">${custoTotal>0?fmtRS(custoTotal):'—'}</div><div class="kpi-aux">${custoTotal>0?'preço médio × qtd':'sem preços cadastrados'}</div></div>
  </div>`;

  // ── Por Praga / Alvo (planejamento) ──────────────────────────────
  const porPraga = {};
  const todosPulvPraga = pulverizacoesFiltradas()
    .filter(p => !pulvFiltroTalhao || p.talhaoId === pulvFiltroTalhao); // respeita filtro de talhão
  todosPulvPraga.forEach(p => {
    const pragas = getPragasPulv(p);
    if (!pragas.length) return;
    pragas.forEach(praga => {
      if (!porPraga[praga]) porPraga[praga] = {realizadas:0, pendentes:0, talhoes:new Set(), ultimaData:'', produtos:new Set()};
      if (p.realizada) {
        porPraga[praga].realizadas++;
        const dt = p.dataRealizada || p.data || '';
        if (dt > porPraga[praga].ultimaData) porPraga[praga].ultimaData = dt;
        (p.aplicacoes||[]).forEach(a => (a.produtos||[]).forEach(pr => { if(pr.produto) porPraga[praga].produtos.add(pr.produto); }));
        (p.produtosUsados||[]).forEach(pr => { if(pr.produto) porPraga[praga].produtos.add(pr.produto); });
      } else {
        porPraga[praga].pendentes++;
      }
      if (p.talhaoId) porPraga[praga].talhoes.add(p.talhaoId);
    });
  });
  const pragaArr = Object.entries(porPraga)
    .map(([k,v]) => ({praga:k, realizadas:v.realizadas, pendentes:v.pendentes, talhoes:v.talhoes.size, ultimaData:v.ultimaData, produtos:[...v.produtos]}))
    .sort((a,b) => b.realizadas - a.realizadas);
  if (pragaArr.length) {
    const hjStr = hoje();
    html += `<div class="secao">
      <div class="secao-tit">🐛 Por Praga / Doença Alvo</div>
      <div class="secao-sub">Use para planejar próximas aplicações — quando foi a última vez que cada praga foi combatida</div>
      <div class="praga-lista">
        ${pragaArr.map(p => {
          const diasDesde = p.ultimaData ? Math.floor((new Date(hjStr) - new Date(p.ultimaData)) / 86400000) : null;
          const urgCor = diasDesde === null ? 'var(--c)' : diasDesde > 60 ? '#dc2626' : diasDesde > 30 ? '#d97706' : '#16a34a';
          const urgLabel = diasDesde === null ? 'Nenhuma realizada' : diasDesde === 0 ? 'Hoje' : diasDesde === 1 ? 'Ontem' : `Há ${diasDesde} dias`;
          return `<div class="praga-card">
            <div class="praga-card-top">
              <div class="praga-nome">🐛 ${escHtml(p.praga)}</div>
              <div class="praga-badge" style="color:${urgCor};border-color:${urgCor};">${urgLabel}</div>
            </div>
            <div class="praga-stats">
              <div class="praga-stat"><span class="praga-n">${p.realizadas}</span>realizadas</div>
              ${p.pendentes ? `<div class="praga-stat" style="color:#2563eb;"><span class="praga-n">${p.pendentes}</span>planejadas</div>` : ''}
              <div class="praga-stat"><span class="praga-n">${p.talhoes}</span>talhões</div>
              ${p.ultimaData ? `<div class="praga-stat"><span class="praga-n" style="font-size:.75rem;">${formatarData(p.ultimaData)}</span>última aplic.</div>` : ''}
            </div>
            ${p.produtos.length ? `<div class="praga-prods">${p.produtos.slice(0,4).map(x=>`<span class="praga-prod-chip">🧪 ${escHtml(x)}</span>`).join('')}${p.produtos.length>4?`<span class="praga-prod-chip" style="color:var(--c);">+${p.produtos.length-4}</span>`:''}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  // ────────────────────────────────────────────────────────────────
  // Área pulverizada por mês (12 meses recentes)
  const porMes = {};
  pulvFil.forEach(p => {
    const dt = p.dataRealizada || p.data;
    if (!dt) return;
    const mesAno = dt.slice(0,7); // YYYY-MM
    if (!porMes[mesAno]) porMes[mesAno] = 0;
    const t = talhoes.find(x => x.id === p.talhaoId);
    porMes[mesAno] += parseDose(t?.area);
  });
  const mesesOrd = Object.keys(porMes).sort();
  if (mesesOrd.length > 0) {
    const maxV = Math.max(...Object.values(porMes), 1);
    html += `<div class="secao">
      <div class="secao-tit">📅 Hectares pulverizados por mês</div>
      <div class="chart-mensal">
        ${mesesOrd.map(m => {
          const v = porMes[m];
          const [a,mm] = m.split('-');
          const lab = ['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][parseInt(mm)] + '/' + a.slice(2);
          return `<div class="chart-bar-wrap">
            <div class="chart-bar-val">${fmt(v,0)}</div>
            <div class="chart-bar" style="height:${Math.max(2, v/maxV*100)}%;"></div>
            <div class="chart-bar-lab">${lab}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  // Top 5 talhões mais pulverizados
  const porTal = {};
  pulvFil.forEach(p => {
    const k = p.talhaoId;
    if (!porTal[k]) porTal[k] = {qtd:0, ha:0, talhaoNome:p.talhaoNome, fazenda:p.fazenda};
    porTal[k].qtd++;
    const t = talhoes.find(x => x.id === p.talhaoId);
    porTal[k].ha += parseDose(t?.area);
  });
  const topTal = Object.entries(porTal).map(([id,v])=>({id,...v})).sort((a,b)=>b.qtd-a.qtd).slice(0,10);
  if (topTal.length) {
    html += `<div class="secao">
      <div class="secao-tit">🎯 Talhões com mais pulverizações</div>
      <div class="secao-sub">Maior número de aplicações no período pode indicar pressão de pragas/doenças</div>
      ${topTal.map((t,i) => `<div class="rank-item">
        <div class="rank-num ${i<3?'top':''}">${i+1}</div>
        <div class="rank-info">
          <div class="rank-nome">${escHtml(t.id||'')} · ${escHtml(t.talhaoNome||'')}</div>
          <div class="rank-meta"><span class="faz-bullet" style="background:${corFazenda(t.fazenda)};"></span>${escHtml(t.fazenda||'—')} · ${fmt(t.ha,1)} ha total</div>
        </div>
        <div class="rank-valor">${t.qtd}<div class="rank-und">aplic.</div></div>
      </div>`).join('')}
    </div>`;
  }
  // Distribuição por classe
  const porClasse = {};
  pulvFil.forEach(p => {
    (p.produtosUsados || []).forEach(pu => {
      const cp = getCategoriaProduto(pu.produtoEstoqueId);
      const sub = cp.subcategoria || '— sem classe —';
      if (!porClasse[sub]) porClasse[sub] = 0;
      porClasse[sub]++;
    });
  });
  const classeArr = Object.entries(porClasse).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  if (classeArr.length > 0 && Object.keys(porClasse).some(k => k !== '— sem classe —')) {
    const totC = classeArr.reduce((s,c)=>s+c.v, 0);
    const cores = ['#1a5c1a','#3b82f6','#f59e0b','#a855f7','#ef4444','#0891b2','#16a34a','#dc2626'];
    // SVG donut
    let acc = 0;
    const segments = classeArr.map((c,i) => {
      const pct = c.v / totC;
      const start = acc;
      acc += pct;
      const startAng = start * 2 * Math.PI - Math.PI/2;
      const endAng = acc * 2 * Math.PI - Math.PI/2;
      const x1 = 60 + 50*Math.cos(startAng), y1 = 60 + 50*Math.sin(startAng);
      const x2 = 60 + 50*Math.cos(endAng), y2 = 60 + 50*Math.sin(endAng);
      const large = pct > 0.5 ? 1 : 0;
      const cor = cores[i % cores.length];
      return `<path d="M 60 60 L ${x1} ${y1} A 50 50 0 ${large} 1 ${x2} ${y2} Z" fill="${cor}" />`;
    }).join('');
    html += `<div class="secao">
      <div class="secao-tit">🧪 Distribuição por classe de defensivo</div>
      <div class="pizza-wrap">
        <svg class="pizza-svg" viewBox="0 0 120 120">
          ${segments}
          <circle cx="60" cy="60" r="22" fill="white"/>
        </svg>
        <div class="pizza-leg">
          ${classeArr.map((c,i) => `<div class="pizza-leg-item">
            <div class="pizza-leg-cor" style="background:${cores[i%cores.length]}"></div>
            <div class="pizza-leg-lab">${escHtml(c.k)}</div>
            <div class="pizza-leg-val">${c.v} (${fmt(c.v/totC*100,0)}%)</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }
  // Defensivos mais usados
  const porProd = {};
  pulvFil.forEach(p => {
    (p.produtosUsados || []).forEach(pu => {
      const k = pu.produto;
      if (!porProd[k]) porProd[k] = {qtd:0, vezes:0, unidade:pu.unidade, custoTotal:0};
      porProd[k].qtd += Number(pu.totalUsado)||0;
      porProd[k].vezes++;
      // custo: se temos mov ligada, calcula
      if (pu.movimentacaoEstoqueId) {
        const mov = movimentacoes.find(m => m._docId === pu.movimentacaoEstoqueId);
        if (mov && mov.produtoId) {
          const pm = precoMedioProduto(mov.produtoId, mov.data || hoje());
          porProd[k].custoTotal += (Number(mov.quantidade)||0) * pm;
        }
      }
    });
  });
  const prodArr = Object.entries(porProd).map(([k,v])=>({nome:k,...v})).sort((a,b)=>b.qtd-a.qtd).slice(0,15);
  if (prodArr.length) {
    html += `<div class="secao">
      <div class="secao-tit">🧪 Defensivos / Insumos mais usados</div>
      <table class="tbl"><thead><tr>
        <th>Produto</th><th>Aplic.</th><th>Qtd total</th><th>Custo est.</th>
      </tr></thead><tbody>
      ${prodArr.map(p => `<tr>
        <td><strong>${escHtml(p.nome)}</strong></td>
        <td class="num">${p.vezes}</td>
        <td class="num">${fmt(p.qtd,2)} ${escHtml(p.unidade||'')}</td>
        <td class="num">${p.custoTotal>0?fmtRS(p.custoTotal):'—'}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  // Custo por talhão
  if (custoTotal > 0) {
    const porTalCusto = {};
    pulvFil.forEach(p => {
      (p.produtosUsados || []).forEach(pu => {
        if (pu.movimentacaoEstoqueId) {
          const mov = movimentacoes.find(m => m._docId === pu.movimentacaoEstoqueId);
          if (mov && mov.produtoId) {
            const pm = precoMedioProduto(mov.produtoId, mov.data || hoje());
            const c = (Number(mov.quantidade)||0) * pm;
            const k = p.talhaoId;
            if (!porTalCusto[k]) porTalCusto[k] = {custo:0, talhaoNome:p.talhaoNome, fazenda:p.fazenda};
            porTalCusto[k].custo += c;
          }
        }
      });
    });
    const talCustoArr = Object.entries(porTalCusto).map(([id,v])=>({id,...v})).sort((a,b)=>b.custo-a.custo).slice(0,10);
    if (talCustoArr.length) {
      html += `<div class="secao">
        <div class="secao-tit">💰 Custo de pulverização por talhão</div>
        <div class="secao-sub">Estimativa com base no preço médio ponderado dos insumos usados</div>
        ${talCustoArr.map((t,i) => {
          const tDoc = talhoes.find(x => x.id === t.id);
          const ha = parseDose(tDoc?.area);
          return `<div class="rank-item">
            <div class="rank-num ${i<3?'top':''}">${i+1}</div>
            <div class="rank-info">
              <div class="rank-nome">${escHtml(t.id||'')} · ${escHtml(t.talhaoNome||'')}</div>
              <div class="rank-meta"><span class="faz-bullet" style="background:${corFazenda(t.fazenda)};"></span>${escHtml(t.fazenda||'—')} · ${fmt(ha,1)} ha · ${ha>0?fmtRS(t.custo/ha)+'/ha':'—'}</div>
            </div>
            <div class="rank-valor">${fmtRS(t.custo)}</div>
          </div>`;
        }).join('')}
      </div>`;
    }
  }
  // ── Histórico detalhado de aplicações ───────────────────────────
  const pulvHist = pulvFil.slice().sort((a,b) => {
    const da = a.dataRealizada || a.data || '';
    const db_ = b.dataRealizada || b.data || '';
    return db_.localeCompare(da);
  });
  if (pulvHist.length) {
    html += `<div class="secao">
      <div class="secao-tit">📋 Histórico de Aplicações</div>
      <div class="secao-sub">Cada pulverização realizada no período${pulvFiltroTalhao||pulvFiltroPraga?' · filtro ativo':''}${pulvFiltroTalhao?' · talhão: '+escHtml(talhoesPulv.find(t=>t.id===pulvFiltroTalhao)?.nome||pulvFiltroTalhao):''}${pulvFiltroPraga?' · praga: '+escHtml(pulvFiltroPraga):''}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th>Data</th>
        ${!faz&&!pulvFiltroTalhao?'<th>Fazenda</th>':''}
        <th>Talhão</th>
        <th>Praga / Alvo</th>
        <th>Modo</th>
        <th>Produtos utilizados</th>
      </tr></thead><tbody>
      ${pulvHist.map(p => {
        const dt = p.dataRealizada || p.data || '—';
        const pragas = getPragasPulv(p);
        // produtos: prefere produtosUsados (quantidade real), senão aplicacoes
        const prods = (p.produtosUsados||[]).length
          ? (p.produtosUsados||[]).map(pu => `${escHtml(pu.produto||'')}${pu.totalUsado?` <span style="color:var(--c);font-size:.72rem;">(${fmt(Number(pu.totalUsado),2)} ${escHtml(pu.unidade||'')})</span>`:''}`)
          : [...new Set((p.aplicacoes||[]).flatMap(a=>(a.produtos||[]).map(pr=>pr.produto)).filter(Boolean))].map(pr=>escHtml(pr));
        return `<tr>
          <td style="white-space:nowrap;">${formatarData(dt)}</td>
          ${!faz&&!pulvFiltroTalhao?`<td><span class="faz-bullet" style="background:${corFazenda(p.fazenda)};"></span>${escHtml(p.fazenda||'—')}</td>`:''}
          <td><strong>${escHtml(p.talhaoNome||p.talhaoId||'—')}</strong></td>
          <td>${pragas.length?pragas.map(pr=>`<span class="praga-prod-chip" style="background:#ede9fe;color:#6d28d9;border:none;">🐛 ${escHtml(pr)}</span>`).join(' '):'<span style="color:var(--c);font-size:.78rem;">—</span>'}</td>
          <td style="white-space:nowrap;">${escHtml(p.modoAplicacao||'—')}</td>
          <td style="font-size:.78rem;">${prods.length?prods.join('<br>'):'<span style="color:var(--c);">—</span>'}</td>
        </tr>`;
      }).join('')}
      </tbody></table></div>
    </div>`;
  }

  cont.innerHTML = html;
}

// ── MAPA de pulverizações (talhões clicáveis → histórico "quais e quando") ──
// Agrupa por talhão, expandindo cada aplicação (parcial) num evento datado.
function _pulvAgrupaPorTalhao(pulvFil) {
  const porTal = {};
  pulvFil.forEach(p => {
    if (!p.talhaoId) return;
    const pragas = getPragasPulv(p);
    const eventos = [];
    if (Array.isArray(p.aplicacoes) && p.aplicacoes.length) {
      p.aplicacoes.forEach(a => eventos.push({
        data: a.data || p.dataRealizada || p.data || '',
        modo: p.modoAplicacao || '',
        pragas,
        produtos: (a.produtos||[]).map(x=>({nome:x.produto, dose:x.dose, un:x.unidade})).filter(x=>x.nome),
        obs: a.observacao || ''
      }));
    } else {
      eventos.push({
        data: p.dataRealizada || p.data || '',
        modo: p.modoAplicacao || '',
        pragas,
        produtos: (p.produtosUsados||[]).map(x=>({nome:x.produto, dose:x.dose, un:x.unidade})).filter(x=>x.nome),
        obs: p.obsRealizacao || p.observacoes || ''
      });
    }
    if (!porTal[p.talhaoId]) porTal[p.talhaoId] = { qtd:0, ultima:'', eventos:[] };
    eventos.forEach(e => {
      porTal[p.talhaoId].eventos.push(e);
      porTal[p.talhaoId].qtd++;
      if (e.data > porTal[p.talhaoId].ultima) porTal[p.talhaoId].ultima = e.data;
    });
  });
  return porTal;
}
function renderPulvMapa(pulvFil, topo) {
  const cont = document.getElementById('tabContent');
  const porTal = _pulvAgrupaPorTalhao(pulvFil);
  const semGeo = Object.keys(porTal).filter(id => { const t = talhoes.find(x=>x.id===id); return !t || !t.coordenadas || t.coordenadas.length < 3; }).length;
  cont.innerHTML = topo + `
    <div class="secao" style="padding-bottom:6px;">
      <div class="secao-tit">🗺️ Mapa de pulverizações</div>
      <div class="secao-sub">Cor por <b>nº de aplicações</b> no período · toque num talhão para ver <b>quais</b> pulverizações e <b>quando</b> foram feitas.${semGeo?` <span style="color:#d97706;">⚠️ ${semGeo} talhão(ões) pulverizado(s) sem polígono cadastrado no mapa.</span>`:''}</div>
    </div>
    <div id="pulvMapWrap" style="position:relative;">
      <div id="pulvMap" style="height:min(60vh,460px);border-radius:12px;overflow:hidden;"></div>
      <div id="pulvMapLegenda" class="nutri-legenda"></div>
    </div>
    <div id="pulvTalhaoDetalhe" class="secao" style="display:none;"></div>`;
  requestAnimationFrame(() => _desenharPulvMapa(porTal));
}
function _desenharPulvMapa(porTal) {
  if (typeof L === 'undefined') return;
  const el = document.getElementById('pulvMap'); if (!el) return;
  const map = L.map(el, { center:[-18.7166,-40.4000], zoom:13, scrollWheelZoom:true }); _pulvMap = map;
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'© Esri', maxZoom:19 }).addTo(map);
  const norm = c => (c||[]).map(p => Array.isArray(p)?[p[0],p[1]]:(p.lat!==undefined?[p.lat,p.lng]:[p.latitude,p.longitude]));
  const max = Math.max(1, ...Object.values(porTal).map(v=>v.qtd));
  const cor = q => { if (q<=0) return '#94a3b8'; const r=Math.min(1,q/max); const c1=[191,219,254], c2=[30,64,175]; const mix=c1.map((c,i)=>Math.round(c+(c2[i]-c)*r)); return `rgb(${mix[0]},${mix[1]},${mix[2]})`; };
  const bounds = [];
  talhoesFiltrados().forEach(t => {
    if (!t.coordenadas || t.coordenadas.length < 3) return;
    const ll = norm(t.coordenadas); bounds.push(...ll);
    const info = porTal[t.id] || { qtd:0, ultima:'', eventos:[] };
    const q = info.qtd;
    const poly = L.polygon(ll, { color:'#fff', weight:1.5, fillColor:cor(q), fillOpacity:q>0?.8:.3 }).addTo(map);
    const ultimaTxt = info.ultima ? formatarData(info.ultima) : '—';
    poly.bindTooltip(`<b>${escHtml(t.nome||t.id)}</b><br>${q>0?`${q} aplicaç${q>1?'ões':'ão'} · última ${ultimaTxt}`:'sem pulverização no período'}`, { sticky:true });
    poly.on('click', () => _pulvMostrarTalhao(t, info));
  });
  if (bounds.length) { try { map.fitBounds(bounds, { padding:[30,30], maxZoom:15 }); } catch(e){} }
  setTimeout(() => map.invalidateSize(), 200);
  const leg = document.getElementById('pulvMapLegenda');
  if (leg) leg.innerHTML = `<div class="nl-tit">Nº de aplicações</div>
    <div style="width:120px;height:9px;border-radius:4px;background:linear-gradient(90deg,#bfdbfe,#1e40af);"></div>
    <div class="nl-esc"><span>1</span><span>${max}</span></div>
    <div class="nl-row"><span class="nl-dot" style="background:#94a3b8;"></span>sem pulverização</div>`;
}
function _pulvMostrarTalhao(t, info) {
  const box = document.getElementById('pulvTalhaoDetalhe'); if (!box) return;
  const area = parseDose(t.area);
  const evs = (info.eventos||[]).slice().sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));
  box.style.display = '';
  box.innerHTML = `<div class="secao-tit" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <span>💧 ${escHtml(t.nome||t.id)} <span style="font-weight:400;color:var(--c);font-size:.8rem;">· ${escHtml(t.fazenda||'')}${area>0?' · '+fmt(area,1)+' ha':''}</span></span>
      <button class="nutri-view-btn" onclick="document.getElementById('pulvTalhaoDetalhe').style.display='none'">✕</button>
    </div>
    <div class="secao-sub">${info.qtd>0?`${info.qtd} aplicaç${info.qtd>1?'ões':'ão'} no período — mais recente primeiro`:'Nenhuma pulverização neste talhão no período selecionado.'}</div>
    ${evs.length ? `<div class="pulv-hist">${evs.map(e => `<div class="pulv-hist-item">
        <div class="phi-data">📅 ${e.data?formatarData(e.data):'—'}</div>
        <div class="phi-corpo">
          ${e.pragas&&e.pragas.length?`<div class="phi-linha">${e.pragas.map(pr=>`<span class="praga-prod-chip" style="background:#ede9fe;color:#6d28d9;border:none;">🐛 ${escHtml(pr)}</span>`).join(' ')}</div>`:''}
          ${e.produtos&&e.produtos.length?`<div class="phi-linha">${e.produtos.map(pr=>`<span class="praga-prod-chip">🧪 ${escHtml(pr.nome)}${pr.dose?` · ${escHtml(String(pr.dose))} ${escHtml(pr.un||'')}/ha`:''}</span>`).join('')}</div>`:''}
          ${e.modo?`<div class="phi-modo">⚙️ ${escHtml(e.modo)}</div>`:''}
          ${e.obs?`<div class="phi-obs">💬 ${escHtml(e.obs)}</div>`:''}
        </div>
      </div>`).join('')}</div>` : ''}`;
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ABA 4 — ESTOQUE
// ════════════════════════════════════════════════════
function renderEstoque() {
  const cont = document.getElementById('tabContent');
  const faz = fazendaFiltro();
  const movFil = movimentacoesFiltradas();
  const prodsFaz = faz ? produtosEstoque.filter(p => p.fazenda === faz) : produtosEstoque;
  let html = '';
  // Saldo total por categoria (valor)
  const porCat = {};
  prodsFaz.forEach(p => {
    const cat = p.categoria || 'sem_categoria';
    const saldo = Number(p.saldo)||0;
    if (saldo <= 0) return;
    if (!porCat[cat]) porCat[cat] = {qtdProds:0, valorTotal:0};
    porCat[cat].qtdProds++;
    const pm = precoMedioProduto(p._docId);
    porCat[cat].valorTotal += saldo * pm;
  });
  const valorTotalEstoque = Object.values(porCat).reduce((s,c)=>s+c.valorTotal, 0);
  // KPIs
  const totalProds = prodsFaz.length;
  const prodsAtivos = prodsFaz.filter(p => (Number(p.saldo)||0) > 0).length;
  const prodsZerados = prodsFaz.filter(p => (Number(p.saldo)||0) === 0).length;
  const prodsNeg = prodsFaz.filter(p => (Number(p.saldo)||0) < 0).length;
  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Produtos cadastrados</div><div class="kpi-value">${totalProds}</div><div class="kpi-aux">${prodsAtivos} com saldo</div></div>
    <div class="kpi-card info"><div class="kpi-label">Valor parado</div><div class="kpi-value">${valorTotalEstoque>0?fmtRS(valorTotalEstoque):'—'}</div><div class="kpi-aux">saldo × preço médio</div></div>
    <div class="kpi-card ${prodsZerados>0?'alerta':''}"><div class="kpi-label">Produtos zerados</div><div class="kpi-value">${prodsZerados}</div><div class="kpi-aux">precisam reposição</div></div>
    <div class="kpi-card ${prodsNeg>0?'danger':''}"><div class="kpi-label">Saldo negativo</div><div class="kpi-value">${prodsNeg}</div><div class="kpi-aux">${prodsNeg>0?'erro no lançamento':'tudo certo'}</div></div>
  </div>`;
  // Lista de produtos zerados (alerta de reposição)
  const listaZerados = prodsFaz.filter(p => (Number(p.saldo)||0) === 0).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  if (listaZerados.length) {
    html += `<div class="secao secao-alerta">
      <div class="secao-tit">⚠️ Produtos zerados (precisam reposição)</div>
      <div class="lista-prods-zerados">
        ${listaZerados.map(p => `<div class="prod-zerado-item">
          <div class="prod-zerado-info">
            <div class="prod-zerado-nome">${escHtml(p.nome)}</div>
            <div class="prod-zerado-meta"><span class="faz-bullet" style="background:${corFazenda(p.fazenda)};"></span>${escHtml(p.fazenda||'—')}${p.categoria?' · '+escHtml(CAT_LABELS[p.categoria]||p.categoria):''}</div>
          </div>
          <div class="prod-zerado-und">${escHtml(p.unidade||'—')}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }
  // Lista de produtos com saldo negativo (erro de lançamento)
  const listaNeg = prodsFaz.filter(p => (Number(p.saldo)||0) < 0).sort((a,b)=>(Number(a.saldo)||0) - (Number(b.saldo)||0));
  if (listaNeg.length) {
    html += `<div class="secao secao-danger">
      <div class="secao-tit">🚨 Produtos com saldo negativo (verificar lançamentos)</div>
      <div class="lista-prods-zerados">
        ${listaNeg.map(p => `<div class="prod-zerado-item">
          <div class="prod-zerado-info">
            <div class="prod-zerado-nome">${escHtml(p.nome)}</div>
            <div class="prod-zerado-meta"><span class="faz-bullet" style="background:${corFazenda(p.fazenda)};"></span>${escHtml(p.fazenda||'—')}${p.categoria?' · '+escHtml(CAT_LABELS[p.categoria]||p.categoria):''}</div>
          </div>
          <div class="prod-zerado-und" style="color:var(--danger);">${fmt(p.saldo,2)} ${escHtml(p.unidade||'')}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }
  // Valor por categoria
  if (valorTotalEstoque > 0) {
    const arrCat = Object.entries(porCat).map(([k,v]) => ({
      cat:k, label:CAT_LABELS[k]||'📦 '+k, ...v
    })).sort((a,b)=>b.valorTotal-a.valorTotal);
    const maxV = Math.max(...arrCat.map(c=>c.valorTotal), 1);
    html += `<div class="secao">
      <div class="secao-tit">💼 Valor parado por categoria</div>
      ${arrCat.map(c => `<div class="bar-row">
        <div class="bar-label">${escHtml(c.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(8, c.valorTotal/maxV*100)}%;">${fmtRS(c.valorTotal)}</div></div>
        <div class="bar-value">${c.qtdProds} prods</div>
      </div>`).join('')}
    </div>`;
  }
  // Consumo do período: top produtos com mais saída
  const consumo = {};
  movFil.filter(m => ['saida','aplicacao'].includes(m.tipo)).forEach(m => {
    const k = m.produtoId;
    if (!k) return;
    if (!consumo[k]) consumo[k] = {nome:m.produtoNome, unidade:m.unidade, qtd:0, custo:0};
    consumo[k].qtd += Number(m.quantidade)||0;
    const pm = precoMedioProduto(m.produtoId, m.data || hoje());
    consumo[k].custo += (Number(m.quantidade)||0) * pm;
  });
  const consArr = Object.values(consumo).sort((a,b)=>b.qtd-a.qtd).slice(0,15);
  if (consArr.length) {
    html += `<div class="secao">
      <div class="secao-tit">📤 Consumo do período</div>
      <table class="tbl"><thead><tr>
        <th>Produto</th><th>Qtd saída</th><th>Custo est.</th>
      </tr></thead><tbody>
      ${consArr.map(c => `<tr>
        <td><strong>${escHtml(c.nome)}</strong></td>
        <td class="num">${fmt(c.qtd,2)} ${escHtml(c.unidade||'')}</td>
        <td class="num">${c.custo>0?fmtRS(c.custo):'—'}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  // Top compras (entradas)
  const entradas = movFil.filter(m => m.tipo === 'entrada' && m.precoTotal > 0)
    .sort((a,b)=>(Number(b.precoTotal)||0)-(Number(a.precoTotal)||0)).slice(0,10);
  if (entradas.length) {
    const totalCompras = entradas.reduce((s,e)=>s+(Number(e.precoTotal)||0), 0);
    html += `<div class="secao">
      <div class="secao-tit">🛒 Maiores compras do período</div>
      <div class="secao-sub">Total: <strong>${fmtRS(totalCompras)}</strong> em ${entradas.length} compras</div>
      <table class="tbl"><thead><tr>
        <th>Data</th><th>Produto</th><th>Qtd</th><th>Total</th>
      </tr></thead><tbody>
      ${entradas.map(e => `<tr>
        <td>${formatarData(e.data)}</td>
        <td><strong>${escHtml(e.produtoNome||'')}</strong><br><span style="font-size:.7rem;color:var(--c);">${escHtml(e.fazenda||'')}</span></td>
        <td class="num">${fmt(e.quantidade,2)} ${escHtml(e.unidade||'')}</td>
        <td class="num">${fmtRS(e.precoTotal)}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  // Projeção: quanto dura o saldo (saldo / consumo médio mensal)
  if (consArr.length && valorTotalEstoque > 0) {
    const {inicio, fim} = periodoFiltro();
    const meses = Math.max(1, (new Date(fim) - new Date(inicio)) / (30*86400000));
    const projecoes = prodsFaz.filter(p => {
      const saldo = Number(p.saldo)||0;
      return saldo > 0;
    }).map(p => {
      const c = consumo[p._docId];
      if (!c || c.qtd === 0) return null;
      const consumoMes = c.qtd / meses;
      const meseRestante = consumoMes > 0 ? (Number(p.saldo)||0) / consumoMes : Infinity;
      return {
        nome: p.nome,
        unidade: p.unidade,
        saldo: Number(p.saldo)||0,
        consumoMes,
        mesesRestante: meseRestante
      };
    }).filter(Boolean).sort((a,b)=>a.mesesRestante-b.mesesRestante).slice(0,10);
    if (projecoes.length) {
      html += `<div class="secao">
        <div class="secao-tit">📈 Projeção de duração do saldo</div>
        <div class="secao-sub">Com base no consumo médio do período (${fmt(meses,1)} mês(es))</div>
        <table class="tbl"><thead><tr>
          <th>Produto</th><th>Saldo</th><th>Consumo/mês</th><th>Duração</th>
        </tr></thead><tbody>
        ${projecoes.map(p => {
          let dur, cor;
          if (p.mesesRestante === Infinity) { dur = '∞'; cor = 'var(--c)'; }
          else if (p.mesesRestante < 1) { dur = fmt(p.mesesRestante*30,0)+' dias'; cor = 'var(--danger)'; }
          else if (p.mesesRestante < 3) { dur = fmt(p.mesesRestante,1)+' meses'; cor = 'var(--warn)'; }
          else { dur = fmt(p.mesesRestante,1)+' meses'; cor = 'var(--ok)'; }
          return `<tr>
            <td><strong>${escHtml(p.nome)}</strong></td>
            <td class="num">${fmt(p.saldo,2)} ${escHtml(p.unidade)}</td>
            <td class="num">${fmt(p.consumoMes,2)} ${escHtml(p.unidade)}</td>
            <td class="num" style="color:${cor};font-weight:700;">${dur}</td>
          </tr>`;
        }).join('')}
        </tbody></table>
      </div>`;
    }
  }
  if (!html) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🏬</div><p>Sem dados de estoque no período.</p></div>`;
    return;
  }
  cont.innerHTML = html;
}
