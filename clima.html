<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableMultiTabIndexedDbPersistence, doc, getDoc, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",
  authDomain: "talhoes-df836.firebaseapp.com",
  projectId: "talhoes-df836",
  storageBucket: "talhoes-df836.firebasestorage.app",

  appId: "1:1047022702039:web:001cf6a3c028c494ab8f92"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableMultiTabIndexedDbPersistence(db).catch(()=>{});

// Dados gravados pelo coletor (clima/coletor.py, GitHub Actions) em
// clima/{estacao}/{dias,resumos,status}. Esta página é só leitura.
let usuarioAtual=null, perfilAtual={};
let estacoes=[], estacaoId=null, diaSel=null;
let diaDoc=null, resumos=[], statusUlt=null;
let grafSel='t';
let unsubDia=null, unsubRes=null, unsubStatus=null;
let _chartDia=null, _chartHist=null;
const LS_ESTACAO='climaEstacao';

// ─── AUTH ───
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual=user;
  const snap=await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual=snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil==='admin') perfilAtual.modulos={clima:'admin',admin:'admin'};
  // Página de consulta aberta por padrão (como a Agenda): só bloqueia se o
  // admin definir explicitamente o módulo 'clima' como 'nenhum'.
  if (!ehAdminSistema() && perfilAtual.modulos?.clima==='nenhum') { window.location.href='index.html'; return; }
  document.getElementById('userNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserEmail').textContent=user.email;
  gerarMenu();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appContent').style.display='flex';
  iniciarListeners();
});

function nivelAcesso(mod) {
  const _mods = perfilAtual.modulos || {};
  if (_mods[mod]) return _mods[mod];
  const _heranca = { drench: 'pulverizacao', cotacoes: 'pedidos' };
  if (_heranca[mod] && _mods[_heranca[mod]]) return _mods[_heranca[mod]];
  if (perfilAtual.perfil === 'admin') return 'admin';
  return 'nenhum';
}
function ehAdminSistema(){ return Object.values(perfilAtual.modulos||{}).includes('admin') || perfilAtual.perfil==='admin'; }
function fazendaPermitida(fazenda){
  if (ehAdminSistema() || !fazenda) return true;
  const permitidas = perfilAtual.fazendasModulo?.clima;
  if (!permitidas || !permitidas.length) return true;
  return permitidas.includes(fazenda);
}

function gerarMenu() {
  const isAdm = ehAdminSistema();
  const pg = (window.location.pathname.split('/').pop() || 'index.html');
  const secoes = [
    { label: 'Principal', items: [
      { href:'index.html',         ico:'📊', label:'Dashboard' },
      { href:'agenda.html',        ico:'📅', label:'Agenda' },
      { href:'mapa.html',          ico:'🗺️', label:'Mapa de Talhões',   acesso:'mapa' },
      { href:'adubacoes.html',     ico:'🧪', label:'Adubações',         acesso:'adubacao' },
      { href:'pulverizacoes.html', ico:'💧', label:'Pulverizações',     acesso:'pulverizacao' },
      { href:'drench.html',        ico:'🌱', label:'Drench Preventivo', acesso:'drench' },
      { href:'irrigacao.html',     ico:'💦', label:'Irrigação',         acesso:'irrigacao' },
      { href:'clima.html',         ico:'🌦️', label:'Clima' },
      { href:'herbicida.html',     ico:'🌿', label:'Herbicida',         acesso:'herbicida' },
      { href:'atividades.html',    ico:'🌾', label:'Atividades',        acesso:'atividades' },
      { href:'equipe.html',        ico:'👥', label:'Equipe',            acesso:'equipe' },
      { href:'estoque.html',       ico:'🏬', label:'Estoque',           acesso:'estoque' },
      { href:'pedidos.html',       ico:'📦', label:'Pedidos',           acesso:'pedidos' },
      { href:'cotacoes.html',      ico:'💰', label:'Cotações',          acesso:'cotacoes' },
      { href:'calibracao.html',    ico:'⚙️', label:'Calibração',        acesso:'calibracao' },
      { href:'avaliacoes.html',    ico:'📍', label:'Avaliações',        acesso:'avaliacoes' },
      { href:'amostragem.html',   ico:'🧫', label:'Amostragem',        acesso:'amostragem' },
    ]},
    { label: 'Análise', items: [
      { href:'gestao.html',        ico:'📈', label:'Gestão',            acesso:'gestao' },

// ─── HELPERS ───
function formatarData(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function sanitizar(s){ return String(s==null?'':s).replace(/[<>&"']/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch])); }
function fmt(n,d=1){ if(n==null||isNaN(n)||!isFinite(n)) return '—'; return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function estacaoAtual(){ return estacoes.find(e=>e.id===estacaoId)||null; }
function fusoAtual(){ return estacaoAtual()?.fuso || 'America/Sao_Paulo'; }
// Data de hoje (YYYY-MM-DD) no fuso da estação — os docs de dia usam o dia local dela.
function hojeEstacao(){ return new Intl.DateTimeFormat('en-CA',{timeZone:fusoAtual(),year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function horaEstacao(d){ return new Intl.DateTimeFormat('pt-BR',{timeZone:fusoAtual(),hour:'2-digit',minute:'2-digit'}).format(d); }
function somarDias(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function setorVento(g){ if(g==null) return ''; const S=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO']; return S[Math.round(g/22.5)%16]; }
function tsParaDate(t){ if(!t) return null; if(typeof t.toDate==='function') return t.toDate(); const d=new Date(t); return isNaN(d)?null:d; }
function tempoRelativo(d){
  if(!d) return '—';
  const min=Math.round((Date.now()-d.getTime())/60000);
  if(min<1) return 'agora'; if(min<60) return `há ${min} min`;
  const h=Math.floor(min/60); if(h<48) return `há ${h} h`;
  return `há ${Math.floor(h/24)} dias`;
}

// Pontos: {"HH:MM": "v1,v2,..."} na ordem de `campos` → {chave: {campo: valor}}
function decodificarPontos(d){
  const campos=(d?.campos||[]).map(c=>typeof c==='string'?c:c.nome);
  const out={};
  Object.entries(d?.pontos||{}).forEach(([k,s])=>{
    const partes=String(s).split(','); const o={};
    campos.forEach((c,i)=>{ const v=partes[i]; o[c]=(v===undefined||v==='')?null:parseFloat(v); });
    out[k]=o;
  });
  return out;
}

// ─── LISTENERS ───
function iniciarListeners(){
  onSnapshot(collection(db,'clima'), snap => {
    estacoes=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(e=>fazendaPermitida(e.fazenda))
      .sort((a,b)=>String(a.nome||a.id).localeCompare(String(b.nome||b.id),'pt-BR'));
    if(!estacoes.find(e=>e.id===estacaoId)){
      const salvo=lsGet(LS_ESTACAO);
      trocarEstacao(estacoes.find(e=>e.id===salvo)?.id || estacoes[0]?.id || null);
    } else renderSeletor();
  }, err => { document.getElementById('climaConteudo').innerHTML=`<div class="vazio">Não foi possível ler os dados do clima (${sanitizar(err.code||err.message)}).</div>`; });
}

function trocarEstacao(id){
  estacaoId=id;
  if(id) lsSet(LS_ESTACAO,id);
  diaSel=hojeEstacao();
  diaDoc=null; resumos=[]; statusUlt=null;
  [unsubRes,unsubStatus].forEach(u=>u&&u());
  unsubRes=unsubStatus=null;
  renderSeletor(); renderStatus();
  if(!id){ render(); return; }
  unsubStatus=onSnapshot(doc(db,'clima',id,'status','ultimo'), s=>{ statusUlt=s.exists()?s.data():null; renderStatus(); });
  unsubRes=onSnapshot(query(collection(db,'clima',id,'resumos'),orderBy('data','desc'),limit(31)), s=>{
    resumos=s.docs.map(d=>d.data()); renderHistorico();
  });
  ouvirDia();
}

function ouvirDia(){
  if(unsubDia){ unsubDia(); unsubDia=null; }
  diaDoc=null; render();
  if(!estacaoId||!diaSel) return;
  unsubDia=onSnapshot(doc(db,'clima',estacaoId,'dias',diaSel), s=>{ diaDoc=s.exists()?s.data():{vazio:true}; render(); });
}

// ─── CONTROLES (bridges p/ os handlers inline — script é type="module") ───
window.setEstacao=function(id){ trocarEstacao(id); };
window.mudarDia=function(delta){
  const novo=somarDias(diaSel,delta);
  if(novo>hojeEstacao()) return;
  diaSel=novo; ouvirDia();
};
window.setDia=function(v){ if(!v||v>hojeEstacao()) return; diaSel=v; ouvirDia(); };
window.setGraf=function(g){ grafSel=g; renderGrafico(); document.querySelectorAll('.gchip').forEach(b=>b.classList.toggle('on',b.dataset.g===g)); };

// ─── RENDER ───
function renderSeletor(){
  const sel=document.getElementById('selEstacao');
  if(!estacoes.length){ sel.innerHTML='<option value="">Nenhuma estação</option>'; sel.disabled=true; return; }
  sel.disabled=estacoes.length<2;
  sel.innerHTML=estacoes.map(e=>`<option value="${sanitizar(e.id)}"${e.id===estacaoId?' selected':''}>${sanitizar(e.nome||e.id)}${e.fazenda?' · '+sanitizar(e.fazenda):''}</option>`).join('');
}

function renderStatus(){
  const el=document.getElementById('climaStatus'); if(!el) return;
  if(!statusUlt){ el.innerHTML=''; return; }
  const d=tsParaDate(statusUlt.data);
  const velho=d && (Date.now()-d.getTime())>30*60000;
  if(statusUlt.ok===false){
    el.innerHTML=`<div class="st st-erro">⚠️ Última coleta falhou ${tempoRelativo(d)} (${statusUlt.falhasSeguidas||1}× seguidas): ${sanitizar(statusUlt.mensagem||'')}</div>`;
  } else if(velho){
    el.innerHTML=`<div class="st st-aviso">⏳ Sem coleta nova ${tempoRelativo(d)} — o coletor pode estar atrasado.</div>`;
  } else {
    el.innerHTML=`<div class="st st-ok">● Coleta automática em dia · última ${tempoRelativo(d)}</div>`;
  }
}

function render(){
  const alvo=document.getElementById('climaConteudo');
  if(!estacoes.length){
    alvo.innerHTML='<div class="vazio">Nenhuma estação meteorológica cadastrada ainda.</div>';

      <button class="dn-btn" onclick="mudarDia(-1)">‹</button>

      ${ehHoje?'':`<button class="dn-hoje" onclick="setDia('${hoje}')">Hoje</button>`}

  const pts=decodificarPontos(diaDoc);
  const chaves=Object.keys(pts).sort();

  let agoraHtml='';
  if(ehHoje && chaves.length){
    const k=chaves[chaves.length-1], p=pts[k];
    agoraHtml=`<div class="card agora">
      <div class="card-tit">Agora <span class="card-sub">leitura das ${k}</span></div>
      <div class="agora-grid">
        <div class="ag-item ag-temp"><div class="ag-val">${fmt(p.t,1)}<small>°C</small></div><div class="ag-lbl">Temperatura</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.ur,0)}<small>%</small></div><div class="ag-lbl">Umidade</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.u!=null?p.u*3.6:null,1)}<small>km/h</small></div><div class="ag-lbl">Vento ${setorVento(p.dir)}</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.raj!=null?p.raj*3.6:null,1)}<small>km/h</small></div><div class="ag-lbl">Rajada</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.c24h,1)}<small>mm</small></div><div class="ag-lbl">Chuva 24 h</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.rad,0)}<small>W/m²</small></div><div class="ag-lbl">Radiação</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.orv,1)}<small>°C</small></div><div class="ag-lbl">Ponto de orvalho</div></div>
        <div class="ag-item"><div class="ag-val">${fmt(p.uv,0)}</div><div class="ag-lbl">Índice UV</div></div>
        <div class="ag-item ag-dt"><div class="ag-val">${fmt(deltaT(p),1)}<small>°C</small></div><div class="ag-lbl">Delta T</div></div>
      </div>
    </div>`;
  }
  const selo = r.completo
    ? '<span class="selo selo-ok">dia completo</span>'
    : `<span class="selo selo-parc">${ehHoje?'dia em andamento':'dados incompletos'} · ${fmt(r.coberturaPct,0)}%</span>`;
  const resumoHtml=`<div class="card">
      <div class="card-tit">Resumo do dia ${selo}</div>
      <div class="eto-box">
        <div><div class="eto-val">${fmt(r.ETo,1)}<small> mm</small></div><div class="eto-lbl">ETo (evapotranspiração de referência)</div></div>
        <div class="eto-chuva"><div class="eto-val chuva">${fmt(r.chuvaMm,1)}<small> mm</small></div><div class="eto-lbl">Chuva</div></div>
      </div>
      ${r.completo?'':'<div class="aviso-parc">ETo e radiação só valem com o dia completo (≥ 90% dos minutos).</div>'}
      <div class="res-grid">
        <div class="rg"><span>Temperatura mín / máx</span><b>${fmt(r.Tmin,1)} / ${fmt(r.Tmax,1)} °C</b></div>
        <div class="rg"><span>Temperatura média</span><b>${fmt(r.Tmed,1)} °C</b></div>
        <div class="rg"><span>Umidade mín / máx</span><b>${fmt(r.URmin,0)} / ${fmt(r.URmax,0)} %</b></div>
        <div class="rg"><span>Vento médio (2 m)</span><b>${fmt(r.u2med!=null?r.u2med*3.6:null,1)} km/h</b></div>
        <div class="rg"><span>Rajada máxima</span><b>${fmt(r.rajadaMaxKmh,1)} km/h${r.rajadaHora?' às '+sanitizar(r.rajadaHora):''}</b></div>
        <div class="rg"><span>Radiação solar</span><b>${fmt(r.RsMJ,1)} MJ/m²</b></div>
        <div class="rg"><span>Insolação</span><b>${r.insolacaoMin!=null?fmt(r.insolacaoMin/60,1)+' h':'—'}</b></div>
        <div class="rg"><span>Pressão média</span><b>${fmt(r.Pmed,0)} hPa</b></div>
      </div>
    </div>`;
  const grafHtml=`<div class="card">
      <div class="gchips">
        ${[['t','🌡️ Temperatura'],['ur','💧 Umidade'],['vento','💨 Vento'],['rad','☀️ Radiação'],['chuva','🌧️ Chuva'],['janela','🎯 Delta T']].map(([g,l])=>`<button class="gchip${g===grafSel?' on':''}" data-g="${g}" onclick="setGraf('${g}')">${l}</button>`).join('')}
      </div>
      <div class="graf-box"><canvas id="grafDia"></canvas></div>
    </div>`;
  alvo.innerHTML=nav+agoraHtml+janelaHtml(pts,chaves,ehHoje)+resumoHtml+grafHtml+histHtml();
  renderGrafico();
  renderHistorico();
}

// ─── JANELA DE PULVERIZAÇÃO ───
// Minuto "apto" = Delta T entre 2 e 8 °C E vento médio até 5 km/h (limites em JANELA) E sem chuva
// (intensidade = 0 e chuva da última hora = 0). Delta T = temperatura − bulbo úmido.
const JANELA={dtMin:2, dtMax:8, ventoMin:0, ventoMax:5, minJanela:15};
// Bulbo úmido — Stull (2011), válido p/ UR 5–99% e −20…50 °C (erro < 0,3 °C).
function bulboUmido(T,UR){
  return T*Math.atan(0.151977*Math.sqrt(UR+8.313659)) + Math.atan(T+UR) - Math.atan(UR-1.676331)
    + 0.00391838*Math.pow(UR,1.5)*Math.atan(0.023101*UR) - 4.686035;
}
function deltaT(p){ return (p&&p.t!=null&&p.ur!=null) ? p.t-bulboUmido(p.t,Math.min(Math.max(p.ur,5),99)) : null; }
function avaliarPulv(p){
  const dt=deltaT(p);
  if(dt==null||p.u==null) return {st:'sd', motivos:['sem dados']};
  const v=p.u*3.6, motivos=[];
  if((p.ctx||0)>0||(p.c1h||0)>0) motivos.push('chuva');
  if(dt<JANELA.dtMin) motivos.push('Delta T baixo (ar muito úmido)');
  if(dt>JANELA.dtMax) motivos.push('Delta T alto (ar seco, gota evapora)');
  if(v<JANELA.ventoMin) motivos.push('vento fraco (risco de inversão)');
  if(v>JANELA.ventoMax) motivos.push('vento forte (deriva)');
  return {st:motivos.length?'nao':'ok', dt, v, motivos};
}
// Avalia cada minuto do dia (0…fim) e agrupa em trechos contínuos de mesmo status.
function trechosPulv(pts, fim){
  const trechos=[];
  for(let i=0;i<=fim;i++){
    const k=String(Math.floor(i/60)).padStart(2,'0')+':'+String(i%60).padStart(2,'0');
    const st=pts[k]?avaliarPulv(pts[k]).st:'sd';
    const ult=trechos[trechos.length-1];
    if(ult&&ult.st===st) ult.fim=i; else trechos.push({st,ini:i,fim:i});
  }
  return trechos;
}
function hm(min){ return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function janelaHtml(pts, chaves, ehHoje){
  if(!chaves.length) return '';
  const [h1,m1]=chaves[chaves.length-1].split(':').map(Number);
  const fim=ehHoje? h1*60+m1 : 1439;
  const trechos=trechosPulv(pts,fim);
  const minApto=trechos.filter(t=>t.st==='ok').reduce((a,t)=>a+t.fim-t.ini+1,0);
  const janelas=trechos.filter(t=>t.st==='ok' && t.fim-t.ini+1>=JANELA.minJanela);
  const COR={ok:'#22c55e',nao:'#ef4444',sd:'#d6d3cb'};
  const total=ehHoje?1440:fim+1;
  const grad=trechos.map(t=>`${COR[t.st]} ${(t.ini/total*100).toFixed(3)}% ${((t.fim+1)/total*100).toFixed(3)}%`).join(',');
  let agora='';
  if(ehHoje){
    const k=chaves[chaves.length-1], a=avaliarPulv(pts[k]);
    agora = a.st==='ok'
      ? `<div class="pv-agora ok"><div class="pv-ico">✅</div><div><b>Condição adequada agora</b><div class="pv-det">Delta T ${fmt(a.dt,1)} °C · vento ${fmt(a.v,1)} km/h · sem chuva · leitura ${k}</div></div></div>`
      : a.st==='nao'
      ? `<div class="pv-agora nao"><div class="pv-ico">⛔</div><div><b>Não recomendado agora</b><div class="pv-det">${a.motivos.map(sanitizar).join(' · ')}</div><div class="pv-det">Delta T ${fmt(a.dt,1)} °C · vento ${fmt(a.v,1)} km/h · leitura ${k}</div></div></div>`
      : `<div class="pv-agora sd"><div class="pv-ico">❔</div><div><b>Sem dados suficientes agora</b></div></div>`;
  }
  const marcas=[0,6,12,18,24].map(h=>`<span style="left:${h/24*100}%">${h}h</span>`).join('');
  return `<div class="card">
      <div class="card-tit">🎯 Janela de pulverização</div>
      ${agora}
      <div class="pv-barra" style="background:linear-gradient(to right,${grad}${ehHoje?`,#f4f1ea ${((fim+1)/total*100).toFixed(3)}% 100%`:''})"></div>
      <div class="pv-marcas">${marcas}</div>
      <div class="pv-res"><b>${fmt(minApto/60,1)} h</b> em condição adequada ${ehHoje?'até agora':'no dia'}</div>
      <div class="pv-jan">${janelas.length?janelas.map(t=>`<span class="pv-chip">${hm(t.ini)}–${hm(t.fim+1>1439?1439:t.fim+1)}</span>`).join(''):`<span class="pv-nenhuma">Nenhuma janela contínua de ${JANELA.minJanela} min ou mais.</span>`}</div>
      <div class="pv-leg"><span><i style="background:#22c55e"></i>adequado</span><span><i style="background:#ef4444"></i>inadequado</span><span><i style="background:#d6d3cb"></i>sem dados</span></div>
      <div class="nota">Critério: Delta T ${JANELA.dtMin}–${JANELA.dtMax} °C, vento médio ${JANELA.ventoMin>0?JANELA.ventoMin+'–'+JANELA.ventoMax:'até '+JANELA.ventoMax} km/h e sem chuva na última hora. Veja o gráfico "🎯 Delta T" abaixo.</div>
    </div>`;
}

const SERIES={
  t:     [{c:'t',   l:'Temperatura (°C)',      cor:'#dc2626'}, {c:'orv', l:'Ponto de orvalho (°C)', cor:'#0891b2'}],
  ur:    [{c:'ur',  l:'Umidade relativa (%)',  cor:'#2563eb'}],
  vento: [{c:'u',   l:'Vento médio (km/h)',    cor:'#16a34a', f:v=>v*3.6}, {c:'raj', l:'Rajada (km/h)', cor:'#f59e0b', f:v=>v*3.6}],
  rad:   [{c:'rad', l:'Radiação (W/m²)',       cor:'#eab308', fill:true}],
  chuva: [{c:'c24h',l:'Chuva 24 h (mm)',       cor:'#1d4ed8', fill:true}, {c:'ctx', l:'Intensidade (mm/h)', cor:'#7c3aed'}],
  janela:[{fn:deltaT,l:'Delta T (°C)',          cor:'#0f766e'}, {c:'u', l:'Vento médio (km/h)', cor:'#94a3b8', f:v=>v*3.6, eixo:'y1'}],
};
// Pinta a faixa ideal de Delta T (2–8 °C) no fundo do gráfico.
const faixaDeltaT={id:'faixaDeltaT', beforeDatasetsDraw(ch){
  const {ctx,chartArea:a,scales:{y}}=ch; if(!a||!y) return;
  const y1=y.getPixelForValue(JANELA.dtMax), y2=y.getPixelForValue(JANELA.dtMin);
  ctx.save(); ctx.fillStyle='rgba(34,197,94,.14)';
  const top=Math.max(a.top,Math.min(y1,y2)), bot=Math.min(a.bottom,Math.max(y1,y2));
  if(bot>top) ctx.fillRect(a.left,top,a.right-a.left,bot-top);
  ctx.restore();
}};
function renderGrafico(){
  if(_chartDia){ _chartDia.destroy(); _chartDia=null; }
  const cv=document.getElementById('grafDia');
  if(!cv||!diaDoc||diaDoc.vazio||typeof Chart==='undefined') return;
  const pts=decodificarPontos(diaDoc);
  const chaves=Object.keys(pts).sort();
  if(!chaves.length) return;
  // Eixo contínuo de minutos (buracos ficam como null → linha interrompida).
  const [h1,m1]=chaves[chaves.length-1].split(':').map(Number);
  const fim=diaSel===hojeEstacao()? h1*60+m1 : 1439;
  const labels=[]; for(let i=0;i<=fim;i++) labels.push(String(Math.floor(i/60)).padStart(2,'0')+':'+String(i%60).padStart(2,'0'));
  const datasets=SERIES[grafSel].map(s=>({
    label:s.l, borderColor:s.cor, backgroundColor:s.fill?s.cor+'33':s.cor, fill:!!s.fill,
    data:labels.map(k=>{ if(s.fn){ const x=pts[k]?s.fn(pts[k]):null; return x==null?null:+x.toFixed(2); } const v=pts[k]?.[s.c]; return v==null?null:(s.f?s.f(v):v); }),
    yAxisID:s.eixo||'y',
    borderWidth:1.6, pointRadius:0, tension:.2, spanGaps:false,
  }));
  _chartDia=new Chart(cv,{type:'line',data:{labels,datasets},options:{
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}},
    scales:{x:{ticks:{maxTicksLimit:8,maxRotation:0,font:{size:10}}}, y:{ticks:{font:{size:10}}, beginAtZero:grafSel!=='t', ...(grafSel==='janela'?{title:{display:true,text:'Delta T (°C)',font:{size:10}}}:{})},
      ...(grafSel==='janela'?{y1:{position:'right',beginAtZero:true,grid:{drawOnChartArea:false},ticks:{font:{size:10}},title:{display:true,text:'vento (km/h)',font:{size:10}}}}:{})},
  }, plugins: grafSel==='janela' ? [faixaDeltaT] : []});
}

function histHtml(){
  return `<div class="card">
      <div class="card-tit">Últimos dias <span class="card-sub">ETo × chuva</span></div>
      <div id="histBalanco"></div>
      <div class="graf-box hist"><canvas id="grafHist"></canvas></div>
      <div id="histTabela"></div>
    </div>`;
}
function renderHistorico(){
  if(_chartHist){ _chartHist.destroy(); _chartHist=null; }
  const tab=document.getElementById('histTabela'); if(!tab) return;
  const box=document.getElementById('grafHist')?.parentElement;
  if(box) box.style.display=resumos.length?'':'none';
  if(!resumos.length){ tab.innerHTML='<div class="vazio pq">Ainda sem histórico.</div>'; document.getElementById('histBalanco').innerHTML=''; return; }
  const hoje=hojeEstacao();
  const bal=n=>{
    const ini=somarDias(hoje,-n);
    const ds=resumos.filter(r=>r.data>ini && r.data<hoje && r.completo);
    const eto=ds.reduce((a,r)=>a+(r.ETo||0),0), ch=ds.reduce((a,r)=>a+(r.chuvaMm||0),0);
    return {n:ds.length,eto,ch,saldo:ch-eto};
  };
  const b7=bal(7), b30=bal(30);
  const cel=(b,rot,tot)=>`<div class="bal"><div class="bal-tit">${rot}</div>
      ${b.n?`<div class="bal-lin"><span>ETo</span><b>${fmt(b.eto,1)} mm</b></div>
      <div class="bal-lin"><span>Chuva</span><b>${fmt(b.ch,1)} mm</b></div>
      <div class="bal-lin saldo ${b.saldo<0?'neg':'pos'}"><span>Saldo</span><b>${b.saldo>0?'+':''}${fmt(b.saldo,1)} mm</b></div>
      <div class="bal-n">${b.n} de ${tot} dias completos</div>`:'<div class="bal-n">sem dias completos</div>'}</div>`;
  document.getElementById('histBalanco').innerHTML=`<div class="bal-grid">${cel(b7,'7 dias',7)}${cel(b30,'30 dias',30)}</div>`;

  const ord=[...resumos].sort((a,b)=>a.data<b.data?-1:1);
  const cv=document.getElementById('grafHist');
  if(cv && typeof Chart!=='undefined'){
    _chartHist=new Chart(cv,{type:'bar',data:{
      labels:ord.map(r=>formatarData(r.data).slice(0,5)),
      datasets:[
        {label:'ETo (mm)', data:ord.map(r=>r.ETo??null), backgroundColor:ord.map(r=>r.completo?'#f59e0b':'#fcd9a0')},
        {label:'Chuva (mm)', data:ord.map(r=>r.chuvaMm??null), backgroundColor:'#3b82f6'},
      ]},options:{responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}},
        scales:{x:{ticks:{font:{size:10},maxRotation:0,autoSkip:true}},y:{beginAtZero:true,ticks:{font:{size:10}}}}}});
  }
  tab.innerHTML=`<table class="htab"><thead><tr><th>Dia</th><th>Mín/Máx</th><th>Chuva</th><th>ETo</th></tr></thead><tbody>
    ${resumos.map(r=>`<tr class="${r.data===diaSel?'sel':''}" onclick="setDia('${sanitizar(r.data)}')">
      <td>${formatarData(r.data).slice(0,5)}</td>
      <td>${fmt(r.Tmin,0)}–${fmt(r.Tmax,0)}°</td>
      <td>${fmt(r.chuvaMm,1)}</td>
      <td>${fmt(r.ETo,1)}${r.completo?'':'<span class="parc" title="dia incompleto">*</span>'}</td></tr>`).join('')}
    </tbody></table>
    <div class="nota">* dia incompleto (menos de 90% dos minutos) — ETo aproximada. Toque num dia para abrir.</div>`;
}

window.toggleMenu=function(){ document.getElementById('menuLateral').classList.toggle('aberto'); document.getElementById('menuOverlay').classList.toggle('aberto'); };
window.fecharMenu=function(){ document.getElementById('menuLateral').classList.remove('aberto'); document.getElementById('menuOverlay').classList.remove('aberto'); };
