const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

enableMultiTabIndexedDbPersistence(db).catch(() => {});

// DIAGNÓSTICO TEMPORÁRIO — mostra erros/timeout direto na tela de carregamento
window.addEventListener('error', (e) => {
  const ls = document.getElementById('loadingScreen');
  if (ls) ls.innerHTML += `<div style="margin-top:14px;padding:10px;background:#fee2e2;color:#991b1b;font-size:11px;text-align:left;border-radius:6px;word-break:break-all;">ERRO JS: ${e.message}<br>${e.filename}:${e.lineno}</div>`;

  if (ls) ls.innerHTML += `<div style="margin-top:14px;padding:10px;background:#fee2e2;color:#991b1b;font-size:11px;text-align:left;border-radius:6px;word-break:break-all;">ERRO (promise): ${e.reason?.message || e.reason}</div>`;

setTimeout(() => {
  const ls = document.getElementById('loadingScreen');
  if (ls && ls.style.display !== 'none') {
    ls.innerHTML += `<div style="margin-top:14px;padding:10px;background:#fef3dc;color:#7c4f0a;font-size:11px;text-align:left;border-radius:6px;">⏱ 8s sem resposta do Firebase (Auth/Firestore). Provável bloqueio de rede ou problema no projeto Firebase.</div>`;
  }
}, 8000);

let perfilAtual = {};
let talhoes = [], planosAdubacao = [], pulverizacoes = [], drenchPrevencao = [], estoqueProdutos = [];
let estacoes = [];               // clima/{id} — estações meteorológicas
const climaDia = {};             // estacaoId → doc de clima/{id}/dias/{hoje}
const climaUnsub = {};
let pendTipo = 'todos';          // filtro da seção Pendências
const pendAbertas = new Set();   // fazendas expandidas (sobrevive aos re-renders do onSnapshot)

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  const snap = await getDoc(doc(db, 'usuarios', user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil === 'admin') {
    perfilAtual.modulos = { mapa:'admin', atividades:'admin', adubacao:'admin', config:'admin', pulverizacao:'admin', pedidos:'admin', admin:'admin', equipe:'admin' };
  }
  document.getElementById('userNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'flex';
  gerarMenu(perfilAtual);
  // Atalhos: só os que o usuário consegue abrir (mesma regra do menu)
  document.querySelectorAll('.atalho-btn[data-mod]').forEach(a => { if (!podeAbrir(perfilAtual, a.dataset.mod)) a.remove(); });
  iniciarListeners();
});



function iniciarListeners() {
  onSnapshot(collection(db,'talhoes'), snap => {
    talhoes = snap.docs.map(d => ({_docId:d.id,...d.data()}));
    atualizarDashboard();
  });
  onSnapshot(collection(db,'planosAdubacao'), snap => {
    planosAdubacao = snap.docs.map(d => ({_docId:d.id,...d.data()}));
    atualizarDashboard();
  });
  onSnapshot(collection(db,'pulverizacoes'), snap => {
    pulverizacoes = snap.docs.map(d => ({_docId:d.id,...d.data()}));
    atualizarDashboard();
  });
  onSnapshot(collection(db,'drenchPrevencao'), snap => {
    drenchPrevencao = snap.docs.map(d => ({_docId:d.id,...d.data()}));
    atualizarDashboard();
  });
  onSnapshot(collection(db,'estoque_produtos'), snap => {
    estoqueProdutos = snap.docs.map(d => ({_docId:d.id,...d.data()}));
    atualizarDashboard();
  });
  ouvirClima();
}

function atualizarDashboard() {
  atualizarGaugeAdubacao();
  atualizarPendencias();
}

// ── GAUGE — % da adubação confirmada NESTE mês (não a safra toda, pra refletir o ritmo atual) ──
function pctPlanosMes(mesIdx, ano) {
  const planos = planosAdubacao.filter(p => { const ma = planoMesAno(p); return ma && ma.mesIdx === mesIdx && ma.ano === ano; });
  const total = planos.reduce((s,p) => s + (p.aplicacoes||[]).length, 0);
  const feitas = planos.reduce((s,p) => s + (p.aplicacoes||[]).filter(a => a.feito).length, 0);
  return { total, feitas, pct: total ? Math.round(feitas/total*100) : 0 };
}

// % concluído do mês, filtrado por fazenda (ou geral quando fazenda é null)
function pctPlanosMesFazenda(mesIdx, ano, fazenda) {
  const planos = planosAdubacao.filter(p => { const ma = planoMesAno(p); return ma && ma.mesIdx === mesIdx && ma.ano === ano && (!fazenda || p.fazenda === fazenda); });
  const total = planos.reduce((s,p) => s + (p.aplicacoes||[]).length, 0);
  const feitas = planos.reduce((s,p) => s + (p.aplicacoes||[]).filter(a => a.feito).length, 0);
  return { total, feitas, pct: total ? Math.round(feitas/total*100) : 0 };
}

function atualizarGaugeAdubacao() {
  const hoje = new Date();
  const mesIdx = hoje.getMonth(), ano = hoje.getFullYear();
  const mesAntIdx = mesIdx === 0 ? 11 : mesIdx - 1, mesAntAno = mesIdx === 0 ? ano - 1 : ano;

  // Resumo geral (texto compacto no cabeçalho, não é mais um gauge sozinho)
  const geral = pctPlanosMes(mesIdx, ano);
  const anterior = pctPlanosMes(mesAntIdx, mesAntAno);
  const subEl = document.getElementById('gaugeSub');
  const trendEl = document.getElementById('gaugeTrend');
  if (subEl) subEl.textContent = geral.total ? `Geral: ${geral.pct}% (${geral.feitas}/${geral.total})` : 'Sem plano para este mês';
  if (trendEl) {
    if (geral.total && anterior.total) {
      const dif = geral.pct - anterior.pct;
      const sinal = dif >= 0 ? '+' : '';
      trendEl.textContent = `${sinal}${dif}pp vs mês anterior`;
      trendEl.className = 'trend-badge ' + (dif >= 0 ? 'trend-up' : 'trend-down');
      trendEl.style.display = 'inline-flex';
    } else {
      trendEl.style.display = 'none';
    }
  }

  // Um anel por fazenda — mostra quem já tá em dia e quem tá ficando pra trás
  const cont = document.getElementById('gaugeFazendas');
  if (!cont) return;
  const fazendas = [...new Set(talhoes.map(t => t.fazenda).filter(Boolean))].sort((a,b) => a.localeCompare(b,'pt-BR'));
  if (!fazendas.length) { cont.innerHTML = ''; return; }
  cont.innerHTML = fazendas.map(faz => {
    const { total, feitas, pct } = pctPlanosMesFazenda(mesIdx, ano, faz);
    const cor = !total ? 'var(--cb)' : pct >= 80 ? '#16a34a' : pct >= 40 ? '#f59e0b' : '#dc2626';
    return `<a href="adubacoes.html" class="faz-gauge-item" title="${faz}: ${total?feitas+'/'+total+' confirmadas':'sem plano este mês'}">
      <div class="faz-gauge-ring" style="--p:${pct};--cor:${cor};"><span class="faz-gauge-val">${total?pct+'%':'—'}</span></div>
      <div class="faz-gauge-lbl">${faz}</div>
    </a>`;
  }).join('');
}

// ── CLIMA AGORA — última leitura de cada estação (mesmos docs que clima.html lê) ──
function climaFazPermitida(faz) {
  if (adminDoSistema(perfilAtual) || !faz) return true;
  const p = perfilAtual.fazendasModulo?.clima;
  return !p || !p.length || p.includes(faz);
}
// Dia de hoje no fuso da estação — os docs de dias/ usam o dia local dela.
function hojeNoFuso(fuso) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: fuso || 'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
}
function minutosAgoraNoFuso(fuso) {
  const [h, m] = new Intl.DateTimeFormat('en-GB', { timeZone: fuso || 'America/Sao_Paulo', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(new Date()).split(':').map(Number);
  return h * 60 + m;
}
// pontos {"HH:MM": "v1,v2,..."} na ordem de `campos` → última leitura como {campo: valor}
function ultimaLeitura(diaDoc) {
  const campos = (diaDoc?.campos || []).map(c => typeof c === 'string' ? c : c.nome);
  const chaves = Object.keys(diaDoc?.pontos || {}).sort();
  if (!chaves.length) return null;
  const k = chaves[chaves.length - 1];
  const partes = String(diaDoc.pontos[k]).split(',');
  const o = { hora: k };
  campos.forEach((c, i) => { const v = partes[i]; o[c] = (v === undefined || v === '') ? null : parseFloat(v); });
  return o;
}
function fmtN(n, d = 1) { if (n == null || isNaN(n) || !isFinite(n)) return '—'; return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function setorVento(g) { if (g == null) return ''; const S = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO']; return S[Math.round(g / 22.5) % 16]; }

function ouvirClima() {
  if (!podeAbrir(perfilAtual, 'clima')) return;
  onSnapshot(collection(db, 'clima'), snap => {
    estacoes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(e => climaFazPermitida(e.fazenda))
      .sort((a, b) => String(a.nome || a.id).localeCompare(String(b.nome || b.id), 'pt-BR'));
    const ids = new Set(estacoes.map(e => e.id));
    Object.keys(climaUnsub).forEach(id => { if (!ids.has(id)) { climaUnsub[id](); delete climaUnsub[id]; delete climaDia[id]; } });
    estacoes.forEach(e => {
      if (climaUnsub[e.id]) return;
      climaUnsub[e.id] = onSnapshot(doc(db, 'clima', e.id, 'dias', hojeNoFuso(e.fuso)), s => {
        climaDia[e.id] = s.exists() ? s.data() : { vazio: true };
        renderClima();
      }, () => { climaDia[e.id] = { vazio: true }; renderClima(); });
    });
    renderClima();
  }, () => {});
}

function renderClima() {
  const sec = document.getElementById('secClima'), cont = document.getElementById('climaWidget');
  if (!sec || !cont) return;
  if (!estacoes.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  cont.innerHTML = estacoes.map(e => {
    const dia = climaDia[e.id];
    const nome = esc(e.nome || e.id);
    const abrir = `onclick="abrirEstacao(${estacoes.indexOf(e)})"`;
    if (!dia) return `<a class="clima-card" ${abrir}><div class="clima-topo"><span class="clima-nome">📡 ${nome}</span></div><div class="clima-vazio">Carregando…</div></a>`;
    const p = ultimaLeitura(dia);
    if (dia.vazio || !p) return `<a class="clima-card" ${abrir}><div class="clima-topo"><span class="clima-nome">📡 ${nome}</span></div><div class="clima-vazio">Sem leituras hoje.</div></a>`;
    const r = dia.resumo || {};
    const [hh, mm] = p.hora.split(':').map(Number);
    const atraso = minutosAgoraNoFuso(e.fuso) - (hh * 60 + mm);
    const quando = atraso <= 1 ? 'agora' : atraso < 60 ? `há ${atraso} min` : `às ${p.hora}`;
    return `<a class="clima-card" ${abrir}>
      <div class="clima-topo"><span class="clima-nome">📡 ${nome}</span><span class="clima-quando${atraso > 30 ? ' velho' : ''}">${quando}</span></div>
      <div class="clima-meio">
        <div class="clima-temp">${fmtN(p.t, 1)}<small>°C</small></div>
        <div class="clima-minmax">${r.Tmax != null ? '↑ ' + fmtN(r.Tmax, 1) + '°' : ''}<br>${r.Tmin != null ? '↓ ' + fmtN(r.Tmin, 1) + '°' : ''}</div>
      </div>
      <div class="clima-dados">
        <div class="clima-dado"><div class="clima-dado-val">${fmtN(p.ur, 0)}<small>%</small></div><div class="clima-dado-lbl">Umidade</div></div>
        <div class="clima-dado"><div class="clima-dado-val">${fmtN(p.u != null ? p.u * 3.6 : null, 1)}<small>km/h</small></div><div class="clima-dado-lbl">Vento ${setorVento(p.dir)}</div></div>
        <div class="clima-dado"><div class="clima-dado-val">${fmtN(r.chuvaMm ?? p.c24h, 1)}<small>mm</small></div><div class="clima-dado-lbl">Chuva hoje</div></div>
      </div>
    </a>`;
  }).join('');
}
// Abre clima.html já na estação tocada (mesma chave de localStorage que clima.html usa)
window.abrirEstacao = function(i) {
  const e = estacoes[i];
  try { if (e) localStorage.setItem('climaEstacao', e.id); } catch (_) {}
  window.location.href = 'clima.html';
};

// ── PENDÊNCIAS — só o que está ATRASADO (data planejada < hoje e não feito), agrupado por fazenda ──
// Programado para o futuro não é pendência (regra do sistema, ver CLAUDE.md). Estoque abaixo do
// mínimo entra como alerta da fazenda dona do produto.
const TIPOS_PEND = {
  adub:   { ico:'🧪', label:'Adubação',     mod:'adubacao',     href:'adubacoes.html' },
  pulv:   { ico:'💧', label:'Pulverização', mod:'pulverizacao', href:'pulverizacoes.html' },
  drench: { ico:'🌱', label:'Drench',       mod:'drench',       href:'drench.html' },
  est:    { ico:'📦', label:'Estoque',      mod:'estoque',      href:'estoque.html' },
};
const MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const semAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

function pendFazPermitida(mod, faz) {
  if (adminDoSistema(perfilAtual) || !faz) return true;
  const p = perfilAtual.fazendasModulo?.[mod];
  return !p || !p.length || p.includes(faz);
}
// Mês/ano do plano: mesIdx/ano quando existem, senão "Julho/2026" ou "2026-07" (os dois formatos do mesAno)
// mesAno primeiro (inequívoco); mesIdx só na falta — planos antigos do Planejamento têm mesIdx 1-12
function planoMesAno(p) {
  const s = String(p.mesAno || '');
  let m = s.match(/^(\d{4})-(\d{2})/);
  if (m) return { mesIdx: Number(m[2]) - 1, ano: Number(m[1]) };
  m = s.match(/^([^/]+)\/(\d{4})$/);
  if (m) { const i = MESES_NOME.findIndex(n => semAcento(n) === semAcento(m[1])); if (i >= 0) return { mesIdx: i, ano: Number(m[2]) }; }
  if (Number.isInteger(p.mesIdx) && p.mesIdx >= 0 && p.mesIdx <= 11 && p.ano) return { mesIdx: p.mesIdx, ano: Number(p.ano) };
  return null;
}
function diasEntre(isoA, isoB) { return Math.round((new Date(isoB + 'T12:00:00') - new Date(isoA + 'T12:00:00')) / 86400000); }
function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function calcPendencias() {
  const hoje = isoLocal(new Date());
  const itens = [];
  const visivel = k => podeAbrir(perfilAtual, TIPOS_PEND[k].mod);
  const add = (tipo, faz, o) => { if (pendFazPermitida(TIPOS_PEND[tipo].mod, faz)) itens.push({ tipo, faz: faz || 'Sem fazenda', ...o }); };

  // Adubação: um item por talhão (não por mês), senão o mesmo talhão aparece repetido a cada mês vencido
  if (visivel('adub')) {
    const porTalhao = {};
    planosAdubacao.forEach(p => {
      const n = (p.aplicacoes || []).filter(a => !a.feito).length;
      const ma = planoMesAno(p);
      if (!n || !ma) return;
      const ultimoDia = isoLocal(new Date(ma.ano, ma.mesIdx + 1, 0));
      if (ultimoDia >= hoje) return;   // mês ainda não acabou → programado
      const chave = (p.fazenda || '') + '|' + (p.talhaoId || p.talhaoNome || '');
      const g = porTalhao[chave] = porTalhao[chave] || { faz: p.fazenda, nome: p.talhaoNome || 'Talhão', meses: [], aplic: 0, maisAntigo: ultimoDia };
      g.meses.push(ma); g.aplic += n;
      if (ultimoDia < g.maisAntigo) g.maisAntigo = ultimoDia;
    });
    Object.values(porTalhao).forEach(g => {
      g.meses.sort((a, b) => a.ano - b.ano || a.mesIdx - b.mesIdx);
      const rot = m => `${MESES_NOME[m.mesIdx].slice(0, 3)}/${String(m.ano).slice(2)}`;
      const periodo = g.meses.length === 1 ? `${MESES_NOME[g.meses[0].mesIdx]}/${g.meses[0].ano}` : `${g.meses.length} meses (${rot(g.meses[0])} → ${rot(g.meses[g.meses.length - 1])})`;
      add('adub', g.faz, { nome: g.nome, sub: `${periodo} · ${g.aplic} aplicaç${g.aplic > 1 ? 'ões' : 'ão'} sem confirmar`, dias: diasEntre(g.maisAntigo, hoje) });
    });
  }
  if (visivel('pulv')) pulverizacoes.filter(p => !p.realizada && p.data && p.data < hoje).forEach(p => {
    add('pulv', p.fazenda, { nome: p.talhaoNome || 'Talhão', sub: `Programada p/ ${formatarData(p.data)}`, dias: diasEntre(p.data, hoje) });
  });
  if (visivel('drench')) drenchPrevencao.filter(d => (d.status || 'pendente') !== 'realizado' && d.data && d.data < hoje).forEach(d => {
    add('drench', d.fazenda, { nome: d.talhaoNome || 'Talhão', sub: `Programado p/ ${formatarData(d.data)}`, dias: diasEntre(d.data, hoje) });
  });
  if (visivel('est')) estoqueProdutos.filter(p => (p.estoqueMinimo || 0) > 0 && (Number(p.saldo) || 0) < Number(p.estoqueMinimo)).forEach(p => {
    add('est', p.fazenda, { nome: p.nome || 'Produto', sub: `Saldo ${fmtN(Number(p.saldo) || 0, 0)} ${p.unidade || ''} · mínimo ${fmtN(Number(p.estoqueMinimo), 0)}`, dias: null });
  });
  return { itens, tiposVisiveis: Object.keys(TIPOS_PEND).filter(visivel) };
}

let pendFazOrdem = [];
function atualizarPendencias() {
  const lista = document.getElementById('pendLista'), resumo = document.getElementById('pendResumo'), filtros = document.getElementById('pendFiltros');
  if (!lista) return;
  const { itens, tiposVisiveis } = calcPendencias();
  if (pendTipo !== 'todos' && !tiposVisiveis.includes(pendTipo)) pendTipo = 'todos';

  const contTipo = k => itens.filter(i => i.tipo === k).length;
  filtros.innerHTML = itens.length ? [
    `<button class="pend-filtro${pendTipo === 'todos' ? ' ativo' : ''}" onclick="setPendTipo('todos')">Todas <span class="n">${itens.length}</span></button>`,
    ...tiposVisiveis.filter(k => contTipo(k)).map(k => `<button class="pend-filtro${pendTipo === k ? ' ativo' : ''}" onclick="setPendTipo('${k}')">${TIPOS_PEND[k].ico} ${TIPOS_PEND[k].label} <span class="n">${contTipo(k)}</span></button>`)
  ].join('') : '';

  const filtrados = pendTipo === 'todos' ? itens : itens.filter(i => i.tipo === pendTipo);
  const porFaz = {};
  filtrados.forEach(i => (porFaz[i.faz] = porFaz[i.faz] || []).push(i));
  pendFazOrdem = Object.keys(porFaz).sort((a, b) => porFaz[b].length - porFaz[a].length || a.localeCompare(b, 'pt-BR'));

  const nFaz = pendFazOrdem.length;
  resumo.textContent = !itens.length ? 'Nada atrasado. Tudo em dia ✓'
    : `${filtrados.length} atrasada${filtrados.length > 1 ? 's' : ''} em ${nFaz} fazenda${nFaz > 1 ? 's' : ''} · toque numa fazenda para ver`;

  const fazendasTodas = [...new Set(talhoes.map(t => t.fazenda).filter(Boolean))];
  const emDia = fazendasTodas.filter(f => !porFaz[f]).sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const LIMITE = 5;

  lista.innerHTML = pendFazOrdem.map((faz, idx) => {
    const its = porFaz[faz];
    const aberta = pendAbertas.has(faz);
    const chips = tiposVisiveis.map(k => { const n = its.filter(i => i.tipo === k).length; return n ? `<span class="pend-tipo">${TIPOS_PEND[k].ico} ${n}</span>` : ''; }).join('');
    const corpo = !aberta ? '' : tiposVisiveis.map(k => {
      const g = its.filter(i => i.tipo === k).sort((a, b) => (b.dias ?? -1) - (a.dias ?? -1));
      if (!g.length) return '';
      const t = TIPOS_PEND[k];
      return `<div class="pend-grupo-tit">${t.ico} ${t.label}</div>` + g.slice(0, LIMITE).map(i => `
        <a href="${t.href}" class="pend-item">
          <div class="pend-item-info"><div class="pend-item-nome">${esc(i.nome)}</div><div class="pend-item-sub">${esc(i.sub)}</div></div>
          ${i.dias != null ? `<span class="pend-atraso${i.dias <= 7 ? ' leve' : ''}">${i.dias} dia${i.dias !== 1 ? 's' : ''}</span>` : '<span class="pend-atraso leve">abaixo do mín.</span>'}
        </a>`).join('') + (g.length > LIMITE ? `<a href="${t.href}" class="pend-mais">+ ${g.length - LIMITE} em ${t.label} →</a>` : '');
    }).join('');
    return `<div class="pend-faz${aberta ? ' aberta' : ''}">
      <div class="pend-faz-hdr" onclick="togglePendFaz(${idx})">
        <span class="pend-faz-nome">🏡 ${esc(faz)}</span>
        <span class="pend-faz-tipos">${chips}</span>
        <span class="pend-seta">▶</span>
      </div>
      <div class="pend-corpo">${corpo}</div>
    </div>`;
  }).join('') + (emDia.length ? `<div class="pend-ok"><b>✓ Em dia:</b> ${emDia.map(esc).join(' · ')}</div>` : '');
}
window.setPendTipo = function(t) { pendTipo = t; atualizarPendencias(); };
window.togglePendFaz = function(i) {
  const faz = pendFazOrdem[i]; if (!faz) return;
  if (pendAbertas.has(faz)) pendAbertas.delete(faz); else pendAbertas.add(faz);
  atualizarPendencias();
};

function formatarData(d) { if(!d)return'—'; const[a,m,dd]=d.split('-'); return`${dd}/${m}/${a}`; }

window.toggleMenu = function() {
  document.getElementById('menuLateral').classList.toggle('aberto');
  document.getElementById('menuOverlay').classList.toggle('aberto');
};
window.fecharMenu = function() {
  document.getElementById('menuLateral').classList.remove('aberto');
  document.getElementById('menuOverlay').classList.remove('aberto');
};
window.fazerLogout = async function() { await signOut(auth); window.location.href = 'login.html'; };
</script>
