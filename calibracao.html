// ─── AUTH ───
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual=user;
  const snap=await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual=snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil==='admin') perfilAtual.modulos={calibracao:'admin',admin:'admin'};
  if (!ehAdminSistema() && nivelAcesso('calibracao')==='nenhum') { window.location.href='index.html'; return; }
  document.getElementById('userNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserEmail').textContent=user.email;
  gerarMenu();
  renderTabs();
  renderTipo();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appContent').style.display='flex';
  iniciarListeners();
});

function nivelAcesso(mod) {
  const _mods = perfilAtual.modulos || {};
  if (_mods[mod]) return _mods[mod];
  const _heranca = { drench: 'pulverizacao', cotacoes: 'pedidos' };
  if (_heranca[mod] && _mods[_heranca[mod]]) return _mods[_heranca[mod]];
  if (perfilAtual.perfil === 'admin') return 'admin';
  return 'nenhum';
}
function ehAdminSistema(){ return Object.values(perfilAtual.modulos||{}).includes('admin') || perfilAtual.perfil==='admin'; }
function podeGerenciar(){ return ehAdminSistema() || nivelAcesso('calibracao')==='admin'; }
function podeRegistrar(){ return podeGerenciar() || ['gerente','encarregado','operador'].includes(nivelAcesso('calibracao')); }
function fazendaPermitida(fazenda){
  if (ehAdminSistema()) return true;
  const permitidas = perfilAtual.fazendasModulo?.calibracao;
  if (!permitidas || !permitidas.length) return true;
  return permitidas.includes(fazenda);
}

// ─── HELPERS ───
function hoje(){ return new Date().toISOString().slice(0,10); }
function formatarData(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function sanitizar(s){ return String(s==null?'':s).replace(/[<>&"']/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function num(id){ const el=document.getElementById(id); if(!el) return 0; const v=parseFloat(String(el.value).replace(',','.')); return isNaN(v)?0:v; }
function fmt(n,d){ if(n==null||isNaN(n)||!isFinite(n)) return '—'; return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
// aceita "1:30" (mm:ss), "1:30:00" (hh:mm:ss) ou segundos
function parseTempo(s){
  s=String(s||'').trim(); if(!s) return 0;
  if(s.includes(':')){ const p=s.split(':').map(x=>parseFloat(String(x).replace(',','.'))||0); return p.length===3? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
  return parseFloat(s.replace(',','.'))||0;
}

// Vazão: 3 medidas (litros + tempo em s) → média por bico; nº de bicos é informado à parte
function renderMedidas(){
  const box=document.getElementById('medidasLista'); if(!box) return;
  box.innerHTML=[0,1,2].map(i=>
    `<div class="bico-row2">
      <span class="bico-lbl">Medida ${i+1}</span>
      <div class="cg-inp"><input type="text" inputmode="decimal" id="medL${i}" placeholder="litros" oninput="calcular()"><span class="cg-un">L</span></div>
      <div class="cg-inp"><input type="text" inputmode="decimal" id="medT${i}" placeholder="tempo" oninput="calcular()"><span class="cg-un">s</span></div>
    </div>`
  ).join('');
}
// vazão (L/min) de uma medida a partir de litros + tempo(s)
function vazaoMedida(i){ const L=num('medL'+i), T=num('medT'+i); return T>0 ? L*60/T : 0; }

// ─── CÁLCULO ───
function velocidadeKmh(){
  const dist=num('distancia');
  const tempos=[parseTempo(document.getElementById('t1')?.value), parseTempo(document.getElementById('t2')?.value), parseTempo(document.getElementById('t3')?.value)].filter(x=>x>0);
  if(!dist || !tempos.length) return {v:0, tMed:0};
  const tMed=tempos.reduce((a,b)=>a+b,0)/tempos.length;
  return { v: 3.6*dist/tMed, tMed };
}
function calcAspersao(){
  const {v,tMed}=velocidadeKmh();
  const medidas=[0,1,2].map(i=>vazaoMedida(i)).filter(x=>x>0);
  const vazaoMedia=medidas.length ? medidas.reduce((a,b)=>a+b,0)/medidas.length : 0;
  const numBicos=num('numBicos');
  const vazaoTotal=vazaoMedia*numBicos;
  const largura=num('largura'), tanque=num('tanque');
  const lha=(v>0 && largura>0)? vazaoTotal*600/(v*largura) : 0;
  const haTanque=(lha>0 && tanque>0)? tanque/lha : 0;
  const autonomiaMin=(vazaoTotal>0 && tanque>0)? tanque/vazaoTotal : 0;
  return {v,tMed,nMedidas:medidas.length,numBicos,vazaoMedia,vazaoTotal,largura,tanque,lha,haTanque,autonomiaMin};
}
function calcDrench(){
  const {v,tMed}=velocidadeKmh();
  const vMmin=v*1000/60; // m/min
  const vazao=num('vazaoDrench');
  const esp=num('espPlantas'), tanque=num('tanque');
  const lMetro=(vazao>0 && vMmin>0)? vazao/vMmin : 0;
  const lPlanta=(lMetro>0 && esp>0)? lMetro*esp : 0;
  const metrosTanque=(lMetro>0 && tanque>0)? tanque/lMetro : 0;
  const autonomiaMin=(vazao>0 && tanque>0)? tanque/vazao : 0;
  return {v,tMed,vMmin,vazao,esp,tanque,lMetro,lPlanta,metrosTanque,autonomiaMin};
}
window.calcular=function(){
  const box=document.getElementById('calResultado'); if(!box) return;
  const R=(l,v,forte)=>`<div class="res-item ${forte?'forte':''}"><span class="res-lbl">${l}</span><span class="res-val">${v}</span></div>`;
  if(tipoAtual==='barra'||tipoAtual==='turbina'){
    const c=calcAspersao();
    if(!c.v && !c.vazaoTotal){ box.innerHTML=`<div class="res-vazio">Preencha os campos para calcular o resultado.</div>`; return; }
    box.innerHTML=`<div class="res-tit">📊 Resultado</div>
      ${R('Velocidade', c.v?fmt(c.v,2)+' km/h':'—')}
      ${R('Vazão média por bico', c.vazaoMedia ? (fmt(c.vazaoMedia,2)+' L/min'+(c.nMedidas?' ('+c.nMedidas+' medida'+(c.nMedidas!==1?'s':'')+')':'')) : '—')}
      ${R('Vazão total', c.vazaoTotal ? (fmt(c.vazaoTotal,2)+' L/min'+(c.numBicos?' · '+fmt(c.numBicos,0)+' bicos':'')) : '—')}
      ${R('Volume de calda', c.lha?fmt(c.lha,0)+' L/ha':'—', true)}
      ${R('Área por tanque', c.haTanque?fmt(c.haTanque,1)+' ha/tanque':'—', true)}
      ${R('Autonomia do tanque', c.autonomiaMin?fmt(c.autonomiaMin,0)+' min · '+fmt(c.autonomiaMin/60,1)+' h':'—')}`;
  } else if(tipoAtual==='drench'){
    const c=calcDrench();
    if(!c.v && !c.vazao){ box.innerHTML=`<div class="res-vazio">Preencha os campos para calcular o resultado.</div>`; return; }
    box.innerHTML=`<div class="res-tit">📊 Resultado</div>
      ${R('Velocidade', c.v?fmt(c.v,2)+' km/h · '+fmt(c.vMmin,1)+' m/min':'—')}
      ${R('Vazão das saídas', c.vazao?fmt(c.vazao,2)+' L/min':'—')}
      ${R('Volume por metro linear', c.lMetro?fmt(c.lMetro,3)+' L/m':'—', true)}
      ${c.esp?R('Volume por planta', c.lPlanta?fmt(c.lPlanta,3)+' L/planta':'—', true):''}
      ${R('Metros por tanque', c.metrosTanque?fmt(c.metrosTanque,0)+' m/tanque':'—')}
      ${R('Autonomia do tanque', c.autonomiaMin?fmt(c.autonomiaMin,0)+' min · '+fmt(c.autonomiaMin/60,1)+' h':'—')}`;
  }
};

// ─── SALVAR ───
window.salvarCalibracao=async function(){
  if(!podeRegistrar()){ toast('⛔ Sem permissão.'); return; }
  const nome=(document.getElementById('calNome')?.value||'').trim();
  const fazenda=document.getElementById('calFazenda')?.value||'';
  const data=document.getElementById('calData')?.value||hoje();
  const obs=(document.getElementById('calObs')?.value||'').trim();
  const ajustes={
    marcha:document.getElementById('calMarcha')?.value||'',
    caixa:document.getElementById('calCaixa')?.value||'',
    rotacao:(document.getElementById('calRotacao')?.value||'').trim(),
    pressao:(document.getElementById('calPressao')?.value||'').trim()
  };
  let dados={}, resultado={};
  if(tipoAtual==='barra'||tipoAtual==='turbina'){
    const c=calcAspersao();
    if(!c.lha){ toast('⚠️ Preencha distância/tempo, as 3 medidas, nº de bicos e largura.'); return; }
    dados={ distancia:num('distancia'), tempos:[document.getElementById('t1').value,document.getElementById('t2').value,document.getElementById('t3').value], medidas:[0,1,2].map(i=>({litros:num('medL'+i),tempo:num('medT'+i),vazao:vazaoMedida(i)})), numBicos:c.numBicos, largura:c.largura, tanque:c.tanque };
    resultado={ velocidade:c.v, vazaoMedia:c.vazaoMedia, numBicos:c.numBicos, vazaoTotal:c.vazaoTotal, lha:c.lha, haTanque:c.haTanque, autonomiaMin:c.autonomiaMin };
  } else if(tipoAtual==='drench'){
    const c=calcDrench();
    if(!c.lMetro){ toast('⚠️ Preencha vazão, distância e tempo para calcular.'); return; }
    dados={ vazao:c.vazao, distancia:num('distancia'), tempos:[document.getElementById('t1').value,document.getElementById('t2').value,document.getElementById('t3').value], espPlantas:c.esp, tanque:c.tanque };
    resultado={ velocidade:c.v, lMetro:c.lMetro, lPlanta:c.lPlanta, metrosTanque:c.metrosTanque, autonomiaMin:c.autonomiaMin };
  }
  try{
    await addDoc(collection(db,'calibracoes'),{ tipo:tipoAtual, nome, fazenda, data, dados, resultado, ajustes, obs, criadoEm:new Date().toISOString(), criadoPor:usuarioAtual.email });
    toast('✅ Calibração salva!');
    ['calNome','calObs','distancia','t1','t2','t3','largura','tanque','vazaoDrench','espPlantas','calRotacao','calPressao','numBicos','medL0','medL1','medL2','medT0','medT1','medT2'].forEach(id=>{const e=document.getElementById(id); if(e)e.value='';});
    ['calMarcha','calCaixa'].forEach(id=>{const e=document.getElementById(id); if(e)e.value='';});
    if(tipoAtual!=='drench') renderMedidas();
    calcular();
  }catch(e){ toast('❌ Erro ao salvar: '+e.message); }
};

// ─── HISTÓRICO ───
function renderHist(){
  const box=document.getElementById('calHist'); if(!box) return;
  const lista=calibracoes.filter(c=>c.tipo===tipoAtual && fazendaPermitida(c.fazenda)).sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')));
  if(!lista.length){ box.innerHTML=`<div class="hist-vazio">Nenhuma calibração salva deste tipo ainda.</div>`; return; }
  box.innerHTML=`<div class="cal-secao-tit" style="margin:16px 0 8px;">📋 Calibrações salvas</div>`+lista.map(c=>{
    const r=c.resultado||{};
    const destaque = c.tipo==='drench'
      ? `${fmt(r.lMetro,3)} L/m${r.lPlanta?` · ${fmt(r.lPlanta,3)} L/planta`:''}`
      : `${fmt(r.lha,0)} L/ha · ${fmt(r.haTanque,1)} ha/tanque`;
    const aj=c.ajustes||{};
    const ajChips=[
      aj.marcha?`🕹️ Marcha ${sanitizar(aj.marcha)}`:'',
      aj.caixa?`🔀 Caixa ${sanitizar(aj.caixa)}`:'',
      aj.rotacao?`⚙️ ${sanitizar(aj.rotacao)} rpm`:'',
      aj.pressao?`💨 ${sanitizar(aj.pressao)} kgf/cm²`:''
    ].filter(Boolean);
    return `<div class="hist-cal">
      <div class="hist-cal-top">
        <div><b>${sanitizar(c.nome||'Sem nome')}</b> <span class="hist-cal-meta">· ${formatarData(c.data)}${c.fazenda?' · '+sanitizar(c.fazenda):''}</span></div>
        ${podeGerenciar()?`<button class="hist-del" onclick="excluirCalibracao('${c._docId}')">✕</button>`:''}
      </div>
      <div class="hist-cal-res">${destaque}${r.velocidade?` · ${fmt(r.velocidade,1)} km/h`:''}</div>
      ${ajChips.length?`<div class="hist-cal-ajustes">${ajChips.map(x=>`<span class="aj-chip">${x}</span>`).join('')}</div>`:''}
      ${c.obs?`<div class="hist-cal-obs">💬 ${sanitizar(c.obs)}</div>`:''}
      <div class="hist-cal-por">${sanitizar(c.criadoPor||'')}</div>
    </div>`;
  }).join('');
}
let _delId=null;
window.excluirCalibracao=function(id){ _delId=id; const c=calibracoes.find(x=>x._docId===id); document.getElementById('confirmMsg').textContent=`Excluir a calibração "${c?.nome||''}"? Não dá pra desfazer.`; document.getElementById('ovConfirm').classList.add('open'); };
window._confirmResolve=async function(v){
  document.getElementById('ovConfirm').classList.remove('open');
  const id=_delId; _delId=null;
  if(v && id){ try{ await deleteDoc(doc(db,'calibracoes',id)); toast('🗑️ Excluída.'); }catch(e){ toast('❌ Erro: '+e.message); } }
};

window.toggleMenu=function(){ document.getElementById('menuLateral').classList.toggle('aberto'); document.getElementById('menuOverlay').classList.toggle('aberto'); };
window.fecharMenu=function(){ document.getElementById('menuLateral').classList.remove('aberto'); document.getElementById('menuOverlay').classList.remove('aberto'); };
window.fazerLogout=async function(){ await signOut(auth); window.location.href='login.html'; };

// Repopula o seletor de fazenda quando os talhões carregam (preserva a seleção atual)
function atualizarFazendasSelect(){
  const sel=document.getElementById('calFazenda'); if(!sel) return;
  const atual=sel.value;
  const fazendas=[...new Set(talhoes.map(x=>x.fazenda).filter(Boolean))].filter(fazendaPermitida).sort();
  sel.innerHTML=`<option value="">—</option>`+fazendas.map(f=>`<option value="${sanitizar(f)}">${sanitizar(f)}</option>`).join('');
  if(atual && fazendas.includes(atual)) sel.value=atual;
}
function iniciarListeners(){
  onSnapshot(collection(db,'talhoes'), snap => { talhoes=snap.docs.map(d=>({_docId:d.id,...d.data()})); atualizarFazendasSelect(); });
  onSnapshot(collection(db,'calibracoes'), snap => { calibracoes=snap.docs.map(d=>({_docId:d.id,...d.data()})); renderHist(); });
}
</script>
