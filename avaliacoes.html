// ─── AUTH ───
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual=user;
  const snap=await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual=snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil==='admin') perfilAtual.modulos={mapa:'admin',adubacao:'admin',avaliacoes:'admin',admin:'admin'};
  if (!ehAdminSistema() && nivelAcesso('avaliacoes')==='nenhum') { window.location.href='index.html'; return; }
  document.getElementById('userNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserEmail').textContent=user.email;
  gerarMenu();
  if (podeRegistrar()) document.getElementById('marcarBar').style.display='flex';
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appContent').style.display='flex';
  iniciarMapa();
  iniciarListeners();
});

function nivelAcesso(mod) {
  const _mods = perfilAtual.modulos || {};
  if (_mods[mod]) return _mods[mod];
  const _heranca = { drench: 'pulverizacao', cotacoes: 'pedidos' };
  if (_heranca[mod] && _mods[_heranca[mod]]) return _mods[_heranca[mod]];
  if (perfilAtual.perfil === 'admin') return 'admin';
  return 'nenhum';
}
function ehAdminSistema(){ return Object.values(perfilAtual.modulos||{}).includes('admin') || perfilAtual.perfil==='admin'; }
function podeGerenciar(){ return ehAdminSistema() || nivelAcesso('avaliacoes')==='admin'; }
function podeRegistrar(){ return podeGerenciar() || ['gerente','encarregado','operador'].includes(nivelAcesso('avaliacoes')); }
function fazendaPermitida(fazenda){
  if (ehAdminSistema()) return true;
  const permitidas = perfilAtual.fazendasModulo?.avaliacoes;
  if (!permitidas || !permitidas.length) return true;
  return permitidas.includes(fazenda);
}

  const isAdm = ehAdminSistema();
  const pg = (window.location.pathname.split('/').pop() || 'index.html');
  const secoes = [
    { label: 'Principal', items: [
      { href:'index.html',         ico:'📊', label:'Dashboard' },
      { href:'agenda.html',        ico:'📅', label:'Agenda' },
      { href:'mapa.html',          ico:'🗺️', label:'Mapa de Talhões',   acesso:'mapa' },
      { href:'adubacoes.html',     ico:'🧪', label:'Adubações',         acesso:'adubacao' },
      { href:'pulverizacoes.html', ico:'💧', label:'Pulverizações',     acesso:'pulverizacao' },
      { href:'drench.html',        ico:'🌱', label:'Drench Preventivo', acesso:'drench' },
      { href:'irrigacao.html',     ico:'💦', label:'Irrigação',         acesso:'irrigacao' },
      { href:'herbicida.html',     ico:'🌿', label:'Herbicida',         acesso:'herbicida' },
      { href:'atividades.html',    ico:'🌾', label:'Atividades',        acesso:'atividades' },
      { href:'equipe.html',        ico:'👥', label:'Equipe',            acesso:'equipe' },
      { href:'estoque.html',       ico:'🏬', label:'Estoque',           acesso:'estoque' },
      { href:'pedidos.html',       ico:'📦', label:'Pedidos',           acesso:'pedidos' },
      { href:'cotacoes.html',      ico:'💰', label:'Cotações',          acesso:'cotacoes' },
      { href:'avaliacoes.html',    ico:'📍', label:'Avaliações',        acesso:'avaliacoes' },
    ]},
    { label: 'Análise', items: [
      { href:'gestao.html',        ico:'📈', label:'Gestão',            acesso:'gestao' },
      { href:'analises.html',      ico:'🔬', label:'Análises',          acesso:'analises' },
      { href:'recomendacoes.html', ico:'💊', label:'Recomendações',     acesso:'recomendacoes' },
      { href:'planejamento.html',  ico:'🗓️', label:'Planejamento',      acesso:'planejamento' },
      ...(isAdm ? [{ href:'admin.html', ico:'⚙️', label:'Administração' }] : []),
    ]},
  ];
  document.getElementById('menuModulos').innerHTML = secoes.map(s => {
    const html = s.items.map(m => {
      if (typeof nivelAcesso === 'function' && m.acesso && nivelAcesso(m.acesso) === 'nenhum') return '';
      return `<a class="menu-item${pg===m.href?' ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`;
    }).filter(Boolean).join('');
    return html ? `<div class="menu-secao">${s.label}</div>${html}` : '';
  }).join('');

// ─── HELPERS ───
function hoje(){ return new Date().toISOString().slice(0,10); }
function formatarData(d){ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function sanitizar(s){ return String(s==null?'':s).replace(/[<>&"']/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch])); }
function corFazenda(nome){ const cores=['#2563eb','#16a34a','#d97706','#7c3aed','#dc2626','#0891b2','#db2777','#65a30d']; let h=0; for(const c of String(nome||'')) h=(h*31+c.charCodeAt(0))%cores.length; return cores[h]; }
function normLatLngs(coords){ return (coords||[]).map(c=>{ if(Array.isArray(c)) return [c[0],c[1]]; if(c.lat!==undefined) return [c.lat,c.lng]; if(c.latitude!==undefined) return [c.latitude,c.longitude]; return c; }); }
function pontoNoPoligono(lat,lng,coords){
  const pts=normLatLngs(coords); let dentro=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const yi=pts[i][0],xi=pts[i][1],yj=pts[j][0],xj=pts[j][1];
    const inter=((yi>lat)!==(yj>lat)) && (lng < (xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
    if(inter)dentro=!dentro;
  }
  return dentro;
}
function talhaoDoPonto(lat,lng){ return talhoes.find(t=>t.coordenadas&&t.coordenadas.length>=3&&pontoNoPoligono(lat,lng,t.coordenadas)); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
// Comprime a imagem no próprio dispositivo (redimensiona + JPEG) → dataURI leve p/ salvar no Firestore
function comprimirImagem(file, maxDim=1024, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/jpeg',quality)); }catch(err){ reject(err); }
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function plantasVisiveis(){ return plantas.filter(p=>fazendaPermitida(p.fazenda) && (filtroFazenda==='todas'||p.fazenda===filtroFazenda)); }
function registrosDaPlanta(id){ return registros.filter(r=>r.plantaId===id).sort((a,b)=>String(b.data||'').localeCompare(String(a.data||''))); }
function fotosDaPlanta(id){ return fotos.filter(f=>f.plantaId===id).slice().sort((a,b)=>String(a.data||a.criadoEm||'').localeCompare(String(b.data||b.criadoEm||''))); }
function fotosDoRegistro(id){ return fotos.filter(f=>f.registroId===id).sort((a,b)=>String(a.criadoEm||'').localeCompare(String(b.criadoEm||''))); }

// ─── MAPA ───
function iniciarMapa(){
  if(mapaIniciado) return; mapaIniciado=true;
  map=L.map('map',{center:[-18.7166,-40.4000],zoom:13,zoomControl:true,scrollWheelZoom:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}).addTo(map);
}
// Marca o ponto usando o GPS do celular (o avaliador já está no local)
window.marcarPorGps=function(){
  if(!podeRegistrar()){ toast('⛔ Sem permissão.'); return; }
  if(!navigator.geolocation){ toast('❌ GPS não disponível neste aparelho.'); return; }
  const b=document.getElementById('btnGps'); const txt=b.innerHTML; b.innerHTML='🎯 Localizando...'; b.disabled=true;
  navigator.geolocation.getCurrentPosition(pos=>{
    b.innerHTML=txt; b.disabled=false;
    const {latitude,longitude,accuracy}=pos.coords;
    tempLatLng={lat:latitude,lng:longitude};
    tempAccuracy=accuracy;
    tempTalhao=talhaoDoPonto(latitude,longitude);
    if(map) map.setView([latitude,longitude], 18, {animate:true});
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker=L.marker([latitude,longitude],{icon:iconePin('novo','')}).addTo(map);
    abrirModalPlanta();
  }, err=>{
    b.innerHTML=txt; b.disabled=false;
    const msg = err.code===1 ? 'permissão de localização negada' : (err.code===3 ? 'tempo esgotado, tente de novo' : 'sem sinal de GPS');
    toast('❌ '+msg);
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
};
function iconePin(tipo, badge){
  return L.divIcon({ className:'', html:`<div class="pin ${tipo}">📍${badge?`<span class="pin-badge">${badge}</span>`:''}</div>`, iconSize:[30,38], iconAnchor:[15,34], popupAnchor:[0,-30] });
}
function desenharTalhoes(){
  talhaoLayers.forEach(l=>map.removeLayer(l)); talhaoLayers=[];
  const bounds=[];
  talhoes.forEach(t=>{
    if(!t.coordenadas||t.coordenadas.length<3) return;
    if(!fazendaPermitida(t.fazenda)) return;
    const ll=normLatLngs(t.coordenadas); bounds.push(...ll);
    const poly=L.polygon(ll,{color:'#ffffff',weight:1.2,opacity:.6,fillColor:'#ffffff',fillOpacity:.05,interactive:false,dashArray:'4,4'}).addTo(map);
    poly.bindTooltip(sanitizar(t.nome||t.id),{permanent:false,direction:'center',className:'tal-tip'});
    talhaoLayers.push(poly);
  });
  if(bounds.length && !plantasVisiveis().length){ try{ map.fitBounds(bounds,{padding:[40,40],maxZoom:15}); }catch(e){} }
}
function renderPlantas(){
  Object.values(plantaMarkers).forEach(m=>map.removeLayer(m)); plantaMarkers={};
  const vis=plantasVisiveis(); const bounds=[];
  vis.forEach(p=>{
    if(p.lat==null||p.lng==null) return;
    const n=registrosDaPlanta(p._docId).length;
    const mk=L.marker([p.lat,p.lng],{icon:iconePin(plantaSel===p._docId?'sel':(n>0?'ok':'novo'), n||'')}).addTo(map);
    mk.bindTooltip(sanitizar((p.descricao||'').trim()||(p.codigoPlaqueta||'').trim()||'ponto'),{direction:'top'});
    mk.on('click',()=>selecionarPlanta(p._docId));
    plantaMarkers[p._docId]=mk;
    bounds.push([p.lat,p.lng]);
  });
  renderSidebar();
  if(bounds.length && !plantaSel){ try{ map.fitBounds(bounds,{padding:[60,60],maxZoom:17}); }catch(e){} }
}

// ─── SIDEBAR ───
function renderSidebar(){
  const fazSel=document.getElementById('filtroFaz');
  const fzs=[...new Set(plantas.filter(p=>fazendaPermitida(p.fazenda)).map(p=>p.fazenda).filter(Boolean))].sort();
  const atual=fazSel.value;
  fazSel.innerHTML=`<option value="todas">Todas as fazendas</option>`+fzs.map(f=>`<option value="${sanitizar(f)}">${sanitizar(f)}</option>`).join('');
  if(fzs.includes(atual)||atual==='todas') fazSel.value=atual;
  const cont=document.getElementById('sidebarList');
  const vis=plantasVisiveis();
  document.getElementById('sidebarCount').textContent=vis.length?`${vis.length} ponto${vis.length!==1?'s':''}`:'';
  if(!vis.length){ cont.innerHTML=`<div class="sb-vazio">Nenhum ponto marcado ainda.${podeRegistrar()?'<br>No pé da planta, toque em <b>🎯 Marcar aqui (GPS)</b>.':''}</div>`; return; }
  const porFaz={};
  vis.forEach(p=>{ const f=p.fazenda||'Sem fazenda'; (porFaz[f]=porFaz[f]||[]).push(p); });
  cont.innerHTML=Object.keys(porFaz).sort().map(f=>{
    const tituloDe=p=>((p.descricao||'').trim()||(p.codigoPlaqueta||'').trim()||'Ponto sem descrição');
    const itens=porFaz[f].sort((a,b)=>String(tituloDe(a)).localeCompare(String(tituloDe(b)),'pt',{numeric:true,sensitivity:'base'})).map(p=>{
      const n=registrosDaPlanta(p._docId).length;
      const nf=fotosDaPlanta(p._docId).length;
      const desc=(p.descricao||'').trim(), cod=(p.codigoPlaqueta||'').trim();
      return `<div class="msb-item ${plantaSel===p._docId?'active':''}" onclick="selPlanta('${p._docId}')">
        <span class="msb-dot" style="background:${n>0?'#16a34a':'#94a3b8'}"></span>
        <div class="msb-info">
          <div class="msb-nome">${sanitizar(tituloDe(p))}</div>
          <div class="msb-sub" style="color:var(--c)">${desc&&cod?`🏷️ ${sanitizar(cod)} · `:''}${sanitizar(p.talhaoNome||p.talhaoId||'—')} · ${n} aval.${nf?` · ${nf}📷`:''}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="sb-fazenda">🏡 ${sanitizar(f)}</div>${itens}`;
  }).join('');
}

// ─── PAINEL DA PLANTA ───
function selecionarPlanta(id){
  plantaSel=id; compA=null; compB=null; fotosNovas=[];
  const p=plantas.find(x=>x._docId===id); if(!p) return;
  if(p.lat!=null&&p.lng!=null) map.setView([p.lat,p.lng], Math.max(map.getZoom(),17), {animate:true});
  renderPlantas();
  const gm=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  const _desc=(p.descricao||'').trim(), _cod=(p.codigoPlaqueta||'').trim();
  document.getElementById('pNome').textContent=_desc||_cod||'Ponto sem descrição';
  document.getElementById('pFaz').innerHTML=`${_cod?`🏷️ ${sanitizar(_cod)} · `:''}${sanitizar(p.talhaoNome||p.talhaoId||'—')} · ${sanitizar(p.fazenda||'')}`;
  document.getElementById('pBody').innerHTML=`
    ${p.descricao?`<div class="secao"><div class="secao-tit">Descrição</div><div class="ult-val">${sanitizar(p.descricao)}</div></div>`:''}
    <div class="secao">
      <div class="secao-tit">Localização travada</div>
      <div class="loc-row">
        <span class="loc-coord">📍 ${Number(p.lat).toFixed(6)}, ${Number(p.lng).toFixed(6)}${p.precisaoGps!=null?` · 🎯 GPS ±${p.precisaoGps} m`:(p.origem==='mapa'?' · ponto do mapa':'')}</span>
        <a class="btn-maps" href="${gm}" target="_blank" rel="noopener">🧭 Abrir no Google Maps</a>
      </div>
    </div>
    <div id="cmpBox"></div>
    ${podeRegistrar()?`<div class="secao nova-aval">
      <div class="secao-tit">＋ Nova avaliação</div>
      <div class="fg"><label>Data</label><input type="date" id="avData" value="${hoje()}"></div>
      <div class="fg"><label>Observação</label><textarea id="avObs" rows="2" placeholder="O que observou neste ponto? (tratamento, sintoma, comparação...)"></textarea></div>
      <div class="foto-add">
        <label class="btn-foto">📷 Adicionar fotos<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="onFotoInput(this)"></label>
        <div id="avFotosPreview" class="foto-preview"></div>
      </div>
      <button class="btn-salvar-aval" onclick="salvarAvaliacao('${id}')">💾 Salvar avaliação</button>
    </div>`:''}
    <div class="secao"><div class="secao-tit">Histórico de avaliações</div><div id="avList"></div></div>`;
  renderAvaliacoesList(id);
  renderComparador(id);
  document.getElementById('panelActions').innerHTML = podeGerenciar()
    ? `<button class="btn-del-panel" onclick="excluirPlanta('${id}')">🗑 Excluir ponto</button>` : '';
  document.getElementById('infoPanel').classList.add('visible');
}
function renderAvaliacoesList(id){
  const box=document.getElementById('avList'); if(!box) return;
  const regs=registrosDaPlanta(id);
  if(!regs.length){ box.innerHTML=`<div class="hist-vazio">Nenhuma avaliação ainda.</div>`; return; }
  box.innerHTML=regs.map(r=>{
    const fs=fotosDoRegistro(r._docId);
    return `<div class="aval-row">
      <div class="aval-top">
        <span class="aval-data">📅 ${formatarData(r.data)}</span>
        ${podeGerenciar()?`<button class="hist-del" title="Excluir avaliação" onclick="excluirAvaliacao('${r._docId}')">✕</button>`:''}
      </div>
      ${r.observacao?`<div class="aval-obs">${sanitizar(r.observacao)}</div>`:''}
      ${fs.length?`<div class="aval-fotos">${fs.map(f=>`<img class="foto-thumb" src="${f.dataURI}" onclick="abrirLightbox('${f._docId}')">`).join('')}</div>`:''}
      <div class="aval-por">${sanitizar(r.criadoPor||'')}</div>
    </div>`;
  }).join('');
}
// Comparador antes/depois — sempre pareia fotos de DATAS DIFERENTES (mesmo local travado ao longo do tempo)
const _dataFoto=f=>String(f?.data||'').slice(0,10);
function intervaloTxt(dias){
  if(!dias||dias<=0) return 'mesmo dia';
  if(dias===1) return '1 dia';
  if(dias<30) return `${dias} dias`;
  const meses=Math.floor(dias/30), resto=dias%30;
  const mTxt=`${meses} ${meses>1?'meses':'mês'}`;
  return `${dias} dias · ~${resto?mTxt+' e '+resto+'d':mTxt}`;
}
function renderComparador(id){
  const box=document.getElementById('cmpBox'); if(!box) return;
  const fs=fotosDaPlanta(id); // ordenadas por data (asc)
  const datas=[...new Set(fs.map(_dataFoto).filter(Boolean))];
  if(datas.length<2){ box.innerHTML=''; return; } // precisa de pelo menos 2 datas para "antes × depois"
  // foto de referência escolhida (padrão: a mais recente)
  if(!compB || !fs.some(f=>f._docId===compB)) compB=fs[fs.length-1]._docId;
  const fb=fs.find(f=>f._docId===compB);
  const dB=_dataFoto(fb);
  // par de comparação sempre de DATA DIFERENTE: pega a data anterior mais próxima; se não houver, a posterior mais próxima
  const anteriores=fs.filter(f=>_dataFoto(f)<dB);
  const posteriores=fs.filter(f=>_dataFoto(f)>dB);
  const outra = anteriores.length ? anteriores[anteriores.length-1] : posteriores[posteriores.length-1];
  compA=outra._docId;
  // exibe sempre na ordem cronológica (antes = data menor, depois = data maior)
  const cronoA = _dataFoto(fb) <= _dataFoto(outra) ? fb : outra;
  const cronoB = _dataFoto(fb) <= _dataFoto(outra) ? outra : fb;
  const dias = Math.round((new Date(_dataFoto(cronoB)) - new Date(_dataFoto(cronoA)))/86400000);
  box.innerHTML=`<div class="secao">
    <div class="secao-tit">📸 Comparar antes / depois</div>
    <div class="cmp-pair">
      <div class="cmp-side"><div class="cmp-lbl antes">ANTES · ${formatarData(cronoA.data)}</div><img src="${cronoA.dataURI}" onclick="abrirLightbox('${cronoA._docId}')"></div>
      <div class="cmp-side"><div class="cmp-lbl depois">DEPOIS · ${formatarData(cronoB.data)}</div><img src="${cronoB.dataURI}" onclick="abrirLightbox('${cronoB._docId}')"></div>
    </div>
    <div class="cmp-intervalo">⏱️ <b>${intervaloTxt(dias)}</b> entre um monitoramento e o outro</div>
    <div class="cmp-hint">Toque numa foto abaixo: ela vira a referência e o par é montado com a data diferente mais próxima.</div>
    <div class="cmp-strip">${fs.map(f=>`<img class="cmp-mini ${f._docId===cronoB._docId?'on':(f._docId===cronoA._docId?'antes':'')}" src="${f.dataURI}" title="${formatarData(f.data)}" onclick="setComp('${f._docId}')">`).join('')}</div>
  </div>`;
}
window.setComp=function(fid){ compB=fid; renderComparador(plantaSel); };

// ─── AÇÕES (window bridges) ───
window.selPlanta=function(id){ selecionarPlanta(id); };
function abrirModalPlanta(){
  const sug=tempTalhao;
  const fzs=[...new Set(talhoes.map(t=>t.fazenda).filter(Boolean))].sort();
  const talOpts=talhoes.slice().sort((a,b)=>String(a.id||'').localeCompare(String(b.id||''),'pt',{numeric:true}))
    .map(t=>`<option value="${sanitizar(t.id||'')}" ${sug&&sug.id===t.id?'selected':''}>${sanitizar((t.id||'')+' · '+(t.nome||''))}</option>`).join('');
  document.getElementById('mpTalhao').innerHTML=`<option value="">— sem talhão —</option>`+talOpts;
  document.getElementById('mpCodigo').value='';
  document.getElementById('mpDesc').value='';
  document.getElementById('mpCoord').innerHTML=`📍 ${tempLatLng.lat.toFixed(6)}, ${tempLatLng.lng.toFixed(6)}`
    + (tempAccuracy!=null ? ` <span style="color:${tempAccuracy<=15?'#16a34a':(tempAccuracy<=40?'#d97706':'#dc2626')};font-weight:700;">· 🎯 GPS ±${Math.round(tempAccuracy)} m</span>` : ` <span style="color:var(--c);">· ponto do mapa</span>`);
  document.getElementById('overlayPlanta').classList.add('open');
  setTimeout(()=>document.getElementById('mpDesc').focus(),100);
}
window.fecharModalPlanta=function(){
  document.getElementById('overlayPlanta').classList.remove('open');
  if(tempMarker){ map.removeLayer(tempMarker); tempMarker=null; }
};
window.overlayPlantaClick=function(e){ if(e.target.id==='overlayPlanta') fecharModalPlanta(); };
window.salvarPlanta=async function(){
  if(!podeRegistrar()){ toast('⛔ Sem permissão.'); return; }
  if(!tempLatLng){ toast('⚠️ Toque no mapa para marcar o ponto.'); return; }
  const codigo=document.getElementById('mpCodigo').value.trim();
  const desc=document.getElementById('mpDesc').value.trim();
  const talId=document.getElementById('mpTalhao').value;
  const tal=talhoes.find(t=>t.id===talId);
  try{
    const ref=await addDoc(collection(db,'avaliacaoPlantas'),{
      codigoPlaqueta:codigo, descricao:desc,
      talhaoId:talId||'', talhaoNome:tal?.nome||'', fazenda:tal?.fazenda||'',
      lat:tempLatLng.lat, lng:tempLatLng.lng,
      precisaoGps: tempAccuracy!=null ? Math.round(tempAccuracy) : null,
      origem: tempAccuracy!=null ? 'gps' : 'mapa',
      criadoEm:new Date().toISOString(), criadoPor:usuarioAtual.email
    });
    if(tempMarker){ map.removeLayer(tempMarker); tempMarker=null; }
    document.getElementById('overlayPlanta').classList.remove('open');
    toast('✅ Ponto marcado!');
    setTimeout(()=>selecionarPlanta(ref.id),300);
  }catch(e){ toast('❌ Erro: '+e.message); }
};
window.onFotoInput=async function(input){
  const files=[...input.files]; input.value='';
  if(!files.length) return;
  toast('🖼️ Processando foto(s)...');
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{ fotosNovas.push(await comprimirImagem(f)); }catch(e){}
  }
  renderPreviewFotos();
};
function renderPreviewFotos(){
  const box=document.getElementById('avFotosPreview'); if(!box) return;
  box.innerHTML=fotosNovas.map((uri,i)=>`<div class="foto-prev-item"><img src="${uri}"><button onclick="removerFotoNova(${i})">✕</button></div>`).join('');
}
window.removerFotoNova=function(i){ fotosNovas.splice(i,1); renderPreviewFotos(); };
window.salvarAvaliacao=async function(plantaId){
  if(!podeRegistrar()){ toast('⛔ Sem permissão.'); return; }
  const obs=(document.getElementById('avObs')?.value||'').trim();
  const data=document.getElementById('avData')?.value||hoje();
  if(!obs && !fotosNovas.length){ toast('⚠️ Escreva uma observação ou adicione uma foto.'); return; }
  try{
    const ref=await addDoc(collection(db,'avaliacaoRegistros'),{ plantaId, data, observacao:obs, criadoEm:new Date().toISOString(), criadoPor:usuarioAtual.email });
    for(const uri of fotosNovas){
      await addDoc(collection(db,'avaliacaoFotos'),{ plantaId, registroId:ref.id, data, dataURI:uri, criadoEm:new Date().toISOString(), criadoPor:usuarioAtual.email });
    }
    fotosNovas=[]; renderPreviewFotos();
    if(document.getElementById('avObs')) document.getElementById('avObs').value='';
    toast('✅ Avaliação salva!');
  }catch(e){ toast('❌ Erro ao salvar: '+e.message+' (foto muito grande?)'); }
};
window.excluirAvaliacao=async function(regId){
  if(!podeGerenciar()){ toast('⛔ Sem permissão.'); return; }
  if(!confirm('Excluir esta avaliação e suas fotos?')) return;
  try{
    for(const f of fotos.filter(x=>x.registroId===regId)) await deleteDoc(doc(db,'avaliacaoFotos',f._docId));
    await deleteDoc(doc(db,'avaliacaoRegistros',regId));
    toast('🗑️ Avaliação excluída.');
  }catch(e){ toast('❌ Erro: '+e.message); }
};
window.excluirPlanta=async function(id){
  if(!podeGerenciar()){ toast('⛔ Sem permissão.'); return; }
  const p=plantas.find(x=>x._docId===id);
  if(!confirm(`Excluir o ponto "${p?.codigoPlaqueta||''}" com TODAS as suas avaliações e fotos? Não dá pra desfazer.`)) return;
  try{
    for(const f of fotos.filter(x=>x.plantaId===id)) await deleteDoc(doc(db,'avaliacaoFotos',f._docId));
    for(const r of registros.filter(x=>x.plantaId===id)) await deleteDoc(doc(db,'avaliacaoRegistros',r._docId));
    await deleteDoc(doc(db,'avaliacaoPlantas',id));
    fecharPainel();
    toast('🗑️ Ponto excluído.');
  }catch(e){ toast('❌ Erro: '+e.message); }
};
window.abrirLightbox=function(fid){
  const f=fotos.find(x=>x._docId===fid); if(!f) return;
  document.getElementById('lightboxImg').src=f.dataURI;
  document.getElementById('lightboxCap').textContent=formatarData(f.data);
  document.getElementById('lightbox').classList.add('open');
};
window.fecharLightbox=function(){ document.getElementById('lightbox').classList.remove('open'); };
window.fecharPainel=function(){ plantaSel=null; document.getElementById('infoPanel').classList.remove('visible'); renderPlantas(); };
function fecharPainel(){ window.fecharPainel(); }
window.setFiltroFaz=function(sel){ filtroFazenda=sel.value; renderPlantas(); };
window.toggleSidebar=function(){
  sidebarAberta=!sidebarAberta;
  document.getElementById('mapaSidebar').style.display=sidebarAberta?'flex':'none';
  document.getElementById('btnExpandSb').style.display=sidebarAberta?'none':'block';
};
window.toggleMenu=function(){ document.getElementById('menuLateral').classList.toggle('aberto'); document.getElementById('menuOverlay').classList.toggle('aberto'); };
window.fecharMenu=function(){ document.getElementById('menuLateral').classList.remove('aberto'); document.getElementById('menuOverlay').classList.remove('aberto'); };
window.fazerLogout=async function(){ await signOut(auth); window.location.href='login.html'; };

// ─── LISTENERS ───
function iniciarListeners(){
  onSnapshot(collection(db,'talhoes'), snap => { talhoes=snap.docs.map(d=>({_docId:d.id,...d.data()})); desenharTalhoes(); renderPlantas(); });
  onSnapshot(collection(db,'avaliacaoPlantas'), snap => { plantas=snap.docs.map(d=>({_docId:d.id,...d.data()})); renderPlantas(); if(plantaSel && !plantas.some(p=>p._docId===plantaSel)) fecharPainel(); });
  onSnapshot(collection(db,'avaliacaoRegistros'), snap => { registros=snap.docs.map(d=>({_docId:d.id,...d.data()})); if(plantaSel){ renderAvaliacoesList(plantaSel); } renderPlantas(); });
  onSnapshot(collection(db,'avaliacaoFotos'), snap => { fotos=snap.docs.map(d=>({_docId:d.id,...d.data()})); if(plantaSel){ renderAvaliacoesList(plantaSel); renderComparador(plantaSel); } });
}

.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;}
.lightbox-cap{color:#fff;font-family:'DM Mono',monospace;margin-top:12px;font-size:.86rem;}
.lightbox-close{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;}
/* TOAST */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ve);color:#fff;padding:12px 20px;border-radius:24px;font-size:.85rem;font-weight:600;z-index:6000;opacity:0;transition:.3s;box-shadow:var(--sf);max-width:88vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>

<header class="app-header">
  <div class="hdr-logo">
    <button class="btn-menu" onclick="toggleMenu()">☰</button>
    <div style="margin-left:4px;"><span>Conilon Tech</span><span class="hdr-sub">Avaliação de Lavoura</span></div>
  </div>
  <div class="hdr-user" id="userNome"></div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<div class="menu-lateral" id="menuLateral">
  <div class="menu-topo">
    <div class="menu-app-nome">🌿 Conilon Tech</div>
    <div class="menu-user-nome" id="menuUserNome"></div>
    <div class="menu-user-email" id="menuUserEmail"></div>
  </div>
  <div id="menuModulos"></div>
  <div class="menu-rodape"><button class="btn-logout" onclick="fazerLogout()">Sair da conta</button></div>
</div>

<div id="appContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;">
  <div class="mapa-wrap">
    <div id="map"></div>
    <div class="mapa-sidebar" id="mapaSidebar">
      <div class="msb-header">
        <span class="msb-title">📍 Pontos avaliados</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:.6rem;color:var(--c)" id="sidebarCount"></span>
          <button onclick="toggleSidebar()" style="background:none;border:none;cursor:pointer;font-size:.9rem;color:var(--c);padding:2px 4px;">◀</button>
        </div>
      </div>
      <div class="msb-filter">
        <select id="filtroFaz" onchange="setFiltroFaz(this)"><option value="todas">Todas as fazendas</option></select>
      </div>
      <div id="sidebarList"></div>
    </div>
    <button id="btnExpandSb" onclick="toggleSidebar()">▶ Pontos</button>

    <div class="info-panel" id="infoPanel">
      <div class="panel-header">
        <div class="panel-nome" id="pNome"></div>
        <div class="panel-faz" id="pFaz"></div>
        <button class="panel-close" onclick="fecharPainel()">✕</button>
      </div>
      <div class="panel-body" id="pBody"></div>
      <div class="panel-actions" id="panelActions"></div>
    </div>

    <div class="marcar-bar" id="marcarBar" style="display:none;">
      <button id="btnGps" onclick="marcarPorGps()">🎯 Marcar aqui (GPS)</button>
    </div>
  </div>
</div>

<!-- MODAL NOVA PLANTA -->
<div class="overlay" id="overlayPlanta" onclick="overlayPlantaClick(event)">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">📍 Marcar planta</div><button class="panel-close" onclick="fecharModalPlanta()">✕</button></div>
    <div class="modal-body">
      <div class="modal-coord" id="mpCoord"></div>
      <div class="fg"><label>Nome / descrição do ponto</label><input type="text" id="mpDesc" placeholder="Ex: Bloco A · bioestimulante, Testemunha..."></div>
      <div class="fg"><label>🏷️ Código da etiqueta</label><input type="text" id="mpCodigo" placeholder="Ex: E-01, P-127..."></div>
      <div class="fg"><label>Talhão</label><select id="mpTalhao"></select><span style="font-size:.62rem;color:var(--c);">Sugerido pelo ponto do mapa. A fazenda vem do talhão.</span></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModalPlanta()">Cancelar</button>
      <button class="btn-save" onclick="salvarPlanta()">Salvar ponto</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="fecharLightbox()">
  <button class="lightbox-close" onclick="fecharLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-cap" id="lightboxCap"></div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
