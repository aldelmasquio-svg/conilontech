<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ConilonTech · Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",
  authDomain: "talhoes-df836.firebaseapp.com",
  projectId: "talhoes-df836",
  storageBucket: "talhoes-df836.firebasestorage.app",
  messagingSenderId: "1047022702039",
  appId: "1:1047022702039:web:001cf6a3c028c494ab8f92"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const SEMANAS = ['1ª Semana','2ª Semana','3ª Semana','4ª Semana'];
const DIAS_SEMANA_ADUBACAO = [5, 12, 19, 26];
function ordemSem(s) { return SEMANAS.findIndex(x => String(s||'').startsWith(x)); }

// Cores/labels por tipo de atividade
const TIPOS = {
  pulverizacao: { ico:'💧', cor:'#3b82f6', label:'Pulverização', link:'pulverizacoes.html' },
  drench:       { ico:'🌱', cor:'#16a34a', label:'Drench',        link:'drench.html' },
  adubacao:     { ico:'🧪', cor:'#d97706', label:'Adubação',      link:'adubacoes.html' },
};

let usuarioAtual = null, perfilAtual = {};
let talhoes = [], pulverizacoes = [], drenchPrevencao = [], planosAdubacao = [];
let mesVisivel; // {mes:0-11, ano}
let filtroFazenda = ''; // '' = todas as minhas
let diaAberto = null;

// ─── AUTH ───
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db, 'usuarios', user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil === 'admin')
    perfilAtual.modulos = { mapa:'admin', adubacao:'admin', pulverizacao:'admin', equipe:'admin', estoque:'admin', pedidos:'admin', gestao:'admin', admin:'admin' };
  document.getElementById('userNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserEmail').textContent = user.email;
  const hj = new Date();
  mesVisivel = { mes: hj.getMonth(), ano: hj.getFullYear() };
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'flex';
  gerarMenu();
  iniciarListeners();
});

// ─── PERMISSÃO (setorizado por fazenda dentro de cada módulo) ───
function isGlobalAdmin() { return perfilAtual.perfil === 'admin'; }
// null = sem restrição (vê todas); array = só essas fazendas
function restricaoModulo(mod) {
  if (isGlobalAdmin()) return null;
  const permitidas = perfilAtual.fazendasModulo?.[mod];
  if (!permitidas || !permitidas.length) return null;
  return permitidas;
}
function podeVerFaz(faz, mod) {
  const r = restricaoModulo(mod);
  return !r || r.includes(faz);
}
// Módulo que governa cada tipo de atividade
const MODULO_DO_TIPO = { pulverizacao:'pulverizacao', drench:'pulverizacao', adubacao:'adubacao' };

// ─── MENU ───
function gerarMenu() {
  const isAdm = Object.values(perfilAtual.modulos || {}).includes('admin') || perfilAtual.perfil === 'admin';
  const pg = (window.location.pathname.split('/').pop() || 'index.html');
  function nivelAcesso(mod) {
    if (perfilAtual.modulos?.[mod]) return perfilAtual.modulos[mod];
    if (perfilAtual.perfil === 'admin') return 'admin';
    return 'nenhum';
  }
  const secoes = [
    { label: 'Principal', items: [
      { href:'index.html',         ico:'📊', label:'Dashboard' },
      { href:'agenda.html',        ico:'📅', label:'Agenda' },
      { href:'mapa.html',          ico:'🗺️', label:'Mapa de Talhões',   acesso:'mapa' },
      { href:'adubacoes.html',     ico:'🧪', label:'Adubações',         acesso:'adubacao' },
      { href:'pulverizacoes.html', ico:'💧', label:'Pulverizações',     acesso:'pulverizacao' },
      { href:'drench.html',        ico:'🌱', label:'Drench Preventivo', acesso:'pulverizacao' },
      { href:'atividades.html',    ico:'🌾', label:'Atividades',        acesso:'atividades' },
      { href:'equipe.html',        ico:'👥', label:'Equipe',            acesso:'equipe' },
      { href:'estoque.html',       ico:'🏬', label:'Estoque',           acesso:'estoque' },
      { href:'pedidos.html',       ico:'📦', label:'Pedidos',           acesso:'pedidos' },
    ]},
    { label: 'Análise', items: [
      { href:'gestao.html',        ico:'📈', label:'Gestão',            acesso:'gestao' },
      { href:'analises.html',      ico:'🔬', label:'Análises',          acesso:'analises' },
      { href:'recomendacoes.html', ico:'💊', label:'Recomendações',     acesso:'recomendacoes' },
      { href:'planejamento.html',  ico:'🗓️', label:'Planejamento',      acesso:'planejamento' },
      ...(isAdm ? [{ href:'admin.html', ico:'⚙️', label:'Administração' }] : []),
    ]},
  ];
  document.getElementById('menuModulos').innerHTML = secoes.map(s => {
    const html = s.items.map(m => {
      if (m.acesso && nivelAcesso(m.acesso) === 'nenhum') return '';
      return `<a class="menu-item${pg===m.href?' ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`;
    }).filter(Boolean).join('');
    return html ? `<div class="menu-secao">${s.label}</div>${html}` : '';
  }).join('');
}

// ─── LISTENERS ───
function iniciarListeners() {
  onSnapshot(collection(db,'talhoes'), snap => { talhoes = snap.docs.map(d=>({_docId:d.id,...d.data()})); render(); });
  onSnapshot(collection(db,'pulverizacoes'), snap => { pulverizacoes = snap.docs.map(d=>({_docId:d.id,...d.data()})); render(); });
  onSnapshot(collection(db,'drenchPrevencao'), snap => { drenchPrevencao = snap.docs.map(d=>({_docId:d.id,...d.data()})); render(); });
  onSnapshot(collection(db,'planosAdubacao'), snap => { planosAdubacao = snap.docs.map(d=>({_docId:d.id,...d.data()})); render(); });
}

// ─── UTILS ───
function sanitizar(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hojeLocalStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatarData(iso){ if(!iso)return'—'; const[a,m,d]=iso.split('-'); return`${d}/${m}/${a}`; }
function talhaoDe(id){ return talhoes.find(t => t.id === id); }

// ─── DERIVAÇÃO DE EVENTOS ───
function coletarEventos() {
  const eventos = [];
  // Pulverizações pendentes
  pulverizacoes.forEach(p => {
    if (p.realizada || p.aplicacaoStatus === 'encerrada_parcial' || !p.data) return;
    const faz = p.fazenda || (talhaoDe(p.talhaoId)?.fazenda) || '';
    if (!podeVerFaz(faz, 'pulverizacao')) return;
    const prods = (p.produtos||[]).map(pr=>pr.produto).filter(Boolean).join(', ');
    const alvo = Array.isArray(p.pragaAlvo) ? p.pragaAlvo.filter(Boolean).join(', ') : (p.pragaAlvo||'');
    eventos.push({ data:p.data, tipo:'pulverizacao', fazenda:faz, talhaoNome:p.talhaoNome||talhaoDe(p.talhaoId)?.nome||'', descricao:[alvo,prods].filter(Boolean).join(' · ') });
  });
  // Drench pendente
  drenchPrevencao.forEach(d => {
    if (d.status === 'realizado' || !d.data) return;
    const faz = d.fazenda || (talhaoDe(d.talhaoId)?.fazenda) || '';
    if (!podeVerFaz(faz, 'pulverizacao')) return;
    const prods = (d.produtos||[]).map(pr=>pr.produto||pr.nome).filter(Boolean).join(', ');
    const alvo = Array.isArray(d.alvoPrevencao) ? d.alvoPrevencao.filter(Boolean).join(', ') : (d.alvoPrevencao||'');
    eventos.push({ data:d.data, tipo:'drench', fazenda:faz, talhaoNome:d.talhaoNome||talhaoDe(d.talhaoId)?.nome||'', descricao:[alvo,prods].filter(Boolean).join(' · ') });
  });
  // Adubações pendentes (data derivada de mesAno + semana)
  planosAdubacao.forEach(plano => {
    const t = talhaoDe(plano.talhaoId);
    const faz = plano.fazenda || t?.fazenda || '';
    if (!podeVerFaz(faz, 'adubacao')) return;
    const [mesNome, anoStr] = String(plano.mesAno||'').split('/');
    const mesIdx = MESES.indexOf(mesNome), ano = parseInt(anoStr);
    if (mesIdx < 0 || !ano) return;
    (plano.aplicacoes||[]).forEach(ap => {
      if (ap.feito) return;
      const semIdx = ordemSem(ap.semana);
      const dia = DIAS_SEMANA_ADUBACAO[semIdx >= 0 ? semIdx : 0];
      const data = `${ano}-${String(mesIdx+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
      const prods = (ap.produtos||[]).map(pr=>pr.produto).filter(Boolean).join(', ');
      eventos.push({ data, tipo:'adubacao', fazenda:faz, talhaoNome:t?.nome||plano.talhaoId||'', descricao:[ap.fase,prods].filter(Boolean).join(' · ') || (ap.modo||'') });
    });
  });
  // Filtro de fazenda escolhido
  return filtroFazenda ? eventos.filter(e => e.fazenda === filtroFazenda) : eventos;
}

// Fazendas que o gerente pode ver em algum dos módulos relevantes
function fazendasVisiveis() {
  const set = new Set();
  talhoes.forEach(t => {
    const f = t.fazenda; if (!f) return;
    if (podeVerFaz(f,'adubacao') || podeVerFaz(f,'pulverizacao')) set.add(f);
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

// ─── RENDER ───
function render() {
  if (!mesVisivel) return;
  atualizarFiltroFazenda();
  const hj = hojeLocalStr();
  const eventos = coletarEventos();

  // Indexa eventos por dia
  const porDia = {};
  eventos.forEach(e => { (porDia[e.data] = porDia[e.data] || []).push(e); });

  // Cabeçalho do mês
  document.getElementById('mesLabel').textContent = `${MESES[mesVisivel.mes]} ${mesVisivel.ano}`;

  // Grid do mês
  const primeiro = new Date(mesVisivel.ano, mesVisivel.mes, 1);
  const diaSemInicio = primeiro.getDay(); // 0=Dom
  const diasNoMes = new Date(mesVisivel.ano, mesVisivel.mes+1, 0).getDate();
  const cells = [];
  for (let i=0;i<diaSemInicio;i++) cells.push(null);
  for (let d=1; d<=diasNoMes; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const grid = document.getElementById('calGrid');
  grid.innerHTML = DIAS_SEM.map(d=>`<div class="cal-wd">${d}</div>`).join('')
    + cells.map(d => {
      if (d === null) return `<div class="cal-cel cal-vazio"></div>`;
      const iso = `${mesVisivel.ano}-${String(mesVisivel.mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const evs = porDia[iso] || [];
      const isHoje = iso === hj;
      const passado = iso < hj;
      const temAtraso = passado && evs.length > 0;
      // conta por tipo
      const porTipo = {};
      evs.forEach(e => porTipo[e.tipo] = (porTipo[e.tipo]||0)+1);
      const dots = Object.keys(porTipo).map(tp => `<span class="cal-dot" style="background:${TIPOS[tp].cor};"></span>`).join('');
      const cls = ['cal-cel'];
      if (isHoje) cls.push('cal-hoje');
      if (evs.length) cls.push('cal-tem');
      if (temAtraso) cls.push('cal-atraso');
      if (passado) cls.push('cal-passado');
      return `<div class="${cls.join(' ')}" ${evs.length?`onclick="agAbrirDia('${iso}')"`:''}>
        <span class="cal-num">${d}</span>
        ${evs.length ? `<span class="cal-dots">${dots}</span><span class="cal-cnt">${evs.length}</span>` : ''}
      </div>`;
    }).join('');

  // Resumo do mês (contadores por tipo, no mês visível)
  const doMes = eventos.filter(e => e.data.slice(0,7) === `${mesVisivel.ano}-${String(mesVisivel.mes+1).padStart(2,'0')}`);
  const cnt = { pulverizacao:0, drench:0, adubacao:0 };
  doMes.forEach(e => cnt[e.tipo]++);
  document.getElementById('mesResumo').innerHTML =
    Object.keys(TIPOS).map(tp => `<span class="resumo-chip"><span class="cal-dot" style="background:${TIPOS[tp].cor};"></span>${TIPOS[tp].ico} ${cnt[tp]}</span>`).join('');

  // Se um dia está aberto, re-renderiza o sheet (dados podem ter atualizado)
  if (diaAberto) renderSheet(porDia[diaAberto] || []);
}

function atualizarFiltroFazenda() {
  const sel = document.getElementById('filtroFaz');
  const wrap = document.getElementById('filtroFazWrap');
  if (!sel) return;
  const fazs = fazendasVisiveis();
  if (fazs.length <= 1) { wrap.style.display = 'none'; filtroFazenda = fazs[0] && fazs.length===1 ? '' : filtroFazenda; return; }
  wrap.style.display = 'flex';
  const atual = filtroFazenda;
  sel.innerHTML = `<option value="">Todas as minhas fazendas</option>` + fazs.map(f=>`<option value="${sanitizar(f)}" ${f===atual?'selected':''}>${sanitizar(f)}</option>`).join('');
}

// ─── SHEET DO DIA ───
window.agAbrirDia = function(iso) {
  diaAberto = iso;
  const eventos = coletarEventos().filter(e => e.data === iso);
  document.getElementById('sheetData').textContent = formatarData(iso);
  const hj = hojeLocalStr();
  document.getElementById('sheetStatus').innerHTML = iso < hj ? '<span style="color:var(--danger);font-weight:700;">⚠️ Atrasadas</span>' : (iso === hj ? '<span style="color:var(--v);font-weight:700;">Hoje</span>' : '');
  renderSheet(eventos);
  document.getElementById('sheetOverlay').classList.add('open');
};
window.agFecharDia = function() { diaAberto = null; document.getElementById('sheetOverlay').classList.remove('open'); };

function renderSheet(eventos) {
  const cont = document.getElementById('sheetLista');
  if (!eventos.length) { cont.innerHTML = `<div class="vazio-sm">Nenhuma atividade neste dia.</div>`; return; }
  // agrupa por tipo pra leitura visual
  const ordem = ['adubacao','pulverizacao','drench'];
  eventos.sort((a,b) => ordem.indexOf(a.tipo)-ordem.indexOf(b.tipo) || (a.fazenda||'').localeCompare(b.fazenda||'','pt-BR'));
  cont.innerHTML = eventos.map(e => {
    const t = TIPOS[e.tipo];
    return `<a href="${t.link}" class="sheet-item" style="border-left-color:${t.cor};">
      <span class="sheet-ico">${t.ico}</span>
      <div class="sheet-info">
        <div class="sheet-tit">${t.label} · ${sanitizar(e.talhaoNome||'—')}</div>
        <div class="sheet-sub">🏡 ${sanitizar(e.fazenda||'—')}${e.descricao?' · '+sanitizar(e.descricao):''}</div>
      </div>
      <span class="sheet-seta">›</span>
    </a>`;
  }).join('');
}

// ─── NAV MÊS ───
window.agNavMes = function(dir) {
  let m = mesVisivel.mes + dir, a = mesVisivel.ano;
  if (m < 0) { m = 11; a--; } else if (m > 11) { m = 0; a++; }
  mesVisivel = { mes:m, ano:a };
  render();
};
window.agHoje = function() { const h=new Date(); mesVisivel={mes:h.getMonth(),ano:h.getFullYear()}; render(); };
window.agSetFaz = function(v) { filtroFazenda = v; render(); };

window.toggleMenu = () => { document.getElementById('menuLateral').classList.toggle('aberto'); document.getElementById('menuOverlay').classList.toggle('aberto'); };
window.fecharMenu = () => { document.getElementById('menuLateral').classList.remove('aberto'); document.getElementById('menuOverlay').classList.remove('aberto'); };
window.fazerLogout = async () => { await signOut(auth); window.location.href = 'login.html'; };
</script>

<style>
:root{--v:#1a5c1a;--ve:#0b1c0d;--vb:#e2f0e2;--c:#5a6b48;--cb:#c6c0b0;--cl:#f0ece3;--t:#1a1a1a;--danger:#ef4444;--rad:12px;--rs:8px;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;display:flex;flex-direction:column;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}

@keyframes spin{to{transform:rotate(360deg);}}
.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:200;}
.hdr-logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;}
.hdr-sub{font-size:.55rem;opacity:.6;letter-spacing:.15em;text-transform:uppercase;display:block;}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hdr-user{font-size:.68rem;opacity:.7;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}

.menu-topo{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1);}

.menu-user-nome{font-size:.8rem;color:rgba(255,255,255,.7);margin-top:2px;}
.menu-user-email{font-size:.65rem;color:rgba(255,255,255,.45);margin-top:1px;}
#menuModulos{flex:1;padding:10px 8px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;font-weight:500;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.menu-rodape{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}
.app-main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;}
@media(min-width:600px){.app-main{max-width:580px;margin:0 auto;width:100%;}}
/* FILTRO + LEGENDA */
.topo-bar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.filtro-faz-wrap{display:flex;align-items:center;gap:8px;background:white;border-radius:var(--rad);box-shadow:var(--s);padding:9px 12px;}
.filtro-faz-wrap label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--v);font-weight:700;flex-shrink:0;}
.filtro-faz-wrap select{flex:1;border:1.5px solid var(--cb);border-radius:7px;padding:7px 9px;font-size:.85rem;font-family:'Barlow',sans-serif;outline:none;background:white;color:var(--ve);font-weight:600;min-width:0;}
.legenda{display:flex;gap:12px;flex-wrap:wrap;padding:0 2px;}
.legenda-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--c);font-weight:600;}
/* CALENDÁRIO */
.cal-card{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:12px;margin-bottom:14px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-nav-btn{background:var(--cl);border:1.5px solid var(--cb);border-radius:8px;width:36px;height:36px;font-size:1.1rem;cursor:pointer;color:var(--ve);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cal-mes-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.15rem;color:var(--ve);text-align:center;flex:1;}
.btn-hoje{background:var(--vb);border:1px solid #a7d7a7;color:var(--v);border-radius:20px;padding:4px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;margin-left:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-wd{text-align:center;font-size:.6rem;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px;}
.cal-cel{aspect-ratio:1/1;border-radius:8px;background:var(--cl);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px 3px;position:relative;overflow:hidden;}
.cal-vazio{background:transparent;}
.cal-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;color:var(--t);line-height:1;}
.cal-passado .cal-num{color:var(--cb);}
.cal-tem{cursor:pointer;background:white;border:1.5px solid var(--cb);}
.cal-tem:active{transform:scale(.96);}
.cal-hoje{outline:2.5px solid var(--v);outline-offset:-2px;}
.cal-hoje .cal-num{color:var(--v);font-weight:800;}
.cal-atraso{border-color:#fca5a5;background:#fef2f2;}
.cal-dots{display:flex;gap:2px;margin-top:auto;margin-bottom:1px;}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cal-cnt{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;color:var(--c);line-height:1;}
/* RESUMO */
.mes-resumo{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--cl);}
.resumo-chip{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:.78rem;font-weight:700;color:var(--ve);background:var(--cl);border-radius:20px;padding:4px 11px;}
/* DICA */
.dica{font-size:.72rem;color:var(--c);text-align:center;padding:2px 12px 20px;line-height:1.4;}
/* SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.sheet-overlay.open{opacity:1;pointer-events:all;}
.sheet{background:white;border-radius:16px 16px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,20px);transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.1,.64,1);}
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:var(--cb);border-radius:2px;margin:12px auto 0;}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;}
.sheet-hdr-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.15rem;color:var(--ve);}
.sheet-hdr-sub{font-size:.72rem;margin-top:1px;}
.sheet-close{background:var(--cl);border:none;width:32px;height:32px;border-radius:8px;font-size:1rem;cursor:pointer;color:var(--c);}
.sheet-lista{padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px;}
.sheet-item{display:flex;align-items:center;gap:12px;background:white;border:1px solid var(--cl);border-left:4px solid var(--cb);border-radius:10px;padding:11px 12px;text-decoration:none;color:var(--t);box-shadow:var(--s);}
.sheet-item:active{background:var(--cl);}
.sheet-ico{font-size:1.3rem;flex-shrink:0;}
.sheet-info{flex:1;min-width:0;}
.sheet-tit{font-size:.88rem;font-weight:700;color:var(--ve);}
.sheet-sub{font-size:.72rem;color:var(--c);margin-top:2px;}
.sheet-seta{font-size:1.4rem;color:var(--cb);flex-shrink:0;}
.vazio-sm{text-align:center;padding:20px;font-size:.85rem;color:var(--c);font-style:italic;}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loading-screen" id="loadingScreen"><div class="spinner"></div></div>

<header class="app-header">
  <div class="hdr-logo">
    <button class="btn-menu" onclick="toggleMenu()">☰</button>
    <div style="margin-left:4px;"><span>Conilon Tech</span><span class="hdr-sub">Agenda</span></div>
  </div>
  <div class="hdr-user" id="userNome"></div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<div class="menu-lateral" id="menuLateral">
  <div class="menu-topo">
    <div class="menu-app-nome">🌿 Conilon Tech</div>
    <div class="menu-user-nome" id="menuUserNome"></div>
    <div class="menu-user-email" id="menuUserEmail"></div>
  </div>
  <div id="menuModulos"></div>
  <div class="menu-rodape"><button class="btn-logout" onclick="fazerLogout()">Sair da conta</button></div>
</div>

<div id="appContent" style="display:none;flex-direction:column;flex:1;min-height:0;">
  <main class="app-main">
    <div class="topo-bar">
      <div class="filtro-faz-wrap" id="filtroFazWrap" style="display:none;">
        <label>🏡 Fazenda</label>
        <select id="filtroFaz" onchange="agSetFaz(this.value)"></select>
      </div>
      <div class="legenda">
        <span class="legenda-item"><span class="cal-dot" style="background:#d97706;"></span>🧪 Adubação</span>
        <span class="legenda-item"><span class="cal-dot" style="background:#3b82f6;"></span>💧 Pulverização</span>
        <span class="legenda-item"><span class="cal-dot" style="background:#16a34a;"></span>🌱 Drench</span>
      </div>
    </div>

    <div class="cal-card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="agNavMes(-1)">‹</button>
        <div class="cal-mes-tit" id="mesLabel">—</div>
        <button class="cal-nav-btn" onclick="agNavMes(1)">›</button>
        <button class="btn-hoje" onclick="agHoje()">Hoje</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="mes-resumo" id="mesResumo"></div>
    </div>
    <div class="dica">👆 Toque num dia marcado para ver as atividades e seguir para o módulo.</div>
  </main>
</div>

<!-- SHEET DO DIA -->
<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)agFecharDia()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div>
        <div class="sheet-hdr-tit" id="sheetData">—</div>
        <div class="sheet-hdr-sub" id="sheetStatus"></div>
      </div>
      <button class="sheet-close" onclick="agFecharDia()">✕</button>
    </div>
    <div class="sheet-lista" id="sheetLista"></div>
  </div>
</div>

</body>
</html>
