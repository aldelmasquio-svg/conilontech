<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ConilonTech · Atividades de Campo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

// ─── ESTADO ───
let usuarioAtual = null, perfilAtual = {};
let empreiteiros = [], talhoesAtividades = [], registros = [], atividades = ['Colheita','Desbrota','Poda','Roçada'];
let sessaoAtual = null, abaConf = null;
let tabAtual = 'registros';
let confModalAtual = null;

const CORES = ['#2d6a2d','#1d4ed8','#b45309','#7c3aed','#be123c','#0e7490','#65a30d','#c2410c'];
const inic = n => n.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const corFunc = id => { const idx=(sessaoAtual?.funcDia||[]).findIndex(f=>f.id===id); return CORES[idx>=0?idx%CORES.length:0]; };

// ─── AUTH ───
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil==='admin') {
    perfilAtual.modulos = {mapa:'admin',atividades:'admin',adubacao:'admin',config:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin'};
  }
  if (nivelAcesso('atividades')==='nenhum') { window.location.href='index.html'; return; }
  document.getElementById('userNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appContent').style.display = 'flex';
  gerarMenu();
  aplicarPermissoes();
  iniciarListeners();
});

function nivelAcesso(mod) {
  if (perfilAtual.modulos?.[mod]) return perfilAtual.modulos[mod];
  if (perfilAtual.perfil==='admin') return 'admin';
  return 'nenhum';
}
function isAdmin() { return nivelAcesso('atividades')==='admin'; }
function podeEditar() { return ['admin','operador','encarregado'].includes(nivelAcesso('atividades')); }

function aplicarPermissoes() {
  const adm = isAdmin();
  document.querySelectorAll('.so-admin').forEach(el => el.style.display = adm ? '' : 'none');
}

function gerarMenu() {
  const isAdm = Object.values(perfilAtual.modulos||{}).includes('admin') || perfilAtual.perfil==='admin';
  const items = [
    {href:'index.html',ico:'📊',label:'Dashboard'},
    {href:'mapa.html',ico:'🗺️',label:'Mapa de Talhões'},
    {href:'atividades.html',ico:'🌾',label:'Atividades de Campo'},
    {href:'adubacoes.html',ico:'🧪',label:'Adubações'},
    {href:'pulverizacoes.html',ico:'💧',label:'Pulverizações'},
    {href:'pedidos.html',ico:'📦',label:'Pedidos de Insumos'},
  ];
  if (isAdm) items.push({href:'admin.html',ico:'⚙️',label:'Administração'});
  document.getElementById('menuModulos').innerHTML = items.map(m =>
    `<a class="menu-item ${m.href==='atividades.html'?'ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`
  ).join('');
  if (isAdm) {
    document.getElementById('tabTalhoes').style.display='';
    document.getElementById('tabEquipe').style.display='';
  }
}

function iniciarListeners() {
  onSnapshot(collection(db,'empreiteiros'), snap => {
    empreiteiros = snap.docs.map(d=>({_docId:d.id,...d.data()}));
    if (tabAtual==='funcionarios') renderizarEquipe();
    if (tabAtual==='nova') renderizarFormNova();
  });
  onSnapshot(collection(db,'talhoesAtividades'), snap => {
    talhoesAtividades = snap.docs.map(d=>({_docId:d.id,...d.data()}));
    if (tabAtual==='talhoes') renderizarTalhoes();
  });
  onSnapshot(collection(db,'registrosAtividade'), snap => {
    registros = snap.docs.map(d=>({_docId:d.id,...d.data()}))
      .sort((a,b)=>(b.salvoEm||b.data||'').localeCompare(a.salvoEm||a.data||''));
    if (tabAtual==='registros') renderizarRegistros();
  });
  onSnapshot(doc(db,'config','geral'), snap => {
    if (snap.exists() && snap.data().atividades) atividades = snap.data().atividades;
  });
}

// ─── NAVEGAÇÃO TABS ───
window.abrirTab = function(tab, btn) {
  tabAtual = tab;
  document.querySelectorAll('.mod-tab').forEach(b=>b.classList.remove('ativo'));
  if (btn) btn.classList.add('ativo');
  document.getElementById('atvContent').style.display = 'flex';
  if (tab==='registros') renderizarRegistros();
  else if (tab==='nova') renderizarFormNova();
  else if (tab==='talhoes') renderizarTalhoes();
  else if (tab==='funcionarios') renderizarEquipe();
};

// ══════════════════════════════
// ABA REGISTROS
// ══════════════════════════════
function renderizarRegistros() {
  const content = document.getElementById('atvContent');
  const filtroAtiv = document.getElementById('filtroAtividade')?.value || '';
  const filtroData1 = document.getElementById('filtroData1')?.value || '';
  const filtroData2 = document.getElementById('filtroData2')?.value || '';

  let filtrados = registros;
  if (filtroAtiv) filtrados = filtrados.filter(r=>r.atividade===filtroAtiv);
  if (filtroData1) filtrados = filtrados.filter(r=>r.data>=filtroData1);
  if (filtroData2) filtrados = filtrados.filter(r=>r.data<=filtroData2);

  if (!filtrados.length) {
    content.innerHTML = `
      ${renderFiltros()}
      <div class="vazio"><div class="ico">📋</div><p>Nenhuma sessão encontrada.<br>Crie uma nova sessão na aba <strong>Nova Sessão</strong>.</p></div>`;
    return;
  }

  content.innerHTML = renderFiltros() + filtrados.map(r => {
    const tot = (r.quadras||[]).reduce((s,q)=>s+q.carreiras,0);
    const at = Object.keys(r.atribuicoes||{}).length;
    const pct = tot ? Math.round(at/tot*100) : 0;
    const podEd = podeEditar();
    const adm = isAdmin();
    return `<div class="reg-card">
      <div class="reg-header">
        <div>
          <div class="reg-titulo">🌾 ${r.atividade||'Atividade'} · ${r.talhaoNome||''}</div>
          <div class="reg-meta">${r.fazenda||''} · ${r.data?formatarData(r.data):''}</div>
          <div class="reg-meta">👤 ${r.criadoPor||'—'} · Salvo: ${r.salvoEm?formatarDataHora(r.salvoEm):'—'}</div>
        </div>
      </div>
      <div class="reg-body">
        <div class="reg-stat"><span class="reg-stat-label">Empreiteiros</span><span class="reg-stat-val">${(r.empsDia||[]).map(e=>e.nome).join(', ')||'—'}</span></div>
        <div class="reg-stat"><span class="reg-stat-label">Progresso</span><span class="reg-stat-val">${at}/${tot} carreiras (${pct}%)</span></div>
      </div>
      <div class="reg-acoes">
        ${podEd?`<button class="btn btn-v btn-sm" onclick="carregarRegistro('${r._docId}')">✏️ Continuar</button>`:''}
        <button class="btn btn-c btn-sm" onclick="gerarRelatorio('${r._docId}')">📄 Relatório</button>
        ${adm?`<button class="btn btn-d btn-sm" data-doc="${r._docId}" onclick="excluirRegistro(this)">🗑</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderFiltros() {
  return `<div class="filtros-bar">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div style="flex:1;min-width:120px;">
        <label class="filtro-label">Atividade</label>
        <select class="filtro-sel" id="filtroAtividade" onchange="renderizarRegistros()">
          <option value="">Todas</option>
          ${atividades.map(a=>`<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1;min-width:120px;">
        <label class="filtro-label">De</label>
        <input type="date" class="filtro-sel" id="filtroData1" onchange="renderizarRegistros()">
      </div>
      <div style="flex:1;min-width:120px;">
        <label class="filtro-label">Até</label>
        <input type="date" class="filtro-sel" id="filtroData2" onchange="renderizarRegistros()">
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-c btn-sm" onclick="filtrarSemana()">Esta semana</button>
      <button class="btn btn-c btn-sm" onclick="filtrarMes()">Este mês</button>
      <button class="btn btn-c btn-sm" onclick="limparFiltros()">Limpar</button>
      <button class="btn btn-v btn-sm" onclick="gerarRelatorioGeral()">📄 Relatório geral</button>
    </div>
  </div>`;
}

window.filtrarSemana = function() {
  const hoje = new Date();
  const diaSemana = hoje.getDay();
  const inicio = new Date(hoje); inicio.setDate(hoje.getDate() - diaSemana);
  const fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
  document.getElementById('filtroData1').value = inicio.toISOString().slice(0,10);
  document.getElementById('filtroData2').value = fim.toISOString().slice(0,10);
  renderizarRegistros();
};

window.filtrarMes = function() {
  const hoje = new Date();
  const inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const fim = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  document.getElementById('filtroData1').value = inicio.toISOString().slice(0,10);
  document.getElementById('filtroData2').value = fim.toISOString().slice(0,10);
  renderizarRegistros();
};

window.limparFiltros = function() {
  document.getElementById('filtroAtividade').value = '';
  document.getElementById('filtroData1').value = '';
  document.getElementById('filtroData2').value = '';
  renderizarRegistros();
};

window.excluirRegistro = async function(btn) {
  const docId = btn.dataset.doc;
  if (!docId) return;
  if (!confirm('Excluir este registro permanentemente?')) return;
  await deleteDoc(doc(db,'registrosAtividade',docId));
  toast('🗑 Registro excluído.');
};

// ══════════════════════════════
// CONFERÊNCIA (REFORMULADA)
// ══════════════════════════════
function mostrarConferencia() {
  document.getElementById('telaConferencia').classList.add('aberta');
  renderizarConferencia();
}

window.fecharConferencia = function() {
  document.getElementById('telaConferencia').classList.remove('aberta');
  sessaoAtual = null; abaConf = null;
  if (tabAtual==='registros') renderizarRegistros();
};

// Auto-save atômico para evitar perda de dados e conflitos
async function autoSaveAtribuicao(chave, dados) {
  if (!sessaoAtual || !sessaoAtual._docId) return;
  const docRef = doc(db, 'registrosAtividade', sessaoAtual._docId);
  try {
    // Atualiza apenas a chave específica dentro do objeto atribuicoes
    await updateDoc(docRef, {
      [`atribuicoes.${chave}`]: dados,
      salvoEm: new Date().toISOString()
    });
  } catch (e) {
    console.error("Erro no auto-save:", e);
    toast('⚠️ Erro ao salvar. Verifique a conexão.');
  }
}

window.carregarRegistro = async function(docId) {
  const snap = await getDoc(doc(db,'registrosAtividade',docId));
  if(!snap.exists()) return;
  sessaoAtual = {_docId:docId,...snap.data()};
  abaConf = sessaoAtual.quadras[0]?.id||null;
  mostrarConferencia();
};

function renderizarConferencia() {
  const s = sessaoAtual; if(!s) return;
  document.getElementById('confNome').textContent = s.fazenda?`${s.fazenda} · ${s.talhaoNome}`:s.talhaoNome;
  document.getElementById('confMeta').textContent = `${s.atividade} · ${formatarData(s.data)}`;
  if (!abaConf && s.quadras.length) abaConf = s.quadras[0].id;
  renderizarAbas(); renderizarPaineis(); atualizarProgresso();
}

function renderizarAbas() {
  const s=sessaoAtual;if(!s)return;
  document.getElementById('abasContainer').innerHTML = s.quadras.map(q=>{
    const{at,tot}=contarQuadra(q.id);
    return `<button class="aba-btn ${abaConf===q.id?'ativa':''}" onclick="trocarAba('${q.id}')">
      ${q.nome}<span class="aba-prog" id="prog-aba-${q.id}">${at===tot&&tot>0?'✅':at+'/'+tot}</span>
    </button>`;
  }).join('');
}

function trocarAba(qid) {
  abaConf=qid;
  document.querySelectorAll('.aba-btn').forEach(b=>b.classList.remove('ativa'));
  document.querySelectorAll('.quadra-painel').forEach(p=>p.classList.toggle('ativa',p.dataset.qid===qid));
  renderizarAbas();
}

function renderizarPaineis() {
  const s=sessaoAtual;if(!s)return;
  const legenda=s.funcDia.map((f,i)=>`<div class="legenda-item"><div class="legenda-cor" style="background:${CORES[i%CORES.length]}"></div>${f.nome.split(' ')[0]}</div>`).join('');
  document.getElementById('paineisContainer').innerHTML = s.quadras.map(q=>{
    const{at,tot}=contarQuadra(q.id);
    const pct=tot?Math.round(at/tot*100):0;
    const btns=Array.from({length:q.carreiras},(_,i)=>renderBtn(q.id,i,i+1,s.atribuicoes[`${q.id}-${i}`])).join('');
    return `<div class="quadra-painel ${abaConf===q.id?'ativa':''}" data-qid="${q.id}">
      <div class="quadra-resumo"><strong>${q.nome}</strong><span id="resumo-txt-${q.id}">${at} de ${tot} conferidas</span><span class="q-pct" id="resumo-pct-${q.id}">${pct}%</span></div>
      <div class="legenda-scroll">${legenda}</div>
      <div class="carreiras-grid" id="grid-${q.id}">${btns}</div>
    </div>`;
  }).join('');
}

function renderBtn(qid,idx,num,a) {
  const btnId = `btn-${qid}-${idx}`;
  if(!a) return `<button id="${btnId}" class="carreira-btn" onclick="abrirConfModal('${qid}',${idx},${num})"><span class="carr-num">${num}</span></button>`;
  const s=sessaoAtual;
  const f1=s.funcDia.find(f=>f.id===a.func1);
  const f2=a.func2?s.funcDia.find(f=>f.id===a.func2):null;
  const bg=f1?corFunc(a.func1):'#888';
  const nome=f2?`${inic(f1?f1.nome:'')}+${inic(f2.nome)}`:(f1?inic(f1.nome):'?');
  return `<button id="${btnId}" class="carreira-btn completa" style="background:${bg};" onclick="abrirConfModal('${qid}',${idx},${num})">
    ${f2?`<div class="dupla-badge">2</div>`:''}
    <span class="carr-num">${num}</span>
    <span class="carr-func">${nome}</span>
  </button>`;
}

// Atualização cirúrgica do botão sem re-renderizar tudo
function atualizarBtnDOM(qid, idx, num, a) {
  const btnId = `btn-${qid}-${idx}`;
  const btnEl = document.getElementById(btnId);
  if (btnEl) {
    btnEl.outerHTML = renderBtn(qid, idx, num, a);
  }
}

function contarQuadra(qid) {
  const s=sessaoAtual;if(!s)return{at:0,tot:0};
  const q=s.quadras.find(x=>x.id===qid);if(!q)return{at:0,tot:0};
  let at=0;for(let i=0;i<q.carreiras;i++)if(s.atribuicoes[`${qid}-${i}`])at++;
  return{at,tot:q.carreiras};
}

function atualizarProgresso() {
  const s=sessaoAtual;if(!s)return;
  const tot=s.quadras.reduce((sum,q)=>sum+q.carreiras,0);
  const at=Object.keys(s.atribuicoes).length;
  document.getElementById('confProg').textContent=`${at}/${tot}`;
  document.getElementById('progBar').style.width=tot?(at/tot*100)+'%':'0%';
  
  // Atualiza resumos da quadra ativa
  if (abaConf) {
    const {at: qAt, tot: qTot} = contarQuadra(abaConf);
    const pct = qTot ? Math.round(qAt/qTot*100) : 0;
    const txtEl = document.getElementById(`resumo-txt-${abaConf}`);
    const pctEl = document.getElementById(`resumo-pct-${abaConf}`);
    const abaProgEl = document.getElementById(`prog-aba-${abaConf}`);
    if (txtEl) txtEl.textContent = `${qAt} de ${qTot} conferidas`;
    if (pctEl) pctEl.textContent = `${pct}%`;
    if (abaProgEl) abaProgEl.textContent = qAt===qTot&&qTot>0 ? '✅' : `${qAt}/${qTot}`;
  }
}

window.abrirConfModal = function(qid,idx,num) {
  const s=sessaoAtual;if(!s)return;
  confModalAtual={qid,idx,num};
  const a=s.atribuicoes[`${qid}-${idx}`];
  const q=s.quadras.find(x=>x.id===qid);
  document.getElementById('cmTitulo').textContent=`Carreira ${num}`;
  document.getElementById('cmSub').textContent=`${q?.nome||''} · ${s.talhaoNome}`;
  
  // Nova lógica de seleção simplificada
  document.getElementById('cmFuncLista').innerHTML=s.funcDia.map((f,i)=>{
    const isF1 = a?.func1===f.id;
    const isF2 = a?.func2===f.id;
    return `<div class="func-opcao ${isF1?'sel1':''} ${isF2?'sel2':''}">
      <div class="func-op-nome">${f.nome}</div>
      <div style="display:flex;gap:6px;">
        <button class="btn-sel-func ${isF1?'ativo-1':''}" onclick="definirFunc('${f.id}', 1)">1º</button>
        <button class="btn-sel-func ${isF2?'ativo-2':''}" onclick="definirFunc('${f.id}', 2)">2º</button>
      </div>
    </div>`;
  }).join('');
  
  document.getElementById('confModalOverlay').classList.add('aberto');
};

window.fecharConfModal = function() {
  document.getElementById('confModalOverlay').classList.remove('aberto');
  confModalAtual=null;
};

window.definirFunc = function(funcId, posicao) {
  if(!confModalAtual||!sessaoAtual)return;
  const {qid,idx,num}=confModalAtual;
  const chave=`${qid}-${idx}`;
  let a=sessaoAtual.atribuicoes[chave]||{};
  
  if (posicao === 1) {
    if (a.func1 === funcId) {
      a.func1 = null; // Desmarca se já estava marcado
    } else {
      a.func1 = funcId;
      if (a.func2 === funcId) a.func2 = null; // Evita a mesma pessoa na dupla
    }
  } else if (posicao === 2) {
    if (a.func2 === funcId) {
      a.func2 = null;
    } else {
      a.func2 = funcId;
      if (a.func1 === funcId) a.func1 = null;
    }
  }
  
  // Limpeza
  if (!a.func1 && a.func2) { a.func1 = a.func2; a.func2 = null; } // Move o 2º para 1º se o 1º ficar vazio
  if (!a.func1 && !a.func2) {
    delete sessaoAtual.atribuicoes[chave];
    autoSaveAtribuicao(chave, null); // Remove do Firebase
  } else {
    sessaoAtual.atribuicoes[chave] = a;
    autoSaveAtribuicao(chave, a); // Salva no Firebase
  }
  
  atualizarBtnDOM(qid, idx, num, sessaoAtual.atribuicoes[chave]);
  atualizarProgresso();
  abrirConfModal(qid, idx, num); // Re-renderiza o modal para refletir a seleção
};

window.limparCarreira = function() {
  if(!confModalAtual||!sessaoAtual)return;
  const {qid,idx,num}=confModalAtual;
  const chave=`${qid}-${idx}`;
  delete sessaoAtual.atribuicoes[chave];
  autoSaveAtribuicao(chave, null);
  atualizarBtnDOM(qid, idx, num, null);
  atualizarProgresso();
  fecharConfModal();
};

// ─── UTILS ───
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return`${dd}/${m}/${a}`;}
function formatarDataHora(iso){try{const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch{return iso;}}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}

</script>

<style>

/* ... (Restante do CSS original do arquivo) ... */
</style>
</head>
<body>
  <!-- Estrutura HTML simplificada para demonstração da lógica -->
  <div id="appContent" style="display:none; flex-direction:column; height:100%;">
    <!-- ... (Header e Menu) ... -->

<style>

/* CONFERÊNCIA */
.conf-overlay{display:none;position:fixed;inset:0;background:#f0f4f0;z-index:500;flex-direction:column;}

/* Toast */
#toast {
  visibility: hidden;
  min-width: 250px;
  background-color: #333;
  color: #fff;
  text-align: center;
  border-radius: 8px;
  padding: 12px;
  position: fixed;
  z-index: 9999;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  font-size: 0.9rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
#toast.show {
  visibility: visible;
  -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
  animation: fadein 0.5s, fadeout 0.5s 2.5s;
}
@-webkit-keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
@keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
@-webkit-keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
@keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

</html>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

// ─── ESTADO ───
let usuarioAtual = null, perfilAtual = {};
let empreiteiros = [], talhoesAtividades = [], registros = [], atividades = ["Colheita","Desbrota","Poda","Roçada"];
let sessaoAtual = null, abaConf = null;
let tabAtual = "registros";
let confModalAtual = null;

const CORES = ["#2d6a2d","#1d4ed8","#b45309","#7c3aed","#be123c","#0e7490","#65a30d","#c2410c"];
const inic = n => n.split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const corFunc = id => { const idx=(sessaoAtual?.funcDia||[]).findIndex(f=>f.id===id); return CORES[idx>=0?idx%CORES.length:0]; };

// ─── AUTH ───
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href="login.html"; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db,"usuarios",user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil==="admin") {
    perfilAtual.modulos = {mapa:"admin",atividades:"admin",adubacao:"admin",config:"admin",pulverizacao:"admin",pedidos:"admin",admin:"admin"};
  }
  if (nivelAcesso("atividades")==="nenhum") { window.location.href="index.html"; return; }
  document.getElementById("userNome").textContent = perfilAtual.nome || user.email;
  document.getElementById("menuUserNome").textContent = perfilAtual.nome || user.email;
  document.getElementById("menuUserEmail").textContent = user.email;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("appContent").style.display = "flex";
  gerarMenu();
  aplicarPermissoes();
  iniciarListeners();
});

function nivelAcesso(mod) {
  if (perfilAtual.modulos?.[mod]) return perfilAtual.modulos[mod];
  if (perfilAtual.perfil==="admin") return "admin";
  return "nenhum";
}
function isAdmin() { return nivelAcesso("atividades")==="admin"; }
function podeEditar() { return ["admin","operador","encarregado"].includes(nivelAcesso("atividades")); }

function aplicarPermissoes() {
  const adm = isAdmin();
  document.querySelectorAll(".so-admin").forEach(el => el.style.display = adm ? "" : "none");
}

function gerarMenu() {
  const isAdm = Object.values(perfilAtual.modulos||{}).includes("admin") || perfilAtual.perfil==="admin";
  const items = [
    {href:"index.html",ico:"📊",label:"Dashboard"},
    {href:"mapa.html",ico:"🗺️",label:"Mapa de Talhões"},
    {href:"atividades.html",ico:"🌾",label:"Atividades de Campo"},
    {href:"adubacoes.html",ico:"🧪",label:"Adubações"},
    {href:"pulverizacoes.html",ico:"💧",label:"Pulverizações"},
    {href:"pedidos.html",ico:"📦",label:"Pedidos de Insumos"},
  ];
  if (isAdm) items.push({href:"admin.html",ico:"⚙️",label:"Administração"});
  document.getElementById("menuModulos").innerHTML = items.map(m =>
    `<a class="menu-item ${m.href==="atividades.html"?"ativo":""}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`
  ).join("");
  if (isAdm) {
    document.getElementById("tabTalhoes").style.display="";
    document.getElementById("tabEquipe").style.display="";
  }
}

function iniciarListeners() {
  onSnapshot(collection(db,"empreiteiros"), snap => {
    empreiteiros = snap.docs.map(d=>({_docId:d.id,...d.data()}));
    if (tabAtual==="funcionarios") renderizarEquipe();
    if (tabAtual==="nova") renderizarFormNova();
  });
  onSnapshot(collection(db,"talhoesAtividades"), snap => {
    talhoesAtividades = snap.docs.map(d=>({_docId:d.id,...d.data()}));
    if (tabAtual==="talhoes") renderizarTalhoes();
  });
  onSnapshot(collection(db,"registrosAtividade"), snap => {
    registros = snap.docs.map(d=>({_docId:d.id,...d.data()}))
      .sort((a,b)=>(b.salvoEm||b.data||"").localeCompare(a.salvoEm||a.data||""));
    if (tabAtual==="registros") renderizarRegistros();
  });
  onSnapshot(doc(db,"config","geral"), snap => {
    if (snap.exists() && snap.data().atividades) atividades = snap.data().atividades;
  });
}

// ─── NAVEGAÇÃO TABS ───
window.abrirTab = function(tab, btn) {
  tabAtual = tab;
  document.querySelectorAll(".mod-tab").forEach(b=>b.classList.remove("ativo"));
  if (btn) btn.classList.add("ativo");
  document.getElementById("atvContent").style.display = "flex";
  if (tab==="registros") renderizarRegistros();
  else if (tab==="nova") renderizarFormNova();
  else if (tab==="talhoes") renderizarTalhoes();
  else if (tab==="funcionarios") renderizarEquipe();
};

// ══════════════════════════════
// ABA REGISTROS
// ══════════════════════════════
function renderizarRegistros() {
  const content = document.getElementById("atvContent");
  const filtroAtiv = document.getElementById("filtroAtividade")?.value || "";
  const filtroData1 = document.getElementById("filtroData1")?.value || "";
  const filtroData2 = document.getElementById("filtroData2")?.value || "";

  let filtrados = registros;
  if (filtroAtiv) filtrados = filtrados.filter(r=>r.atividade===filtroAtiv);
  if (filtroData1) filtrados = filtrados.filter(r=>r.data>=filtroData1);
  if (filtroData2) filtrados = filtrados.filter(r=>r.data<=filtroData2);

  if (!filtrados.length) {
    content.innerHTML = `
      ${renderFiltros()}
      <div class="vazio"><div class="ico">📋</div><p>Nenhuma sessão encontrada.<br>Crie uma nova sessão na aba <strong>Nova Sessão</strong>.</p></div>`;
    return;
  }

  content.innerHTML = renderFiltros() + filtrados.map(r => {
    const tot = (r.quadras||[]).reduce((s,q)=>s+q.carreiras,0);
    const at = Object.keys(r.atribuicoes||{}).length;
    const pct = tot ? Math.round(at/tot*100) : 0;
    const podEd = podeEditar();
    const adm = isAdmin();
    return `<div class="reg-card">
      <div class="reg-header">
        <div>
          <div class="reg-titulo">🌾 ${r.atividade||"Atividade"} · ${r.talhaoNome||""}</div>
          <div class="reg-meta">${r.fazenda||""} · ${r.data?formatarData(r.data):""}</div>
          <div class="reg-meta">👤 ${r.criadoPor||"—"} · Salvo: ${r.salvoEm?formatarDataHora(r.salvoEm):"—"}</div>
        </div>
      </div>
      <div class="reg-body">
        <div class="reg-stat"><span class="reg-stat-label">Empreiteiros</span><span class="reg-stat-val">${(r.empsDia||[]).map(e=>e.nome).join(", ")||"—"}</span></div>
        <div class="reg-stat"><span class="reg-stat-label">Progresso</span><span class="reg-stat-val">${at}/${tot} carreiras (${pct}%)</span></div>
      </div>
      <div class="reg-acoes">
        ${podEd?`<button class="btn btn-v btn-sm" onclick="carregarRegistro(\'${r._docId}\')">✏️ Continuar</button>`:""}
        <button class="btn btn-c btn-sm" onclick="gerarRelatorio(\'${r._docId}\')">📄 Relatório</button>
        ${adm?`<button class="btn btn-d btn-sm" data-doc="${r._docId}" onclick="excluirRegistro(this)">🗑</button>`:""}
      </div>
    </div>`;
  }).join("");
}

function renderFiltros() {
  return `<div class="filtros-bar">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div style="flex:1;min-width:120px;">
        <label class="filtro-label">Atividade</label>
        <select class="filtro-sel" id="filtroAtividade" onchange="renderizarRegistros()">
          <option value="">Todas</option>
          ${atividades.map(a=>`<option value="${a}">${a}</option>`).join("")}
        </select>
      </div>
      <div style="flex:1;min-width:120px;">
        <label class="filtro-label">De</label>
        <input type="date" class="filtro-sel" id="filtroData1" onchange="renderizarRegistros()">
      </div>
      <div style="flex:1;min-width:120px;">
        <label class="filtro-label">Até</label>
        <input type="date" class="filtro-sel" id="filtroData2" onchange="renderizarRegistros()">
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-c btn-sm" onclick="filtrarSemana()">Esta semana</button>
      <button class="btn btn-c btn-sm" onclick="filtrarMes()">Este mês</button>
      <button class="btn btn-c btn-sm" onclick="limparFiltros()">Limpar</button>
      <button class="btn btn-v btn-sm" onclick="gerarRelatorioGeral()">📄 Relatório geral</button>
    </div>
  </div>`;
}

window.filtrarSemana = function() {
  const hoje = new Date();
  const diaSemana = hoje.getDay();
  const inicio = new Date(hoje); inicio.setDate(hoje.getDate() - diaSemana);
  const fim = new Date(inicio); fim.setDate(inicio.getDate() + 6);
  document.getElementById("filtroData1").value = inicio.toISOString().slice(0,10);
  document.getElementById("filtroData2").value = fim.toISOString().slice(0,10);
  renderizarRegistros();
};

window.filtrarMes = function() {
  const hoje = new Date();
  const inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const fim = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0);
  document.getElementById("filtroData1").value = inicio.toISOString().slice(0,10);
  document.getElementById("filtroData2").value = fim.toISOString().slice(0,10);
  renderizarRegistros();
};

window.limparFiltros = function() {
  document.getElementById("filtroAtividade").value = "";
  document.getElementById("filtroData1").value = "";
  document.getElementById("filtroData2").value = "";
  renderizarRegistros();
};

window.excluirRegistro = async function(btn) {
  const docId = btn.dataset.doc;
  if (!docId) return;
  if (!confirm("Excluir este registro permanentemente?")) return;
  await deleteDoc(doc(db,"registrosAtividade",docId));
  toast("🗑 Registro excluído.");
};

window.gerarRelatorio = function(docId) {
  const r = registros.find(x=>x._docId===docId); if(!r) return;
  const tot = (r.quadras||[]).reduce((s,q)=>s+q.carreiras,0);
  const at = Object.keys(r.atribuicoes||{}).length;

  const resultados = {};
  Object.entries(r.atribuicoes||{}).forEach(([chave, a]) => {
    const [qid, idx] = chave.split("-");
    const q = r.quadras.find(x=>x.id===qid);
    if (!q) return;
    const pesTotal = q.pesCarreira?.[parseInt(idx)+1] || 0;
    const dupla = !!a.func2;

    [a.func1, a.func2].filter(Boolean).forEach(fid => {
      if (!resultados[fid]) {
        const f = r.funcDia.find(x=>x.id===fid);
        resultados[fid] = { nome: f?.nome || fid, empNome: f?.empNome || "", carreiras: 0, pes: 0 };
      }
      resultados[fid].carreiras += dupla ? 0.5 : 1;
      resultados[fid].pes += dupla ? Math.round(pesTotal/2) : pesTotal;
    });
  });

  const porEmp = {};
  Object.values(resultados).forEach(f => {
    const emp = f.empNome || "Equipe";
    if (!porEmp[emp]) porEmp[emp] = [];
    porEmp[emp].push(f);
  });
  if (!Object.keys(porEmp).length) { porEmp["Equipe"] = Object.values(resultados); }

  const htmlContent = `
    <div style="font-family:Arial,sans-serif;max-width:700px;margin:0 auto;padding:24px;color:#111;">
      <div style="border-bottom:3px solid #2d6a2d;padding-bottom:12px;margin-bottom:18px;">
        <div style="font-size:20px;font-weight:900;color:#2d6a2d;">Relatório · ${r.atividade||"Atividade"}</div>
        <div style="font-size:12px;color:#666;margin-top:3px;">${r.fazenda?r.fazenda+" · ":""} ${r.talhaoNome} · ${formatarData(r.data)}</div>
      </div>
      ${at<tot?`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:#c2410c;">⚠️ ${tot-at} carreira(s) sem conferência</div>`:`<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:6px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:#065f46;font-weight:600;">✅ Todas as ${tot} carreiras conferidas</div>`}
      ${Object.entries(porEmp).map(([empNome,funcs])=>{
        const totCarr=funcs.reduce((s,f)=>s+f.carreiras,0);
        const totPes=funcs.reduce((s,f)=>s+f.pes,0);
        return `<div style="margin-bottom:18px;">
          <div style="background:#1a3d1a;color:white;padding:8px 12px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;">
            <span style="font-weight:700;">🤝 ${empNome}</span>
            <span style="font-size:12px;opacity:.8;">${totCarr} carreiras · ${totPes||0} pés</span>
          </div>
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead><tr style="background:#e8f5e8;"><th style="padding:6px 10px;text-align:left;color:#1a3d1a;">#</th><th style="padding:6px 10px;text-align:left;color:#1a3d1a;">Funcionário</th><th style="padding:6px 10px;text-align:center;color:#1a3d1a;">Carreiras</th><th style="padding:6px 10px;text-align:center;color:#1a3d1a;">Pés</th></tr></thead>
            <tbody>${funcs.map((f,i)=>`<tr style="background:${i%2===0?"white":"#f9fafb"}"><td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;">${i+1}</td><td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;font-weight:600;">${f.nome}</td><td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:center;">${f.carreiras}</td><td style="padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:center;">${f.pes||"—"}</td></tr>`).join("")}</tbody>
          </table>
        </div>`;
      }).join("")}
      <div style="margin-top:20px;font-size:11px;color:#888;">Gerado em ${new Date().toLocaleString("pt-BR")}</div>
    </div>`;

  const printWindow = window.open("", "_blank");
  printWindow.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Relatório de Atividade</title>
      <style>
        @media print {
          body { margin: 0; }
          .no-print { display: none; }
        }
      </style>
    </head>
    <body>
      ${htmlContent}
    </body>
    </html>
  `);
  printWindow.document.close();
  printWindow.print();
};

window.gerarRelatorioGeral = function() {
  toast("Funcionalidade de relatório geral ainda não implementada.");
};

// ══════════════════════════════
// ABA NOVA SESSÃO
// ══════════════════════════════
function hoje() { return new Date().toISOString().slice(0,10); }

function renderizarFormNova() {
  const content = document.getElementById("atvContent");
  content.innerHTML = `
    <div class="form-card">
      <div class="form-tit">📋 Dados da Sessão</div>
      <div class="campo"><label>Data</label><input type="date" id="inpSessaoData" value="${hoje()}" class="campo-inp"></div>
      <div class="campo"><label>Atividade</label><select id="selSessaoAtividade" class="campo-sel">${atividades.map(a=>`<option value="${a}">${a}</option>`).join("")}</select></div>
      <div class="campo"><label>Talhão</label><select id="selSessaoTalhao" class="campo-sel"><option value="">Selecione...</option>${talhoesAtividades.map(t=>`<option value="${t._docId}">${t.fazenda?t.fazenda+" · ":""} ${t.nome} (${(t.quadras||[]).length} quadras)</option>`).join("")}</select></div>
    </div>
    <div class="form-card">
      <div class="form-tit">👷 Empreiteiros do Dia</div>
      ${!empreiteiros.length?`<p class="vazio">Nenhum empreiteiro cadastrado.</p>`:
      empreiteiros.map(e=>`
        <div style="background:var(--cl);border-radius:8px;margin-bottom:8px;overflow:hidden;">
          <div class="func-check-row" style="background:white;border-bottom:1px solid var(--cb);">
            <input type="checkbox" class="emp-check-item" id="ec-${e._docId}" value="${e._docId}" onchange="toggleEmpSessao(\'${e._docId}\')">
            <label for="ec-${e._docId}" style="font-weight:700;">🤝 ${e.nome}</label>
            <span style="font-size:.7rem;color:var(--c)">${(e.funcionarios||[]).length} func.</span>
          </div>
          <div id="turma-${e._docId}" style="display:none;padding:6px 12px 8px;">
            ${(e.funcionarios||[]).map(f=>`
              <div class="func-check-row" style="padding:6px 0;background:none;">
                <input type="checkbox" class="func-check-item" id="fc-${f.id}" value="${f.id}" data-emp="${e._docId}" data-empnome="${e.nome}" data-nome="${f.nome}" checked>
                <label for="fc-${f.id}">${f.nome}</label>
              </div>`).join("")}
          </div>
        </div>`).join("")}
    </div>
    <button class="btn btn-v btn-bloco" onclick="iniciarSessaoAtividade()">▶ Iniciar Sessão</button>`;
}

window.toggleEmpSessao=function(empId){
  const chk=document.getElementById("ec-"+empId);
  const turma=document.getElementById("turma-"+empId);
  if(turma) turma.style.display=chk.checked?"block":"none";
};

window.iniciarSessaoAtividade=async function(){
  const talhaoDocId=document.getElementById("selSessaoTalhao").value;
  const atividade=document.getElementById("selSessaoAtividade").value;
  const data=document.getElementById("inpSessaoData").value;
  if(!talhaoDocId||!atividade||!data){toast("Preencha todos os campos.");return;}
  const t=talhoesAtividades.find(x=>x._docId===talhaoDocId);
  if(!t||!t.quadras.length){toast("Este talhão não tem quadras cadastradas.");return;}
  const empsSel=[...document.querySelectorAll(".emp-check-item:checked")].map(el=>el.value);
  if(!empsSel.length){toast("Selecione pelo menos um empreiteiro.");return;}
  const funcDia=[], empsDia=[];
  empsSel.forEach(empId=>{
    const emp=empreiteiros.find(e=>e._docId===empId); if(!emp) return;
    empsDia.push({id:empId,nome:emp.nome});
    [...document.querySelectorAll(`.func-check-item[data-emp="${empId}"]:checked`)].forEach(el=>{
      funcDia.push({id:el.value,nome:el.dataset.nome,empId,empNome:emp.nome});
    });
  });
  if(!funcDia.length){toast("Nenhum funcionário selecionado.");return;}
  
  // Cria a sessão no Firestore e carrega
  const newSession = {talhaoDocId,talhaoNome:t.nome,fazenda:t.fazenda||"",atividade,data,quadras:t.quadras.map(q=>({...q})),funcDia,empsDia,atribuicoes:{},criadoPor:usuarioAtual.email,salvoEm:new Date().toISOString()};
  const ref = await addDoc(collection(db,"registrosAtividade"), newSession);
  sessaoAtual = {_docId: ref.id, ...newSession};
  abaConf = sessaoAtual.quadras[0]?.id||null;
  mostrarConferencia();
  toast("✅ Sessão iniciada!");
};

// ══════════════════════════════
// ABA TALHÕES
// ══════════════════════════════
function renderizarTalhoes() {
  if (tabAtual!=="talhoes") return;
  const adm = isAdmin();
  const content = document.getElementById("atvContent");
  content.innerHTML = `
    ${adm?`<div class="form-card">
      <div class="form-tit">➕ Adicionar Talhão para Atividades</div>
      <div class="campo"><label>Talhão</label><select id="selTalhaoAtiv" class="campo-sel"><option value="">Selecione...</option>${talhoesAtividades.map(t=>`<option value="${t._docId}">${t.fazenda?t.fazenda+" · ":""} ${t.nome}</option>`).join("")}</select></div>
      <button class="btn btn-v btn-bloco" onclick="salvarTalhaoAtividade()">Adicionar</button>
    </div>`:
    `<div class="vazio"><div class="ico">⛔</div><p>Você não tem permissão para gerenciar talhões.</p></div>`}
    ${!talhoesAtividades.length?`<div class="vazio"><div class="ico">🌿</div><p>Nenhum talhão configurado para atividades.</p></div>`:
    talhoesAtividades.map(t=>`
      <div class="talhao-atv-card">
        <div class="talhao-atv-header" onclick="toggleTalhaoBody(\'${t._docId}\')">
          <div class="talhao-atv-nome">${t.fazenda?t.fazenda+" · ":""} ${t.nome}</div>
          <div class="talhao-atv-meta">${(t.quadras||[]).length} quadras <span id="arr-${t._docId}">▶</span></div>
        </div>
        <div class="talhao-atv-body" id="tbody-${t._docId}" style="display:none;">
          ${(t.quadras||[]).map(q=>`
            <div class="quadra-atv-item">
              <div class="quadra-atv-header" onclick="togglePesGrid(\'${q.id}\')">
                <div class="talhao-atv-nome">${q.nome}</div>
                <div class="talhao-atv-meta">${q.carreiras} carreiras <span id="qarr-${q.id}">▶</span></div>
                ${adm?`<button class="btn-rm-small" onclick="event.stopPropagation();removerQuadra(\'${t._docId}\',\'${q.id}\')">✕</button>`:""}
              </div>
              <div class="pes-grid" id="pes-${q.id}" style="display:none;">
                ${Array.from({length:q.carreiras},(_,i)=>i+1).map(c=>`
                  <div class="pes-wrap">
                    <label>Carr. ${c}</label>
                    <input type="number" value="${q.pesCarreira?.[c]||0}" onchange="atualizarPes(\'${t._docId}\',\'${q.id}\',${c},this.value)">
                  </div>`).join("")}
              </div>
            </div>`).join("")}
          ${adm?`<div style="display:flex;gap:8px;margin-top:10px;">
            <input type="text" id="inpQNome-${t._docId}" placeholder="Nome da quadra..." class="campo-inp" style="flex:1;">
            <input type="number" id="inpQCarr-${t._docId}" placeholder="Carreiras" class="campo-inp" style="width:80px;">
            <button class="btn btn-v btn-sm" onclick="adicionarQuadra(\'${t._docId}\')">+</button>
          </div>`:
          `<div class="vazio" style="padding:10px;"><div class="ico" style="font-size:2rem;">🔒</div><p>Você não pode adicionar quadras.</p></div>`}
        </div>
      </div>`).join("")}
    `;
}

window.salvarTalhaoAtividade=async function(){
  const talhaoId=document.getElementById("selTalhaoAtiv").value;
  const talhao=talhoesAtividades.find(t=>t._docId===talhaoId); if(!talhao){toast("Selecione um talhão.");return;}
  if(talhoesAtividades.find(t=>t.talhaoId===talhao.talhaoId)){toast("Talhão já está na lista.");return;}
  await addDoc(collection(db,"talhoesAtividades"),{talhaoId:talhao.talhaoId,nome:talhao.nome,fazenda:talhao.fazenda||"",quadras:[],criadoEm:new Date().toISOString()});
  toast("✅ Talhão adicionado!");
};
window.removerTalhaoAtividade=async function(docId){if(!confirm("Remover este talhão?"))return;await deleteDoc(doc(db,"talhoesAtividades",docId));};

window.adicionarQuadra = async function(talhaoDocId) {
  const nome = document.getElementById("inpQNome-"+talhaoDocId).value.trim();
  const carreiras = parseInt(document.getElementById("inpQCarr-"+talhaoDocId).value);
  if (!nome||!carreiras) { toast("⚠️ Preencha nome e nº de carreiras."); return; }
  const t = talhoesAtividades.find(x=>x._docId===talhaoDocId); if (!t) return;
  const pesCarreira = {};
  for(let i=1;i<=carreiras;i++) pesCarreira[i]=0;
  await updateDoc(doc(db,"talhoesAtividades",talhaoDocId),{quadras:[...(t.quadras||[]),{id:"q"+Date.now(),nome,carreiras,pesCarreira}]});
  document.getElementById("inpQNome-"+talhaoDocId).value="";
  document.getElementById("inpQCarr-"+talhaoDocId).value="";
  toast("✅ Quadra adicionada!");
};

window.removerQuadra = async function(talhaoDocId, quadraId) {
  if (!confirm("Remover esta quadra?")) return;
  const t = talhoesAtividades.find(x=>x._docId===talhaoDocId); if (!t) return;
  await updateDoc(doc(db,"talhoesAtividades",talhaoDocId),{quadras:t.quadras.filter(q=>q.id!==quadraId)});
};

window.atualizarPes = async function(talhaoDocId, quadraId, carreira, valor) {
  const t = talhoesAtividades.find(x=>x._docId===talhaoDocId); if (!t) return;
  const quadras = t.quadras.map(q=>{
    if (q.id!==quadraId) return q;
    const pc={...q.pesCarreira};
    const v=parseInt(valor); if(v>0) pc[carreira]=v; else delete pc[carreira];
    return{...q,pesCarreira:pc};
  });
  await updateDoc(doc(db,"talhoesAtividades",talhaoDocId),{quadras});
  toast("Pés por carreira atualizados!");
};

window.toggleTalhaoBody = function(id) {
  const el=document.getElementById("tbody-"+id), arr=document.getElementById("arr-"+id);
  if(!el) return; const ab=el.style.display!=="none";
  el.style.display=ab?"none":"block"; if(arr) arr.textContent=ab?"▶":"▼";
};
window.togglePesGrid = function(qid) {
  const el=document.getElementById("pes-"+qid), arr=document.getElementById("qarr-"+qid);
  if(!el) return; const ab=el.style.display!=="none";
  el.style.display=ab?"none":"grid"; if(arr) arr.textContent=ab?"▶":"▼";
};

  const adm = isAdmin();

  content.innerHTML = `

      </div>
    </div>`:
    `<div class="vazio"><div class="ico">⛔</div><p>Você não tem permissão para gerenciar empreiteiros.</p></div>`}
    ${!empreiteiros.length?`<div class="vazio"><div class="ico">🤝</div><p>Nenhum empreiteiro cadastrado.</p></div>`:
    empreiteiros.map((emp,ei)=>`
      <div class="card-emp" style="border-top:4px solid ${CORES[ei%CORES.length]};">
        <div class="card-emp-hdr">
          <div class="emp-avatar" style="background:${CORES[ei%CORES.length]}">${inic(emp.nome)}</div>
          <div class="emp-info"><div class="emp-nome">🤝 ${emp.nome}</div><div class="emp-sub">${(emp.funcionarios||[]).length} funcionário(s)</div></div>
          ${adm?`<button onclick="deletarEmpreiteiro(\'${emp._docId}\')" class="btn-rm-small">✕</button>`:""}
        </div>
        <div class="func-lista">
          ${(emp.funcionarios||[]).map(f=>`
            <div class="func-item">
              <div class="func-ini" style="background:${CORES[ei%CORES.length]}">${inic(f.nome)}</div>
              <span class="func-nome">${f.nome}</span>
              ${adm?`<button onclick="removerFuncEmp(\'${emp._docId}\',\'${f.id}\')" class="btn-rm-small">✕</button>`:""}
            </div>`).join("")}
          ${adm?`<div style="display:flex;gap:8px;margin-top:8px;">
            <input type="text" id="inpFuncEmp-${emp._docId}" placeholder="Nome do funcionário..." class="campo-inp" style="flex:1;">
            <button class="btn btn-v btn-sm" onclick="salvarFuncEmp(\'${emp._docId}\')">+</button>
          </div>`:
          `<div class="vazio" style="padding:10px;"><div class="ico" style="font-size:2rem;">🔒</div><p>Você não pode adicionar funcionários.</p></div>`}
        </div>
      </div>`).join("")}
    `;
}

window.salvarEmpreiteiro = async function() {
  const nome=document.getElementById("inpNovoEmp").value.trim();
  if(!nome){toast("⚠️ Informe o nome.");return;}
  await addDoc(collection(db,"empreiteiros"),{nome,funcionarios:[],criadoEm:new Date().toISOString()});
  document.getElementById("inpNovoEmp").value=""; toast("✅ "+nome+" adicionado!");
};
window.deletarEmpreiteiro = async function(docId) {
  if(!confirm("Remover este empreiteiro e sua turma?"))return;
  await deleteDoc(doc(db,"empreiteiros",docId));
  toast("🗑 Empreiteiro removido.");
};
window.salvarFuncEmp = async function(empDocId) {
  const nome=document.getElementById("inpFuncEmp-"+empDocId).value.trim();
  if(!nome){toast("⚠️ Informe o nome.");return;}
  const emp=empreiteiros.find(e=>e._docId===empDocId);if(!emp)return;
  await updateDoc(doc(db,"empreiteiros",empDocId),{funcionarios:[...(emp.funcionarios||[]),{id:"f"+Date.now(),nome}]});
  document.getElementById("inpFuncEmp-"+empDocId).value=""; toast("✅ "+nome+" adicionado!");
};
window.removerFuncEmp = async function(empDocId,funcId) {
  const emp=empreiteiros.find(e=>e._docId===empDocId);if(!emp)return;
  await updateDoc(doc(db,"empreiteiros",empDocId),{funcionarios:(emp.funcionarios||[]).filter(f=>f.id!==funcId)});
  toast("🗑 Funcionário removido.");
};

function formatarData(d){if(!d)return"—";const[a,m,dd]=d.split("-");return`${dd}/${m}/${a}`;}
function formatarDataHora(iso){try{const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}catch{return iso;}}
function toast(msg,dur=3000){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),dur);}
