<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ConilonTech · Pedidos de Insumos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",authDomain:"talhoes-df836.firebaseapp.com",projectId:"talhoes-df836",storageBucket:"talhoes-df836.firebasestorage.app",messagingSenderId:"1047022702039",appId:"1:1047022702039:web:001cf6a3c028c494ab8f92"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});
let usuarioAtual=null,perfilAtual={},talhoes=[],pedidos=[],pedidoWIP=null,pedItemAtivo=null,pedMapIniciado=false,pedMap,pedPolMap={},pedSidebarAberta=true,tabAtual='mapa',pedidoEditandoId=null;
const PED_CORES={ativo:{border:'rgba(123,198,126,.9)',fill:'rgba(74,140,63,.4)'},reforma:{border:'rgba(220,190,90,.9)',fill:'rgba(201,168,76,.4)'},colhido:{border:'rgba(196,133,90,.9)',fill:'rgba(139,94,60,.4)'}};
onAuthStateChanged(auth,async(user)=>{
  if(!user){window.location.href='login.html';return;}
  usuarioAtual=user;
  const snap=await getDoc(doc(db,'usuarios',user.uid));
  if(!snap.exists()){await signOut(auth);return;}
  perfilAtual=snap.data();
  if(!perfilAtual.modulos&&perfilAtual.perfil==='admin')perfilAtual.modulos={mapa:'admin',atividades:'admin',adubacao:'admin',config:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin'};
  document.getElementById('userNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserEmail').textContent=user.email;
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appContent').style.display='flex';
  gerarMenu();
  if(!isAdmin())document.getElementById('fabNovoPedido').style.display='none';
  checarRascunhoPed();
  onSnapshot(collection(db,'talhoes'),snap=>{talhoes=snap.docs.map(d=>({_docId:d.id,...d.data()}));if(pedMapIniciado)renderizarPedPoligonos();});
  onSnapshot(collection(db,'pedidos'),snap=>{pedidos=snap.docs.map(d=>({_docId:d.id,...d.data()})).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));if(tabAtual==='lista')renderizarListaPedidos();});
  setTimeout(iniciarMapaPedidos,200);
});
function isAdmin(){return Object.values(perfilAtual.modulos||{}).includes('admin')||perfilAtual.perfil==='admin';}
// Converte string com vírgula brasileira em número (ex: "13,5" → 13.5)
function parseDose(s){if(s==null||s==='')return 0;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?0:n;}
function gerarMenu() {
  const isAdm = Object.values(perfilAtual.modulos || {}).includes('admin') || perfilAtual.perfil === 'admin';
  const pg = (window.location.pathname.split('/').pop() || 'index.html');
  const secoes = [
    { label: 'Principal', items: [
      { href:'index.html',         ico:'📊', label:'Dashboard' },
      { href:'agenda.html',        ico:'📅', label:'Agenda' },
      { href:'mapa.html',          ico:'🗺️', label:'Mapa de Talhões',   acesso:'mapa' },
      { href:'adubacoes.html',     ico:'🧪', label:'Adubações',         acesso:'adubacao' },
      { href:'pulverizacoes.html', ico:'💧', label:'Pulverizações',     acesso:'pulverizacao' },
      { href:'drench.html',        ico:'🌱', label:'Drench Preventivo', acesso:'drench' },
      { href:'irrigacao.html',     ico:'💦', label:'Irrigação',         acesso:'irrigacao' },
      { href:'herbicida.html',     ico:'🌿', label:'Herbicida',         acesso:'herbicida' },
      { href:'atividades.html',    ico:'🌾', label:'Atividades',        acesso:'atividades' },
      { href:'equipe.html',        ico:'👥', label:'Equipe',            acesso:'equipe' },
      { href:'estoque.html',       ico:'🏬', label:'Estoque',           acesso:'estoque' },
      { href:'pedidos.html',       ico:'📦', label:'Pedidos',           acesso:'pedidos' },
      { href:'cotacoes.html',      ico:'💰', label:'Cotações',          acesso:'cotacoes' },
    ]},
    { label: 'Análise', items: [
      { href:'gestao.html',        ico:'📈', label:'Gestão',            acesso:'gestao' },
      { href:'analises.html',      ico:'🔬', label:'Análises',          acesso:'analises' },
      { href:'recomendacoes.html', ico:'💊', label:'Recomendações',     acesso:'recomendacoes' },
      { href:'planejamento.html',  ico:'🗓️', label:'Planejamento',      acesso:'planejamento' },
      ...(isAdm ? [{ href:'admin.html', ico:'⚙️', label:'Administração' }] : []),
    ]},
  ];
  document.getElementById('menuModulos').innerHTML = secoes.map(s => {
    const html = s.items.map(m => {
      if (typeof nivelAcesso === 'function' && m.acesso && nivelAcesso(m.acesso) === 'nenhum') return '';
      return `<a class="menu-item${pg===m.href?' ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`;
    }).filter(Boolean).join('');
    return html ? `<div class="menu-secao">${s.label}</div>${html}` : '';
  }).join('');
}
function iniciarMapaPedidos(){
  if(pedMapIniciado){pedMap?.invalidateSize();return;}
  pedMapIniciado=true;
  pedMap=L.map('pedidosMap',{center:[-18.7166,-40.4000],zoom:14});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}).addTo(pedMap);
  setTimeout(()=>pedMap.invalidateSize(),300);
  renderizarPedPoligonos();
}
function pedCorPoly(id){
  const t=talhoes.find(x=>x.id===id),cor=PED_CORES[t?.status||'ativo']||PED_CORES.ativo;
  const item=pedidoWIP&&pedItemAtivo!==null?pedidoWIP.itens[pedItemAtivo]:null;
  const sel=item&&item.talhoes.has(id),emOutro=pedidoWIP&&pedidoWIP.itens.some((it,i)=>i!==pedItemAtivo&&it.talhoes.has(id));
  if(sel)return{color:'#f5c842',weight:4,fillColor:'rgba(245,200,66,.55)',fillOpacity:1};
  if(emOutro)return{color:'#60a5fa',weight:2.5,fillColor:'rgba(96,165,250,.3)',fillOpacity:1};
  return{color:cor.border,weight:2,fillColor:cor.fill,fillOpacity:1};
}
function renderizarPedPoligonos(){
  if(!pedMap)return;
  Object.values(pedPolMap).forEach(p=>pedMap.removeLayer(p));pedPolMap={};
  talhoes.forEach(t=>{
    if(!t.coordenadas||t.coordenadas.length<3)return;
    const latlngs=t.coordenadas.map(c=>Array.isArray(c)?c:[c.lat,c.lng]);
    const poly=L.polygon(latlngs,pedCorPoly(t.id)).addTo(pedMap);
    poly.bindTooltip(`<b>${t.id}</b> · ${t.nome}`,{sticky:true,direction:'top'});
    poly.on('click',e=>{L.DomEvent.stopPropagation(e);clicarTalhao(t.id);});
    poly.on('mouseover',()=>{const c=pedCorPoly(t.id);poly.setStyle({...c,weight:c.weight+1,fillOpacity:.6});});
    poly.on('mouseout',()=>poly.setStyle(pedCorPoly(t.id)));
    pedPolMap[t.id]=poly;
  });
  renderizarPedSidebar();
}
function renderizarPedSidebar(){
  const lista=document.getElementById('pedSidebarList');if(!lista)return;
  const fazendas={};
  talhoes.forEach(t=>{const f=t.fazenda||'Sem fazenda';if(!fazendas[f])fazendas[f]=[];fazendas[f].push(t);});
  lista.innerHTML=Object.entries(fazendas).sort().map(([faz,ts])=>`
    <div class="sb-faz">${faz}</div>
    ${ts.map(t=>{const item=pedidoWIP&&pedItemAtivo!==null?pedidoWIP.itens[pedItemAtivo]:null,sel=item&&item.talhoes.has(t.id),temMapa=t.coordenadas?.length>=3;
    return `<div class="msb-item ${sel?'active':''}" onclick="${temMapa?`clicarTalhao('${t.id}')`:''}" style="${!temMapa?'opacity:.4;cursor:default;':''}">
      <div class="msb-dot ${t.status||'ativo'}"></div>
      <div class="msb-info"><div class="msb-id">${t.id}</div><div class="msb-nome">${t.nome}</div></div>
      ${sel?'<span style="color:var(--v);font-weight:700;">✓</span>':''}
    </div>`;}).join('')}`).join('');
}
function clicarTalhao(id){
  if(!isAdmin())return;
  if(!pedidoWIP){iniciarNovoPedido();return;}
  if(pedItemAtivo===null)pedItemAtivo=0;
  const item=pedidoWIP.itens[pedItemAtivo];
  if(item.talhoes.has(id))item.talhoes.delete(id);else item.talhoes.add(id);
  renderizarPedPoligonos();renderizarItensPedido();
}
window.clicarTalhao=clicarTalhao;
window.togglePedSidebar=function(){pedSidebarAberta=!pedSidebarAberta;const sb=document.getElementById('pedSidebar'),btn=document.getElementById('btnExpandPedSb');if(sb)sb.style.display=pedSidebarAberta?'flex':'none';if(btn)btn.style.display=pedSidebarAberta?'none':'flex';if(pedMap)setTimeout(()=>pedMap.invalidateSize(),100);};
function iniciarNovoPedido(){if(!isAdmin()){toast('⛔ Sem permissão.');return;}pedidoEditandoId=null;pedidoWIP={itens:[]};adicionarItemPedido();pedItemAtivo=0;document.getElementById('painelTit').textContent='📦 Novo Pedido';document.getElementById('btnSalvarPed').textContent='💾 Salvar Pedido';document.getElementById('painelPedido').style.display='flex';document.getElementById('fabNovoPedido').style.display='none';renderizarItensPedido();}
// Carrega um pedido existente de volta no painel de planejamento para edição
window.editarPedido=function(docId){
  if(!isAdmin()){toast('⛔ Sem permissão.');return;}
  const p=pedidos.find(x=>x._docId===docId); if(!p){toast('⚠️ Pedido não encontrado.');return;}
  pedidoEditandoId=docId;
  pedidoWIP={itens:(p.itens||[]).map(it=>({
    produto: it.produto||'',
    quantidade: it.dosePorHa!=null ? String(it.dosePorHa) : '',
    unidade: it.unidade||'kg',
    modo: it.modo||'terrestre',
    talhoes: new Set((it.talhoes||[]).map(t=>t.id).filter(Boolean))
  }))};
  if(!pedidoWIP.itens.length) adicionarItemPedido();
  pedItemAtivo=0;
  document.getElementById('painelTit').textContent='✏️ Editar Pedido';
  document.getElementById('btnSalvarPed').textContent='💾 Salvar Alterações';
  document.getElementById('painelPedido').style.display='flex';
  document.getElementById('fabNovoPedido').style.display='none';
  abrirTab('mapa',document.getElementById('ptab-mapa'));
  renderizarItensPedido();renderizarPedPoligonos();
};
window.iniciarNovoPedido=iniciarNovoPedido;
const MODO_APLIC={terrestre:'🚜 Terrestre',aerea:'✈️ Aérea',fertirrigacao:'💧 Fertirrigação',drench:'🌱 Drench'};
function adicionarItemPedido(){if(!pedidoWIP)return;pedidoWIP.itens.push({produto:'',quantidade:'',unidade:'kg',modo:'terrestre',talhoes:new Set()});pedItemAtivo=pedidoWIP.itens.length-1;renderizarItensPedido();}
window.adicionarItemPedido=adicionarItemPedido;
function renderizarItensPedido(){
  if(!pedidoWIP)return;
  const el=document.getElementById('itensPedido');if(!el)return;
  el.innerHTML=pedidoWIP.itens.map((item,i)=>{
    const ativo=i===pedItemAtivo,nTal=item.talhoes.size;
    const outrosComTal = pedidoWIP.itens.map((it,idx)=>({idx,n:it.talhoes.size})).filter(o=>o.idx!==i && o.n>0);
    // Calcular área total dos talhões selecionados e dose total
    const areaTotal = [...item.talhoes].reduce((s,id)=>{
      const t=talhoes.find(x=>x.id===id);
      return s + (parseDose(t?.area)||0);
    },0);
    const dosePorHa = parseDose(item.quantidade)||0;
    const doseTotal = dosePorHa * areaTotal;
    const unidade = item.unidade || 'kg';
    const chips=[...item.talhoes].map(id=>{
      const t=talhoes.find(x=>x.id===id);
      const a=t?.area?` (${t.area}ha)`:'';
      return `<span class="chip-tal">${t?t.id:id}${a}<button onclick="remTalhaoPed(${i},'${id}')">✕</button></span>`;
    }).join('');
    // Resumo curto para item inativo (não colapsa totalmente, mostra o que tem)
    const resumoInativo = !ativo ? `<div class="ped-item-resumo">
      ${item.produto?`<strong>${item.produto}</strong>`:'<span style="color:var(--t4);">Sem produto</span>'}
      ${item.modo?` · ${MODO_APLIC[item.modo]||item.modo}`:''}
      ${dosePorHa>0?` · ${dosePorHa} ${unidade}/ha`:''}
      ${nTal>0?` · ${nTal} talhão(ões)`:''}
      ${doseTotal>0?` · <span class="ped-total-mini">${doseTotal.toLocaleString('pt-BR')} ${unidade}</span>`:''}
    </div>` : '';
    return `<div onclick="ativarItemPed(${i})" class="ped-item ${ativo?'ativo':''}">
      <div class="ped-item-hdr"><span class="ped-item-num">Insumo ${i+1}</span>
        <div style="display:flex;align-items:center;gap:5px;">
          ${ativo&&nTal>0?`<span class="badge-sel">${nTal} talhão(ões)</span>`:''}
          ${ativo&&nTal===0?`<span class="badge-sel">← Mapa</span>`:''}
          <button onclick="event.stopPropagation();remItemPed(${i})" class="btn-rm-item">✕</button>
        </div>
      </div>
      ${resumoInativo}
      ${ativo?`<div class="ped-item-fields" onclick="event.stopPropagation()">
        <input type="text" placeholder="Produto / Insumo (ex: Ureia)" value="${item.produto||''}" oninput="setPedProduto(${i},this.value)" class="ped-inp">
        <select onchange="setPedModo(${i},this.value)" class="ped-inp ped-modo-sel">
          ${Object.entries(MODO_APLIC).map(([k,lab])=>`<option value="${k}" ${(item.modo||'terrestre')===k?'selected':''}>${lab}</option>`).join('')}
        </select>
        <div class="ped-dose-row">
          <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="Dose por hectare" value="${item.quantidade||''}" oninput="setPedQtd(${i},this.value)" class="ped-inp ped-dose-inp-num">
          <select onchange="setPedUnidade(${i},this.value)" class="ped-und-sel">
            ${['kg','g','L','mL','sc','t'].map(u=>`<option value="${u}" ${(item.unidade||'kg')===u?'selected':''}>${u}/ha</option>`).join('')}
          </select>
        </div>
        <div class="ped-total-box" id="pedTotalBox-${i}">
          ${nTal===0
            ? '<span style="color:var(--t4);">👇 Selecione talhões no mapa pra calcular o total</span>'
            : dosePorHa===0
              ? `<span style="color:var(--t4);">Total a pedir aparecerá quando informar a dose</span>`
              : `<span class="ped-total-label">Total a pedir:</span> <strong class="ped-total-val">${doseTotal.toLocaleString('pt-BR')} ${unidade}</strong> <span class="ped-total-aux">(${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)</span>`
          }
        </div>
        ${nTal>0?`<div class="chips-talhoes">${chips}</div>`:''}
        ${outrosComTal.length?`<div class="repetir-row" onclick="event.stopPropagation()"><span class="repetir-lab">🔁 Repetir talhões de:</span> ${outrosComTal.map(o=>`<button class="btn-repetir" onclick="pedRepetirTalhoes(${i},${o.idx})">Insumo ${o.idx+1} · ${o.n}</button>`).join('')}</div>`:''}
        <div class="dica-mapa">👆 Clique nos talhões do mapa</div>
      </div>`:''}
    </div>`;
  }).join('');
  const total=new Set(pedidoWIP.itens.flatMap(it=>[...it.talhoes])).size;
  const el2=document.getElementById('pedResumo');if(el2)el2.textContent=`${pedidoWIP.itens.length} insumo(s) · ${total} talhão(ões)`;
  renderizarPedPoligonos();
  salvarRascunhoPed();
}

// Atualiza só a caixa do total daquele insumo (não re-renderiza tudo, preserva foco no input)
window.atualizarTotalPed = function(i) {
  const item = pedidoWIP?.itens?.[i]; if (!item) return;
  const box = document.getElementById('pedTotalBox-'+i); if (!box) return;
  const areaTotal = [...item.talhoes].reduce((s,id)=>{
    const t=talhoes.find(x=>x.id===id); return s + (parseDose(t?.area)||0);
  },0);
  const dosePorHa = parseDose(item.quantidade)||0;
  const doseTotal = dosePorHa * areaTotal;
  const unidade = item.unidade || 'kg';
  const nTal = item.talhoes.size;
  if (nTal === 0) box.innerHTML = '<span style="color:var(--t4);">👇 Selecione talhões no mapa pra calcular o total</span>';
  else if (dosePorHa === 0) box.innerHTML = '<span style="color:var(--t4);">Total a pedir aparecerá quando informar a dose</span>';
  else box.innerHTML = `<span class="ped-total-label">Total a pedir:</span> <strong class="ped-total-val">${doseTotal.toLocaleString('pt-BR')} ${unidade}</strong> <span class="ped-total-aux">(${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)</span>`;
};
// Setters expostos no window: handlers inline rodam no escopo global e não enxergam a variável de módulo pedidoWIP
window.setPedProduto=function(i,v){const it=pedidoWIP?.itens?.[i];if(it)it.produto=v;};
window.setPedQtd=function(i,v){const it=pedidoWIP?.itens?.[i];if(it){it.quantidade=v;atualizarTotalPed(i);}};
window.setPedUnidade=function(i,v){const it=pedidoWIP?.itens?.[i];if(it){it.unidade=v;atualizarTotalPed(i);}};
window.setPedModo=function(i,v){const it=pedidoWIP?.itens?.[i];if(it)it.modo=v;renderizarItensPedido();};
window.ativarItemPed=function(i){pedItemAtivo=i;renderizarItensPedido();};
window.remItemPed=function(i){pedidoWIP.itens.splice(i,1);if(!pedidoWIP.itens.length)adicionarItemPedido();else if(pedItemAtivo>=pedidoWIP.itens.length)pedItemAtivo=pedidoWIP.itens.length-1;renderizarItensPedido();};
window.remTalhaoPed=function(i,id){pedidoWIP.itens[i].talhoes.delete(id);renderizarItensPedido();};
window.pedSelTodos=function(){if(pedItemAtivo===null||!pedidoWIP)return;talhoes.forEach(t=>{if(t.coordenadas?.length>=3)pedidoWIP.itens[pedItemAtivo].talhoes.add(t.id);});renderizarItensPedido();};
window.pedLimparSel=function(){if(pedItemAtivo===null||!pedidoWIP)return;pedidoWIP.itens[pedItemAtivo].talhoes.clear();renderizarItensPedido();};
window.pedRepetirTalhoes=function(destino,origem){
  if(!pedidoWIP)return;
  const src=pedidoWIP.itens[origem], dst=pedidoWIP.itens[destino];
  if(!src||!dst)return;
  const antes=dst.talhoes.size;
  src.talhoes.forEach(id=>dst.talhoes.add(id));
  renderizarItensPedido();
  if(typeof toast==='function') toast(`🔁 Talhões do Insumo ${origem+1} aplicados (${dst.talhoes.size-antes} novo(s)).`);
};
window.cancelarPedido=function(){if(pedidoWIP&&!confirm(pedidoEditandoId?'Descartar as alterações?':'Cancelar o pedido?'))return;pedidoWIP=null;pedItemAtivo=null;pedidoEditandoId=null;limparRascunhoPed();document.getElementById('painelPedido').style.display='none';document.getElementById('fabNovoPedido').style.display=isAdmin()?'flex':'none';renderizarPedPoligonos();};

// ─── RASCUNHO AUTOMÁTICO (evita perder edições se o salvamento falhar) ───
const RASCUNHO_KEY_PED='pedidoRascunhoWIP';
function salvarRascunhoPed(){
  try{
    if(pedidoWIP && pedidoWIP.itens && pedidoWIP.itens.some(it=>(it.produto&&it.produto.trim())||it.talhoes.size)){
      localStorage.setItem(RASCUNHO_KEY_PED, JSON.stringify({em:new Date().toISOString(), editandoId:pedidoEditandoId||null, itens:pedidoWIP.itens.map(it=>({produto:it.produto||'',quantidade:it.quantidade||'',unidade:it.unidade||'kg',modo:it.modo||'terrestre',talhoes:[...it.talhoes]}))}));
    }
  }catch(e){}
}
function limparRascunhoPed(){ try{ localStorage.removeItem(RASCUNHO_KEY_PED); }catch(e){} const b=document.getElementById('rascunhoBanner'); if(b)b.style.display='none'; }
function temRascunhoPed(){ try{ const d=localStorage.getItem(RASCUNHO_KEY_PED); if(!d)return null; const o=JSON.parse(d); return (o&&o.itens&&o.itens.length)?o:null; }catch(e){ return null; } }
function checarRascunhoPed(){ const o=temRascunhoPed(); const b=document.getElementById('rascunhoBanner'); if(o&&b&&isAdmin()){ b.style.display='flex'; } else if(b){ b.style.display='none'; } }
window.recuperarRascunhoPed=function(){
  const o=temRascunhoPed(); if(!o||!isAdmin())return;
  pedidoWIP={itens:o.itens.map(it=>({produto:it.produto||'',quantidade:it.quantidade||'',unidade:it.unidade||'kg',modo:it.modo||'terrestre',talhoes:new Set(it.talhoes||[])}))};
  pedidoEditandoId=o.editandoId||null;
  if(!pedidoWIP.itens.length)adicionarItemPedido();
  pedItemAtivo=0;
  document.getElementById('painelTit').textContent=pedidoEditandoId?'✏️ Editar Pedido':'📦 Novo Pedido';
  document.getElementById('btnSalvarPed').textContent=pedidoEditandoId?'💾 Salvar Alterações':'💾 Salvar Pedido';
  document.getElementById('rascunhoBanner').style.display='none';
  document.getElementById('painelPedido').style.display='flex';
  document.getElementById('fabNovoPedido').style.display='none';
  abrirTab('mapa',document.getElementById('ptab-mapa'));
  renderizarItensPedido();
  toast('🗒️ Rascunho recuperado! Confira e salve novamente.');
};
window.descartarRascunhoPed=function(){ if(confirm('Descartar o pedido não salvo?')) limparRascunhoPed(); };
window.salvarPedidoWIP=async function(){
  if(!pedidoWIP)return;
  const itensValidos=pedidoWIP.itens.filter(it=>it.produto.trim());
  if(!itensValidos.length){toast('⚠️ Preencha ao menos um produto.');return;}
  const semTal=itensValidos.find(it=>it.talhoes.size===0);
  if(semTal){toast(`⚠️ "${semTal.produto}" sem talhões.`);return;}
  const semDose=itensValidos.find(it=>!parseDose(it.quantidade));
  if(semDose){toast(`⚠️ "${semDose.produto}" sem dose/ha.`);return;}
  const btn=document.getElementById('btnSalvarPed');btn.disabled=true;btn.textContent='Salvando...';
  try{
    const itensFS=itensValidos.map(it=>{
      const talhoesArr=[...it.talhoes].map(id=>{
        const t=talhoes.find(x=>x.id===id);
        return {id, nome:t?.nome||id, fazenda:t?.fazenda||'', area:parseDose(t?.area)||0};
      });
      const areaTotal = talhoesArr.reduce((s,t)=>s+t.area, 0);
      const dosePorHa = parseDose(it.quantidade)||0;
      const unidade = it.unidade || 'kg';
      const total = dosePorHa * areaTotal;
      return {
        produto: it.produto.trim(),
        modo: it.modo || 'terrestre',
        dosePorHa,
        unidade,
        areaTotal: Math.round(areaTotal*100)/100,
        total: Math.round(total*100)/100,
        // Mantém o campo "quantidade" legível para retrocompat (já existem pedidos no Firestore que usam ele)
        quantidade: `${total.toLocaleString('pt-BR')} ${unidade} (${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)`,
        talhoes: talhoesArr
      };
    });
    const editando=!!pedidoEditandoId;
    if(pedidoEditandoId){
      await updateDoc(doc(db,'pedidos',pedidoEditandoId),{itens:itensFS,editadoEm:new Date().toISOString(),editadoPor:usuarioAtual.email});
    }else{
      await addDoc(collection(db,'pedidos'),{itens:itensFS,status:'solicitado',criadoEm:new Date().toISOString(),criadoPor:usuarioAtual.email});
    }
    limparRascunhoPed();
    pedidoWIP=null;pedItemAtivo=null;pedidoEditandoId=null;document.getElementById('painelPedido').style.display='none';document.getElementById('fabNovoPedido').style.display=isAdmin()?'flex':'none';renderizarPedPoligonos();
    toast(editando?'✅ Pedido atualizado!':'✅ Pedido salvo!');
    abrirTab('lista',document.getElementById('ptab-lista'));
  }catch(e){
    salvarRascunhoPed();
    toast('❌ Não foi possível salvar agora. Seu trabalho foi guardado — feche as outras abas do app, recarregue a página e clique em "Recuperar".',7000);
  }
  btn.disabled=false;btn.textContent=pedidoEditandoId?'💾 Salvar Alterações':'💾 Salvar Pedido';
};
function renderizarListaPedidos(){
  const lista=document.getElementById('listaPedidosApp');if(!lista)return;
  document.getElementById('totalPedidos').textContent=pedidos.length+' pedido(s)';
  if(!pedidos.length){lista.innerHTML=`<div class="vazio"><div class="ico">📋</div><p>Nenhum pedido criado ainda.<br>Vá para <strong>Mapa</strong> e clique em <strong>+ Novo Pedido</strong>.</p></div>`;return;}
  const STATUS_OPS = [
    {id:'solicitado', lab:'⏳ Solicitado', cor:'#f59e0b'},
    {id:'em_andamento', lab:'🚚 Em andamento', cor:'#3b82f6'},
    {id:'recebido', lab:'✅ Recebido', cor:'#22c55e'},
    {id:'recebido_parcial', lab:'🔶 Parcial', cor:'#a855f7'},
    {id:'cancelado', lab:'❌ Cancelado', cor:'var(--c)'},
  ];
  lista.innerHTML=pedidos.map(p=>{
    const dataF=p.criadoEm?formatarData(p.criadoEm.slice(0,10)):'—';
    const fazendas=[...new Set((p.itens||[]).flatMap(it=>(it.talhoes||[]).map(t=>t.fazenda||'Sem fazenda')))].join(' · ');
    const stAtual = p.status || 'solicitado';
    const stInfo = STATUS_OPS.find(s => s.id===stAtual) || STATUS_OPS[0];
    const podeAlterar = isAdmin() || (perfilAtual.modulos?.pedidos === 'encarregado');
    const selStatus = podeAlterar
      ? `<select class="ped-status-sel" onchange="alterarStatusPedido('${p._docId}',this.value)" style="border-color:${stInfo.cor};color:${stInfo.cor};">
          ${STATUS_OPS.map(s=>`<option value="${s.id}" ${stAtual===s.id?'selected':''}>${s.lab}</option>`).join('')}
        </select>`
      : `<span class="ped-status-badge" style="background:${stInfo.cor};">${stInfo.lab}</span>`;
    return `<div class="ped-card">
      <div class="ped-card-hdr">
        <div><div class="ped-card-tit">📦 Pedido de Insumos</div><div class="ped-card-meta">📅 ${dataF} · 🏡 ${fazendas}</div><div class="ped-card-meta">👤 ${p.criadoPor||'—'}</div></div>
        <div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-start;">
          <button onclick="gerarRelatorioPedido('${p._docId}')" class="btn-pdf">📄 PDF</button>
          ${isAdmin()?`<button onclick="editarPedido('${p._docId}')" class="btn-editar-ped">✏️ Editar</button>`:''}
          ${isAdmin()?`<button class="btn-del-ped" data-doc="${p._docId}" onclick="excluirPedido(this)">🗑</button>`:''}
        </div>
      </div>
      <div style="padding:6px 14px 0;">${selStatus}</div>
      <div class="ped-card-itens">
        ${(p.itens||[]).map(it=>{
          // Retrocompat: pedidos novos têm dosePorHa+total; antigos só têm quantidade (string)
          const temNovo = it.dosePorHa != null && it.total != null;
          const recebidoTxt = it.totalRecebido != null && it.totalRecebido > 0
            ? `<span class="ped-recebido-aux">✓ ${(it.totalRecebido||0).toLocaleString('pt-BR')} ${it.unidade||''} recebido</span>`
            : '';
          const txtBadge = temNovo
            ? `<span class="ped-qtd-badge">${(it.total||0).toLocaleString('pt-BR')} ${it.unidade||''}</span><span class="ped-qtd-aux">${it.dosePorHa} ${it.unidade||''}/ha</span>${recebidoTxt}`
            : (it.quantidade ? `<span class="ped-qtd-badge">${it.quantidade}</span>` : '');
          const modoBadge = it.modo ? `<span class="ped-modo-badge">${MODO_APLIC[it.modo]||it.modo}</span>` : '';
          return `<div class="ped-item-lista"><span class="ped-item-prod">🧪 ${it.produto}${modoBadge}</span><span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${txtBadge}<span class="ped-tal-ids">${(it.talhoes||[]).map(t=>t.id).join(', ')}</span></span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

window.alterarStatusPedido = async function(docId, novoStatus) {
  try {
    await updateDoc(doc(db,'pedidos',docId), {status: novoStatus, statusAtualizadoEm: new Date().toISOString(), statusAtualizadoPor: usuarioAtual.email});
    toast('✅ Status atualizado.');
  } catch(e) { toast('❌ Erro: '+e.message); }
};
window.excluirPedido=async function(btn){const docId=btn.dataset.doc;if(!confirm('Excluir?'))return;btn.disabled=true;await deleteDoc(doc(db,'pedidos',docId));toast('🗑 Excluído.');};
window.gerarRelatorioPedido=function(docId){
  const p=pedidos.find(x=>x._docId===docId);if(!p)return;
  const dataF=p.criadoEm?formatarData(p.criadoEm.slice(0,10)):'—';
  const porFazenda={};
  (p.itens||[]).forEach(it=>{(it.talhoes||[]).forEach(t=>{const f=t.fazenda||'Sem fazenda';if(!porFazenda[f])porFazenda[f]={};if(!porFazenda[f][t.id])porFazenda[f][t.id]={nome:t.nome,area:t.area,itens:[]};porFazenda[f][t.id].itens.push(it);});});
  document.getElementById('area-impressao').innerHTML=`<div style="font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:28px;color:#111;"><div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--v);padding-bottom:14px;margin-bottom:22px;"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--t4);margin-bottom:4px;">Conilon Tech · Gestão Agrícola</div><div style="font-size:24px;font-weight:900;color:var(--ve);">PEDIDO DE INSUMOS</div><div style="font-size:12px;color:var(--c);margin-top:3px;">Data: ${dataF} · ${p.criadoPor||'—'}</div></div><div style="font-size:11px;color:var(--t4);">${(p.itens||[]).length} insumo(s)</div></div><div style="margin-bottom:24px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--v);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--bd-l);">📦 RESUMO DO PEDIDO</div><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:var(--ve);color:white;"><th style="padding:9px 12px;text-align:left;">#</th><th style="padding:9px 12px;text-align:left;">Produto</th><th style="padding:9px 12px;text-align:left;">Modo</th><th style="padding:9px 12px;text-align:center;">Dose/ha</th><th style="padding:9px 12px;text-align:center;">Área total</th><th style="padding:9px 12px;text-align:center;">TOTAL A PEDIR</th></tr></thead><tbody>${(p.itens||[]).map((it,i)=>{
    const temNovo = it.dosePorHa!=null && it.total!=null;
    const dosePh = temNovo ? `${it.dosePorHa} ${it.unidade}/ha` : '—';
    const areaT = temNovo ? `${(it.areaTotal||0).toLocaleString('pt-BR')} ha` : '—';
    const totalT = temNovo ? `${(it.total||0).toLocaleString('pt-BR')} ${it.unidade}` : (it.quantidade||'—');
    const modoT = it.modo ? (MODO_APLIC[it.modo]||it.modo) : '—';
    return `<tr style="background:${i%2===0?'white':'var(--surface-2)'}"><td style="padding:8px 12px;border-bottom:1px solid var(--bd-l);color:var(--t4);">${i+1}</td><td style="padding:8px 12px;border-bottom:1px solid var(--bd-l);font-weight:600;">${it.produto}</td><td style="padding:8px 12px;border-bottom:1px solid var(--bd-l);font-size:11px;">${modoT}</td><td style="padding:8px 12px;border-bottom:1px solid var(--bd-l);text-align:center;font-family:monospace;">${dosePh}</td><td style="padding:8px 12px;border-bottom:1px solid var(--bd-l);text-align:center;font-family:monospace;">${areaT}</td><td style="padding:8px 12px;border-bottom:1px solid var(--bd-l);text-align:center;font-family:monospace;color:var(--v);font-weight:700;font-size:13px;">${totalT}</td></tr>`;
  }).join('')}</tbody></table></div><div style="margin-bottom:24px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--v);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--bd-l);">🗺️ DISTRIBUIÇÃO POR FAZENDA</div>${Object.entries(porFazenda).map(([faz,tals])=>{const subt={};Object.values(tals).forEach(td=>{const area=parseDose(td.area);td.itens.forEach(it=>{if(it.dosePorHa!=null){const k=it.produto+'||'+(it.unidade||'');subt[k]=(subt[k]||0)+it.dosePorHa*area;}});});const subtHtml=Object.entries(subt).map(([k,tot])=>{const p=k.split('||');return `${p[0]}: <strong>${(Math.round(tot*100)/100).toLocaleString('pt-BR')} ${p[1]}</strong>`;}).join(' · ');return `<div style="margin-bottom:16px;"><div style="background:var(--vb);border-left:4px solid var(--v);padding:8px 14px;font-weight:700;font-size:13px;color:var(--ve);">🏡 ${faz}</div><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:var(--cl);"><th style="padding:7px 14px;text-align:left;">Talhão</th><th style="padding:7px 14px;text-align:left;">Insumos (dose · total do talhão)</th></tr></thead><tbody>${Object.entries(tals).map(([tid,td],ti)=>{const area=parseDose(td.area);return `<tr style="background:${ti%2===0?'white':'var(--surface-2)'}"><td style="padding:8px 14px;border-bottom:1px solid var(--bd-l);font-weight:600;">${tid} · ${td.nome}${td.area?' · '+td.area+'ha':''}</td><td style="padding:8px 14px;border-bottom:1px solid var(--bd-l);">${td.itens.map(it=>{const temNovo=it.dosePorHa!=null;const dose=temNovo?`${it.dosePorHa} ${it.unidade}/ha`:(it.quantidade||'');const tot=(temNovo&&area>0)?` · <strong>${(Math.round(it.dosePorHa*area*100)/100).toLocaleString('pt-BR')} ${it.unidade}</strong>`:'';return `<span style="display:inline-block;background:var(--vb);border-radius:12px;padding:2px 9px;margin:2px;font-size:11px;color:var(--ve);font-weight:600;">${it.produto}${dose?' · '+dose:''}${tot}</span>`;}).join('')}</td></tr>`;}).join('')}</tbody></table>${subtHtml?`<div style="padding:7px 14px;font-size:11px;color:var(--ve);background:var(--cl);border-radius:0 0 6px 6px;">📦 <strong>Total ${faz}:</strong> ${subtHtml}</div>`:''}</div>`;}).join('')}</div><div style="font-size:10px;color:var(--t4);text-align:right;border-top:1px solid var(--bd-l);padding-top:10px;">Gerado em ${new Date().toLocaleString('pt-BR')} · ConilonTech</div></div>`;
  setTimeout(()=>window.print(),200);

window.abrirTab=function(tab,btn){tabAtual=tab;document.querySelectorAll('.ped-tab').forEach(b=>b.classList.remove('ativo'));if(btn)btn.classList.add('ativo');document.getElementById('pmod-mapa').style.display=tab==='mapa'?'flex':'none';document.getElementById('pmod-lista').style.display=tab==='lista'?'flex':'none';if(tab==='mapa')iniciarMapaPedidos();if(tab==='lista')renderizarListaPedidos();};

.ped-item-prod{font-weight:600;flex:1;}

#area-impressao{display:none;}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
