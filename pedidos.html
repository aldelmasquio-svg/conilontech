<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ConilonTech · Pedidos de Insumos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, enableIndexedDbPersistence, doc, getDoc, addDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDvdDBTN6UUN4-Ep4qqXruFDSNee7IAzfg",authDomain:"talhoes-df836.firebaseapp.com",projectId:"talhoes-df836",storageBucket:"talhoes-df836.firebasestorage.app",messagingSenderId:"1047022702039",appId:"1:1047022702039:web:001cf6a3c028c494ab8f92"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
enableIndexedDbPersistence(db).catch(()=>{});
let usuarioAtual=null,perfilAtual={},talhoes=[],pedidos=[],pedidoWIP=null,pedItemAtivo=null,pedMapIniciado=false,pedMap,pedPolMap={},pedSidebarAberta=true,tabAtual='mapa';
const PED_CORES={ativo:{border:'rgba(123,198,126,.9)',fill:'rgba(74,140,63,.4)'},reforma:{border:'rgba(220,190,90,.9)',fill:'rgba(201,168,76,.4)'},colhido:{border:'rgba(196,133,90,.9)',fill:'rgba(139,94,60,.4)'}};
onAuthStateChanged(auth,async(user)=>{
  if(!user){window.location.href='login.html';return;}
  usuarioAtual=user;
  const snap=await getDoc(doc(db,'usuarios',user.uid));
  if(!snap.exists()){await signOut(auth);return;}
  perfilAtual=snap.data();
  if(!perfilAtual.modulos&&perfilAtual.perfil==='admin')perfilAtual.modulos={mapa:'admin',atividades:'admin',adubacao:'admin',config:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin'};
  document.getElementById('userNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserNome').textContent=perfilAtual.nome||user.email;
  document.getElementById('menuUserEmail').textContent=user.email;
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appContent').style.display='flex';
  gerarMenu();
  if(!isAdmin())document.getElementById('fabNovoPedido').style.display='none';
  onSnapshot(collection(db,'talhoes'),snap=>{talhoes=snap.docs.map(d=>({_docId:d.id,...d.data()}));if(pedMapIniciado)renderizarPedPoligonos();});
  onSnapshot(collection(db,'pedidos'),snap=>{pedidos=snap.docs.map(d=>({_docId:d.id,...d.data()})).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));if(tabAtual==='lista')renderizarListaPedidos();});
  setTimeout(iniciarMapaPedidos,200);
});
function isAdmin(){return Object.values(perfilAtual.modulos||{}).includes('admin')||perfilAtual.perfil==='admin';}
// Converte string com vírgula brasileira em número (ex: "13,5" → 13.5)
function parseDose(s){if(s==null||s==='')return 0;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?0:n;}
function gerarMenu(){
  const isAdm=isAdmin();
  const items=[{href:'index.html',ico:'📊',label:'Dashboard'},{href:'mapa.html',ico:'🗺️',label:'Mapa de Talhões'},{href:'atividades.html',ico:'🌾',label:'Atividades de Campo'},{href:'adubacoes.html',ico:'🧪',label:'Adubações'},{href:'pulverizacoes.html',ico:'💧',label:'Pulverizações'},{href:'pedidos.html',ico:'📦',label:'Pedidos de Insumos'},{href:'estoque.html',ico:'🏬',label:'Estoque'}];
  if(isAdm)items.push({href:'admin.html',ico:'⚙️',label:'Administração'});
  document.getElementById('menuModulos').innerHTML=items.map(m=>`<a class="menu-item ${m.href==='pedidos.html'?'ativo':''}" href="${m.href}"><span class="menu-ico">${m.ico}</span><span>${m.label}</span></a>`).join('');
}
function iniciarMapaPedidos(){
  if(pedMapIniciado){pedMap?.invalidateSize();return;}
  pedMapIniciado=true;
  pedMap=L.map('pedidosMap',{center:[-18.7166,-40.4000],zoom:14});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}).addTo(pedMap);
  setTimeout(()=>pedMap.invalidateSize(),300);
  renderizarPedPoligonos();
}
function pedCorPoly(id){
  const t=talhoes.find(x=>x.id===id),cor=PED_CORES[t?.status||'ativo']||PED_CORES.ativo;
  const item=pedidoWIP&&pedItemAtivo!==null?pedidoWIP.itens[pedItemAtivo]:null;
  const sel=item&&item.talhoes.has(id),emOutro=pedidoWIP&&pedidoWIP.itens.some((it,i)=>i!==pedItemAtivo&&it.talhoes.has(id));
  if(sel)return{color:'#f5c842',weight:4,fillColor:'rgba(245,200,66,.55)',fillOpacity:1};
  if(emOutro)return{color:'#60a5fa',weight:2.5,fillColor:'rgba(96,165,250,.3)',fillOpacity:1};
  return{color:cor.border,weight:2,fillColor:cor.fill,fillOpacity:1};
}
function renderizarPedPoligonos(){
  if(!pedMap)return;
  Object.values(pedPolMap).forEach(p=>pedMap.removeLayer(p));pedPolMap={};
  talhoes.forEach(t=>{
    if(!t.coordenadas||t.coordenadas.length<3)return;
    const latlngs=t.coordenadas.map(c=>Array.isArray(c)?c:[c.lat,c.lng]);
    const poly=L.polygon(latlngs,pedCorPoly(t.id)).addTo(pedMap);
    poly.bindTooltip(`<b>${t.id}</b> · ${t.nome}`,{sticky:true,direction:'top'});
    poly.on('click',e=>{L.DomEvent.stopPropagation(e);clicarTalhao(t.id);});
    poly.on('mouseover',()=>{const c=pedCorPoly(t.id);poly.setStyle({...c,weight:c.weight+1,fillOpacity:.6});});
    poly.on('mouseout',()=>poly.setStyle(pedCorPoly(t.id)));
    pedPolMap[t.id]=poly;
  });
  renderizarPedSidebar();
}
function renderizarPedSidebar(){
  const lista=document.getElementById('pedSidebarList');if(!lista)return;
  const fazendas={};
  talhoes.forEach(t=>{const f=t.fazenda||'Sem fazenda';if(!fazendas[f])fazendas[f]=[];fazendas[f].push(t);});
  lista.innerHTML=Object.entries(fazendas).sort().map(([faz,ts])=>`
    <div class="sb-faz">${faz}</div>
    ${ts.map(t=>{const item=pedidoWIP&&pedItemAtivo!==null?pedidoWIP.itens[pedItemAtivo]:null,sel=item&&item.talhoes.has(t.id),temMapa=t.coordenadas?.length>=3;
    return `<div class="msb-item ${sel?'active':''}" onclick="${temMapa?`clicarTalhao('${t.id}')`:''}" style="${!temMapa?'opacity:.4;cursor:default;':''}">
      <div class="msb-dot ${t.status||'ativo'}"></div>
      <div class="msb-info"><div class="msb-id">${t.id}</div><div class="msb-nome">${t.nome}</div></div>
      ${sel?'<span style="color:var(--v);font-weight:700;">✓</span>':''}
    </div>`;}).join('')}`).join('');
}
function clicarTalhao(id){
  if(!isAdmin())return;
  if(!pedidoWIP){iniciarNovoPedido();return;}
  if(pedItemAtivo===null)pedItemAtivo=0;
  const item=pedidoWIP.itens[pedItemAtivo];
  if(item.talhoes.has(id))item.talhoes.delete(id);else item.talhoes.add(id);
  renderizarPedPoligonos();renderizarItensPedido();
}
window.clicarTalhao=clicarTalhao;
window.togglePedSidebar=function(){pedSidebarAberta=!pedSidebarAberta;const sb=document.getElementById('pedSidebar'),btn=document.getElementById('btnExpandPedSb');if(sb)sb.style.display=pedSidebarAberta?'flex':'none';if(btn)btn.style.display=pedSidebarAberta?'none':'flex';if(pedMap)setTimeout(()=>pedMap.invalidateSize(),100);};
function iniciarNovoPedido(){if(!isAdmin()){toast('⛔ Sem permissão.');return;}pedidoWIP={itens:[]};adicionarItemPedido();pedItemAtivo=0;document.getElementById('painelPedido').style.display='flex';document.getElementById('fabNovoPedido').style.display='none';renderizarItensPedido();}
window.iniciarNovoPedido=iniciarNovoPedido;
function adicionarItemPedido(){if(!pedidoWIP)return;pedidoWIP.itens.push({produto:'',quantidade:'',unidade:'kg',talhoes:new Set()});pedItemAtivo=pedidoWIP.itens.length-1;renderizarItensPedido();}
window.adicionarItemPedido=adicionarItemPedido;
function renderizarItensPedido(){
  if(!pedidoWIP)return;
  const el=document.getElementById('itensPedido');if(!el)return;
  el.innerHTML=pedidoWIP.itens.map((item,i)=>{
    const ativo=i===pedItemAtivo,nTal=item.talhoes.size;
    // Calcular área total dos talhões selecionados e dose total
    const areaTotal = [...item.talhoes].reduce((s,id)=>{
      const t=talhoes.find(x=>x.id===id);
      return s + (parseDose(t?.area)||0);
    },0);
    const dosePorHa = parseDose(item.quantidade)||0;
    const doseTotal = dosePorHa * areaTotal;
    const unidade = item.unidade || 'kg';
    const chips=[...item.talhoes].map(id=>{
      const t=talhoes.find(x=>x.id===id);
      const a=t?.area?` (${t.area}ha)`:'';
      return `<span class="chip-tal">${t?t.id:id}${a}<button onclick="remTalhaoPed(${i},'${id}')">✕</button></span>`;
    }).join('');
    // Resumo curto para item inativo (não colapsa totalmente, mostra o que tem)
    const resumoInativo = !ativo ? `<div class="ped-item-resumo">
      ${item.produto?`<strong>${item.produto}</strong>`:'<span style="color:#9ca3af;">Sem produto</span>'}
      ${dosePorHa>0?` · ${dosePorHa} ${unidade}/ha`:''}
      ${nTal>0?` · ${nTal} talhão(ões)`:''}
      ${doseTotal>0?` · <span class="ped-total-mini">${doseTotal.toLocaleString('pt-BR')} ${unidade}</span>`:''}
    </div>` : '';
    return `<div onclick="ativarItemPed(${i})" class="ped-item ${ativo?'ativo':''}">
      <div class="ped-item-hdr"><span class="ped-item-num">Insumo ${i+1}</span>
        <div style="display:flex;align-items:center;gap:5px;">
          ${ativo&&nTal>0?`<span class="badge-sel">${nTal} talhão(ões)</span>`:''}
          ${ativo&&nTal===0?`<span class="badge-sel">← Mapa</span>`:''}
          <button onclick="event.stopPropagation();remItemPed(${i})" class="btn-rm-item">✕</button>
        </div>
      </div>
      ${resumoInativo}
      ${ativo?`<div class="ped-item-fields" onclick="event.stopPropagation()">
        <input type="text" placeholder="Produto / Insumo (ex: Ureia)" value="${item.produto||''}" oninput="pedidoWIP.itens[${i}].produto=this.value" class="ped-inp">
        <div class="ped-dose-row">
          <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="Dose por hectare" value="${item.quantidade||''}" oninput="pedidoWIP.itens[${i}].quantidade=this.value;atualizarTotalPed(${i})" class="ped-inp ped-dose-inp-num">
          <select onchange="pedidoWIP.itens[${i}].unidade=this.value;atualizarTotalPed(${i})" class="ped-und-sel">
            ${['kg','g','L','mL','sc','t'].map(u=>`<option value="${u}" ${(item.unidade||'kg')===u?'selected':''}>${u}/ha</option>`).join('')}
          </select>
        </div>
        <div class="ped-total-box" id="pedTotalBox-${i}">
          ${nTal===0
            ? '<span style="color:#9ca3af;">👇 Selecione talhões no mapa pra calcular o total</span>'
            : dosePorHa===0
              ? `<span style="color:#9ca3af;">Total a pedir aparecerá quando informar a dose</span>`
              : `<span class="ped-total-label">Total a pedir:</span> <strong class="ped-total-val">${doseTotal.toLocaleString('pt-BR')} ${unidade}</strong> <span class="ped-total-aux">(${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)</span>`
          }
        </div>
        ${nTal>0?`<div class="chips-talhoes">${chips}</div>`:''}
        <div class="dica-mapa">👆 Clique nos talhões do mapa</div>
      </div>`:''}
    </div>`;
  }).join('');
  const total=new Set(pedidoWIP.itens.flatMap(it=>[...it.talhoes])).size;
  const el2=document.getElementById('pedResumo');if(el2)el2.textContent=`${pedidoWIP.itens.length} insumo(s) · ${total} talhão(ões)`;
  renderizarPedPoligonos();
}

// Atualiza só a caixa do total daquele insumo (não re-renderiza tudo, preserva foco no input)
window.atualizarTotalPed = function(i) {
  const item = pedidoWIP?.itens?.[i]; if (!item) return;
  const box = document.getElementById('pedTotalBox-'+i); if (!box) return;
  const areaTotal = [...item.talhoes].reduce((s,id)=>{
    const t=talhoes.find(x=>x.id===id); return s + (parseDose(t?.area)||0);
  },0);
  const dosePorHa = parseDose(item.quantidade)||0;
  const doseTotal = dosePorHa * areaTotal;
  const unidade = item.unidade || 'kg';
  const nTal = item.talhoes.size;
  if (nTal === 0) box.innerHTML = '<span style="color:#9ca3af;">👇 Selecione talhões no mapa pra calcular o total</span>';
  else if (dosePorHa === 0) box.innerHTML = '<span style="color:#9ca3af;">Total a pedir aparecerá quando informar a dose</span>';
  else box.innerHTML = `<span class="ped-total-label">Total a pedir:</span> <strong class="ped-total-val">${doseTotal.toLocaleString('pt-BR')} ${unidade}</strong> <span class="ped-total-aux">(${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)</span>`;
};
window.ativarItemPed=function(i){pedItemAtivo=i;renderizarItensPedido();};
window.remItemPed=function(i){pedidoWIP.itens.splice(i,1);if(!pedidoWIP.itens.length)adicionarItemPedido();else if(pedItemAtivo>=pedidoWIP.itens.length)pedItemAtivo=pedidoWIP.itens.length-1;renderizarItensPedido();};
window.remTalhaoPed=function(i,id){pedidoWIP.itens[i].talhoes.delete(id);renderizarItensPedido();};
window.pedSelTodos=function(){if(pedItemAtivo===null||!pedidoWIP)return;talhoes.forEach(t=>{if(t.coordenadas?.length>=3)pedidoWIP.itens[pedItemAtivo].talhoes.add(t.id);});renderizarItensPedido();};
window.pedLimparSel=function(){if(pedItemAtivo===null||!pedidoWIP)return;pedidoWIP.itens[pedItemAtivo].talhoes.clear();renderizarItensPedido();};
window.cancelarPedido=function(){if(pedidoWIP&&!confirm('Cancelar o pedido?'))return;pedidoWIP=null;pedItemAtivo=null;document.getElementById('painelPedido').style.display='none';document.getElementById('fabNovoPedido').style.display=isAdmin()?'flex':'none';renderizarPedPoligonos();};
window.salvarPedidoWIP=async function(){
  if(!pedidoWIP)return;
  const itensValidos=pedidoWIP.itens.filter(it=>it.produto.trim());
  if(!itensValidos.length){toast('⚠️ Preencha ao menos um produto.');return;}
  const semTal=itensValidos.find(it=>it.talhoes.size===0);
  if(semTal){toast(`⚠️ "${semTal.produto}" sem talhões.`);return;}
  const semDose=itensValidos.find(it=>!parseDose(it.quantidade));
  if(semDose){toast(`⚠️ "${semDose.produto}" sem dose/ha.`);return;}
  const btn=document.getElementById('btnSalvarPed');btn.disabled=true;btn.textContent='Salvando...';
  try{
    const itensFS=itensValidos.map(it=>{
      const talhoesArr=[...it.talhoes].map(id=>{
        const t=talhoes.find(x=>x.id===id);
        return {id, nome:t?.nome||id, fazenda:t?.fazenda||'', area:parseDose(t?.area)||0};
      });
      const areaTotal = talhoesArr.reduce((s,t)=>s+t.area, 0);
      const dosePorHa = parseDose(it.quantidade)||0;
      const unidade = it.unidade || 'kg';
      const total = dosePorHa * areaTotal;
      return {
        produto: it.produto.trim(),
        dosePorHa,
        unidade,
        areaTotal: Math.round(areaTotal*100)/100,
        total: Math.round(total*100)/100,
        // Mantém o campo "quantidade" legível para retrocompat (já existem pedidos no Firestore que usam ele)
        quantidade: `${total.toLocaleString('pt-BR')} ${unidade} (${dosePorHa} ${unidade}/ha × ${areaTotal.toLocaleString('pt-BR')} ha)`,
        talhoes: talhoesArr
      };
    });
    await addDoc(collection(db,'pedidos'),{itens:itensFS,status:'solicitado',criadoEm:new Date().toISOString(),criadoPor:usuarioAtual.email});
    window.cancelarPedido();toast('✅ Pedido salvo!');
    abrirTab('lista',document.getElementById('ptab-lista'));
  }catch(e){toast('❌ Erro: '+e.message);}
  btn.disabled=false;btn.textContent='💾 Salvar Pedido';
};
function renderizarListaPedidos(){
  const lista=document.getElementById('listaPedidosApp');if(!lista)return;
  document.getElementById('totalPedidos').textContent=pedidos.length+' pedido(s)';
  if(!pedidos.length){lista.innerHTML=`<div class="vazio"><div class="ico">📋</div><p>Nenhum pedido criado ainda.<br>Vá para <strong>Mapa</strong> e clique em <strong>+ Novo Pedido</strong>.</p></div>`;return;}
  const STATUS_OPS = [
    {id:'solicitado', lab:'⏳ Solicitado', cor:'#f59e0b'},
    {id:'em_andamento', lab:'🚚 Em andamento', cor:'#3b82f6'},
    {id:'recebido', lab:'✅ Recebido', cor:'#22c55e'},
    {id:'recebido_parcial', lab:'🔶 Parcial', cor:'#a855f7'},
    {id:'cancelado', lab:'❌ Cancelado', cor:'#6b7280'},
  ];
  lista.innerHTML=pedidos.map(p=>{
    const dataF=p.criadoEm?formatarData(p.criadoEm.slice(0,10)):'—';
    const fazendas=[...new Set((p.itens||[]).flatMap(it=>(it.talhoes||[]).map(t=>t.fazenda||'Sem fazenda')))].join(' · ');
    const stAtual = p.status || 'solicitado';
    const stInfo = STATUS_OPS.find(s => s.id===stAtual) || STATUS_OPS[0];
    const podeAlterar = isAdmin() || (perfilAtual.modulos?.pedidos === 'encarregado');
    const selStatus = podeAlterar
      ? `<select class="ped-status-sel" onchange="alterarStatusPedido('${p._docId}',this.value)" style="border-color:${stInfo.cor};color:${stInfo.cor};">
          ${STATUS_OPS.map(s=>`<option value="${s.id}" ${stAtual===s.id?'selected':''}>${s.lab}</option>`).join('')}
        </select>`
      : `<span class="ped-status-badge" style="background:${stInfo.cor};">${stInfo.lab}</span>`;
    return `<div class="ped-card">
      <div class="ped-card-hdr">
        <div><div class="ped-card-tit">📦 Pedido de Insumos</div><div class="ped-card-meta">📅 ${dataF} · 🏡 ${fazendas}</div><div class="ped-card-meta">👤 ${p.criadoPor||'—'}</div></div>
        <div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-start;">
          <button onclick="gerarRelatorioPedido('${p._docId}')" class="btn-pdf">📄 PDF</button>
          ${isAdmin()?`<button class="btn-del-ped" data-doc="${p._docId}" onclick="excluirPedido(this)">🗑</button>`:''}
        </div>
      </div>
      <div style="padding:6px 14px 0;">${selStatus}</div>
      <div class="ped-card-itens">
        ${(p.itens||[]).map(it=>{
          // Retrocompat: pedidos novos têm dosePorHa+total; antigos só têm quantidade (string)
          const temNovo = it.dosePorHa != null && it.total != null;
          const recebidoTxt = it.totalRecebido != null && it.totalRecebido > 0
            ? `<span class="ped-recebido-aux">✓ ${(it.totalRecebido||0).toLocaleString('pt-BR')} ${it.unidade||''} recebido</span>`
            : '';
          const txtBadge = temNovo
            ? `<span class="ped-qtd-badge">${(it.total||0).toLocaleString('pt-BR')} ${it.unidade||''}</span><span class="ped-qtd-aux">${it.dosePorHa} ${it.unidade||''}/ha</span>${recebidoTxt}`
            : (it.quantidade ? `<span class="ped-qtd-badge">${it.quantidade}</span>` : '');
          return `<div class="ped-item-lista"><span class="ped-item-prod">🧪 ${it.produto}</span><span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${txtBadge}<span class="ped-tal-ids">${(it.talhoes||[]).map(t=>t.id).join(', ')}</span></span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

window.alterarStatusPedido = async function(docId, novoStatus) {
  try {
    await updateDoc(doc(db,'pedidos',docId), {status: novoStatus, statusAtualizadoEm: new Date().toISOString(), statusAtualizadoPor: usuarioAtual.email});
    toast('✅ Status atualizado.');
  } catch(e) { toast('❌ Erro: '+e.message); }
};
window.excluirPedido=async function(btn){const docId=btn.dataset.doc;if(!confirm('Excluir?'))return;btn.disabled=true;await deleteDoc(doc(db,'pedidos',docId));toast('🗑 Excluído.');};
window.gerarRelatorioPedido=function(docId){
  const p=pedidos.find(x=>x._docId===docId);if(!p)return;
  const dataF=p.criadoEm?formatarData(p.criadoEm.slice(0,10)):'—';
  const porFazenda={};
  (p.itens||[]).forEach(it=>{(it.talhoes||[]).forEach(t=>{const f=t.fazenda||'Sem fazenda';if(!porFazenda[f])porFazenda[f]={};if(!porFazenda[f][t.id])porFazenda[f][t.id]={nome:t.nome,itens:[]};porFazenda[f][t.id].itens.push(it);});});
  document.getElementById('area-impressao').innerHTML=`<div style="font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:28px;color:#111;"><div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #2d6a2d;padding-bottom:14px;margin-bottom:22px;"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9ca3af;margin-bottom:4px;">Conilon Tech · Gestão Agrícola</div><div style="font-size:24px;font-weight:900;color:#1a3d1a;">PEDIDO DE INSUMOS</div><div style="font-size:12px;color:#6b7280;margin-top:3px;">Data: ${dataF} · ${p.criadoPor||'—'}</div></div><div style="font-size:11px;color:#9ca3af;">${(p.itens||[]).length} insumo(s)</div></div><div style="margin-bottom:24px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#2d6a2d;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #e5e7eb;">📦 RESUMO DO PEDIDO</div><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:#1a3d1a;color:white;"><th style="padding:9px 12px;text-align:left;">#</th><th style="padding:9px 12px;text-align:left;">Produto</th><th style="padding:9px 12px;text-align:center;">Dose/ha</th><th style="padding:9px 12px;text-align:center;">Área total</th><th style="padding:9px 12px;text-align:center;">TOTAL A PEDIR</th></tr></thead><tbody>${(p.itens||[]).map((it,i)=>{
    const temNovo = it.dosePorHa!=null && it.total!=null;
    const dosePh = temNovo ? `${it.dosePorHa} ${it.unidade}/ha` : '—';
    const areaT = temNovo ? `${(it.areaTotal||0).toLocaleString('pt-BR')} ha` : '—';
    const totalT = temNovo ? `${(it.total||0).toLocaleString('pt-BR')} ${it.unidade}` : (it.quantidade||'—');
    return `<tr style="background:${i%2===0?'white':'#f9fafb'}"><td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;color:#9ca3af;">${i+1}</td><td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;font-weight:600;">${it.produto}</td><td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;text-align:center;font-family:monospace;">${dosePh}</td><td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;text-align:center;font-family:monospace;">${areaT}</td><td style="padding:8px 12px;border-bottom:1px solid #e5e7eb;text-align:center;font-family:monospace;color:#2d6a2d;font-weight:700;font-size:13px;">${totalT}</td></tr>`;
  }).join('')}</tbody></table></div><div style="margin-bottom:24px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#2d6a2d;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid #e5e7eb;">🗺️ DISTRIBUIÇÃO POR FAZENDA</div>${Object.entries(porFazenda).map(([faz,tals])=>`<div style="margin-bottom:16px;"><div style="background:#e8f5e8;border-left:4px solid #2d6a2d;padding:8px 14px;font-weight:700;font-size:13px;color:#1a3d1a;">🏡 ${faz}</div><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="background:#f3f4f6;"><th style="padding:7px 14px;text-align:left;">Talhão</th><th style="padding:7px 14px;text-align:left;">Insumos</th></tr></thead><tbody>${Object.entries(tals).map(([tid,td],ti)=>`<tr style="background:${ti%2===0?'white':'#f9fafb'}"><td style="padding:8px 14px;border-bottom:1px solid #e5e7eb;font-weight:600;">${tid} · ${td.nome}${td.area?' · '+td.area+'ha':''}</td><td style="padding:8px 14px;border-bottom:1px solid #e5e7eb;">${td.itens.map(it=>{const temNovo=it.dosePorHa!=null;const txt=temNovo?`${it.dosePorHa} ${it.unidade}/ha`:(it.quantidade||'');return `<span style="display:inline-block;background:#e8f5e8;border-radius:12px;padding:2px 9px;margin:2px;font-size:11px;color:#1a3d1a;font-weight:600;">${it.produto}${txt?' · '+txt:''}</span>`;}).join('')}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div><div style="font-size:10px;color:#9ca3af;text-align:right;border-top:1px solid #e5e7eb;padding-top:10px;">Gerado em ${new Date().toLocaleString('pt-BR')} · ConilonTech</div></div>`;
  setTimeout(()=>window.print(),200);
};
window.abrirTab=function(tab,btn){tabAtual=tab;document.querySelectorAll('.ped-tab').forEach(b=>b.classList.remove('ativo'));if(btn)btn.classList.add('ativo');document.getElementById('pmod-mapa').style.display=tab==='mapa'?'flex':'none';document.getElementById('pmod-lista').style.display=tab==='lista'?'flex':'none';if(tab==='mapa')iniciarMapaPedidos();if(tab==='lista')renderizarListaPedidos();};
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return`${dd}/${m}/${a}`;}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
window.toggleMenu=()=>{document.getElementById('menuLateral').classList.toggle('aberto');document.getElementById('menuOverlay').classList.toggle('aberto');};

window.fazerLogout=async()=>{await signOut(auth);window.location.href='login.html';};

<div id="appContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;">
  <div class="app-main">
    <div class="ped-tabs">

      </div>

      <div class="ped-legenda">
        <div class="leg-tit">Legenda</div>
        <div class="leg-item"><div class="leg-cor" style="background:rgba(74,140,63,.4);border:2px solid rgba(123,198,126,.9);"></div>Ativo</div>

      </div>
      <div class="painel-pedido" id="painelPedido" style="display:none;">
        <div class="painel-hdr"><div class="painel-tit">📦 Novo Pedido</div><div class="painel-res" id="pedResumo">0 insumos</div></div>
        <div class="painel-scroll"><div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--v);font-weight:700;margin-bottom:8px;">Insumos do Pedido</div><div id="itensPedido"></div><button class="btn-add-item" onclick="adicionarItemPedido()">＋ Adicionar outro insumo</button></div>
        <div class="painel-footer">
          <div class="painel-sel-row"><button class="painel-sel-btn" onclick="pedSelTodos()">Selec. todos</button><button class="painel-sel-btn" onclick="pedLimparSel()">Limpar seleção</button></div>
          <button class="btn-salvar-ped" id="btnSalvarPed" onclick="salvarPedidoWIP()">💾 Salvar Pedido</button>
          <button class="btn-cancelar-ped" onclick="cancelarPedido()">Cancelar</button>
        </div>
      </div>
      <button id="fabNovoPedido" onclick="iniciarNovoPedido()">＋ Novo Pedido</button>
    </div>
    <div id="pmod-lista">
      <div class="lista-hdr"><span class="lista-hdr-tit">📋 Pedidos de Insumos</span><span style="font-size:.72rem;color:var(--c);" id="totalPedidos"></span></div>
      <div class="lista-scroll" id="listaPedidosApp"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
</body>
</html>
