<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conilon Tech · Análises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--v:#2d6a2d;--ve:#1a3d1a;--vb:#e8f5e8;--c:#6b7280;--cb:#d1d5db;--cl:#f3f4f6;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--blue:#3b82f6;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:#f0f4f0;color:var(--t);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}

.loading-screen{position:fixed;inset:0;background:#f0f4f0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--v);font-size:1.1rem;letter-spacing:.04em;}

.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-titles{line-height:1;}
.header-title-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;}
.header-title-sub{font-size:.65rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.header-user{font-size:.78rem;color:rgba(255,255,255,.85);}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-header{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-user-nome{color:white;font-weight:700;font-size:.95rem;}
.menu-user-email{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:2px;}
.menu-body{flex:1;padding:10px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:1.1rem;}
.menu-footer{padding:14px;}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

.app-main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}

/* TABS de visualização (Lista | Comparar) */
.tabs-top{display:flex;background:white;border-bottom:2px solid var(--cb);flex-shrink:0;}
.tab-top{flex:1;padding:13px 8px;border:none;background:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-top.ativa{color:var(--v);border-bottom-color:var(--v);}

/* FILTROS */
.filtros-bar{background:white;border-bottom:1px solid var(--cb);padding:9px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;}
.filtro-grupo{display:flex;align-items:center;gap:6px;}
.filtro-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;text-transform:uppercase;color:var(--c);letter-spacing:.05em;}
.filtro-sel{border:1.5px solid var(--cb);border-radius:7px;padding:6px 9px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;background:white;font-weight:600;color:var(--ve);min-width:90px;}
.filtro-sel:focus{border-color:var(--v);}

/* CONTEÚDO */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:12px 14px 80px;display:flex;flex-direction:column;gap:10px;}

/* CARDS DE ANÁLISES (lista) */
.an-card{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;border-left:5px solid var(--cb);}
.an-card.solo{border-left-color:#5d3a1a;}
.an-card.folha{border-left-color:#1e5631;}
.an-card-header{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 14px;gap:10px;}
.an-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.0rem;color:var(--ve);display:flex;align-items:center;gap:6px;}
.an-meta{font-size:.74rem;color:var(--c);margin-top:3px;line-height:1.4;}
.an-badge{font-size:.65rem;padding:3px 9px;border-radius:99px;color:white;font-weight:700;letter-spacing:.02em;flex-shrink:0;}
.badge-solo{background:#5d3a1a;}
.badge-folha{background:#1e5631;}
.an-card-amostras{padding:0 14px 11px;font-size:.78rem;color:var(--c);}
.an-card-amostras strong{color:var(--ve);}
.an-card-acoes{display:flex;gap:6px;padding:0 14px 11px;flex-wrap:wrap;}
.btn-acao{background:none;border:1.5px solid var(--cb);border-radius:6px;padding:6px 11px;font-size:.74rem;color:var(--c);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;}
.btn-acao:active{transform:scale(.97);}
.btn-acao.primary{background:var(--v);border-color:var(--v);color:white;}
.btn-acao.danger{border-color:#fca5a5;color:var(--danger);}

/* BOTÃO FAB */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--v);color:white;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:50;}
.fab:active{transform:scale(.95);}

/* MODAL */
.overlay-an{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding-top:30px;}
.overlay-an.aberto{display:flex;}
.modal-an{background:white;border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:calc(100dvh - 30px);display:flex;flex-direction:column;box-shadow:var(--sf);overflow:hidden;}
.modal-an-head{padding:14px 16px;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--ve);color:white;}
.modal-an-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:.02em;}
.modal-an-fechar{background:rgba(255,255,255,.12);border:none;color:white;font-size:1.2rem;width:34px;height:34px;border-radius:7px;cursor:pointer;}
.modal-an-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;}
.modal-an-footer{padding:12px 16px;border-top:1px solid var(--cb);background:#fafafa;display:flex;gap:8px;flex-shrink:0;}
.modal-an-footer button{flex:1;}

/* FORMULÁRIO */
.fld{margin-bottom:11px;}
.fld label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.74rem;text-transform:uppercase;color:var(--c);letter-spacing:.04em;margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--cb);border-radius:7px;padding:9px 11px;font-size:.92rem;font-family:'Barlow',sans-serif;outline:none;background:white;color:var(--t);}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--v);}
.fld textarea{resize:vertical;min-height:60px;}
.fld-row{display:flex;gap:8px;}
.fld-row .fld{flex:1;}

.btn-prim{background:var(--v);border:none;color:white;border-radius:8px;padding:11px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;letter-spacing:.02em;}
.btn-sec{background:none;border:1.5px solid var(--cb);color:var(--c);border-radius:8px;padding:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

/* AMOSTRAS no formulário */
.amostra-card{background:#fafafa;border:1px solid var(--cb);border-radius:var(--rad);padding:11px;margin-bottom:11px;}
.amostra-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.amostra-card-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);}
.btn-rm-am{background:none;border:1px solid #fca5a5;color:var(--danger);border-radius:6px;padding:4px 9px;font-size:.74rem;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.amostra-grid-base{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}

/* GRUPOS DE PARÂMETROS */
.grp-collapsable{border:1px solid var(--cb);border-radius:8px;margin-bottom:7px;overflow:hidden;background:white;}
.grp-head{background:#f9fafb;padding:8px 11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;color:var(--ve);text-transform:uppercase;letter-spacing:.04em;}
.grp-head .grp-toggle{font-size:.7rem;color:var(--c);}
.grp-body{padding:9px 11px;display:none;}
.grp-collapsable.aberto .grp-body{display:block;}
.grp-collapsable.aberto .grp-toggle{transform:rotate(180deg);display:inline-block;}
.param-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:.84rem;}
.param-row .param-lab{flex:1;color:var(--t);font-size:.82rem;line-height:1.25;}
.param-row .param-un{font-size:.66rem;color:var(--c);font-family:'DM Mono',monospace;min-width:46px;text-align:right;}
.param-row .param-inp{width:84px;border:1.5px solid var(--cb);border-radius:6px;padding:6px 8px;font-size:.85rem;font-family:'DM Mono',monospace;text-align:right;outline:none;}
.param-row .param-inp:focus{border-color:var(--v);}

/* VINCULAR TALHÃO */
.vinc-talhao{padding:8px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;margin-bottom:9px;font-size:.78rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.vinc-talhao .vinc-lab{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#1e40af;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;}
.vinc-talhao select{flex:1;min-width:140px;border:1.5px solid #93c5fd;border-radius:6px;padding:5px 8px;font-size:.82rem;background:white;}
.vinc-sugest{background:#fef3c7;border-color:#fde68a;}
.vinc-sugest .vinc-lab{color:#92400e;}
.vinc-confirmado{background:#dcfce7;border-color:#86efac;}
.vinc-confirmado .vinc-lab{color:#166534;}

/* VISUALIZAÇÃO COMPLETA */
.detalhe-secao{background:white;border-radius:var(--rad);box-shadow:var(--s);margin-bottom:10px;}
.detalhe-secao-head{padding:10px 13px;border-bottom:1px solid var(--cl);}
.detalhe-secao-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);}
.detalhe-secao-sub{font-size:.72rem;color:var(--c);margin-top:2px;}
.detalhe-secao-body{padding:11px 13px;}
.amostra-bloco{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--cl);}
.amostra-bloco:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.amostra-bloco-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.92rem;color:var(--ve);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;}
.amostra-protocolo{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--c);font-weight:600;}

/* TABELA DE PARÂMETROS NA VISUALIZAÇÃO */
.tbl-param{width:100%;font-size:.82rem;border-collapse:collapse;}
.tbl-param tr{border-bottom:1px solid var(--cl);}
.tbl-param tr:last-child{border-bottom:none;}
.tbl-param td{padding:5px 4px;}
.tbl-param .par-lab{color:var(--t);}
.tbl-param .par-val{font-family:'DM Mono',monospace;font-weight:700;text-align:right;white-space:nowrap;}
.tbl-param .par-un{font-size:.68rem;color:var(--c);text-align:right;}
.tbl-param .par-class{text-align:center;padding:3px 6px;border-radius:99px;font-size:.65rem;font-weight:700;color:white;white-space:nowrap;}
.cls-mb{background:#991b1b;}
.cls-bx{background:#dc2626;}
.cls-md{background:#16a34a;}
.cls-at{background:#2563eb;}
.cls-ma{background:#7c3aed;}
.cls-ad{background:#16a34a;}
.cls-ne{background:#9ca3af;}
.cls-id{background:#16a34a;}
.cls-fora{background:#f59e0b;}

/* TEXTURA TOGGLE */
.textura-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;margin-bottom:10px;display:flex;align-items:center;gap:9px;font-size:.78rem;flex-wrap:wrap;}
.textura-box label{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#92400e;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;}
.textura-box select{border:1.5px solid #fde68a;border-radius:6px;padding:4px 8px;font-size:.82rem;background:white;}

/* VAZIO */
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;color:var(--c);}
.vazio .ico{font-size:3.5rem;margin-bottom:10px;opacity:.4;}
.vazio p{font-size:.92rem;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ve);color:white;padding:11px 18px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

/* COMPARAR (placeholder - Fase B) */
.placeholder-comparar{background:white;border-radius:var(--rad);padding:30px 20px;text-align:center;box-shadow:var(--s);}
.placeholder-comparar .ico{font-size:3rem;margin-bottom:14px;}
.placeholder-comparar p{color:var(--c);font-size:.9rem;line-height:1.5;margin-bottom:14px;}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregando análises...</div>
</div>

<header class="app-header" id="appHeader" style="display:none;">
  <div class="header-left">
    <button class="btn-menu" onclick="toggleMenu()">☰</button>
    <div class="header-titles">
      <div class="header-title-main">Conilon Tech</div>
      <div class="header-title-sub">Análises de Solo e Folha</div>
    </div>
  </div>
  <div class="header-user" id="userNome">—</div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="fecharMenu()"></div>
<aside class="menu-lateral" id="menuLateral">
  <div class="menu-header">
    <div class="menu-user-nome" id="menuUserNome">—</div>
    <div class="menu-user-email" id="menuUserEmail">—</div>
  </div>
  <div class="menu-body" id="menuModulos"></div>
  <div class="menu-footer"><button class="btn-logout" onclick="fazerLogout()">↩ Sair</button></div>
</aside>

<div class="app-main" id="appContent" style="display:none;">

  <!-- TABS -->
  <div class="tabs-top">
    <button class="tab-top ativa" id="tabLista" onclick="abrirTab('lista')">📋 Análises</button>
    <button class="tab-top" id="tabComparar" onclick="abrirTab('comparar')">📊 Comparar</button>
  </div>

  <!-- FILTROS (só na aba lista) -->
  <div class="filtros-bar" id="filtrosBar">
    <div class="filtro-grupo">
      <span class="filtro-label">🔬</span>
      <select class="filtro-sel" id="filTipo" onchange="renderLista()">
        <option value="">Todos</option>
        <option value="solo">🧪 Solo</option>
        <option value="folha">🍃 Folha</option>
      </select>
    </div>
    <div class="filtro-grupo">
      <span class="filtro-label">🏡</span>
      <select class="filtro-sel" id="filFazenda" onchange="renderLista()">
        <option value="">Todas</option>
      </select>
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<button class="fab" id="fabNovo" onclick="abrirNovaAnalise()" style="display:none;">+</button>

<!-- MODAL: cadastrar/editar análise -->
<div class="overlay-an" id="overlayAnalise">
  <div class="modal-an">
    <div class="modal-an-head">
      <div class="modal-an-titulo" id="modalTitulo">Nova Análise</div>
      <button class="modal-an-fechar" onclick="fecharModalAnalise()">✕</button>
    </div>
    <div class="modal-an-body" id="modalBody"></div>
    <div class="modal-an-footer">
      <button class="btn-sec" onclick="fecharModalAnalise()">Cancelar</button>
      <button class="btn-prim" id="btnSalvarAnalise" onclick="salvarAnalise()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: visualizar análise completa -->
<div class="overlay-an" id="overlayVer">
  <div class="modal-an">
    <div class="modal-an-head">
      <div class="modal-an-titulo" id="verTitulo">Análise</div>
      <button class="modal-an-fechar" onclick="fecharModalVer()">✕</button>
    </div>
    <div class="modal-an-body" id="verBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

onAuthStateChanged(auth, async (user) => {

  document.getElementById('menuUserEmail').textContent = user.email;

  if (podeEditar()) document.getElementById('fabNovo').style.display = 'block';

  onSnapshot(collection(db,'talhoes'), snap => {
    talhoes = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    const set = new Set(); talhoes.forEach(t=>{if(t.fazenda)set.add(t.fazenda);});
    fazendas = [...set].sort();

  onSnapshot(collection(db,'analises'), snap => {

  });
});

  if (perfilAtual.perfil === 'admin') return true;
  const m = perfilAtual.modulos || {};

  if (Object.values(m).includes('admin')) return true;
  return false;
}

// ━━━━━━━━━━ UTILS ━━━━━━━━━━
function escHtml(s){return String(s||'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n,d){const v=Number(n);if(!isFinite(v))return '—';return v.toLocaleString('pt-BR',{minimumFractionDigits:d!==undefined?d:0,maximumFractionDigits:d!==undefined?d:2});}
function parseDose(s){if(s==null||s==='')return null;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?null:n;}
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return `${dd}/${m}/${a}`;}
function hoje(){return new Date().toISOString().slice(0,10);}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function normalizar(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();}

// ━━━━━━━━━━ CLASSIFICAÇÃO (avalia parâmetro contra faixa) ━━━━━━━━━━
// Retorna { cls: 'mb'|'bx'|'md'|'at'|'ma'|'ne', label: 'Muito baixo'/'Bom'/...}
function classificar(parametro, valor, tipo, textura) {
  if (valor == null || !isFinite(valor)) return {cls:'ne', label:'—'};
  // pH especial (solo)
  if (parametro.faixaEspecial === 'ph') {
    if (valor < 5.0) return {cls:'mb', label:'Muito ácido'};
    if (valor < 5.5) return {cls:'bx', label:'Ácido'};
    if (valor < 6.0) return {cls:'md', label:'Acidez fraca'};
    if (valor <= 6.9) return {cls:'md', label:'Bom'};
    if (valor < 7.5) return {cls:'at', label:'Alcalino fraco'};
    return {cls:'ma', label:'Alcalino'};
  }
  // Faixa que varia por textura (P-Mehlich)
  let faixa = parametro.faixa;
  if (parametro.faixaTextura) {
    faixa = parametro.faixaTextura[textura || 'medio'];
  }
  // Faixa ideal (relações iônicas — "perto de X é bom")
  if (parametro.faixaIdeal) {
    const ideal = parametro.faixaIdeal.ideal;
    const desvio = Math.abs(valor - ideal) / ideal;
    if (desvio <= 0.15) return {cls:'id', label:'Ideal'};
    if (desvio <= 0.40) return {cls:'fora', label:valor>ideal?'Acima':'Abaixo'};
    return {cls:'bx', label:valor>ideal?'Muito alto':'Muito baixo'};
  }
  // Folha (só baixo/adequado/alto)
  if (tipo === 'folha' && faixa && faixa.baixo !== undefined && faixa.muitoBaixo === undefined) {
    if (valor < faixa.baixo) return {cls:'bx', label:'Baixo'};
    if (valor <= faixa.alto) return {cls:'ad', label:'Adequado'};
    return {cls:'at', label:'Alto'};
  }
  // Faixa padrão (solo): muito baixo/baixo/médio/alto/muito alto
  if (!faixa) return {cls:'ne', label:'—'};
  const inv = parametro.inverter;  // se true, "baixo" é bom (ex: Al, sat_al)
  if (valor < faixa.muitoBaixo) return inv ? {cls:'md', label:'Bom'} : {cls:'mb', label:'Muito baixo'};
  if (valor < faixa.baixo)      return inv ? {cls:'md', label:'Bom'} : {cls:'bx', label:'Baixo'};
  if (valor < faixa.alto)       return {cls:'md', label:'Médio/Bom'};
  if (valor < faixa.muitoAlto)  return inv ? {cls:'bx', label:'Alto'} : {cls:'at', label:'Alto'};
  return inv ? {cls:'mb', label:'Muito alto'} : {cls:'ma', label:'Muito alto'};
}

window.renderLista = function() {
  const cont = document.getElementById('content');
  if (tabAtual !== 'lista') return;
  if (!analises.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🔬</div><p>Nenhuma análise cadastrada ainda.<br><span style="font-size:.78rem;">Toque no botão + para criar a primeira análise.</span></p></div>`;
    return;
  }
  // FILTRAR
  const tipoFil = document.getElementById('filTipo')?.value || '';
  const fazFil = document.getElementById('filFazenda')?.value || '';
  let lista = [...analises];
  if (tipoFil) lista = lista.filter(a => a.tipo === tipoFil);
  if (fazFil) lista = lista.filter(a => a.fazendaVinculada === fazFil);
  lista.sort((a,b) => (b.dataLaudo||b.dataEntrada||'').localeCompare(a.dataLaudo||a.dataEntrada||''));
  if (!lista.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🔍</div><p>Nenhuma análise encontrada com esses filtros.</p></div>`;
    return;
  }
  cont.innerHTML = lista.map(a => {
    const amos = amostras.filter(x => x.analiseId === a._docId);
    const isSolo = a.tipo === 'solo';
    return `<div class="an-card ${a.tipo}">
      <div class="an-card-header">
        <div style="flex:1;min-width:0;">
          <div class="an-titulo">${isSolo?'🧪':'🍃'} ${escHtml(a.fazendaVinculada || a.propriedade || '—')}</div>
          <div class="an-meta">📅 ${formatarData(a.dataLaudo || a.dataEntrada)} · ${escHtml(a.laboratorio || '—')}${a.responsavelTecnico?' · '+escHtml(a.responsavelTecnico):''}</div>
        </div>
        <div class="an-badge ${isSolo?'badge-solo':'badge-folha'}">${isSolo?'Solo':'Folha'}</div>
      </div>
      <div class="an-card-amostras">📦 <strong>${amos.length}</strong> amostra${amos.length>1?'s':''}${amos.length?': '+amos.slice(0,3).map(x=>escHtml(x.nome+(x.profundidade?' ('+x.profundidade+')':''))).join(', ')+(amos.length>3?' …':''):''}</div>
      <div class="an-card-acoes">
        <button class="btn-acao primary" onclick="verAnalise('${a._docId}')">👁️ Ver detalhes</button>
        ${podeEditar()?`<button class="btn-acao" onclick="editarAnalise('${a._docId}')">✏️ Editar</button>`:''}
        ${isAdmin()?`<button class="btn-acao danger" onclick="excluirAnalise('${a._docId}')">🗑</button>`:''}

  editandoId = id;
  if (id) {
    const an = analises.find(x => x._docId === id);
    if (!an) { toast('❌ Análise não encontrada.'); return; }
    const amos = amostras.filter(x => x.analiseId === id).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
    window.formWIP = {
      tipo: an.tipo,
      laboratorio: an.laboratorio || 'Fullin',
      cliente: an.cliente || '',
      propriedade: an.propriedade || '',
      fazendaVinculada: an.fazendaVinculada || '',
      dataEntrada: an.dataEntrada || '',
      dataLaudo: an.dataLaudo || '',
      responsavelTecnico: an.responsavelTecnico || '',
      observacoes: an.observacoes || '',
      amostras: amos.map(x => ({
        _docId: x._docId,
        nome: x.nome || '',
        profundidade: x.profundidade || '',
        protocolo: x.protocolo || '',
        talhaoIdVinculado: x.talhaoIdVinculado || '',
        vincStatus: x.talhaoIdVinculado ? 'confirmado' : 'pendente',
        parametros: {...(x.parametros||{})}
      })),
      amostrasRemovidas: []  // IDs de amostras a deletar
    };
    document.getElementById('modalTitulo').textContent = '✏️ Editar Análise';
  } else {
    window.formWIP = {
      tipo: 'solo',
      laboratorio: 'Fullin',
      cliente: '',
      propriedade: '',
      fazendaVinculada: '',
      dataEntrada: hoje(),
      dataLaudo: hoje(),
      responsavelTecnico: '',
      observacoes: '',
      amostras: [criarAmostraVazia()],
      amostrasRemovidas: []
    };
    document.getElementById('modalTitulo').textContent = '🔬 Nova Análise';
  }
  renderFormAnalise();
  document.getElementById('overlayAnalise').classList.add('aberto');
}

function criarAmostraVazia() {
  return {
    nome: '',
    profundidade: '',
    protocolo: '',
    talhaoIdVinculado: '',
    vincStatus: 'pendente',
    parametros: {}
  };
}

// Sugestão de vínculo por similaridade de nome
function sugerirTalhao(nomeAmostra) {
  if (!nomeAmostra) return null;
  const n = normalizar(nomeAmostra);
  // Match exato
  let achado = talhoes.find(t => normalizar(t.nome) === n || normalizar(t.id) === n);
  if (achado) return {talhao: achado, exato: true};
  // Match parcial (contém)
  achado = talhoes.find(t => normalizar(t.nome).includes(n) || n.includes(normalizar(t.nome)));
  if (achado) return {talhao: achado, exato: false};
  return null;
}

function renderAmostras() {
  const cont = document.getElementById('amostrasContainer');
  if (!cont) return;
  const tipo = window.formWIP.tipo;
  const params = PARAMS[tipo];
  const grupos = {};
  params.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });
  cont.innerHTML = window.formWIP.amostras.map((am, idx) => {
    // Sugestão de vínculo
    let vincHtml = '';
    if (am.talhaoIdVinculado && am.vincStatus === 'confirmado') {
      const t = talhoes.find(x => x.id === am.talhaoIdVinculado);
      vincHtml = `<div class="vinc-talhao vinc-confirmado">
        <span class="vinc-lab">✓ Talhão vinculado:</span>
        <select onchange="setVinculo(${idx}, this.value)">
          <option value="">— sem vínculo —</option>
          ${talhoes.map(t2 => `<option value="${escAttr(t2.id)}" ${am.talhaoIdVinculado===t2.id?'selected':''}>${escHtml(t2.fazenda+' · '+(t2.nome||t2.id))}</option>`).join('')}
        </select>
      </div>`;
    } else {
      const sug = sugerirTalhao(am.nome);
      if (sug && !am.talhaoIdVinculado) {
        vincHtml = `<div class="vinc-talhao vinc-sugest">
          <span class="vinc-lab">💡 Sugerido${sug.exato?' (match exato)':' (similar)'}:</span>
          <select onchange="setVinculo(${idx}, this.value)">
            <option value="">— sem vínculo —</option>
            ${talhoes.map(t2 => `<option value="${escAttr(t2.id)}" ${sug.talhao.id===t2.id?'selected':''}>${escHtml(t2.fazenda+' · '+(t2.nome||t2.id))}</option>`).join('')}
          </select>
          <button class="btn-acao primary" style="padding:5px 11px;font-size:.72rem;" onclick="confirmarVinculo(${idx})">✓ Confirmar</button>
        </div>`;
      } else {
        vincHtml = `<div class="vinc-talhao">
          <span class="vinc-lab">Vincular talhão:</span>
          <select onchange="setVinculo(${idx}, this.value)">
            <option value="">— sem vínculo —</option>
            ${talhoes.map(t2 => `<option value="${escAttr(t2.id)}" ${am.talhaoIdVinculado===t2.id?'selected':''}>${escHtml(t2.fazenda+' · '+(t2.nome||t2.id))}</option>`).join('')}
          </select>
        </div>`;
      }
    }
    // Parâmetros (agrupados, colapsáveis)
    const gruposHtml = Object.entries(grupos).map(([nomeGrupo, params], gi) => {
      const linhas = params.map(p => {
        const val = am.parametros[p.id];
        return `<div class="param-row">
          <span class="param-lab">${escHtml(p.label)}</span>
          <span class="param-un">${escHtml(p.un)}</span>
          <input type="text" inputmode="decimal" class="param-inp" value="${val!==undefined&&val!==null?escAttr(val):''}"
            oninput="setParam(${idx}, '${p.id}', this.value)">
        </div>`;
      }).join('');
      const aberto = gi === 0;  // primeiro grupo aberto por padrão
      return `<div class="grp-collapsable ${aberto?'aberto':''}">
        <div class="grp-head" onclick="this.parentElement.classList.toggle('aberto')">
          <span>${escHtml(nomeGrupo)} (${params.length})</span>
          <span class="grp-toggle">▼</span>
        </div>
        <div class="grp-body">${linhas}</div>
      </div>`;
    }).join('');
    return `<div class="amostra-card">
      <div class="amostra-card-head">
        <div class="amostra-card-titulo">Amostra ${idx+1}</div>
        ${window.formWIP.amostras.length>1?`<button class="btn-rm-am" onclick="removerAmostra(${idx})">✕ Remover</button>`:''}
      </div>
      <div class="amostra-grid-base">
        <div class="fld" style="margin:0;">
          <label>Nome / identificação *</label>
          <input type="text" value="${escAttr(am.nome)}" oninput="setAmCampo(${idx},'nome',this.value)" placeholder="Ex: Arco Iris">
        </div>
        <div class="fld" style="margin:0;">
          <label>${tipo==='solo'?'Profundidade':'Identificação extra'}</label>
          ${tipo==='solo'
            ? `<select onchange="setAmCampo(${idx},'profundidade',this.value)">
                <option value="">—</option>
                ${PROFUNDIDADES.map(p=>`<option value="${p}" ${am.profundidade===p?'selected':''}>${p} cm</option>`).join('')}
              </select>`
            : `<input type="text" value="${escAttr(am.profundidade)}" oninput="setAmCampo(${idx},'profundidade',this.value)" placeholder="(opcional)">`}
        </div>
      </div>
      <div class="fld">
        <label>Protocolo do laudo</label>
        <input type="text" value="${escAttr(am.protocolo)}" oninput="setAmCampo(${idx},'protocolo',this.value)" placeholder="Ex: 12114/2026">
      </div>
      ${vincHtml}
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 6px;">Resultados</div>
      ${gruposHtml}
    </div>`;
  }).join('');
}

window.trocarTipoAnalise = function(novoTipo) {
  if (window.formWIP.amostras.some(a => Object.keys(a.parametros||{}).length > 0)) {
    if (!confirm('Mudar o tipo da análise vai limpar os valores dos parâmetros das amostras. Continuar?')) {
      document.getElementById('frmTipo').value = window.formWIP.tipo;
      return;
    }
  }
  window.formWIP.tipo = novoTipo;
  window.formWIP.amostras.forEach(a => { a.parametros = {}; });
  renderFormAnalise();
};

window.addAmostra = function() {
  window.formWIP.amostras.push(criarAmostraVazia());
  renderAmostras();
};
window.removerAmostra = function(idx) {
  const am = window.formWIP.amostras[idx];
  if (am._docId) window.formWIP.amostrasRemovidas.push(am._docId);
  window.formWIP.amostras.splice(idx, 1);
  if (!window.formWIP.amostras.length) window.formWIP.amostras.push(criarAmostraVazia());
  renderAmostras();
};
window.setAmCampo = function(idx, campo, valor) {
  window.formWIP.amostras[idx][campo] = valor;
  if (campo === 'nome') {
    // Re-render só pra atualizar a sugestão de vínculo
    renderAmostras();
  }
};
window.setParam = function(idx, paramId, valor) {
  const am = window.formWIP.amostras[idx];
  if (!am.parametros) am.parametros = {};
  const n = parseDose(valor);
  if (valor === '' || n === null) delete am.parametros[paramId];
  else am.parametros[paramId] = n;
};
window.setVinculo = function(idx, talhaoId) {
  window.formWIP.amostras[idx].talhaoIdVinculado = talhaoId;
  window.formWIP.amostras[idx].vincStatus = talhaoId ? 'confirmado' : 'pendente';
  renderAmostras();
};
window.confirmarVinculo = function(idx) {
  const am = window.formWIP.amostras[idx];
  // Se tem sugestão e o select dela já está apontando, pega
  const sug = sugerirTalhao(am.nome);
  if (sug && !am.talhaoIdVinculado) am.talhaoIdVinculado = sug.talhao.id;
  am.vincStatus = 'confirmado';
  renderAmostras();
};

// ━━━━━━━━━━ SALVAR ━━━━━━━━━━
window.salvarAnalise = async function() {
  if (!window.formWIP) return;
  if (!window.formWIP.fazendaVinculada) { toast('⚠️ Selecione a fazenda.'); return; }
  if (!window.formWIP.dataLaudo && !window.formWIP.dataEntrada) { toast('⚠️ Informe ao menos uma data.'); return; }
  const amostrasValidas = window.formWIP.amostras.filter(a => a.nome && a.nome.trim());
  if (!amostrasValidas.length) { toast('⚠️ Cadastre ao menos uma amostra com nome.'); return; }
  const btn = document.getElementById('btnSalvarAnalise');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const docAnalise = {
      tipo: window.formWIP.tipo,
      laboratorio: window.formWIP.laboratorio || '',
      cliente: window.formWIP.cliente || '',
      propriedade: window.formWIP.propriedade || '',
      fazendaVinculada: window.formWIP.fazendaVinculada,
      dataEntrada: window.formWIP.dataEntrada || '',
      dataLaudo: window.formWIP.dataLaudo || '',
      responsavelTecnico: window.formWIP.responsavelTecnico || '',
      observacoes: window.formWIP.observacoes || '',
      importadoDe: 'manual',
      atualizadoEm: new Date().toISOString(),
      atualizadoPor: usuarioAtual.email
    };
    let analiseId;
    if (editandoId) {
      await updateDoc(doc(db,'analises',editandoId), docAnalise);
      analiseId = editandoId;
    } else {
      docAnalise.criadoEm = new Date().toISOString();
      docAnalise.criadoPor = usuarioAtual.email;
      const ref = await addDoc(collection(db,'analises'), docAnalise);
      analiseId = ref.id;
    }
    // Amostras removidas
    for (const docId of (window.formWIP.amostrasRemovidas||[])) {
      try { await deleteDoc(doc(db,'amostras',docId)); } catch(e) { console.warn(e); }
    }
    // Amostras (criar ou atualizar)
    for (let i = 0; i < amostrasValidas.length; i++) {
      const a = amostrasValidas[i];
      const docAm = {
        analiseId,
        ordem: i,
        nome: a.nome.trim(),
        profundidade: a.profundidade || '',
        protocolo: a.protocolo || '',
        tipo: window.formWIP.tipo,
        fazendaVinculada: window.formWIP.fazendaVinculada,
        talhaoIdVinculado: a.talhaoIdVinculado || null,
        vincStatus: a.talhaoIdVinculado ? 'confirmado' : 'pendente',
        parametros: a.parametros || {},
        atualizadoEm: new Date().toISOString()
      };
      if (a._docId) {
        await updateDoc(doc(db,'amostras',a._docId), docAm);
      } else {
        docAm.criadoEm = new Date().toISOString();
        await addDoc(collection(db,'amostras'), docAm);
      }
    }
    try {
      await addDoc(collection(db,'logs'), {
        tipo: 'analise',
        mensagem: `${usuarioAtual.email} ${editandoId?'editou':'criou'} análise de ${window.formWIP.tipo} (${window.formWIP.fazendaVinculada}, ${amostrasValidas.length} amostras)`,
        criadoEm: new Date().toISOString(),
        uid: usuarioAtual.uid
      });
    } catch(e) {}
    toast(`✅ Análise ${editandoId?'atualizada':'criada'}!`);
    fecharModalAnalise();
  } catch(e) {
    console.error(e);
    toast('❌ Erro: '+e.message);
  }
  btn.disabled = false; btn.textContent = '💾 Salvar';
};

// ━━━━━━━━━━ EXCLUIR ━━━━━━━━━━
window.excluirAnalise = async function(id) {
  if (!isAdmin()) { toast('⛔ Só admin pode excluir.'); return; }
  const an = analises.find(x => x._docId === id);
  if (!an) return;
  const amos = amostras.filter(x => x.analiseId === id);
  if (!confirm(`Excluir análise de ${an.fazendaVinculada || an.propriedade} (${formatarData(an.dataLaudo)}) e suas ${amos.length} amostra(s)?\n\nEsta ação não pode ser desfeita.`)) return;
  try {
    for (const a of amos) {
      await deleteDoc(doc(db,'amostras',a._docId));
    }
    await deleteDoc(doc(db,'analises',id));
    try {
      await addDoc(collection(db,'logs'), {
        tipo:'analise', mensagem:`${usuarioAtual.email} excluiu análise (${an.fazendaVinculada}, ${formatarData(an.dataLaudo)})`,
        criadoEm: new Date().toISOString(), uid: usuarioAtual.uid
      });
    } catch(e) {}
    toast('🗑 Análise excluída.');
  } catch(e) {
    console.error(e);
    toast('❌ Erro: '+e.message);
  }
};

// ━━━━━━━━━━ VISUALIZAÇÃO ━━━━━━━━━━
window.verAnalise = function(id) {
  const an = analises.find(x => x._docId === id);
  if (!an) { toast('❌ Análise não encontrada.'); return; }
  const amos = amostras.filter(x => x.analiseId === id).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const params = PARAMS[an.tipo];
  const grupos = {};
  params.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });
  const isSolo = an.tipo === 'solo';
  document.getElementById('verTitulo').textContent = `${isSolo?'🧪':'🍃'} ${an.fazendaVinculada || an.propriedade || 'Análise'}`;
  let html = `
    <!-- Cabeçalho -->
    <div class="detalhe-secao">
      <div class="detalhe-secao-body">
        <div style="font-size:.8rem;color:var(--c);line-height:1.6;">
          📅 <strong style="color:var(--ve);">Laudo:</strong> ${formatarData(an.dataLaudo)} · <strong style="color:var(--ve);">Coleta:</strong> ${formatarData(an.dataEntrada)}<br>
          🔬 <strong style="color:var(--ve);">Laboratório:</strong> ${escHtml(an.laboratorio||'—')}${an.responsavelTecnico?' · '+escHtml(an.responsavelTecnico):''}<br>
          🏡 <strong style="color:var(--ve);">Fazenda:</strong> ${escHtml(an.fazendaVinculada||'—')}${an.propriedade && an.propriedade !== an.fazendaVinculada?' ('+escHtml(an.propriedade)+')':''}<br>
          📦 <strong style="color:var(--ve);">Amostras:</strong> ${amos.length}
          ${an.observacoes?'<br>💬 <em>'+escHtml(an.observacoes)+'</em>':''}
        </div>
      </div>
    </div>`;
  // Toggle textura (só relevante pra solo)
  if (isSolo) {
    html += `<div class="textura-box">
      <label>Textura do solo (afeta P-Mehlich):</label>
      <select onchange="window.texturaAtiva=this.value;verAnalise('${id}')">
        ${TEXTURAS.map(t => `<option value="${t.id}" ${window.texturaAtiva===t.id?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>`;
  }
  // Cada amostra
  amos.forEach(am => {
    const talVinc = am.talhaoIdVinculado ? talhoes.find(t => t.id === am.talhaoIdVinculado) : null;
    let linhasHtml = '';
    Object.entries(grupos).forEach(([nomeGrupo, lista]) => {
      const linhasDoGrupo = lista.map(p => {
        const val = am.parametros?.[p.id];
        if (val === undefined || val === null) {
          return `<tr><td class="par-lab">${escHtml(p.label)}</td><td class="par-val" style="color:#9ca3af;">—</td><td class="par-un">${escHtml(p.un)}</td><td><span class="par-class cls-ne">—</span></td></tr>`;
        }
        const c = classificar(p, val, an.tipo, isSolo ? window.texturaAtiva : null);
        return `<tr>
          <td class="par-lab">${escHtml(p.label)}</td>
          <td class="par-val">${fmt(val, val < 10 ? 2 : (val < 100 ? 1 : 0))}</td>
          <td class="par-un">${escHtml(p.un)}</td>
          <td><span class="par-class cls-${c.cls}">${escHtml(c.label)}</span></td>
        </tr>`;
      }).join('');
      if (linhasDoGrupo) {
        linhasHtml += `<tr><td colspan="4" style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;padding:9px 4px 4px;">${escHtml(nomeGrupo)}</td></tr>${linhasDoGrupo}`;
      }
    });
    html += `<div class="detalhe-secao">
      <div class="detalhe-secao-head">
        <div class="amostra-bloco-titulo">
          <span>📦 ${escHtml(am.nome)}${am.profundidade?' <span style="color:var(--c);font-weight:600;font-size:.78rem;">('+escHtml(am.profundidade)+' cm)</span>':''}</span>
          ${am.protocolo?`<span class="amostra-protocolo">${escHtml(am.protocolo)}</span>`:''}
        </div>
        ${talVinc?`<div class="detalhe-secao-sub">🔗 Talhão: <strong>${escHtml(talVinc.nome||talVinc.id)}</strong></div>`:'<div class="detalhe-secao-sub" style="color:#92400e;">⚠️ Sem vínculo com talhão</div>'}
      </div>
      <div class="detalhe-secao-body" style="padding:8px 11px;">
        <table class="tbl-param">${linhasHtml}</table>
      </div>
    </div>`;
  });
  document.getElementById('verBody').innerHTML = html;
  document.getElementById('overlayVer').classList.add('aberto');
};


</script>
</body>
