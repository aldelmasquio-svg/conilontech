<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conilon Tech · Análises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<!-- PDF.js para leitura de laudos (Fullin, Agrolandes) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window['pdfjsLib']) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
</script>
<style>
:root{--v:#1a5c1a;--ve:#0b1c0d;--vb:#e2f0e2;--c:#5a6b48;--cb:#c6c0b0;--cl:#f0ece3;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--blue:#3b82f6;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font-body);background:var(--bg);color:var(--t);min-height:100dvh;display:flex;flex-direction:column;}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:var(--font-display);font-weight:700;color:var(--v);font-size:1.1rem;letter-spacing:.04em;}

.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:200;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-titles{line-height:1;}
.header-title-main{font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em;}
.header-title-sub{font-size:.65rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.header-user{font-size:.78rem;color:rgba(255,255,255,.85);}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-header{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-user-nome{color:white;font-weight:700;font-size:.95rem;}
.menu-user-email{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:2px;}
.menu-body{flex:1;padding:10px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:var(--font-body);font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:1.1rem;}
.menu-footer{padding:14px;}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:var(--font-display);font-weight:700;font-size:.9rem;cursor:pointer;}

.app-main{display:flex;flex-direction:column;}

/* TABS de visualização (Lista | Comparar) */
.tabs-top{display:flex;background:white;border-bottom:2px solid var(--cb);flex-shrink:0;}
.tab-top{flex:1;padding:13px 8px;border:none;background:none;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-top.ativa{color:var(--v);border-bottom-color:var(--v);}

/* FILTROS */
.filtros-bar{background:white;border-bottom:1px solid var(--cb);padding:9px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;position:sticky;top:54px;z-index:199;}
.filtro-grupo{display:flex;align-items:center;gap:6px;}
.filtro-label{font-family:var(--font-display);font-weight:700;font-size:.7rem;text-transform:uppercase;color:var(--c);letter-spacing:.05em;}
.filtro-sel{border:1.5px solid var(--cb);border-radius:7px;padding:6px 9px;font-size:.82rem;font-family:var(--font-body);outline:none;background:white;font-weight:600;color:var(--ve);min-width:90px;}
.filtro-sel:focus{border-color:var(--v);}

/* CONTEÚDO */
.content{padding:12px 14px 100px;}
.content > *{margin-bottom:10px;}
.content > *:last-child{margin-bottom:0;}
.an-card{flex-shrink:0;}

/* CARDS DE ANÁLISES (lista) */
.an-card{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;border-left:5px solid var(--cb);}
.an-card.solo{border-left-color:#5d3a1a;}
.an-card.folha{border-left-color:#1e5631;}
.an-card-header{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 14px;gap:10px;}
.an-titulo{font-family:var(--font-display);font-weight:800;font-size:1.0rem;color:var(--ve);display:flex;align-items:center;gap:6px;}
.an-meta{font-size:.74rem;color:var(--c);margin-top:3px;line-height:1.4;}
.an-badge{font-size:.65rem;padding:3px 9px;border-radius:99px;color:white;font-weight:700;letter-spacing:.02em;flex-shrink:0;}
.badge-solo{background:#5d3a1a;}
.badge-folha{background:#1e5631;}
.an-card-amostras{padding:0 14px 11px;font-size:.78rem;color:var(--c);}
.an-card-amostras strong{color:var(--ve);}
.an-card-acoes{display:flex;gap:6px;padding:0 14px 11px;flex-wrap:wrap;}
.btn-acao{background:none;border:1.5px solid var(--cb);border-radius:6px;padding:6px 11px;font-size:.74rem;color:var(--c);cursor:pointer;font-family:var(--font-display);font-weight:700;letter-spacing:.02em;}
.btn-acao:active{transform:scale(.97);}
.btn-acao.primary{background:var(--v);border-color:var(--v);color:white;}
.btn-acao.danger{border-color:#fca5a5;color:var(--danger);}

/* BOTÃO FAB */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--v);color:white;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:50;}
.fab:active{transform:scale(.95);}
/* FAB grupo (importar + manual) */
.fab-grupo{position:fixed;bottom:20px;right:20px;z-index:50;display:none;flex-direction:column-reverse;gap:9px;align-items:flex-end;}
.fab-grupo .fab{position:static;width:56px;height:56px;}
.fab-grupo .fab-pdf{width:50px;height:50px;font-size:1.3rem;background:#5d3a1a;}
/* Overlay leitura PDF */
.overlay-pdf{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9500;display:none;align-items:center;justify-content:center;}
.overlay-pdf.aberto{display:flex;}
.overlay-pdf-box{background:white;border-radius:14px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:15px;min-width:240px;box-shadow:var(--sf);}
.overlay-pdf-box .loading-text{color:var(--ve);}

/* MODAL */
.overlay-an{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding-top:30px;}
.overlay-an.aberto{display:flex;}
.modal-an{background:white;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:calc(100dvh - 30px);display:flex;flex-direction:column;box-shadow:var(--sf);overflow:hidden;}
.modal-an-head{padding:14px 16px;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--ve);color:white;}
.modal-an-titulo{font-family:var(--font-display);font-weight:800;font-size:1.1rem;letter-spacing:.02em;}
.modal-an-fechar{background:rgba(255,255,255,.12);border:none;color:white;font-size:1.2rem;width:34px;height:34px;border-radius:7px;cursor:pointer;}
.modal-an-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;}
.modal-an-footer{padding:12px 16px;border-top:1px solid var(--cb);background:#fafafa;display:flex;gap:8px;flex-shrink:0;}
.modal-an-footer button{flex:1;}

/* FORMULÁRIO */
.fld{margin-bottom:11px;}
.fld label{display:block;font-family:var(--font-display);font-weight:700;font-size:.74rem;text-transform:uppercase;color:var(--c);letter-spacing:.04em;margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--cb);border-radius:7px;padding:9px 11px;font-size:.92rem;font-family:var(--font-body);outline:none;background:white;color:var(--t);}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--v);}
.fld textarea{resize:vertical;min-height:60px;}
.fld-row{display:flex;gap:8px;}
.fld-row .fld{flex:1;}

.btn-prim{background:var(--v);border:none;color:white;border-radius:8px;padding:11px;font-family:var(--font-display);font-weight:800;font-size:.95rem;cursor:pointer;letter-spacing:.02em;}
.btn-sec{background:none;border:1.5px solid var(--cb);color:var(--c);border-radius:8px;padding:11px;font-family:var(--font-display);font-weight:700;font-size:.9rem;cursor:pointer;}

/* AMOSTRAS no formulário */
.amostra-card{background:#fafafa;border:1px solid var(--cb);border-radius:var(--rad);padding:11px;margin-bottom:11px;}
.amostra-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.amostra-card-titulo{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--ve);}
.btn-rm-am{background:none;border:1px solid #fca5a5;color:var(--danger);border-radius:6px;padding:4px 9px;font-size:.74rem;cursor:pointer;font-family:var(--font-display);font-weight:700;}
.amostra-grid-base{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}

/* GRUPOS DE PARÂMETROS */
.grp-collapsable{border:1px solid var(--cb);border-radius:8px;margin-bottom:7px;overflow:hidden;background:white;}
.grp-head{background:var(--surface-2);padding:8px 11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:.78rem;color:var(--ve);text-transform:uppercase;letter-spacing:.04em;}
.grp-head .grp-toggle{font-size:.7rem;color:var(--c);}
.grp-body{padding:9px 11px;display:none;}
.grp-collapsable.aberto .grp-body{display:block;}
.grp-collapsable.aberto .grp-toggle{transform:rotate(180deg);display:inline-block;}
.param-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:.84rem;}
.param-row .param-lab{flex:1;color:var(--t);font-size:.82rem;line-height:1.25;}
.param-row .param-un{font-size:.66rem;color:var(--c);font-family:var(--font-mono);min-width:46px;text-align:right;}
.param-row .param-inp{width:84px;border:1.5px solid var(--cb);border-radius:6px;padding:6px 8px;font-size:.85rem;font-family:var(--font-mono);text-align:right;outline:none;}
.param-row .param-inp:focus{border-color:var(--v);}

/* VINCULAR TALHÃO */
.vinc-talhao{padding:8px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;margin-bottom:9px;font-size:.78rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.vinc-talhao .vinc-lab{font-family:var(--font-display);font-weight:700;color:#1e40af;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;}
.vinc-talhao select{flex:1;min-width:140px;border:1.5px solid #93c5fd;border-radius:6px;padding:5px 8px;font-size:.82rem;background:white;}
.vinc-sugest{background:#fef3c7;border-color:#fde68a;}
.vinc-sugest .vinc-lab{color:#92400e;}
.vinc-confirmado{background:#dcfce7;border-color:#86efac;}
.vinc-confirmado .vinc-lab{color:#166534;}

/* VISUALIZAÇÃO COMPLETA */
.detalhe-secao{background:white;border-radius:var(--rad);box-shadow:var(--s);margin-bottom:10px;}
.detalhe-secao-head{padding:10px 13px;border-bottom:1px solid var(--cl);}
.detalhe-secao-tit{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--ve);}
.detalhe-secao-sub{font-size:.72rem;color:var(--c);margin-top:2px;}
.detalhe-secao-body{padding:11px 13px;}
.amostra-bloco{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--cl);}
.amostra-bloco:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.amostra-bloco-titulo{font-family:var(--font-display);font-weight:800;font-size:.92rem;color:var(--ve);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;}
.amostra-protocolo{font-family:var(--font-mono);font-size:.7rem;color:var(--c);font-weight:600;}

/* TABELA DE PARÂMETROS NA VISUALIZAÇÃO */
.tbl-param{width:100%;font-size:.82rem;border-collapse:collapse;}
.tbl-param tr{border-bottom:1px solid var(--cl);}
.tbl-param tr:last-child{border-bottom:none;}
.tbl-param td{padding:5px 4px;}
.tbl-param .par-lab{color:var(--t);}
.tbl-param .par-val{font-family:var(--font-mono);font-weight:700;text-align:right;white-space:nowrap;}
.tbl-param .par-un{font-size:.68rem;color:var(--c);text-align:right;}
.tbl-param .par-class{text-align:center;padding:3px 6px;border-radius:99px;font-size:.65rem;font-weight:700;color:white;white-space:nowrap;}
.cls-mb{background:#991b1b;}
.cls-bx{background:#dc2626;}
.cls-md{background:#16a34a;}
.cls-at{background:#2563eb;}
.cls-ma{background:#7c3aed;}
.cls-ad{background:#16a34a;}
.cls-ne{background:var(--t4);}
.cls-id{background:#16a34a;}
.cls-fora{background:#f59e0b;}

/* TEXTURA TOGGLE */
.textura-box{background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:5px 9px;margin-bottom:8px;display:flex;align-items:center;gap:7px;font-size:.74rem;flex-wrap:wrap;}
.textura-box label{font-family:var(--font-display);font-weight:700;color:#92400e;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;}
.textura-box select{border:1.5px solid #fde68a;border-radius:6px;padding:4px 8px;font-size:.82rem;background:white;}

/* VAZIO */
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;color:var(--c);}
.vazio .ico{font-size:3.5rem;margin-bottom:10px;opacity:.4;}
.vazio p{font-size:.92rem;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ve);color:white;padding:11px 20px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* COMPARAR (placeholder - Fase B) */
.placeholder-comparar{background:white;border-radius:var(--rad);padding:30px 20px;text-align:center;box-shadow:var(--s);}
.placeholder-comparar .ico{font-size:3rem;margin-bottom:14px;}
.placeholder-comparar p{color:var(--c);font-size:.9rem;line-height:1.5;margin-bottom:14px;}

/* DIAGNÓSTICO */
.diag-sel-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ve);color:white;padding:11px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.25);}
.diag-sel-bar.visivel{display:flex;}
.diag-sel-txt{font-family:var(--font-display);font-weight:700;font-size:.9rem;}
.diag-sel-acoes{display:flex;gap:8px;}
.btn-diag-ver{background:white;border:none;color:var(--ve);border-radius:7px;padding:8px 14px;font-family:var(--font-display);font-weight:800;font-size:.82rem;cursor:pointer;}
.btn-diag-lim{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;border-radius:7px;padding:8px 12px;font-family:var(--font-display);font-weight:700;font-size:.8rem;cursor:pointer;}
.an-card-top{display:flex;align-items:stretch;}
.diag-check-wrap{display:flex;align-items:center;justify-content:center;padding:10px 4px 10px 12px;cursor:pointer;flex-shrink:0;}
.diag-check{width:18px;height:18px;cursor:pointer;accent-color:var(--v);}
.an-card-body{flex:1;min-width:0;cursor:pointer;}
/* ━━ Comparar · gráficos (cmp-*) ━━ */
.cmp-todos{display:block;width:100%;margin-top:12px;background:white;border:1.5px dashed var(--cb);border-radius:var(--rad);padding:11px;font-family:var(--font-display);font-weight:700;font-size:.84rem;color:var(--ve);cursor:pointer;}
.cmp-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:white;font-family:var(--font-display);font-weight:800;font-size:.72rem;flex-shrink:0;}
.cmp-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:8px;}
.cmp-res{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;}
.cmp-res-txt{min-width:0;font-size:.82rem;}
.cmp-res-txt small{display:block;font-size:.66rem;color:var(--c);}
.cmp-res-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.cmp-tag{font-size:.7rem;font-weight:700;border-radius:6px;padding:3px 7px;line-height:1.3;}
.cmp-sec{font-family:var(--font-display);font-weight:800;font-size:.86rem;color:var(--ve);margin:14px 2px 7px;}
.cmp-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;}
@media(max-width:520px){.cmp-grade{grid-template-columns:minmax(0,1fr);}}
.cmp-card{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:11px 12px;display:flex;flex-direction:column;gap:9px;min-width:0;}
.cmp-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--cl);padding-bottom:6px;}
.cmp-card-h b{font-family:var(--font-display);font-weight:800;font-size:.9rem;color:var(--ve);}
.cmp-card-h span{font-size:.68rem;color:var(--c);text-align:right;}
.cmp-sig{font-family:var(--font-mono);font-size:.72rem;color:var(--c);font-weight:600;margin-left:3px;}
.cmp-row{display:grid;grid-template-columns:20px minmax(0,.9fr) minmax(0,1.3fr) 76px;gap:8px;align-items:center;}
.cmp-row-nome{font-size:.76rem;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere;}
.cmp-row-nome small{display:block;font-weight:500;font-size:.62rem;color:var(--c);}
@media(max-width:520px){.cmp-row{grid-template-columns:20px minmax(0,1fr) 70px;row-gap:4px;}.cmp-row .dg-gauge{grid-column:2/4;grid-row:2;}}
table.cmp-outros{border-collapse:separate;border-spacing:3px;width:100%;font-size:.76rem;}
.cmp-outros td,.cmp-outros th{padding:5px 6px;text-align:center;border-radius:5px;}
.cmp-outros td:first-child{text-align:left;font-weight:600;white-space:nowrap;}
.cmp-outros td:not(:first-child){font-family:var(--font-mono);font-weight:600;min-width:54px;}
/* ━━ Diagnóstico visual (dg-*) ━━ */
.dg{display:flex;flex-direction:column;gap:12px;}
.dg-tabs{display:flex;gap:4px;background:white;border-radius:10px;padding:4px;box-shadow:var(--s);overflow-x:auto;}
.dg-tabs button{flex:1;white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:.84rem;border:0;background:transparent;color:var(--c);padding:9px 12px;border-radius:7px;cursor:pointer;}
.dg-tabs button[aria-selected="true"]{background:var(--ve);color:white;}
.dg-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.72rem;color:var(--c);}
.dg-legend span{display:inline-flex;align-items:center;gap:5px;}
.dg-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.dg-chips{display:flex;flex-wrap:wrap;gap:6px;}
.dg-chip{font-family:var(--font-body);font-size:.8rem;font-weight:600;border:1px solid var(--cb);background:white;color:var(--t);border-radius:99px;padding:6px 8px 6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.dg-chip .b{font-family:var(--font-mono);font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 7px;color:white;}
.dg-chip[aria-pressed="true"]{background:var(--ve);color:white;border-color:var(--ve);}
.dg-g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;}
.dg-g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.dg-col{display:flex;flex-direction:column;gap:12px;min-width:0;}
@media(max-width:860px){.dg-g2{grid-template-columns:minmax(0,1fr);}}
.dg-card{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;min-width:0;display:flex;flex-direction:column;}
.dg-card>h3{background:var(--ve);color:white;font-family:var(--font-display);font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:8px 12px;}
.dg-body{padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;}
.dg-sub{font-size:.72rem;color:var(--c);}
.dg-foot{font-size:.7rem;color:var(--c);line-height:1.4;}
.dg-div{font-family:var(--font-display);font-weight:800;font-size:.7rem;color:var(--c);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--cl);padding-top:8px;margin-top:2px;}
.dg-vazio-mini{font-size:.78rem;color:var(--c);text-align:center;padding:14px;}
.dg-click{cursor:pointer;}
/* medidor */
.dg-gh{display:grid;grid-template-columns:104px minmax(0,1fr) 78px;align-items:center;gap:10px;border-radius:6px;}
.dg-gh.dg-click:hover{background:var(--cl);}
.dg-gname{font-size:.8rem;line-height:1.2;min-width:0;}
.dg-gname b{font-family:var(--font-display);font-weight:800;}
.dg-gname span{color:var(--c);font-size:.7rem;}
.dg-gname small{display:block;font-family:var(--font-mono);color:var(--c);font-size:.64rem;}
.dg-gauge{position:relative;height:14px;border-radius:7px;margin:0 9px;}
.dg-pin{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2.5px white,0 1px 4px rgba(0,0,0,.35);}
.dg-gval{text-align:right;line-height:1.15;}
.dg-gval b{font-family:var(--font-mono);font-size:.86rem;}
.dg-gval small{display:block;font-size:.64rem;font-weight:700;}
@media(max-width:520px){.dg-gh{grid-template-columns:78px minmax(0,1fr) 66px;gap:6px;}.dg-gname span{display:none;}}
/* radar / dial */
.dg-radar{width:100%;max-width:380px;margin:0 auto;display:block;}
.dg-radar text,.dg-dial text,.dg-cols text{font-family:var(--font-body);}
.dg-dial{width:100%;max-width:230px;margin:0 auto;display:block;}
/* relações */
.dg-rt{display:grid;grid-template-columns:50px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:.78rem;}
.dg-rt b{font-family:var(--font-display);}
.dg-rbar{position:relative;height:14px;border-radius:7px;}
.dg-rbar i{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--c);}
.dg-rbar span{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px white,0 1px 3px rgba(0,0,0,.35);}
.dg-rv{text-align:right;font-family:var(--font-mono);font-weight:700;line-height:1.1;}
.dg-rv small{display:block;font-family:var(--font-body);font-weight:500;font-size:.6rem;color:var(--c);}
.dg-rax{display:flex;justify-content:space-between;font-size:.66rem;color:var(--c);padding:0 70px 0 58px;}
/* panorama */
.dg-pan{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border-radius:6px;}
.dg-pan:hover,.dg-pan.on{background:var(--vb);}
.dg-pan b{font-family:var(--font-display);font-size:.84rem;}
.dg-stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;}
.dg-stack div{display:grid;place-items:center;font-family:var(--font-mono);font-size:.72rem;font-weight:700;color:white;min-width:0;}
/* comparar */
.dg-ncs{display:flex;flex-wrap:wrap;gap:4px;}
.dg-ncs button{font-family:var(--font-display);font-weight:700;font-size:.76rem;border:1px solid var(--cb);background:white;color:var(--t);border-radius:6px;padding:4px 8px;cursor:pointer;}
.dg-ncs button[aria-pressed="true"]{background:var(--ve);color:white;border-color:var(--ve);}
.dg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.dg-cols{width:100%;display:block;}
/* matriz */
table.dg-mx{border-collapse:separate;border-spacing:3px;width:100%;}
.dg-mx th{font-family:var(--font-display);font-size:.7rem;color:var(--c);font-weight:800;padding:4px;}
.dg-mx thead th.on{color:var(--ve);text-decoration:underline;}
.dg-mx th.r{text-align:left;color:var(--t);cursor:pointer;font-size:.74rem;min-width:110px;max-width:170px;white-space:normal;line-height:1.2;position:sticky;left:0;background:white;z-index:1;}
.dg-mx th.r small{display:block;font-family:var(--font-body);font-weight:500;font-size:.6rem;color:var(--c);}
.dg-mx td{border-radius:5px;text-align:center;font-family:var(--font-mono);font-size:.74rem;padding:7px 3px;cursor:pointer;color:#1a1a1a;font-weight:600;min-width:42px;white-space:nowrap;}
.dg-mx tr.on th.r{color:var(--v);}
.dg-mx tr.on td{box-shadow:inset 0 0 0 2px #0b1c0d;}
.dg-mx-x td{font-family:var(--font-body);font-size:.66rem;font-weight:700;min-width:64px;}
/* solo */
.dg-stats{display:flex;flex-wrap:wrap;gap:8px;}
.dg-stat{background:white;border-radius:8px;box-shadow:var(--s);padding:7px 12px;display:flex;flex-direction:column;border-left:4px solid #c9cfc6;min-width:96px;}
.dg-stat span{font-size:.66rem;color:var(--c);}
.dg-stat b{font-family:var(--font-mono);font-size:1.02rem;}
.dg-textura{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--c);}
.dg-textura select{border:1px solid var(--cb);border-radius:6px;padding:5px 8px;font-size:.78rem;background:white;}
/* solo × folha */
.dg-par{background:white;border-radius:var(--rad);box-shadow:var(--s);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.82rem;}
.dg-par select{max-width:100%;border:1px solid var(--cb);border-radius:6px;padding:6px 8px;font-size:.8rem;background:white;margin-top:2px;}
.dg-tag{display:inline-block;color:white;font-family:var(--font-display);font-weight:800;font-size:.66rem;border-radius:99px;padding:2px 9px;white-space:nowrap;}
.dg-quad{display:flex;align-items:stretch;gap:6px;}
.dg-quad-ylab{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-display);font-weight:800;font-size:.66rem;letter-spacing:.12em;color:var(--c);text-align:center;}
.dg-quad-grid{flex:1;display:grid;grid-template-columns:62px repeat(3,minmax(0,1fr));gap:4px;}
.dg-quad-rl,.dg-quad-cl{font-size:.66rem;font-weight:700;color:var(--c);display:flex;align-items:center;justify-content:center;text-align:center;}
.dg-quad-cel{border:1.5px solid;border-radius:8px;padding:6px;min-height:78px;display:flex;flex-direction:column;gap:5px;}
.dg-quad-t{font-family:var(--font-display);font-weight:800;font-size:.66rem;line-height:1.15;}
.dg-quad-n{display:flex;flex-wrap:wrap;gap:3px;}
.dg-quad-n span{color:white;font-family:var(--font-display);font-weight:800;font-size:.74rem;border-radius:5px;padding:2px 6px;}
.dg-quad-xlab{font-family:var(--font-display);font-weight:800;font-size:.66rem;letter-spacing:.12em;color:var(--c);text-align:center;padding-left:84px;}
.dg-leitura{font-size:.76rem;line-height:1.4;gap:6px;}
.dg-x{display:grid;grid-template-columns:36px minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:center;border-top:1px solid var(--cl);padding-top:9px;}
.dg-x-sig{font-family:var(--font-display);font-weight:800;font-size:1rem;color:var(--ve);text-align:center;}
.dg-x-g{display:flex;flex-direction:column;gap:5px;min-width:0;}
.dg-x-g .dg-gname span{display:none;}
.dg-x-d small{display:block;font-size:.7rem;color:var(--c);margin-top:3px;line-height:1.35;}
@media(max-width:640px){.dg-x{grid-template-columns:30px minmax(0,1fr);}.dg-x-d{grid-column:2;}}
.diag-sem-sel{background:white;border-radius:var(--rad);padding:40px 22px;text-align:center;box-shadow:var(--s);}
.diag-sem-sel .ico{font-size:3rem;margin-bottom:12px;opacity:.4;}
.diag-sem-sel p{color:var(--c);font-size:.9rem;line-height:1.55;}

/* ━━━━━━━━━━ FASE B: COMPARAÇÃO ━━━━━━━━━━ */
/* Botão de Faixas no header */
.btn-faixas-header{background:rgba(255,255,255,.12);border:none;color:white;font-size:18px;width:38px;height:38px;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;margin-left:8px;}

/* Header compacto da comparação (chips + abas) */
.cmp-bar{background:white;border-radius:var(--rad);padding:8px;box-shadow:var(--s);margin-bottom:10px;position:sticky;top:-1px;z-index:10;}
.cmp-bar-slots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;}
.slot-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;font-size:.74rem;border:1.5px dashed var(--cb);background:#fafafa;color:var(--c);font-family:var(--font-display);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;flex:1;min-height:34px;justify-content:center;}
.slot-chip-vazio:hover{border-color:var(--v);background:var(--vb);color:var(--ve);}
.slot-chip-cheio{border-style:solid;cursor:default;text-transform:none;letter-spacing:0;font-weight:600;padding:5px 8px;justify-content:flex-start;text-align:left;}
.slot-chip-solo{border-color:#5d3a1a;background:#fef7ed;color:#5d3a1a;}
.slot-chip-folha{border-color:#1e5631;background:#f0fdf4;color:#1e5631;}
.slot-chip-ico{font-size:.92rem;flex-shrink:0;}
.slot-chip-txt{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0;}
.slot-chip-nome{font-family:var(--font-display);font-weight:800;font-size:.78rem;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-chip-faz{font-size:.6rem;color:var(--c);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-chip-x{background:rgba(0,0,0,.07);border:none;color:inherit;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;line-height:1;}
.slot-chip-x:hover{background:#fee2e2;color:var(--danger);}

/* Barra de modos (Tabela / Gráficos / Limpar) */
.cmp-bar-modos{display:flex;gap:6px;border-top:1px solid var(--cl);padding-top:7px;align-items:center;}
.cmp-modo-btn{flex:1;background:#fafafa;border:1.5px solid var(--cb);border-radius:8px;padding:9px 6px;font-family:var(--font-display);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--c);text-transform:uppercase;letter-spacing:.03em;min-height:38px;}
.cmp-modo-btn.ativo{background:var(--v);color:white;border-color:var(--v);box-shadow:0 2px 6px rgba(45,106,45,.3);}
.cmp-modo-btn:active{transform:scale(.97);}
.cmp-modo-limpar{background:none;border:1.5px solid var(--cb);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.9rem;color:var(--c);min-height:38px;}
.cmp-modo-limpar:hover{background:#fee2e2;color:var(--danger);border-color:#fca5a5;}

.cmp-aviso-misto{background:#fef3c7;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:8px;padding:9px 11px;font-size:.78rem;color:#92400e;line-height:1.45;margin-bottom:10px;}

/* TABELA comparativa */
.cmp-tbl-wrap{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:.74rem;}
.cmp-tbl + .cmp-tbl{margin-top:14px;}
.cmp-tbl th,.cmp-tbl td{padding:5px 4px;border-bottom:1px solid var(--cl);vertical-align:top;}
.cmp-tbl th{background:var(--vb);font-family:var(--font-display);font-weight:700;color:var(--ve);text-align:left;font-size:.7rem;border-bottom:2px solid var(--v);}
.cmp-th-tipo{font-size:.62rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.cmp-th-nome{font-size:.78rem;color:var(--ve);font-weight:800;line-height:1.2;}
.cmp-th-vazia{background:var(--surface-2)!important;}
.cmp-tit-secao td{background:#374151;color:white;font-family:var(--font-display);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;}
.cmp-lab{font-weight:600;color:var(--t);font-size:.78rem;}
.cmp-un{font-size:.65rem;color:var(--c);font-family:var(--font-mono);}
.cmp-cel{text-align:center;}
.cmp-cel-val{font-family:var(--font-mono);font-weight:700;font-size:.85rem;color:var(--ve);}
.cmp-cel-class{display:inline-block;padding:1px 5px;border-radius:99px;font-size:.6rem;color:white;font-weight:700;margin-top:2px;}
.cmp-cel-vazia{text-align:center;color:var(--t4);font-style:italic;font-size:.78rem;}

/* GRÁFICOS */
.seg-faixa{position:absolute;top:0;bottom:0;opacity:.55;}
.seg-faixa:first-child{border-radius:5px 0 0 5px;}
.seg-faixa:last-child{border-radius:0 5px 5px 0;}
.seg-marker{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:99px;box-shadow:0 0 0 2px white;z-index:2;}
.seg-marker-val{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-weight:700;font-size:.62rem;background:white;padding:1px 4px;border-radius:4px;border:1px solid var(--cb);white-space:nowrap;color:var(--ve);box-shadow:0 1px 2px rgba(0,0,0,.1);}
.zonas-leg{display:flex;flex-wrap:wrap;gap:8px;margin:5px 0 8px;font-size:.66rem;color:var(--c);}
.zona-leg{display:inline-flex;align-items:center;gap:4px;}
.zona-leg-cor{width:10px;height:10px;border-radius:2px;display:inline-block;opacity:.7;}
.cmp-val-item{display:flex;align-items:center;gap:7px;font-size:.74rem;flex-wrap:wrap;}
.cmp-val-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.cmp-val-nome{flex:1;min-width:80px;color:var(--t);}
.cmp-val-num{font-family:var(--font-mono);font-weight:700;font-size:.74rem;color:var(--ve);}
.cmp-val-cls{display:inline-block;padding:1px 6px;border-radius:99px;font-size:.6rem;color:white;font-weight:700;}


/* SELETOR de amostra (lista) */
.sel-amostra-lista{display:flex;flex-direction:column;gap:0;}
.sel-busca-wrap{padding:0 0 8px 0;position:sticky;top:-12px;z-index:2;background:white;}
.sel-busca-input{width:100%;box-sizing:border-box;padding:8px 10px;border:1.5px solid var(--cb);border-radius:8px;font-size:.88rem;font-family:inherit;outline:none;}
.sel-busca-input:focus{border-color:var(--v);}
.sel-faz-grupo{margin-bottom:8px;}
.sel-faz-header{font-family:var(--font-display);font-weight:800;font-size:.82rem;color:var(--ve);text-transform:uppercase;letter-spacing:.05em;padding:8px 4px 3px;border-bottom:2px solid var(--vb);}
.sel-safra-header{font-family:var(--font-display);font-weight:700;font-size:.72rem;color:var(--c);padding:5px 4px 2px;margin-top:4px;}
.sel-am-item{display:flex;align-items:center;gap:9px;padding:9px;background:#fafafa;border:1px solid var(--cb);border-radius:8px;cursor:pointer;transition:all .15s;margin-top:4px;}
.sel-am-item:hover{background:var(--vb);border-color:var(--v);}
.sel-am-item.ja-sel{opacity:.55;background:var(--cl);cursor:default;}
.sel-am-tipo{flex-shrink:0;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.95rem;}
.sel-am-info{flex:1;min-width:0;}
.sel-am-nome{font-family:var(--font-display);font-weight:800;font-size:.92rem;color:var(--ve);line-height:1.2;}
.sel-am-meta{font-size:.7rem;color:var(--c);line-height:1.35;margin-top:1px;}
.sel-am-arrow{color:var(--cb);font-size:1.3rem;font-weight:700;flex-shrink:0;}
.sel-am-tag{font-size:.6rem;background:var(--cb);color:var(--c);padding:2px 6px;border-radius:99px;text-transform:uppercase;font-weight:700;letter-spacing:.04em;}
/* LISTA principal - agrupada por fazenda/safra */
.lista-faz-grupo{margin-bottom:16px;}
.lista-faz-header{font-family:var(--font-display);font-weight:900;font-size:1rem;color:var(--ve);text-transform:uppercase;letter-spacing:.05em;padding:6px 2px;border-bottom:2.5px solid var(--v);margin-bottom:8px;}
.lista-safra-header{font-family:var(--font-display);font-weight:700;font-size:.78rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;padding:8px 2px 4px;margin-top:4px;}

/* FAIXAS */
.faixas-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--cb);padding-bottom:9px;}
.faixas-tab{flex:1;background:#fafafa;border:1px solid var(--cb);border-radius:7px;padding:8px;font-family:var(--font-display);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--c);}
.faixas-tab.ativa{background:var(--v);color:white;border-color:var(--v);}
.faixas-grupo{margin-bottom:14px;}
.faixas-grupo-tit{font-family:var(--font-display);font-weight:700;font-size:.75rem;color:var(--c);text-transform:uppercase;letter-spacing:.05em;padding:5px 0 7px;border-bottom:1px solid var(--cb);margin-bottom:9px;}
.faixa-param{background:#fafafa;border:1px solid var(--cb);border-radius:8px;padding:9px 11px;margin-bottom:7px;}
.faixa-param-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;flex-wrap:wrap;gap:5px;}
.faixa-param-nome{font-family:var(--font-display);font-weight:700;font-size:.85rem;color:var(--ve);}
.faixa-param-un{font-size:.66rem;color:var(--c);font-family:var(--font-mono);font-weight:500;}
.faixa-param-status{font-size:.6rem;background:var(--cl);color:var(--c);padding:2px 7px;border-radius:99px;text-transform:uppercase;font-weight:700;letter-spacing:.04em;}
.btn-faixa-reset{background:#fef3c7;border:1px solid #fde68a;color:#92400e;border-radius:6px;padding:3px 9px;font-size:.66rem;cursor:pointer;font-family:var(--font-display);font-weight:700;}
.faixa-inputs{display:flex;gap:6px;flex-wrap:wrap;}
.faixa-inp-grp{flex:1;min-width:75px;}
.faixa-inp-grp label{display:block;font-size:.62rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:2px;}
.faixa-inp{width:100%;border:1.5px solid var(--cb);border-radius:6px;padding:5px 7px;font-size:.82rem;font-family:var(--font-mono);background:white;outline:none;text-align:right;}
.faixa-inp.cust{border-color:var(--v);background:#f0fdf4;font-weight:700;}
.faixa-inp:focus{border-color:var(--v);}
.faixa-inp::placeholder{color:var(--t4);font-weight:500;}
.faixa-text-bloco{background:white;border:1px solid var(--cb);border-radius:7px;padding:6px 8px;margin-bottom:6px;}
.faixa-text-bloco:last-child{margin-bottom:0;}
.faixa-text-tit{font-family:var(--font-display);font-weight:700;font-size:.7rem;color:var(--ve);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
/* Banner de importação PDF */
.banner-pdf-import{background:#dcfce7;border:1px solid #86efac;border-left:4px solid #16a34a;border-radius:8px;padding:10px 13px;font-size:.84rem;color:#166534;line-height:1.45;margin-bottom:13px;}
.banner-pdf-import strong{color:#14532d;}

<div class="app-main" id="appContent" style="display:none;">

<!-- FAB grupo: importar PDF + novo manual -->
<div class="fab-grupo" id="fabGrupo" style="display:none;">

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href='login.html'; return; }
  usuarioAtual = user;
  const snap = await getDoc(doc(db,'usuarios',user.uid));
  if (!snap.exists()) { await signOut(auth); return; }
  perfilAtual = snap.data();
  if (!perfilAtual.modulos && perfilAtual.perfil === 'admin') {
    perfilAtual.modulos = {mapa:'admin',atividades:'admin',adubacao:'admin',pulverizacao:'admin',pedidos:'admin',admin:'admin',estoque:'admin',gestao:'admin',analises:'admin'};
  }
  if (!temAcesso()) {
    document.getElementById('loadingScreen').innerHTML = '<div style="text-align:center;padding:30px;"><div style="font-size:3rem;">⛔</div><div style="font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--c);margin-top:10px;">Sem permissão</div><a href="index.html" style="display:inline-block;margin-top:14px;color:var(--v);">← Voltar</a></div>';
    return;
  }
  document.getElementById('userNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserNome').textContent = perfilAtual.nome || user.email;
  document.getElementById('menuUserEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('appContent').style.display = 'flex';
  if (podeEditar()) document.getElementById('fabGrupo').style.display = 'flex';
  if (isAdmin()) document.getElementById('btnAbrirFaixas').style.display = 'flex';
  gerarMenu(perfilAtual);

  onSnapshot(collection(db,'talhoes'), snap => {
    talhoes = snap.docs.map(d => ({_docId:d.id, ...d.data()}));
    const set = new Set(); talhoes.forEach(t=>{if(t.fazenda)set.add(t.fazenda);});
    fazendas = [...set].sort();
    popularFazendas();
  });
  onSnapshot(collection(db,'analises'), snap => {
    analises = snap.docs.map(d=>({_docId:d.id, ...d.data()}));
    renderLista();
    if (tabAtual === 'diag') renderDiagnostico();
  });
  onSnapshot(collection(db,'amostras'), snap => {
    amostras = snap.docs.map(d=>({_docId:d.id, ...d.data()}));
    renderLista();
    if (tabAtual === 'diag') renderDiagnostico();
  });

    if (snap.exists()) {

// ━━━━━━━━━━ CLASSIFICAÇÃO (avalia parâmetro contra faixa) ━━━━━━━━━━
// Retorna a faixa "efetiva" — custom (se existir) ou default do catálogo
function faixaEfetiva(parametro, tipo) {
  const custom = window.faixasCustom?.[tipo]?.[parametro.id];
  if (parametro.faixaTextura) {
    // Mesclar: custom sobrescreve por textura
    const out = {};
    for (const t of ['arenoso','medio','argiloso']) {
      out[t] = (custom && custom[t]) ? custom[t] : parametro.faixaTextura[t];
    }
    return {tipo:'textura', faixa:out};
  }
  if (parametro.faixaIdeal) {
    return {tipo:'ideal', faixa: (custom && custom.ideal !== undefined) ? {ideal:custom.ideal} : parametro.faixaIdeal};
  }
  if (parametro.faixa) {
    return {tipo:'simples', faixa: custom ? {...parametro.faixa, ...custom} : parametro.faixa};
  }
  if (parametro.faixaEspecial === 'ph') {
    return {tipo:'ph'};
  }
  return null;
}

// Retorna { cls: 'mb'|'bx'|'md'|'at'|'ma'|'ne', label: 'Muito baixo'/'Bom'/...}
function classificar(parametro, valor, tipo, textura) {
  if (valor == null || !isFinite(valor)) return {cls:'ne', label:'—'};
  // pH especial (solo)
  if (parametro.faixaEspecial === 'ph') {
    if (valor < 5.0) return {cls:'mb', label:'Muito ácido'};
    if (valor < 5.5) return {cls:'bx', label:'Ácido'};
    if (valor < 6.0) return {cls:'md', label:'Acidez fraca'};
    if (valor <= 6.9) return {cls:'md', label:'Bom'};
    if (valor < 7.5) return {cls:'at', label:'Alcalino fraco'};
    return {cls:'ma', label:'Alcalino'};
  }
  const ef = faixaEfetiva(parametro, tipo);
  if (!ef) return {cls:'ne', label:'—'};
  // Faixa que varia por textura (P-Mehlich)
  let faixa;
  if (ef.tipo === 'textura') {
    faixa = ef.faixa[textura || 'medio'];
  } else if (ef.tipo === 'ideal') {
    const ideal = ef.faixa.ideal;
    if (!ideal) return {cls:'ne', label:'—'};
    const desvio = Math.abs(valor - ideal) / ideal;
    if (desvio <= 0.15) return {cls:'id', label:'Ideal'};
    if (desvio <= 0.40) return {cls:'fora', label:valor>ideal?'Acima':'Abaixo'};
    return {cls:'bx', label:valor>ideal?'Muito alto':'Muito baixo'};
  } else {
    faixa = ef.faixa;
  }
  // Folha 5 níveis (quando muitoBaixo definido via customização)
  if (tipo === 'folha' && faixa && faixa.muitoBaixo !== undefined) {
    if (valor < faixa.muitoBaixo) return {cls:'mb', label:'Muito baixo'};
    if (valor < faixa.baixo)      return {cls:'bx', label:'Baixo'};
    if (valor < faixa.alto)       return {cls:'ad', label:'Adequado'};
    if (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto) && valor < faixa.muitoAlto) return {cls:'at', label:'Alto'};
    return (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto)) ? {cls:'ma', label:'Muito alto'} : {cls:'at', label:'Alto'};
  }
  // Folha 3 níveis (padrão), com muitoAlto opcional
  if (tipo === 'folha' && faixa && faixa.baixo !== undefined && faixa.muitoBaixo === undefined) {
    if (valor < faixa.baixo) return {cls:'bx', label:'Baixo'};
    if (valor <= faixa.alto) return {cls:'ad', label:'Adequado'};
    if (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto) && valor < faixa.muitoAlto) return {cls:'at', label:'Alto'};
    return (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto)) ? {cls:'ma', label:'Muito alto'} : {cls:'at', label:'Alto'};
  }
  // Faixa padrão (solo): muito baixo/baixo/médio/alto/muito alto
  if (!faixa) return {cls:'ne', label:'—'};
  const inv = parametro.inverter;
  if (valor < faixa.muitoBaixo) return inv ? {cls:'md', label:'Bom'} : {cls:'mb', label:'Muito baixo'};
  if (valor < faixa.baixo)      return inv ? {cls:'md', label:'Bom'} : {cls:'bx', label:'Baixo'};
  if (valor < faixa.alto)       return {cls:'md', label:'Médio/Bom'};
  if (valor < faixa.muitoAlto)  return inv ? {cls:'bx', label:'Alto'} : {cls:'at', label:'Alto'};
  return inv ? {cls:'mb', label:'Muito alto'} : {cls:'ma', label:'Muito alto'};
}

window.renderLista = function() {
  const cont = document.getElementById('content');
  if (tabAtual !== 'lista') return;
  if (!analises.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🔬</div><p>Nenhuma análise cadastrada ainda.<br><span style="font-size:.78rem;">Toque no botão + para criar a primeira análise.</span></p></div>`;
    return;
  }
  const tipoFil = document.getElementById('filTipo')?.value || '';
  const fazFil = document.getElementById('filFazenda')?.value || '';
  let lista = [...analises];
  if (tipoFil) lista = lista.filter(a => a.tipo === tipoFil);
  if (fazFil) lista = lista.filter(a => a.fazendaVinculada === fazFil);
  lista.sort((a,b) => (b.dataLaudo||b.dataEntrada||'').localeCompare(a.dataLaudo||a.dataEntrada||''));
  if (!lista.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🔍</div><p>Nenhuma análise encontrada com esses filtros.</p></div>`;
    return;
  }
  // Build groups: by fazenda (when "Todas") then by year/safra within each group
  const byFaz = new Map();
  for (const a of lista) {
    const faz = a.fazendaVinculada || a.propriedade || '—';
    if (!byFaz.has(faz)) byFaz.set(faz, []);
    byFaz.get(faz).push(a);
  }
  const fazendas = [...byFaz.keys()].sort((a, b) => a.localeCompare(b, 'pt'));
  const showFazHeader = !fazFil;
  let html = '';
  for (const faz of fazendas) {
    const fazItens = byFaz.get(faz);
    const byAno = new Map();
    for (const a of fazItens) {
      const data = a.dataLaudo || a.dataEntrada || '';
      const ano = data ? data.substring(0, 4) : '—';
      if (!byAno.has(ano)) byAno.set(ano, []);
      byAno.get(ano).push(a);
    }
    const anos = [...byAno.keys()].sort((a, b) => b.localeCompare(a));
    html += `<div class="lista-faz-grupo">`;
    if (showFazHeader) html += `<div class="lista-faz-header">🏡 ${escHtml(faz)}</div>`;
    for (const ano of anos) {
      html += `<div class="lista-safra-header">📅 Safra ${escHtml(ano)}</div>`;
      html += byAno.get(ano).map(renderAnCard).join('');
    }
    html += `</div>`;
  }
  cont.innerHTML = html;
};

function dgParam(tipo, id) { return PARAMS[tipo].find(p => p.id === id); }

// Completa saturações e relações que o laudo não trouxe (K do solo em mg/dm³ → cmolc: ÷ 391)
function dgEnriquecer(am) {
  const p = {...(am.parametros || {})};
  const val = id => { const v = p[id]; return (v === null || v === undefined || v === '' || !isFinite(Number(v))) ? null : Number(v); };
  const conv = (tipo, id) => (tipo === 'solo' && id === 'potassio') ? 1/391 : 1;
  if (am.tipo === 'solo') {
    const T = val('ctc_ph7');
    if (T) {
      if (val('sat_ca') == null && val('calcio') != null) p.sat_ca = val('calcio') / T * 100;
      if (val('sat_mg') == null && val('magnesio') != null) p.sat_mg = val('magnesio') / T * 100;
      if (val('sat_k') == null && val('potassio') != null) p.sat_k = val('potassio') / 391 / T * 100;
    }
  }
  (DG_REL[am.tipo] || []).forEach(([id, a, b]) => {
    if (val(id) != null) return;
    const va = val(a), vb = val(b);
    if (va != null && vb) p[id] = (va * conv(am.tipo, a)) / (vb * conv(am.tipo, b));
  });
  return {...am, parametros: p};
}

}
function dgData(am) { const an = analises.find(a => a._docId === am.analiseId); return an?.dataLaudo || an?.dataEntrada || ''; }
function dgClass(p, tipo, v) { return v == null ? {cls:'ne', label:'—'} : classificar(p, v, tipo, window.texturaAtiva); }

// Limites da faixa adequada: {lo, hi, min}. lo=null → parâmetro "quanto menos melhor" (Al, m%, H+Al)
function dgLimites(p, tipo) {
  if (!p) return null;
  if (p.faixaEspecial === 'ph') return {lo:5.5, hi:6.9, min:3.5};
  const ef = faixaEfetiva(p, tipo);
  if (!ef || ef.tipo === 'ideal' || ef.tipo === 'ph') return null;
  const f = ef.tipo === 'textura' ? ef.faixa[window.texturaAtiva || 'medio'] : ef.faixa;
  if (!f) return null;
  if (p.inverter) {
    const hi = isFinite(f.alto) ? f.alto : f.baixo;
    return isFinite(hi) && hi > 0 ? {lo:null, hi, min:0} : null;
  }
  if (!isFinite(f.baixo) || f.baixo <= 0) return null;
  return {lo:f.baixo, hi: isFinite(f.alto) ? f.alto : Infinity, min:0};
}
// Posição 0–1 no medidor: abaixo da faixa 0–0,5 · faixa 0,5–0,75 · acima 0,75–1 (1 = 1,5× o máximo)
function dgPos(v, L) {
  if (L.lo == null) return v <= L.hi ? 0.75 * Math.max(0, v) / L.hi : Math.min(1, 0.75 + 0.25 * (v - L.hi) / (L.hi * 0.5));
  if (v < L.lo) return Math.max(0, 0.5 * (v - L.min) / (L.lo - L.min));
  if (!isFinite(L.hi)) return 0.5 + 0.25 * Math.min(1, (v - L.lo) / L.lo);
  if (v <= L.hi) return 0.5 + 0.25 * (v - L.lo) / (L.hi - L.lo);
  return Math.min(1, 0.75 + 0.25 * (v - L.hi) / (L.hi * 0.5));
}
function dgInv(t, L) {
  if (L.lo == null) return t <= 0.75 ? t / 0.75 * L.hi : L.hi + (t - 0.75) / 0.25 * L.hi * 0.5;
  if (t < 0.5) return L.min + t / 0.5 * (L.lo - L.min);
  if (!isFinite(L.hi)) return L.lo + (t - 0.5) / 0.25 * L.lo;
  if (t <= 0.75) return L.lo + (t - 0.5) / 0.25 * (L.hi - L.lo);
  return L.hi + (t - 0.75) / 0.25 * L.hi * 0.5;
}
// Fundo do medidor: amostra a classificação ao longo da escala → as cores batem com o rótulo
function dgFaixasCor(clsDe, n = 60) {
  const runs = [];
  for (let i = 0; i < n; i++) {
    const cls = clsDe((i + 0.5) / n);
    const last = runs[runs.length - 1];
    if (last && last.cls === cls) last.b = (i + 1) / n; else runs.push({cls, a:i / n, b:(i + 1) / n});
  }
  return runs;
}
function dgGradiente(runs) {
  return 'linear-gradient(90deg,' + runs.map(r => `${DG_TINT[r.cls] || DG_TINT.ne} ${(r.a*100).toFixed(1)}% ${(r.b*100).toFixed(1)}%`).join(',') + ')';
}
function dgFaixaTxt(L, p) {
  if (!L) return '';
  const f = x => dgNum(x);
  if (L.lo == null) return `até ${f(L.hi)}`;
  if (!isFinite(L.hi)) return `≥ ${f(L.lo)}`;
  return `${f(L.lo)}–${f(L.hi)}`;
}

// ━━ Peças visuais ━━
function dgGauge(p, tipo, am, onclick, rotulo) {
  if (!p) return '';
  const v = dgVal(am, p.id), L = dgLimites(p, tipo), c = dgClass(p, tipo, v);
  const fundo = L ? dgGradiente(dgFaixasCor(t => classificar(p, Math.max(0, dgInv(t, L)), tipo, window.texturaAtiva).cls)) : DG_TINT.ne;
  const pin = (v != null && L) ? `<span class="dg-pin" style="left:${(dgPos(v, L)*100).toFixed(1)}%;background:${DG_COR[c.cls]}"></span>` : '';
  return `<div class="dg-gh${onclick?' dg-click':''}" ${onclick?`onclick="${onclick}"`:''} title="${escAttr(p.label)}: ${escAttr(dgNum(v))} ${escAttr(p.un)} — ${escAttr(c.label)}">
    <div class="dg-gname"><b>${escHtml(rotulo || DG_SIG[p.id] || dgNome(p))}</b> <span>${rotulo ? '' : escHtml(dgNome(p))}</span><small>${escHtml(dgFaixaTxt(L, p))}</small></div>
    <div class="dg-gauge" style="background:${fundo}">${pin}</div>
    <div class="dg-gval"><b>${dgNum(v)}</b><small style="color:${c.cls==='ne'?'var(--c)':DG_COR[c.cls]}">${escHtml(c.label)}</small></div>
  </div>`;
}

function dgRadar(eixos) { // [{label, t, cls, tip}]
  if (eixos.length < 3) return '<div class="dg-vazio-mini">Poucos parâmetros para o radar.</div>';
  const cx = 180, cy = 180, R = 150, n = eixos.length;
  const pt = (i, r) => { const a = -Math.PI/2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * r, cy + Math.sin(a) * R * r]; };
  const poly = r => eixos.map((_, i) => pt(i, r).map(x => x.toFixed(1)).join(',')).join(' ');
  let h = '';
  [[1, DG_TINT.at], [0.75, DG_TINT.md], [0.5, DG_TINT.bx], [0.3, DG_TINT.mb]].forEach(([r, c]) => h += `<polygon points="${poly(r)}" fill="${c}" stroke="none"/>`);
  [0.25, 0.5, 0.75, 1].forEach(r => h += `<polygon points="${poly(r)}" fill="none" stroke="#5a6b48" stroke-opacity=".25"/>`);
  eixos.forEach((_, i) => { const [x, y] = pt(i, 1); h += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#5a6b48" stroke-opacity=".25"/>`; });
  const pts = eixos.map((e, i) => e.t == null ? null : pt(i, Math.max(e.t, 0.03)));
  const validos = pts.filter(Boolean);
  if (validos.length >= 3) h += `<polygon points="${validos.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" fill="#0b1c0d" fill-opacity=".07" stroke="#0b1c0d" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { if (p) h += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6.5" fill="${DG_COR[eixos[i].cls]}" stroke="#0b1c0d" stroke-width="1.8"><title>${escHtml(eixos[i].tip)}</title></circle>`; });
  eixos.forEach((e, i) => {
    const [x, y] = pt(i, 1.13); const anc = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end';
    h += `<text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="${anc}" font-size="15" font-weight="700" fill="${e.t == null ? '#9ca3af' : '#1a1a1a'}">${escHtml(e.label)}</text>`;
  });
  return `<svg class="dg-radar" viewBox="-44 -30 448 420" role="img" aria-label="Radar de equilíbrio">${h}</svg>
    <div class="dg-foot" style="text-align:center">Faixa verde = adequado · para dentro = falta · para fora = sobra</div>`;
}
function dgRadarEixos(am, tipo, ids) {
  return ids.map(id => dgParam(tipo, id)).filter(Boolean).map(p => {
    const v = dgVal(am, p.id), L = dgLimites(p, tipo), c = dgClass(p, tipo, v);
    return {label: DG_SIG[p.id] || dgNome(p), t: (v != null && L) ? dgPos(v, L) : null, cls: c.cls, tip: `${p.label}: ${dgNum(v)} ${p.un} — ${c.label}`};
  });
}

function dgRelacoes(am, tipo) {
  const linhas = DG_REL[tipo].map(([id, , , lab]) => {
    const p = dgParam(tipo, id); if (!p) return '';
    const ef = faixaEfetiva(p, tipo); const ideal = ef?.faixa?.ideal;
    const r = dgVal(am, id);
    if (!ideal) return '';
    const posDe = x => 50 + Math.max(-1.5, Math.min(1.5, Math.log2(x / ideal))) / 1.5 * 46;
    const deP = t => ideal * Math.pow(2, ((t * 100 - 50) / 46) * 1.5);
    const fundo = dgGradiente(dgFaixasCor(t => classificar(p, deP(t), tipo).cls));
    const c = dgClass(p, tipo, r);
    return `<div class="dg-rt" title="${escAttr(lab)}: ${escAttr(dgNum(r))} (ideal ${escAttr(dgNum(ideal))}) — ${escAttr(c.label)}">
      <b>${escHtml(lab)}</b>
      <div class="dg-rbar" style="background:${fundo}"><i></i>${r != null && r > 0 ? `<span style="left:${posDe(r).toFixed(1)}%;background:${DG_COR[c.cls]}"></span>` : ''}</div>
      <span class="dg-rv">${dgNum(r)}<small>ideal ${dgNum(ideal)}</small></span>
    </div>`;
  }).join('');
  if (!linhas) return '<div class="dg-vazio-mini">Sem relações com valor ideal cadastrado.</div>';
  return linhas + `<div class="dg-rax"><span>menor</span><span>ideal</span><span>maior</span></div>`;
}

function dgPanorama(lista, tipo, ids, sel) {
  const ordem = [['mb','muito baixo'],['bx','baixo'],['md','adequado'],['at','alto'],['ma','muito alto']];
  const grupoCls = c => ['ad','id'].includes(c) ? 'md' : c === 'fora' ? 'bx' : c;
  return ids.map(id => dgParam(tipo, id)).filter(Boolean).map(p => {
    const cont = {};
    lista.forEach(am => { const c = grupoCls(dgClass(p, tipo, dgVal(am, p.id)).cls); if (c !== 'ne') cont[c] = (cont[c] || 0) + 1; });
    const segs = ordem.map(([c, lab]) => cont[c] ? `<div style="flex:${cont[c]};background:${DG_COR[c]}" title="${cont[c]} ${lab}">${cont[c]}</div>` : '').join('');
    return `<div class="dg-pan${p.id === sel ? ' on' : ''}" onclick="dgSet('nut','${p.id}')">
      <b>${escHtml(DG_SIG[p.id] || dgNome(p))}</b>
      <div class="dg-stack">${segs || '<div style="flex:1;background:#eceee9;color:var(--c)">sem dado</div>'}</div>
    </div>`;
  }).join('') + `<div class="dg-foot" style="padding-left:52px">nº de amostras · ← abaixo · adequado · acima →</div>`;
}

function dgColunas(lista, tipo, p, selAm) {
  if (!p) return '';
  const L = dgLimites(p, tipo);
  const vals = lista.map(am => dgVal(am, p.id));
  const n = lista.length, bw = 52, Lm = 46, B = 70, T = 16, H = 290;
  const W = Math.max(520, Lm + 8 + n * bw);
  const ref = L ? (L.lo == null ? L.hi : isFinite(L.hi) ? L.hi * 1.2 : L.lo * 1.6) : 0;
  const max = Math.max(ref, ...vals.filter(v => v != null), 0.0001) * 1.1;
  const y = v => T + (H - T - B) * (1 - Math.max(0, v) / max);
  let h = '';
  if (L) {
    const lo = L.lo == null ? 0 : L.lo, hi = isFinite(L.hi) ? Math.min(L.hi, max) : max;
    h += `<rect x="${Lm}" y="${y(hi).toFixed(1)}" width="${W - Lm}" height="${(y(lo) - y(hi)).toFixed(1)}" fill="${DG_TINT.md}"/>`;
    [L.lo, isFinite(L.hi) && L.hi <= max ? L.hi : null].filter(v => v != null).forEach(v =>
      h += `<line x1="${Lm}" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#2f9c4a" stroke-dasharray="4 3"/>
            <text x="${Lm - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#5a6b48">${dgNum(v)}</text>`);
  }
  h += `<line x1="${Lm}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#9ca3af"/>`;
  lista.forEach((am, i) => {
    const v = vals[i], x = Lm + 4 + i * bw, c = dgClass(p, tipo, v);
    const nome = dgRotulo(am); const curto = nome.length > 14 ? nome.slice(0, 13) + '…' : nome;
    h += `<g class="dg-click" onclick="dgSet('am','${am._docId}')"><title>${escHtml(nome)}: ${dgNum(v)} ${escHtml(p.un)} — ${escHtml(c.label)}</title>
      <rect x="${x}" y="${T}" width="${bw}" height="${H - T}" fill="transparent"/>`;
    if (v != null) h += `<rect x="${(x + bw * 0.18).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(1, y(0) - y(v)).toFixed(1)}" rx="3" fill="${DG_COR[c.cls]}" ${am._docId === selAm ? 'stroke="#0b1c0d" stroke-width="2.5"' : ''}/>
      <text x="${x + bw / 2}" y="${(y(v) - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">${dgNum(v)}</text>`;
    else h += `<text x="${x + bw / 2}" y="${y(0) - 6}" text-anchor="middle" font-size="11" fill="#9ca3af">—</text>`;
    h += `<text transform="translate(${x + bw / 2 + 4},${H - B + 12}) rotate(-38)" text-anchor="end" font-size="11" fill="${am._docId === selAm ? '#0b1c0d' : '#5a6b48'}" font-weight="${am._docId === selAm ? 700 : 400}">${escHtml(curto)}</text></g>`;
  });
  return `<div class="dg-scroll"><svg class="dg-cols" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 50 + n * 36)}px" role="img" aria-label="Comparação entre amostras">${h}</svg></div>`;
}

function dgMatriz(lista, tipo, ids, selAm, selNut) {
  const ps = ids.map(id => dgParam(tipo, id)).filter(Boolean);
  let h = `<table class="dg-mx"><thead><tr><th></th>${ps.map(p => `<th class="${p.id === selNut ? 'on' : ''}" title="${escAttr(p.label)} (${escAttr(p.un)})">${escHtml(DG_SIG[p.id] || dgNome(p))}</th>`).join('')}</tr></thead><tbody>`;
  lista.forEach(am => {
    h += `<tr class="${am._docId === selAm ? 'on' : ''}"><th class="r" onclick="dgSet('am','${am._docId}')">${escHtml(dgRotulo(am))}<small>${escHtml(dgSub(am))}</small></th>`;
    ps.forEach(p => {
      const v = dgVal(am, p.id), c = dgClass(p, tipo, v);
      h += `<td style="background:${DG_TINT[c.cls]}" onclick="dgCel('${am._docId}','${p.id}')" title="${escAttr(p.label)}: ${escAttr(dgNum(v))} ${escAttr(p.un)} — ${escAttr(c.label)}">${dgNum(v)}</td>`;
    });
    h += '</tr>';
  });
  return `<div class="dg-scroll">${h}</tbody></table></div>`;
}

function dgDial(p, am) {
  if (!p) return '';
  const v = dgVal(am, p.id), c = dgClass(p, 'solo', v), L = dgLimites(p, 'solo');
  const [mn, mx] = DG_DIAL_FAIXA[p.id] || [0, 100];
  const cx = 120, cy = 112, R = 88;
  const ang = x => Math.PI * (1 - (Math.min(Math.max(x, mn), mx) - mn) / (mx - mn));
  const P = (a, r) => [cx + Math.cos(a) * r, cy - Math.sin(a) * r];
  let h = '';
  dgFaixasCor(t => classificar(p, mn + t * (mx - mn), 'solo').cls, 48).forEach(run => {
    const [x1, y1] = P(ang(mn + run.a * (mx - mn)), R), [x2, y2] = P(ang(mn + run.b * (mx - mn)), R);
    h += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${DG_COR[run.cls]}" stroke-width="20" fill="none"/>`;
  });
  if (v != null) {
    const [nx, ny] = P(ang(v), R - 6);
    h += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#0b1c0d" stroke-width="4" stroke-linecap="round"/>`;
  }
  h += `<circle cx="${cx}" cy="${cy}" r="8" fill="#0b1c0d"/>
    <text x="${cx - R}" y="${cy + 20}" text-anchor="middle" font-size="11" fill="#5a6b48">${dgNum(mn)}</text>
    <text x="${cx + R}" y="${cy + 20}" text-anchor="middle" font-size="11" fill="#5a6b48">${dgNum(mx)}</text>
    <text x="${cx}" y="${cy + 44}" text-anchor="middle" font-size="26" font-weight="800" fill="#1a1a1a">${dgNum(v)}</text>`;
  return `<div class="dg-card"><h3>${escHtml(p.label)}</h3><div class="dg-body">
    <svg class="dg-dial" viewBox="0 0 240 166" role="img" aria-label="${escAttr(p.label)}: ${escAttr(dgNum(v))}">${h}</svg>
    <div class="dg-foot" style="text-align:center"><b style="color:${c.cls === 'ne' ? 'var(--c)' : DG_COR[c.cls]}">${escHtml(c.label)}</b> · ideal ${escHtml(dgFaixaTxt(L, p))}</div>
  </div></div>`;
}

function dgChips(lista, tipo, ids, sel, acao = 'am') {
  return `<div class="dg-chips">${lista.map(am => {
    const n = ids.map(id => dgParam(tipo, id)).filter(Boolean).filter(p => { const c = dgClass(p, tipo, dgVal(am, p.id)).cls; return c !== 'ne' && !dgOk(c); }).length;
    const cor = n >= 5 ? DG_COR.mb : n >= 2 ? DG_COR.bx : DG_COR.md;
    return `<button type="button" class="dg-chip" aria-pressed="${am._docId === sel}" onclick="dgSet('${acao}','${am._docId}')" title="${escAttr(dgSub(am))}">
      ${am.tipo === 'solo' ? '🧪' : '🍃'} ${escHtml(dgRotulo(am))}<span class="b" style="background:${cor}" title="${n} fora da faixa">${n}</span></button>`;
  }).join('')}</div>`;
}

function dgLegenda() {

// Panorama + colunas do nutriente escolhido + mapa — a comparação entre talhões
function dgBlocoComparar(lista, tipo, idsPan, idsMx, selAm, selNut) {
  const ids = [...new Set([...idsPan, ...idsMx])];
  const p = dgParam(tipo, ids.includes(selNut) ? selNut : idsPan[0]);
  return `<div class="dg-g2">
    <div class="dg-card"><h3>Panorama · ${lista.length} amostras</h3><div class="dg-body">${dgPanorama(lista, tipo, idsPan, p.id)}</div></div>
    <div class="dg-card"><h3>Comparar · ${escHtml(dgNome(p))} (${escHtml(p.un)})</h3><div class="dg-body">
      <div class="dg-ncs">${ids.map(id => dgParam(tipo, id)).filter(Boolean).map(q => `<button type="button" aria-pressed="${q.id === p.id}" onclick="dgSet('nut','${q.id}')">${escHtml(DG_SIG[q.id] || dgNome(q))}</button>`).join('')}</div>
      ${dgColunas(lista, tipo, p, selAm)}
    </div></div>
  </div>
  <div class="dg-card"><h3>Mapa das amostras</h3><div class="dg-body">${dgMatriz(lista, tipo, idsMx, selAm, p.id)}
    <div class="dg-foot">Toque numa célula para abrir a amostra e o nutriente.</div></div></div>`;
}

// ━━ Solo × Folha ━━
// Acha a amostra do outro tipo do mesmo talhão (vínculo; senão, mesmo nome). Prefere as marcadas,
// 0–20 cm no solo e a data mais próxima. dg.outro guarda a escolha manual.
function dgCandidatos(am) {
  const outroTipo = am.tipo === 'folha' ? 'solo' : 'folha';
  const mesmo = x => am.talhaoIdVinculado ? x.talhaoIdVinculado === am.talhaoIdVinculado : normalizar(x.nome) === normalizar(am.nome);
  const d0 = dgData(am);
  const dist = x => { const d = dgData(x); return (d && d0) ? Math.abs(new Date(d) - new Date(d0)) : 9e15; };
  return amostras.filter(x => x.tipo === outroTipo && mesmo(x)).sort((a, b) =>
    (diagSelecionadas.has(b.analiseId) - diagSelecionadas.has(a.analiseId)) ||
    ((/^0-20/.test(b.profundidade || '0-20')) - (/^0-20/.test(a.profundidade || '0-20'))) ||
    (dist(a) - dist(b)));
}
function dgPares(amSel) {
  const pares = [], usados = new Set();
  const base = [...amSel.filter(a => a.tipo === 'folha'), ...amSel.filter(a => a.tipo === 'solo')];
  base.forEach(am => {
    if (usados.has(am._docId)) return;
    let outro;
    if (dg.outro[am._docId] !== undefined) outro = amostras.find(x => x._docId === dg.outro[am._docId]) || null;
    else outro = dgCandidatos(am).find(x => !usados.has(x._docId)) || null;
    if (am.tipo === 'solo' && !outro) return; // solo sem folha: já aparece na aba Solo
    usados.add(am._docId); if (outro) usados.add(outro._docId);
    const folha = am.tipo === 'folha' ? am : outro, solo = am.tipo === 'solo' ? am : outro;
    pares.push({key: am._docId, base: am, folha: folha ? dgEnriquecer(folha) : null, solo: solo ? dgEnriquecer(solo) : null});
  });
  // talhões com os dois laudos primeiro
  return pares.sort((a, b) => (!!(b.solo && b.folha)) - (!!(a.solo && a.folha)));
}
function dgCruzar(par) {
  return DG_COMUNS.map(([idS, idF]) => {
    const pS = dgParam('solo', idS), pF = dgParam('folha', idF);
    const vS = dgVal(par.solo, idS), vF = dgVal(par.folha, idF);
    const cS = dgClass(pS, 'solo', vS), cF = dgClass(pF, 'folha', vF);
    const gS = dgGrupo(cS.cls), gF = dgGrupo(cF.cls);
    return {sig: DG_SIG[idF], pS, pF, vS, vF, cS, cF, chave: (gS && gF) ? gS + '-' + gF : null};
  });
}
function dgVistaCruz(amSel) {
  const pares = dgPares(amSel);
  if (!pares.length) return `<div class="diag-sem-sel"><div class="ico">🔗</div><p>Marque uma análise de <strong>folha</strong> (o solo do mesmo talhão é achado sozinho) para cruzar solo × folha.</p></div>`;
  const par = pares.find(p => p.key === dg.par) || pares[0];
  dg.par = par.key;
  const itens = dgCruzar(par);
  const chips = `<div class="dg-chips">${pares.map(p => {
    const prob = dgCruzar(p).filter(i => i.chave && i.chave !== 'o-o').length;
    const semPar = !p.solo || !p.folha;
    const cor = semPar ? '#9ca3af' : prob >= 4 ? DG_COR.mb : prob >= 2 ? DG_COR.bx : DG_COR.md;
    return `<button type="button" class="dg-chip" aria-pressed="${p.key === par.key}" onclick="dgSet('par','${p.key}')">🔗 ${escHtml(dgRotulo(p.base).replace(/ · .*$/, ''))}<span class="b" style="background:${cor}">${semPar ? '?' : prob}</span></button>`;
  }).join('')}</div>`;
  // Seletor da amostra parceira
  const outroTipo = par.base.tipo === 'folha' ? 'solo' : 'folha';
  const cands = dgCandidatos(par.base);
  const ids = new Set(cands.map(c => c._docId));
  const resto = amostras.filter(x => x.tipo === outroTipo && !ids.has(x._docId)).sort((a, b) => dgRotulo(a).localeCompare(dgRotulo(b), 'pt', {numeric:true}));
  const atual = (outroTipo === 'solo' ? par.solo : par.folha)?._docId || '';
  const opt = x => `<option value="${x._docId}" ${x._docId === atual ? 'selected' : ''}>${escHtml(dgRotulo(x))} — ${escHtml(dgSub(x))}</option>`;
  const seletor = `<div class="dg-par">
    <div><span class="dg-tag" style="background:${par.base.tipo === 'folha' ? '#1e5631' : '#5d3a1a'}">${par.base.tipo === 'folha' ? '🍃 Folha' : '🧪 Solo'}</span> <b>${escHtml(dgRotulo(par.base))}</b> <span class="dg-sub">${escHtml(dgSub(par.base))}</span></div>
    <div><span class="dg-tag" style="background:${outroTipo === 'folha' ? '#1e5631' : '#5d3a1a'}">${outroTipo === 'folha' ? '🍃 Folha' : '🧪 Solo'}</span>
      <select onchange="dgSetOutro('${par.key}',this.value)">
        <option value="">— escolher amostra de ${outroTipo} —</option>
        ${cands.length ? `<optgroup label="Mesmo talhão">${cands.map(opt).join('')}</optgroup>` : ''}
        ${resto.length ? `<optgroup label="Outras">${resto.map(opt).join('')}</optgroup>` : ''}
      </select></div>
  </div>`;
  if (!par.solo || !par.folha) {
    return `${chips}${seletor}<div class="diag-sem-sel"><div class="ico">🔍</div><p>Não achei amostra de <strong>${outroTipo}</strong> vinculada a este talhão.<br>Escolha uma no seletor acima.</p></div>${pares.length > 1 ? dgTabelaPares(pares) : ''}`;
  }
  // Quadro 3×3: colunas = solo, linhas = folha
  const col = ['b', 'o', 'a'], lin = ['a', 'o', 'b'];
  const NOME_G = {b:'Baixo', o:'Adequado', a:'Alto'};
  let quad = `<div class="dg-quad"><div class="dg-quad-ylab">FOLHA</div><div class="dg-quad-grid">`;
  lin.forEach(gF => {
    quad += `<div class="dg-quad-rl">${NOME_G[gF]}</div>`;
    col.forEach(gS => {
      const k = gS + '-' + gF, d = DG_DIAG[k];
      const nut = itens.filter(i => i.chave === k);
      quad += `<div class="dg-quad-cel" style="background:${d.cor}${nut.length ? '26' : '0d'};border-color:${d.cor}${nut.length ? '' : '33'}" title="${escAttr(d.d)}">
        <div class="dg-quad-t" style="color:${d.cor}">${escHtml(d.t)}</div>
        <div class="dg-quad-n">${nut.map(i => `<span style="background:${d.cor}">${escHtml(i.sig)}</span>`).join('')}</div>
      </div>`;
    });
  });
  quad += `<div></div>${col.map(g => `<div class="dg-quad-cl">${NOME_G[g]}</div>`).join('')}</div></div><div class="dg-quad-xlab">SOLO</div>`;
  const semDado = itens.filter(i => !i.chave).map(i => i.sig);
  if (semDado.length) quad += `<div class="dg-foot">Sem dado em um dos laudos: ${escHtml(semDado.join(', '))}</div>`;
  // Nutriente a nutriente
  const linhas = itens.map(i => {
    const d = i.chave ? DG_DIAG[i.chave] : null;
    return `<div class="dg-x">
      <div class="dg-x-sig">${escHtml(i.sig)}</div>
      <div class="dg-x-g">${dgGauge(i.pS, 'solo', par.solo, '', '🧪 Solo')}${dgGauge(i.pF, 'folha', par.folha, '', '🍃 Folha')}</div>
      <div class="dg-x-d">${d ? `<span class="dg-tag" style="background:${d.cor}">${escHtml(d.t)}</span><small>${escHtml(d.d)}</small>` : '<small>Sem dado para cruzar.</small>'}</div>
    </div>`;
  }).join('');
  return `${chips}${seletor}${dgSeletorTextura()}
  <div class="dg-g2">
    <div class="dg-card"><h3>Solo × Folha</h3><div class="dg-body">${quad}</div></div>
    <div class="dg-card"><h3>Como ler</h3><div class="dg-body dg-leitura">
      ${Object.values(DG_DIAG).map(d => `<div><span class="dg-tag" style="background:${d.cor}">${escHtml(d.t)}</span> ${escHtml(d.d)}</div>`).join('')}
      <div class="dg-foot">O laudo de folha mostra o que a planta absorveu; o de solo mostra o que está disponível. A leitura cruzada aponta se o problema é falta no solo ou dificuldade de absorção.</div>
    </div></div>
  </div>
  <div class="dg-card"><h3>Nutriente a nutriente · ${escHtml(dgRotulo(par.base).replace(/ · .*$/, ''))}</h3><div class="dg-body">
    <div class="dg-foot">Em cada nutriente: 1ª barra = solo, 2ª = folha.</div>${linhas}</div></div>
  ${pares.length > 1 ? dgTabelaPares(pares) : ''}`;
}
function dgTabelaPares(pares) {
  let h = `<table class="dg-mx dg-mx-x"><thead><tr><th></th>${DG_COMUNS.map(([, f]) => `<th>${DG_SIG[f]}</th>`).join('')}</tr></thead><tbody>`;
  pares.forEach(p => {
    h += `<tr class="${p.key === dg.par ? 'on' : ''}"><th class="r" onclick="dgSet('par','${p.key}')">${escHtml(dgRotulo(p.base).replace(/ · .*$/, ''))}<small>${escHtml(dgSub(p.base))}</small></th>`;
    if (!p.solo || !p.folha) { h += `<td colspan="${DG_COMUNS.length}" style="background:#f3f4f1;color:var(--c);font-family:inherit">sem amostra de ${p.solo ? 'folha' : 'solo'} para cruzar</td></tr>`; return; }
    dgCruzar(p).forEach(i => {
      const d = i.chave ? DG_DIAG[i.chave] : null;
      h += d ? `<td style="background:${d.cor};color:white" onclick="dgSet('par','${p.key}')" title="${escAttr(i.sig)}: ${escAttr(d.t)} — solo ${escAttr(dgNum(i.vS))} (${escAttr(i.cS.label)}), folha ${escAttr(dgNum(i.vF))} (${escAttr(i.cF.label)})">${escHtml(d.c)}</td>`
             : `<td style="background:#eceee9;color:#9ca3af">—</td>`;
    });
    h += '</tr>';
  });
  return `<div class="dg-card"><h3>Comparar talhões · solo × folha</h3><div class="dg-body"><div class="dg-scroll">${h}</tbody></table></div>
    <div class="dg-foot">Cada célula é a leitura cruzada daquele nutriente. Passe o dedo/mouse para ver os valores; toque na linha para abrir o talhão.</div></div></div>`;
}

// ━━ Render principal ━━
function renderDiagnostico() {
  const cont = document.getElementById('content');
  if (diagSelecionadas.size === 0) {
    cont.innerHTML = `<div class="diag-sem-sel">
      <div class="ico">🩺</div>
      <p><strong>Nenhuma análise selecionada.</strong><br><br>
      Volte para <strong>📋 Análises</strong>, marque as análises que deseja incluir no diagnóstico e clique em <strong>🩺 Ver diagnóstico</strong>.<br><br>
      <span style="font-size:.8rem">Dica: marcando só a análise de folha, a aba <strong>🔗 Solo × Folha</strong> acha sozinha o laudo de solo do mesmo talhão.</span></p>
    </div>`;
    return;
  }
  const amSel = amostras.filter(am => diagSelecionadas.has(am.analiseId));
  const folha = dgOrdenar(amSel.filter(am => am.tipo === 'folha').map(dgEnriquecer));
  const solo  = dgOrdenar(amSel.filter(am => am.tipo === 'solo').map(dgEnriquecer));
  if (!folha.length && !solo.length) {
    cont.innerHTML = `<div class="diag-sem-sel"><div class="ico">📭</div><p>As análises selecionadas não possuem amostras cadastradas.</p></div>`;
    return;
  }
  const vistas = [];
  if (folha.length) vistas.push(['folha', `🍃 Folha · ${folha.length}`]);
  if (solo.length)  vistas.push(['solo',  `🧪 Solo · ${solo.length}`]);
  vistas.push(['cruz', '🔗 Solo × Folha']);
  if (!vistas.some(v => v[0] === dg.vista)) dg.vista = vistas[0][0];
  let corpo;
  if (dg.vista === 'folha') corpo = dgVistaFolha(folha);
  else if (dg.vista === 'solo') corpo = dgVistaSolo(solo);
  else corpo = dgVistaCruz(amSel);
  cont.innerHTML = `<div class="dg">
    <div class="dg-tabs" role="tablist">${vistas.map(([id, lab]) => `<button type="button" role="tab" aria-selected="${dg.vista === id}" onclick="dgSet('vista','${id}')">${lab}</button>`).join('')}</div>
    ${dg.vista !== 'cruz' ? dgLegenda() : ''}
    ${corpo}
  </div>`;
}
window.renderDiagnostico = renderDiagnostico;

// Pontes para os onclick inline (estado é do módulo — ver CLAUDE.md)

window.dgCel = function(amId, nutId) { dg.am[dg.vista] = amId; dg.nut[dg.vista] = nutId; renderDiagnostico(); window.scrollTo({top:0, behavior:'smooth'}); };
window.dgSetOutro = function(key, id) { dg.outro[key] = id || null; renderDiagnostico(); };


window.renderComparar = function() {
  const cont = document.getElementById('content');
  if (!amostras.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">📊</div><p><strong>Nada para comparar ainda.</strong><br>
      <span style="font-size:.78rem;">Cadastre análises na aba "Análises" primeiro.</span></p></div>`;
    return;
  }
  // Amostras efetivamente selecionadas (limpar slots órfãos)
  const selecionadas = window.slotsComparar
    .map(id => id ? amostras.find(x => x._docId === id) : null)
    .filter(Boolean);
  // SLOTS como chips compactos horizontais
  const slotsHtml = window.slotsComparar.map((amId, idx) => {
    if (amId) {
      const am = amostras.find(x => x._docId === amId);
      if (!am) return `<button class="slot-chip slot-chip-vazio" type="button" onclick="abrirSeletorAmostra(${idx})">+ ${idx+1}</button>`;
      const an = analises.find(x => x._docId === am.analiseId);
      const fz = an?.fazendaVinculada ? an.fazendaVinculada.split(' ').slice(-1)[0] : '';
      return `<div class="slot-chip slot-chip-cheio ${am.tipo==='solo'?'slot-chip-solo':'slot-chip-folha'}">
        <span class="slot-chip-ico">${am.tipo==='solo'?'🧪':'🍃'}</span>
        <span class="slot-chip-txt">
          <span class="slot-chip-nome">${escHtml(am.nome)}${am.profundidade?' '+escHtml(am.profundidade):''}</span>
          <span class="slot-chip-faz">${escHtml(fz)}</span>
        </span>
        <button type="button" class="slot-chip-x" onclick="event.stopPropagation();removerSlot(${idx})">✕</button>
      </div>`;
    }
    return `<button class="slot-chip slot-chip-vazio" type="button" onclick="abrirSeletorAmostra(${idx})">+ Amostra ${idx+1}</button>`;
  }).join('');
  // Modo (tabela/gráficos) só faz sentido com 2+ selecionadas
  const podeAlternar = selecionadas.length >= 2;
  let html = `<div class="cmp-bar">
    <div class="cmp-bar-slots">${slotsHtml}</div>
    ${podeAlternar ? `<div class="cmp-bar-modos">
      <button type="button" class="cmp-modo-btn ${window.modoComparar==='tabela'?'ativo':''}" onclick="setModoCmp('tabela')">📋 Tabela</button>
      <button type="button" class="cmp-modo-btn ${window.modoComparar==='graficos'?'ativo':''}" onclick="setModoCmp('graficos')">📊 Gráficos</button>
      <button type="button" class="cmp-modo-limpar" onclick="limparSlots()" title="Limpar tudo">🗑</button>
    </div>` : ''}
  </div>`;
  if (selecionadas.length === 0) {
    html += `<div class="vazio" style="padding:40px 18px;"><div class="ico">👆</div><p style="font-size:.88rem;">Toque em <strong>+ Amostra 1</strong> acima para começar.<br>
      <span style="font-size:.74rem;color:var(--c);">Compare de 2 a 4 amostras (solo e/ou folha).</span></p></div>`;
  } else if (selecionadas.length === 1) {
    html += `<div class="vazio" style="padding:30px 18px;"><div class="ico">🤏</div><p style="font-size:.88rem;">Adicione mais 1 amostra para comparar.</p></div>`;
  } else {
    const temSolo = selecionadas.some(a => a.tipo === 'solo');
    const temFolha = selecionadas.some(a => a.tipo === 'folha');
    const misto = temSolo && temFolha;
    if (temSolo) {
      html += `<div class="textura-box">
        <label>Textura:</label>
        <select onchange="window.texturaAtiva=this.value;renderComparar()">
          ${TEXTURAS.map(t => `<option value="${t.id}" ${window.texturaAtiva===t.id?'selected':''}>${t.label}</option>`).join('')}
        </select>
      </div>`;
    }
    if (misto) {
      html += `<div class="cmp-aviso-misto">⚠️ Solo × folha — unidades diferentes; comparamos por status colorido.</div>`;
    }
    if (window.modoComparar === 'tabela') {
      html += renderTabelaCmp(selecionadas, misto);
    } else {
      html += renderGraficosCmp(selecionadas, misto);
    }
  }
  cont.innerHTML = html;
};

// Helpers do comparar (corrigem bugs de re-render)
window.setModoCmp = function(modo) {
  window.modoComparar = modo;
