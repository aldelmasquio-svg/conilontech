<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conilon Tech · Análises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- PDF.js para leitura de laudos Fullin -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window['pdfjsLib']) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
</script>
<style>
:root{--v:#1a5c1a;--ve:#0b1c0d;--vb:#e2f0e2;--c:#5a6b48;--cb:#c6c0b0;--cl:#f0ece3;--t:#1a1a1a;--ts:#4b5563;--danger:#ef4444;--warn:#f59e0b;--ok:#22c55e;--blue:#3b82f6;--s:0 2px 8px rgba(0,0,0,.1);--sf:0 4px 16px rgba(0,0,0,.2);--rad:12px;--rs:8px;--menu-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;display:flex;flex-direction:column;}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9000;}
.loading-spinner{width:48px;height:48px;border:4px solid var(--cb);border-top-color:var(--v);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--v);font-size:1.1rem;letter-spacing:.04em;}

.app-header{background:var(--ve);color:white;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:200;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-titles{line-height:1;}
.header-title-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.02em;}
.header-title-sub{font-size:.65rem;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}
.header-user{font-size:.78rem;color:rgba(255,255,255,.85);}
.btn-menu{background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:40px;height:40px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;}
.menu-overlay.aberto{display:block;}
.menu-lateral{position:fixed;left:0;top:0;bottom:0;width:var(--menu-w);background:var(--ve);z-index:2000;transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.3);}
.menu-lateral.aberto{transform:translateX(0);}
.menu-header{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.menu-user-nome{color:white;font-weight:700;font-size:.95rem;}
.menu-user-email{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:2px;}
.menu-body{flex:1;padding:10px;overflow-y:auto;}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:.9rem;transition:all .2s;margin-bottom:2px;text-decoration:none;}
.menu-item:hover,.menu-item.ativo{background:rgba(255,255,255,.15);color:white;font-weight:700;}
.menu-ico{font-size:1.1rem;}
.menu-footer{padding:14px;}
.btn-logout{width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;border-radius:8px;padding:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

.app-main{display:flex;flex-direction:column;}

/* TABS de visualização (Lista | Comparar) */
.tabs-top{display:flex;background:white;border-bottom:2px solid var(--cb);flex-shrink:0;}
.tab-top{flex:1;padding:13px 8px;border:none;background:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-top.ativa{color:var(--v);border-bottom-color:var(--v);}

/* FILTROS */
.filtros-bar{background:white;border-bottom:1px solid var(--cb);padding:9px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0;position:sticky;top:54px;z-index:199;}
.filtro-grupo{display:flex;align-items:center;gap:6px;}
.filtro-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;text-transform:uppercase;color:var(--c);letter-spacing:.05em;}
.filtro-sel{border:1.5px solid var(--cb);border-radius:7px;padding:6px 9px;font-size:.82rem;font-family:'Barlow',sans-serif;outline:none;background:white;font-weight:600;color:var(--ve);min-width:90px;}
.filtro-sel:focus{border-color:var(--v);}

/* CONTEÚDO */
.content{padding:12px 14px 100px;}
.content > *{margin-bottom:10px;}
.content > *:last-child{margin-bottom:0;}
.an-card{flex-shrink:0;}

/* CARDS DE ANÁLISES (lista) */
.an-card{background:white;border-radius:var(--rad);box-shadow:var(--s);overflow:hidden;border-left:5px solid var(--cb);}
.an-card.solo{border-left-color:#5d3a1a;}
.an-card.folha{border-left-color:#1e5631;}
.an-card-header{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 14px;gap:10px;}
.an-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.0rem;color:var(--ve);display:flex;align-items:center;gap:6px;}
.an-meta{font-size:.74rem;color:var(--c);margin-top:3px;line-height:1.4;}
.an-badge{font-size:.65rem;padding:3px 9px;border-radius:99px;color:white;font-weight:700;letter-spacing:.02em;flex-shrink:0;}
.badge-solo{background:#5d3a1a;}
.badge-folha{background:#1e5631;}
.an-card-amostras{padding:0 14px 11px;font-size:.78rem;color:var(--c);}
.an-card-amostras strong{color:var(--ve);}
.an-card-acoes{display:flex;gap:6px;padding:0 14px 11px;flex-wrap:wrap;}
.btn-acao{background:none;border:1.5px solid var(--cb);border-radius:6px;padding:6px 11px;font-size:.74rem;color:var(--c);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;}
.btn-acao:active{transform:scale(.97);}
.btn-acao.primary{background:var(--v);border-color:var(--v);color:white;}
.btn-acao.danger{border-color:#fca5a5;color:var(--danger);}

/* BOTÃO FAB */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--v);color:white;border:none;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:50;}
.fab:active{transform:scale(.95);}
/* FAB grupo (importar + manual) */
.fab-grupo{position:fixed;bottom:20px;right:20px;z-index:50;display:none;flex-direction:column-reverse;gap:9px;align-items:flex-end;}
.fab-grupo .fab{position:static;width:56px;height:56px;}
.fab-grupo .fab-pdf{width:50px;height:50px;font-size:1.3rem;background:#5d3a1a;}
/* Overlay leitura PDF */
.overlay-pdf{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9500;display:none;align-items:center;justify-content:center;}
.overlay-pdf.aberto{display:flex;}
.overlay-pdf-box{background:white;border-radius:14px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:15px;min-width:240px;box-shadow:var(--sf);}
.overlay-pdf-box .loading-text{color:var(--ve);}

/* MODAL */
.overlay-an{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding-top:30px;}
.overlay-an.aberto{display:flex;}
.modal-an{background:white;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:calc(100dvh - 30px);display:flex;flex-direction:column;box-shadow:var(--sf);overflow:hidden;}
.modal-an-head{padding:14px 16px;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--ve);color:white;}
.modal-an-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:.02em;}
.modal-an-fechar{background:rgba(255,255,255,.12);border:none;color:white;font-size:1.2rem;width:34px;height:34px;border-radius:7px;cursor:pointer;}
.modal-an-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;}
.modal-an-footer{padding:12px 16px;border-top:1px solid var(--cb);background:#fafafa;display:flex;gap:8px;flex-shrink:0;}
.modal-an-footer button{flex:1;}

/* FORMULÁRIO */
.fld{margin-bottom:11px;}
.fld label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.74rem;text-transform:uppercase;color:var(--c);letter-spacing:.04em;margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--cb);border-radius:7px;padding:9px 11px;font-size:.92rem;font-family:'Barlow',sans-serif;outline:none;background:white;color:var(--t);}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--v);}
.fld textarea{resize:vertical;min-height:60px;}
.fld-row{display:flex;gap:8px;}
.fld-row .fld{flex:1;}

.btn-prim{background:var(--v);border:none;color:white;border-radius:8px;padding:11px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;letter-spacing:.02em;}
.btn-sec{background:none;border:1.5px solid var(--cb);color:var(--c);border-radius:8px;padding:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;}

/* AMOSTRAS no formulário */
.amostra-card{background:#fafafa;border:1px solid var(--cb);border-radius:var(--rad);padding:11px;margin-bottom:11px;}
.amostra-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.amostra-card-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);}
.btn-rm-am{background:none;border:1px solid #fca5a5;color:var(--danger);border-radius:6px;padding:4px 9px;font-size:.74rem;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.amostra-grid-base{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}

/* GRUPOS DE PARÂMETROS */
.grp-collapsable{border:1px solid var(--cb);border-radius:8px;margin-bottom:7px;overflow:hidden;background:white;}
.grp-head{background:var(--surface-2);padding:8px 11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;color:var(--ve);text-transform:uppercase;letter-spacing:.04em;}
.grp-head .grp-toggle{font-size:.7rem;color:var(--c);}
.grp-body{padding:9px 11px;display:none;}
.grp-collapsable.aberto .grp-body{display:block;}
.grp-collapsable.aberto .grp-toggle{transform:rotate(180deg);display:inline-block;}
.param-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:.84rem;}
.param-row .param-lab{flex:1;color:var(--t);font-size:.82rem;line-height:1.25;}
.param-row .param-un{font-size:.66rem;color:var(--c);font-family:'DM Mono',monospace;min-width:46px;text-align:right;}
.param-row .param-inp{width:84px;border:1.5px solid var(--cb);border-radius:6px;padding:6px 8px;font-size:.85rem;font-family:'DM Mono',monospace;text-align:right;outline:none;}
.param-row .param-inp:focus{border-color:var(--v);}

/* VINCULAR TALHÃO */
.vinc-talhao{padding:8px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;margin-bottom:9px;font-size:.78rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.vinc-talhao .vinc-lab{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#1e40af;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;}
.vinc-talhao select{flex:1;min-width:140px;border:1.5px solid #93c5fd;border-radius:6px;padding:5px 8px;font-size:.82rem;background:white;}
.vinc-sugest{background:#fef3c7;border-color:#fde68a;}
.vinc-sugest .vinc-lab{color:#92400e;}
.vinc-confirmado{background:#dcfce7;border-color:#86efac;}
.vinc-confirmado .vinc-lab{color:#166534;}

/* VISUALIZAÇÃO COMPLETA */
.detalhe-secao{background:white;border-radius:var(--rad);box-shadow:var(--s);margin-bottom:10px;}
.detalhe-secao-head{padding:10px 13px;border-bottom:1px solid var(--cl);}
.detalhe-secao-tit{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;color:var(--ve);}
.detalhe-secao-sub{font-size:.72rem;color:var(--c);margin-top:2px;}
.detalhe-secao-body{padding:11px 13px;}
.amostra-bloco{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--cl);}
.amostra-bloco:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.amostra-bloco-titulo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.92rem;color:var(--ve);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;}
.amostra-protocolo{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--c);font-weight:600;}

/* TABELA DE PARÂMETROS NA VISUALIZAÇÃO */
.tbl-param{width:100%;font-size:.82rem;border-collapse:collapse;}
.tbl-param tr{border-bottom:1px solid var(--cl);}
.tbl-param tr:last-child{border-bottom:none;}
.tbl-param td{padding:5px 4px;}
.tbl-param .par-lab{color:var(--t);}
.tbl-param .par-val{font-family:'DM Mono',monospace;font-weight:700;text-align:right;white-space:nowrap;}
.tbl-param .par-un{font-size:.68rem;color:var(--c);text-align:right;}
.tbl-param .par-class{text-align:center;padding:3px 6px;border-radius:99px;font-size:.65rem;font-weight:700;color:white;white-space:nowrap;}
.cls-mb{background:#991b1b;}
.cls-bx{background:#dc2626;}
.cls-md{background:#16a34a;}
.cls-at{background:#2563eb;}
.cls-ma{background:#7c3aed;}
.cls-ad{background:#16a34a;}
.cls-ne{background:var(--t4);}
.cls-id{background:#16a34a;}
.cls-fora{background:#f59e0b;}

/* TEXTURA TOGGLE */
.textura-box{background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:5px 9px;margin-bottom:8px;display:flex;align-items:center;gap:7px;font-size:.74rem;flex-wrap:wrap;}
.textura-box label{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:#92400e;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em;}
.textura-box select{border:1.5px solid #fde68a;border-radius:6px;padding:4px 8px;font-size:.82rem;background:white;}

/* VAZIO */
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;color:var(--c);}
.vazio .ico{font-size:3.5rem;margin-bottom:10px;opacity:.4;}
.vazio p{font-size:.92rem;line-height:1.5;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ve);color:white;padding:11px 20px;border-radius:10px;font-size:.85rem;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* COMPARAR (placeholder - Fase B) */
.placeholder-comparar{background:white;border-radius:var(--rad);padding:30px 20px;text-align:center;box-shadow:var(--s);}
.placeholder-comparar .ico{font-size:3rem;margin-bottom:14px;}
.placeholder-comparar p{color:var(--c);font-size:.9rem;line-height:1.5;margin-bottom:14px;}

/* DIAGNÓSTICO */
.diag-sel-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ve);color:white;padding:11px 16px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.25);}
.diag-sel-bar.visivel{display:flex;}
.diag-sel-txt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;}
.diag-sel-acoes{display:flex;gap:8px;}
.btn-diag-ver{background:white;border:none;color:var(--ve);border-radius:7px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.82rem;cursor:pointer;}
.btn-diag-lim{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;border-radius:7px;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;cursor:pointer;}
.an-card-top{display:flex;align-items:stretch;}
.diag-check-wrap{display:flex;align-items:center;justify-content:center;padding:10px 4px 10px 12px;cursor:pointer;flex-shrink:0;}
.diag-check{width:18px;height:18px;cursor:pointer;accent-color:var(--v);}
.an-card-body{flex:1;min-width:0;cursor:pointer;}
.diag-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--rad);background:white;box-shadow:var(--s);margin-bottom:10px;}
.diag-table{border-collapse:collapse;min-width:100%;font-size:.74rem;}
.diag-table th,.diag-table td{padding:5px 6px;border:1px solid var(--cl);text-align:center;white-space:nowrap;}
.diag-table th.col-talhao,.diag-table td.col-talhao{text-align:left;position:sticky;left:0;background:white;z-index:2;min-width:110px;max-width:150px;white-space:normal;font-weight:700;font-size:.72rem;border-right:2px solid var(--cb);}
.diag-table thead th{background:#f0ece3;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ve);position:sticky;top:0;z-index:1;}
.diag-table thead th.col-talhao{z-index:3;}
.diag-cell{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:42px;border-radius:5px;padding:3px 5px;cursor:default;}
.diag-cell-val{font-family:'DM Mono',monospace;font-weight:700;font-size:.76rem;color:white;}
.diag-cell-lbl{font-size:.56rem;color:rgba(255,255,255,.85);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.diag-cell.cls-ne{background:#e5e7eb;}
.diag-cell.cls-ne .diag-cell-val,.diag-cell.cls-ne .diag-cell-lbl{color:var(--c);}
.diag-alertas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
.diag-alerta-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;font-size:.74rem;font-weight:700;font-family:'Barlow Condensed',sans-serif;}
.diag-alerta-chip.critico{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
.diag-alerta-chip.baixo{background:#fef3c7;color:#92400e;border:1px solid #fde68a;}
.diag-alerta-chip.ok{background:#dcfce7;color:#166534;border:1px solid #86efac;}
.diag-secao-hdr{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;color:var(--ve);margin:12px 0 7px;display:flex;align-items:center;gap:7px;}
.diag-badge-tipo{font-size:.65rem;padding:2px 8px;border-radius:99px;color:white;font-weight:700;}
.diag-sem-sel{background:white;border-radius:var(--rad);padding:40px 22px;text-align:center;box-shadow:var(--s);}
.diag-sem-sel .ico{font-size:3rem;margin-bottom:12px;opacity:.4;}
.diag-sem-sel p{color:var(--c);font-size:.9rem;line-height:1.55;}

/* ━━━━━━━━━━ FASE B: COMPARAÇÃO ━━━━━━━━━━ */
/* Botão de Faixas no header */
.btn-faixas-header{background:rgba(255,255,255,.12);border:none;color:white;font-size:18px;width:38px;height:38px;border-radius:8px;cursor:pointer;display:none;align-items:center;justify-content:center;margin-left:8px;}

/* Header compacto da comparação (chips + abas) */
.cmp-bar{background:white;border-radius:var(--rad);padding:8px;box-shadow:var(--s);margin-bottom:10px;position:sticky;top:-1px;z-index:10;}
.cmp-bar-slots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;}
.slot-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;font-size:.74rem;border:1.5px dashed var(--cb);background:#fafafa;color:var(--c);font-family:'Barlow Condensed',sans-serif;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;flex:1;min-height:34px;justify-content:center;}
.slot-chip-vazio:hover{border-color:var(--v);background:var(--vb);color:var(--ve);}
.slot-chip-cheio{border-style:solid;cursor:default;text-transform:none;letter-spacing:0;font-weight:600;padding:5px 8px;justify-content:flex-start;text-align:left;}

  if (isAdmin()) document.getElementById('btnAbrirFaixas').style.display = 'flex';

    talhoes = snap.docs.map(d => ({_docId:d.id, ...d.data()}));

    fazendas = [...set].sort();

function escHtml(s){return String(s||'').replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[ch]));}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n,d){const v=Number(n);if(!isFinite(v))return '—';return v.toLocaleString('pt-BR',{minimumFractionDigits:d!==undefined?d:0,maximumFractionDigits:d!==undefined?d:2});}
function parseDose(s){if(s==null||s==='')return null;const limpo=String(s).replace(/\s/g,'').replace(',','.');const n=parseFloat(limpo);return isNaN(n)?null:n;}
function formatarData(d){if(!d)return'—';const[a,m,dd]=d.split('-');return `${dd}/${m}/${a}`;}
function hoje(){return new Date().toISOString().slice(0,10);}
function toast(msg,dur=3000){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function normalizar(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();}

// ━━━━━━━━━━ CLASSIFICAÇÃO (avalia parâmetro contra faixa) ━━━━━━━━━━
// Retorna a faixa "efetiva" — custom (se existir) ou default do catálogo
function faixaEfetiva(parametro, tipo) {
  const custom = window.faixasCustom?.[tipo]?.[parametro.id];
  if (parametro.faixaTextura) {
    // Mesclar: custom sobrescreve por textura
    const out = {};
    for (const t of ['arenoso','medio','argiloso']) {
      out[t] = (custom && custom[t]) ? custom[t] : parametro.faixaTextura[t];
    }
    return {tipo:'textura', faixa:out};
  }
  if (parametro.faixaIdeal) {
    return {tipo:'ideal', faixa: (custom && custom.ideal !== undefined) ? {ideal:custom.ideal} : parametro.faixaIdeal};
  }
  if (parametro.faixa) {
    return {tipo:'simples', faixa: custom ? {...parametro.faixa, ...custom} : parametro.faixa};
  }
  if (parametro.faixaEspecial === 'ph') {
    return {tipo:'ph'};
  }
  return null;
}

// Retorna { cls: 'mb'|'bx'|'md'|'at'|'ma'|'ne', label: 'Muito baixo'/'Bom'/...}
function classificar(parametro, valor, tipo, textura) {
  if (valor == null || !isFinite(valor)) return {cls:'ne', label:'—'};
  // pH especial (solo)
  if (parametro.faixaEspecial === 'ph') {
    if (valor < 5.0) return {cls:'mb', label:'Muito ácido'};
    if (valor < 5.5) return {cls:'bx', label:'Ácido'};
    if (valor < 6.0) return {cls:'md', label:'Acidez fraca'};
    if (valor <= 6.9) return {cls:'md', label:'Bom'};
    if (valor < 7.5) return {cls:'at', label:'Alcalino fraco'};
    return {cls:'ma', label:'Alcalino'};
  }
  const ef = faixaEfetiva(parametro, tipo);
  if (!ef) return {cls:'ne', label:'—'};
  // Faixa que varia por textura (P-Mehlich)
  let faixa;
  if (ef.tipo === 'textura') {
    faixa = ef.faixa[textura || 'medio'];
  } else if (ef.tipo === 'ideal') {
    const ideal = ef.faixa.ideal;
    if (!ideal) return {cls:'ne', label:'—'};
    const desvio = Math.abs(valor - ideal) / ideal;
    if (desvio <= 0.15) return {cls:'id', label:'Ideal'};
    if (desvio <= 0.40) return {cls:'fora', label:valor>ideal?'Acima':'Abaixo'};
    return {cls:'bx', label:valor>ideal?'Muito alto':'Muito baixo'};
  } else {
    faixa = ef.faixa;
  }
  // Folha 5 níveis (quando muitoBaixo definido via customização)
  if (tipo === 'folha' && faixa && faixa.muitoBaixo !== undefined) {
    if (valor < faixa.muitoBaixo) return {cls:'mb', label:'Muito baixo'};
    if (valor < faixa.baixo)      return {cls:'bx', label:'Baixo'};
    if (valor < faixa.alto)       return {cls:'ad', label:'Adequado'};
    if (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto) && valor < faixa.muitoAlto) return {cls:'at', label:'Alto'};
    return (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto)) ? {cls:'ma', label:'Muito alto'} : {cls:'at', label:'Alto'};
  }
  // Folha 3 níveis (padrão), com muitoAlto opcional
  if (tipo === 'folha' && faixa && faixa.baixo !== undefined && faixa.muitoBaixo === undefined) {
    if (valor < faixa.baixo) return {cls:'bx', label:'Baixo'};
    if (valor <= faixa.alto) return {cls:'ad', label:'Adequado'};
    if (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto) && valor < faixa.muitoAlto) return {cls:'at', label:'Alto'};
    return (faixa.muitoAlto !== undefined && isFinite(faixa.muitoAlto)) ? {cls:'ma', label:'Muito alto'} : {cls:'at', label:'Alto'};
  }
  // Faixa padrão (solo): muito baixo/baixo/médio/alto/muito alto
  if (!faixa) return {cls:'ne', label:'—'};
  const inv = parametro.inverter;
  if (valor < faixa.muitoBaixo) return inv ? {cls:'md', label:'Bom'} : {cls:'mb', label:'Muito baixo'};
  if (valor < faixa.baixo)      return inv ? {cls:'md', label:'Bom'} : {cls:'bx', label:'Baixo'};
  if (valor < faixa.alto)       return {cls:'md', label:'Médio/Bom'};
  if (valor < faixa.muitoAlto)  return inv ? {cls:'bx', label:'Alto'} : {cls:'at', label:'Alto'};
  return inv ? {cls:'mb', label:'Muito alto'} : {cls:'ma', label:'Muito alto'};
}

window.renderLista = function() {
  const cont = document.getElementById('content');
  if (tabAtual !== 'lista') return;
  if (!analises.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🔬</div><p>Nenhuma análise cadastrada ainda.<br><span style="font-size:.78rem;">Toque no botão + para criar a primeira análise.</span></p></div>`;
    return;
  }
  const tipoFil = document.getElementById('filTipo')?.value || '';
  const fazFil = document.getElementById('filFazenda')?.value || '';
  let lista = [...analises];
  if (tipoFil) lista = lista.filter(a => a.tipo === tipoFil);
  if (fazFil) lista = lista.filter(a => a.fazendaVinculada === fazFil);
  lista.sort((a,b) => (b.dataLaudo||b.dataEntrada||'').localeCompare(a.dataLaudo||a.dataEntrada||''));
  if (!lista.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">🔍</div><p>Nenhuma análise encontrada com esses filtros.</p></div>`;
    return;
  }
  // Build groups: by fazenda (when "Todas") then by year/safra within each group
  const byFaz = new Map();
  for (const a of lista) {
    const faz = a.fazendaVinculada || a.propriedade || '—';
    if (!byFaz.has(faz)) byFaz.set(faz, []);
    byFaz.get(faz).push(a);
  }
  const fazendas = [...byFaz.keys()].sort((a, b) => a.localeCompare(b, 'pt'));
  const showFazHeader = !fazFil;
  let html = '';
  for (const faz of fazendas) {
    const fazItens = byFaz.get(faz);
    const byAno = new Map();
    for (const a of fazItens) {
      const data = a.dataLaudo || a.dataEntrada || '';
      const ano = data ? data.substring(0, 4) : '—';
      if (!byAno.has(ano)) byAno.set(ano, []);
      byAno.get(ano).push(a);
    }
    const anos = [...byAno.keys()].sort((a, b) => b.localeCompare(a));
    html += `<div class="lista-faz-grupo">`;
    if (showFazHeader) html += `<div class="lista-faz-header">🏡 ${escHtml(faz)}</div>`;
    for (const ano of anos) {
      html += `<div class="lista-safra-header">📅 Safra ${escHtml(ano)}</div>`;
      html += byAno.get(ano).map(renderAnCard).join('');
    }
    html += `</div>`;
  }
  cont.innerHTML = html;
};

function renderDiagSecao(amos, tipo) {
  const params = PARAMS[tipo].filter(p => p.destaque && !p.faixaIdeal);
  const textura = window.texturaAtiva || 'medio';
  const ABREV = {
    'Nitrogênio (N)':'N','Fósforo (P)':'P','Potássio (K)':'K','Cálcio (Ca)':'Ca','Magnésio (Mg)':'Mg','Enxofre (S)':'S',
    'Ferro (Fe)':'Fe','Zinco (Zn)':'Zn','Cobre (Cu)':'Cu','Manganês (Mn)':'Mn','Boro (B)':'B',
    'Fósforo (Mehlich-1)':'P','Potássio':'K','Enxofre':'S','Cálcio':'Ca','Magnésio':'Mg',
    'Matéria orgânica':'MO','pH em H₂O':'pH','Ferro':'Fe','Zinco':'Zn','Cobre':'Cu','Manganês':'Mn','Boro':'B',
    'Saturação de bases (V)':'V%','Saturação de Alumínio (m)':'m%'
  };
  const BG = {mb:'#991b1b',bx:'#dc2626',md:'#16a34a',ad:'#16a34a',at:'#2563eb',ma:'#7c3aed',id:'#16a34a',fora:'#f59e0b',ne:'#e5e7eb'};

  const linhas = amos.map(am => {
    const an = analises.find(a => a._docId === am.analiseId);
    const tal = am.talhaoIdVinculado ? talhoes.find(t => t.id === am.talhaoIdVinculado) : null;
    const rotulo = tal ? (tal.nome || tal.id) : am.nome || '—';
    const fazenda = an?.fazendaVinculada || '';
    const cells = params.map(p => {
      const val = am.parametros?.[p.id];
      if (val == null) return {cls:'ne', val:null, label:'—', param:p};
      const c = classificar(p, val, tipo, textura);
      return {cls:c.cls, val, label:c.label, param:p};
    });
    return {rotulo, fazenda, cells};
  });

  // Alertas por nutriente
  const alertas = params.map((p, ci) => {
    const def = linhas.filter(l => ['mb','bx'].includes(l.cells[ci].cls));
    if (!def.length) return null;
    const crit = def.some(l => l.cells[ci].cls === 'mb');
    const abrev = ABREV[p.label] || p.label.replace(/\s*\(.*\)/,'');
    return {abrev, n:def.length, total:linhas.length, crit};
  }).filter(Boolean).sort((a,b) => b.n - a.n);

  const ico = tipo==='folha' ? '🍃' : '🧪';
  const corBadge = tipo==='folha' ? '#1e5631' : '#5d3a1a';
  const titulo = tipo==='folha' ? 'Análise Foliar' : 'Análise de Solo';

  let html = `<div class="diag-secao-hdr">${ico} ${titulo}
    <span class="diag-badge-tipo" style="background:${corBadge};">${amos.length} amostra${amos.length>1?'s':''}</span>
  </div>`;

  if (tipo === 'solo') {
    html += `<div class="textura-box" style="margin-bottom:8px;">
      <label>Textura do solo (afeta P-Mehlich):</label>
      <select onchange="window.texturaAtiva=this.value;renderDiagnostico()">
        ${TEXTURAS.map(t => `<option value="${t.id}" ${window.texturaAtiva===t.id?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>`;
  }

  html += `<div class="diag-alertas">`;
  if (alertas.length) {
    alertas.forEach(al => {
      const cls = al.crit ? 'critico' : 'baixo';
      const dot = al.crit ? '🔴' : '🟡';
      html += `<div class="diag-alerta-chip ${cls}">${dot} ${escHtml(al.abrev)} — ${al.n}/${al.total}</div>`;
    });
  } else {
    html += `<div class="diag-alerta-chip ok">✅ Sem deficiências nas amostras selecionadas</div>`;
  }
  html += `</div>`;

  // Cabeçalho da tabela
  const colHeaders = params.map(p => {
    const abrev = ABREV[p.label] || p.label.replace(/\s*\(.*\)/,'');
    return `<th title="${escAttr(p.label)} (${escAttr(p.un)})">${escHtml(abrev)}<br><span style="font-size:.56rem;font-weight:500;opacity:.65;">${escHtml(p.un)}</span></th>`;
  }).join('');

  const rows = linhas.map(l => {
    const cels = l.cells.map(c => {
      const bg = BG[c.cls] || '#9ca3af';
      const valFmt = c.val != null
        ? (c.val < 10 ? c.val.toLocaleString('pt-BR',{maximumFractionDigits:2})
          : c.val < 100 ? c.val.toLocaleString('pt-BR',{maximumFractionDigits:1})
          : Math.round(c.val).toLocaleString('pt-BR'))
        : '—';
      const titleAttr = c.val != null ? `title="${escAttr(c.param.label)}: ${c.val} ${escAttr(c.param.un)} — ${escAttr(c.label)}"` : '';
      const textColor = c.cls === 'ne' ? 'color:var(--c);' : 'color:white;';
      return `<td><div class="diag-cell cls-${c.cls}" style="background:${bg};" ${titleAttr}>
        <span class="diag-cell-val" style="${textColor}">${valFmt}</span>
        <span class="diag-cell-lbl" style="${c.cls==='ne'?'color:var(--c);':''}">${escHtml(c.label)}</span>
      </div></td>`;
    }).join('');
    return `<tr>
      <td class="col-talhao">${escHtml(l.rotulo)}${l.fazenda?`<br><span style="font-size:.63rem;color:var(--c);font-weight:600;">${escHtml(l.fazenda)}</span>`:''}</td>
      ${cels}
    </tr>`;
  }).join('');

  html += `<div class="diag-wrap"><table class="diag-table">
    <thead><tr><th class="col-talhao">Talhão / Amostra</th>${colHeaders}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  return html;
}

window.renderComparar = function() {
  const cont = document.getElementById('content');
  if (!amostras.length) {
    cont.innerHTML = `<div class="vazio"><div class="ico">📊</div><p><strong>Nada para comparar ainda.</strong><br>
      <span style="font-size:.78rem;">Cadastre análises na aba "Análises" primeiro.</span></p></div>`;
    return;
  }
  // Amostras efetivamente selecionadas (limpar slots órfãos)
  const selecionadas = window.slotsComparar
    .map(id => id ? amostras.find(x => x._docId === id) : null)
    .filter(Boolean);
  // SLOTS como chips compactos horizontais
  const slotsHtml = window.slotsComparar.map((amId, idx) => {
    if (amId) {
      const am = amostras.find(x => x._docId === amId);
      if (!am) return `<button class="slot-chip slot-chip-vazio" type="button" onclick="abrirSeletorAmostra(${idx})">+ ${idx+1}</button>`;
      const an = analises.find(x => x._docId === am.analiseId);
      const fz = an?.fazendaVinculada ? an.fazendaVinculada.split(' ').slice(-1)[0] : '';
      return `<div class="slot-chip slot-chip-cheio ${am.tipo==='solo'?'slot-chip-solo':'slot-chip-folha'}">
        <span class="slot-chip-ico">${am.tipo==='solo'?'🧪':'🍃'}</span>
        <span class="slot-chip-txt">
          <span class="slot-chip-nome">${escHtml(am.nome)}${am.profundidade?' '+escHtml(am.profundidade):''}</span>
          <span class="slot-chip-faz">${escHtml(fz)}</span>
        </span>
        <button type="button" class="slot-chip-x" onclick="event.stopPropagation();removerSlot(${idx})">✕</button>
      </div>`;
    }
    return `<button class="slot-chip slot-chip-vazio" type="button" onclick="abrirSeletorAmostra(${idx})">+ Amostra ${idx+1}</button>`;
  }).join('');
  // Modo (tabela/gráficos) só faz sentido com 2+ selecionadas
  const podeAlternar = selecionadas.length >= 2;
  let html = `<div class="cmp-bar">
    <div class="cmp-bar-slots">${slotsHtml}</div>
    ${podeAlternar ? `<div class="cmp-bar-modos">
      <button type="button" class="cmp-modo-btn ${window.modoComparar==='tabela'?'ativo':''}" onclick="setModoCmp('tabela')">📋 Tabela</button>
      <button type="button" class="cmp-modo-btn ${window.modoComparar==='graficos'?'ativo':''}" onclick="setModoCmp('graficos')">📊 Gráficos</button>
      <button type="button" class="cmp-modo-limpar" onclick="limparSlots()" title="Limpar tudo">🗑</button>
    </div>` : ''}
  </div>`;
  if (selecionadas.length === 0) {
    html += `<div class="vazio" style="padding:40px 18px;"><div class="ico">👆</div><p style="font-size:.88rem;">Toque em <strong>+ Amostra 1</strong> acima para começar.<br>
      <span style="font-size:.74rem;color:var(--c);">Compare de 2 a 4 amostras (solo e/ou folha).</span></p></div>`;
  } else if (selecionadas.length === 1) {
    html += `<div class="vazio" style="padding:30px 18px;"><div class="ico">🤏</div><p style="font-size:.88rem;">Adicione mais 1 amostra para comparar.</p></div>`;
  } else {
    const temSolo = selecionadas.some(a => a.tipo === 'solo');
    const temFolha = selecionadas.some(a => a.tipo === 'folha');
    const misto = temSolo && temFolha;
    if (temSolo) {
      html += `<div class="textura-box">
        <label>Textura:</label>
        <select onchange="window.texturaAtiva=this.value;renderComparar()">
          ${TEXTURAS.map(t => `<option value="${t.id}" ${window.texturaAtiva===t.id?'selected':''}>${t.label}</option>`).join('')}
        </select>
      </div>`;
    }
    if (misto) {
      html += `<div class="cmp-aviso-misto">⚠️ Solo × folha — unidades diferentes; comparamos por status colorido.</div>`;
    }
    if (window.modoComparar === 'tabela') {
      html += renderTabelaCmp(selecionadas, misto);
    } else {
      html += renderGraficosCmp(selecionadas, misto);
    }
  }
  cont.innerHTML = html;
};

// ━━━ TABELA COMPARATIVA ━━━
function renderTabelaCmp(selecionadas, misto) {
  // Pega TODOS os parâmetros que aparecem em pelo menos uma amostra
  // Organiza em grupos: Comuns / Só solo / Só folha
  const ehSolo = a => a.tipo === 'solo';
  const ehFolha = a => a.tipo === 'folha';
  const selSolo = selecionadas.filter(ehSolo);
  const selFolha = selecionadas.filter(ehFolha);
  // Mapeamento de parâmetros comuns entre solo e folha (mesma "natureza")
  // ID solo => ID folha
  const COMUNS = {
    p_mehlich:'p', potassio:'k', calcio:'ca', magnesio:'mg', enxofre:'s',
    ferro:'fe', zinco:'zn', cobre:'cu', manganes:'mn', boro:'b', sodio:null,
    rel_ca_mg:'rel_ca_mg_f'
  };
  // Lista de seções pra mostrar
  let html = '<div class="cmp-tbl-wrap">';
  if (misto && selSolo.length && selFolha.length) {
    // Mostra primeiro os comuns lado a lado (solo X folha)
    html += `<table class="cmp-tbl"><thead><tr>
      <th>Nutriente</th>
      ${selecionadas.map(a => `<th class="cmp-th">
        <div class="cmp-th-tipo">${a.tipo==='solo'?'🧪 Solo':'🍃 Folha'}</div>
        <div class="cmp-th-nome">${escHtml(a.nome)}${a.profundidade?' ('+escHtml(a.profundidade)+')':''}</div>
      </th>`).join('')}
    </tr></thead><tbody>`;
    // Linhas comuns
    html += `<tr class="cmp-tit-secao"><td colspan="${selecionadas.length+1}">Nutrientes comuns (solo + folha)</td></tr>`;
    for (const [paramIdSolo, paramIdFolha] of Object.entries(COMUNS)) {
      if (!paramIdFolha) continue;  // pula os que não tem em folha
      const paramSolo = PARAM_SOLO.find(p => p.id === paramIdSolo);
      const paramFolha = PARAM_FOLHA.find(p => p.id === paramIdFolha);
      if (!paramSolo || !paramFolha) continue;
      const nomeNutri = paramFolha.label.replace(/ \([^)]+\)/, '');
      html += `<tr>
        <td class="cmp-lab">${escHtml(nomeNutri)}</td>
        ${selecionadas.map(a => {
          const param = a.tipo === 'solo' ? paramSolo : paramFolha;
          const val = a.parametros?.[param.id];
          return renderCelulaCmp(val, param, a.tipo);
        }).join('')}
      </tr>`;
    }
    html += `</tbody></table>`;
    // Tabelas separadas pra "só solo" e "só folha"
    if (selSolo.length) {
      html += renderTabelaTipo(selSolo, 'solo', selecionadas);
    }
    if (selFolha.length) {
      html += renderTabelaTipo(selFolha, 'folha', selecionadas);
    }
  } else {
    // Mesmo tipo — tabela única com todos os parâmetros agrupados
    const tipo = selecionadas[0].tipo;
    html += renderTabelaTipo(selecionadas, tipo, selecionadas);
  }
  html += '</div>';
  return html;
}

// Renderiza uma tabela só pra um tipo (solo ou folha) com todos os parâmetros agrupados
function renderTabelaTipo(amostrasTipo, tipo, todasSelecionadas) {
  const params = PARAMS[tipo];
  const grupos = {};
  params.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });
  let html = `<table class="cmp-tbl"><thead><tr>
    <th>${tipo==='solo'?'🧪 Solo':'🍃 Folha'}</th>
    ${todasSelecionadas.map(a => {
      // Quando a amostra é do tipo da tabela, mostra; se não é, célula vazia
      if (a.tipo !== tipo) return `<th class="cmp-th cmp-th-vazia">—</th>`;
      return `<th class="cmp-th">
        <div class="cmp-th-nome">${escHtml(a.nome)}${a.profundidade?' ('+escHtml(a.profundidade)+')':''}</div>
        <div class="cmp-th-tipo" style="font-size:.65rem;color:var(--c);">${formatarData(analises.find(x=>x._docId===a.analiseId)?.dataLaudo)}</div>
      </th>`;
    }).join('')}
  </tr></thead><tbody>`;
  Object.entries(grupos).forEach(([nomeGrupo, paramsGrupo]) => {
    html += `<tr class="cmp-tit-secao"><td colspan="${todasSelecionadas.length+1}">${escHtml(nomeGrupo)}</td></tr>`;
    paramsGrupo.forEach(p => {
      html += `<tr>
        <td class="cmp-lab">${escHtml(p.label)} <span class="cmp-un">${escHtml(p.un)}</span></td>
        ${todasSelecionadas.map(a => {
          if (a.tipo !== tipo) return `<td class="cmp-cel-vazia">—</td>`;
          const val = a.parametros?.[p.id];
          return renderCelulaCmp(val, p, tipo);
        }).join('')}
      </tr>`;
    });
  });
  html += `</tbody></table>`;
  return html;

function renderCelulaCmp(val, param, tipo) {

// ━━━ GRÁFICOS COMPARATIVOS ━━━
function renderGraficosCmp(selecionadas, misto) {
  const ehSolo = a => a.tipo === 'solo';
  const ehFolha = a => a.tipo === 'folha';
  const selSolo = selecionadas.filter(ehSolo);
  const selFolha = selecionadas.filter(ehFolha);
  let html = '';
  // Se misto, mostra os comuns no topo (dupla barra solo + folha)
  const COMUNS = {
    p_mehlich:'p', potassio:'k', calcio:'ca', magnesio:'mg', enxofre:'s',
    ferro:'fe', zinco:'zn', cobre:'cu', manganes:'mn', boro:'b'
  };
  if (misto) {
    html += `<div class="grafico-grupo">
      <div class="grafico-grupo-tit">🔗 Nutrientes comuns (solo × folha)</div>
      <div class="grafico-grupo-sub">Comparação por classificação — solo e folha em barras separadas</div>`;
    for (const [idSolo, idFolha] of Object.entries(COMUNS)) {
      const pSolo = PARAM_SOLO.find(p => p.id === idSolo);
      const pFolha = PARAM_FOLHA.find(p => p.id === idFolha);
      if (!pSolo || !pFolha) continue;
      html += renderGraficoMisto(selecionadas, pSolo, pFolha);
    }
    html += `</div>`;
  }
  // Gráficos por tipo (só solo / só folha)
  if (selSolo.length) {
    html += `<div class="grafico-grupo">
      <div class="grafico-grupo-tit">🧪 Solo</div>`;
    PARAM_SOLO.forEach(p => {
      html += renderGraficoParam(selSolo, p, 'solo', selecionadas);
    });
    html += `</div>`;
  }
  if (selFolha.length) {
    html += `<div class="grafico-grupo">
      <div class="grafico-grupo-tit">🍃 Folha</div>`;
    PARAM_FOLHA.forEach(p => {
      html += renderGraficoParam(selFolha, p, 'folha', selecionadas);
    });
    html += `</div>`;
  }
  return html;
}

// Renderiza UM gráfico horizontal pra um parâmetro com várias amostras
// Gera segmentos SIMPLIFICADOS de 3 cores (baixo/bom/alto) a partir da faixa efetiva
// Retorna {segmentos:[{ate,cor,lab}], maxEscala}
function gerarSegmentos3(param, tipo, valores) {
  const ef = faixaEfetiva(param, tipo);
  const COR_BAIXO = '#dc2626', COR_BOM = '#16a34a', COR_ALTO = '#2563eb';
  if (!ef) return null;
  // pH especial
  if (ef.tipo === 'ph') {
    return {
      maxEscala: 8.0,
      segmentos: [
        {ate:6.0, cor:COR_BAIXO, lab:'Ácido'},
        {ate:6.9, cor:COR_BOM,   lab:'Bom (6,0-6,9)'},
        {ate:8.0, cor:COR_ALTO,  lab:'Alcalino'}
      ]
    };
  }
  // Faixa ideal (relações)
  if (ef.tipo === 'ideal') {
    const ideal = ef.faixa.ideal;
    const baixoLim = ideal * 0.85;
    const altoLim = ideal * 1.15;
    const max = Math.max(ideal * 1.6, ...valores) * 1.1;
    return {
      maxEscala: max,
      segmentos: [
        {ate:baixoLim, cor:COR_BAIXO, lab:'Abaixo do ideal'},
        {ate:altoLim,  cor:COR_BOM,   lab:`Ideal (~${fmt(ideal, ideal<1?2:1)})`},
        {ate:max,      cor:COR_ALTO,  lab:'Acima do ideal'}
      ]
    };
  }
  // Faixa por textura (P-Mehlich)
  let faixa;
  if (ef.tipo === 'textura') {
    faixa = ef.faixa[window.texturaAtiva || 'medio'];
  } else if (ef.tipo === 'simples') {
    faixa = ef.faixa;
  }
  if (!faixa) return null;
  const inv = param.inverter;
  // Folha: baixo/adequado/alto
  if (tipo === 'folha' && faixa.baixo !== undefined && faixa.muitoBaixo === undefined) {
    const max = Math.max(faixa.alto * 1.5, ...valores) * 1.05;
    return {
      maxEscala: max,
      segmentos: [
        {ate:faixa.baixo, cor:COR_BAIXO, lab:'Baixo'},
        {ate:faixa.alto,  cor:COR_BOM,   lab:'Adequado'},
        {ate:max,         cor:COR_ALTO,  lab:'Alto'}
      ]
    };
  }
  // Solo: simplificar p 3 segmentos (baixo / bom / alto)
  // "baixo" = abaixo do faixa.baixo
  // "bom" = entre faixa.baixo e faixa.alto
  // "alto" = acima do faixa.alto
  const limBaixo = faixa.baixo;
  const limAlto = isFinite(faixa.alto) ? faixa.alto : Math.max(faixa.baixo * 3, ...valores);
  const max = Math.max(limAlto * 1.3, ...valores) * 1.05;
  return {
    maxEscala: max,
    segmentos: [
      {ate:limBaixo, cor: inv ? COR_BOM : COR_BAIXO, lab: inv ? 'Bom (baixo)' : 'Baixo'},
      {ate:limAlto,  cor: COR_BOM,                   lab: 'Médio/Bom'},
      {ate:max,      cor: inv ? COR_BAIXO : COR_ALTO, lab: inv ? 'Alto (ruim)' : 'Alto'}
    ]
  };
}

function renderGraficoParam(amostrasTipo, param, tipo, todasSelecionadas) {
  const temValor = amostrasTipo.some(a => a.parametros?.[param.id] !== undefined && a.parametros?.[param.id] !== null);
  if (!temValor) return '';
  const valores = amostrasTipo.map(a => a.parametros?.[param.id]).filter(v => v != null && isFinite(v));
  const seg = gerarSegmentos3(param, tipo, valores);
  if (!seg) {
    // Sem faixa definida — só mostra os valores numéricos
    const cores = ['#1e3a5f', '#8b6914', '#722f37'];
    const idxCor = {};
    (todasSelecionadas || amostrasTipo).forEach((a,i) => { idxCor[a._docId] = cores[i % cores.length]; });
    const lst = amostrasTipo.map(a => {
      const v = a.parametros?.[param.id];
      if (v == null) return '';
      return `<div class="cmp-val-item">
        <span class="cmp-val-dot" style="background:${idxCor[a._docId]};"></span>
        <span class="cmp-val-nome">${escHtml(a.nome)}${a.profundidade?' ('+escHtml(a.profundidade)+')':''}</span>
        <span class="cmp-val-num">${fmt(v, v<10?2:(v<100?1:0))} ${escHtml(param.un)}</span>
      </div>`;
    }).join('');
    return `<div class="grafico-param">
      <div class="grafico-param-head">
        <div class="grafico-param-nome">${escHtml(param.label)}</div>
        <div class="grafico-param-un">${escHtml(param.un)}</div>
      </div>
      <div class="grafico-valores">${lst}</div>
    </div>`;
  }
  const {segmentos, maxEscala} = seg;
  // Renderizar 3 segmentos
  let anterior = 0;
  const segBg = segmentos.map(s => {
    const inicio = (anterior / maxEscala) * 100;
    const fim = Math.min(100, (s.ate / maxEscala) * 100);
    anterior = s.ate;
    return `<div class="seg-faixa" style="left:${inicio}%;width:${fim-inicio}%;background:${s.cor};" title="${escAttr(s.lab)} (até ${fmt(s.ate, s.ate<10?2:0)})"></div>`;
  }).join('');
  // Marcadores (paleta consistente entre slots)
  const cores = ['#1e3a5f', '#8b6914', '#722f37'];
  const idxCor = {};
  (todasSelecionadas || amostrasTipo).forEach((a,i) => { idxCor[a._docId] = cores[i % cores.length]; });
  const marcadores = amostrasTipo.map(a => {
    const v = a.parametros?.[param.id];
    if (v == null || !isFinite(v)) return '';
    const pos = Math.min(99, (v / maxEscala) * 100);
    return `<div class="seg-marker" style="left:${pos}%;background:${idxCor[a._docId]};" title="${escAttr(a.nome+': '+v+' '+param.un)}">
      <div class="seg-marker-val">${fmt(v, v < 10 ? 2 : (v < 100 ? 1 : 0))}</div>
    </div>`;
  }).join('');
  // Legenda dos pontos
  const legendaValores = amostrasTipo.map(a => {
    const v = a.parametros?.[param.id];
    if (v == null) return '';
    const c = classificar(param, v, tipo, window.texturaAtiva);
    return `<div class="cmp-val-item">
      <span class="cmp-val-dot" style="background:${idxCor[a._docId]};"></span>
      <span class="cmp-val-nome">${escHtml(a.nome)}${a.profundidade?' ('+escHtml(a.profundidade)+')':''}</span>
      <span class="cmp-val-num">${fmt(v, v<10?2:(v<100?1:0))} ${escHtml(param.un)}</span>
      <span class="cmp-val-cls cls-${c.cls}">${escHtml(c.label)}</span>
    </div>`;
  }).join('');
  // Legenda das 3 zonas (com cor + label)
  const legendaZonas = segmentos.map(s =>
    `<span class="zona-leg"><span class="zona-leg-cor" style="background:${s.cor};"></span>${escHtml(s.lab)}</span>`
  ).join('');
  return `<div class="grafico-param">
    <div class="grafico-param-head">
      <div class="grafico-param-nome">${escHtml(param.label)}</div>
      <div class="grafico-param-un">${escHtml(param.un)}</div>
    </div>
    <div class="grafico-bar">
      ${segBg}
      ${marcadores}
    </div>
    <div class="zonas-leg">${legendaZonas}</div>
    <div class="grafico-valores">${legendaValores}</div>
  </div>`;
}

// Gráfico misto solo+folha (só pra parâmetros comuns)
function renderGraficoMisto(selecionadas, paramSolo, paramFolha) {
  const selSolo = selecionadas.filter(a => a.tipo === 'solo');
  const selFolha = selecionadas.filter(a => a.tipo === 'folha');
  const temSolo = selSolo.some(a => a.parametros?.[paramSolo.id] != null);
  const temFolha = selFolha.some(a => a.parametros?.[paramFolha.id] != null);
  if (!temSolo && !temFolha) return '';
  const nomeNutri = paramFolha.label.replace(/ \([^)]+\)/, '');
  let html = `<div class="grafico-param grafico-misto">
    <div class="grafico-param-head">
      <div class="grafico-param-nome">${escHtml(nomeNutri)}</div>
    </div>`;
  // 1 bloco solo + 1 bloco folha
  if (temSolo) {
    const sub = renderGraficoParam(selSolo, paramSolo, 'solo', selecionadas);
    if (sub) html += `<div class="grafico-misto-sub"><div class="grafico-misto-tit">🧪 Solo (${escHtml(paramSolo.un)})</div>${sub}</div>`;
  }
  if (temFolha) {
    const sub = renderGraficoParam(selFolha, paramFolha, 'folha', selecionadas);
    if (sub) html += `<div class="grafico-misto-sub"><div class="grafico-misto-tit">🍃 Folha (${escHtml(paramFolha.un)})</div>${sub}</div>`;
  }
  html += `</div>`;
  return html;
}

// ━━━ SELETOR DE AMOSTRA (slot) ━━━
function renderSeletorItens(itens, busca) {
  const q = (busca || '').toLowerCase().trim();
  const filtrados = q
    ? itens.filter(it => (it.am.nome||'').toLowerCase().includes(q) || (it.an?.fazendaVinculada||'').toLowerCase().includes(q))
    : itens;
  if (filtrados.length === 0) {
    return '<p style="text-align:center;color:var(--c);padding:20px;">Nenhuma amostra encontrada.</p>';
  }
  // Group by fazenda
  const byFaz = new Map();
  for (const it of filtrados) {
    const faz = it.an?.fazendaVinculada || '—';
    if (!byFaz.has(faz)) byFaz.set(faz, []);
    byFaz.get(faz).push(it);
  }
  const fazendas = [...byFaz.keys()].sort((a, b) => a.localeCompare(b, 'pt'));
  let html = '';
  for (const faz of fazendas) {
    const fazItens = byFaz.get(faz);
    // Sub-group by year (safra) within fazenda
    const byAno = new Map();
    for (const it of fazItens) {
      const data = it.an?.dataLaudo || it.an?.dataEntrada || '';
      const ano = data ? data.substring(0, 4) : '—';
      if (!byAno.has(ano)) byAno.set(ano, []);
      byAno.get(ano).push(it);
    }
    const anos = [...byAno.keys()].sort((a, b) => b.localeCompare(a));
    html += `<div class="sel-faz-grupo"><div class="sel-faz-header">🏡 ${escHtml(faz)}</div>`;
    for (const ano of anos) {
      html += `<div class="sel-safra-header">📅 Safra ${escHtml(ano)}</div>`;
      for (const it of byAno.get(ano)) {
        const am = it.am, an = it.an;
        const cls = it.jaSelecionada ? 'sel-am-item ja-sel' : 'sel-am-item';
        html += `<div class="${cls}" onclick="selecionarAmostraSlot('${am._docId}')">
          <div class="sel-am-tipo ${am.tipo==='solo'?'badge-solo':'badge-folha'}">${am.tipo==='solo'?'🧪':'🍃'}</div>
          <div class="sel-am-info">
            <div class="sel-am-nome">${escHtml(am.nome)}${am.profundidade?' <span style="color:var(--c);font-weight:500;font-size:.78rem;">('+escHtml(am.profundidade)+')</span>':''}</div>
            <div class="sel-am-meta">${formatarData(an.dataLaudo||an.dataEntrada)}${an.responsavelTecnico?' · '+escHtml(an.responsavelTecnico):''}</div>
          </div>
          ${it.jaSelecionada ? '<div class="sel-am-tag">já no slot</div>' : '<div class="sel-am-arrow">›</div>'}
        </div>`;
      }
    }
    html += `</div>`;
  }
  return html;
}

window._seletorItens = [];
window.filtrarSeletorBusca = function(q) {
  const cont = document.getElementById('seletorItens');
  if (cont) cont.innerHTML = renderSeletorItens(window._seletorItens, q);
};

window.abrirSeletorAmostra = function(slotIdx) {
  window.seletorSlotAlvo = slotIdx;
  const itens = amostras.map(am => {
    const an = analises.find(x => x._docId === am.analiseId);
    return { am, an, jaSelecionada: window.slotsComparar.includes(am._docId) };
  }).filter(it => it.an);
  window._seletorItens = itens;
  const html = `<div class="sel-amostra-lista">
    <div class="sel-busca-wrap">
      <input type="search" id="seletorBusca" class="sel-busca-input" placeholder="Buscar por nome ou fazenda..." oninput="filtrarSeletorBusca(this.value)" autocomplete="off">
    </div>
    <div id="seletorItens">
      ${itens.length === 0 ? '<p style="text-align:center;color:var(--c);padding:20px;">Nenhuma amostra cadastrada.</p>' : renderSeletorItens(itens, '')}
    </div>
  </div>`;
  document.getElementById('verTitulo').textContent = `Escolher amostra · Slot ${slotIdx+1}`;
  document.getElementById('verBody').innerHTML = html;
  document.getElementById('overlayVer').classList.add('aberto');
  setTimeout(() => document.getElementById('seletorBusca')?.focus(), 120);
};

window.selecionarAmostraSlot = function(amId) {
  const slot = window.seletorSlotAlvo;
  if (slot === null) return;
  // Se já está em outro slot, remove de lá primeiro
  for (let i = 0; i < window.slotsComparar.length; i++) {
    if (window.slotsComparar[i] === amId && i !== slot) {
      window.slotsComparar[i] = null;
    }
  }
  window.slotsComparar[slot] = amId;
  window.seletorSlotAlvo = null;
  document.getElementById('overlayVer').classList.remove('aberto');
  renderComparar();
};

window.removerSlot = function(idx) {
  window.slotsComparar[idx] = null;
  renderComparar();
};

  'relacao k s': 'rel_k_s',
  'relacao k/s': 'rel_k_s',
  'relacao ca mg': 'rel_ca_mg_f',
  'relacao ca/mg': 'rel_ca_mg_f',
  'relacao ca mn': 'rel_ca_mn',
  'relacao ca/mn': 'rel_ca_mn',
  'relacao ca b': 'rel_ca_b',
  'relacao ca/b': 'rel_ca_b',
  'relacao fe mn': 'rel_fe_mn',
  'relacao fe/mn': 'rel_fe_mn'
};

// Normaliza string pra match (lowercase, sem acento, sem pontuação)
function normParam(s) {
  return String(s||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\s+/()-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

window.importarPDF = async function(event) {
  const file = event?.target?.files?.[0];
  if (!file) return;
  // Limpar input pra permitir importar mesmo arquivo de novo
  event.target.value = '';
  if (!window.pdfjsLib) {
    toast('❌ PDF.js não carregou. Verifique sua conexão.'); return;
  }
  if (!podeEditar()) { toast('⛔ Sem permissão.'); return; }
  // Mostra overlay
  const ov = document.getElementById('overlayPDF');
  const stat = document.getElementById('pdfStatus');
  ov.classList.add('aberto');
  stat.textContent = 'Lendo PDF...';
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    stat.textContent = `Processando ${pdf.numPages} página(s)...`;
    // Extrair texto+posição de todas as páginas
    const todasPaginas = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      // Cada item tem .str, .transform [a,b,c,d,e,f] onde e=x, f=y
      const items = tc.items.map(it => ({
        str: it.str,
        x: Math.round(it.transform[4]),
        y: Math.round(it.transform[5])
      })).filter(it => it.str && it.str.trim());
      todasPaginas.push(items);
    }
    stat.textContent = 'Analisando conteúdo...';
    const resultado = parsearLaudoFullin(todasPaginas);
    console.log('📄 PDF parseado:', resultado);
    ov.classList.remove('aberto');
    if (!resultado) {
      toast('❌ Não consegui identificar o formato. Verifique se é laudo Fullin.');
      return;
    }
    // Abrir formulário pré-preenchido pra revisar
    abrirFormImportado(resultado);
  } catch(e) {
    console.error('Erro ao importar PDF:', e);
    ov.classList.remove('aberto');
    toast('❌ Erro: ' + e.message);
  }
};

// ━━━ PARSER PRINCIPAL ━━━
function parsearLaudoFullin(paginas) {
  if (!paginas.length) return null;
  // Detectar tipo
  const textoCompleto = paginas.flat().map(it => it.str).join(' ').toLowerCase();
  let tipo;
  if (textoCompleto.includes('analise de solos') || textoCompleto.includes('análise de solos')) {
    tipo = 'solo';
  } else if (textoCompleto.includes('analise quimica de plantas') || textoCompleto.includes('análise química de plantas')) {
    tipo = 'folha';
  } else {
    console.warn('Tipo não detectado. Texto começa com:', textoCompleto.slice(0, 200));
    return null;
  }
  console.log('🔬 Tipo detectado:', tipo);
  // Extrair cabeçalho
  const cabecalho = extrairCabecalho(textoCompleto);
  // Processar cada página, mesclando amostras de páginas diferentes
  // Cada página tem até 4 colunas de amostras
  const amostrasMapa = {};  // nome → {nome, profundidade, protocolo, parametros}
  for (const itensPag of paginas) {
    parsearPagina(itensPag, tipo, amostrasMapa);
  }
  // Ordenar por ordem de aparição (já no objeto)
  const amostrasArray = Object.values(amostrasMapa);
  console.log(`📦 ${amostrasArray.length} amostra(s) extraída(s):`, amostrasArray.map(a=>a.nome));
  return {
    tipo,
    laboratorio: 'Fullin',
    ...cabecalho,
    amostras: amostrasArray
  };
}

// Extrai cliente, propriedade, datas, RT do texto completo
function extrairCabecalho(texto) {
  const out = {
    cliente: '',
    propriedade: '',
    dataEntrada: '',
    dataLaudo: '',
    responsavelTecnico: ''
  };
  // Cliente: depois de "CLIENTE :" até a quebra
  const mCli = texto.match(/cliente\s*:\s*([^\n]+?)(?:endereco|endereço|cpf|propriedade)/i);
  if (mCli) out.cliente = limparTexto(mCli[1]);
  // Propriedade
  const mProp = texto.match(/propriedade\s*:\s*([^\n]+?)(?:telefone|municipio|município|email|inscricao)/i);
  if (mProp) out.propriedade = limparTexto(mProp[1]);
  // Data de entrada (formato DD/MM/AAAA)
  const mDataEnt = texto.match(/data\s*de\s*entrada\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  if (mDataEnt) out.dataEntrada = converterData(mDataEnt[1]);
  // Data do laudo: "Linhares-ES,DD/MM/AAAA"
  const mDataLau = texto.match(/linhares[\s-]?es[,\s]+(\d{2}\/\d{2}\/\d{4})/i);
  if (mDataLau) out.dataLaudo = converterData(mDataLau[1]);
  // Responsável técnico: depois de "ELI ANTONIO FULLIN" ou similar (vem antes de "Responsável Técnico")
  const mRT = texto.match(/(ELI ANTONIO FULLIN|[A-ZÁÉÍÓÚÂÊÔÃÇ ]{8,40})\s*Responsável\s*Técnico/i);
  if (mRT) out.responsavelTecnico = limparTexto(mRT[1]);
  return out;
}

function limparTexto(s) {
  return String(s||'').replace(/\s+/g,' ').trim().replace(/^[:;\-\s]+/,'').replace(/[:;\-\s]+$/,'');
}
function converterData(dmy) {
  // "DD/MM/AAAA" → "AAAA-MM-DD"
  const m = dmy.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}

// ━━━ PARSEAR UMA PÁGINA ━━━
// Estratégia: agrupa items por linha (Y próximo). Identifica as linhas:
//   1. Cabeçalho de amostras (4 nomes em 4 colunas X)
//   2. Linha de protocolos (números formato XXXXX/AAAA)
//   3. Linhas de parâmetros (nome + unidade + até 4 valores)
function parsearPagina(items, tipo, amostrasMapa) {
  // Agrupar por linha (Y arredondado em buckets de ~5px)
  const linhas = {};
  for (const it of items) {
    const yKey = Math.round(it.y / 4) * 4;
    if (!linhas[yKey]) linhas[yKey] = [];
    linhas[yKey].push(it);
  }
  // Ordenar linhas por Y decrescente (no PDF, Y maior = mais alto)
  const linhasOrd = Object.keys(linhas).map(Number).sort((a,b) => b - a);
  // Encontrar linha com nomes das amostras
  // Vem depois de "IDENTIFICAÇÃO DA AMOSTRA / RESULTADO DA ANÁLISE"
  let yCabecalho = null;
  let yProtocolo = null;
  for (let i = 0; i < linhasOrd.length; i++) {
    const y = linhasOrd[i];
    const textoLinha = linhas[y].map(it=>it.str).join(' ').toLowerCase();
    if (textoLinha.includes('identificacao da amostra') || textoLinha.includes('identificação da amostra')) {
      // A linha de cabeçalho de amostras está logo abaixo
      // Pula a label "PARÂMETRO ANALISADO" / "UNIDADE" e pega a próxima
      yCabecalho = linhasOrd[i + 1] || null;
      yProtocolo = linhasOrd[i + 2] || null;
      break;
    }
  }
  if (yCabecalho === null) {
    console.warn('Cabeçalho de amostras não encontrado nesta página');
    return;
  }
  // Extrair nomes das amostras (filtra textos que não são "PARÂMETRO" ou "UNIDADE")
  const colsAmostras = [];  // [{x, nome}]
  for (const it of linhas[yCabecalho]) {
    const s = it.str.trim();
    if (!s) continue;
    const lower = s.toLowerCase();
    if (lower.includes('parametro') || lower.includes('parâmetro') ||
        lower.includes('analisado') || lower.includes('unidade') ||
        lower === 'valor adequado' || lower.includes('valor')) continue;
    colsAmostras.push({x: it.x, nome: s});
  }
  // Pode ter sido fragmentado (ex: "Area 1" + "A" + "/" + "0-20"). Mesclar items próximos no X
  const colsAgrupadas = agruparPorProximidadeX(colsAmostras);
  // No PDF de folha NÃO tem profundidade; no de solo SIM (formato "Nome / 0-20")
  const amostrasPagina = colsAgrupadas.map(c => {
    let nome = c.nome.trim();
    let profundidade = '';
    const m = nome.match(/^(.*?)\s*\/\s*(\d+[-]\d+)\s*$/);
    if (m) {
      nome = m[1].trim();
      profundidade = m[2];
    }
    return {x: c.x, nome, profundidade};
  });
  console.log('📋 Amostras nesta página:', amostrasPagina);
  // Extrair protocolos (linha abaixo) - números no formato XXXXX/AAAA
  if (yProtocolo !== null && linhas[yProtocolo]) {
    const protos = linhas[yProtocolo].filter(it => /^\d{3,6}\/?\d{0,4}$/.test(it.str.trim()));
    // Match por proximidade de X
    for (const a of amostrasPagina) {
      const p = protos.find(pr => Math.abs(pr.x - a.x) < 30);
      if (p) a.protocolo = p.str.trim();
    }
  }
  // Adicionar/mesclar no amostrasMapa
  amostrasPagina.forEach(a => {
    const chave = `${a.nome}__${a.profundidade}`;
    if (!amostrasMapa[chave]) {
      amostrasMapa[chave] = {
        nome: a.nome,
        profundidade: a.profundidade,
        protocolo: a.protocolo || '',
        parametros: {},
        _xPagina: a.x  // pra usar como referência de coluna nesta página
      };
    } else {
      amostrasMapa[chave]._xPagina = a.x;  // atualiza X pra esta página
      if (a.protocolo) amostrasMapa[chave].protocolo = a.protocolo;
    }
  });
  // Agora processa cada linha que vem ABAIXO do protocolo: nome do parâmetro + unidade + valores
  const yInicioParams = yProtocolo !== null ? yProtocolo - 1 : yCabecalho - 1;
  for (const y of linhasOrd) {
    if (y >= yInicioParams) continue;  // ainda não chegou nos parâmetros
    parsearLinhaParametro(linhas[y], tipo, amostrasPagina, amostrasMapa);
  }
}

// Agrupar items que estão próximos no X em "colunas" únicas (pra cabeçalhos fragmentados)
function agruparPorProximidadeX(items) {
  if (!items.length) return [];
  // Ordena por X
  const ord = [...items].sort((a,b)=>a.x - b.x);
  const grupos = [];
  let atual = {x: ord[0].x, nome: ord[0].nome, items:[ord[0]]};
  for (let i = 1; i < ord.length; i++) {
    const item = ord[i];
    // Se está perto do anterior, mescla
    const ultimoX = atual.items[atual.items.length-1].x;
    if (item.x - ultimoX < 50) {
      atual.nome += ' ' + item.nome;
      atual.items.push(item);
    } else {
      grupos.push(atual);
      atual = {x: item.x, nome: item.nome, items:[item]};
    }
  }
  grupos.push(atual);
  return grupos.map(g => ({x: g.x, nome: g.nome.trim()}));
}

// Parsear UMA linha de parâmetro: extrai nome+unidade+valores
function parsearLinhaParametro(itensLinha, tipo, amostrasPagina, amostrasMapa) {
  if (!itensLinha || !itensLinha.length) return;
  // Ordenar por X
  const ord = [...itensLinha].sort((a,b)=>a.x - b.x);
  // Estratégia simplificada: o nome do parâmetro está no início (X baixo);
  // a unidade vem logo depois; depois vêm os valores numéricos.
  // Vamos separar:
  // - items com X < 200 = parte do nome do parâmetro
  // - items com 200 <= X < 300 = unidade
  // - items com X >= 300 = valores (cada um numa coluna de amostra)
  // OBS: esses cortes em X dependem do layout. Vou usar abordagem mais robusta:
  //      identificar o primeiro número que parece valor (não data, não fragmento de unidade).
  // Concatenar nome do parâmetro: tudo até o primeiro item que comece com dígito (e seja um número plausível)
  let nomeBuffer = [];
  let valores = [];  // {x, val}
  for (const it of ord) {
    const s = it.str.trim();
    if (!s) continue;
    // Tenta interpretar como número
    const numStr = s.replace(/\./g, '').replace(',', '.'); // brasileiro: 1.234,56 → 1234.56
    const num = parseFloat(numStr);
    const ehNumPuro = /^-?\d+(?:[.,]\d+)?$/.test(s.replace(/\s/g,'')) ||
                       /^-?\d+(?:[.,]\d+)?(\s|$)/.test(s);
    if (ehNumPuro && !isNaN(num)) {
      valores.push({x: it.x, val: num});
    } else {
      // Se já temos valores e aparece texto, é continuação fora da linha ou ruído. Ignora.
      if (valores.length > 0) continue;
      nomeBuffer.push(s);
    }
  }
  if (!nomeBuffer.length || !valores.length) return;
  // O nomeBuffer inclui o nome do parâmetro + (possivelmente) a unidade
  const textoLinhaBruto = nomeBuffer.join(' ');
  const paramId = matchParametro(textoLinhaBruto, tipo);
  if (!paramId) {
    // Não conseguiu identificar — ignora silenciosamente
    return;
  }
  // Atribuir cada valor à amostra mais próxima por X
  for (const v of valores) {
    let melhor = null;
    let menorDist = Infinity;
    for (const a of amostrasPagina) {
      const d = Math.abs(v.x - a.x);
      if (d < menorDist) {
        menorDist = d;
        melhor = a;
      }
    }
    if (melhor && menorDist < 80) {  // tolerância
      const chave = `${melhor.nome}__${melhor.profundidade}`;
      const amostraDestino = amostrasMapa[chave];
      if (amostraDestino) {
        amostraDestino.parametros[paramId] = v.val;
      }
    }
  }
}

// Match aproximado de nome de parâmetro → id interno
function matchParametro(texto, tipo) {
  const mapa = tipo === 'solo' ? MAPA_PARAM_FULLIN_SOLO : MAPA_PARAM_FULLIN_FOLHA;
  const norm = normParam(texto);
  // Match exato primeiro
  if (mapa[norm]) return mapa[norm];
  // Tenta remover sufixo de unidade comum (mg/dm3, cmolc/dm3, etc.)
  const semUni = norm.replace(/\b(mg|cmolc|cmol|dag|g|kg|mol|dm3|cm3|l|%)\b/g, '').replace(/\s+/g,' ').trim();
  if (mapa[semUni]) return mapa[semUni];
  // Match por inclusão (parâmetro é prefix do texto)
  for (const [chave, id] of Object.entries(mapa)) {
    if (norm.startsWith(chave)) return id;
    if (norm.includes(chave) && chave.length > 5) return id;
  }
  return null;
}

// ━━━ ABRIR FORMULÁRIO PRÉ-PREENCHIDO ━━━
function abrirFormImportado(dados) {
  if (!podeEditar()) { toast('⛔ Sem permissão.'); return; }

  let fazendaMatch = '';
  if (dados.propriedade) {
    const propNorm = normalizar(dados.propriedade);
    fazendaMatch = fazendas.find(f => normalizar(f) === propNorm) || '';
    if (!fazendaMatch) {
      fazendaMatch = fazendas.find(f => normalizar(f).includes(propNorm) || propNorm.includes(normalizar(f))) || '';
    }
  }
  // Monta formWIP a partir dos dados parseados
  window.formWIP = {
    tipo: dados.tipo,
    laboratorio: dados.laboratorio || 'Fullin',
    cliente: dados.cliente || '',
    propriedade: dados.propriedade || '',
    fazendaVinculada: fazendaMatch,
    dataEntrada: dados.dataEntrada || hoje(),
    dataLaudo: dados.dataLaudo || hoje(),
    responsavelTecnico: dados.responsavelTecnico || '',
    observacoes: '',
    importadoDe: 'pdf_fullin',
    amostras: dados.amostras.map(a => ({
      nome: a.nome,
      profundidade: a.profundidade || '',

      vincStatus: 'pendente',

    })),

  document.getElementById('modalTitulo').textContent = '📄 Revisar dados do PDF';
  renderFormAnalise();

  const banner = document.createElement('div');

  const totalParams = window.formWIP.amostras.reduce((s,a)=>s+Object.keys(a.parametros||{}).length, 0);
  banner.innerHTML = `📄 <strong>PDF importado!</strong> ${window.formWIP.amostras.length} amostra(s), ${totalParams} valor(es) extraídos.<br>

// Sugestão de vínculo por similaridade de nome
function sugerirTalhao(nomeAmostra) {
  if (!nomeAmostra) return null;
  const n = normalizar(nomeAmostra);
  // Match exato
  let achado = talhoes.find(t => normalizar(t.nome) === n || normalizar(t.id) === n);
  if (achado) return {talhao: achado, exato: true};
  // Match parcial (contém)
  achado = talhoes.find(t => normalizar(t.nome).includes(n) || n.includes(normalizar(t.nome)));
  if (achado) return {talhao: achado, exato: false};
  return null;
}

    // Parâmetros (agrupados, colapsáveis)

  window.formWIP.amostras.forEach(a => { a.parametros = {}; });

};

window.removerAmostra = function(idx) {
  const am = window.formWIP.amostras[idx];
  if (am._docId) window.formWIP.amostrasRemovidas.push(am._docId);
  window.formWIP.amostras.splice(idx, 1);
  if (!window.formWIP.amostras.length) window.formWIP.amostras.push(criarAmostraVazia());
  renderAmostras();
};
window.setAmCampo = function(idx, campo, valor) {
  window.formWIP.amostras[idx][campo] = valor;
  if (campo === 'nome') {
    // Re-render só pra atualizar a sugestão de vínculo
    renderAmostras();
  }

window.setParam = function(idx, paramId, valor) {
  const am = window.formWIP.amostras[idx];
  if (!am.parametros) am.parametros = {};
  const n = parseDose(valor);
  if (valor === '' || n === null) delete am.parametros[paramId];
  else am.parametros[paramId] = n;
};
window.setVinculo = function(idx, talhaoId) {
  window.formWIP.amostras[idx].talhaoIdVinculado = talhaoId;

window.confirmarVinculo = function(idx) {
  const am = window.formWIP.amostras[idx];
  // Se tem sugestão e o select dela já está apontando, pega
  const sug = sugerirTalhao(am.nome);
  if (sug && !am.talhaoIdVinculado) am.talhaoIdVinculado = sug.talhao.id;
  am.vincStatus = 'confirmado';
  renderAmostras();
};

window.salvarAnalise = async function() {
  if (!window.formWIP) return;
  if (!window.formWIP.fazendaVinculada) { toast('⚠️ Selecione a fazenda.'); return; }
  if (!window.formWIP.dataLaudo && !window.formWIP.dataEntrada) { toast('⚠️ Informe ao menos uma data.'); return; }
  const amostrasValidas = window.formWIP.amostras.filter(a => a.nome && a.nome.trim());
  if (!amostrasValidas.length) { toast('⚠️ Cadastre ao menos uma amostra com nome.'); return; }
  const btn = document.getElementById('btnSalvarAnalise');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const docAnalise = {
      tipo: window.formWIP.tipo,
      laboratorio: window.formWIP.laboratorio || '',
      cliente: window.formWIP.cliente || '',
      propriedade: window.formWIP.propriedade || '',
      fazendaVinculada: window.formWIP.fazendaVinculada,
      dataEntrada: window.formWIP.dataEntrada || '',
      dataLaudo: window.formWIP.dataLaudo || '',
      responsavelTecnico: window.formWIP.responsavelTecnico || '',
      observacoes: window.formWIP.observacoes || '',
      importadoDe: 'manual',
      atualizadoEm: new Date().toISOString(),
      atualizadoPor: usuarioAtual.email
    };
    let analiseId;
    if (editandoId) {
      await updateDoc(doc(db,'analises',editandoId), docAnalise);
      analiseId = editandoId;
    } else {
      docAnalise.criadoEm = new Date().toISOString();
      docAnalise.criadoPor = usuarioAtual.email;
      const ref = await addDoc(collection(db,'analises'), docAnalise);
      analiseId = ref.id;
    }
    // Amostras removidas
    for (const docId of (window.formWIP.amostrasRemovidas||[])) {
      try { await deleteDoc(doc(db,'amostras',docId)); } catch(e) { console.warn(e); }
    }
    // Amostras (criar ou atualizar)
    for (let i = 0; i < amostrasValidas.length; i++) {
      const a = amostrasValidas[i];
      const docAm = {
        analiseId,
        ordem: i,
        nome: a.nome.trim(),
        profundidade: a.profundidade || '',
        protocolo: a.protocolo || '',
        tipo: window.formWIP.tipo,
        fazendaVinculada: window.formWIP.fazendaVinculada,
        talhaoIdVinculado: a.talhaoIdVinculado || null,
        vincStatus: a.talhaoIdVinculado ? 'confirmado' : 'pendente',
        parametros: a.parametros || {},
        atualizadoEm: new Date().toISOString()
      };
      if (a._docId) {
        await updateDoc(doc(db,'amostras',a._docId), docAm);
      } else {
        docAm.criadoEm = new Date().toISOString();
        await addDoc(collection(db,'amostras'), docAm);
      }
    }
    try {
      await addDoc(collection(db,'logs'), {
        tipo: 'analise',
        mensagem: `${usuarioAtual.email} ${editandoId?'editou':'criou'} análise de ${window.formWIP.tipo} (${window.formWIP.fazendaVinculada}, ${amostrasValidas.length} amostras)`,
        criadoEm: new Date().toISOString(),
        uid: usuarioAtual.uid
      });
    } catch(e) {}
    toast(`✅ Análise ${editandoId?'atualizada':'criada'}!`);
    fecharModalAnalise();
  } catch(e) {
    console.error(e);
    toast('❌ Erro: '+e.message);
  }
  btn.disabled = false; btn.textContent = '💾 Salvar';
};

// ━━━━━━━━━━ EXCLUIR ━━━━━━━━━━
window.excluirAnalise = async function(id) {
  if (!isAdmin()) { toast('⛔ Só admin pode excluir.'); return; }
  const an = analises.find(x => x._docId === id);
  if (!an) return;
  const amos = amostras.filter(x => x.analiseId === id);
  if (!confirm(`Excluir análise de ${an.fazendaVinculada || an.propriedade} (${formatarData(an.dataLaudo)}) e suas ${amos.length} amostra(s)?\n\nEsta ação não pode ser desfeita.`)) return;
  try {
    for (const a of amos) {
      await deleteDoc(doc(db,'amostras',a._docId));
    }
    await deleteDoc(doc(db,'analises',id));
    try {
      await addDoc(collection(db,'logs'), {
        tipo:'analise', mensagem:`${usuarioAtual.email} excluiu análise (${an.fazendaVinculada}, ${formatarData(an.dataLaudo)})`,
        criadoEm: new Date().toISOString(), uid: usuarioAtual.uid
      });
    } catch(e) {}
    toast('🗑 Análise excluída.');
  } catch(e) {
    console.error(e);
    toast('❌ Erro: '+e.message);
  }
};

// ━━━━━━━━━━ VISUALIZAÇÃO ━━━━━━━━━━
window.verAnalise = function(id) {
  const an = analises.find(x => x._docId === id);
  if (!an) { toast('❌ Análise não encontrada.'); return; }
  const amos = amostras.filter(x => x.analiseId === id).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const params = PARAMS[an.tipo];
  const grupos = {};
  params.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });
  const isSolo = an.tipo === 'solo';
  document.getElementById('verTitulo').textContent = `${isSolo?'🧪':'🍃'} ${an.fazendaVinculada || an.propriedade || 'Análise'}`;
  let html = `
    <!-- Cabeçalho -->
    <div class="detalhe-secao">
      <div class="detalhe-secao-body">
        <div style="font-size:.8rem;color:var(--c);line-height:1.6;">
          📅 <strong style="color:var(--ve);">Laudo:</strong> ${formatarData(an.dataLaudo)} · <strong style="color:var(--ve);">Coleta:</strong> ${formatarData(an.dataEntrada)}<br>
          🔬 <strong style="color:var(--ve);">Laboratório:</strong> ${escHtml(an.laboratorio||'—')}${an.responsavelTecnico?' · '+escHtml(an.responsavelTecnico):''}<br>
          🏡 <strong style="color:var(--ve);">Fazenda:</strong> ${escHtml(an.fazendaVinculada||'—')}${an.propriedade && an.propriedade !== an.fazendaVinculada?' ('+escHtml(an.propriedade)+')':''}<br>
          📦 <strong style="color:var(--ve);">Amostras:</strong> ${amos.length}
          ${an.observacoes?'<br>💬 <em>'+escHtml(an.observacoes)+'</em>':''}
        </div>
      </div>
    </div>`;
  // Toggle textura (só relevante pra solo)
  if (isSolo) {
    html += `<div class="textura-box">
      <label>Textura do solo (afeta P-Mehlich):</label>
      <select onchange="window.texturaAtiva=this.value;verAnalise('${id}')">
        ${TEXTURAS.map(t => `<option value="${t.id}" ${window.texturaAtiva===t.id?'selected':''}>${t.label}</option>`).join('')}
      </select>
    </div>`;
  }
  // Cada amostra
  amos.forEach(am => {
    const talVinc = am.talhaoIdVinculado ? talhoes.find(t => t.id === am.talhaoIdVinculado) : null;
    let linhasHtml = '';
    Object.entries(grupos).forEach(([nomeGrupo, lista]) => {
      const linhasDoGrupo = lista.map(p => {
        const val = am.parametros?.[p.id];
        if (val === undefined || val === null) {
          return `<tr><td class="par-lab">${escHtml(p.label)}</td><td class="par-val" style="color:var(--t4);">—</td><td class="par-un">${escHtml(p.un)}</td><td><span class="par-class cls-ne">—</span></td></tr>`;
        }
        const c = classificar(p, val, an.tipo, isSolo ? window.texturaAtiva : null);
        return `<tr>
          <td class="par-lab">${escHtml(p.label)}</td>
          <td class="par-val">${fmt(val, val < 10 ? 2 : (val < 100 ? 1 : 0))}</td>
          <td class="par-un">${escHtml(p.un)}</td>
          <td><span class="par-class cls-${c.cls}">${escHtml(c.label)}</span></td>
        </tr>`;
      }).join('');
      if (linhasDoGrupo) {
        linhasHtml += `<tr><td colspan="4" style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;color:var(--c);text-transform:uppercase;letter-spacing:.04em;padding:9px 4px 4px;">${escHtml(nomeGrupo)}</td></tr>${linhasDoGrupo}`;
      }
    });
    html += `<div class="detalhe-secao">
      <div class="detalhe-secao-head">
        <div class="amostra-bloco-titulo">
          <span>📦 ${escHtml(am.nome)}${am.profundidade?' <span style="color:var(--c);font-weight:600;font-size:.78rem;">('+escHtml(am.profundidade)+' cm)</span>':''}</span>
          ${am.protocolo?`<span class="amostra-protocolo">${escHtml(am.protocolo)}</span>`:''}
        </div>
        ${talVinc?`<div class="detalhe-secao-sub">🔗 Talhão: <strong>${escHtml(talVinc.nome||talVinc.id)}</strong></div>`:'<div class="detalhe-secao-sub" style="color:#92400e;">⚠️ Sem vínculo com talhão</div>'}
      </div>
      <div class="detalhe-secao-body" style="padding:8px 11px;">
        <table class="tbl-param">${linhasHtml}</table>
      </div>
    </div>`;
  });
  document.getElementById('verBody').innerHTML = html;
  document.getElementById('overlayVer').classList.add('aberto');
};


</script>
