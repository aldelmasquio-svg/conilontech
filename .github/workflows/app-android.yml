# Gera o app Android (APK) do Conilon Tech: uma casca Capacitor (pasta app/) que abre o site
# publicado no GitHub Pages. Em push na main, publica o APK no release "app-android"
# (link fixo para baixar/mandar pelo WhatsApp); em outras branches, só como artefato do run.
# Assinatura: com os secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD o APK sai com a
# chave definitiva (atualizações instalam por cima); sem eles, com a chave de teste do runner.
name: App Android (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependências e sync do Capacitor
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Chave de assinatura (se configurada)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KS != ''
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/conilon.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/conilon.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/conilon-tech.apk"
          if [ -z "$ANDROID_KEYSTORE_PATH" ]; then echo "::warning::APK assinado com a chave de TESTE (configure os secrets ANDROID_KEYSTORE_*)"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: conilon-tech-apk
          path: conilon-tech.apk

      - name: Publicar no release "app-android"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-android >/dev/null 2>&1 || gh release create app-android --title "App Android" --latest=false \
            --notes "APK do Conilon Tech para Android. Baixe o arquivo conilon-tech.apk abaixo e abra no celular (permita instalar de fontes desconhecidas)."
          gh release upload app-android conilon-tech.apk --clobber
