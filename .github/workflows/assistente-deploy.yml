name: Assistente Telegram — publicar no Cloudflare

# Publica o Worker de assistente/ quando ele muda no main (ou manualmente).
# Sem os segredos CLOUDFLARE_* configurados, o job só avisa e termina sem erro.
on:
  push:
    branches: [main]
    paths:
      - 'assistente/**'
      - '.github/workflows/assistente-deploy.yml'
  workflow_dispatch:

concurrency:
  group: assistente-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar configuração
        id: cfg
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN não configurado — assistente não publicado (veja assistente/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assistente/package-lock.json

      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'
        working-directory: assistente

      - name: Publicar Worker + segredos
        if: steps.cfg.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: assistente
          secrets: |
            TELEGRAM_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            TELEGRAM_USUARIOS
            ANTHROPIC_API_KEY
            FIREBASE_SERVICE_ACCOUNT
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_USUARIOS: ${{ secrets.TELEGRAM_USUARIOS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
