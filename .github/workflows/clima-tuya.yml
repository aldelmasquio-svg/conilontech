name: Clima — coletor Tuya (Estação Km 18)

# Fonte: conta Smart Life se houver login salvo (workflow clima-login.yml);
# senão Tuya IoT Core (TUYA_ACCESS_ID/SECRET). Ver clima/README.md.

on:
  schedule:
    # A cada 5 min, deslocado 2 min (…:02, :07, :12…) para fugir do pico de
    # agendamentos em minutos "redondos" no GitHub.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Só diagnóstico (lê a estação e imprime; não grava dados)'
        type: boolean
        default: false

# Uma execução por vez; a próxima espera a atual terminar (sem sobreposição).
concurrency:
  group: clima-tuya
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clima/requirements.txt

      - run: pip install -r clima/requirements.txt

      - name: Coletar estação → Firestore
        run: python clima/coletor.py
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DIAGNOSTICO: ${{ inputs.diagnostico }}
