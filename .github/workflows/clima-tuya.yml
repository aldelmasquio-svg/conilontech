name: Clima — coletor Tuya (Estação Km 18)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Só diagnóstico (lê a Tuya e imprime; não grava no Firestore)'
        type: boolean
        default: false

# Uma execução por vez; a próxima espera a atual terminar (sem sobreposição).
concurrency:
  group: clima-tuya
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clima/requirements.txt

      - run: pip install -r clima/requirements.txt

      - name: Coletar Tuya → Firestore
        run: python clima/coletor.py
        env:
          TUYA_ACCESS_ID: ${{ secrets.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DIAGNOSTICO: ${{ inputs.diagnostico }}
