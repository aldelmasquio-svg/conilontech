name: Clima — coletor Tuya (Estação Km 18)
# BRANCH TEMPORÁRIA DE TESTE — só chamadas à API do INMET (sem secrets, sem Firestore).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-inmet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar apitempo.inmet.gov.br
        run: |
          set +e
          for u in \
            "https://apitempo.inmet.gov.br/estacao/2026-09-20/2026-09-21/A616" \
            "https://apitempo.inmet.gov.br/estacao/dados/2026-09-21" \
            "https://apitempo.inmet.gov.br/estacoes/T" ; do
            echo "=================== $u"
            curl -sS -m 60 -D /tmp/h -o /tmp/b -w "HTTP %{http_code} | %{size_download} bytes | %{time_total}s\n" -A "Mozilla/5.0 conilontech-teste" "$u"
            echo "--- headers"; head -15 /tmp/h
            echo "--- corpo (início)"; head -c 1500 /tmp/b; echo
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/b'))
              if isinstance(d,list) and d:
                  print("JSON lista, itens:",len(d)); print("campos:",sorted(d[0].keys()))
                  a=[x for x in d if isinstance(x,dict) and x.get('CD_ESTACAO')=='A616']
                  if a: print("A616 exemplo:", json.dumps(a[0],ensure_ascii=False)[:800])
                  if isinstance(d[0],dict) and 'RAD_GLO' in d[0]:
                      for x in d[:30]: print(x.get('DT_MEDICAO'),x.get('HR_MEDICAO'),'RAD',x.get('RAD_GLO'),'T',x.get('TEM_INS'),'UR',x.get('UMD_INS'),'CHUVA',x.get('CHUVA'),'VEN',x.get('VEN_VEL'))
              else: print("JSON tipo", type(d).__name__, str(d)[:300])
          except Exception as e: print("não é JSON:", e)
          PY
          done
